name: Bootstrap kernel source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source snapshot
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.bootstrap/pskernel-source.patch
          TMP_PATCH=/tmp/pskernel-source.patch
          if [[ -f "$PATCH" ]]; then
            cp "$PATCH" "$TMP_PATCH"
          elif compgen -G ".bootstrap/parts/part-*" > /dev/null; then
            cat .bootstrap/parts/part-* > "$TMP_PATCH"
          else
            echo "No bootstrap patch or patch parts present; nothing to do."
            exit 0
          fi
          git apply --index "$TMP_PATCH"
          if [[ -f "$PATCH" ]]; then git rm "$PATCH"; fi
          if [[ -d .bootstrap/parts ]]; then git rm -r .bootstrap/parts; fi
          rmdir .bootstrap 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "import: Lean 4.34 TypeScript kernel snapshot"
          git push origin HEAD:main
