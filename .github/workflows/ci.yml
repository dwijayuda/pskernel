name: TypeScript kernel CI

on:
  push:
    branches: [main, kernel/lean434-study-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run kernel tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-test.log
      - name: Run anti-drift
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/anti-drift.mjs 2>&1 | tee ci-anti-drift.log
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ci-diagnostics
          path: |
            ci-test.log
            ci-anti-drift.log
