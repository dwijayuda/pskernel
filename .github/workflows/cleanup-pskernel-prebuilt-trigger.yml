name: Finalize PSC2 Lean kernel prebuilt workflow

on:
  push:
    branches:
      - psc2/pskernel-lean-provider
    paths:
      - .github/workflows/cleanup-pskernel-prebuilt-trigger.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/pskernel-lean-provider
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove one-shot prebuilt trigger
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/psc2-lean-kernel-prebuilt.yml')
          lines = path.read_text().splitlines(keepends=True)

          marker = '# one-shot native matrix attempt 4\n'
          if marker not in lines:
              raise SystemExit('one-shot marker not found')
          lines.remove(marker)

          trigger = [
              '  push:\n',
              '    branches:\n',
              '      - psc2/pskernel-lean-provider\n',
              '    paths:\n',
              '      - .github/workflows/psc2-lean-kernel-prebuilt.yml\n',
          ]
          trigger_index = next(
              (index for index in range(len(lines)) if lines[index:index + len(trigger)] == trigger),
              None,
          )
          if trigger_index is None:
              raise SystemExit('temporary prebuilt push trigger not found')
          del lines[trigger_index:trigger_index + len(trigger)]

          conditional = [
              '          if [[ "$GITHUB_EVENT_NAME" == \'workflow_dispatch\' ]]; then\n',
              '            node packages/pskernel-lean/scripts/prebuilt-workflow.test.mjs\n',
              '          fi\n',
          ]
          conditional_index = next(
              (index for index in range(len(lines)) if lines[index:index + len(conditional)] == conditional),
              None,
          )
          if conditional_index is None:
              raise SystemExit('temporary conditional contract gate not found')
          lines[conditional_index:conditional_index + len(conditional)] = [
              '          node packages/pskernel-lean/scripts/prebuilt-workflow.test.mjs\n',
          ]

          path.write_text(''.join(lines))
          PY

          node psc15selfhost/packages/pskernel-lean/scripts/prebuilt-workflow.test.mjs
          git diff --check

      - name: Commit final manual-only workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-pskernel-prebuilt-trigger.yml
          git add .github/workflows/psc2-lean-kernel-prebuilt.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(psc2): make prebuilt distribution manual-only'
          git push origin HEAD:psc2/pskernel-lean-provider
