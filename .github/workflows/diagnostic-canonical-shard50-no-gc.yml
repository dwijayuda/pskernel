name: Diagnostic canonical shard50 no-GC

on:
  push:
    branches: [diagnostic/canonical-shard50-no-gc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Time-box shard50 natural-GC replay to 180 seconds
        shell: bash
        env:
          PSKERNEL_STD_HEAP_MIB: "5632"
        run: |
          set +e
          timeout --signal=TERM 180s npm run oracle:std-full
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "SHARD50_NO_GC_180S_TIMEBOX_REACHED"
            exit 0
          fi
          exit "$code"
