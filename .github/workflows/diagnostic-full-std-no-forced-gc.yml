name: Diagnostic Full Std without forced GC

on:
  push:
    branches: [diagnostic/full-std-no-forced-gc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  std:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Canonical Full Std without forced per-shard GC
        env:
          PSKERNEL_STD_HEAP_MIB: "5632"
        run: npm run oracle:std-full
