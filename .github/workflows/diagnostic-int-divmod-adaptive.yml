name: Diagnostic Int.DivMod adaptive replay
# trigger: int-divmod-adaptive-v1

on:
  push:
    branches: [diagnostic/int-divmod-adaptive]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Adaptive replay Int.DivMod.Lemmas roots
        env:
          PSKERNEL_WORKER_TIMEOUT_MS: "45000"
          PSKERNEL_WORKER_HEAP_MIB: "3072"
          PSKERNEL_MAX_BATCH_BYTES: "67108864"
        run: node scripts/adaptive-root-oracle.mjs Std 114029 22197 957 50 1
