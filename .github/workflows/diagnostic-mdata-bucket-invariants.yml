name: Diagnostic MData bucket invariants

on:
  push:
    branches: [diagnostic/mdata-bucket-invariants]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          lean_dir="$(dirname "$lean_bin")"
          echo "LEAN434_BIN=$lean_dir" >> "$GITHUB_ENV"
          echo "$lean_dir" >> "$GITHUB_PATH"
      - name: Check bucket invariants
        run: "$LEAN434_BIN/lean" --run oracle/replay-probe/MDataBucketInvariant.lean
