name: Diagnostic MData exporter equivalence
# trigger: safe-mdata-bucket-v1

on:
  push:
    branches: [diagnostic/mdata-bucket-export]
    paths:
      - ".github/workflows/diagnostic-mdata-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          lean_dir="$(dirname "$lean_bin")"
          echo "LEAN434_BIN=$lean_dir" >> "$GITHUB_ENV"
          echo "$lean_dir" >> "$GITHUB_PATH"
      - name: Verify frozen baseline blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object oracle/replay-probe/DependencyExportBaseline.lean)" = "5cf4c55a1959e18300989032243b0db615f7107f"
      - name: Compare representative export bytes
        shell: bash
        run: |
          set -euo pipefail
          "$LEAN434_BIN/lean" --run oracle/replay-probe/DependencyExportBaseline.lean Std --root-range 22557 32 > /tmp/baseline.ndjson
          "$LEAN434_BIN/lean" --run oracle/replay-probe/DependencyExport.lean Std --root-range 22557 32 > /tmp/bucketed.ndjson
          cmp /tmp/baseline.ndjson /tmp/bucketed.ndjson
          wc -c /tmp/baseline.ndjson
