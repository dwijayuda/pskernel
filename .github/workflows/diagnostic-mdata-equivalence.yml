name: Diagnostic MData exporter equivalence

on:
  push:
    branches: [diagnostic/mdata-bucket-export]
    paths:
      - ".github/workflows/diagnostic-mdata-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - name: Materialize baseline exporter
        shell: bash
        run: |
          set -euo pipefail
          git show b1026742d2d76306323abab3d7534403a37e25d2:oracle/replay-probe/DependencyExport.lean > /tmp/DependencyExportBaseline.lean
      - name: Compare representative export bytes
        shell: bash
        run: |
          set -euo pipefail
          "$LEAN434_BIN/lean" --run /tmp/DependencyExportBaseline.lean Std --root-range 22557 32 > /tmp/baseline.ndjson
          "$LEAN434_BIN/lean" --run oracle/replay-probe/DependencyExport.lean Std --root-range 22557 32 > /tmp/bucketed.ndjson
          cmp /tmp/baseline.ndjson /tmp/bucketed.ndjson
          wc -c /tmp/baseline.ndjson
