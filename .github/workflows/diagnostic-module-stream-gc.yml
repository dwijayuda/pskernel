name: Diagnostic module-stream GC cadence

on:
  push:
    branches: [diagnostic/module-stream-gc-cadence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Canonical prefix through shard 2400 with sparse forced GC
        env:
          PSKERNEL_STD_HEAP_MIB: "5632"
          PSKERNEL_GC_EVERY_SHARDS: "250"
          PSKERNEL_DIAG_STOP_AFTER_SHARDS: "2400"
        run: npm run oracle:std-full
