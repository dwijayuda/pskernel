name: Diagnostic no-GC trace GC

on:
  push:
    branches: [diagnostic/no-gc-trace-gc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Trace natural GC for 150 seconds
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 150s node --trace-gc --expose-gc --max-old-space-size=5632 --stack-size=65500 scripts/module-stream-oracle-no-gc.mjs Std 114029
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "TRACE_GC_TIMEBOX_REACHED"
            exit 0
          fi
          exit "$code"
