name: PSC1 cancel superseded exact qualification
on:
  push:
    branches: [diagnostic/psc1-unified-v2-profile-20261025]
    paths: [.github/workflows/diagnostic-psc1-cancel-superseded-v2.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the exact obsolete v2 request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import os,json,urllib.request,time
          base='https://api.github.com/repos/dwijayuda/pskernel/actions/runs/40125830600'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def read():
              with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as r:return json.load(r)
          r=read()
          assert r['head_sha']=='e23afbdf72adcf6e67bbb4a34355449432127636'
          assert r['head_branch']=='qualification/psc1-unified-v2-20261025'
          assert r['path']=='.github/workflows/psc1-unified-selfhost.yml'
          assert r['event']=='push'
          if r['status']!='completed':
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel',headers=headers,data=b'',method='POST')) as response:
                  assert response.status==202
          for _ in range(12):
              r=read()
              if r['status']=='completed':break
              time.sleep(5)
          print('PSC1_SUPERSEDED_QUALIFICATION: '+json.dumps({k:r[k] for k in ['id','head_sha','head_branch','status','conclusion']}))
          # Cancellation is asynchronous; accepted request and later terminal readback are distinct.
          PY
