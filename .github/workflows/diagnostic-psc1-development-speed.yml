name: PSC1 installed development latency
on:
  push:
    branches: [feat/psc1-development-speed-20261029]
    paths:
      - .github/scripts/psc1-development-baseline.mjs
      - .github/workflows/diagnostic-psc1-development-speed.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-cross-platform-package
          run-id: 40814345252
          github-token: ${{ github.token }}
          path: psc1/dist/development-input
      - uses: actions/download-artifact@v4
        with:
          name: psc1-typescript-linux-x64
          run-id: 40814345252
          github-token: ${{ github.token }}
          path: psc1/dist/development-typescript
      - run: |
          mkdir -p dist/development-profile
          node ../.github/scripts/psc1-development-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-development-baseline-${{ github.sha }}
          path: psc1/dist/development-profile/
          retention-days: 30
