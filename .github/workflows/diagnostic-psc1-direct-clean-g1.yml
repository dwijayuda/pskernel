name: PSC1 direct independent clean G1 rebuild
on:
  push:
    branches: [diagnostic/psc1-direct-clean-g1-20261024]
    paths: [.github/diagnostics/psc1-direct-g1-rebuild.json]
permissions:
  contents: read
  actions: read
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: js
            artifact: '12548433615'
          - target: wasm-core
            artifact: '12549160290'
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify exact qualified run, job and immutable artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PSC1_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('../.github/diagnostics/psc1-direct-g1-rebuild.json'));
          const e=r.targets.find(e=>e.target===process.env.PSC1_TARGET);assert.ok(e);
          const get=async route=>{
            const x=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+route,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            assert.equal(x.status,200);return await x.json();
          };
          const run=await get('/actions/runs/'+r.qualifiedRunId);
          assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.head_sha,r.qualifiedCommit);
          const job=await get('/actions/jobs/'+e.jobId);assert.equal(job.run_id,r.qualifiedRunId);
          assert.equal(job.status,'completed');assert.equal(job.conclusion,'success');assert.equal(job.name,'qualify ('+e.target+')');
          const artifact=await get('/actions/artifacts/'+e.artifactId);assert.equal(artifact.workflow_run.id,r.qualifiedRunId);
          assert.equal(artifact.workflow_run.head_sha,r.qualifiedCommit);assert.equal(artifact.digest,e.artifactDigest);assert.equal(artifact.expired,false);
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '40062120079'
          artifact-ids: ${{ matrix.artifact }}
          path: baseline/${{ matrix.target }}
      - name: Install official pinned toolchain and locked dependencies
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          npm ci --prefix .. --ignore-scripts --include=optional
      - name: Install SHA256-pinned owned Wasm validator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-bin" "$RUNNER_TEMP/wasm-tools"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz' -o "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "d0efb16c9c859137b7ab3e99151c299cd47caee106ed4594561002f7a04945bd  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-tools" -type f -name wasm-tools -print -quit)" "$RUNNER_TEMP/psc1-bin/wasm-tools"
          echo "$RUNNER_TEMP/psc1-bin" >> "$GITHUB_PATH"
      - name: Build native seed and independent checker without any lake cache
        run: |
          set -euo pipefail
          test ! -d .lake/build
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1_target_service_seed psc1_independent_checker
      - name: Execute independently checked clean G1 and all positive and negative cases
        env:
          PSC1_BRANCH_HEAD: ${{ github.sha }}
        run: node scripts/generated-target-qualification.mjs ${{ matrix.target }} --g1-only correctness-1800s
      - name: Compare exact compiler bytes and admission IR observations with qualified G1 G2 G3
        run: node ../.github/diagnostics/psc1-direct-g1-rebuild.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-direct-clean-g1-${{ matrix.target }}-${{ github.sha }}
          path: |
            psc1/dist/direct-clean-g1/
            psc1/dist/generated-${{ matrix.target }}-compiler/
          retention-days: 90
