name: PSC1 owned DirectWasm strict IR diagnosis
on:
  push:
    branches: [diagnostic/psc1-direct-selfhost-profile-20261024]
    paths: [.github/diagnostics/psc1-direct-wasm-ir.json]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify immutable artifact and source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const request=JSON.parse(fs.readFileSync('.github/diagnostics/psc1-direct-wasm-ir.json'));
          const get=async route=>{
            const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+route,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            assert.equal(r.status,200);return await r.json();
          };
          for(const e of [request]){
            const run=await get('/actions/runs/'+e.runId);
            assert.equal(run.status,'completed');assert.equal(run.head_sha,e.requestCommit);
            const commit=await get('/commits/'+e.requestCommit);
            assert.equal(commit.parents[0].sha,e.sourceCommit);
            const artifact=await get('/actions/artifacts/'+e.artifactId);
            assert.equal(artifact.workflow_run.id,e.runId);assert.equal(artifact.digest,e.artifactDigest);
            assert.equal(artifact.expired,false);assert.equal(artifact.workflow_run.head_sha,e.requestCommit);
          }
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '40015615536'
          artifact-ids: '12527599858'
          path: input/direct-wasm
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-direct-service-native-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain','psc1/lakefile.lean','psc1/lake-manifest.json','psc1/**/*.lean') }}
          restore-keys: psc1-direct-service-native-v1-${{ runner.os }}-
      - name: Build production original IR diagnostic with pinned official Lean
        working-directory: psc1
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" build psc1_direct_wasm_ir_probe
      - name: Diagnose captured failing source with unchanged production strict checker
        working-directory: psc1
        run: node ../.github/diagnostics/psc1-direct-wasm-ir.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-direct-wasm-ir-diagnosis-${{ github.sha }}
          path: psc1/dist/direct-wasm-ir-diagnosis/
          retention-days: 90
