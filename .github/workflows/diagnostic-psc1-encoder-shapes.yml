name: PSC1 current encoder lowering inspection
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-encoder-shapes.json]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic-tools
      - uses: actions/checkout@v4
        with:
          ref: 66f1e752cfbdc491d9b2974c849825e8a4193227
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('source/psc1/lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: source/psc1/.lake
          key: psc1-lake-rust-ts-service-v1-${{ runner.os }}-${{ hashFiles('source/psc1/lean-toolchain', 'source/psc1/lakefile.lean', 'source/psc1/lake-manifest.json', 'source/psc1/**/*.lean') }}
      - name: Build the exact native seed only
        working-directory: source/psc1
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake build psc1_target_service_seed
      - name: Inspect actual original and transformed G1 encoder IR without G2 replay
        working-directory: source/psc1
        run: |
          node --check ../../diagnostic-tools/.github/diagnostics/psc1-encoder-shapes.mjs
          node ../../diagnostic-tools/.github/diagnostics/psc1-encoder-shapes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-encoder-shapes-${{ github.sha }}
          path: source/psc1/dist/encoder-shapes/
          retention-days: 90
