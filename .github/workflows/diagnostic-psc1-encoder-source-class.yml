name: PSC1 exact source eager-prefix census
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-encoder-source-class.json]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '39975765156'
          artifact-ids: '12510922572'
          path: input
      - name: Inspect pinned85-source request text without compiler execution
        run: |
          node --check .github/diagnostics/psc1-encoder-source-class.mjs
          node .github/diagnostics/psc1-encoder-source-class.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-source-prefixes-${{ github.sha }}
          path: diagnosis/
          retention-days: 90
