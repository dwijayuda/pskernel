name: PSC1 frozen TypeScript qualified immutable readback
on:
  push:
    branches: [diagnostic/psc1-unified-v2-profile-20261025]
    paths: [.github/workflows/diagnostic-psc1-frozen-ts-readback.yml]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '14cb3e30503d0c5e6b1e007598b0bde7ad77befb'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify immutable qualified archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';import {spawnSync} from 'node:child_process';
          const repo='dwijayuda/pskernel',root=path.resolve('dist/generated-package-input');fs.mkdirSync(root,{recursive:true});
          const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function api(route){const r=await fetch('https://api.github.com/repos/'+repo+route,{headers});assert.equal(r.status,200,route);return r.json();}
          const known=[{id:12583170640,digest:'sha256:58e8002673b37118e8e354be2f7f15f9955df4a312a68f85fe2e7890e1c4b479',run:40147825207}];
          const metadata=[];
          for(const item of known){
           const a=await api('/actions/artifacts/'+item.id);assert.equal(a.id,item.id);assert.equal(a.workflow_run.id,item.run);assert.equal(a.expired,false);
           if(item.digest)assert.equal(a.digest,item.digest);assert.match(a.digest,/^sha256:[a-f0-9]{64}$/);assert.ok(a.size_in_bytes<=256*1024*1024);
           const response=await fetch('https://api.github.com/repos/'+repo+'/actions/artifacts/'+a.id+'/zip',{headers,redirect:'manual'});
           assert.ok([301,302,303,307].includes(response.status));
           const location=new URL(response.headers.get('location'));assert.equal(location.protocol,'https:');
           assert.ok(location.hostname.endsWith('.blob.core.windows.net')||location.hostname.endsWith('.actions.githubusercontent.com'));
           const zipped=await fetch(location,{redirect:'error'});assert.equal(zipped.status,200);
           const bytes=Buffer.from(await zipped.arrayBuffer());assert.equal('sha256:'+crypto.createHash('sha256').update(bytes).digest('hex'),a.digest);
           const zip=path.join(root,a.id+'.zip'),out=path.join(root,String(a.id));fs.writeFileSync(zip,bytes);
           const python=`import pathlib,zipfile,stat,sys
          root=pathlib.Path(sys.argv[2]).resolve();root.mkdir()
          with zipfile.ZipFile(sys.argv[1]) as z:
              rows=z.infolist();assert len(rows)<50000
              assert sum(i.file_size for i in rows)<=2*1024*1024*1024
              for i in rows:
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\\\' not in i.filename
                  assert stat.S_IFMT(i.external_attr>>16)!=stat.S_IFLNK
                  assert (root/pathlib.Path(*p.parts)).resolve().is_relative_to(root)
              z.extractall(root)
          `;
           const run=spawnSync('python3',['-c',python,zip,out],{encoding:'utf8',timeout:120000});assert.equal(run.status,0,run.stderr);fs.unlinkSync(zip);
           metadata.push({id:a.id,name:a.name,digest:a.digest,workflowRun:a.workflow_run,directory:out});
           console.log('PSC1_VERIFIED_ARCHIVE: '+JSON.stringify(metadata.at(-1)));
          }
          fs.writeFileSync(path.join(root,'archives.json'),JSON.stringify(metadata,null,2)+'\n');
          JS
      - name: Read exact source admissions IR and G1 G2 G3 executable inventories
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          import {sha,verifyArtifact} from './host-tools/generated-target-tools.mjs';
          import {compilerSourceClosureDigest} from './host-tools/compiler-host-protocol.mjs';
          const root=path.resolve('dist/generated-package-input/12583170640'),files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else files.push(p);}}walk(root);
          const found=files.filter(p=>path.basename(p)==='qualification.json').map(file=>({file,q:JSON.parse(fs.readFileSync(file))})).filter(r=>r.q.schema==='psc1-generated-target-qualification/1'&&r.q.target==='ts'&&r.q.testedCommit==='0cabb7edef8fbce76d966487fcf37ac030dc2e3b');
          assert.equal(found.length,1);const {file,q}=found[0],dir=path.dirname(file);
          assert.equal(q.status,'passed');assert.equal(q.correctnessQualification,'qualified');assert.equal(q.mode,'--self-host');assert.equal(q.serviceKind,'unified');
          assert.equal(q.profile.name,'correctness-1800s');assert.equal(q.profile.g1TimeoutMs,240000);assert.equal(q.profile.selfCompileTimeoutMs,1800000);
          assert.equal(q.sourceClosureDigest,'07eedac1888aad3d4192664cea8d21a515d23985f3befd6cb365d0194fee53af');
          assert.equal(q.fixedPoint,'passed-G1-G2-G3-exact-source-admission-IR-executable-and-four-target-observations');
          assert.equal(q.cases.length,120);assert.equal(q.envelopeRefusals.length,27);assert.equal(q.generations.length,3);
          assert.deepEqual(q.outputTargets,['js','ts','rust','wasm-core']);
          const wire=JSON.parse(fs.readFileSync(path.join(dir,'G1-bootstrap.request.json')));
          const sources=wire[2][6].map(([module,text])=>({module,text,kind:'lean'}));
          assert.equal(sources.length,120);assert.equal(compilerSourceClosureDigest(sources),q.sourceClosureDigest);
          q.sourceInventory.forEach((r,i)=>{assert.equal(r.module,sources[i].module);assert.equal(r.sha256,sha(sources[i].text));assert.equal(r.bytes,Buffer.byteLength(sources[i].text));});
          const generations=[];
          for(const [i,g]of q.generations.entries()){
           assert.equal(g.generation,i+1);assert.equal(g.logicalAdmission,'accepted');assert.equal(g.checkerCommit,'eb6cafb7290e8bd5f2937522d8d804f58f02bafc');
           for(const key of ['sourceClosureDigest','sourceSha256','admissionsSha256','originalIrSha256','specializedIrSha256'])assert.equal(g[key],q.bootstrap[key]);
           assert.deepEqual(g.observations,q.generations[0].observations);
           const m=verifyArtifact(path.join(dir,'G'+(i+1)+'-service/artifact.json'),g.artifactSha256);
           const binary=sha(fs.readFileSync(path.join(m.directory,m.executable)));
           assert.equal(binary,q.executableSha256);
           const candidate=JSON.parse(fs.readFileSync(path.join(dir,i===0?'G1-bootstrap.candidate.json':'G'+(i+1)+'-self.candidate.json')));
           assert.equal(sha(candidate.source),g.sourceSha256);assert.equal(sha(candidate.admissionRequest.admissions),g.admissionsSha256);
           assert.equal(sha(JSON.stringify(candidate.originalIr)),g.originalIrSha256);assert.equal(sha(JSON.stringify(candidate.specializedIr)),g.specializedIrSha256);
           generations.push({...g,observations:'40 retained cross-target cases plus9 envelope refusals',executableSha256:binary,rustOptimizationLevel:m.rustOptimizationLevel,rustDependencyOptimizationLevel:m.rustDependencyOptimizationLevel});
          }
          const metrics=q.events.filter(e=>e.role==='generated-compiler'&&['G2-self','G3-self'].includes(e.id));
          const receipt={schema:'psc1-frozen-engine-immutable-readback/1',controlCommit:process.env.GITHUB_SHA,target:q.target,producerRun:40147825207,producerRequest:q.testedCommit,sourceClosure:q.sourceClosureDigest,generations,metrics,manifestG3:q.generations[2].artifactSha256,executableSha256:q.executableSha256,status:'passed',fixedPoint:q.fixedPoint,performanceQualification:q.performanceQualification,nativeDelegationBoundary:q.nativeDelegationBoundary,scope:'immutable source/admission/IR/executable inventory verification; not a clean full-generation replay or a formal compiler preservation proof'};
          fs.mkdirSync('dist/frozen-ts-readback',{recursive:true});fs.writeFileSync('dist/frozen-ts-readback/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('PSC1_FROZEN_ENGINE_READBACK: '+JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-frozen-ts-readback-${{ github.sha }}
          path: psc1/dist/frozen-ts-readback/
          retention-days: 90
