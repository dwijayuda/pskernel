name: PSC1 diagnostic generated compilation progress

on:
  push:
    branches:
      - diagnostic/psc1-selfhost-progress-20261023
    paths:
      - .github/qualification-requests/psc1-progress.json

permissions:
  contents: read
  actions: read

jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39864113546
          name: psc1-manual-selfhost-573bf48533cb196450a8d1df4f454de20c47b08f-attempt-1
          path: retained
      - name: Trace only the instrumented copy at the original process deadline
        run: |
          node --check .github/diagnostics/psc1-generated-progress.mjs
          node .github/diagnostics/psc1-generated-progress.mjs
      - name: Retain diagnostic identity, counters and bounded process result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-diagnostic-progress-${{ github.sha }}
          path: |
            diagnostic-progress/receipt.json
            diagnostic-progress/stdout.txt
            diagnostic-progress/stderr.txt
          retention-days: 90
          if-no-files-found: error
