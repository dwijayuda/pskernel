name: PSC1 qualified compiler isolated IR encoding cost
on:
  push:
    branches: [diagnostic/psc1-request-cpu-20261029]
    paths: [.github/scripts/psc1-ir-encoding-cost.mjs, .github/workflows/diagnostic-psc1-ir-cost.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-ir-cost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: timeout 240s node ../.github/scripts/psc1-ir-encoding-cost.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'psc1-ir-cost-${{ github.sha }}', path: psc1/dist/ir-cost/, retention-days: 30}
