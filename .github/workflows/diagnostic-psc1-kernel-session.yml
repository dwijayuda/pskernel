name: PSC1 official kernel session probe
on:
  push:
    branches: [feat/psc1-persistent-development-20261029]
    paths:
      - .github/scripts/psc1-kernel-session-probe.mjs
      - .github/workflows/diagnostic-psc1-kernel-session.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-kernel-session-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../.github/scripts/psc1-kernel-session-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-kernel-session-probe-${{ github.sha }}
          path: psc1/dist/kernel-session-results/
          retention-days: 30
