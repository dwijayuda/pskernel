name: PSC1 modular installed boundary and typing diagnostics
on:
  push:
    branches: [build/psc1-modular-boundaries-20261028]
    paths:
      - .github/workflows/diagnostic-psc1-modular-boundaries.yml
      - .github/scripts/psc1-modular-*
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-modular-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [node,bun]
    env:
      PSC1_MODULAR_INPUT_COMMIT: ca92bbdbc7c0f34e1da4076db7300033802eab3e
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Keep the qualified production implementation unchanged
        run: |
          git diff --exit-code "$PSC1_MODULAR_INPUT_COMMIT" HEAD -- psc1/host-tools psc1/npm-cli psc1/packages psc1/scripts/packaging
          for file in ../.github/scripts/psc1-modular-*.mjs; do node --check "$file"; done
          echo "PSC1_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          if [ '${{ matrix.runtime }}' = bun ]; then
            echo "PSC1_TEST_RUNTIME=$(command -v bun)" >> "$GITHUB_ENV"
          else
            echo "PSC1_TEST_RUNTIME=$(command -v node)" >> "$GITHUB_ENV"
          fi
      - name: Read exact successful modular root and target artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../.github/scripts/psc1-modular-prepare.mjs
      - name: Install exact official Rust SDK for unchanged target-resource checks
        run: |
          rustup toolchain uninstall 1.90.0
          rustup toolchain install 1.90.0 --profile minimal
      - name: Verify all optional resource identities
        run: node scripts/modular-toolchain-resources.mjs
      - name: Actual installed resource and missing-consumer refusal classes
        run: ${{ matrix.runtime }} ../.github/scripts/psc1-modular-boundaries.mjs
      - name: Checked Unicode IO callback/trap behavior and strict package typing
        run: node ../.github/scripts/psc1-modular-io-types.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-boundaries-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            psc1/dist/modular-toolchain/boundaries-*.json
            psc1/dist/modular-toolchain/io-types-*.json
          retention-days: 90
