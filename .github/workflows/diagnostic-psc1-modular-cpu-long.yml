name: PSC1 modular compiler extended CPU diagnostics
on:
  push:
    branches: [diagnostic/psc1-modular-cpu-20261029]
    paths: ['.github/psc1/modular-profile-long.mjs','.github/workflows/diagnostic-psc1-modular-cpu-long.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        engine: [js]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Restore exact independently admitted G1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-portable-g1.mjs scripts/requests/modular-selfhost.json
      - name: Sample actual complete self-source workload for 900 seconds within the existing correctness profile
        run: node ../.github/psc1/modular-profile-long.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-cpu-${{ matrix.engine }}-${{ github.sha }}
          path: psc1/dist/portable-modules/cpu-profile-${{ matrix.engine }}/
          retention-days: 30
