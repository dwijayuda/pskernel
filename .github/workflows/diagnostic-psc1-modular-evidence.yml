name: PSC1 modular qualification evidence
on:
  push:
    branches: [feat/psc1-portable-modules-20261029]
    paths:
      - '.github/workflows/diagnostic-psc1-modular-evidence.yml'
      - '.github/psc1/verify-modular-evidence.mjs'
      - 'psc1/docs/PSC1_PORTABLE_MODULAR_QUALIFICATION_2026-10-29.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Preserve historical bodies and current portable source baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/psc1-executable-baseline" b400552324956d9c3a684c9231f60f70066e1629
          PSC1_EXECUTABLE_BASELINE="$RUNNER_TEMP/psc1-executable-baseline/psc1" node scripts/executable-package-ownership.mjs
          node host-tools/executable/quarantine.test.mjs
          node scripts/ci/repository-layout.mjs
      - name: Reconcile exact current production bytes with completed qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../.github/psc1/verify-modular-evidence.mjs docs/PSC1_PORTABLE_MODULAR_QUALIFICATION_2026-10-29.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-portable-modular-final-evidence-${{ github.sha }}
          path: |
            psc1/dist/portable-evidence/
            psc1/dist/executable-packages/ownership.json
            psc1/dist/readability/
          retention-days: 90
