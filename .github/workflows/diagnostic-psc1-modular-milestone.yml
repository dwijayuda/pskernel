name: PSC1 modular milestone evidence
on:
  push:
    branches: [feat/psc1-modular-toolchain-20261028]
    paths:
      - .github/scripts/psc1-modular-milestone.mjs
      - .github/workflows/diagnostic-psc1-modular-milestone.yml
      - psc1/docs/PSC1_MODULAR_INSTALLED_QUALIFICATION_2026-10-28.json
      - psc1/EXECUTABLE_PACKAGE_CONTRACT.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check unchanged implementation and exact successful evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../.github/scripts/psc1-modular-milestone.mjs

