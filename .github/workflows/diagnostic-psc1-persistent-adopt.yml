name: PSC1 persistent source adoption and measured delivery
on:
  push:
    branches: [feat/psc1-persistent-development-20261029]
    paths:
      - psc1/host-tools/**
      - psc1/npm-cli/**
      - psc1/scripts/modular-toolchain-*
      - psc1/scripts/readability-host-check.mjs
      - psc1/scripts/ci/repository-layout.mjs
      - psc1/scripts/packaging/cli.mjs
      - psc1/docs/PSC1_PERSISTENT_QUALIFICATION_2026-10-29.json
      - .github/scripts/psc1-persistent-adopt.mjs
      - .github/scripts/psc1-persistent-compare.mjs
      - .github/scripts/psc1-persistent-profile-driver.mjs
      - .github/workflows/diagnostic-psc1-persistent-adopt.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-persistent-adopt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adopt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - run: npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
      - name: Retain historical correspondence and repository layout
        run: |
          node scripts/readability-host-check.mjs
          node scripts/ci/repository-layout.mjs
      - uses: actions/download-artifact@v4
        with:
          name: psc1-typescript-linux-x64
          run-id: 40814345252
          github-token: ${{ github.token }}
          path: psc1/dist/development-typescript-input
      - name: Reuse tested package, compare on same runner and execute real application
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../.github/scripts/psc1-persistent-adopt.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofscript-persistent-linux-x64-verified
          path: |
            psc1/dist/proofscript-persistent-linux-x64.zip
            psc1/dist/persistent-profile/results.json
            psc1/dist/persistent-results/profile.json
          retention-days: 90
