name: PSC1 generated preparation API inspection
on:
  push:
    branches: [feat/psc1-development-speed-20261029]
    paths: [.github/scripts/psc1-preparation-exports.mjs, .github/workflows/diagnostic-psc1-preparation-api.yml]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - uses: actions/download-artifact@v4
        with:
          name: psc1-cross-platform-package
          run-id: 40814345252
          github-token: ${{ github.token }}
          path: psc1/dist/development-input
      - run: node ../.github/scripts/psc1-preparation-exports.mjs
