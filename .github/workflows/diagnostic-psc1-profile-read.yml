name: PSC1 immutable progressive profile receipt read
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-profile-read.json]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify phase artifact identity (profile job may still be running)
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check .github/diagnostics/psc1-profile-read.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('.github/diagnostics/psc1-profile-read.json'));
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/artifacts/'+r.artifactId,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          assert.equal(response.status,200);const a=await response.json();
          assert.equal(a.workflow_run.id,r.runId);assert.equal(a.workflow_run.head_sha,r.sourceCommit);assert.equal(a.digest,r.artifactDigest);assert.equal(a.expired,false);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+r.runId+'\nartifact='+r.artifactId+'\n');
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.request.outputs.run }}
          artifact-ids: ${{ steps.request.outputs.artifact }}
          path: input
      - name: Read pinned CPU phase without compiler execution or qualification
        run: node .github/diagnostics/psc1-profile-read.mjs
