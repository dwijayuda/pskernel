name: PSC1 current TS progressive G2 diagnosis
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-progressive-profile.json]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check diagnostic syntax
        run: |
          node --check .github/diagnostics/psc1-progressive-launch.mjs
          node --check .github/diagnostics/psc1-progressive-snapshot.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '39973570792'
          artifact-ids: '12512171887'
          path: input/ts
      - name: Launch one pinned G2 replay with qualified supervisor policy
        run: node .github/diagnostics/psc1-progressive-launch.mjs
      - name: Snapshot actual request at phase 240
        run: node .github/diagnostics/psc1-progressive-snapshot.mjs 240
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-progressive-${{ github.sha }}-240
          path: diagnosis/phase-240/
          retention-days: 90
      - name: Snapshot actual request at phase 600
        run: node .github/diagnostics/psc1-progressive-snapshot.mjs 600
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-progressive-${{ github.sha }}-600
          path: diagnosis/phase-600/
          retention-days: 90
      - name: Snapshot actual request at phase 1200
        run: node .github/diagnostics/psc1-progressive-snapshot.mjs 1200
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-progressive-${{ github.sha }}-1200
          path: diagnosis/phase-1200/
          retention-days: 90
      - name: Snapshot actual request at phase 1750
        run: node .github/diagnostics/psc1-progressive-snapshot.mjs 1750
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-progressive-${{ github.sha }}-1750
          path: diagnosis/phase-1750/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-progressive-complete-${{ github.sha }}
          path: diagnosis/
          retention-days: 90
