name: PSC1 Python measured hot-pair and owned-sync controlled runtime profiles
on:
  push:
    branches: [diagnostic/psc1-python-php-artifacts-20261024]
    paths: [.github/diagnostics/psc1-python-runtime-experiment.py]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [hot-pair, owned-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Require exact failed job and immutable artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/dwijayuda/pskernel/actions/jobs/120830635451 > job.json
          gh api repos/dwijayuda/pskernel/actions/artifacts/12555068026 > artifact.json
          python3 - <<'PY'
          import json
          j=json.load(open("job.json"));a=json.load(open("artifact.json"))
          assert j["run_id"]==40079719620 and j["status"]=="completed" and j["conclusion"]=="failure"
          assert a["workflow_run"]["id"]==40079719620
          assert a["workflow_run"]["head_sha"]=="e6327cddbbb74917fcdebed8e00bdf6b8db55c42"
          assert a["digest"]=="sha256:5c37d10d0bd1879eec245254daa9e2175bbfe3cfd28acaf751d2bc4555edef27"
          assert not a["expired"]
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '40079719620'
          artifact-ids: '12555068026'
          path: baseline
      - name: Profile exact generated G1 and G2 request for120 seconds without native tools
        run: /usr/bin/time -v python3 -I .github/diagnostics/psc1-python-runtime-experiment.py baseline e6327cddbbb74917fcdebed8e00bdf6b8db55c42 diagnostics/python-G2-${{ matrix.mode }} ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-python-runtime-experiment-${{ matrix.mode }}-${{ github.sha }}
          path: diagnostics/
          retention-days: 90
