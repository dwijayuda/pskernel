name: PSC1 paired native and portable admission quoting
on:
  push:
    branches: [feat/psc1-wire-quote-20261029]
    paths:
      - .github/psc1/quote-paired-input.json
      - .github/scripts/psc1-quoting-paired*.mjs
      - .github/workflows/diagnostic-psc1-quote-paired.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-quote-paired-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../.github/scripts/psc1-quoting-paired.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'psc1-quote-paired-${{ github.sha }}', path: psc1/dist/quote-paired/, retention-days: 90}
