name: PSC1 exact Rust later G2 failure trace
on:
  push:
    branches: [diagnostic/psc1-unified-v2-profile-20261025]
    paths: [.github/workflows/diagnostic-psc1-rust-g2-abort.yml]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'f5a00e75ef4b46831ccefdfc78f47a45ea1174bf'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12575715924'
          run-id: '40130597594'
          github-token: ${{ github.token }}
          path: psc1/dist/rust-abort-input
      - name: Install debugger with unchanged inferior stack policy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Replay exact failed G2 to its actual abort, never admit or publish
        working-directory: psc1
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          import {sha,verifyArtifact,boundedRun} from './host-tools/generated-target-tools.mjs';
          function find(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory()){const f=find(p);if(f)return f;}else if(e.name==='qualification.json'){const q=JSON.parse(fs.readFileSync(p));if(q.schema==='psc1-generated-target-qualification/1'&&q.mode==='--self-host')return p;}}}
          const qfile=find('dist/rust-abort-input'),q=JSON.parse(fs.readFileSync(qfile)),root=path.dirname(qfile);
          assert.equal(q.testedCommit,'f5a00e75ef4b46831ccefdfc78f47a45ea1174bf');assert.equal(q.status,'failed');assert.equal(q.target,'rust');assert.equal(q.sourceClosureDigest,'50d5d0d099686020ad79fee1cb3ace38f3a511b3f315b3273a1e088b90555d76');
          const mf=path.join(root,'G1-service/artifact.json'),m=verifyArtifact(mf,'37a38bdd87af395daf9f3224991630d04e415636d2a39e098e52c6252a3b2ddf');
          const exe=path.join(m.directory,m.executable);fs.chmodSync(exe,0o700);assert.equal(sha(fs.readFileSync(exe)),'175ef0ddc0722ccdb91b160901448297c86fc4222ada8d7870b157f67bbc3be8');
          const input=path.join(root,'G2-self.request.json');assert.equal(sha(fs.readFileSync(input)),'327c9f8c2f20b38512e88dbd60690efad91e171fda6855bb1abfce89b8cabad4');
          const dir=path.resolve('dist/rust-g2-abort-trace');fs.mkdirSync(dir,{recursive:true});const output=path.join(dir,'diagnostic-only.candidate.json');
          const r=boundedRun('gdb',['--batch','-ex','set pagination off','-ex','set confirm off','-ex','set print frame-arguments none','-ex','run','-ex','thread apply all bt 90','-ex','quit','--args',exe,input,output],{logDirectory:dir,timeoutMs:1800000,timeoutPolicy:'g2g3-correctness-1800s'});
          fs.writeFileSync(path.join(dir,'trace.txt'),r.stdout+'\n'+r.stderr);console.log('PSC1_RUST_LATER_G2_TRACE: '+r.stdout.slice(-42000));
          delete r.stdout;delete r.stderr;verifyArtifact(mf,'37a38bdd87af395daf9f3224991630d04e415636d2a39e098e52c6252a3b2ddf');
          const receipt={schema:'psc1-rust-exact-g2-abort/1',testedCommit:process.env.GITHUB_SHA,subjectCommit:q.testedCommit,sourceClosure:q.sourceClosureDigest,executableSha256:q.executableSha256,requestSha256:sha(fs.readFileSync(input)),result:r,qualification:false,admission:'not-run',publication:'not-run',stackLimit:'unchanged'};
          fs.writeFileSync(path.join(dir,'receipt.json'),JSON.stringify(receipt,null,2)+'\n');console.log('PSC1_RUST_LATER_G2_RECEIPT: '+JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-rust-later-g2-trace-${{ github.sha }}
          path: psc1/dist/rust-g2-abort-trace/
          retention-days: 90
