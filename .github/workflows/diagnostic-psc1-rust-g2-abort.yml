name: PSC1 exact Rust late G2 performance profile
on:
  push:
    branches: [diagnostic/psc1-unified-v2-profile-20261025]
    paths: [.github/workflows/diagnostic-psc1-rust-g2-abort.yml]
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'f707e037b5f470ceee65891e0c735316ba097444'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12576967932'
          run-id: '40133622389'
          github-token: ${{ github.token }}
          path: psc1/dist/rust-abort-input
      - name: Install debugger with unchanged inferior stack policy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Sample exact G2 at 300/600/900/1200/1500 seconds; diagnostic only
        working-directory: psc1
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          import {sha,verifyArtifact,boundedRun} from './host-tools/generated-target-tools.mjs';
          function find(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory()){const f=find(p);if(f)return f;}else if(e.name==='qualification.json'){const q=JSON.parse(fs.readFileSync(p));if(q.schema==='psc1-generated-target-qualification/1'&&q.mode==='--self-host')return p;}}}
          const qfile=find('dist/rust-abort-input'),q=JSON.parse(fs.readFileSync(qfile)),root=path.dirname(qfile);
          assert.equal(q.testedCommit,'f707e037b5f470ceee65891e0c735316ba097444');assert.equal(q.status,'failed');assert.equal(q.target,'rust');assert.equal(q.sourceClosureDigest,'e0f7640b77ee9eaa17e946c628de23f320f2943dc181ac6063a35c81ccb7ca66');
          const mf=path.join(root,'G1-service/artifact.json'),m=verifyArtifact(mf,'a3c309d25cf5bb855b1eb80b3a3ce07ad7c7e5bcfac287283fadb56dc6665005');
          const exe=path.join(m.directory,m.executable);fs.chmodSync(exe,0o700);assert.equal(sha(fs.readFileSync(exe)),'91b12534f04b80c8ee4be93f0cca6d6a915a8c44b6087f62db28a677e7620d42');
          const input=path.join(root,'G2-self.request.json');assert.equal(sha(fs.readFileSync(input)),'636624936f655a0412cf5ce0f31df9436bc9f311e63aee25d808f009a76f4118');
          const dir=path.resolve('dist/rust-g2-abort-trace');fs.mkdirSync(dir,{recursive:true});const output=path.join(dir,'diagnostic-only.candidate.json');
          const gdb=path.join(dir,'sample.gdb');fs.writeFileSync(gdb,[
          'set pagination off','set confirm off','set print frame-arguments none','set print demangle on',
          'python','import threading,time,os,signal',
          'def interrupt_samples():',
          '  for _ in range(5):',
          '    time.sleep(300)',
          '    os.kill(os.getpid(),signal.SIGINT)',
          'threading.Thread(target=interrupt_samples,daemon=True).start()','end',
          'run',...Array.from({length:5},(_,i)=>['echo PSC1_SAMPLE_'+((i+1)*300)+'s\\n','thread apply all bt 60',i===4?'kill':'continue']).flat(),'quit'].join('\n'));
          const r=boundedRun('gdb',['--batch','-x',gdb,'--args',exe,input,output],{logDirectory:dir,timeoutMs:1800000,timeoutPolicy:'g2g3-correctness-1800s'});
          fs.writeFileSync(path.join(dir,'trace.txt'),r.stdout+'\n'+r.stderr);console.log('PSC1_RUST_LATER_G2_TRACE: '+r.stdout.slice(-42000));
          delete r.stdout;delete r.stderr;verifyArtifact(mf,'a3c309d25cf5bb855b1eb80b3a3ce07ad7c7e5bcfac287283fadb56dc6665005');
          const receipt={schema:'psc1-rust-exact-g2-late-profile/1',testedCommit:process.env.GITHUB_SHA,subjectCommit:q.testedCommit,sourceClosure:q.sourceClosureDigest,executableSha256:q.executableSha256,requestSha256:sha(fs.readFileSync(input)),result:r,qualification:false,admission:'not-run',publication:'not-run',stackLimit:'unchanged'};
          fs.writeFileSync(path.join(dir,'receipt.json'),JSON.stringify(receipt,null,2)+'\n');console.log('PSC1_RUST_LATER_G2_RECEIPT: '+JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-rust-later-g2-trace-${{ github.sha }}
          path: psc1/dist/rust-g2-abort-trace/
          retention-days: 90
