name: PSC1 Node-only Rust compiler transport boundary
on:
  push:
    branches: [diagnostic/psc1-unified-v2-profile-20261025]
    paths:
      - psc1/host-tools/generated-rust-guard.mjs
      - psc1/host-tools/generated-rust-transport.mjs
      - psc1/scripts/generated-rust-transport-tests.mjs
      - .github/workflows/diagnostic-psc1-rust-transport.yml
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Execute process integrity lifetime and resource regressions
        working-directory: psc1
        run: |
          node --check host-tools/generated-rust-guard.mjs
          node --check host-tools/generated-rust-transport.mjs
          node scripts/generated-rust-transport-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-rust-host-transport-${{ github.sha }}
          path: psc1/dist/generated-rust-transport/
          retention-days: 90
