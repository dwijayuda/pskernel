name: PSC1 real application semantic phase probe
on:
  push:
    branches: [feat/psc1-semantic-incremental-20261029]
    paths:
      - .github/psc1/persistent-candidate.json
      - .github/scripts/psc1-semantic-phase.mjs
      - .github/scripts/psc1-semantic-parity.mjs
      - .github/workflows/diagnostic-psc1-semantic-phase.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-semantic-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - run: npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
      - run: node scripts/readability-host-check.mjs
      - run: node ../.github/scripts/psc1-persistent-stage.mjs
      - run: node ../.github/scripts/psc1-compiler-data-keys.mjs
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: node scripts/modular-toolchain-package.mjs build
      - run: node ../.github/scripts/psc1-semantic-phase.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-semantic-phase-${{ github.sha }}
          path: |
            psc1/dist/semantic-phase/
            psc1/dist/persistent-candidate/
            psc1/dist/modular-toolchain/package-receipt.json
            psc1/dist/modular-toolchain/tarballs/
          retention-days: 30
