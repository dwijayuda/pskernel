name: PSC1 semantic reuse installed qualification
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-semantic-qualify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - name: Reuse exact passing candidate and qualified SDK bytes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../.github/scripts/psc1-semantic-package-reuse.mjs
      - name: Focused installed engines, outputs, refusals, kernel and live watch
        run: node ../.github/scripts/psc1-persistent-qualify.mjs
      - name: Controlled real-application comparison without CPU profiling
        run: node ../.github/scripts/psc1-semantic-controlled.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-semantic-qualified-${{ github.sha }}
          path: |
            psc1/dist/development-results/
            psc1/dist/semantic-results/
            psc1/dist/semantic-phase/
            psc1/dist/persistent-candidate/
            psc1/dist/modular-toolchain/package-receipt.json
            psc1/dist/modular-toolchain/tarballs/
            psc1/dist/modular-toolchain/typescript-platforms/linux-x64/
          retention-days: 30
