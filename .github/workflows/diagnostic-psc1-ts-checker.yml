name: PSC1 strict TypeScript compiler checker diagnosis
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-ts-checker-profile.mjs]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '39880803794'
          artifact-ids: '12470288964'
          path: input
      - name: Install exact locked target compiler
        run: npm ci --ignore-scripts
      - name: Sample strict checking without compiler adoption
        run: node .github/diagnostics/psc1-ts-checker-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-ts-checker-profile-${{ github.sha }}
          path: diagnosis/
          retention-days: 90
