name: PSC1 current shared-codec TS G2 runtime diagnosis
on:
  push:
    branches: [diagnostic/psc1-selfhost-profile-20261023]
    paths: [.github/diagnostics/psc1-target-execution-profile.mjs]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '39908439190'
          artifact-ids: '12483530422'
          path: input/ts
      - name: Sample current closed compiler workload without adoption
        run: node .github/diagnostics/psc1-target-execution-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-target-execution-profile-${{ github.sha }}
          path: diagnosis/
          retention-days: 90
