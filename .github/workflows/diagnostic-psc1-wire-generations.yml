name: PSC1 wire transport modular generations
on:
  push:
    branches: [qualify/psc1-wire-generations-20261029]
    paths:
      - .github/psc1/wire-generations.json
      - .github/scripts/psc1-wire-generation-*.mjs
      - .github/workflows/diagnostic-psc1-wire-generations.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-wire-generations-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix: {engine: [js, ts]}
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-wire-quote-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain','psc1/lakefile.lean','psc1/**/*.lean') }}
          restore-keys: |
            psc1-wire-quote-v1-${{ runner.os }}-
            psc1-portable-modules-v1-${{ runner.os }}-
      - uses: ./.github/actions/psc1-lean-launcher
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node ../.github/scripts/psc1-wire-generation-restore.mjs
      - name: Independent checker and unchanged output consumers
        run: |
          lake build psc1_independent_checker
          npm ci --prefix .. --ignore-scripts --include=optional --no-audit --no-fund
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
          rustup toolchain install 1.90.0 --profile minimal
          node scripts/prepare-rust-target-consumer.mjs
      - name: Genuine G2/G3 and exact graph/package fixed points
        env: {PSC1_MODULAR_ENGINE: '${{ matrix.engine }}'}
        run: |
          node host-tools/executable/selfhost.mjs "$PSC1_MODULAR_ENGINE" correctness-3600s &
          qualification_pid=$!
          while kill -0 "$qualification_pid" 2>/dev/null; do
            sleep 45
            if kill -0 "$qualification_pid" 2>/dev/null; then
              date -u '+PSC1_WIRE_GENERATION_PROGRESS %Y-%m-%dT%H:%M:%SZ'
              ps -C node -o pid=,ppid=,etimes=,time=,rss= || true
            fi
          done
          wait "$qualification_pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-wire-fixed-points-${{ matrix.engine }}-${{ github.sha }}
          path: psc1/dist/portable-modules/
          retention-days: 90
