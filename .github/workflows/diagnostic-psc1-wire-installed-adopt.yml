name: PSC1 qualified wire quoting source adoption
on:
  push:
    branches: [feat/psc1-wire-quote-20261029]
    paths: [psc1/docs/PSC1_WIRE_INSTALLED_QUALIFICATION_2026-10-30.json, .github/scripts/psc1-wire-installed-adopt.mjs, .github/workflows/diagnostic-psc1-wire-installed-adopt.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: psc1-wire-installed-adopt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adopt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: {shell: bash, working-directory: psc1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.3'}
      - run: npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
      - name: Preserve historical AST correspondence and newly qualified exact host bytes
        run: node scripts/readability-host-check.mjs
      - name: Verify exact terminal artifacts, current source identities and ZIP read-back
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node ../.github/scripts/psc1-wire-installed-adopt.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-wire-installed-adoption-${{ github.sha }}
          path: psc1/dist/wire-installed-adoption/
          retention-days: 90
