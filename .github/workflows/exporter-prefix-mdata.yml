name: Diagnostic exporter prefix MData

on:
  push:
    branches: [diagnostic/exporter-prefix-mdata]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canonical exporter prefix to shard 2400
        run: node scripts/exporter-prefix-benchmark.mjs 2400 Std
