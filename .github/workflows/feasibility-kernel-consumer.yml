name: feasibility-kernel-consumer

on:
  push:
    branches:
      - integration/proofscript-extraction-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:public-consumer
      - run: node scripts/anti-drift.mjs
