name: Full Std batched replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "oracle/replay-probe/DependencyExport.lean"
      - "scripts/batch-*.mjs"
      - ".github/workflows/full-std-batch.yml"

permissions:
  contents: read

concurrency:
  group: full-std-batched-main
  cancel-in-progress: true

jobs:
  std-prefix:
    name: Std roots 0-15999
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify 2,000-root prefix batches
        run: node scripts/batch-stream-oracle.mjs Std 114029 2000 0 8 58

  std-tail:
    name: Std 500-root batches ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { start: 32, end: 36, count: 5 }
          - { start: 37, end: 41, count: 5 }
          - { start: 42, end: 46, count: 5 }
          - { start: 47, end: 51, count: 5 }
          - { start: 52, end: 56, count: 5 }
          - { start: 57, end: 61, count: 5 }
          - { start: 62, end: 66, count: 5 }
          - { start: 67, end: 71, count: 5 }
          - { start: 72, end: 76, count: 5 }
          - { start: 77, end: 81, count: 5 }
          - { start: 82, end: 86, count: 5 }
          - { start: 87, end: 91, count: 5 }
          - { start: 92, end: 96, count: 5 }
          - { start: 97, end: 101, count: 5 }
          - { start: 102, end: 106, count: 5 }
          - { start: 107, end: 111, count: 5 }
          - { start: 112, end: 116, count: 5 }
          - { start: 117, end: 121, count: 5 }
          - { start: 122, end: 126, count: 5 }
          - { start: 127, end: 131, count: 5 }
          - { start: 132, end: 136, count: 5 }
          - { start: 137, end: 141, count: 5 }
          - { start: 142, end: 146, count: 5 }
          - { start: 147, end: 151, count: 5 }
          - { start: 152, end: 156, count: 5 }
          - { start: 157, end: 161, count: 5 }
          - { start: 162, end: 166, count: 5 }
          - { start: 167, end: 171, count: 5 }
          - { start: 172, end: 176, count: 5 }
          - { start: 177, end: 181, count: 5 }
          - { start: 182, end: 186, count: 5 }
          - { start: 187, end: 191, count: 5 }
          - { start: 192, end: 196, count: 5 }
          - { start: 197, end: 201, count: 5 }
          - { start: 202, end: 206, count: 5 }
          - { start: 207, end: 211, count: 5 }
          - { start: 212, end: 216, count: 5 }
          - { start: 217, end: 221, count: 5 }
          - { start: 222, end: 226, count: 5 }
          - { start: 227, end: 228, count: 2 }
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify dependency-closed Std tail range
        run: node scripts/batch-stream-oracle.mjs Std 114029 500 ${{ matrix.start }} ${{ matrix.count }} 229

  std-complete:
    name: Full Std 114,029-root coverage
    if: always()
    needs: [std-prefix, std-tail]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Std shard
        shell: bash
        run: |
          test "${{ needs.std-prefix.result }}" = "success"
          test "${{ needs.std-tail.result }}" = "success"
          echo "Full Std coverage PASS: 16,000 prefix roots + 98,029 tail roots = 114,029"
