name: Canonical Full Std replay
# trigger: canonical-std-v1

on:
  workflow_dispatch:
  push:
    branches: [main, kernel/lean434-study-hardening]
    paths:
      - ".github/workflows/full-std-canonical.yml"
      - "scripts/module-stream-oracle.mjs"
      - "scripts/full-std-oracle.mjs"
      - "src/core/**"
      - "src/kernel/**"
      - "src/integration/lean4export.ts"

permissions:
  contents: read

concurrency:
  group: canonical-full-std-${{ github.ref }}
  cancel-in-progress: true

jobs:
  std:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check:oracle-syntax
      - run: npm run build
      - name: Canonical one-pass Std replay
        env:
          PSKERNEL_STD_HEAP_MIB: "5632"
        run: npm run oracle:std-full
