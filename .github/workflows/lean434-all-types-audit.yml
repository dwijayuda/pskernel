name: Lean 4.34 all-type surface audit

on:
  push:
    branches:
      - audit/lean434-all-types
    paths:
      - .github/workflows/lean434-all-types-audit.yml
      - psc15selfhost/scripts/lean434-type-inventory.lean
      - psc15selfhost/packages/**/src/**
      - psc15selfhost/prelude-extension-contract.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact Lean 4.34
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b

      - name: Enumerate every Init type constructor from the pinned environment
        run: |
          set -euo pipefail
          mkdir -p .lake/lean434-type-audit
          lake env lean --run scripts/lean434-type-inventory.lean \
            > .lake/lean434-type-audit/lean-init-types.tsv
          head -n 1 .lake/lean434-type-audit/lean-init-types.tsv
          grep -c '^TYPE' .lake/lean434-type-audit/lean-init-types.tsv

      - name: Build exact current ProofScript prelude inventory
        run: |
          set -euo pipefail
          lake build psc2_joint_closure_inventory
          .lake/build/bin/psc2_joint_closure_inventory \
            --prelude .lake/lean434-type-audit/proofscript-prelude.json

      - name: Produce complete comparison manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='.lake/lean434-type-audit';
          const lines=fs.readFileSync(root+'/lean-init-types.tsv','utf8').trim().split(/\r?\n/u);
          const header=lines.shift();
          const headerMatch=/^LEAN434_INIT_TYPE_COUNT\t(\d+)$/u.exec(header);
          if(!headerMatch) throw new Error('unexpected Lean type inventory header: '+header);
          const records=lines.map(line=>{
            const [tag,name,kind]=line.split('\t');
            if(tag!=='TYPE'||!name||!kind) throw new Error('malformed type inventory row: '+line);
            return {name,kind};
          }).sort((a,b)=>a.name.localeCompare(b.name,'en'));
          if(records.length!==Number(headerMatch[1])) throw new Error('Lean type count mismatch');
          if(new Set(records.map(r=>r.name)).size!==records.length) throw new Error('duplicate Lean type name');
          const prelude=JSON.parse(fs.readFileSync(root+'/proofscript-prelude.json','utf8'));
          if(!Array.isArray(prelude)) throw new Error('ProofScript prelude inventory must be an array');
          const psNames=new Set(prelude.map(d=>d?.name).filter(n=>typeof n==='string'));
          const compared=records.map(r=>({...r,proofscriptPrelude:psNames.has(r.name)}));
          const manifest={
            schemaVersion:1,
            leanVersion:'4.34.0',
            leanCommit:'293d5d0c0c3f3dded4688b3ccd6a33939ac5102b',
            sourceCommit:process.env.GITHUB_SHA,
            leanInitTypeCount:compared.length,
            proofscriptPreludeDeclarationCount:prelude.length,
            proofscriptCoveredLeanTypeCount:compared.filter(r=>r.proofscriptPrelude).length,
            records:compared,
          };
          fs.writeFileSync(root+'/lean434-init-type-surface.json',JSON.stringify(manifest,null,2)+'\n');
          const missing=compared.filter(r=>!r.proofscriptPrelude);
          fs.writeFileSync(root+'/missing-from-proofscript-prelude.txt',
            missing.map(r=>r.name+'\t'+r.kind).join('\n')+'\n');
          console.log(JSON.stringify({
            leanInitTypeCount:manifest.leanInitTypeCount,
            proofscriptPreludeDeclarationCount:manifest.proofscriptPreludeDeclarationCount,
            proofscriptCoveredLeanTypeCount:manifest.proofscriptCoveredLeanTypeCount,
            missingCount:missing.length,
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: lean434-all-type-surface
          path: psc15selfhost/.lake/lean434-type-audit/
          retention-days: 14
          if-no-files-found: error
