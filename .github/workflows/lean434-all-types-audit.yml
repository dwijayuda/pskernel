name: Lean 4.34 all-type surface audit

on:
  push:
    branches:
      - audit/lean434-all-types
    paths:
      - .github/workflows/lean434-all-types-audit.yml
      - psc15selfhost/scripts/lean434-type-inventory.lean
      - psc15selfhost/scripts/check-lean434-type-coverage.mjs
      - psc15selfhost/scripts/check-compiler-builtin-prelude-closure.mjs
      - psc15selfhost/LEAN434_TYPE_COVERAGE_POLICY.json
      - psc15selfhost/docs/architecture/LEAN434_TYPE_SURFACE.md
      - psc15selfhost/packages/**/src/**
      - psc15selfhost/stdlib/**
      - psc15selfhost/prelude-extension-contract.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean434-all-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact Lean 4.34
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b

      - name: Enumerate every Init Std and Lean type constructor
        run: |
          set -euo pipefail
          mkdir -p .lake/lean434-type-audit
          lake env lean --run scripts/lean434-type-inventory.lean \
            > .lake/lean434-type-audit/lean-type-surfaces.tsv
          grep '^SURFACE' .lake/lean434-type-audit/lean-type-surfaces.tsv

      - name: Build exact current ProofScript prelude inventory
        run: |
          set -euo pipefail
          lake build psc2_joint_closure_inventory
          .lake/build/bin/psc2_joint_closure_inventory \
            --prelude .lake/lean434-type-audit/proofscript-prelude.json

      - name: Produce complete comparison manifest
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='.lake/lean434-type-audit';
          const lines=fs.readFileSync(root+'/lean-type-surfaces.tsv','utf8').trim().split(/\r?\n/u);
          const expectedCounts=new Map();
          const records=[];
          for(const line of lines){
            const cols=line.split('\t');
            if(cols[0]==='SURFACE'){
              if(cols.length!==3||!['Init','Std','Lean'].includes(cols[1])||!/^[0-9]+$/u.test(cols[2])){
                throw new Error('malformed surface row: '+line);
              }
              expectedCounts.set(cols[1],Number(cols[2]));
              continue;
            }
            if(cols[0]!=='TYPE'||cols.length!==6){
              throw new Error('malformed type row: '+line);
            }
            const [,surface,name,kind,internal,module]=cols;
            if(!['Init','Std','Lean'].includes(surface)||!name||!kind||!module){
              throw new Error('invalid type row: '+line);
            }
            if(internal!=='true'&&internal!=='false'){
              throw new Error('invalid internal flag: '+line);
            }
            records.push({surface,name,kind,internal:internal==='true',module});
          }
          for(const surface of ['Init','Std','Lean']){
            const actual=records.filter(r=>r.surface===surface).length;
            if(expectedCounts.get(surface)!==actual){
              throw new Error(`${surface} type count mismatch: ${expectedCounts.get(surface)} != ${actual}`);
            }
          }

          const prelude=JSON.parse(fs.readFileSync(root+'/proofscript-prelude.json','utf8'));
          if(!Array.isArray(prelude)) throw new Error('ProofScript prelude inventory must be an array');
          const psNames=new Set(prelude.map(d=>d?.name).filter(n=>typeof n==='string'));

          const union=new Map();
          for(const record of records){
            const prior=union.get(record.name);
            if(prior){
              if(prior.kind!==record.kind||prior.internal!==record.internal||prior.module!==record.module){
                throw new Error('surface identity drift for '+record.name);
              }
              prior.surfaces.push(record.surface);
            }else{
              union.set(record.name,{
                name:record.name,
                kind:record.kind,
                internal:record.internal,
                module:record.module,
                surfaces:[record.surface],
                proofscriptPrelude:psNames.has(record.name),
              });
            }
          }
          const unionRecords=[...union.values()].sort((a,b)=>a.name.localeCompare(b.name,'en'));
          for(const record of unionRecords){
            record.surfaces.sort((a,b)=>['Init','Std','Lean'].indexOf(a)-['Init','Std','Lean'].indexOf(b));
          }
          const perSurface={};
          for(const surface of ['Init','Std','Lean']){
            const surfaceNames=new Set(records.filter(r=>r.surface===surface).map(r=>r.name));
            const surfaceRecords=unionRecords.filter(r=>surfaceNames.has(r.name));
            perSurface[surface]={
              typeCount:surfaceRecords.length,
              publicTypeCount:surfaceRecords.filter(r=>!r.internal&&!r.name.startsWith('_private.')).length,
              internalOrPrivateTypeCount:surfaceRecords.filter(r=>r.internal||r.name.startsWith('_private.')).length,
              proofscriptPreludeCoveredCount:surfaceRecords.filter(r=>r.proofscriptPrelude).length,
            };
          }
          const manifest={
            schemaVersion:2,
            leanVersion:'4.34.0',
            leanCommit:'293d5d0c0c3f3dded4688b3ccd6a33939ac5102b',
            sourceCommit:process.env.GITHUB_SHA,
            proofscriptPreludeDeclarationCount:prelude.length,
            perSurface,
            unionTypeCount:unionRecords.length,
            unionPublicTypeCount:unionRecords.filter(r=>!r.internal&&!r.name.startsWith('_private.')).length,
            proofscriptPreludeCoveredUnionCount:unionRecords.filter(r=>r.proofscriptPrelude).length,
            records:unionRecords,
          };
          fs.writeFileSync(root+'/lean434-type-surfaces.json',JSON.stringify(manifest,null,2)+'\n');

          const initMissing=unionRecords.filter(r=>r.surfaces.includes('Init')&&!r.proofscriptPrelude);
          fs.writeFileSync(root+'/init-missing-from-proofscript-prelude.txt',
            initMissing.map(r=>[r.name,r.kind,r.internal,r.module].join('\t')).join('\n')+'\n');
          const stdOnly=unionRecords.filter(r=>r.surfaces.includes('Std')&&!r.surfaces.includes('Init'));
          fs.writeFileSync(root+'/std-beyond-init.txt',
            stdOnly.map(r=>[r.name,r.kind,r.internal,r.module].join('\t')).join('\n')+'\n');
          const leanOnly=unionRecords.filter(r=>r.surfaces.includes('Lean')&&!r.surfaces.includes('Init')&&!r.surfaces.includes('Std'));
          fs.writeFileSync(root+'/lean-meta-beyond-init-std.txt',
            leanOnly.map(r=>[r.name,r.kind,r.internal,r.module].join('\t')).join('\n')+'\n');

          console.log(JSON.stringify({
            perSurface:manifest.perSurface,
            unionTypeCount:manifest.unionTypeCount,
            unionPublicTypeCount:manifest.unionPublicTypeCount,
            proofscriptPreludeCoveredUnionCount:manifest.proofscriptPreludeCoveredUnionCount,
            initMissingCount:initMissing.length,
            stdBeyondInitCount:stdOnly.length,
            leanBeyondInitStdCount:leanOnly.length,
          },null,2));
          NODE

      - name: Classify every pinned Lean type and enforce ProofScript promises
        run: |
          set -euo pipefail
          node scripts/check-lean434-type-coverage.mjs
          node scripts/check-compiler-builtin-prelude-closure.mjs
          cat .lake/lean434-type-audit/lean434-type-coverage-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: lean434-all-type-surface
          path: psc15selfhost/.lake/lean434-type-audit/
          retention-days: 14
          if-no-files-found: error
