name: Lean 4.34 Meta bootstrap fast gate

on:
  push:
    branches: [runtime/lean434-js-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean434-js-meta-fast-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          test "$("$HOME/.elan/bin/lean" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - run: npm ci --no-audit --no-fund
      - name: Build pskernel
        run: npm run build:src
      - name: Build and test runtime
        run: npm --workspace @proofscript/runtime test
      - name: Export Lean.MetavarContext runtime metadata
        run: |
          npm run generate:lean434-runtime-metadata -- \
            Lean.MetavarContext \
            --out lean434-metavar-context-runtime-metadata.json
      - name: Generate focused Lean.MetavarContext corpus
        shell: bash
        run: |
          set -euo pipefail
          lean -o Oracle/ReplayProbe/RuntimeMapProbe.olean \
            Oracle/ReplayProbe/RuntimeMapProbe.lean
          LEAN_PATH="$PWD:\${LEAN_PATH:-}" \
            lean --run oracle/replay-probe/DependencyExport.lean \
            Oracle.ReplayProbe.RuntimeMapProbe \
            --selected-after Init.Prelude \
            Array.modify Array.set \
            Lean.PersistentHashMap.insert Lean.PersistentHashMap.find? \
            Lean.assignExp \
            Lean.assignLevelMVarExp Lean.getLevelMVarAssignmentExp \
            Lean.instantiateLevelMVarsImp Lean.instantiateExprMVarsImp \
            Lean.instantiateMVarsCore \
            Lean.MetavarContext.getExprAssignmentExp \
            Lean.MetavarContext.getDelayedMVarAssignmentExp \
            ProofScript.RuntimeProbe.firstBucketIndex \
            ProofScript.RuntimeProbe.replaceNullEntry \
            ProofScript.RuntimeProbe.insertExprMap \
            ProofScript.RuntimeProbe.findExprMap? \
            ProofScript.RuntimeProbe.insertDelayedExprAssignment \
            > lean434-metavar-context-bootstrap.ndjson
          test -s lean434-metavar-context-bootstrap.ndjson
      - name: Execute real Lean.MetavarContext assignment in JavaScript
        run: |
          node scripts/lean434-js-metavar-context-smoke.mjs \
            lean434-metavar-context-bootstrap.ndjson \
            lean434-metavar-context-runtime-metadata.json
      - name: Compile real Lean.Meta WHNF probe
        shell: bash
        run: |
          set -euo pipefail
          lean -o Oracle/ReplayProbe/RuntimeMetaProbe.olean \
            Oracle/ReplayProbe/RuntimeMetaProbe.lean
      - name: Export Lean.Meta WHNF runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          LEAN_PATH="$PWD:${LEAN_PATH:-}" \
            npm run generate:lean434-runtime-metadata -- \
              Oracle.ReplayProbe.RuntimeMetaProbe \
              --out lean434-whnf-runtime-metadata.json
      - name: Generate focused real Lean.Meta WHNF corpus
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t whnf_init_roots < <(node --input-type=module -e "
            import fs from 'node:fs';
            const d=JSON.parse(fs.readFileSync(
              'lean434-whnf-runtime-metadata.json','utf8'
            ));
            const entries=[
              d.initializers.find(
                x=>x.declaration.includes('ImportingFlag') &&
                   x.declaration.endsWith('.importingRef')
              ),
              d.initializers.find(
                x=>x.declaration.includes('EnvExtension.envExtensionsRef')
              ),
            ];
            if(entries.some(x=>!x))process.exit(2);
            for(const e of entries){
              console.log(e.declaration);
              if(e.initFunction)console.log(e.initFunction);
            }
          ")
          printf 'WHNF initializer root: %s\n' "${whnf_init_roots[@]}"
          LEAN_PATH="$PWD:${LEAN_PATH:-}" \
            lean --run oracle/replay-probe/DependencyExport.lean \
            Oracle.ReplayProbe.RuntimeMetaProbe \
            --selected-after Init.Prelude \
            "${whnf_init_roots[@]}" \
            Lean.assignExp \
            Lean.MetavarContext.getExprAssignmentExp \
            Lean.Meta.whnfImp \
            ProofScript.RuntimeProbe.whnfWithEmptyEnv \
            ProofScript.RuntimeProbe.whnfWithEmptyEnvAndMCtx \
            > lean434-whnf-bootstrap.ndjson
          test -s lean434-whnf-bootstrap.ndjson
      - name: Execute real Lean.Meta WHNF in JavaScript
        run: |
          node scripts/lean434-js-whnf-smoke.mjs \
            lean434-whnf-bootstrap.ndjson \
            lean434-whnf-runtime-metadata.json
