name: Lean 4.34 JavaScript runtime experiment

on:
  push:
    branches: [runtime/lean434-js-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean434-js-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          test "$("$HOME/.elan/bin/lean" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - run: npm ci --no-audit --no-fund
      - name: Build pskernel
        run: npm run build:src
      - name: Test Lean 4.34 JavaScript runtime compatibility slice
        run: npm --workspace @proofscript/runtime test
      - name: Execute real Lean 4.34 Init.Prelude through pskernel + JS runtime
        run: node scripts/lean434-js-eval-smoke.mjs
      - name: Compile Lean-native runtime metadata exporter
        run: lean oracle/replay-probe/RuntimeMetadataExport.lean
      - name: Export real Lean runtime metadata sidecars
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:lean434-runtime-metadata -- Init.Prelude --out lean434-init-runtime-metadata.json
          npm run generate:lean434-runtime-metadata -- Lean.Parser.Types --out lean434-parser-types-runtime-metadata.json
          npm run generate:lean434-runtime-metadata -- Lean.Parser.Basic --out lean434-parser-basic-runtime-metadata.json
          npm run generate:lean434-runtime-metadata -- Lean.Parser --out lean434-parser-runtime-metadata.json
      - name: Report Lean.Parser runtime metadata
        run: |
          node scripts/lean434-runtime-metadata-report.mjs lean434-parser-types-runtime-metadata.json
          node scripts/lean434-runtime-metadata-report.mjs lean434-parser-basic-runtime-metadata.json
          node scripts/lean434-runtime-metadata-report.mjs lean434-parser-runtime-metadata.json
      - name: Generate Lean.Parser.Basic EnvExtension initializer corpus
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t init_roots < <(node --input-type=module -e "
            import fs from 'node:fs';
            const d=JSON.parse(fs.readFileSync(
              'lean434-parser-basic-runtime-metadata.json','utf8'
            ));
            const entries=[
              d.initializers.find(
                x=>x.declaration.includes('EnvExtension.envExtensionsRef')
              ),
              d.initializers.find(
                x=>x.declaration==='Lean.Parser.categoryParserFnRef'
              ),
              d.initializers.find(
                x=>x.declaration==='Lean.Parser.categoryParserFnExtension'
              ),
            ];
            if(entries.some(x=>!x))process.exit(2);
            for(const e of entries){
              console.log(e.declaration);
              if(e.initFunction)console.log(e.initFunction);
            }
          ")
          printf 'Parser.Basic initializer root: %s\n' "${init_roots[@]}"
          lean --run oracle/replay-probe/DependencyExport.lean Lean.Parser.Basic \
            "${init_roots[@]}" \
            > lean434-parser-basic-env-extension.ndjson
          test -s lean434-parser-basic-env-extension.ndjson
      - name: Execute real Lean registerEnvExtension for Parser.Basic
        run: |
          node scripts/lean434-js-parser-basic-extension-smoke.mjs \
            lean434-parser-basic-env-extension.ndjson \
            lean434-parser-basic-runtime-metadata.json
      - name: Generate first Lean.Parser.Basic initializer corpus
        shell: bash
        run: |
          set -euo pipefail
          init_action="$(node --input-type=module -e "
            import fs from 'node:fs';
            const d=JSON.parse(fs.readFileSync(
              'lean434-parser-basic-runtime-metadata.json','utf8'
            ));
            const e=d.initializers.find(
              x=>x.declaration==='Lean.Parser.categoryParserFnRef'
            );
            if(!e)process.exit(2);
            process.stdout.write(e.initFunction??e.declaration);
          ")"
          echo "categoryParserFnRef action: $init_action"
          lean --run oracle/replay-probe/DependencyExport.lean Lean.Parser.Basic \
            Lean.Parser.categoryParserFnRef "$init_action" \
            > lean434-parser-basic-category-ref.ndjson
          test -s lean434-parser-basic-category-ref.ndjson
      - name: Execute first real Lean.Parser.Basic initializer in JavaScript
        run: |
          node scripts/lean434-js-parser-basic-init-smoke.mjs \
            lean434-parser-basic-category-ref.ndjson \
            lean434-parser-basic-runtime-metadata.json
      - name: Generate real Lean.Parser.Types bootstrap corpus
        shell: bash
        run: |
          set -euo pipefail
          lean --run oracle/replay-probe/DependencyExport.lean Lean.Parser.Types \
            Lean.Parser.FirstTokens.toOptional \
            Lean.Parser.FirstTokens.seq \
            Lean.Parser.FirstTokens.merge \
            > lean434-parser-types-bootstrap.ndjson
          test -s lean434-parser-types-bootstrap.ndjson
      - name: Execute real Lean.Parser.Types algorithms in JavaScript
        run: node scripts/lean434-js-parser-types-smoke.mjs lean434-parser-types-bootstrap.ndjson
      - name: Generate real Lean ST/IO bootstrap corpus
        shell: bash
        run: |
          set -euo pipefail
          lean --run oracle/replay-probe/DependencyExport.lean Init.System.IO \
            Nat Nat.add IO.RealWorld IO.mkRef \
            ST.Prim.Ref.modify ST.Prim.Ref.modifyUnsafe \
            > lean434-runtime-st-bootstrap.ndjson
          test -s lean434-runtime-st-bootstrap.ndjson
      - name: Execute real Lean-written ST/IO over JavaScript runtime
        run: node scripts/lean434-js-st-smoke.mjs lean434-runtime-st-bootstrap.ndjson
      - name: Validate exported runtime sidecars in JavaScript
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import {
              Lean434RuntimeMetadataIndex,
              parseLean434RuntimeMetadata,
            } from './packages/runtime/dist/src/lean4-metadata.js';
            for (const file of [
              'lean434-init-runtime-metadata.json',
              'lean434-parser-types-runtime-metadata.json',
              'lean434-parser-basic-runtime-metadata.json',
              'lean434-parser-runtime-metadata.json',
            ]) {
              const doc=parseLean434RuntimeMetadata(
                JSON.parse(fs.readFileSync(file,'utf8')),
              );
              const index=new Lean434RuntimeMetadataIndex(doc);
              console.log(JSON.stringify({
                module:doc.module,
                externs:doc.externs.length,
                implementedBy:doc.implementedBy.length,
                initializers:doc.initializers.length,
                modulesWithInitializers:[
                  ...new Set(doc.initializers.map(x=>x.module)),
                ].length,
                hasNatAdd:index.externFor('Nat.add')!==undefined,
              }));
            }
          "
      - name: Verify runtime manifest against pinned Lean source
        run: npm run check:lean434-runtime-manifest
      - name: Generate deterministic Lean 4.34 source/runtime census
        run: |
          node scripts/lean434-js-runtime-census.mjs > lean434-js-runtime-census.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const r=JSON.parse(fs.readFileSync('lean434-js-runtime-census.json','utf8'));
            console.log(JSON.stringify({
              format:r.format,
              leanVersion:r.leanVersion,
              files:r.totals.files,
              bytes:r.totals.bytes,
              externSymbols:r.totals.externSymbols.length,
              features:r.totals.features,
              targets:r.targets.map(t=>({
                name:t.name,
                files:t.files,
                bytes:t.bytes,
                externSymbols:t.externSymbols.length,
              })),
            },null,2));
          "
      - name: Measure dependency-closed Lean source roots
        run: |
          node scripts/lean434-source-closure.mjs Lean.Parser.Types > lean-parser-types-closure.json
          node scripts/lean434-source-closure.mjs Lean.Parser.Basic > lean-parser-basic-closure.json
          node scripts/lean434-source-closure.mjs Lean.Parser > lean-parser-closure.json
          node scripts/lean434-source-closure.mjs Lean.Meta.Basic > lean-meta-basic-closure.json
          node scripts/lean434-source-closure.mjs Lean.Elab.Frontend > lean-elab-frontend-closure.json
          node --input-type=module -e "
            import fs from 'node:fs';
            for (const [name,file] of [
              ['Lean.Parser.Types','lean-parser-types-closure.json'],
              ['Lean.Parser.Basic','lean-parser-basic-closure.json'],
              ['Lean.Parser','lean-parser-closure.json'],
              ['Lean.Meta.Basic','lean-meta-basic-closure.json'],
              ['Lean.Elab.Frontend','lean-elab-frontend-closure.json'],
            ]) {
              const r=JSON.parse(fs.readFileSync(file,'utf8'));
              console.log(JSON.stringify({
                root:name,
                modules:r.totals.modules,
                bytes:r.totals.bytes,
                missingModules:r.totals.missingModules,
                prunedImportEdges:r.totals.prunedImportEdges,
                externSymbols:r.totals.externSymbols,
                implementedExternSymbols:r.totals.implementedExternSymbols,
                uncoveredExternSymbols:r.totals.uncoveredExternSymbols,
                implementedByTargets:r.totals.implementedByTargets,
                byTopLevel:r.byTopLevel,
                rootImports:r.rootsDetail[0],
                missing:r.missingModules,
              }));
            }
          "
      - name: Kernel regression gate
        run: npm run test:kernel
