name: Lean 4.34 JavaScript runtime experiment

on:
  push:
    branches: [runtime/lean434-js-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Test Lean 4.34 JavaScript runtime compatibility slice
        run: npm --workspace @proofscript/runtime test
      - name: Verify runtime manifest against pinned Lean source
        run: npm run check:lean434-runtime-manifest
      - name: Generate deterministic Lean 4.34 source/runtime census
        run: |
          node scripts/lean434-js-runtime-census.mjs > lean434-js-runtime-census.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const r=JSON.parse(fs.readFileSync('lean434-js-runtime-census.json','utf8'));
            console.log(JSON.stringify({
              format:r.format,
              leanVersion:r.leanVersion,
              files:r.totals.files,
              bytes:r.totals.bytes,
              externSymbols:r.totals.externSymbols.length,
              features:r.totals.features,
              targets:r.targets.map(t=>({
                name:t.name,
                files:t.files,
                bytes:t.bytes,
                externSymbols:t.externSymbols.length,
              })),
            },null,2));
          "
      - name: Measure dependency-closed Lean source roots
        run: |
          node scripts/lean434-source-closure.mjs Lean.Parser.Types > lean-parser-types-closure.json
          node scripts/lean434-source-closure.mjs Lean.Parser.Basic > lean-parser-basic-closure.json
          node scripts/lean434-source-closure.mjs Lean.Parser > lean-parser-closure.json
          node scripts/lean434-source-closure.mjs Lean.Meta.Basic > lean-meta-basic-closure.json
          node scripts/lean434-source-closure.mjs Lean.Elab.Frontend > lean-elab-frontend-closure.json
          node --input-type=module -e "
            import fs from 'node:fs';
            for (const [name,file] of [
              ['Lean.Parser.Types','lean-parser-types-closure.json'],
              ['Lean.Parser.Basic','lean-parser-basic-closure.json'],
              ['Lean.Parser','lean-parser-closure.json'],
              ['Lean.Meta.Basic','lean-meta-basic-closure.json'],
              ['Lean.Elab.Frontend','lean-elab-frontend-closure.json'],
            ]) {
              const r=JSON.parse(fs.readFileSync(file,'utf8'));
              console.log(JSON.stringify({
                root:name,
                modules:r.totals.modules,
                bytes:r.totals.bytes,
                missingModules:r.totals.missingModules,
                prunedImportEdges:r.totals.prunedImportEdges,
                externSymbols:r.totals.externSymbols,
                implementedExternSymbols:r.totals.implementedExternSymbols,
                uncoveredExternSymbols:r.totals.uncoveredExternSymbols,
                implementedByTargets:r.totals.implementedByTargets,
                byTopLevel:r.byTopLevel,
                rootImports:r.rootsDetail[0],
                missing:r.missingModules,
              }));
            }
          "
      - name: Check ProofScript architecture invariants
        run: npm run check:architecture
