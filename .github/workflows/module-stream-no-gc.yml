name: Capped module stream no-GC

on:
  push:
    branches: [diagnostic/module-stream-no-gc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Replay first 2400 canonical shards without forced per-shard GC
        env:
          NODE_OPTIONS: "--max-old-space-size=5632"
        run: node --expose-gc --max-old-space-size=5632 --stack-size=65500 scripts/diagnostic-capped-module-stream.mjs 2400 no-gc
