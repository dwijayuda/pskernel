name: Patch PSC15 Rust IR fixtures once

on:
  push:
    branches:
      - psc2/kernel-core-phase1
    paths:
      - .github/workflows/patch-psc15-rust-ir-fixtures-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Insert missing VerifiedIR intrinsic type arguments
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path("psc15selfhost/test/BackendRustTests.lean"),
              Path("psc15selfhost/test/BackendRustLetFunctionResultTests.lean"),
              Path("psc15selfhost/test/BackendRustFixture.lean"),
              Path("psc15selfhost/test/BackendRustLetFunctionResultFixture.lean"),
              Path("psc15selfhost/test/BackendDifferentialFixture.lean"),
          ]

          one_nat = {
              "arrayEmptyWithCapacity",
              "arraySize",
              "arrayPush",
              "arrayGet",
              "arrayGetD",
              "arraySet",
              "arraySetIfInBounds",
          }
          two_nat = {"arrayMap", "arrayFoldl"}

          def operation_end(lines, start):
              j = start + 1
              while j < len(lines) and not lines[j].strip():
                  j += 1
              if j >= len(lines):
                  raise SystemExit(f"unterminated intrinsic at line {start + 1}")
              depth = 0
              seen_paren = False
              k = j
              while k < len(lines):
                  text = lines[k]
                  depth += text.count("(") - text.count(")")
                  if "(" in text:
                      seen_paren = True
                  if not seen_paren or depth <= 0:
                      return k
                  k += 1
              raise SystemExit(f"unterminated intrinsic operation at line {start + 1}")

          def first_list_item(lines, list_line):
              stripped = lines[list_line].strip()
              if stripped == "[]":
                  return "empty"
              if stripped.startswith("[PsVerifiedIrType"):
                  return "type"
              if stripped.startswith("[PsVerifiedIrExpr"):
                  return "expr"
              if stripped == "[":
                  k = list_line + 1
                  while k < len(lines):
                      item = lines[k].strip()
                      if not item:
                          k += 1
                          continue
                      if item.startswith("PsVerifiedIrType"):
                          return "type"
                      if item.startswith("PsVerifiedIrExpr"):
                          return "expr"
                      if item == "]":
                          return "empty"
                      return "other"
              return "other"

          total = 0
          per_file = {}
          for path in targets:
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              out = []
              i = 0
              changed = 0
              while i < len(lines):
                  line = lines[i]
                  out.append(line)
                  if "PsVerifiedIrExpr.intrinsic" not in line:
                      i += 1
                      continue

                  op_end = operation_end(lines, i)
                  for k in range(i + 1, op_end + 1):
                      out.append(lines[k])

                  op_text = " ".join(x.strip() for x in lines[i + 1:op_end + 1])
                  arg_line = op_end + 1
                  while arg_line < len(lines) and not lines[arg_line].strip():
                      out.append(lines[arg_line])
                      arg_line += 1
                  if arg_line >= len(lines):
                      raise SystemExit(f"missing intrinsic arguments in {path}:{i + 1}")

                  kind = first_list_item(lines, arg_line)
                  if kind in {"empty", "type"}:
                      i = arg_line
                      continue
                  if kind != "expr":
                      raise SystemExit(
                          f"cannot classify intrinsic argument slot in {path}:{i + 1}: {lines[arg_line].strip()!r}"
                      )

                  indent = line[:len(line) - len(line.lstrip())] + "  "
                  if "PsVerifiedIrIntrinsic." not in op_text:
                      raise SystemExit(f"cannot identify intrinsic in {path}:{i + 1}: {op_text}")
                  name = op_text.split("PsVerifiedIrIntrinsic.", 1)[1]
                  name = name.split()[0].strip("()")

                  if name in one_nat:
                      out.append(indent + "[PsVerifiedIrType.primitive PsVerifiedIrPrimitiveType.nat]\n")
                  elif name in two_nat:
                      out.append(indent + "[\n")
                      out.append(indent + "  PsVerifiedIrType.primitive PsVerifiedIrPrimitiveType.nat,\n")
                      out.append(indent + "  PsVerifiedIrType.primitive PsVerifiedIrPrimitiveType.nat\n")
                      out.append(indent + "]\n")
                  else:
                      out.append(indent + "[]\n")

                  changed += 1
                  total += 1
                  i = arg_line

              if changed:
                  path.write_text("".join(out), encoding="utf-8")
              per_file[str(path)] = changed

          if total == 0:
              raise SystemExit("RUST_IR_FIXTURE_MIGRATION: no stale intrinsic calls found")

          print(f"RUST_IR_FIXTURE_MIGRATION: patched {total} intrinsic calls")
          for path, count in per_file.items():
              print(f"  {path}: {count}")

      - name: Verify Rust test surface before commit
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc1_backend_rust_tests
          lake exe psc1_backend_rust_source_tests
          lake exe psc1_backend_rust_let_function_result_tests
          lake build psc1_backend_rust_fixture psc1_backend_rust_let_function_result_fixture psc1_backend_diff_fixture
          cd ..
          git diff --check
          git diff --stat

      - name: Commit audited test-only migration
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          while IFS= read -r file; do
            case "$file" in
              psc15selfhost/test/BackendRustTests.lean|\
              psc15selfhost/test/BackendRustLetFunctionResultTests.lean|\
              psc15selfhost/test/BackendRustFixture.lean|\
              psc15selfhost/test/BackendRustLetFunctionResultFixture.lean|\
              psc15selfhost/test/BackendDifferentialFixture.lean) ;;
              *) echo "unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/test/BackendRustTests.lean \
                  psc15selfhost/test/BackendRustLetFunctionResultTests.lean \
                  psc15selfhost/test/BackendRustFixture.lean \
                  psc15selfhost/test/BackendRustLetFunctionResultFixture.lean \
                  psc15selfhost/test/BackendDifferentialFixture.lean
          git commit -m "test(rust): migrate fixtures to typed VerifiedIR intrinsics"
          git push origin HEAD:psc2/kernel-core-phase1
