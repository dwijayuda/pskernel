name: Phase 13 declaration-batch portability

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-declaration-batch-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply current Phase 13 typed inductive-batch candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase13-inductive-batch-typed-finalize.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          pos = 0
          scripts = []
          while True:
              try:
                  start = workflow.index(start_marker, pos) + len(start_marker)
              except ValueError:
                  break
              end = workflow.index(end_marker, start)
              lines = workflow[start:end].splitlines()
              scripts.append('\n'.join(line[10:] if line.startswith('          ') else line for line in lines))
              pos = end + len(end_marker)
          if len(scripts) < 2:
              raise SystemExit(f'expected two typed-batch transforms, got {len(scripts)}')
          namespace = {'__name__': '__main__'}
          for index, script in enumerate(scripts[:2], 1):
              exec(compile(script, f'phase13-typed-batch-{index}.py', 'exec'), namespace, namespace)
          PY

      - name: Normalize declaration batch tail to PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean')
          text = path.read_text()

          def replace_decl(name, replacement):
              global text
              pattern = re.compile(
                  rf'^def {re.escape(name)}\b.*?(?=^(?:def|structure|inductive)\s|\Z)',
                  re.MULTILINE | re.DOTALL,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one declaration {name}, got {len(matches)}')
              match = matches[0]
              text = text[:match.start()] + replacement.rstrip() + '\n\n' + text[match.end():]

          batch_pattern = re.compile(
              r'^def psElabDeclarationBatch\b.*?(?=^(?:def|structure|inductive)\s|\Z)',
              re.MULTILINE | re.DOTALL,
          )
          batch_matches = list(batch_pattern.finditer(text))
          if len(batch_matches) != 1:
              raise SystemExit(f'expected one psElabDeclarationBatch, got {len(batch_matches)}')
          block = batch_matches[0].group(0)
          old_batch = 'Except.ok { declarations := [result.declaration] }'
          new_batch = 'Except.ok (PsElabDeclarationBatchResult.mk (List.cons result.declaration List.nil))'
          batch_count = block.count(old_batch)
          if batch_count != 1:
              raise SystemExit(f'expected one ordinary declaration batch result, got {batch_count}')
          block = block.replace(old_batch, new_batch, 1)
          text = text[:batch_matches[0].start()] + block + text[batch_matches[0].end():]

          old_reverse = 'psElabAppendDeclarations declarations.reverse declarationsRev'
          new_reverse = 'psElabAppendDeclarations (psElabListReverse declarations) declarationsRev'
          reverse_count = text.count(old_reverse)
          if reverse_count != 1:
              raise SystemExit(f'expected one batch reverse target, got {reverse_count}')
          text = text.replace(old_reverse, new_reverse, 1)

          replace_decl('psElabDeclarations', r'''def psElabDeclarationsWorker
              (declarations : List PsSyntaxDeclaration) :
              PsEnvironment ->
              List PsDeclaration ->
              Except PsElabError PsElabModuleResult :=
            match declarations with
            | List.nil =>
                fun (environment : PsEnvironment) =>
                  fun (declarationsRev : List PsDeclaration) =>
                    Except.ok
                      (PsElabModuleResult.mk
                        environment
                        (psElabListReverse declarationsRev))
            | List.cons source rest =>
                let smaller :
                    PsEnvironment ->
                    List PsDeclaration ->
                    Except PsElabError PsElabModuleResult :=
                  psElabDeclarationsWorker rest;
                fun (environment : PsEnvironment) =>
                  fun (declarationsRev : List PsDeclaration) =>
                    match psElabDeclarationBatch environment source with
                    | Except.error error => Except.error error
                    | Except.ok result =>
                        match psAddDeclarationList
                            environment
                            result.declarations with
                        | Except.error error => Except.error error
                        | Except.ok nextEnvironment =>
                            smaller
                              nextEnvironment
                              (psPrependBatchReverse
                                result.declarations
                                declarationsRev)

          def psElabDeclarations
              (environment : PsEnvironment)
              (declarations : List PsSyntaxDeclaration)
              (declarationsRev : List PsDeclaration) :
              Except PsElabError PsElabModuleResult :=
            psElabDeclarationsWorker
              declarations
              environment
              declarationsRev''')

          path.write_text(text)
          PY
          git diff --check -- \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean

      - name: Verify PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Commit only after full PSC1 bootstrap gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean
          git diff --cached --check
          git commit -m "fix(elab): close Phase 13 PSC1 portability"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
