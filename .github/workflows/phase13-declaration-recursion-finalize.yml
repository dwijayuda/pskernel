name: Phase 13 declaration recursion finalize

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-declaration-recursion-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply current Phase 13 declaration candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase13-declaration-portability-finalize.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          pos = 0
          scripts = []
          while True:
              try:
                  start = workflow.index(start_marker, pos) + len(start_marker)
              except ValueError:
                  break
              end = workflow.index(end_marker, start)
              lines = workflow[start:end].splitlines()
              scripts.append('\n'.join(line[10:] if line.startswith('          ') else line for line in lines))
              pos = end + len(end_marker)
          if len(scripts) < 2:
              raise SystemExit(f'expected two declaration candidate transforms, got {len(scripts)}')
          namespace = {'__name__': '__main__'}
          for index, script in enumerate(scripts[:2], 1):
              exec(compile(script, f'phase13-declaration-candidate-{index}.py', 'exec'), namespace, namespace)
          PY

      - name: Normalize declaration recursion to PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean')
          text = path.read_text()

          def replace_decl(name, replacement):
              global text
              pattern = re.compile(
                  rf'^def {re.escape(name)}\b.*?(?=^(?:def|structure|inductive)\s|\Z)',
                  re.MULTILINE | re.DOTALL,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one declaration {name}, got {len(matches)}')
              match = matches[0]
              text = text[:match.start()] + replacement.rstrip() + '\n\n' + text[match.end():]

          replace_decl('psExprListAlphaEq', r'''def psExprListAlphaEqWorker
              (left : List PsExpr) : List PsExpr -> Bool :=
            match left with
            | List.nil =>
                fun (right : List PsExpr) =>
                  match right with
                  | List.nil => true
                  | List.cons _ _ => false
            | List.cons leftExpr leftRest =>
                let smaller : List PsExpr -> Bool :=
                  psExprListAlphaEqWorker leftRest;
                fun (right : List PsExpr) =>
                  match right with
                  | List.nil => false
                  | List.cons rightExpr rightRest =>
                      if psExprAlphaEq leftExpr rightExpr then
                        smaller rightRest
                      else
                        false

          def psExprListAlphaEq
              (left : List PsExpr)
              (right : List PsExpr) : Bool :=
            psExprListAlphaEqWorker left right''')

          replace_decl('psElabInductiveConstructors', r'''def psElabInductiveConstructorsWorker
              (context : PsElabContext)
              (parameterBindersRev : List PsElabTypedBinder)
              (inductiveName : PsName)
              (sources : List PsSyntaxInductiveConstructor) :
              Nat ->
              List PsDeclaration ->
              Except PsElabError (List PsDeclaration) :=
            match sources with
            | List.nil =>
                fun (_index : Nat) =>
                  fun (declarationsRev : List PsDeclaration) =>
                    Except.ok (psElabListReverse declarationsRev)
            | List.cons source rest =>
                let smaller :
                    Nat ->
                    List PsDeclaration ->
                    Except PsElabError (List PsDeclaration) :=
                  psElabInductiveConstructorsWorker
                    context
                    parameterBindersRev
                    inductiveName
                    rest;
                fun (index : Nat) =>
                  fun (declarationsRev : List PsDeclaration) =>
                    match psElabInductiveConstructor
                        context
                        parameterBindersRev
                        inductiveName
                        source with
                    | Except.error error => Except.error error
                    | Except.ok declaration =>
                        smaller
                          (Nat.succ index)
                          (List.cons
                            (psSetConstructorIndex index declaration)
                            declarationsRev)

          def psElabInductiveConstructors
              (context : PsElabContext)
              (parameterBindersRev : List PsElabTypedBinder)
              (inductiveName : PsName)
              (index : Nat)
              (sources : List PsSyntaxInductiveConstructor)
              (declarationsRev : List PsDeclaration) :
              Except PsElabError (List PsDeclaration) :=
            psElabInductiveConstructorsWorker
              context
              parameterBindersRev
              inductiveName
              sources
              index
              declarationsRev''')

          replace_decl('psWrapRecursiveHypotheses', r'''def psWrapRecursiveHypothesesWorker
              (motiveId : Nat)
              (fieldArgs : List PsExpr)
              (fieldIndices : List Nat) :
              PsExpr -> Except PsElabError PsExpr :=
            match fieldIndices with
            | List.nil =>
                fun (body : PsExpr) => Except.ok body
            | List.cons fieldIndex rest =>
                let smaller : PsExpr -> Except PsElabError PsExpr :=
                  psWrapRecursiveHypothesesWorker
                    motiveId
                    fieldArgs
                    rest;
                fun (body : PsExpr) =>
                  match psElabExprAt fieldArgs fieldIndex with
                  | none => Except.error PsElabError.unsupportedTerm
                  | some recursiveValue =>
                      match smaller body with
                      | Except.error error => Except.error error
                      | Except.ok inner =>
                          Except.ok
                            (PsExpr.forallE
                              (psNameAppendNum
                                (psRootName "_ih")
                                fieldIndex)
                              (PsExpr.app
                                (PsExpr.fvar motiveId)
                                recursiveValue)
                              inner
                              PsBinderInfo.explicit)

          def psWrapRecursiveHypotheses
              (motiveId : Nat)
              (fieldArgs : List PsExpr)
              (fieldIndices : List Nat)
              (body : PsExpr) : Except PsElabError PsExpr :=
            psWrapRecursiveHypothesesWorker
              motiveId
              fieldArgs
              fieldIndices
              body''')

          path.write_text(text)
          PY
          git diff --check -- \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean

      - name: Verify PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Commit only after full PSC1 bootstrap gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean
          git diff --cached --check
          git commit -m "fix(elab): close Phase 13 PSC1 portability"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
