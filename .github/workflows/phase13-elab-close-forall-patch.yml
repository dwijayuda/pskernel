name: Phase 13 elaborator portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-elab-close-forall-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make Phase 13 elaborator PSC1-portable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          replacements = [
              ("match elaborate context condition (some boolType) with",
               "match elaborate context condition (Option.some boolType) with"),
              ("thenResult.context\n              elseBranch\n              (some resultType) with",
               "thenResult.context\n              elseBranch\n              (Option.some resultType) with"),
              ("| Except.ok thenResult =>\n          let resultType :=\n            match expected with",
               "| Except.ok thenResult =>\n          let resultType : PsExpr :=\n            match expected with"),
              (
                  "def psExprAppViewAcc\n"
                  "    (expr : PsExpr)\n"
                  "    (args : List PsExpr) : PsExprAppView :=\n"
                  "  match expr with\n"
                  "  | .app fn argument =>\n"
                  "      psExprAppViewAcc fn (List.cons argument args)\n"
                  "  | _ => {\n"
                  "      head := expr\n"
                  "      args := args\n"
                  "    }\n",
                  "def psExprAppViewAcc\n"
                  "    (expr : PsExpr) : List PsExpr -> PsExprAppView :=\n"
                  "  match expr with\n"
                  "  | .app fn argument =>\n"
                  "      let smaller : List PsExpr -> PsExprAppView :=\n"
                  "        psExprAppViewAcc fn;\n"
                  "      fun (args : List PsExpr) =>\n"
                  "        smaller (List.cons argument args)\n"
                  "  | _ =>\n"
                  "      fun (args : List PsExpr) => {\n"
                  "        head := expr\n"
                  "        args := args\n"
                  "      }\n",
              ),
              (
                  "def psExprHasConst (target : PsName) : PsExpr -> Bool\n"
                  "  | .constE name _ => psNameEq name target\n"
                  "  | .app fn argument =>\n"
                  "      psElabBoolOr\n"
                  "        (psExprHasConst target fn)\n"
                  "        (psExprHasConst target argument)\n"
                  "  | .lam _ type body _ =>\n"
                  "      psElabBoolOr\n"
                  "        (psExprHasConst target type)\n"
                  "        (psExprHasConst target body)\n"
                  "  | .forallE _ type body _ =>\n"
                  "      psElabBoolOr\n"
                  "        (psExprHasConst target type)\n"
                  "        (psExprHasConst target body)\n"
                  "  | .letE _ type value body =>\n"
                  "      psElabBoolOr\n"
                  "        (psExprHasConst target type)\n"
                  "        (psElabBoolOr\n"
                  "          (psExprHasConst target value)\n"
                  "          (psExprHasConst target body))\n"
                  "  | .proj _ _ value => psExprHasConst target value\n"
                  "  | _ => false\n",
                  "def psExprHasConstWorker\n"
                  "    (expr : PsExpr) : PsName -> Bool :=\n"
                  "  match expr with\n"
                  "  | .constE name _ =>\n"
                  "      fun (target : PsName) => psNameEq name target\n"
                  "  | .app fn argument =>\n"
                  "      let left : PsName -> Bool := psExprHasConstWorker fn;\n"
                  "      let right : PsName -> Bool := psExprHasConstWorker argument;\n"
                  "      fun (target : PsName) => psElabBoolOr (left target) (right target)\n"
                  "  | .lam _ type body _ =>\n"
                  "      let left : PsName -> Bool := psExprHasConstWorker type;\n"
                  "      let right : PsName -> Bool := psExprHasConstWorker body;\n"
                  "      fun (target : PsName) => psElabBoolOr (left target) (right target)\n"
                  "  | .forallE _ type body _ =>\n"
                  "      let left : PsName -> Bool := psExprHasConstWorker type;\n"
                  "      let right : PsName -> Bool := psExprHasConstWorker body;\n"
                  "      fun (target : PsName) => psElabBoolOr (left target) (right target)\n"
                  "  | .letE _ type value body =>\n"
                  "      let typeHas : PsName -> Bool := psExprHasConstWorker type;\n"
                  "      let valueHas : PsName -> Bool := psExprHasConstWorker value;\n"
                  "      let bodyHas : PsName -> Bool := psExprHasConstWorker body;\n"
                  "      fun (target : PsName) =>\n"
                  "        psElabBoolOr (typeHas target) (psElabBoolOr (valueHas target) (bodyHas target))\n"
                  "  | .proj _ _ value =>\n"
                  "      let valueHas : PsName -> Bool := psExprHasConstWorker value;\n"
                  "      fun (target : PsName) => valueHas target\n"
                  "  | _ => fun (_target : PsName) => false\n"
                  "\n"
                  "def psExprHasConst\n"
                  "    (target : PsName)\n"
                  "    (expr : PsExpr) : Bool :=\n"
                  "  psExprHasConstWorker expr target\n",
              ),
              (
                  "def psMatchNameListContains (names : List PsName) (target : PsName) : Bool :=\n"
                  "  List.any names (psMatchNameEqTarget target)\n",
                  "def psMatchNameListContains\n"
                  "    (names : List PsName) : PsName -> Bool :=\n"
                  "  match names with\n"
                  "  | [] => fun (_target : PsName) => false\n"
                  "  | name :: rest =>\n"
                  "      let smaller : PsName -> Bool := psMatchNameListContains rest;\n"
                  "      fun (target : PsName) =>\n"
                  "        if psNameEq name target then true else smaller target\n",
              ),
              (
                  "def psElabMatchAlternativeFind\n"
                  "    (name : PsName) :\n"
                  "    List PsElabMatchAlternative -> Option PsElabMatchAlternative\n"
                  "  | [] => none\n"
                  "  | alternative :: rest =>\n"
                  "      if psNameEq alternative.constructorName name then\n"
                  "        some alternative\n"
                  "      else\n"
                  "        psElabMatchAlternativeFind name rest\n",
                  "def psElabMatchAlternativeFindWorker\n"
                  "    (alternatives : List PsElabMatchAlternative) :\n"
                  "    PsName -> Option PsElabMatchAlternative :=\n"
                  "  match alternatives with\n"
                  "  | [] => fun (_name : PsName) => Option.none\n"
                  "  | alternative :: rest =>\n"
                  "      let smaller : PsName -> Option PsElabMatchAlternative :=\n"
                  "        psElabMatchAlternativeFindWorker rest;\n"
                  "      fun (name : PsName) =>\n"
                  "        if psNameEq alternative.constructorName name then\n"
                  "          Option.some alternative\n"
                  "        else smaller name\n"
                  "\n"
                  "def psElabMatchAlternativeFind\n"
                  "    (name : PsName)\n"
                  "    (alternatives : List PsElabMatchAlternative) :\n"
                  "    Option PsElabMatchAlternative :=\n"
                  "  psElabMatchAlternativeFindWorker alternatives name\n",
              ),
              (
                  "def psElabFillWildcardAlternatives\n"
                  "    (pattern : PsSyntaxPattern)\n"
                  "    (body : PsSyntaxTerm)\n"
                  "    (span : PsSourceSpan)\n"
                  "    (constructors : List PsName)\n"
                  "    (alternativesRev : List PsElabMatchAlternative) :\n"
                  "    List PsElabMatchAlternative :=\n"
                  "  match constructors with\n"
                  "  | [] =>\n"
                  "      alternativesRev\n"
                  "  | ctorName :: rest =>\n"
                  "      let next :=\n"
                  "        match psElabMatchAlternativeFind ctorName alternativesRev with\n"
                  "        | some _ => alternativesRev\n"
                  "        | none =>\n"
                  "            let alternative : PsElabMatchAlternative := {\n"
                  "              constructorName := ctorName\n"
                  "              pattern := pattern\n"
                  "              body := body\n"
                  "              span := span\n"
                  "            };\n"
                  "            List.cons alternative alternativesRev;\n"
                  "      psElabFillWildcardAlternatives\n"
                  "        pattern body span rest next\n",
                  "def psElabFillWildcardAlternativesWorker\n"
                  "    (constructors : List PsName) :\n"
                  "    PsSyntaxPattern -> PsSyntaxTerm -> PsSourceSpan ->\n"
                  "    List PsElabMatchAlternative -> List PsElabMatchAlternative :=\n"
                  "  match constructors with\n"
                  "  | [] =>\n"
                  "      fun (_pattern : PsSyntaxPattern) => fun (_body : PsSyntaxTerm) =>\n"
                  "        fun (_span : PsSourceSpan) => fun (alternativesRev : List PsElabMatchAlternative) =>\n"
                  "          alternativesRev\n"
                  "  | ctorName :: rest =>\n"
                  "      let smaller := psElabFillWildcardAlternativesWorker rest;\n"
                  "      fun (pattern : PsSyntaxPattern) => fun (body : PsSyntaxTerm) =>\n"
                  "        fun (span : PsSourceSpan) => fun (alternativesRev : List PsElabMatchAlternative) =>\n"
                  "          let next : List PsElabMatchAlternative :=\n"
                  "            match psElabMatchAlternativeFind ctorName alternativesRev with\n"
                  "            | some _ => alternativesRev\n"
                  "            | none =>\n"
                  "                let alternative : PsElabMatchAlternative := {\n"
                  "                  constructorName := ctorName\n"
                  "                  pattern := pattern\n"
                  "                  body := body\n"
                  "                  span := span\n"
                  "                };\n"
                  "                List.cons alternative alternativesRev;\n"
                  "          smaller pattern body span next\n"
                  "\n"
                  "def psElabFillWildcardAlternatives\n"
                  "    (pattern : PsSyntaxPattern)\n"
                  "    (body : PsSyntaxTerm)\n"
                  "    (span : PsSourceSpan)\n"
                  "    (constructors : List PsName)\n"
                  "    (alternativesRev : List PsElabMatchAlternative) :\n"
                  "    List PsElabMatchAlternative :=\n"
                  "  psElabFillWildcardAlternativesWorker constructors pattern body span alternativesRev\n",
              ),
              (
                  "def psElabPrepareMatchAlternatives\n"
                  "    (inductiveInfo : PsInductiveInfo)\n"
                  "    (entries : List (Prod PsSyntaxPattern (Prod PsSyntaxTerm PsSourceSpan)))\n"
                  "    (alternativesRev : List PsElabMatchAlternative) :\n"
                  "    Except PsElabError (List PsElabMatchAlternative) :=\n"
                  "  match entries with\n"
                  "  | [] =>\n"
                  "      let alternatives := psElabListReverse alternativesRev;\n"
                  "      let exhaustive :=\n"
                  "        List.all\n"
                  "          inductiveInfo.constructors\n"
                  "          (psElabMatchAlternativeCovered alternatives);\n"
                  "      if exhaustive then\n"
                  "        Except.ok alternatives\n"
                  "      else\n"
                  "        Except.error PsElabError.matchNonExhaustive\n"
                  "  | entry :: rest =>\n"
                  "      let pattern := Prod.fst entry;\n"
                  "      let payload := Prod.snd entry;\n"
                  "      let body := Prod.fst payload;\n"
                  "      let span := Prod.snd payload;\n"
                  "      match pattern with\n"
                  "      | .wildcard _ =>\n"
                  "          if List.isEmpty rest then\n"
                  "            Except.ok\n"
                  "              (psElabListReverse (psElabFillWildcardAlternatives\n"
                  "                pattern body span inductiveInfo.constructors alternativesRev))\n"
                  "          else\n"
                  "            Except.error PsElabError.matchPatternUnsupported\n"
                  "      | _ =>\n"
                  "          match psElabMatchPatternConstructorName inductiveInfo.name pattern with\n"
                  "          | Except.error error => Except.error error\n"
                  "          | Except.ok ctorName =>\n"
                  "              if psElabBoolNot (psMatchNameListContains inductiveInfo.constructors ctorName) then\n"
                  "                Except.error (PsElabError.matchConstructorUnknown ctorName)\n"
                  "              else\n"
                  "                match psElabMatchAlternativeFind ctorName alternativesRev with\n"
                  "                | some _ =>\n"
                  "                    Except.error (PsElabError.matchDuplicateConstructor ctorName)\n"
                  "                | none =>\n"
                  "                    let alternative : PsElabMatchAlternative := {\n"
                  "                      constructorName := ctorName\n"
                  "                      pattern := pattern\n"
                  "                      body := body\n"
                  "                      span := span\n"
                  "                    };\n"
                  "                    psElabPrepareMatchAlternatives\n"
                  "                      inductiveInfo rest (List.cons alternative alternativesRev)\n",
                  "def psElabAllMatchAlternativesCovered\n"
                  "    (constructors : List PsName) : List PsElabMatchAlternative -> Bool :=\n"
                  "  match constructors with\n"
                  "  | [] => fun (_alternatives : List PsElabMatchAlternative) => true\n"
                  "  | ctorName :: rest =>\n"
                  "      let smaller : List PsElabMatchAlternative -> Bool :=\n"
                  "        psElabAllMatchAlternativesCovered rest;\n"
                  "      fun (alternatives : List PsElabMatchAlternative) =>\n"
                  "        if psElabMatchAlternativeCovered alternatives ctorName then\n"
                  "          smaller alternatives\n"
                  "        else false\n"
                  "\n"
                  "def psElabPrepareMatchAlternativesWorker\n"
                  "    (entries : List (Prod PsSyntaxPattern (Prod PsSyntaxTerm PsSourceSpan))) :\n"
                  "    PsInductiveInfo -> List PsElabMatchAlternative ->\n"
                  "    Except PsElabError (List PsElabMatchAlternative) :=\n"
                  "  match entries with\n"
                  "  | [] =>\n"
                  "      fun (inductiveInfo : PsInductiveInfo) => fun (alternativesRev : List PsElabMatchAlternative) =>\n"
                  "        let alternatives : List PsElabMatchAlternative := psElabListReverse alternativesRev;\n"
                  "        if psElabAllMatchAlternativesCovered inductiveInfo.constructors alternatives then\n"
                  "          Except.ok alternatives\n"
                  "        else Except.error PsElabError.matchNonExhaustive\n"
                  "  | entry :: rest =>\n"
                  "      let smaller := psElabPrepareMatchAlternativesWorker rest;\n"
                  "      fun (inductiveInfo : PsInductiveInfo) => fun (alternativesRev : List PsElabMatchAlternative) =>\n"
                  "        let pattern := Prod.fst entry;\n"
                  "        let payload := Prod.snd entry;\n"
                  "        let body := Prod.fst payload;\n"
                  "        let span := Prod.snd payload;\n"
                  "        match pattern with\n"
                  "        | .wildcard _ =>\n"
                  "            match rest with\n"
                  "            | [] =>\n"
                  "                Except.ok (psElabListReverse (psElabFillWildcardAlternatives\n"
                  "                  pattern body span inductiveInfo.constructors alternativesRev))\n"
                  "            | _ :: _ => Except.error PsElabError.matchPatternUnsupported\n"
                  "        | _ =>\n"
                  "            match psElabMatchPatternConstructorName inductiveInfo.name pattern with\n"
                  "            | Except.error error => Except.error error\n"
                  "            | Except.ok ctorName =>\n"
                  "                if psElabBoolNot (psMatchNameListContains inductiveInfo.constructors ctorName) then\n"
                  "                  Except.error (PsElabError.matchConstructorUnknown ctorName)\n"
                  "                else\n"
                  "                  match psElabMatchAlternativeFind ctorName alternativesRev with\n"
                  "                  | some _ => Except.error (PsElabError.matchDuplicateConstructor ctorName)\n"
                  "                  | none =>\n"
                  "                      let alternative : PsElabMatchAlternative := {\n"
                  "                        constructorName := ctorName\n"
                  "                        pattern := pattern\n"
                  "                        body := body\n"
                  "                        span := span\n"
                  "                      };\n"
                  "                      smaller inductiveInfo (List.cons alternative alternativesRev)\n"
                  "\n"
                  "def psElabPrepareMatchAlternatives\n"
                  "    (inductiveInfo : PsInductiveInfo)\n"
                  "    (entries : List (Prod PsSyntaxPattern (Prod PsSyntaxTerm PsSourceSpan)))\n"
                  "    (alternativesRev : List PsElabMatchAlternative) :\n"
                  "    Except PsElabError (List PsElabMatchAlternative) :=\n"
                  "  psElabPrepareMatchAlternativesWorker entries inductiveInfo alternativesRev\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one portability target, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean

      - name: Verify PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Commit verified portability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make Phase 13 bootstrap closure PSC1-portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
