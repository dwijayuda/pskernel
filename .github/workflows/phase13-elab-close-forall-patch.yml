name: Phase 13 elaborator forall Option portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-elab-close-forall-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Qualify forall body expected Option
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          old = '      match elaborate binderResult.context body none with\n'
          new = '      match elaborate binderResult.context body Option.none with\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one psElabForall bare-none call, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): qualify forall Option for PSC1"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
