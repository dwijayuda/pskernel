name: Phase 13 elaborator apply-many portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-elab-close-forall-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Curry apply-many accumulator behind recursive list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          old = '''def psExprApplyMany
    (fn : PsExpr)
    (arguments : List PsExpr) : PsExpr :=
  match arguments with
  | [] =>
      fn
  | argument :: rest =>
      psExprApplyMany
        (PsExpr.app fn argument)
        rest
'''
          new = '''def psExprApplyManyWorker
    (arguments : List PsExpr) : PsExpr -> PsExpr :=
  match arguments with
  | [] =>
      fun (fn : PsExpr) => fn
  | argument :: rest =>
      let smaller : PsExpr -> PsExpr :=
        psExprApplyManyWorker rest;
      fun (fn : PsExpr) =>
        smaller (PsExpr.app fn argument)

def psExprApplyMany
    (fn : PsExpr)
    (arguments : List PsExpr) : PsExpr :=
  psExprApplyManyWorker arguments fn
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one psExprApplyMany block, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): curry apply-many accumulator for PSC1"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
