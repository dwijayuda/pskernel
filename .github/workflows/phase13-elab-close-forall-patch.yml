name: Phase 13 elaborator portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-elab-close-forall-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make Phase 13 elaborator PSC1-portable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          replacements = [
              (
                  "match elaborate context condition (some boolType) with",
                  "match elaborate context condition (Option.some boolType) with",
              ),
              (
                  "thenResult.context\n              elseBranch\n              (some resultType) with",
                  "thenResult.context\n              elseBranch\n              (Option.some resultType) with",
              ),
              (
                  "| Except.ok thenResult =>\n          let resultType :=\n            match expected with",
                  "| Except.ok thenResult =>\n          let resultType : PsExpr :=\n            match expected with",
              ),
              (
                  "def psExprAppViewAcc\n"
                  "    (expr : PsExpr)\n"
                  "    (args : List PsExpr) : PsExprAppView :=\n"
                  "  match expr with\n"
                  "  | .app fn argument =>\n"
                  "      psExprAppViewAcc fn (List.cons argument args)\n"
                  "  | _ => {\n"
                  "      head := expr\n"
                  "      args := args\n"
                  "    }\n",
                  "def psExprAppViewAcc\n"
                  "    (expr : PsExpr) : List PsExpr -> PsExprAppView :=\n"
                  "  match expr with\n"
                  "  | .app fn argument =>\n"
                  "      let smaller : List PsExpr -> PsExprAppView :=\n"
                  "        psExprAppViewAcc fn;\n"
                  "      fun (args : List PsExpr) =>\n"
                  "        smaller (List.cons argument args)\n"
                  "  | _ =>\n"
                  "      fun (args : List PsExpr) => {\n"
                  "        head := expr\n"
                  "        args := args\n"
                  "      }\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one portability target, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean

      - name: Verify PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Commit verified portability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make Phase 13 bootstrap closure PSC1-portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
