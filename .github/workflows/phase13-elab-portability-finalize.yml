name: Phase 13 elaborator portability finalize

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-elab-portability-finalize.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply verified portability normalization plus portable constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/phase13-elab-close-forall-patch.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          namespace = {'__name__': '__main__'}
          exec(compile(script, 'phase13-portability-normalize.py', 'exec'), namespace, namespace)

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()

          def replace_decl(name, replacement):
              global text
              pattern = re.compile(
                  rf'^def {re.escape(name)}\b.*?(?=^(?:def|structure|inductive)\s|\Z)',
                  re.MULTILINE | re.DOTALL,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one declaration {name}, got {len(matches)}')
              text = text[:matches[0].start()] + replacement.rstrip() + '\n\n' + text[matches[0].end():]

          old = 'String.Internal.append "_wild" (toString index)'
          new = 'String.Internal.append "_wild" (psNatToString index)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one wildcard Nat-render target, got {count}')
          text = text.replace(old, new, 1)

          old = '[resultLevel]'
          new = 'List.cons resultLevel List.nil'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one recursor-level singleton target, got {count}')
          text = text.replace(old, new, 1)

          # List.append is not part of the PSC1 bootstrap environment. Keep the
          # bootstrap surface small by using a local structural helper instead.
          helper_marker = '\ndef psSyntaxNameAppendSegments\n'
          if text.count(helper_marker) != 1:
              raise SystemExit('expected one helper insertion marker')
          helper = '\n'.join([
              '',
              'def psElabListAppend {α : Type}',
              '    (left : List α) : List α -> List α :=',
              '  match left with',
              '  | [] =>',
              '      fun (right : List α) => right',
              '  | head :: tail =>',
              '      let smaller : List α -> List α :=',
              '        psElabListAppend tail;',
              '      fun (right : List α) =>',
              '        List.cons head (smaller right)',
              '',
          ])
          text = text.replace(helper_marker, helper + helper_marker, 1)

          match_pattern = re.compile(
              r'^def psElabMatch\b.*?(?=^(?:def|structure|inductive)\s|\Z)',
              re.MULTILINE | re.DOTALL,
          )
          matches = list(match_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one psElabMatch declaration, got {len(matches)}')
          match_block = matches[0].group(0)
          append_count = match_block.count('List.append')
          if append_count != 2:
              raise SystemExit(f'expected two List.append uses in psElabMatch, got {append_count}')
          match_block = match_block.replace('List.append', 'psElabListAppend')
          text = text[:matches[0].start()] + match_block + text[matches[0].end():]

          replace_decl('psElabApplyArgsWithFuel', r'''def psElabApplyArgsWithFuelWorker
              (remainingFuel : Nat) :
              (PsElabContext -> PsSyntaxTerm -> Option PsExpr -> Except PsElabError PsElabTermResult) ->
              PsElabTermResult ->
              List PsSyntaxTerm ->
              List Nat ->
              Except PsElabError PsElabApplicationResult :=
            match remainingFuel with
            | 0 =>
                fun (_elaborate : PsElabContext -> PsSyntaxTerm -> Option PsExpr -> Except PsElabError PsElabTermResult) =>
                  fun (_current : PsElabTermResult) =>
                    fun (_arguments : List PsSyntaxTerm) =>
                      fun (_pendingInstancesRev : List Nat) =>
                        Except.error PsElabError.fuelExhausted
            | fuel + 1 =>
                let smaller := psElabApplyArgsWithFuelWorker fuel;
                fun (elaborate : PsElabContext -> PsSyntaxTerm -> Option PsExpr -> Except PsElabError PsElabTermResult) =>
                  fun (current : PsElabTermResult) =>
                    fun (arguments : List PsSyntaxTerm) =>
                      fun (pendingInstancesRev : List Nat) =>
                        let currentType : PsExpr :=
                          psWhnf
                            current.context.environment
                            current.context.metaContext
                            current.context.localContext
                            current.type;
                        match currentType with
                        | PsExpr.forallE _ domain body binder =>
                            if psBinderAcceptsExplicitArgument binder then
                              match arguments with
                              | [] =>
                                  Except.ok {
                                    result := current
                                    pendingInstancesRev := pendingInstancesRev
                                  }
                              | argument :: rest =>
                                  match elaborate current.context argument (Option.some domain) with
                                  | Except.error error => Except.error error
                                  | Except.ok elaboratedArgument =>
                                      let nextTerm :=
                                        PsExpr.app current.term elaboratedArgument.term;
                                      let nextType :=
                                        psExprInstantiate1 body elaboratedArgument.term;
                                      let nextResult : PsElabTermResult := {
                                        context := elaboratedArgument.context
                                        term := nextTerm
                                        type := nextType
                                      };
                                      smaller
                                        elaborate
                                        nextResult
                                        rest
                                        pendingInstancesRev
                            else if
                                psElabBoolAnd
                                  (psBinderIsStrictImplicit binder)
                                  (psSyntaxTermListIsEmpty arguments) then
                              Except.ok {
                                result := current
                                pendingInstancesRev := pendingInstancesRev
                              }
                            else
                              let kind : PsMetaVarKind :=
                                if psBinderIsInstanceImplicit binder then
                                  PsMetaVarKind.synthetic
                                else
                                  PsMetaVarKind.natural;
                              let fresh :=
                                psMetaFresh
                                  current.context.metaContext
                                  current.context.localContext
                                  domain
                                  kind;
                              let nextContext :=
                                psElabContextWithMeta current.context fresh.context;
                              let nextResult : PsElabTermResult := {
                                context := nextContext
                                term := PsExpr.app current.term fresh.expr
                                type := psExprInstantiate1 body fresh.expr
                              };
                              let nextPending : List Nat :=
                                if psBinderIsInstanceImplicit binder then
                                  match fresh.expr with
                                  | PsExpr.mvar id => List.cons id pendingInstancesRev
                                  | _ => pendingInstancesRev
                                else
                                  pendingInstancesRev;
                              smaller elaborate nextResult arguments nextPending
                        | _ =>
                            if psSyntaxTermListIsEmpty arguments then
                              Except.ok {
                                result := current
                                pendingInstancesRev := pendingInstancesRev
                              }
                            else
                              Except.error
                                (PsElabError.infer PsInferError.expectedFunction)

          def psElabApplyArgsWithFuel
              (elaborate :
                PsElabContext ->
                PsSyntaxTerm ->
                Option PsExpr ->
                Except PsElabError PsElabTermResult)
              (remainingFuel : Nat)
              (current : PsElabTermResult)
              (arguments : List PsSyntaxTerm)
              (pendingInstancesRev : List Nat) :
              Except PsElabError PsElabApplicationResult :=
            psElabApplyArgsWithFuelWorker
              remainingFuel
              elaborate
              current
              arguments
              pendingInstancesRev''')

          replace_decl('psElabSolvePendingInstances', r'''def psElabSolvePendingInstancesWorker
              (pendingInstances : List Nat) :
              PsElabTermResult -> Except PsElabError PsElabTermResult :=
            match pendingInstances with
            | [] =>
                fun (current : PsElabTermResult) =>
                  let metaContext := current.context.metaContext;
                  Except.ok {
                    context := current.context
                    term := psMetaInstantiate metaContext current.term
                    type := psMetaInstantiate metaContext current.type
                  }
            | id :: rest =>
                let smaller : PsElabTermResult -> Except PsElabError PsElabTermResult :=
                  psElabSolvePendingInstancesWorker rest;
                fun (current : PsElabTermResult) =>
                  let metaContext := current.context.metaContext;
                  match psMetaFindAssignment metaContext id with
                  | some _ => smaller current
                  | none =>
                      match psMetaFindDecl metaContext id with
                      | none =>
                          Except.error PsElabError.implicitApplicationUnsupported
                      | some declaration =>
                          let target := psMetaInstantiate metaContext declaration.type;
                          if psExprHasUnresolvedMeta target then
                            Except.error PsElabError.implicitApplicationUnsupported
                          else
                            let synthesized :=
                              psSynthInstance
                                current.context.environment
                                current.context.localContext
                                current.context.instances
                                metaContext
                                target;
                            match synthesized.value with
                            | none =>
                                Except.error PsElabError.implicitApplicationUnsupported
                            | some value =>
                                match psMetaAssign synthesized.context id value with
                                | none =>
                                    Except.error PsElabError.implicitApplicationUnsupported
                                | some assigned =>
                                    let assignedResult : PsElabTermResult := {
                                      context := psElabContextWithMeta current.context assigned
                                      term := current.term
                                      type := current.type
                                    };
                                    smaller assignedResult

          def psElabSolvePendingInstances
              (current : PsElabTermResult)
              (pendingInstances : List Nat) :
              Except PsElabError PsElabTermResult :=
            psElabSolvePendingInstancesWorker pendingInstances current''')

          # PSC1 resolves constructors in patterns, but expression-position Option
          # constructors in this closure must be explicit. Qualifying them is
          # semantics-preserving and avoids widening PSC1 name resolution.
          some_re = re.compile(r'(?<!Option\.)\bsome\b')
          none_re = re.compile(r'(?<!Option\.)\bnone\b')
          qualified = []
          for line in text.splitlines():
              stripped = line.lstrip()
              if stripped.startswith('|'):
                  before, sep, after = line.partition('=>')
                  if sep:
                      after = some_re.sub('Option.some', after)
                      after = none_re.sub('Option.none', after)
                      line = before + sep + after
              else:
                  line = some_re.sub('Option.some', line)
                  line = none_re.sub('Option.none', line)
              qualified.append(line)
          text = '\n'.join(qualified) + ('\n' if text.endswith('\n') else '')
          path.write_text(text)

          # Diagnostic only: pattern-position constructors are intentionally bare.
          for line_no, line in enumerate(text.splitlines(), 1):
              stripped = line.lstrip()
              if stripped.startswith('|'):
                  continue
              if some_re.search(line) or none_re.search(line):
                  print(f'unqualified Option candidate {line_no}: {line}')
          PY
          git diff --check -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean

      - name: Verify PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Commit only after full PSC1 bootstrap gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): normalize Phase 13 bootstrap closure for PSC1"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
