name: Phase 13 one-shot portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - .github/workflows/phase13-one-shot-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-work

      - name: Curry lambda-expected recursion for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabLambdaExpectedBody\n'
          end_marker = '\ndef psElabLambdaBodyExpected\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new = base64.b64decode('').decode()
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): curry lambda expectation recursion for PSC1"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-work
