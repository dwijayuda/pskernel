name: Phase 13 qualify match-alternative Option constructors

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-altfind-option-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Qualify Option constructors returned by psElabMatchAlternativeFind
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabMatchAlternativeFind\n'
          end_marker = '\ndef psElabMatchAlternativeCovered\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          if block.count('| [] => none') != 1:
              raise SystemExit('expected one unqualified none return in psElabMatchAlternativeFind')
          if block.count('        some alternative') != 1:
              raise SystemExit('expected one unqualified some return in psElabMatchAlternativeFind')
          block = block.replace('| [] => none', '| [] => Option.none', 1)
          block = block.replace('        some alternative', '        Option.some alternative', 1)
          path.write_text(text[:start] + block + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): qualify match alternative Option returns"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
