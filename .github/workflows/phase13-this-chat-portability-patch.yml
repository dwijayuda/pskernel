name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Use portable Nat formatting for wildcard binders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabWildcardBinderNames\n'
          end_marker = '\ndef psElabMatchConstructorMinor\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          needle = 'String.Internal.append "_wild" (toString index)'
          replacement = 'String.Internal.append "_wild" (psNatToString index)'
          if needle not in old:
              raise SystemExit('unexpected psElabWildcardBinderNames source shape')
          new = old.replace(needle, replacement, 1)
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): use portable Nat string conversion"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
