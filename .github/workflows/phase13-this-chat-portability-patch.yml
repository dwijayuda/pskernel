name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Reshape wildcard binder recursion for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabWildcardBinderNames\n'
          end_marker = '\ndef psElabMatchConstructorMinor\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if 'psElabWildcardBinderNames' not in old or '(Nat.succ index)' not in old or 'psNatToString index' not in old:
              raise SystemExit('unexpected psElabWildcardBinderNames source shape')
          new = '''def psElabWildcardBinderNamesWorker
              (remaining : Nat) :
              PsSourceSpan -> Nat -> List PsSyntaxName :=
            match remaining with
            | 0 =>
                fun (_span : PsSourceSpan) =>
                  fun (_index : Nat) => []
            | nextRemaining + 1 =>
                let smaller : PsSourceSpan -> Nat -> List PsSyntaxName :=
                  psElabWildcardBinderNamesWorker nextRemaining;
                fun (span : PsSourceSpan) =>
                  fun (index : Nat) =>
                    let segment :=
                      String.Internal.append "_wild" (psNatToString index);
                    let syntaxName : PsSyntaxName := {
                      segments := List.cons segment List.nil
                      span := span
                    };
                    List.cons
                      syntaxName
                      (smaller span (Nat.succ index))

          def psElabWildcardBinderNames
              (span : PsSourceSpan)
              (index : Nat)
              (remaining : Nat) :
              List PsSyntaxName :=
            psElabWildcardBinderNamesWorker remaining span index
          '''
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make wildcard binder generation PSC1 portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
