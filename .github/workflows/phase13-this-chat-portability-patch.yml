name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Reshape match minors recursion for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabMatchMinors\n'
          end_marker = '\ndef psElabMatch\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if 'psElabMatchMinors' not in old or 'minor.context' not in old or 'ctorName :: rest' not in old:
              raise SystemExit('unexpected psElabMatchMinors source shape')
          new = '''def psElabMatchMinorsWorker
              (constructorNames : List PsName) :
              (PsElabContext ->
                PsSyntaxTerm ->
                Option PsExpr ->
                Except PsElabError PsElabTermResult) ->
              PsInductiveInfo ->
              List PsLevel ->
              List PsExpr ->
              PsExpr ->
              List PsElabMatchAlternative ->
              PsElabContext ->
              Except PsElabError PsElabMatchMinorsResult :=
            match constructorNames with
            | [] =>
                fun (_elaborate :
                    PsElabContext ->
                    PsSyntaxTerm ->
                    Option PsExpr ->
                    Except PsElabError PsElabTermResult) =>
                  fun (_inductiveInfo : PsInductiveInfo) =>
                    fun (_inductiveLevels : List PsLevel) =>
                      fun (_parameterArgs : List PsExpr) =>
                        fun (_expectedType : PsExpr) =>
                          fun (_alternatives : List PsElabMatchAlternative) =>
                            fun (context : PsElabContext) =>
                              Except.ok {
                                context := context
                                minors := []
                              }
            | ctorName :: rest =>
                let smaller :
                    (PsElabContext ->
                      PsSyntaxTerm ->
                      Option PsExpr ->
                      Except PsElabError PsElabTermResult) ->
                    PsInductiveInfo ->
                    List PsLevel ->
                    List PsExpr ->
                    PsExpr ->
                    List PsElabMatchAlternative ->
                    PsElabContext ->
                    Except PsElabError PsElabMatchMinorsResult :=
                  psElabMatchMinorsWorker rest;
                fun (elaborate :
                    PsElabContext ->
                    PsSyntaxTerm ->
                    Option PsExpr ->
                    Except PsElabError PsElabTermResult) =>
                  fun (inductiveInfo : PsInductiveInfo) =>
                    fun (inductiveLevels : List PsLevel) =>
                      fun (parameterArgs : List PsExpr) =>
                        fun (expectedType : PsExpr) =>
                          fun (alternatives : List PsElabMatchAlternative) =>
                            fun (context : PsElabContext) =>
                              match psElabMatchAlternativeFind ctorName alternatives with
                              | none => Except.error PsElabError.matchNonExhaustive
                              | some alternative =>
                                  match psElabMatchMinor
                                      elaborate
                                      context
                                      inductiveInfo
                                      inductiveLevels
                                      parameterArgs
                                      expectedType
                                      alternative with
                                  | Except.error error => Except.error error
                                  | Except.ok minor =>
                                      match smaller
                                          elaborate
                                          inductiveInfo
                                          inductiveLevels
                                          parameterArgs
                                          expectedType
                                          alternatives
                                          minor.context with
                                      | Except.error error => Except.error error
                                      | Except.ok tail =>
                                          Except.ok {
                                            context := tail.context
                                            minors := List.cons minor.term tail.minors
                                          }

          def psElabMatchMinors
              (elaborate :
                PsElabContext ->
                PsSyntaxTerm ->
                Option PsExpr ->
                Except PsElabError PsElabTermResult)
              (inductiveInfo : PsInductiveInfo)
              (inductiveLevels : List PsLevel)
              (parameterArgs : List PsExpr)
              (expectedType : PsExpr)
              (alternatives : List PsElabMatchAlternative)
              (context : PsElabContext)
              (constructorNames : List PsName) :
              Except PsElabError PsElabMatchMinorsResult :=
            psElabMatchMinorsWorker
              constructorNames
              elaborate
              inductiveInfo
              inductiveLevels
              parameterArgs
              expectedType
              alternatives
              context
          '''
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make match minors PSC1 portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
