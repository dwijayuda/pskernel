name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Reshape duplicate binder detection for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psSyntaxNameListHasDuplicate : List PsSyntaxName -> Bool\n'
          end_marker = '\ndef psElabMatchFields\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if 'List.any rest' not in old or 'psSyntaxNameListHasDuplicate rest' not in old:
              raise SystemExit('unexpected psSyntaxNameListHasDuplicate source shape')
          new = '''def psSyntaxNameListMatchesCoreWorker
              (candidates : List PsSyntaxName) :
              Option PsName -> Bool :=
            match candidates with
            | [] =>
                fun (_coreName : Option PsName) => false
            | candidate :: rest =>
                let smaller : Option PsName -> Bool :=
                  psSyntaxNameListMatchesCoreWorker rest;
                fun (coreName : Option PsName) =>
                  if psSyntaxNameMatchesCore coreName candidate then
                    true
                  else
                    smaller coreName

          def psSyntaxNameListMatchesCore
              (coreName : Option PsName)
              (candidates : List PsSyntaxName) : Bool :=
            psSyntaxNameListMatchesCoreWorker candidates coreName

          def psSyntaxNameListHasDuplicateWorker
              (names : List PsSyntaxName) : Bool :=
            match names with
            | [] => false
            | name :: rest =>
                let smaller : Bool :=
                  psSyntaxNameListHasDuplicateWorker rest;
                if psSyntaxNameIsWildcardBinder name then
                  smaller
                else
                  let coreName := psSyntaxNameToName name;
                  if psSyntaxNameListMatchesCore coreName rest then
                    true
                  else
                    smaller

          def psSyntaxNameListHasDuplicate
              (names : List PsSyntaxName) : Bool :=
            psSyntaxNameListHasDuplicateWorker names
          '''
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make duplicate binder detection PSC1 portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
