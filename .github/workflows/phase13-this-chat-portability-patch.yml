name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Isolate PsExprAppView projections for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()

          anchor = '''def psExprAppView (expr : PsExpr) : PsExprAppView :=\n  psExprAppViewAcc expr []\n\n'''
          accessors = '''def psExprAppViewHead (view : PsExprAppView) : PsExpr :=\n  view.head\n\ndef psExprAppViewArgs (view : PsExprAppView) : List PsExpr :=\n  view.args\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected psExprAppView anchor count={text.count(anchor)}')
          if 'def psExprAppViewHead ' in text or 'def psExprAppViewArgs ' in text:
              raise SystemExit('PsExprAppView accessors already exist')
          text = text.replace(anchor, anchor + accessors, 1)

          start_marker = 'def psElabMatch\n'
          end_marker = '\ndef psBinderAcceptsExplicitArgument'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if old.count('typeView.head') != 1:
              raise SystemExit(f'unexpected typeView.head count={old.count("typeView.head")}')
          if old.count('typeView.args') != 3:
              raise SystemExit(f'unexpected typeView.args count={old.count("typeView.args")}')
          new = old.replace('typeView.head', '(psExprAppViewHead typeView)')
          new = new.replace('typeView.args', '(psExprAppViewArgs typeView)')
          text = text[:start] + new + text[end:]
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "refactor(elab): isolate match app-view projections"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
