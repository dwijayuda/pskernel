name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Qualify match Option expressions for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabMatch\n'
          end_marker = '\ndef psBinderAcceptsExplicitArgument\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          checks = [
            'match elaborate context scrutineeSyntax none with',
            '                                              (some instantiatedExpected)\n',
          ]
          for needle in checks:
              if needle not in old:
                  raise SystemExit(f'unexpected psElabMatch source shape: missing {needle!r}')
          new = old.replace(
              'match elaborate context scrutineeSyntax none with',
              'match elaborate context scrutineeSyntax Option.none with',
              1)
          new = new.replace(
              '                                              (some instantiatedExpected)\n',
              '                                              (Option.some instantiatedExpected)\n',
              1)
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): qualify match Option expressions"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
