name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Reshape match parameter application for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          start_marker = 'def psElabMatchApplyParameters\n'
          end_marker = '\ndef psSyntaxNameIsWildcardBinder\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if 'psElabMatchApplyParameters' not in old or 'parameter :: rest' not in old:
              raise SystemExit('unexpected psElabMatchApplyParameters source shape')
          new = '''def psElabMatchApplyParametersWorker
              (parameters : List PsExpr) :
              PsElabContext ->
              PsExpr ->
              Except PsElabError PsExpr :=
            match parameters with
            | [] =>
                fun (_context : PsElabContext) =>
                  fun (cursor : PsExpr) => Except.ok cursor
            | parameter :: rest =>
                let smaller :
                    PsElabContext ->
                    PsExpr ->
                    Except PsElabError PsExpr :=
                  psElabMatchApplyParametersWorker rest;
                fun (context : PsElabContext) =>
                  fun (cursor : PsExpr) =>
                    match psInferEnsureForall
                        context.environment
                        context.metaContext
                        context.localContext
                        cursor with
                    | Except.error error =>
                        Except.error (PsElabError.infer error)
                    | Except.ok forallView =>
                        smaller
                          context
                          (psExprInstantiate1 forallView.body parameter)

          def psElabMatchApplyParameters
              (context : PsElabContext)
              (parameters : List PsExpr)
              (cursor : PsExpr) :
              Except PsElabError PsExpr :=
            psElabMatchApplyParametersWorker parameters context cursor
          '''
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): make match parameter application PSC1 portable"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
