name: Phase 13 this-chat portability patch

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-portability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
      - name: Isolate PsRecursorInfo projections for PSC1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()

          anchor = '''def psElabMatchMinors\n    (elaborate :\n'''
          start = text.index(anchor)
          match_start = text.index('\ndef psElabMatch\n', start)
          accessors = '''\ndef psRecursorInfoNumParams (info : PsRecursorInfo) : Nat :=\n  info.numParams\n\ndef psRecursorInfoNumIndices (info : PsRecursorInfo) : Nat :=\n  info.numIndices\n\ndef psRecursorInfoNumMotives (info : PsRecursorInfo) : Nat :=\n  info.numMotives\n\ndef psRecursorInfoNumMinors (info : PsRecursorInfo) : Nat :=\n  info.numMinors\n\ndef psRecursorInfoLevelParams (info : PsRecursorInfo) : List PsName :=\n  info.levelParams\n'''
          if 'def psRecursorInfoNumParams ' in text:
              raise SystemExit('PsRecursorInfo accessors already exist')
          text = text[:match_start] + accessors + text[match_start:]

          start = text.index('def psElabMatch\n')
          end = text.index('\ndef psBinderAcceptsExplicitArgument', start)
          old = text[start:end]
          expected = {
              'recInfo.numParams': 1,
              'recInfo.numIndices': 1,
              'recInfo.numMotives': 1,
              'recInfo.numMinors': 1,
              'recInfo.levelParams': 3,
          }
          for needle, count in expected.items():
              actual = old.count(needle)
              if actual != count:
                  raise SystemExit(f'unexpected {needle} count={actual}, expected={count}')
          new = old.replace('recInfo.numParams', '(psRecursorInfoNumParams recInfo)')
          new = new.replace('recInfo.numIndices', '(psRecursorInfoNumIndices recInfo)')
          new = new.replace('recInfo.numMotives', '(psRecursorInfoNumMotives recInfo)')
          new = new.replace('recInfo.numMinors', '(psRecursorInfoNumMinors recInfo)')
          new = new.replace('recInfo.levelParams', '(psRecursorInfoLevelParams recInfo)')
          text = text[:start] + new + text[end:]
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "refactor(elab): isolate match recursor-info projections"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
