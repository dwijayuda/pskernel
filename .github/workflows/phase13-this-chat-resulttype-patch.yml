name: Phase 13 type psElabIf result match

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
    paths:
      - .github/workflows/phase13-this-chat-resulttype-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2

      - name: Give psElabIf local match an expected PsExpr type
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          old = "          let resultType :=\n            match expected with"
          new = "          let resultType : PsExpr :=\n            match expected with"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one psElabIf resultType block, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git commit -m "fix(elab): type if result match for PSC1"
          git push origin HEAD:psc2/kernel-core-phase13-checkedcore-shadow-this-chat-2
