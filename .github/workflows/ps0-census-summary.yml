          print(json.dumps({k:v for k,v in data.items() if k not in ['inputs','outputs']},indent=2))
          print('PS0_STAGE_TWO_HOST_METADATA_MANIFEST_SHA256',hashlib.sha256(json.dumps(host['host_metadata'],sort_keys=True).encode()).hexdigest())
          print('PS0_STAGE_TWO_CENSUS_MODES',json.dumps(census['declaration_modes'],sort_keys=True))
          PY

  operator-compiler-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-project-90e32a5ec5ce258e0310c1084512e076d283d682-42542351315
          run-id: 42542351315
          github-token: ${{ github.token }}
          path: operators
      - uses: actions/download-artifact@v4
        with:
          name: ps0-operator-baseline-42542351315
          run-id: 42542351315
          github-token: ${{ github.token }}
          path: baseline
      - name: Inspect exact operator and native compiler evidence
        run: |
          python3 - <<'PY'
          import hashlib, json
