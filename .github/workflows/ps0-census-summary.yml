          run-id: 42532849633
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          path: corpus
      - name: Account for the five captured-source Git blob differences
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json
          from pathlib import Path
          root=Path('corpus')
          migration=json.loads((root/'migration.json').read_text())
          assert migration['source_commit']=='2cba0bc26df49c52d653598fd9c791f23209199c'
          entries=json.loads("{\"Lean\":{\"repositoryPath\":\"src/Lean.lean\",\"blob\":\"db1d56fbd201eae72ad393ad94929d0602e80fa2\"},\"LeanChecker\":{\"repositoryPath\":\"src/LeanChecker.lean\",\"blob\":\"aa69c77767cfab76fdb95a7cafb170d36b9950c2\"},\"LeanExport\":{\"repositoryPath\":\"src/LeanExport.lean\",\"blob\":\"a21cc37c1a84d89026aba45daf61a7bc05be5f00\"},\"LeanIR\":{\"repositoryPath\":\"src/LeanIR.lean\",\"blob\":\"a95112b90e8b54756112e01a10e865971d6ac986\"},\"Leanc\":{\"repositoryPath\":\"src/Leanc.lean\",\"blob\":\"da517a3bf8a1dd6b0c1770deae367be40725b6bf\"}}")
          result=[]
          for module in ['Lean','LeanChecker','LeanExport','LeanIR','Leanc']:
              original=Path(entries[module]['repositoryPath']).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
              assert blob==entries[module]['blob'], module
              data=json.loads((root/'source-census'/Path(*module.split('.')).with_suffix('.json')).read_text())
              captured=data['nativeSource'].encode()
              item=migration['inputs'][module]
              assert item['body_mode']=='native-header-adapter', (module,item)
              assert hashlib.sha256(original).hexdigest()==item['original_sha256']
              assert hashlib.sha256(captured).hexdigest()==item['ps_sha256']
              same=0
              while same<min(len(original),len(captured)) and original[-same-1]==captured[-same-1]:
                  same+=1
              record={'module':module,'original_blob':blob,'original_sha256':item['original_sha256'],'converted_sha256':item['ps_sha256'],'body_mode':item['body_mode'],'unchanged_suffix_bytes':same}
              result.append(record)
              print('PS0_NATIVE_HEADER_ADAPTER_RECORD',json.dumps(record,sort_keys=True))
              print(''.join(difflib.unified_diff(original.decode().splitlines(keepends=True),captured.decode().splitlines(keepends=True),fromfile=module+'.lean',tofile=module+'.ps')))
          Path('audit').mkdir()
          Path('audit/native-header-adapters.json').write_text(json.dumps({'source':migration['source_commit'],'records':result,'scope':'five recorded native header conversions; not canonical PS grammar conversion','verified_execution':False},sort_keys=True,indent=2)+'\n')
          print('PS0_FIVE_NATIVE_HEADER_ADAPTERS_ACCOUNTED: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ps0-native-header-adapter-evidence-${{ github.run_id }}
          path: audit/native-header-adapters.json
          if-no-files-found: error


