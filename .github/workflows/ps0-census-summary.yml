name: PS0 pinned native source census summary
on:
  pull_request:
    paths: [.github/workflows/ps0-census-summary.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census-summary:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-compiler-stage1-abf3585d99c921fe02697b679867a0a55e433168-42517718338
          run-id: 42517718338
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect exact native compiler census
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence')
          migration=json.loads((root/'migration.json').read_text())
          summary=json.loads((root/'source-census/summary.json').read_text())
          assert migration['source_commit']=='abf3585d99c921fe02697b679867a0a55e433168'
          assert summary['source_commit']==migration['source_commit']
          assert summary['lean_commit']=='eb6cafb7290e8bd5f2937522d8d804f58f02bafc'
          assert summary['module_count']==2566
          assert hashlib.sha256((root/'migrated-ps0').read_bytes()).hexdigest()==migration['driver_sha256']
          print('PS0_NATIVE_CENSUS_PINNED_IDENTITY: PASS')
          print(json.dumps({k:v for k,v in summary.items() if k!='modules'},indent=2))
          print('PS0_NATIVE_CENSUS_TOP_MODULE_COMMAND_COUNTS')
          for name, data in sorted(summary['modules'].items(), key=lambda x:x[1]['command_count'],reverse=True)[:30]:
              print(name,data['command_count'])
          print('PS0_NATIVE_CENSUS_SCOPE: native-compatible baseline; canonical PS grammar incomplete')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ps0-native-census-summary-${{ github.run_id }}
          path: evidence/source-census/summary.json

  compiler-head-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-prelude-compiler-head-probe-42521772271
          run-id: 42521772271
          github-token: ${{ github.token }}
          path: probe
      - name: Inspect exact compiler head parity evidence
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('probe')
          files=list(root.rglob('compiler-heads-*/evidence.json'))
          assert len(files)==1, files
          evidence=json.loads(files[0].read_text())
          assert evidence['source']=='704c5614e15981145260f5aac1ea8a891875cf12'
          assert evidence['pinned_blob']=='20b7acf5d684789ab52b81dda7def4b19568213c'
          assert all(c['native']==c['ps'] for c in evidence['comparisons'].values())
          print('PS0_COMPILER_HEAD_EVIDENCE_IDENTITY: PASS')
          print(json.dumps(evidence,indent=2))
          print(json.dumps(json.loads((files[0].parent/'plan.json').read_text()),indent=2))
          PY

  mutual-compiler-head-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-project-3c47198c4ed8f43a4967deef199ea61fa5e8d592-42528176757
          run-id: 42528176757
          github-token: ${{ github.token }}
          path: probe
      - name: Inspect pinned recursive compiler parity evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('probe').rglob('compiler-heads-*/evidence.json'))
          assert len(files)==2, files
          for file in files:
              evidence=json.loads(file.read_text())
              assert evidence['source']=='3c47198c4ed8f43a4967deef199ea61fa5e8d592'
              assert all(c['native']==c['ps'] for c in evidence['comparisons'].values())
              print('PS0_MUTUAL_COMPILER_EVIDENCE_IDENTITY: PASS')
              print(json.dumps(evidence,indent=2))
              print(json.dumps(json.loads((file.parent/'plan.json').read_text()),indent=2))
          PY

  runtime-fixed-point-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-compiler-stage2-28904e5a7ccb19a15e311ecc654541dc0ee639ec-42522976977
          run-id: 42522976977
          github-token: ${{ github.token }}
          path: stage2
      - name: Inspect exact full compiler fixed point
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('stage2')
          data=json.loads((root/'migration.json').read_text())
          assert data['source_commit']=='28904e5a7ccb19a15e311ecc654541dc0ee639ec'
          assert data['fixed_point']=={'changed_c': [], 'changed_olean': []}
          summary=json.loads((root/'source-census/summary.json').read_text())
          assert summary['module_count']==2567
          assert hashlib.sha256((root/'migrated-ps0').read_bytes()).hexdigest()==data['driver_sha256']
          print('PS0_RUNTIME_COMPILER_FIXED_POINT_EVIDENCE: PASS')
          print(json.dumps({k:v for k,v in data.items() if k not in ['outputs','modules','inputs']},indent=2))
          print(json.dumps({k:v for k,v in summary.items() if k!='modules'},indent=2))
          print('PS0_FIXED_POINT_SCOPE: native-compatible source forest; canonical ProofScript grammar remains incomplete')
          PY

      - name: Audit actual small compiler binder default roles
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in Path('stage2/source-census/Lean/Compiler').rglob('*.json'):
              snapshot=json.loads(path.read_text())
              defaults=[]
              heads=[]
              for command in snapshot['commands']:
                  decl=command['declaration']
                  if not decl or decl['production']!='Lean.Parser.Command.definition':
                      continue
                  heads.append(decl['sourceName'])
                  for binder in decl['signatureSyntax']['args'][0]['args']:
                      parts=binder['args']
                      if binder['kind']=='Lean.Parser.Term.explicitBinder' and len(parts)==5 and parts[3]['args']:
                          defaults.append({'name':decl['sourceName'],'typed':bool(parts[2]['args']),'kind':parts[3]['args'][0]['kind']})
              if defaults:
                  rows.append({'module':snapshot['module'],'source_bytes':len(snapshot['nativeSource'].encode()),'heads':heads,'defaults':defaults})
          rows.sort(key=lambda r:r['source_bytes'])
          Path('binder-default-audit.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('PS0_ACTUAL_COMPILER_BINDER_DEFAULT_AUDIT: inspection only')
          print(json.dumps(rows[:20],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ps0-actual-compiler-binder-default-audit-${{ github.run_id }}
          path: binder-default-audit.json

  mixed-default-host-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-project-7fea6986042ba76fd1f1a028474209dc5f3bc519-42532092264
          run-id: 42532092264
          github-token: ${{ github.token }}
          path: probe
      - name: Inspect actual mixed default compiler and native host evidence
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          files=list(Path('probe').rglob('compiler-heads-*/evidence.json'))
          assert len(files)==4, files
          total=0
          for file in sorted(files):
              data=json.loads(file.read_text())
              assert data['source']=='7fea6986042ba76fd1f1a028474209dc5f3bc519'
              assert all(c['native']==c['ps'] for c in data['comparisons'].values())
              total+=len(data['converted_declarations'])
              print(json.dumps(data,indent=2))
              if data['module'] in ['Lean.Compiler.LCNF.ScopeM','Lean.Compiler.LCNF.OtherDecl']:
                  print(json.dumps(json.loads((file.parent/'plan.json').read_text()),indent=2))
          assert total==15, total
          hosts=list(Path('probe').rglob('relocated-grammar-*/evidence.json'))
          assert len(hosts)==1, hosts
          host=json.loads(hosts[0].read_text())
          assert host['source']=='7fea6986042ba76fd1f1a028474209dc5f3bc519'
          assert all(v['source_sha256']==v['published_sha256'] for v in host['host_metadata'].values())
          print(json.dumps({k:v for k,v in host.items() if k!='host_metadata'},indent=2))
          print('PS0_NATIVE_HOST_METADATA_FILES',len(host['host_metadata']))
          print('PS0_NATIVE_HOST_METADATA_MANIFEST_SHA256',hashlib.sha256(json.dumps(host['host_metadata'],sort_keys=True).encode()).hexdigest())
          print('PS0_NATIVE_HOST_METADATA_IR_FILES',sum('.ir' in name for name in host['host_metadata']))
          print('PS0_MIXED_DEFAULT_AND_HOST_EVIDENCE: PASS; converted_heads=15; modules=4')
          PY

  ps-built-grammar-host-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-compiler-stage1-2cba0bc26df49c52d653598fd9c791f23209199c-42532849633
          run-id: 42532849633
          github-token: ${{ github.token }}
          path: fresh
      - name: Inspect grammar host freshly compiled from ps
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('fresh')
          migration=json.loads((root/'migration.json').read_text())
          host=json.loads((root/'native-grammar-host.json').read_text())
          summary=json.loads((root/'source-census/summary.json').read_text())
          assert migration['source_commit']==host['source']=='2cba0bc26df49c52d653598fd9c791f23209199c'
          assert migration['module_count']==summary['module_count']==2567
          assert migration['runtime_smoke']=='PASS'
          assert migration['runtime_grammar_host']['status']=='PASS'
          assert host['driver_sha256']==migration['driver_sha256']
          assert hashlib.sha256((root/'migrated-ps0').read_bytes()).hexdigest()==host['driver_sha256']
          assert hashlib.sha256((root/'native-grammar-host.json').read_bytes()).hexdigest()==migration['runtime_grammar_host']['evidence_sha256']
          assert len(host['host_metadata'])==migration['runtime_grammar_host']['metadata_files']==200
          assert all(v['source_sha256']==v['published_sha256'] for v in host['host_metadata'].values())
          print('PS0_FRESH_PS_BUILT_GRAMMAR_HOST_EVIDENCE: PASS')
          print(json.dumps({k:v for k,v in migration.items() if k not in ['inputs','outputs']},indent=2))
          print('PS0_FRESH_HOST_METADATA_MANIFEST_SHA256',hashlib.sha256(json.dumps(host['host_metadata'],sort_keys=True).encode()).hexdigest())
          print('PS0_FRESH_SOURCE_CENSUS_MODES',json.dumps(summary['declaration_modes'],sort_keys=True))
          PY

  lambda-compiler-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-project-7f885fcc1caa9277e3633c849d086bb2614e143e-42537205963
          run-id: 42537205963
          github-token: ${{ github.token }}
          path: lambda
      - name: Inspect original lambda body ranges and strict compiler output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('lambda').rglob('compiler-heads-*/evidence.json'))
          assert len(files)==4, files
          for file in sorted(files):
              data=json.loads(file.read_text())
              assert data['source']=='7f885fcc1caa9277e3633c849d086bb2614e143e'
              assert all(v['native']==v['ps'] for v in data['comparisons'].values())
              print(json.dumps(data,indent=2))
              if data['module']=='Lean.Compiler.LCNF.DeclHash':
                  plan=json.loads((file.parent/'plan.json').read_text())
                  assert len(plan['edits'])==18, plan
                  census=json.loads((file.parent/'original-census.json').read_text())
                  def declarations(commands):
                      for command in commands:
                          if command['declaration']:
                              yield command['declaration']
                          yield from declarations(command.get('nestedCommands',[]))
                  owned=[d for d in declarations(census['commands']) if d.get('lambdaBodyApplications')]
                  assert [d['sourceName'] for d in owned]==['hashAlts'], owned
                  print(json.dumps(plan,indent=2))
                  print('PS0_ORIGINAL_LAMBDA_BODY_ROLE',json.dumps(owned[0]['lambdaBodyApplications'],sort_keys=True))
          print('PS0_LAMBDA_COMPILER_EVIDENCE: PASS')
          PY

  ps-built-stage-two-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps0-compiler-stage2-2cba0bc26df49c52d653598fd9c791f23209199c-42532849633
          run-id: 42532849633
          github-token: ${{ github.token }}
