      - name: Rehash actual declaration-form and compiler-module outputs
        run: |
          set -euo pipefail
          python3 experiments/ps0/tests/inspect-compiler-fixture-artifact.py where-instance-artifact --source cbd741ec3c0ef5f5ef1f3537b6fa8569fd746128 --output where-instance-rehash.json | tee where-instance-rehash.log
          python3 - <<'PY' | tee where-instance-roles.log
          from pathlib import Path
          import json
          for path in Path('where-instance-artifact').rglob('evidence.json'):
              if 'DeclarationForms' in path.parent.name:
                  value=json.loads(path.read_text())
                  print('PS0_WHERE_INSTANCE_ROLES:'+json.dumps(value.get('non_definition_source_roles',[]),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-where-instance-rehash-${{ github.run_id }}
          path: |
            where-instance-rehash.json
            where-instance-rehash.log
            where-instance-roles.log
          if-no-files-found: error
