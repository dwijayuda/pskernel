name: PS0 data parser types artifact inspection
on:
  pull_request:
    paths: [.github/workflows/ps0-data-types-inspection.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  data-types-inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: 4471a585933c6260449fab38642641bc6f2e8b25
          sparse-checkout: experiments/ps0/tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42752130115
          name: ps0-data-parser-types-4471a585933c6260449fab38642641bc6f2e8b25-42752130115
          github-token: ${{ github.token }}
          path: retained
      - name: Independently verify actual outputs and all data declaration captures
        run: |
          python3 experiments/ps0/tests/inspect-compiler-fixture-artifact.py retained --source 4471a585933c6260449fab38642641bc6f2e8b25 --output modules.json > rehash.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('modules.json').read_text())
          assert len(report['modules'])==1
          module=report['modules'][0]
          assert module['module']=='Lean.Parser.Types'
          assert module['pinned_blob']=='83c6647aba46768322afe237e359a3f271e1cf10'
          assert module['definitions']==70
          roots=list(Path('retained').glob('compiler-heads-*'))
          assert len(roots)==1
          root=roots[0]
          native=json.loads((root/'original-census.json').read_text())
          mapped=json.loads((root/'migrated/lib/lean/Lean/Parser/Types.ilean.ps0-source-census.json').read_text())
          def data_rows(commands):
              for command in commands:
                  if command.get('dataDeclaration'): yield command['dataDeclaration']
                  yield from data_rows(command.get('nestedCommands',[]))
          a,b=list(data_rows(native['commands'])),list(data_rows(mapped['commands']))
          assert a and len(a)==len(b)
          assert native['dataDeclarationOperandScope']==mapped['dataDeclarationOperandScope']=='native-data-declaration-operands/1'
          assert all(row['mode']=='native-compatible' for row in a)
          assert all(row['mode']=='mapped-ps' for row in b)
          assert [row['syntax']['args'][1]['kind'] for row in a]==[row['syntax']['args'][1]['kind'] for row in b]
          plan=json.loads((root/'plan.json').read_text())
          assert plan['data_declarations']==len(a)
          report.update(status='PASS',producer_run=42752130115,producer_job=129617957451,
              actual_compiler_files_rehashed=4,data_declarations=len(a),scope='Actual pinned parser type module, 70 function heads and native data operands; no complete corpus claim')
          report['modules'][0]={key:module[key] for key in ['module','pinned_blob','definitions','strategies','hashes','source_sha256','converted_sha256','line_count_preserved']}
          Path('inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PS0_DATA_TYPES_INSPECTION:'+json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-data-types-inspection-${{ github.run_id }}
          path: |
            inspection.json
            modules.json
            rehash.log
          if-no-files-found: error
