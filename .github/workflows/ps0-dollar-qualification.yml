              summary.append(result)
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('PS0_PRIVATE_CONSTANT_SELF_CONTROL: PASS')
          print('PS0_PRIVATE_CONSTANT_DIFFERENCES:'+json.dumps(summary,sort_keys=True))
          
          PY
