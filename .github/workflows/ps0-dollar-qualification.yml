          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=next(Path('retained-synth').rglob('c-parity-olean-diagnostic.log')).parent
          a=root/'baseline/lib/lean/Lean/Meta/SynthInstance.olean'
          b=root/'migrated/lib/lean/Lean/Meta/SynthInstance.olean'
          out=Path('build/private-constant-inspection');out.mkdir(parents=True)
          def compare(label,other):
              result=subprocess.run(['lake','env','lean','--run','tests/compare-compiler-olean.lean',str(a),str(other),'--all-parts'],capture_output=True,text=True,timeout=300)
              (out/(label+'.log')).write_text(result.stdout+result.stderr)
              assert result.returncode==0,(result.stdout+result.stderr)[:8000]
              return json.loads(result.stdout)
          self_check=compare('native-self',a)
          assert not self_check['changedConstants'],'diagnostic must coalesce private overrides before comparing bodies'
          details=compare('native-ps',b)
          summary=[]
          for row in details['changedConstants']:
              result={k:row.get(k) for k in ['name','typeEqual','valueEqual','hintsEqual']}
              for field in ['Type','Value']:
                  left,right=row.get('native'+field),row.get('ps'+field)
