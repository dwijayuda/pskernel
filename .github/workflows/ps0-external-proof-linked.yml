          python3 tests/run-compiler-heads.py --fixture UnlessProbe --module Lean.Compiler.UnlessProbe --blob 25297cdfa85b6416dba9d4c23871f1a648076e50 --declarations ALL 2>&1 | tee build/compiler-unless-logs/native-parity.log
      - name: Qualify entire pinned Lean.Compiler.InlineAttrs through native Lake
