          lake build PS0 ps0 2>&1 | tee build/native-logs/build.log
          lake exe ps0 environment | tee build/native-logs/environment.json
      - name: Check existing thin adapters and native language
        id: adapters
        run: |
          set -euo pipefail
          for file in native_capabilities.ps registered_syntax.ps host_category_bridge.ps host_postfix_calls.ps standard_host_declarations.ps implicit_public_module.ps explicit_private_module.ps; do
            lake exe ps0 check "tests/v1/$file"
          done 2>&1 | tee build/native-logs/adapters.log
      - name: Build link run and invalidate actual native executables
        if: success() || steps.adapters.outcome == 'failure'
        run: |
          set -euo pipefail
          python3 tests/run-native.py 2>&1 | tee build/native-logs/native.log
