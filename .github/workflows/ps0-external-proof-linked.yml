          printf '%s\n' "$GITHUB_SHA" > build/compiler-unless-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/compiler-unless-logs/build.log
          lake exe ps0 environment | tee build/compiler-unless-logs/environment.json
