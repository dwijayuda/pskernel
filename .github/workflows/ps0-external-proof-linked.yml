  operator-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin=json.load(open('ci/ps0-source.json'))
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          pin['commit']='6dc96dd983c0d37fc91bf39d05777540f4f1322d'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/native-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/native-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/native-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/native-logs/build.log
          lake exe ps0 environment | tee build/native-logs/environment.json
      - name: Require native checker rejection before the operator adapter
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          fixture=pathlib.Path('tests/v1/operator_operands.ps')
          source=fixture.read_text().splitlines(keepends=True)
          probe=pathlib.Path('build/native-logs/operator-baseline.ps')
          probe.write_text(''.join(source[:3]))
          result=subprocess.run(['lake','exe','ps0','check',str(probe)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
          pathlib.Path('build/native-logs/operator-baseline.log').write_text(result.stdout)
          print(result.stdout,flush=True)
          assert result.returncode != 0, 'missing adapter unexpectedly accepted owned binary operands'
          assert "unexpected token '+'; expected command" in result.stdout, 'expected unconsumed binary operator after owned PS call, not harness failure'
          evidence={'source':os.environ['PS0_SOURCE_SHA'],'fixture_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest(),'probe_sha256':hashlib.sha256(probe.read_bytes()).hexdigest(),'expected_rejection':'unconsumed binary operator after owned PS call before operator adapters','checker_exit':result.returncode,'status':'PASS','verified_execution':False}
          pathlib.Path('build/native-logs/operator-baseline.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('PS0_NATIVE_OPERATOR_PRE_ADAPTER_REJECTION: PASS',flush=True)
          PY
      - name: Retain exact pre-adapter rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps0-operator-baseline-${{ github.run_id }}
          path: experiments/ps0/build/native-logs/
          if-no-files-found: error


