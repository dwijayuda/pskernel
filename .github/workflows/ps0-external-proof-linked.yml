        run: |
          set -o pipefail
          python3 tests/run-source-fidelity.py 2>&1 | tee build/project-logs/source-fidelity.log
      - name: Retain project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps0-project-${{ env.PS0_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            experiments/ps0/build/project-logs/
            experiments/ps0/build/relocated-grammar-*/*.json
            experiments/ps0/build/relocated-grammar-*/*.log
            experiments/ps0/build/owned-macros-*/*.json
            experiments/ps0/build/owned-macros-*/*.log
            experiments/ps0/build/lambdas-*/*.json
            experiments/ps0/build/lambdas-*/*.log
