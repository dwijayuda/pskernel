name: PS0 external proof-linked qualification

on:
  push:
    branches: [ci/ps0-proof-linked-runner-20261029, ci/ps0-lake-native-20261108]
    paths: [.github/workflows/ps0-external-proof-linked.yml, ci/ps0-source.json]
  pull_request:
    paths: [.github/workflows/ps0-external-proof-linked.yml, ci/ps0-source.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ps0-external-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prelude-compiler-head-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LAKE_ARTIFACT_CACHE: 'false'
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin=json.load(open('ci/ps0-source.json'))
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - name: Install pinned Lean with bounded download retries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer"
          curl --fail --silent --show-error --location --connect-timeout 20 --max-time 120 \
            --retry 5 --retry-max-time 300 --retry-all-errors \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/ps0-elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/ps0-elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ps0_toolchain="$(cat lean-toolchain)"
          ps0_lean_installed=0
          for ps0_attempt in 1 2 3; do
            if "$HOME/.elan/bin/elan" toolchain install "$ps0_toolchain"; then
              ps0_lean_installed=1
              break
            fi
            sleep "$((ps0_attempt * 2))"
          done
          test "$ps0_lean_installed" = 1
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Build the pinned bootstrap PS0 driver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          lake build PS0 ps0
      - name: Qualify exact prelude grammar and real compiler source heads
        run: |
          set -euo pipefail
          python3 tests/run-modern-frontend-startup.py
          python3 tests/run-prelude-grammar.py
          python3 tests/run-compiler-heads.py
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps0-prelude-compiler-head-probe-${{ github.run_id }}
          path: |
            experiments/ps0/build/prelude-grammar-*/
            experiments/ps0/build/modern-frontend-startup-*/
            experiments/ps0/build/compiler-heads-*/*.json
            experiments/ps0/build/compiler-heads-*/*.log
            experiments/ps0/build/compiler-heads-*/original/src/
            experiments/ps0/build/compiler-heads-*/converted/src/
            experiments/ps0/build/compiler-heads-*/baseline/ir/Lean/Compiler/ClosedTermCache.c
            experiments/ps0/build/compiler-heads-*/baseline/lib/lean/Lean/Compiler/ClosedTermCache.olean
            experiments/ps0/build/compiler-heads-*/migrated/ir/Lean/Compiler/ClosedTermCache.c
            experiments/ps0/build/compiler-heads-*/migrated/lib/lean/Lean/Compiler/ClosedTermCache.olean
          if-no-files-found: warn
