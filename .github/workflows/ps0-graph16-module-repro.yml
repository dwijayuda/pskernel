name: PS0 graph sixteen actual module reproduction
on:
  pull_request:
    paths: [.github/workflows/ps0-graph16-module-repro.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:

  module-reproduction:
    if: ${{ false }}
    name: ${{ matrix.label }}-${{ matrix.fixture }}
    strategy:
      fail-fast: false
      matrix:
        include: [{"module":"Std.Http.Data.URI.Parser","fixture":"URIParser","path":"src/Std/Http/Data/URI/Parser.lean","roots":"Std.Http.Data.URI","blob":"d51844ce35afe12c4c815dd41f617891f3a62980","source":"f94118fb3d1463304c32b5a28189d7ea6572ecce","label":"graph-source"},{"module":"Lean.Meta.AbstractMVars","fixture":"AbstractMVars","path":"src/Lean/Meta/AbstractMVars.lean","roots":"Lean.Meta","blob":"175738e203ab7cbd59798431b0fb0133dd41ca5a","source":"f94118fb3d1463304c32b5a28189d7ea6572ecce","label":"graph-source"},{"module":"Lean.Meta.DiscrTree.Main","fixture":"DiscrTreeMain","path":"src/Lean/Meta/DiscrTree/Main.lean","roots":"Lean.Meta.DiscrTree","blob":"bdfbcdff9d7ae3dcc369b2d637a4dec8cfe1f14a","source":"f94118fb3d1463304c32b5a28189d7ea6572ecce","label":"graph-source"},{"module":"Std.Http.Data.URI.Parser","fixture":"URIParser","path":"src/Std/Http/Data/URI/Parser.lean","roots":"Std.Http.Data.URI","blob":"d51844ce35afe12c4c815dd41f617891f3a62980","source":"9c9a416ce7cfc5ac21c9d50f01ca27523800dad2","label":"current"},{"module":"Lean.Meta.AbstractMVars","fixture":"AbstractMVars","path":"src/Lean/Meta/AbstractMVars.lean","roots":"Lean.Meta","blob":"175738e203ab7cbd59798431b0fb0133dd41ca5a","source":"9c9a416ce7cfc5ac21c9d50f01ca27523800dad2","label":"current"},{"module":"Lean.Meta.DiscrTree.Main","fixture":"DiscrTreeMain","path":"src/Lean/Meta/DiscrTree/Main.lean","roots":"Lean.Meta.DiscrTree","blob":"bdfbcdff9d7ae3dcc369b2d637a4dec8cfe1f14a","source":"9c9a416ce7cfc5ac21c9d50f01ca27523800dad2","label":"current"}]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"${{ matrix.source }}"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/compiler-fixture-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/compiler-fixture-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/compiler-fixture-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/compiler-fixture-logs/build.log
          lake exe ps0 environment | tee build/compiler-fixture-logs/environment.json
      - name: Qualify exact pinned failing module with native SDK dependencies
        run: |
          python3 tests/run-compiler-heads.py --sdk-source --bootstrap --declarations ALL \
            --module '${{ matrix.module }}' --fixture '${{ matrix.fixture }}' \
            --blob '${{ matrix.blob }}' --roots '${{ matrix.roots }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-graph16-module-repro-${{ matrix.label }}-${{ matrix.fixture }}-${{ github.run_id }}
          path: experiments/ps0/build/compiler-heads-*
          if-no-files-found: error
  graph-plan-inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42719483426
          name: ps0-transformed-corpus-f94118fb3d1463304c32b5a28189d7ea6572ecce-42719483426
          github-token: ${{ github.token }}
          path: retained
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          names=['Std.Http.Data.URI.Parser','Lean.Meta.AbstractMVars','Lean.Meta.DiscrTree.Main']
          for name in names:
              files=[p for p in Path('retained').rglob('*') if p.is_file() and name in str(p)]
              print('PS0_GRAPH16_MODULE_FILES:'+json.dumps({'module':name,'files':[str(p) for p in files[:30]]}))
              for path in files:
                  if path.suffix=='.ps':
                      lines=path.read_text().splitlines()
                      target=97 if 'URI' in name else 102 if 'Abstract' in name else 278
                      print('PS0_GRAPH16_CONVERTED_LINES:'+json.dumps({'module':name,'file':str(path),'lines':[[i+1,line] for i,line in enumerate(lines) if target-6<=i+1<=target+5]}))
                  elif path.name=='plan.json':
                      data=json.loads(path.read_text())
                      print('PS0_GRAPH16_PLAN_FIELDS:'+json.dumps({'module':name,'keys':list(data),'edits':len(data.get('edits',[]))}))
                      import hashlib
                      census=json.loads((path.parent/'native-census.json').read_text())
                      raw=census['nativeSource'].encode()
                      assert hashlib.sha256(raw).hexdigest()==data['source_sha256']
                      chunks=[];cursor=0
                      for edit in data['edits']:
                          assert raw[edit['start']:edit['end']].decode()==edit['old']
                          assert cursor<=edit['start']<=edit['end']
                          chunks.extend([raw[cursor:edit['start']],edit['new'].encode()]);cursor=edit['end']
                      chunks.append(raw[cursor:]);converted=b''.join(chunks)
                      assert hashlib.sha256(converted).hexdigest()==data['result_sha256']
                      target=97 if 'URI' in name else 102 if 'Abstract' in name else 278
                      lines=converted.decode().splitlines()
                      print('PS0_GRAPH16_RECONSTRUCTED_LINES:'+json.dumps({'module':name,'lines':[[i+1,line] for i,line in enumerate(lines) if target-5<=i+1<=target+4]}))
                      original=raw.decode().splitlines(keepends=True)
                      token='takeWhileAtMost' if 'URI' in name else 'pure' if 'Abstract' in name else 'pushArgsAux'
                      point=len(''.join(original[:target-1]).encode())+len(original[target-1].split(token)[0].encode())
                      def walk(node, ancestry):
                          span=node.get('range')
                          if span and span['start']<=point<span['end']:
                              ancestry=ancestry+[{'kind':node['kind'],'arity':len(node.get('args',[]))}]
                              if node['kind']=='Lean.Parser.Term.app':
                                  print('PS0_GRAPH16_NATIVE_ROLE_PATH:'+json.dumps({'module':name,'path':ancestry,'children':[c['kind'] for c in node.get('args',[])]}))
                          for child in node.get('args',[]):walk(child,ancestry)
                      def commands(rows):
                          for command in rows:
                              declaration=command.get('declaration')
                              if declaration and declaration.get('valueSyntax'):walk(declaration['valueSyntax'],[])
                              commands(command.get('nestedCommands',[]))
                      commands(census['commands'])

          PY
