            experiments/ps0/build/host-island-gaps-*/**/*.ps
            experiments/ps0/build/compiler-fixture-logs/
            experiments/ps0/build/initializers-*/*.json
            experiments/ps0/build/initializers-*/*.log
            experiments/ps0/build/initializers-*/*.ps
            experiments/ps0/build/initializers-*/*.c
            experiments/ps0/build/initializers-*/*.olean
            experiments/ps0/build/initializers-*/*InitializerRuntime
          if-no-files-found: error

  term-monadic-qualified:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin=json.load(open('ci/ps0-source.json'))
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/compiler-fixture-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/compiler-fixture-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/compiler-fixture-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/compiler-fixture-logs/build.log
          lake exe ps0 environment | tee build/compiler-fixture-logs/environment.json
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42630740875
          name: ps0-compiler-listattach-5a5cfe9e35d012c11e735123f941d07a7fdcf85e-42630740875
          github-token: ${{ github.token }}
          path: retained-listattach
      - name: Assert owned PS calls beneath bound native do-if
        run: lake env lean tests/debug-bound-if-layout.lean
      - name: Qualify ordinary host values origins and native linking
        run: python3 tests/run-match-host-bodies.py
      - name: Qualify native loop gadget annotation parity and linking
        run: |
          python3 tests/run-loop-contracts.py
          python3 tests/run-suffices.py
          python3 tests/run-term-monadic.py
      - name: Compare original source diagnostic coordinates
        run: python3 tests/run-diagnostic-origins.py
      - name: Reject forty known ordinary host gaps
        run: python3 tests/run-host-island-gaps.py --cases nested-action,term-return,term-try,term-for,bound-if-then,bound-if-else,suffices-body,suffices-type,suffices-continuation,match,pattern-lambda,record-field,do-if,do-match,do-have,do-for,do-try,proof-if,typed-term,tactic-body,pattern-if,tuple-element,list-element,array-element,interpolation,forall-domain,forall-body,pattern-let,anonymous-constructor,show-body,show-type,pure-have,while-body,while-condition,repeat-body,repeat-condition,loop-for-invariant,loop-invariant-type,loop-while-invariant,loop-while-measure
      - name: Bound native and PS nested parenthesis parsing
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          try:
              result=subprocess.run(['lake','env','lean','--run','tests/inspect-parenthesis-budget.lean'],capture_output=True,text=True,timeout=60)
          except subprocess.TimeoutExpired as error:
              partial=error.stdout or b''
              if isinstance(partial,bytes): partial=partial.decode(errors='replace')
              pathlib.Path('build/compiler-fixture-logs/paren-budget.log').write_text(partial)
              print(partial,flush=True)
              raise
          pathlib.Path('build/compiler-fixture-logs/paren-budget.log').write_text(result.stdout+result.stderr)
          print(result.stdout+result.stderr,flush=True)
          assert result.returncode==0,result.returncode
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-host-operand-parity-${{ env.PS0_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            experiments/ps0/build/compiler-fixture-logs/paren-budget.log
            experiments/ps0/build/diagnostic-origins-*/*.json
            experiments/ps0/build/diagnostic-origins-*/*.log
            experiments/ps0/build/diagnostic-origins-*/*.ps
            experiments/ps0/build/diagnostic-origins-*/*.lean
            experiments/ps0/build/term-monadic-*/*.json
            experiments/ps0/build/term-monadic-*/*.log
            experiments/ps0/build/term-monadic-*/*.ps
            experiments/ps0/build/term-monadic-*/*.c
            experiments/ps0/build/term-monadic-*/*.olean
            experiments/ps0/build/term-monadic-*/TermMonadicRuntime
            experiments/ps0/build/suffices-*/*.json
            experiments/ps0/build/suffices-*/*.log
            experiments/ps0/build/suffices-*/*.ps
            experiments/ps0/build/suffices-*/*.c
            experiments/ps0/build/suffices-*/*.olean
            experiments/ps0/build/suffices-*/SufficesRuntime
            experiments/ps0/build/loop-contracts-*/*.json
            experiments/ps0/build/loop-contracts-*/*.log
            experiments/ps0/build/loop-contracts-*/*.ps
            experiments/ps0/build/loop-contracts-*/*.c
            experiments/ps0/build/loop-contracts-*/*.olean
            experiments/ps0/build/loop-contracts-*/LoopContracts
            experiments/ps0/build/match-host-*/*.json
            experiments/ps0/build/match-host-*/*.log
            experiments/ps0/build/match-host-*/*.ps
            experiments/ps0/build/match-host-*/*.c
            experiments/ps0/build/match-host-*/*.olean
            experiments/ps0/build/match-host-*/OrdinaryHostOrigins
            experiments/ps0/build/host-island-gaps-*/*.json
            experiments/ps0/build/host-island-gaps-*/*.log
          if-no-files-found: error
