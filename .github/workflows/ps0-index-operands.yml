name: PS0 native indexing qualification

on:
  pull_request:
    paths: [.github/workflows/ps0-index-operands.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  index-operands:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"4ffb2484eefda87c7e99fab87ca71216e8cc5c4f"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/compiler-fixture-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/compiler-fixture-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/compiler-fixture-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/compiler-fixture-logs/build.log
          lake exe ps0 environment | tee build/compiler-fixture-logs/environment.json
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42630740875
          name: ps0-compiler-listattach-5a5cfe9e35d012c11e735123f941d07a7fdcf85e-42630740875
          github-token: ${{ github.token }}
          path: retained-listattach
      - name: Inspect exact retained indexed signature
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('retained-listattach')
          source=next(root.rglob('converted/src/Init/Data/List/Attach.ps'))
          lines=source.read_text().splitlines()
          print('PS0_RETAINED_INDEX_SIGNATURE:'+repr('\n'.join(lines[691:704])))
          plan=json.loads(next(root.rglob('plan.json')).read_text())
          original=next(root.rglob('original/src/Init/Data/List/Attach.ps')).read_bytes()
          start=sum(len(x) for x in original.splitlines(keepends=True)[:691])
          end=sum(len(x) for x in original.splitlines(keepends=True)[:704])
          print('PS0_RETAINED_INDEX_EDITS:'+json.dumps([e for e in plan['edits'] if start<=e['start']<=end]))
          Path('experiments/ps0/build/retained-index-signature.txt').write_text('\n'.join(lines[695:700])+'\n')
          PY
      - name: Retain native local declaration layouts
        run: lake env lean tests/debug-local-layout.lean 2>&1 | tee build/compiler-fixture-logs/local-layout.log
      - name: Qualify local mixed binder syntax and native linking
        run: python3 tests/run-local-mixed-binders.py
      - name: Qualify native indexed access and source fidelity
        working-directory: experiments/ps0
        run: python3 tests/run-index-operands.py
      - name: Qualify native empty-return line boundaries
        run: python3 tests/run-return-boundary.py
      - name: Retain native where-local and finally layouts
        run: lake env lean tests/debug-where-local-layout.lean 2>&1 | tee build/compiler-fixture-logs/where-local-layout.log
      - name: Inspect syntax-only source where parser
        run: lake exe ps0 check tests/debug-source-where.ps 2>&1 | tee build/compiler-fixture-logs/source-where-layout.log
      - name: Inspect graph fourteen native operand boundaries
        run: |
          set -euo pipefail
          lake exe ps0 check tests/debug-boundary-fourteen.ps 2>&1 | tee build/compiler-fixture-logs/boundary-fourteen-layout.log
      - name: Test-first braced where local helpers
        run: python3 tests/run-where-local-helpers.py
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ps0-native-index-${{ env.PS0_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            experiments/ps0/build/compiler-fixture-logs/boundary-fourteen-layout.log
            experiments/ps0/build/compiler-fixture-logs/where-local-layout.log
            experiments/ps0/build/compiler-fixture-logs/source-where-layout.log
            experiments/ps0/build/return-boundary-*/*.json
            experiments/ps0/build/return-boundary-*/*.log
            experiments/ps0/build/where-local-*/*.c
            experiments/ps0/build/where-local-*/*.olean
            experiments/ps0/build/where-local-*/*.ps
            experiments/ps0/build/where-local-*/*.json
            experiments/ps0/build/where-local-*/*.log
            experiments/ps0/build/local-mixed-*/*.c
            experiments/ps0/build/local-mixed-*/*.olean
            experiments/ps0/build/local-mixed-*/*.ps
            experiments/ps0/build/local-mixed-*/*.json
            experiments/ps0/build/local-mixed-*/*.log
            experiments/ps0/build/index-operands-*/*.json
            experiments/ps0/build/index-operands-*/*.log
          if-no-files-found: error

