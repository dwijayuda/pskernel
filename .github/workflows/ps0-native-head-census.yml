name: PS0 native head census preparation
on:
  pull_request:
    paths: [.github/workflows/ps0-native-head-census.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ps0-native-head-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-head-census:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"0942ac5898b144d0f8ff3181ff6b4dacbfc76b8c"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/native-head-census-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/native-head-census-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/native-head-census-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/native-head-census-logs/build.log
          lake exe ps0 environment | tee build/native-head-census-logs/environment.json
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42553687595
          name: ps0-corpus-source-plan-bb08239fa5caad63c3cf0cb9bea71cfaf23b1a1f-42553687595
          github-token: ${{ github.token }}
          path: source-plans
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42580512720
          name: ps0-transformed-corpus-742c5c180a8ee7314075d63792c220b710e96504-42580512720
          github-token: ${{ github.token }}
          path: native-census-cache
      - name: Prepare native syntax captures and source plans without target graph qualification
        run: |
          set -euo pipefail
          python3 tests/run-compiler-ps.py --source-plans "$GITHUB_WORKSPACE/source-plans" --plan-source bb08239fa5caad63c3cf0cb9bea71cfaf23b1a1f --native-censuses "$GITHUB_WORKSPACE/native-census-cache" --census-source 742c5c180a8ee7314075d63792c220b710e96504 --prepare-only
          python3 tests/test-native-census-cache.py
      - name: Retain exact preparation scope and native lexical census counts
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/native-head-census-logs/native-head-preparation.log
          from pathlib import Path
          from collections import Counter
          import json,os
          from sys import path
          path.insert(0,'tests')
          from native_census_cache import needs_head_lexical_refresh
          root=Path('build/compiler-evidence')
          summary=json.loads((root/'source-plan-summary.json').read_text())
          inventory=json.loads((root/'input-inventory.json').read_text())
          preparation=json.loads((root/'preparation-only.json').read_text())
          assert summary['planner_source']==inventory['source_commit']==preparation['source_commit']==os.environ['PS0_SOURCE_SHA']
          assert summary['module_count']==inventory['module_count']==preparation['module_count']==2569
          assert preparation['compiled_graph'] is False
          assert all(value['body_mode']=='planned-ps-grammar' for value in inventory['inputs'].values())
          scopes=Counter();captures=0
          for file in (root/'current-source-plans').rglob('native-census.json'):
              native=json.loads(file.read_text())
              assert needs_head_lexical_refresh(native) is False,native['module']
              scopes[native.get('adjacentHeadLexicalScope','not-required')]+=1; captures+=1
          evidence={'source':os.environ['PS0_SOURCE_SHA'],'prepared_inputs':2569,
                    'retained_native_censuses':captures,'adjacent_lexical_scopes':dict(scopes),
                    'refreshed_native_censuses':len(summary['refreshed_declaration_censuses']),
                    'reused_native_censuses':len(summary['reused_native_censuses']),
                    'compiled_graph':False,'grammar_migration_complete':False,'verified_execution':False}
          (root/'native-head-preparation.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('PS0_NATIVE_HEAD_CENSUS_PREPARATION:'+json.dumps(evidence,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-native-head-census-${{ env.PS0_SOURCE_SHA }}-${{ github.run_id }}
          path: |
            experiments/ps0/build/native-head-census-logs/
            experiments/ps0/build/compiler-evidence/
          if-no-files-found: error
