name: PS0 NoConfusion exact Lake target diagnosis
on:
  pull_request:
    paths: [.github/workflows/ps0-noconfusion-probe.yml, ci/ps0-noconfusion-probe.py]
permissions:
  contents: read
  actions: read
jobs:
  noconfusion:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"b75a583592dc8bbe9046fd6e93784d8ef0365580"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: dc3c66b1c71cb64f96384a07599d50361e56137d
          path: ps0-harness
          sparse-checkout: experiments/ps0/tests
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          path: recovery-runner
          persist-credentials: false
      - name: Verify exact build harness revision
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/ps0-harness" rev-parse HEAD)" = "dc3c66b1c71cb64f96384a07599d50361e56137d"
          test -s "$GITHUB_WORKSPACE/recovery-runner/ci/ps0-noconfusion-probe.py"
          printf '%s\n' 'PS0_BUILD_HARNESS_SHA=dc3c66b1c71cb64f96384a07599d50361e56137d' >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source without rebuilding the stage driver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
      - name: Verify immutable early checkpoint identity
        uses: actions/github-script@v7
        with:
          script: |
            const a = (await github.rest.actions.getArtifact({owner: 'dwijayuda', repo: 'pskernel', artifact_id: 13870203959})).data;
            if (a.expired || a.workflow_run?.id !== 43039426271 ||
                a.workflow_run.head_sha !== '379d4fda49546a5d6b25744fccbdbddc356cb880' ||
                a.digest !== 'sha256:1ef7c1283e1eed8a43d34a5465d3855f2535d462dcb349f85b336e93b86a4de0') {
              throw Error('early Lean checkpoint identity mismatch');
            }
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 43039426271
          github-token: ${{ github.token }}
          name: ps0-compiler-checkpoint-1-compiler-early-b75a583592dc8bbe9046fd6e93784d8ef0365580-43039426271
          path: checkpoint-download
      - name: Restore exact checkpoint files
        run: |
          set -euo pipefail
          python3 tests/compiler_build_checkpoint.py unpack "$GITHUB_WORKSPACE/checkpoint-download/compiler-checkpoint.tar.gz" "$PWD"
      - name: Install debugger for the isolated compiler process
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq gdb
          fi
          gdb --version | head -n 1
      - name: Reproduce the NoConfusion target from the exact early checkpoint
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/ps0-harness/experiments/ps0/tests" python3 "$GITHUB_WORKSPACE/recovery-runner/ci/ps0-noconfusion-probe.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-noconfusion-probe-${{ github.run_id }}
          path: experiments/ps0/build/noconfusion-probe/
          if-no-files-found: error
