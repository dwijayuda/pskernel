name: PS0 ordinary host artifact inspection
on:
  pull_request:
    paths: [.github/workflows/ps0-ordinary-host-inspection.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ordinary-host-inspection:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: 3e49c4020daeb556b601c33a63f788c2fd4965f5
          sparse-checkout: experiments/ps0/tests/v1/ordinary_host_origins.ps
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42730966108
          name: ps0-host-operand-parity-3e49c4020daeb556b601c33a63f788c2fd4965f5-42730966108
          github-token: ${{ github.token }}
          path: retained
      - name: Rehash actual compiler outputs ELF source maps and plans
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('retained')
          matches=list(root.glob('match-host-*/evidence.json'))
          assert len(matches)==1,matches
          work=matches[0].parent
          e=json.loads(matches[0].read_text())
          assert e['source']=='3e49c4020daeb556b601c33a63f788c2fd4965f5'
          assert e['mapped_definitions']==48 and e['mapped_theorems']==43
          assert e['source_origin_cases']==32
          assert e['logical_imports']==['Init']
          assert e['native_patterns_preserved'] and e['prepared_source_identity']
          assert e['independently_owned_native_dsl'] and e['native_quotation']
          hashes={}
          for ext,relative in [('c','ir/MatchHostBootstrap.c'),('olean','lib/lean/MatchHostBootstrap.olean')]:
              for label in ['baseline','migrated','planned']:
                  file=work/(label+'-MatchHostBootstrap.'+ext)
                  digest=hashlib.sha256(file.read_bytes()).hexdigest()
                  assert digest==e['comparisons'][relative][label]
                  hashes[str(file.relative_to(root))]=digest
              assert len(set(e['comparisons'][relative].values()))==1
          for label in ['baseline','migrated','planned']:
              source=(work/(label+'-MatchHostBootstrap.ps')).read_bytes()
              mapping=json.loads((work/(label+'-source-map.json')).read_text())
              assert mapping['source'].encode()==source
              assert all(segment['kind']=='original' for segment in mapping['segments'])
              census=json.loads((work/(label+'-source-census.json')).read_text())
              assert census['nativeSource'].encode()==source and census['imports']==['Init']
              if label!='baseline':
                  rows=[row['declaration'] for row in census['commands'] if row['declaration']]
                  assert len(rows)==91 and all(row['mode']=='mapped-ps' for row in rows)
          raw=(work/'baseline-MatchHostBootstrap.ps').read_bytes()
          plan=json.loads((work/'planned-edits.json').read_text())
          assert hashlib.sha256(raw).hexdigest()==plan['source_sha256']
          chunks=[];cursor=0
          for edit in plan['edits']:
              assert cursor<=edit['start']<=edit['end']<=len(raw)
              assert raw[edit['start']:edit['end']].decode()==edit['old']
              assert edit['old'].count('\n')==edit['new'].count('\n')
              chunks.extend([raw[cursor:edit['start']],edit['new'].encode()]);cursor=edit['end']
          chunks.append(raw[cursor:])
          planned=b''.join(chunks)
          assert planned==(work/'planned-MatchHostBootstrap.ps').read_bytes()
          assert hashlib.sha256(planned).hexdigest()==plan['result_sha256']
          assert b'\xcf\x80 / \xf0\x9f\x98\x80' in raw and b'\xcf\x80 / \xf0\x9f\x98\x80' in planned
          controls=(work/'native-dependent-if.log').read_text()
          assert 'PS0_NATIVE_DEPENDENT_IF_CONTROL:h:Lean.binderIdent' in controls
          assert 'PS0_NATIVE_DEPENDENT_IF_CONTROL:_:Lean.binderIdent' in controls
          elf=work/'OrdinaryHostOrigins'
          assert elf.read_bytes().startswith(b'\x7fELF')
          digest=hashlib.sha256(elf.read_bytes()).hexdigest()
          assert digest==e['native_executable_sha256']
          hashes[str(elf.relative_to(root))]=digest
          assert (work/'runtime-origins.log').read_text().strip()==e['runtime_oracle']=='PS0_HOST_ORIGINS: PASS'
          fixture=Path('experiments/ps0/tests/v1/ordinary_host_origins.ps')
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()==e['source_origin_fixture_sha256']
          gap_files=list(root.glob('host-island-gaps-*/evidence.json'))
          assert len(gap_files)==1
          gaps=json.loads(gap_files[0].read_text())
          assert gaps['source']==e['source']
          assert {row['case'] for row in gaps['observations']}=={'match','pattern-lambda','record-field','do-if','do-match','do-have','do-for','do-try','proof-if','typed-term','tactic-body','pattern-if','tuple-element','list-element','array-element','interpolation','forall-domain','forall-body','pattern-let','anonymous-constructor','show-body','show-type','pure-have','while-body','while-condition','repeat-body','repeat-condition','loop-for-invariant','loop-invariant-type','loop-while-invariant','loop-while-measure'}
          for row in gaps['observations']:
              assert row['native_baseline_passed'] and row['ps_exit_code']!=0 and row['invalid_host_gap_rejected']
              assert 'PS0V1-CALL-GAP' in (gap_files[0].parent/(row['case']+'-ps.log')).read_text()
          contracts=list(root.glob('loop-contracts-*/evidence.json'))
          assert len(contracts)==1
          contract=json.loads(contracts[0].read_text()); folder=contracts[0].parent
          assert contract['source']==e['source'] and contract['mapped_definitions']==6
          assert contract['logical_imports']==['Std.WP']
          assert contract['annotations_erased_by_native_gadgets'] is True
          for label in ['baseline','migrated','planned']:
              source=(folder/(label+'-source.ps')).read_bytes()
              mapping=json.loads((folder/(label+'-map.json')).read_text())
              census=json.loads((folder/(label+'-census.json')).read_text())
              assert mapping['source'].encode()==source and census['nativeSource'].encode()==source
              assert all(segment['kind']=='original' for segment in mapping['segments'])
              assert census['imports']==['Std.WP']
              if label!='baseline':
                  rows=[r['declaration'] for r in census['commands'] if r['declaration']]
                  assert len(rows)==6 and all(r['mode']=='mapped-ps' for r in rows)
              for ext,relative in [('c','ir/LoopContractBootstrap.c'),('olean','lib/lean/LoopContractBootstrap.olean')]:
                  file=folder/(label+'.'+ext)
                  digest=hashlib.sha256(file.read_bytes()).hexdigest()
                  assert digest==contract['comparisons'][relative][label]
                  hashes[str(file.relative_to(root))]=digest
          assert all(len(set(row.values()))==1 for row in contract['comparisons'].values())
          raw=(folder/'baseline-source.ps').read_bytes()
          plan=json.loads((folder/'plan.json').read_text())
          assert hashlib.sha256(raw).hexdigest()==plan['source_sha256']
          chunks=[];cursor=0
          for edit in plan['edits']:
              assert cursor<=edit['start']<=edit['end']<=len(raw)
              assert raw[edit['start']:edit['end']].decode()==edit['old']
              assert edit['old'].count('\n')==edit['new'].count('\n')
              chunks.extend([raw[cursor:edit['start']],edit['new'].encode()]);cursor=edit['end']
          chunks.append(raw[cursor:]); planned=b''.join(chunks)
          assert planned==(folder/'planned-source.ps').read_bytes()
          assert hashlib.sha256(planned).hexdigest()==plan['result_sha256']
          elf=folder/'LoopContracts'
          assert elf.read_bytes().startswith(b'\x7fELF')
          digest=hashlib.sha256(elf.read_bytes()).hexdigest()
          assert digest==contract['native_executable_sha256']
          hashes[str(elf.relative_to(root))]=digest
          assert (folder/'runtime.log').read_text().strip()==contract['runtime']=='PS0_LOOP_CONTRACTS: PASS'
          out=Path('inspection');out.mkdir()
          report=dict(status='PASS',producer_source=e['source'],producer_run=42730966108,producer_runner='befc48d5b22bd2ea4f56d04d3fcd24d7e2bf417d',
              actual_compiler_files_rehashed=12,actual_native_elf_files_rehashed=2,hashes=hashes,comparisons=e['comparisons'],
              mapped_definitions=48,mapped_theorems=43,source_origin_cases=32,invalid_host_gaps_rejected=31,loop_contract_definitions=6,loop_contract_evidence=contract,
              evidence=e,scope='finite thirty-one ordinary boundaries including loop invariant expression/type and measure roles; native gadget metadata erasure is not proof of annotations; whole compiler qualification remains open',
              grammar_migration_complete=False,verified_execution=False)
          report['producer_job_status']='SUCCESS'
          report['separate_parser_probe']='PASS in producer log: native and PS complete parses at depths 4,8,12,16; timings are producer evidence'
          (out/'inspection.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PS0_ORDINARY_HOST_INSPECTION:'+json.dumps(report,sort_keys=True))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-ordinary-host-inspection-${{ github.run_id }}
          path: inspection/
          if-no-files-found: error
