name: PS0 scoped grammar clean two-stage native build
on:
  pull_request:
    paths: [.github/workflows/ps0-parser-fixed-point.yml, ci/ps0-parser-fixed-point-targets.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ps0-parser-fixed-point-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint-qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: dc3c66b1c71cb64f96384a07599d50361e56137d
          sparse-checkout: experiments/ps0/tests
          persist-credentials: false
      - name: Run checkpoint and partition contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc3c66b1c71cb64f96384a07599d50361e56137d"
          python3 -m py_compile experiments/ps0/tests/run-compiler-ps.py
          python3 experiments/ps0/tests/test-compiler-build-checkpoint.py
  stage-one-base:
    needs: checkpoint-qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          persist-credentials: false
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"bff5d8296cd8798f8c3e9e954ef695f77ea0aec4"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: dc3c66b1c71cb64f96384a07599d50361e56137d
          path: ps0-harness
          sparse-checkout: experiments/ps0/tests
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          path: recovery-runner
          persist-credentials: false
      - name: Verify exact build harness revision
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/ps0-harness" rev-parse HEAD)" = "dc3c66b1c71cb64f96384a07599d50361e56137d"
          test -s "$GITHUB_WORKSPACE/recovery-runner/ci/ps0-parser-fixed-point-targets.json"
          printf '%s\n' 'PS0_BUILD_HARNESS_SHA=dc3c66b1c71cb64f96384a07599d50361e56137d' >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: ps0-elan-input
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/restore@v4
        id: ps0-lean-input
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Install checksum-verified pinned Linux Lean inputs
        run: |
          set -euo pipefail
          ps0_fetch_input() {
            local ps0_url="$1" ps0_api="$2" ps0_target="$3" ps0_digest="$4"
            if test ! -f "$ps0_target"; then
              if ! curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                --retry 5 --retry-max-time 300 --retry-all-errors "$ps0_url" -o "$ps0_target"; then
                curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 \
                  --retry 5 --retry-max-time 300 --retry-all-errors \
                  -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$ps0_api" -o "$ps0_target"
              fi
            fi
            printf '%s  %s\n' "$ps0_digest" "$ps0_target" | sha256sum -c -
          }
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          ps0_fetch_input \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            https://api.github.com/repos/leanprover/elan/releases/assets/529114798 \
            "$RUNNER_TEMP/ps0-elan.tar.gz" \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ps0_fetch_input \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            https://api.github.com/repos/leanprover/lean4/releases/assets/634574462 \
            "$RUNNER_TEMP/ps0-lean.tar.zst" \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
          mkdir -p "$RUNNER_TEMP/ps0-elan-installer" "$RUNNER_TEMP/ps0-lean-verified"
          tar -xzf "$RUNNER_TEMP/ps0-elan.tar.gz" -C "$RUNNER_TEMP/ps0-elan-installer"
          "$RUNNER_TEMP/ps0-elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          tar --zstd -xf "$RUNNER_TEMP/ps0-lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/ps0-lean-verified"
          "$HOME/.elan/bin/elan" toolchain link ps0-pinned-lean-4.35.0 "$RUNNER_TEMP/ps0-lean-verified"
          export ELAN_TOOLCHAIN=ps0-pinned-lean-4.35.0
          echo "ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.elan/bin/lean" --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-elan-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-elan.tar.gz
          key: ps0-linux-elan-42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
      - uses: actions/cache/save@v4
        if: success() && steps.ps0-lean-input.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ps0-lean.tar.zst
          key: ps0-linux-lean-7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
      - name: Record exact source and build clean PS0
        run: |
          set -euo pipefail
          mkdir -p build/transformed-corpus-logs
          test "$(git rev-parse HEAD)" = "$PS0_SOURCE_SHA"
          printf '%s\n' "$PS0_SOURCE_SHA" > build/transformed-corpus-logs/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > build/transformed-corpus-logs/runner-sha.txt
          test "$(git hash-object PS0_V1_LANGUAGE_REFERENCE.md)" = c50203f8e4cb79b3e6680088a07c1d1e145b8f0b
          lake build PS0 ps0 2>&1 | tee build/transformed-corpus-logs/build.log
          lake exe ps0 environment | tee build/transformed-corpus-logs/environment.json
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42553687595
          name: ps0-corpus-source-plan-bb08239fa5caad63c3cf0cb9bea71cfaf23b1a1f-42553687595
          github-token: ${{ github.token }}
          path: source-plans
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42753352309
          name: ps0-data-preparation-4471a585933c6260449fab38642641bc6f2e8b25-42753352309
          github-token: ${{ github.token }}
          path: native-census-cache
      - name: Verify compiler stage prerequisites
        run: |
          set -euo pipefail
          python3 -m py_compile tests/native_compiler_prefix.py tests/run-compiler-ps.py tests/compiler_build_checkpoint.py
          python3 tests/test-compiler-build-checkpoint.py
          python3 tests/test-native-compiler-prefix.py
          python3 tests/test-native-census-cache.py
          lake env lean tests/Graph17TermShapes.lean
          lake env lean tests/Graph19TermShapes.lean
      - name: Native Lake bootstrap compiler base slice
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ps0-harness/experiments/ps0/tests/run-compiler-ps.py" --workspace "$PWD" --source-plans "$GITHUB_WORKSPACE/source-plans" --plan-source bb08239fa5caad63c3cf0cb9bea71cfaf23b1a1f --native-censuses "$GITHUB_WORKSPACE/native-census-cache" --census-source 4471a585933c6260449fab38642641bc6f2e8b25 --build-slice base
          python3 tests/compiler_build_checkpoint.py pack "$PWD" "$PWD/build/compiler-checkpoint.json" "$PWD/build/compiler-checkpoint.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ps0-compiler-checkpoint-1-base-bff5d8296cd8798f8c3e9e954ef695f77ea0aec4-${{ github.run_id }}
          path: experiments/ps0/build/compiler-checkpoint.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps0-compiler-slice-evidence-1-base-bff5d8296cd8798f8c3e9e954ef695f77ea0aec4-${{ github.run_id }}
          path: |
            experiments/ps0/build/transformed-corpus-logs/
            experiments/ps0/build/compiler-evidence/
          if-no-files-found: error
