    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: experiments/ps0
    steps:
      - name: Read exact source pin
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re
          pin={"repository":"dwijayuda/lean4","commit":"bff5d8296cd8798f8c3e9e954ef695f77ea0aec4"}
          assert pin['repository']=='dwijayuda/lean4'
          assert re.fullmatch('[0-9a-f]{40}',pin['commit'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PS0_SOURCE_SHA='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: ${{ env.PS0_SOURCE_SHA }}
          sparse-checkout: experiments/ps0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dwijayuda/lean4
          ref: dc3c66b1c71cb64f96384a07599d50361e56137d
          path: ps0-harness
          sparse-checkout: experiments/ps0/tests
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
          path: recovery-runner
          persist-credentials: false
      - name: Verify exact build harness revision
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/ps0-harness" rev-parse HEAD)" = "dc3c66b1c71cb64f96384a07599d50361e56137d"
          test -s "$GITHUB_WORKSPACE/recovery-runner/ci/ps0-parser-fixed-point-targets.json"
          printf '%s\n' 'PS0_BUILD_HARNESS_SHA=dc3c66b1c71cb64f96384a07599d50361e56137d' >> "$GITHUB_ENV"
