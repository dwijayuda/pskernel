name: PS0 recursive and record boundary parity inspection
on:
  pull_request:
    paths: [.github/workflows/ps0-recursive-boundary-inspection.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recursive-boundaries-rehash:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
