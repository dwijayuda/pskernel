          python3 - <<'PY' | tee native-lexer-pipeline-rehash.log
          from pathlib import Path
          import copy,json,subprocess,sys
          sys.path.insert(0,'experiments/ps0/tests')
          from native_census_cache import needs_head_lexical_refresh
          report=json.loads(Path('recursive-boundaries-rehash.json').read_text())
          rows={r['module']:r for r in report['modules']}
          assert len(rows)==37 and sum(2*len(r['hashes']) for r in rows.values())==148
          assert rows['Lean.Parser.Basic']['definitions']==222
          assert rows['Lean.Compiler.LCNF.CompilerM']['definitions']==67
          def declarations(commands):
              for command in commands:
                  if command['declaration'] is not None: yield command['declaration']
                  yield from declarations(command.get('nestedCommands',[]))
          roles=[]
          for path in Path('recursive-boundaries-artifact').rglob('evidence.json'):
              if not path.parent.name.startswith('compiler-heads-'): continue
              evidence=json.loads(path.read_text()); module=evidence['module']
              if module not in ['Lean.Parser.Basic','Lean.Compiler.LCNF.CompilerM']: continue
              folder=path.parent; relative=Path(*module.split('.')).with_suffix('.ps')
              plan=json.loads((folder/'plan.json').read_text())
              converted=(folder/'converted/src'/relative).read_bytes()
              if module=='Lean.Parser.Basic':
                  native=json.loads((folder/'original-census.json').read_text())
                  assert native['adjacentHeadLexicalScope']=='native-environment/1'
                  assert needs_head_lexical_refresh(native) is False
                  names={d['sourceName']:d for d in declarations(native['commands'])}
                  for name in ['sepBy','sepBy1']:
                      assert names[name]['adjacentCallSpelling']=='«'+name+'»'
                      assert ('function «'+name+'»(').encode() in converted
                  legacy=copy.deepcopy(native); legacy.pop('adjacentHeadLexicalScope')
                  for declaration in declarations(legacy['commands']):
                      declaration.pop('adjacentCallSpelling',None)
                      declaration.pop('nameIdentifierRange',None)
                  assert needs_head_lexical_refresh(legacy) is True
                  legacy_path=Path('legacy-parser-basic-census.json')
                  legacy_path.write_text(json.dumps(legacy))
                  result=subprocess.run([sys.executable,'experiments/ps0/tests/migrate-compiler-heads.py',
                      str(legacy_path),str(folder/'original/src'/relative),'rejected-legacy.ps',
                      '--plan','rejected-legacy-plan.json'],capture_output=True,text=True)
                  assert result.returncode!=0 and 'native adjacent declaration lexer observation required' in result.stderr
                  result=subprocess.run([sys.executable,'experiments/ps0/tests/migrate-compiler-heads.py',
                      str(folder/'original-census.json'),str(folder/'original/src'/relative),'replayed-parser-basic.ps',
                      '--plan','replayed-parser-basic-plan.json'],capture_output=True,text=True)
                  assert result.returncode==0,result.stderr
                  assert Path('replayed-parser-basic.ps').read_bytes()==converted
                  roles.append({'module':module,'native_lexer_escaped_names':['sepBy','sepBy1'],
                                'legacy_native_capture_refresh_required':True,
                                'legacy_planner_counterfactual_rejected':True,'current_capture_replay_identical':True,
                                'native_identifier_edits':[e for e in plan['edits'] if 'native lexer requires' in e['role']]})
              else:
                  groups=[e for e in plan['edits'] if 'group low-precedence native call head' in e['role']]
                  assert groups and b'|>.2.find?)(' in converted
                  roles.append({'module':module,'grouped_low_precedence_heads':groups})
          assert len(roles)==2
          summary={'source':'a5e5ab97b7c02713442264532ca68b6752285733','run':42676437759,
                   'compiler_matrix_modules':37,'compiler_matrix_actual_files_rehashed':148,
                   'additional_local_prelude_files_rehashed':4,'additional_where_prelude_files_rehashed':4,
                   'total_modules':39,'total_actual_files_rehashed':156,'native_roles':roles,
                   'full_graph_build':False,'grammar_migration_complete':False,'verified_execution':False}
          Path('native-lexer-pipeline-rehash.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('PS0_NATIVE_LEXER_PIPELINE_REHASH:'+json.dumps(summary,sort_keys=True))
          PY
