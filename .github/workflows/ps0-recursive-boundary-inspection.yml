          run-id: 42676437759
          name: ps0-compiler-jsonrpc-a5e5ab97b7c02713442264532ca68b6752285733-42676437759
          github-token: ${{ github.token }}
          path: recursive-boundaries-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42676437759
          name: ps0-compiler-environment-a5e5ab97b7c02713442264532ca68b6752285733-42676437759
          github-token: ${{ github.token }}
          path: recursive-boundaries-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42676437759
          name: ps0-compiler-parserbasic14-a5e5ab97b7c02713442264532ca68b6752285733-42676437759
          github-token: ${{ github.token }}
          path: recursive-boundaries-artifact
      - uses: actions/download-artifact@v4
        with:
          repository: dwijayuda/pskernel
          run-id: 42676437759
          name: ps0-compiler-compilerm14-a5e5ab97b7c02713442264532ca68b6752285733-42676437759
          github-token: ${{ github.token }}
          path: recursive-boundaries-artifact
      - name: Rehash compiler outputs and check actual owned do roles
        run: |
          set -euo pipefail
          python3 experiments/ps0/tests/inspect-compiler-fixture-artifact.py recursive-boundaries-artifact --source a5e5ab97b7c02713442264532ca68b6752285733 --output recursive-boundaries-rehash.json | tee recursive-boundaries-rehash.log
          python3 - <<'PY' | tee recursive-boundaries-roles.log
          from pathlib import Path
          from collections import Counter
          import hashlib,json
          root=Path('recursive-boundaries-artifact')
          def decls(commands):
              for command in commands:
                  if command['declaration'] is not None:
                      yield command['declaration']
                  yield from decls(command.get('nestedCommands',[]))
          families={'Lean.Parser.Command.'+n:'PS0.StandardAdapters.ps0Standard'+n.title() for n in ['abbrev','theorem','opaque','axiom','instance','example']}
          checked=0
          for path in root.rglob('original-census.json'):
              original=json.loads(path.read_text()); module=original['module']
              observed=json.loads((path.parent/'migrated/lib/lean'/Path(*module.split('.')).with_suffix('.ilean.ps0-source-census.json')).read_text())
              expected=Counter((d['sourceName'],families[d['production']]) for d in decls(original['commands']) if d['production'] in families)
              actual=Counter((d['sourceName'],d['production']) for d in decls(observed['commands']) if d['production'] in families.values())
              assert actual==expected,(module,actual,expected)
              assert all(d['mode']=='mapped-ps' for d in decls(observed['commands']))
              if module=='Lean.Compiler.DoLayoutProbe':
                  rows={d['sourceName']:d for d in decls(observed['commands'])}
                  for name in ['layoutValue','nestedValue','localDefault','localShared','unitReturn']:
                      assert rows[name]['valueRootKind']=='ps0HostDo'
                      assert rows[name]['doSequenceKind']=='Lean.Parser.Term.doSeqIndent'
                  print('PS0_NATIVE_DO_ROLES:'+json.dumps([{k:r.get(k) for k in ['sourceName','valueRootKind','doSequenceKind','doElementKinds']} for r in rows.values()],sort_keys=True))
              checked+=1
          assert checked==37,checked
          for path in root.rglob('evidence.json'):
              if not path.parent.name.startswith('compiler-heads-'):
                  continue
              evidence=json.loads(path.read_text())
              assert evidence['operator_descriptor_scope']=='active-and-captured-kinds/1'
              kind={'Init.Data.Nat.Internal.Linear':'Lean.Parser.Command.attribute',
                    'Init.Grind.AC':'Lean.Parser.Command.attribute',
                    'Std.Data.Iterators.Producers.Monadic.Empty':'Lean.Parser.Command.structure',
                    'Init.Data.Range.Polymorphic.Internal.SignedBitVec':'Lean.Parser.commandSeal__'}.get(evidence['module'])
              if kind:
                  heads=evidence['contextual_boundary_heads']
                  assert any(h['previousCommandHeadKind']==kind and h['targetKeyword']=='def' for h in heads)
                  print('PS0_CONTEXTUAL_BOUNDARY:'+json.dumps({'module':evidence['module'],'heads':heads},sort_keys=True))
              if evidence['module']=='Std.Do.SPred.Laws':
                  assert len(evidence['scoped_binary_kinds'])==3
                  native=json.loads((path.parent/'original-census.json').read_text())
                  rows={d['sourceName']:d for d in decls(native['commands'])}
                  kinds=[]
                  for name in ['and_curry','or_curry','imp_curry']:
                      result=rows[name]['signatureSyntax']['args'][1]['args'][1]
                      assert result['nativeBinaryOperator']
                      kinds.append(result['kind'])
                  assert kinds==evidence['scoped_binary_kinds']
                  print('PS0_SCOPED_BINARY_BOUNDARY:'+json.dumps({'module':evidence['module'],'kinds':kinds},sort_keys=True))
          seen=set()
          for path in root.rglob('evidence.json'):
              folder=path.parent
              if folder.name.startswith('ellipsis-'):
                  value=json.loads(path.read_text()); assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  data=Path('experiments/ps0/tests/v1/ellipsis_operands.ps').read_bytes()
                  assert hashlib.sha256(data).hexdigest()==value['fixture_sha256']
                  assert value['original_native_node_identity'] is True
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  assert 'PS0V1-CALL-ORDER' in (folder/'named-before-ellipsis.log').read_text()
                  for name in ['nonterminal-ellipsis','repeated-ellipsis']:
                      assert "unexpected '..'" in (folder/(name+'.log')).read_text()
                  seen.add('ellipsis'); print('PS0_NATIVE_ELLIPSIS_EVIDENCE:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('do-layout-'):
                  value=json.loads(path.read_text()); assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  data=Path('experiments/ps0/tests/v1/do_layout_operands.ps').read_bytes()
                  assert hashlib.sha256(data).hexdigest()==value['fixture_sha256']
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  for name in ['return-gap','let-gap','statement-gap']:
                      assert 'PS0V1-CALL-GAP' in (folder/(name+'.log')).read_text()
                  assert 'PS0V1-CALL-ORDER' in (folder/'return-order.log').read_text()
                  assert 'IO Unit' in (folder/'statement-type.log').read_text()
                  seen.add('layout'); print('PS0_NATIVE_DO_EVIDENCE:'+json.dumps(value,sort_keys=True))
          assert seen=={'layout','ellipsis'},seen
          seen_new=set()
          for path in root.rglob('evidence.json'):
              value=json.loads(path.read_text()); folder=path.parent
              if folder.name.startswith('unless-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert value['fixture_sha256']==hashlib.sha256(Path('experiments/ps0/tests/v1/unless_operands.ps').read_bytes()).hexdigest()
                  assert value['original_condition_block_token_ranges'] is True
                  assert value['original_pattern_optional_type_arrow_and_branch_ranges'] is True
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  for name in ['condition-gap','body-gap','term-condition-gap','term-body-gap','pattern-value-gap','pattern-fallback-gap','pattern-continuation-gap']:
                      assert 'PS0V1-CALL-GAP' in (folder/(name+'.log')).read_text()
                  assert 'PS0V1-CALL-ORDER' in (folder/'body-order.log').read_text()
                  seen_new.add('unless')
                  print('PS0_UNLESS_RETAINED:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('lambdas-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert value['fixture_sha256']==hashlib.sha256(Path('experiments/ps0/tests/v1/lambda_operands.ps').read_bytes()).hexdigest()
                  assert value['original_lambda_and_arrow_token_checks']==2
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  assert 'PS0V1-CALL-GAP' in (folder/'unicode-body-gap.log').read_text()
                  assert 'PS0V1-CALL-ORDER' in (folder/'unicode-body-order.log').read_text()
                  seen_new.add('lambda')
                  print('PS0_UNICODE_LAMBDA_RETAINED:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('command-operands-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert 'included' in value['mapped_source_names']
                  assert 'PS0V1-CALL-GAP' in (folder/'include-gap.log').read_text()
                  seen_new.add('include')
                  print('PS0_INCLUDE_RETAINED:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('compiler-heads-') and value.get('module') in ['Lean.Compiler.UnlessProbe','Lean.Compiler.InlineAttrs','Init.WF']:
                  rows={r['sourceName']:r for r in value['mapped_source_roles']}
                  if value['module']=='Lean.Compiler.UnlessProbe':
                      assert rows['bodyValue']['doUnlessConditionKinds']==['ps0HostAdjacentCall']*2
                      assert rows['patternValue']['doPatternBindingCount']==1
                      assert rows['patternValue']['doUnlessConditionKinds']==['ps0HostAdjacentCall']
                      assert rows['termValue']['valueRootKind']=='Lean.Parser.Term.termUnless'
                  if value['module']=='Lean.Compiler.InlineAttrs':
                      assert rows['isValidMacroInline']['doPatternBindingCount']==1
                      assert 'PS0.Operators.ownedBinary' in rows['isValidMacroInline']['doUnlessConditionKinds']
                  if value['module']=='Init.WF':
                      observed=next(d for d in value['non_definition_source_roles'] if d['sourceName']=='induction')
                      assert observed['mode']=='mapped-ps' and observed['production']=='PS0.StandardAdapters.ps0StandardTheorem'
                  print('PS0_UNLESS_INCLUDE_SOURCE_ROLES:'+json.dumps({'module':value['module'],'rows':list(rows.values())},sort_keys=True))
          assert seen_new=={'unless','lambda','include'},seen_new
          recursive_seen=False
          for path in root.rglob('evidence.json'):
              value=json.loads(path.read_text()); folder=path.parent
              if folder.name.startswith('local-recursion-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert value['fixture_sha256']==hashlib.sha256(Path('experiments/ps0/tests/v1/local_recursion_operands.ps').read_bytes()).hexdigest()
                  assert value['original_let_rec_separator_and_root_ranges'] is True
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  assert len(value['mapped_recursive_roles'])==4
                  assert all(row['recursiveGroupCount']==1 for row in value['mapped_recursive_roles'])
                  for name in ['binder-gap','default-gap','body-gap','equation-gap']:
                      assert 'PS0V1-CALL-GAP' in (folder/(name+'.log')).read_text()
                  assert 'PS0V1-CALL-ORDER' in (folder/'body-order.log').read_text()
                  diagnostic=(folder/'default-type.log').read_text()
                  assert all(text in diagnostic for text in ['Application type mismatch','String','Nat'])
                  recursive_seen=True
                  print('PS0_LOCAL_REC_RETAINED:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('lambdas-'):
                  assert value['native_and_ps_invalid_multi_pun_rejection']=='not a field of structure'
                  assert value['native_and_ps_coerced_invalid_multi_pun_rejection']=='not a field of structure'
                  assert value['native_and_ps_argument_collection_typing_rejection']=='Singleton'
                  assert value['direct_and_local_body_wrappers_and_original_root_range'] is True
                  assert value['body_wrapper_opening_and_closing_source_ranges'] is True
                  for name in ['native-argument-wrapper','argument-wrapper']:
                      assert 'Singleton' in (folder/(name+'.log')).read_text()
                  for name in ['native-invalid-punning','invalid-punning','native-coerced-invalid-punning','coerced-invalid-punning']:
                      assert 'not a field of structure' in (folder/(name+'.log')).read_text()
              if not folder.name.startswith('compiler-heads-'): continue
              plan=json.loads((folder/'plan.json').read_text())
              expected={'Lean.Data.Options':'lambda binder type',
                        'Std.Data.ExtDTreeMap.Basic':'lambda result type'}.get(value['module'])
              if expected:
                  assert any(expected in edit['role'] for edit in plan['edits']),value['module']
              if value['module']=='Init.Data.Stream':
                  rows={row['sourceName']:row for row in value['mapped_source_roles']}
                  assert rows['Stream.forIn']['recursiveGroupCount']==1
                  assert rows['Stream.forIn']['recursiveSimpleValueKinds']==['ps0HostDo']
              if value['module']=='Std.Time.Time.Unit.Nanosecond':
                  assert sum(bool(row['nativeDefDeriving']) for row in value['mapped_source_roles'])==4
              if value['module']=='Init.Data.Range.Polymorphic.Char':
                  observed=json.loads((folder/'migrated/lib/lean/Init/Data/Range/Polymorphic/Char.ilean.ps0-source-census.json').read_text())
                  assert any(d.get('whereFieldCount')==2 for d in decls(observed['commands']))
          assert recursive_seen
          indexed_seen=False
          local_mixed_seen=False
          where_local_seen=False
          module_boundaries=set()
          for path in root.rglob('evidence.json'):
              value=json.loads(path.read_text()); folder=path.parent
              if folder.name.startswith('index-operands-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert value['fixture_sha256']==hashlib.sha256(Path('experiments/ps0/tests/v1/index_operands.ps').read_bytes()).hexdigest()
                  assert value['original_index_tokens_and_ranges']==13
                  assert value['original_projection_tokens_and_ranges']==3
                  assert value['original_transport_token_and_range'] is True
                  assert value['native_transport_shape']=={'kind':'Lean.Parser.Term.subst','arity':3,'token':'▸'}
                  assert value['native_builtin_role_annotation_parity'] is True
                  assert value['native_projected_index_quotation_ownership'] is True
                  assert value['projected_oracle']=='PS0_PROJECTED_INDEX:3:2:1'
                  assert value['projected_oracle'] in (folder/'runtime.log').read_text()
                  shapes={row['kind']:row['arity'] for row in value['native_syntax_shapes']}
                  assert shapes=={'«term__[_]»':4,"«term__[_]'_»":5,'«term__[_]_?»':7,'«term__[_]_!»':7,
                                  'Array.«term__[_:_]»':6,'Array.«term__[_:]»':5,'Array.«term__[:_]»':5},shapes
                  assert value['oracle']=='PS0_INDEX:3:2:3:2:3:2:1:1'
                  assert value['oracle'] in (folder/'runtime.log').read_text()
                  assert 'PS0_INDEX_PARSE_ERROR' not in (folder/'parser-layout.log').read_text()
                  assert 'Lean checking passed' in (folder/'check.log').read_text()
                  for name in ['index-gap','proof-gap','slice-gap','projected-index-gap','projected-slice-gap','transport-gap']:
                      assert 'PS0V1-CALL-GAP' in (folder/(name+'.log')).read_text()
                  for name in ['index-order','slice-order','projected-index-order']:
                      assert 'PS0V1-CALL-ORDER' in (folder/(name+'.log')).read_text()
                  assert 'type mismatch' in (folder/'proof-type.log').read_text().lower()
                  indexed_seen=True
                  print('PS0_NATIVE_INDEX_RETAINED:'+json.dumps(value,sort_keys=True))
              if folder.name.startswith('local-mixed-'):
                  assert value['source']=='a5e5ab97b7c02713442264532ca68b6752285733'
                  assert value['fixture_sha256']==hashlib.sha256(Path('experiments/ps0/tests/v1/local_mixed_binders.ps').read_bytes()).hexdigest()
                  assert value['origin_cases']==6 and value['rejection_cases']==6
