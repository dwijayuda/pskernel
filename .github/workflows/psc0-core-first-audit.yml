name: PSC0 Core language and environment (Linux)

on:
  push:
    branches: [psc0/core-first-environments-20261019]
    paths:
      - 'psc0/packages/**/src/**'
      - 'psc0/packages/pskernel-lean/provider/**'
      - 'psc0/host/src/**'
      - 'psc0/lakefile.lean'
      - 'psc0/lake-manifest.json'
      - 'psc0/lean-toolchain'
      - 'psc0/v7-native/**'
      - 'psc0/scripts/core-first-*.py'
      - 'psc0/scripts/Pscv0Core*.lean'
      - 'psc0/test/Pscv0Core*.lean'
      - 'psc0/test/Pscv0M3*.lean'
      - 'psc0/scripts/pscv0-m3-*.mjs'
      - 'psc0/test/Pscv0Native*.lean'
      - 'psc0/scripts/Pscv0Native.lean'
      - 'psc0/scripts/Pscv0M1Harness.lean'
      - 'psc0/test/Pscv0PlatformTests.lean'
      - 'psc0/test/Pscv0GetElemOracle.lean'
      - 'psc0/test/Pscv0FloatConstructiveOracle.lean'
      - 'psc0/scripts/pscv0-native-*.mjs'
      - 'psc0/selfhost/core-v7/**'
      - 'psc0/test/Pscv0Bootstrap*.lean'
      - 'psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md'
      - 'psc0/docs/PSCV0_REFERENCE_ADOPTION.json'
      - 'psc0/scripts/pscv0-native-profile.mjs'
      - 'psc0/scripts/pscv0-reference-identity.mjs'
      # Core design/evidence ledgers are not loadable profile inputs.
      - '.github/workflows/psc0-core-first-audit.yml'
      - '.github/workflows/psc0-m3-recursive-deriving.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc0-core-first-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact qualified Stage 0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 33676076bcda7b0de5ec1f9803f49b8b1d28a058
          path: stage0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/
      - name: Audit exact source imports, feature signals, assets and package manifests
        shell: bash
        run: |
          python3 candidate/psc0/scripts/core-first-source-audit.py --stage0 stage0 --candidate candidate --output audit/source-inventory.json
          sha256sum audit/source-inventory.json > audit/SHA256SUMS
      - name: Preserve the complete source inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psc0-core-first-source-audit-${{ github.sha }}
          path: audit/
          if-no-files-found: error
          retention-days: 30

  native-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/selfhost/core-v7/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - name: Restore the exact pinned Lean toolchain
        id: lean-toolchain
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan/toolchains/leanprover--lean4---v4.35.0
          key: pscv0-lean-eb6cafb7290e8bd5f2937522d8d804f58f02bafc-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify and retain the exact Lean toolchain
        run: |
          set -euo pipefail
          lean --version | tee "$RUNNER_TEMP/pscv0-toolchain-version.txt"
          grep -F 'version 4.35.0' "$RUNNER_TEMP/pscv0-toolchain-version.txt"
          grep -F 'eb6cafb7290e8bd5f2937522d8d804f58f02bafc' "$RUNNER_TEMP/pscv0-toolchain-version.txt"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        with:
          path: ~/.elan/toolchains/leanprover--lean4---v4.35.0
          key: pscv0-lean-eb6cafb7290e8bd5f2937522d8d804f58f02bafc-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Compile only the independent seam probe
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/seams
          lean --version | tee ../dist/core-first/seams/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/seams/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/seams/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/seams/build-resource.txt lake build pscv0_core_seams 2>&1 | tee ../dist/core-first/seams/build.log
      - name: Check isolated hashing, actual replay dependency and rejection
        run: |
          set -euo pipefail
          .lake/build/bin/pscv0_core_seams 2>&1 | tee ../dist/core-first/seams/check.log
          sha256sum .lake/build/bin/pscv0_core_seams > ../dist/core-first/seams/executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_seams > ../dist/core-first/seams/executable-bytes.txt
      - name: Check explicit compiler context and runtime selection
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/engine-build-resource.txt lake build pscv0_core_engine_seams 2>&1 | tee ../dist/core-first/seams/engine-build.log
          .lake/build/bin/pscv0_core_engine_seams 2>&1 | tee ../dist/core-first/seams/engine-check.log
      - name: Check selected source against the independently checked small base
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/selected-build-resource.txt lake build pscv0_core_selected 2>&1 | tee ../dist/core-first/seams/selected-build.log
          .lake/build/bin/pscv0_core_selected 2>&1 | tee ../dist/core-first/seams/selected-check.log
          sha256sum .lake/build/bin/pscv0_core_selected > ../dist/core-first/seams/selected-executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_selected > ../dist/core-first/seams/selected-executable-bytes.txt
      - name: Check native module and legacy equation visibility
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/seams
          lake env python3 ../scripts/core-first-module-native-oracle.py 2>&1 | tee ../dist/core-first/seams/module-native-oracle.log
      - name: Check selected project imports and retained environment
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/project-build-resource.txt lake build pscv0_core_project 2>&1 | tee ../dist/core-first/seams/project-build.log
          .lake/build/bin/pscv0_core_project 2>&1 | tee ../dist/core-first/seams/project-check.log
          lake env lean ../test/Pscv0CoreVisibilityOracle.lean 2>&1 | tee ../dist/core-first/seams/visibility-native-oracle.log
          sha256sum .lake/build/bin/pscv0_core_project > ../dist/core-first/seams/project-executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_project > ../dist/core-first/seams/project-executable-bytes.txt
      - name: Check inspection commands, unchanged admissions and native diagnostics
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/seams/inspection
          /usr/bin/time -v -o ../dist/core-first/seams/inspection-build-resource.txt lake build pscv0_core_inspection 2>&1 | tee ../dist/core-first/seams/inspection-build.log
          .lake/build/bin/pscv0_core_inspection ../dist/core-first/seams/inspection 2>&1 | tee ../dist/core-first/seams/inspection-check.log
          lake env python3 ../scripts/core-first-inspection-native-oracle.py ../dist/core-first/seams/inspection/native-fixtures.json 2>&1 | tee ../dist/core-first/seams/inspection-native-oracle.log
          sha256sum .lake/build/bin/pscv0_core_inspection > ../dist/core-first/seams/inspection-executable.sha256
      - name: Check computed and let elimination targets against pinned native rules
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/elimination-build-resource.txt lake build pscv0_core_elimination 2>&1 | tee ../dist/core-first/seams/elimination-build.log
          .lake/build/bin/pscv0_core_elimination 2>&1 | tee ../dist/core-first/seams/elimination-check.log
          sha256sum .lake/build/bin/pscv0_core_elimination > ../dist/core-first/seams/elimination-executable.sha256
      - name: Retain the qualified complete Foundation source regression
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/compiler-source-build-resource.txt lake build pscv0_core_compiler_source 2>&1 | tee ../dist/core-first/seams/compiler-source-build.log
          /usr/bin/time -v -o ../dist/core-first/seams/compiler-source-resource.txt .lake/build/bin/pscv0_core_compiler_source ../packages/foundation/src/Ps/Foundation/Source.lean ../packages/foundation/src/Ps/Foundation/List.lean ../selfhost/core-v7/Ps/Foundation/Source.ps ../selfhost/core-v7/Ps/Foundation/List.ps ../packages/environment/src/Ps/Environment/CompilerSourceCandidateData.lean ../dist/core-first/seams/compiler-source-qualification.json 2>&1 | tee ../dist/core-first/seams/compiler-source-check.log
          sha256sum .lake/build/bin/pscv0_core_compiler_source > ../dist/core-first/seams/compiler-source-executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_compiler_source > ../dist/core-first/seams/compiler-source-executable-bytes.txt
      - name: Summarize actual seam build resource observations
        if: always()
        run: |
          python3 ../scripts/core-first-ci-evidence.py resources ../dist/core-first/seams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psc0-core-first-seams-${{ github.sha }}
          path: psc0/dist/core-first/seams/
          if-no-files-found: error
          retention-days: 30

