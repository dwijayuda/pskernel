  candidate-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/selfhost/core-v7/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - name: Restore the exact pinned Lean toolchain
        id: lean-toolchain
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.elan/toolchains/leanprover--lean4---v4.35.0
          key: pscv0-lean-eb6cafb7290e8bd5f2937522d8d804f58f02bafc-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify and retain the exact Lean toolchain
        run: |
          set -euo pipefail
          lean --version | tee "$RUNNER_TEMP/pscv0-toolchain-version.txt"
          grep -F 'version 4.35.0' "$RUNNER_TEMP/pscv0-toolchain-version.txt"
          grep -F 'eb6cafb7290e8bd5f2937522d8d804f58f02bafc' "$RUNNER_TEMP/pscv0-toolchain-version.txt"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        with:
          path: ~/.elan/toolchains/leanprover--lean4---v4.35.0
          key: pscv0-lean-eb6cafb7290e8bd5f2937522d8d804f58f02bafc-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Check the selected language parser and elaborator before native linking
        id: proof_frontend
        run: |
          set -euo pipefail
          lake build Ps.Syntax.Pscv0.TermRead Ps.Syntax.Lean.Term Ps.Compiler.Pscv0ModuleEngine
      - name: Build the native proof-closure authorer
        id: ext_build
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/authoring
          printf '%s\n' "$GITHUB_SHA" > ../dist/core-first/authoring/source-sha.txt
          /usr/bin/time -v -o ../dist/core-first/authoring/ext-build-resource.txt lake build pscv0_core_environment_export 2>&1 | tee ../dist/core-first/authoring/ext-build.log
      - name: Author and independently check the actual native ext theorem closure
        if: ${{ !cancelled() && steps.ext_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/ext-resource.txt lake env .lake/build/bin/pscv0_core_environment_export ext ../dist/core-first/authoring/CoreExtCandidate.lean 2>&1 | tee ../dist/core-first/authoring/ext-export.log
          sha256sum ../dist/core-first/authoring/CoreExtCandidate.lean > ../dist/core-first/authoring/ext.sha256
      - name: Measure pinned calc class and instance metadata independently
        if: ${{ !cancelled() && steps.ext_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_core_environment_export calc-metadata ../dist/core-first/authoring/calc-native-metadata.json 2>&1 | tee ../dist/core-first/authoring/calc-native-metadata.log
      - name: Measure pinned default simplifier metadata independently
        if: ${{ !cancelled() && steps.ext_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_core_environment_export simp-metadata ../dist/core-first/authoring/simp-native-metadata.json 2>&1 | tee ../dist/core-first/authoring/simp-native-metadata.log
      - name: Build unchanged Full composition and empty-boundary authorer
        id: build
        if: ${{ !cancelled() && steps.ext_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/authoring
          printf '%s\n' "$GITHUB_SHA" > ../dist/core-first/authoring/source-sha.txt
          lean --version | tee ../dist/core-first/authoring/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/authoring/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/authoring/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/authoring/build-resource.txt lake build pscv0_native pscv0_native_checks pscv0_core_environment_export pscv0_core_native_closure pscv0_core_native_seed_checks pscv0_bootstrap_compatibility 2>&1 | tee ../dist/core-first/authoring/build.log
      - name: Check native seed APIs and exact empty-boundary mutation controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_core_native_seed_checks 2>&1 | tee ../dist/core-first/authoring/seed-controls.log
      - name: Measure the compiler-owned native declaration closure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/native-closure-resource.txt lake env .lake/build/bin/pscv0_core_native_closure ../dist/core-first/authoring/native-closure.json 2>&1 | tee ../dist/core-first/authoring/native-closure.log
          python3 ../scripts/core-first-ci-evidence.py native-closure ../dist/core-first/authoring/native-closure.json
      - name: Preserve exact Full identities and independent checks
        id: full_checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          .lake/build/bin/pscv0_native --audit-primitives > ../dist/core-first/authoring/full-primitive-audit.json
          .lake/build/bin/pscv0_native --audit-standard-closure > ../dist/core-first/authoring/full-closure.json
          .lake/build/bin/pscv0_native --audit-standard-surface > ../dist/core-first/authoring/full-surface.json
          .lake/build/bin/pscv0_native_checks 2>&1 | tee ../dist/core-first/authoring/full-native-checks.log
      - name: Emit the checked development-baseline application
        id: baseline_emit
        if: ${{ !cancelled() && steps.full_checks.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/language-baseline
          printf '%s\n' "$GITHUB_SHA" > ../dist/core-first/language-baseline/source-sha.txt
          .lake/build/bin/pscv0_native --version | tee ../dist/core-first/language-baseline/native-version.json
          .lake/build/bin/pscv0_native --emit-all ../dist/pscv0-native/application.ps ../dist/pscv0-native/application | tee ../dist/core-first/language-baseline/emission.log
          sha256sum ../dist/pscv0-native/application.* > ../dist/core-first/language-baseline/application.sha256
      - name: Execute development-baseline TypeScript and JavaScript
        if: ${{ !cancelled() && steps.baseline_emit.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pscv0-native-tools" --ignore-scripts --no-audit --no-fund --no-package-lock typescript@7.0.2
          PSC0_CORE_TSC="$RUNNER_TEMP/pscv0-native-tools/node_modules/.bin/tsc"
          "$PSC0_CORE_TSC" --version | tee ../dist/core-first/language-baseline/typescript-version.txt
          grep -Fx 'Version 7.0.2' ../dist/core-first/language-baseline/typescript-version.txt
          mkdir -p ../dist/pscv0-native/ts-compiled
          "$PSC0_CORE_TSC" --ignoreConfig ../dist/pscv0-native/application.ts --outDir ../dist/pscv0-native/ts-compiled --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-native-runtime.mjs ../dist/pscv0-native/ts-compiled/application.js typescript | tee ../dist/core-first/language-baseline/typescript.log
          node ../scripts/pscv0-native-runtime.mjs ../dist/pscv0-native/application.js directjs | tee ../dist/core-first/language-baseline/javascript.log
      - name: Execute development-baseline Rust
        if: ${{ !cancelled() && steps.baseline_emit.outcome == 'success' }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version | tee ../dist/core-first/language-baseline/rust-version.txt
          node ../scripts/pscv0-native-rust.mjs ../dist/pscv0-native
          rustup run 1.98.1 cargo run --manifest-path rust/Cargo.toml --locked --release --bin pscv0-native-runtime-check 2>&1 | tee ../dist/core-first/language-baseline/rust.log
      - name: Preserve development-baseline language runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psc0-core-language-baseline-${{ github.sha }}
          path: |
            psc0/dist/core-first/language-baseline/
            psc0/dist/pscv0-native/application.*
            psc0/dist/pscv0-native/semantic.json
            psc0/dist/pscv0-native/rust-checks.rs
            psc0/dist/pscv0-native/ts-compiled/application.js
          if-no-files-found: warn
          retention-days: 30
      - name: Compare the actual Bootstrap asset literally with Full
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_bootstrap_compatibility ../dist/core-first/authoring/bootstrap-full-compatibility.json 2>&1 | tee ../dist/core-first/authoring/bootstrap-full-compatibility.log
          python3 ../scripts/core-first-ci-evidence.py bootstrap-compatibility ../dist/core-first/authoring/bootstrap-full-compatibility.json
      - name: Author and check the standalone bootstrap candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/bootstrap-resource.txt .lake/build/bin/pscv0_core_environment_export bootstrap ../dist/core-first/authoring/CoreBootstrapCandidate.lean 2>&1 | tee ../dist/core-first/authoring/bootstrap-export.log | sed '/^PSCV0_STANDARD_SOURCE /d'
          cmp ../dist/core-first/authoring/CoreBootstrapCandidate.lean ../packages/environment/src/Ps/Environment/BootstrapData.lean
          sha256sum ../dist/core-first/authoring/CoreBootstrapCandidate.lean > ../dist/core-first/authoring/bootstrap.sha256
          python3 ../scripts/core-first-ci-evidence.py bootstrap-source ../dist/core-first/authoring/CoreBootstrapCandidate.lean
      - name: Measure native compiler-source foundation metadata
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_core_environment_export foundation-metadata ../dist/core-first/authoring/foundation-native-metadata.json 2>&1 | tee ../dist/core-first/authoring/foundation-native-metadata.log
      - name: Author the complete compiler-source foundation candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          printf '%s\n' '33d898574406817537cc0c1a728e50eae2838a47178ad1fe4adba53d54d6c736  ../packages/foundation/src/Ps/Foundation/Source.lean' '0a73eb4dded33cd9fecf000996653746800ea5fb05956e46670a7d3579426680  ../packages/foundation/src/Ps/Foundation/List.lean' | sha256sum --check
          sha256sum ../packages/foundation/src/Ps/Foundation/Source.lean ../packages/foundation/src/Ps/Foundation/List.lean ../selfhost/core-v7/Ps/Foundation/Source.ps ../selfhost/core-v7/Ps/Foundation/List.ps | tee ../dist/core-first/authoring/foundation-workload.sha256
          wc -c ../packages/foundation/src/Ps/Foundation/Source.lean ../packages/foundation/src/Ps/Foundation/List.lean ../selfhost/core-v7/Ps/Foundation/Source.ps ../selfhost/core-v7/Ps/Foundation/List.ps | tee ../dist/core-first/authoring/foundation-workload-bytes.txt
          /usr/bin/time -v -o ../dist/core-first/authoring/foundation-resource.txt .lake/build/bin/pscv0_core_environment_export foundation ../dist/core-first/authoring/CoreFoundationCandidate.lean 2>&1 | tee ../dist/core-first/authoring/foundation-export.log | sed '/^PSCV0_STANDARD_SOURCE /d'
          cmp ../dist/core-first/authoring/CoreFoundationCandidate.lean ../packages/environment/src/Ps/Environment/CompilerSourceCandidateData.lean
          sha256sum ../dist/core-first/authoring/CoreFoundationCandidate.lean > ../dist/core-first/authoring/foundation.sha256
          python3 ../scripts/core-first-ci-evidence.py foundation-source ../dist/core-first/authoring/CoreFoundationCandidate.lean
      - name: Author and check the standalone compiler byte-word candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/byte-word-resource.txt .lake/build/bin/pscv0_core_environment_export byte-word ../dist/core-first/authoring/CoreByteWordCandidate.lean 2>&1 | tee ../dist/core-first/authoring/byte-word-export.log | sed '/^PSCV0_STANDARD_SOURCE /d'
          sha256sum ../dist/core-first/authoring/CoreByteWordCandidate.lean > ../dist/core-first/authoring/byte-word.sha256
      - name: Summarize actual authoring build and source measurements
        if: always()
        run: |
          python3 ../scripts/core-first-ci-evidence.py resources ../dist/core-first/authoring
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && !cancelled() && (steps.proof_frontend.outcome != 'skipped' || steps.ext_build.outcome != 'skipped' || steps.build.outcome != 'skipped')
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psc0-core-first-authoring-${{ github.sha }}
          path: psc0/dist/core-first/authoring/
          if-no-files-found: error
          retention-days: 30

  language-m3:
    uses: ./.github/workflows/psc0-m3-recursive-deriving.yml
