          grep -F 'eb6cafb7290e8bd5f2937522d8d804f58f02bafc' "$RUNNER_TEMP/pscv0-toolchain-version.txt"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        with:
          path: ~/.elan/toolchains/leanprover--lean4---v4.35.0
          key: pscv0-lean-eb6cafb7290e8bd5f2937522d8d804f58f02bafc-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build the independent Bootstrap replay
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/bootstrap
          lean --version | tee ../dist/core-first/bootstrap/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/bootstrap/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/bootstrap/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/bootstrap/build-resource.txt lake build pscv0_bootstrap_replay 2>&1 | tee ../dist/core-first/bootstrap/build.log
      - name: Replay the exact Bootstrap asset in an empty kernel
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/bootstrap/replay-resource.txt lake env .lake/build/bin/pscv0_bootstrap_replay ../packages/environment/src/Ps/Environment/BootstrapData.lean ../dist/core-first/bootstrap/bootstrap-manifest.json 2>&1 | tee ../dist/core-first/bootstrap/check.log
          sha256sum ../packages/environment/src/Ps/Environment/BootstrapData.lean .lake/build/bin/pscv0_bootstrap_replay > ../dist/core-first/bootstrap/SHA256SUMS
