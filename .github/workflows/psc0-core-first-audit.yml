name: PSC0 Core-first source inventory (Linux)

on:
  push:
    branches: [psc0/core-first-environments-20261019]
    paths:
      - 'psc0/packages/**/src/**'
      - 'psc0/packages/pskernel-lean/provider/**'
      - 'psc0/host/src/**'
      - 'psc0/lakefile.lean'
      - 'psc0/lake-manifest.json'
      - 'psc0/lean-toolchain'
      - 'psc0/v7-native/**'
      - 'psc0/scripts/core-first-*.py'
      - 'psc0/scripts/Pscv0Core*.lean'
      - 'psc0/test/Pscv0Core*.lean'
      - 'psc0/test/Pscv0Bootstrap*.lean'
      - 'psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md'
      - 'psc0/docs/PSCV0_REFERENCE_ADOPTION.json'
      - 'psc0/scripts/pscv0-native-profile.mjs'
      - 'psc0/scripts/pscv0-reference-identity.mjs'
      # Core design/evidence ledgers are not loadable profile inputs.
      - '.github/workflows/psc0-core-first-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc0-core-first-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact qualified Stage 0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 33676076bcda7b0de5ec1f9803f49b8b1d28a058
          path: stage0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/
      - name: Audit exact source imports, feature signals, assets and package manifests
        shell: bash
        run: |
          python3 candidate/psc0/scripts/core-first-source-audit.py --stage0 stage0 --candidate candidate --output audit/source-inventory.json
          sha256sum audit/source-inventory.json > audit/SHA256SUMS
      - name: Preserve the complete source inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psc0-core-first-source-audit-${{ github.sha }}
          path: audit/
          if-no-files-found: error
          retention-days: 30

  native-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Compile only the independent seam probe
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/seams
          lean --version | tee ../dist/core-first/seams/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/seams/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/seams/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/seams/build-resource.txt lake build pscv0_core_seams 2>&1 | tee ../dist/core-first/seams/build.log
      - name: Check isolated hashing, actual replay dependency and rejection
        run: |
          set -euo pipefail
          .lake/build/bin/pscv0_core_seams 2>&1 | tee ../dist/core-first/seams/check.log
          sha256sum .lake/build/bin/pscv0_core_seams > ../dist/core-first/seams/executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_seams > ../dist/core-first/seams/executable-bytes.txt
      - name: Check explicit compiler context and runtime selection
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/engine-build-resource.txt lake build pscv0_core_engine_seams 2>&1 | tee ../dist/core-first/seams/engine-build.log
          .lake/build/bin/pscv0_core_engine_seams 2>&1 | tee ../dist/core-first/seams/engine-check.log
      - name: Check selected source against the independently checked small base
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/seams/selected-build-resource.txt lake build pscv0_core_selected 2>&1 | tee ../dist/core-first/seams/selected-build.log
          .lake/build/bin/pscv0_core_selected 2>&1 | tee ../dist/core-first/seams/selected-check.log
          sha256sum .lake/build/bin/pscv0_core_selected > ../dist/core-first/seams/selected-executable.sha256
          stat -c '%s' .lake/build/bin/pscv0_core_selected > ../dist/core-first/seams/selected-executable-bytes.txt
      - name: Summarize actual seam build resource observations
        if: always()
        run: |
          python3 ../scripts/core-first-ci-evidence.py resources ../dist/core-first/seams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psc0-core-first-seams-${{ github.sha }}
          path: psc0/dist/core-first/seams/
          if-no-files-found: error
          retention-days: 30

  bootstrap-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build the independent Bootstrap replay
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/bootstrap
          lean --version | tee ../dist/core-first/bootstrap/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/bootstrap/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/bootstrap/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/bootstrap/build-resource.txt lake build pscv0_bootstrap_replay 2>&1 | tee ../dist/core-first/bootstrap/build.log
      - name: Replay the exact Bootstrap asset in an empty kernel
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/bootstrap/replay-resource.txt lake env .lake/build/bin/pscv0_bootstrap_replay ../packages/environment/src/Ps/Environment/BootstrapData.lean ../dist/core-first/bootstrap/bootstrap-manifest.json 2>&1 | tee ../dist/core-first/bootstrap/check.log
          sha256sum ../packages/environment/src/Ps/Environment/BootstrapData.lean .lake/build/bin/pscv0_bootstrap_replay > ../dist/core-first/bootstrap/SHA256SUMS
          stat -c '%s' .lake/build/bin/pscv0_bootstrap_replay > ../dist/core-first/bootstrap/executable-bytes.txt
      - name: Summarize Bootstrap resource observations
        if: always()
        run: |
          python3 ../scripts/core-first-ci-evidence.py resources ../dist/core-first/bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psc0-core-bootstrap-${{ github.sha }}
          path: psc0/dist/core-first/bootstrap/
          if-no-files-found: error
          retention-days: 30

  candidate-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Build unchanged Full composition and empty-boundary authorer
        id: build
        run: |
          set -euo pipefail
          mkdir -p ../dist/core-first/authoring
          printf '%s\n' "$GITHUB_SHA" > ../dist/core-first/authoring/source-sha.txt
          lean --version | tee ../dist/core-first/authoring/toolchain.txt
          grep -F '4.35.0' ../dist/core-first/authoring/toolchain.txt
          grep -F 'eb6cafb' ../dist/core-first/authoring/toolchain.txt
          /usr/bin/time -v -o ../dist/core-first/authoring/build-resource.txt lake build pscv0_native pscv0_native_checks pscv0_core_environment_export pscv0_core_native_closure pscv0_core_native_seed_checks pscv0_bootstrap_compatibility 2>&1 | tee ../dist/core-first/authoring/build.log
      - name: Check native seed APIs and exact empty-boundary mutation controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_core_native_seed_checks 2>&1 | tee ../dist/core-first/authoring/seed-controls.log
      - name: Measure the compiler-owned native declaration closure
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/native-closure-resource.txt lake env .lake/build/bin/pscv0_core_native_closure ../dist/core-first/authoring/native-closure.json 2>&1 | tee ../dist/core-first/authoring/native-closure.log
          python3 ../scripts/core-first-ci-evidence.py native-closure ../dist/core-first/authoring/native-closure.json
      - name: Preserve exact Full identities and independent checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          .lake/build/bin/pscv0_native --audit-primitives > ../dist/core-first/authoring/full-primitive-audit.json
          .lake/build/bin/pscv0_native --audit-standard-closure > ../dist/core-first/authoring/full-closure.json
          .lake/build/bin/pscv0_native --audit-standard-surface > ../dist/core-first/authoring/full-surface.json
          .lake/build/bin/pscv0_native_checks 2>&1 | tee ../dist/core-first/authoring/full-native-checks.log
      - name: Compare the actual Bootstrap asset literally with Full
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake env .lake/build/bin/pscv0_bootstrap_compatibility ../dist/core-first/authoring/bootstrap-full-compatibility.json 2>&1 | tee ../dist/core-first/authoring/bootstrap-full-compatibility.log
          python3 ../scripts/core-first-ci-evidence.py bootstrap-compatibility ../dist/core-first/authoring/bootstrap-full-compatibility.json
      - name: Author and check the standalone bootstrap candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/bootstrap-resource.txt .lake/build/bin/pscv0_core_environment_export bootstrap ../dist/core-first/authoring/CoreBootstrapCandidate.lean 2>&1 | tee ../dist/core-first/authoring/bootstrap-export.log | sed '/^PSCV0_STANDARD_SOURCE /d'
          cmp ../dist/core-first/authoring/CoreBootstrapCandidate.lean ../packages/environment/src/Ps/Environment/BootstrapData.lean
          sha256sum ../dist/core-first/authoring/CoreBootstrapCandidate.lean > ../dist/core-first/authoring/bootstrap.sha256
          python3 ../scripts/core-first-ci-evidence.py bootstrap-source ../dist/core-first/authoring/CoreBootstrapCandidate.lean
      - name: Author and check the standalone compiler byte-word candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ../dist/core-first/authoring/byte-word-resource.txt .lake/build/bin/pscv0_core_environment_export byte-word ../dist/core-first/authoring/CoreByteWordCandidate.lean 2>&1 | tee ../dist/core-first/authoring/byte-word-export.log | sed '/^PSCV0_STANDARD_SOURCE /d'
          sha256sum ../dist/core-first/authoring/CoreByteWordCandidate.lean > ../dist/core-first/authoring/byte-word.sha256
      - name: Summarize actual authoring build and source measurements
        if: always()
        run: |
          python3 ../scripts/core-first-ci-evidence.py resources ../dist/core-first/authoring
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && !cancelled() && steps.build.outcome != 'skipped'
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-core-first-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: psc0-core-first-authoring-${{ github.sha }}
          path: psc0/dist/core-first/authoring/
          if-no-files-found: error
          retention-days: 30
