name: PSC0 retained evidence inspection

on:
  push:
    branches: ['psc0/strict-sh1-v1']
    paths: ['.github/workflows/psc0-evidence-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Authenticate the retained archive and inspect exact compiler text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdtemp, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          
          assert.equal(process.version, 'v22.23.3');
          const expected = {
            artifactId: 11639377985, runId: 37971952859,
            name: 'psc0-sh1-ts7.0.2-05f37fc04e52bfaed70389291a0fcdeda819f71f',
            sourceRef: '05f37fc04e52bfaed70389291a0fcdeda819f71f',
            archiveSha256: '2efaf91d57973103e53288140b2adeca3f13c53267138b228c25079d82dc287e',
            archiveBytes: 3182763,
            compilerSha256: 'ccdfb5f1c226dce25776b817a391a09c783a71e695ea30ca3702df198bd1d23b',
          };
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const base = 'https://api.github.com/repos/dwijayuda/pskernel/actions/artifacts/' + expected.artifactId;
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const metadataResponse = await fetch(base, { headers });
          assert.equal(metadataResponse.status, 200, 'artifact metadata response');
          const metadata = await metadataResponse.json();
          assert.equal(metadata.id, expected.artifactId);
          assert.equal(metadata.name, expected.name);
          assert.equal(metadata.expired, false);
          assert.equal(metadata.size_in_bytes, expected.archiveBytes);
          assert.equal(metadata.digest, 'sha256:' + expected.archiveSha256);
          assert.equal(metadata.workflow_run.id, expected.runId);
          assert.equal(metadata.workflow_run.head_sha, expected.sourceRef);
          const archiveResponse = await fetch(base + '/zip', { headers });
          assert.equal(archiveResponse.status, 200, 'artifact archive response');
          const archive = Buffer.from(await archiveResponse.arrayBuffer());
          assert.equal(archive.length, expected.archiveBytes);
          assert.equal(hash(archive), expected.archiveSha256);
          const inspectionDirectory = await mkdtemp(path.join(process.env.RUNNER_TEMP, 'psc0-artifact-inspection-'));
          const archivePath = path.join(inspectionDirectory, 'verified.zip');
          await writeFile(archivePath, archive);
          const files = execFileSync('unzip', ['-Z', '-1', archivePath],
            { encoding: 'utf8', maxBuffer: 2 * 1024 * 1024 }).trim().split(/\r?\n/u);
          const fileCount = files.filter((name) => !name.endsWith('/')).length;
          assert.equal(fileCount, 241);
          assert(files.every((name) => !name.startsWith('/') && !name.split('/').includes('..')));
          const indexes = files.filter((name) => /^(?:dist\/sh1\/)?C1\/index\.js$/u.test(name));
          assert.equal(indexes.length, 1, 'one exact C1 JavaScript product');
          const compilerPath = indexes[0];
          const prefix = compilerPath.slice(0, -'C1/index.js'.length);
          function bytes(name) {
            assert(files.includes(name));
            return execFileSync('unzip', ['-p', archivePath, name], { maxBuffer: 64 * 1024 * 1024 });
          }
          const compilerBytes = bytes(compilerPath);
          assert.equal(hash(compilerBytes), expected.compilerSha256);
          const receiptPath = prefix + 'C1/receipt.json';
          const receiptBytes = bytes(receiptPath);
          const receipt = JSON.parse(receiptBytes.toString('utf8'));
          assert.equal(receipt.sourceRef, expected.sourceRef);
          assert.equal(receipt.artifacts.javascriptSha256, expected.compilerSha256);
          const javascript = compilerBytes.toString('utf8');
          assert.equal(Buffer.byteLength(javascript), compilerBytes.length);
          const names = [
            'psSh1PrepareSourcesWorker', 'psCompilerSh1PrepareSources',
            'psCompilerSh1TypeScriptSources', 'psEncodeCheckedAdmissionsCanonical',
            'psCompilerPrepareElaborated', 'psCompilerValidatePrepared',
            'psCompilerEnvironmentFromPrepared', 'psCompilerVerifiedIrFromPrepared',
          ];
          function excerpt(name) {
            const candidates = ['export function ' + name + '(', 'export const ' + name + ' ',
              'function ' + name + '(', 'const ' + name + ' '];
            const starts = candidates.map((pattern) => javascript.indexOf(pattern)).filter((index) => index >= 0);
            assert(starts.length > 0, 'emitted declaration present: ' + name);
            const start = Math.min(...starts);
            const next = /\n(?:export )?(?:function|const) [A-Za-z_$]/gu;
            next.lastIndex = start + 1;
            const match = next.exec(javascript);
            const end = match ? match.index : javascript.length;
            const complete = javascript.slice(start, end);
            return { name, start, end, completeSha256: hash(complete),
              completeCharacters: complete.length, truncated: complete.length > 60000,
              text: complete.slice(0, 60000) };
          }
          const c2Files = files.filter((name) => name.startsWith(prefix + 'C2/'));
          const c2Products = c2Files.filter((name) => /\/(?:index\.(?:ts|js)|receipt\.json|strict-source\.json|original-ir-inventory\.json)$/u.test(name))
            .map((name) => { const value = bytes(name); return { path: name, bytes: value.length, sha256: hash(value) }; });
          const report = {
            schemaVersion: 1, kind: 'psc0-retained-artifact-inspection',
            expected, archiveDigestVerified: true, archiveEntryCount: files.length, archiveFileCount: fileCount,
            compiler: { path: compilerPath, bytes: compilerBytes.length, sha256: hash(compilerBytes) },
            receipt: { path: receiptPath, bytes: receiptBytes.length, sha256: hash(receiptBytes) },
            c2Files, c2Products, excerpts: names.map(excerpt),
            inspectionRuntime: process.version, compilerExecuted: false, testsExecuted: false,
            refsChanged: false, strictSh1Qualified: false, semanticContractQualified: false,
          };
          process.stdout.write('PSC0_RETAINED_ARTIFACT_INSPECTION: ' + JSON.stringify(report) + '\n');
          
          NODE
