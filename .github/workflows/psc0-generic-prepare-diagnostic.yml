name: PSC0 generic preparation origin diagnostic

on:
  push:
    branches: ['psc0/strict-sh1-v1']
    paths: ['.github/workflows/psc0-generic-prepare-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3fac0872f1a5e2a0fe79aede843179d4ce43a2c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Locate the exact first generic preparation error using retained N1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --max-old-space-size=8192 --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdtemp, readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          
          assert.equal(process.version, 'v22.23.3');
          const expected = {
            sourceRef: 'b3fac0872f1a5e2a0fe79aede843179d4ce43a2c',
            runId: 38008721677, artifactId: 11652692106,
            artifactName: 'psc0-sh1-ts7.0.2-b3fac0872f1a5e2a0fe79aede843179d4ce43a2c',
            archiveBytes: 1841093,
            archiveSha256: 'a90181c130536359774816775acc74ebcae1a2c773e735fd3d55bd7ada273b8f',
            compilerSha256: '111fbc3c5cb565cc9d723a5fbf72de3fa4d285825c2d6274a099ce29aaf2b9f1',
            fixturePath: 'psc0/test/fixtures/selfhost-sh1-generic-erasure.lean',
            fixtureBlob: 'dd8b43775493d0d69e9cf62c2fd8670a580ff3ac',
            fixtureSha256: 'fbd5ad124960260862e8fe5bf5b83b9b4e509486ca126c7853fab911852945a5',
            fixtureBytes: 6340,
          };
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const base = 'https://api.github.com/repos/dwijayuda/pskernel/actions/artifacts/' + expected.artifactId;
          const response = await fetch(base, { headers });
          assert.equal(response.status, 200);
          const metadata = await response.json();
          assert.equal(metadata.id, expected.artifactId);
          assert.equal(metadata.name, expected.artifactName);
          assert.equal(metadata.expired, false);
          assert.equal(metadata.size_in_bytes, expected.archiveBytes);
          assert.equal(metadata.digest, 'sha256:' + expected.archiveSha256);
          assert.equal(metadata.workflow_run.id, expected.runId);
          assert.equal(metadata.workflow_run.head_sha, expected.sourceRef);
          const archiveResponse = await fetch(base + '/zip', { headers });
          assert.equal(archiveResponse.status, 200);
          const archive = Buffer.from(await archiveResponse.arrayBuffer());
          assert.equal(archive.length, expected.archiveBytes);
          assert.equal(hash(archive), expected.archiveSha256);
          const directory = await mkdtemp(path.join(process.env.RUNNER_TEMP, 'psc0-generic-origin-'));
          const archivePath = path.join(directory, 'verified.zip');
          await writeFile(archivePath, archive);
          const files = execFileSync('unzip', ['-Z', '-1', archivePath],
            { encoding: 'utf8', maxBuffer: 2 * 1024 * 1024 }).trim().split(/\r?\n/u);
          assert(files.every((name) => !name.startsWith('/') && !name.split('/').includes('..')));
          const indexes = files.filter((name) => /^(?:dist\/sh1\/)?development\/N1\/index\.js$/u.test(name));
          assert.equal(indexes.length, 1, 'one retained N1 JavaScript product');
          const compilerBytes = execFileSync('unzip', ['-p', archivePath, indexes[0]],
            { maxBuffer: 64 * 1024 * 1024 });
          assert.equal(hash(compilerBytes), expected.compilerSha256);
          const fixtureBytes = await readFile(path.join(process.env.GITHUB_WORKSPACE, expected.fixturePath));
          assert.equal(fixtureBytes.length, expected.fixtureBytes);
          assert.equal(hash(fixtureBytes), expected.fixtureSha256);
          const source = fixtureBytes.toString('utf8');
          assert.equal(Buffer.byteLength(source), fixtureBytes.length);
          const modulePath = path.join(directory, 'compiler.mjs');
          await writeFile(modulePath, compilerBytes);
          delete process.env.GH_TOKEN;
          const compiler = await import(pathToFileURL(modulePath).href);
          function tag(value) {
            if (value === null || typeof value !== 'object') return undefined;
            for (const symbol of Object.getOwnPropertySymbols(value)) {
              if (typeof value[symbol] === 'string') return value[symbol];
            }
            return undefined;
          }
          function items(value, maximum = 64) {
            const result = [], seen = new Set();
            while (tag(value) === 'cons') {
              assert(!seen.has(value) && result.length < maximum, 'bounded owned list');
              seen.add(value); result.push(value.head); value = value.tail;
            }
            assert.equal(tag(value), 'nil');
            return result;
          }
          let observedNodes = 0;
          function describe(value, depth = 0) {
            assert(depth <= 64 && ++observedNodes <= 4096, 'bounded diagnostic serialization');
            if (typeof value === 'bigint') return value.toString();
            if (Array.isArray(value)) return value.map((item) => describe(item, depth + 1));
            if (value !== null && typeof value === 'object') {
              const result = {}, valueTag = tag(value);
              if (valueTag !== undefined) result.tag = valueTag;
              for (const [key, child] of Object.entries(value)) result[key] = describe(child, depth + 1);
              return result;
            }
            return value;
          }
          const sourceKind = compiler.PsCompilerSourceKind.lean;
          const parsed = compiler.psCompilerParseSource(sourceKind, source);
          assert.equal(tag(parsed), 'ok', 'unchanged fixture parses');
          assert.equal(items(parsed.value.declarations).length, 34);
          const initial = compiler.psCompilerPreparationStart(sourceKind);
          const result = compiler.psCompilerPreparationStepParsedWithOrigins(initial, parsed.value);
          assert.equal(tag(result), 'error', 'recorded fixture preparation failure reproduced');
          const failure = result.error;
          assert.equal(tag(failure.error), 'infer');
          assert.equal(tag(failure.error.error), 'applicationTypeMismatch');
          const origin = describe(failure);
          const sourceIndex = Number(origin.sourceIndex);
          assert(Number.isSafeInteger(sourceIndex) && sourceIndex >= 0 && sourceIndex < 34);
          const sourceName = items(failure.sourceName.segments).join('.');
          const start = Number(origin.span.start.byteOffset), stop = Number(origin.span.stop.byteOffset);
          assert(Number.isSafeInteger(start) && Number.isSafeInteger(stop));
          assert(start >= 0 && stop >= start && stop <= fixtureBytes.length);
          const declarationBytes = fixtureBytes.subarray(start, stop);
          const report = {
            schemaVersion: 1, kind: 'psc0-retained-N1-generic-preparation-origin-diagnostic',
            diagnosticSourceRef: process.env.GITHUB_SHA, expected,
            archiveDigestVerified: true, compilerDigestVerified: true, fixtureDigestVerified: true,
            compilerArchivePath: indexes[0], compilerBytes: compilerBytes.length,
            parseCalls: 1, originPreservingPreparationCalls: 1,
            nativeBuilds: 0, typeScriptCompilations: 0, erasureCalls: 0, compilerEmissions: 0,
            fixtureChanged: false, compilerChanged: false, sourceIndex, sourceName,
            phase: tag(failure.phase), origin,
            declaration: { startByte: start, stopByte: stop, sha256: hash(declarationBytes),
              bytes: declarationBytes.length, text: declarationBytes.toString('utf8') },
            errorProjection: { tag: 'elaboration',
              error: { tag: 'infer', error: { tag: 'applicationTypeMismatch' } } },
            qualification: { N1Complete: false, strictSh1Qualified: false,
              semanticContractQualified: false, providerChecked: false },
          };
          const reportBytes = JSON.stringify(report, null, 2) + '\n';
          await writeFile(path.join(process.env.GITHUB_WORKSPACE, 'generic-preparation-origin.json'), reportBytes);
          process.stdout.write('PSC0_GENERIC_PREPARATION_ORIGIN: ' + JSON.stringify(report) + '\n');
          process.stdout.write('PSC0_GENERIC_PREPARATION_ORIGIN_SHA256: ' + hash(reportBytes) + '\n');
          NODE
      - name: Retain the bounded origin diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-generic-preparation-origin-${{ github.sha }}
          path: generic-preparation-origin.json
          if-no-files-found: ignore
          retention-days: 30
