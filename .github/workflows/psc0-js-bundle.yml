name: PSC0 self-host compiler and PSKernel Core JavaScript bundle

on:
  push:
    branches:
      - psc0/selfhost-compiler-kernel-js-bundle-v1
    paths:
      - .github/workflows/psc0-js-bundle.yml
      - psc0/release-js/**
      - psc0/scripts/workspace-layout.mjs
      - psc0/host/src/Ps/Host/ProjectCompiler.lean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc0-js-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test JS compiler and Core
    runs-on: ubuntu-latest
    timeout-minutes: 125
    defaults:
      run:
        working-directory: psc0
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install the exact TypeScript 7.0.2 toolchain, independent of unpublished workspaces
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-ts7" --ignore-scripts --save-exact --no-audit --no-fund typescript@7.0.2
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const directory = path.join(process.env.RUNNER_TEMP, 'psc0-ts7/node_modules/typescript');
          const manifest = JSON.parse(readFileSync(path.join(directory, 'package.json'), 'utf8'));
          if (manifest.name !== 'typescript' || manifest.version !== '7.0.2') throw Error('Not pinned TypeScript 7.0.2');
          const bin = typeof manifest.bin === 'string' ? manifest.bin : manifest.bin.tsc;
          const cli = realpathSync(path.join(directory, bin));
          const result = spawnSync(process.execPath, [cli, '--version'], { encoding: 'utf8' });
          if (result.status !== 0 || result.stdout.trim() !== 'Version 7.0.2') throw Error('TypeScript 7.0.2 CLI mismatch');
          appendFileSync(process.env.GITHUB_ENV, 'PSC0_TSC=' + cli + '\n');
          console.log('Pinned TypeScript 7.0.2 CLI: ' + cli);
          NODE
      - name: Build the existing Lean-native PSC0 compiler frontend
        run: lake build psc1
      - name: Check both exact source roots through the PSC0 frontend
        run: |
          lake exe psc1 check packages/bootstrap/src/Ps/Bootstrap/SelfHost.lean
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Compile the original self-host compiler and new 79-module PSKernel Core to JS
        run: |
          mkdir -p dist/js-bundle/psc0-js-release/compiler
          mkdir -p dist/js-bundle/psc0-js-release/pskernel-core
          lake exe psc1 build packages/bootstrap/src/Ps/Bootstrap/SelfHost.lean --out dist/js-bundle/psc0-js-release/compiler/index.js
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean --out dist/js-bundle/psc0-js-release/pskernel-core/index.js
      - name: Smoke-test executable JS exports, kernel basics, and record exact hashes
        run: node release-js/validate-and-package.mjs
      - name: Upload bundle as a GitHub Actions ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: psc0-selfhost-compiler-pskernel-core-js
          path: psc0/dist/js-bundle/psc0-js-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
