name: PSC0 Lean 4.35 Wasm shared admission contracts
on:
  push:
    branches:
      - feature/psc0-v72-lean435-wasm-admission-integration-v1
    paths:
      - '.github/workflows/psc0-lean435-wasm-admission-contracts.yml'
      - 'psc0/packages/pskernel-lean-wasm/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            psc0/packages/pskernel-lean-wasm
            psc0/packages/pskernel-lean/provider
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Parse every source and eagerly construct every canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          for f in psc0/packages/pskernel-lean-wasm/index.mjs psc0/packages/pskernel-lean-wasm/scripts/*.mjs; do
            node --check "$f"
          done
          bash -n psc0/packages/pskernel-lean-wasm/scripts/build-wasm.sh
          node --test psc0/packages/pskernel-lean-wasm/scripts/test-fresh-kernel-task.mjs
          node --test \
            psc0/packages/pskernel-lean-wasm/scripts/test-corpus.mjs \
            psc0/packages/pskernel-lean-wasm/scripts/test-provider-transport.mjs \
            psc0/packages/pskernel-lean-wasm/scripts/test-host.mjs
  pinned-runtime-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: psc0/packages/pskernel-lean-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Qualify exact pinned Lean 4.35 source patches including wasm32 task semantics
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/lean4-4.35"
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/leanprover/lean4.git
          git -C "$upstream" fetch --depth 1 origin eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          node psc0/packages/pskernel-lean-wasm/scripts/apply-lean435-compat.mjs "$upstream"
          node psc0/packages/pskernel-lean-wasm/scripts/verify-lean435-runtime.mjs "$upstream"
          # Compatibility rewrites are always exact and idempotent.
          node psc0/packages/pskernel-lean-wasm/scripts/apply-lean435-compat.mjs "$upstream"
          git -C "$upstream" diff --check
