name: PSC0 Lean 4.35 wasm32 C++ kernel-only smoke
on:
  push:
    branches:
      - feature/psc0-v72-lean435-wasm-cpp-smoke-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: psc0/packages/pskernel-lean-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Qualify focused C++ kernel build script
        run: bash -n psc0/packages/pskernel-lean-wasm/scripts/smoke-lean435-cpp-wasm.sh
      - name: Configure Emscripten 6.0.9 and build actual C++ kernel archives
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.9
          ./emsdk activate 6.0.9
          source ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          bash psc0/packages/pskernel-lean-wasm/scripts/smoke-lean435-cpp-wasm.sh
