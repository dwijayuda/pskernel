name: PSC0 Lean 4.35 stage1 cache integrity contract
on:
  push:
    branches:
      - feature/psc0-v72-lean435-stage1-cache-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: psc0/packages/pskernel-lean-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Check stage1 integrity contract and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check psc0/packages/pskernel-lean-wasm/scripts/stage1-cache.mjs
          bash -n psc0/packages/pskernel-lean-wasm/scripts/build-wasm.sh
          node --test psc0/packages/pskernel-lean-wasm/scripts/test-stage1-cache.mjs
          node --test psc0/packages/pskernel-lean-wasm/scripts/test-corpus.mjs
