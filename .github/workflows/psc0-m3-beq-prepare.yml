name: PSCV0 M3 BEq exact fixture preparation
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: [.github/workflows/psc0-m3-beq-prepare.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Prepare two reviewed fixture replacements without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, difflib, hashlib, io, json, os, re, urllib.request, urllib.error, urllib.parse, zipfile
          repo = os.environ['REPOSITORY']
          assert repo == 'dwijayuda/pskernel'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=payload, headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          def blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          old_sha = '913c02e94f1688da595c6bad617eb8a7f8f9c83b'
          item = api('/git/blobs/' + old_sha)
          raw = base64.b64decode(item['content'])
          assert blob_sha(raw) == old_sha
          text = raw.decode('utf-8')
          updated = text
          replacements = [
            ('inductive RecursiveCell where { | nil | cons(next: RecursiveCell) } deriving BEq',
             'inductive RecursiveCell where { | nil | cons(next: List RecursiveCell) } deriving BEq'),
            ('inductive Chain(A: Type u): Type u where { | nil | cons(head: A, tail: Chain A) } deriving BEq',
             'inductive Chain(A: Type u): Type u where { | nil | cons(head: A, tail: List(Chain A)) } deriving BEq')]
          for old, new in replacements:
              assert updated.count(old) == 1
              updated = updated.replace(old, new)
          print(''.join(difflib.unified_diff(text.splitlines(True), updated.splitlines(True), fromfile='Pscv0NativeTests.lean', tofile='Pscv0NativeTests.lean')))
          prepared_sha = blob_sha(updated.encode())
          result = api('/git/blobs', {'content': updated, 'encoding': 'utf-8'})
          assert result['sha'] == prepared_sha
          print('PREPARED_NATIVE_BLOB', prepared_sha, flush=True)
          print('No branch, commit, tracked file, PR or workflow run was modified by this job.', flush=True)
          run = api('/actions/runs/38902937385')
          assert run['head_sha'] == '34426e22d9038fc8383722f047e39d93997e898c'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          artifacts = api('/actions/runs/38902937385/artifacts')['artifacts']
          artifact, = [a for a in artifacts if a['name'] == 'pscv0-m3-recursive-hash-' + run['head_sha']]
          print('FOCUSED_ARTIFACT', artifact['id'], artifact.get('digest'), artifact['size_in_bytes'], flush=True)
          # GitHub returns a signed storage URL. Never forward API credentials
          # to that host; it authenticates the one download with its URL alone.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          req = urllib.request.Request(base + '/actions/artifacts/' + str(artifact['id']) + '/zip', headers=headers)
          try:
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=60) as r:
                  archive = r.read()
          except urllib.error.HTTPError as e:
              assert e.code in (301, 302, 303, 307, 308)
              location = e.headers['Location']
              url = urllib.parse.urlsplit(location)
              assert url.scheme == 'https' and (url.hostname.endswith('.blob.core.windows.net') or url.hostname.endswith('.actions.githubusercontent.com'))
              with urllib.request.urlopen(location, timeout=60) as r:
                  archive = r.read()
          print('DOWNLOADED_SHA256', hashlib.sha256(archive).hexdigest())
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              for filename in z.namelist():
                  if filename.endswith(('expected.json', 'check.log')):
                      print('EVIDENCE', filename, z.read(filename).decode()[-14000:])
                  if filename.endswith('hashing.js'):
                      lines = z.read(filename).decode().splitlines()
                      for i, line in enumerate(lines):
                          if re.match(r'(?:export )?function\*?\s+.*M3HashTree.*instBEq', line):
                              end = next((j for j in range(i + 1, len(lines)) if re.match(r'(?:export )?function\*?\s+', lines[j])), min(i + 60, len(lines)))
                              print('BEQ_GENERATED', filename, i + 1, '\n'.join(lines[i:min(end, i + 60)])[:18000])
          PY
