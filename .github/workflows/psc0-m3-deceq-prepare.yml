name: PSCV0 M3 DecidableEq exact fixture preparation
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: [.github/workflows/psc0-m3-deceq-prepare.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare reviewed nested-family negative without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os, urllib.request
          repo = os.environ['REPOSITORY']
          assert repo == 'dwijayuda/pskernel'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=payload, headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          def git_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          original = '44338bb06e8f633d8b27c6413cbd3c9b5c684979'
          raw = base64.b64decode(api('/git/blobs/' + original)['content'])
          assert git_sha(raw) == original
          text = raw.decode('utf-8')
          for index, line in enumerate(text.splitlines(), 1):
              if 'DecidableEq' in line and ('deriving' in line or 'recursion' in line):
                  print('DECEQ_SOURCE', index, line)
          old = 'inductive Bad where { | nil | cons(next: Bad) } deriving DecidableEq'
          new = 'inductive Bad where { | nil | cons(next: List Bad) } deriving DecidableEq'
          assert text.count(old) == 1
          updated = text.replace(old, new)
          print(''.join(difflib.unified_diff(text.splitlines(True), updated.splitlines(True), fromfile='Pscv0NativeTests.lean', tofile='Pscv0NativeTests.lean')))
          expected = git_sha(updated.encode())
          response = api('/git/blobs', {'content': updated, 'encoding': 'utf-8'})
          assert response['sha'] == expected
          print('PREPARED_NATIVE_BLOB', expected)
          print('Prepared only: no branch, commit, tracked file, PR or qualification result changed.')
          PY
