name: PSCV0 M3 DecidableEq exact fixture preparation
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: [.github/workflows/psc0-m3-deceq-prepare.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Prepare valid proof-field oracle and document the retained positivity boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os, urllib.request
          repo = os.environ['REPOSITORY']
          assert repo == 'dwijayuda/pskernel'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=payload, headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          def git_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def prepare(path, sha, replacements):
              raw = base64.b64decode(api('/git/blobs/' + sha)['content'])
              assert git_sha(raw) == sha
              original = raw.decode('utf-8')
              text = original
              for before, after in replacements:
                  assert text.count(before) == 1, (path, before, text.count(before))
                  text = text.replace(before, after)
              print(''.join(difflib.unified_diff(original.splitlines(True), text.splitlines(True), fromfile=path, tofile=path)))
              expected = git_sha(text.encode())
              result = api('/git/blobs', {'content': text, 'encoding': 'utf-8'})
              assert result['sha'] == expected
              print('PREPARED_BLOB', path, expected, flush=True)
          prepare('Pscv0M3RecursiveDeriving.lean', 'bcdd812511353892c43a3946230db446a5d7d3f6', [
            ('-- The certificate depends on a recursive child but has no runtime payload.',
             '-- The certificate depends on the scalar field but has no runtime payload.'),
            ('(certificate : next = next)', '(certificate : value = value)'),
            ('certificate: next = next', 'certificate: value = value')])
          prepare('DerivingDecEq.lean', 'be40b861f75e211f903fde9cf85fa765e5869d04', [
            ('-- There is no BEq-to-equality axiom, proof hole or trusted noConfusion shortcut.',
             '-- There is no BEq-to-equality axiom, proof hole or trusted noConfusion shortcut.\n-- Proof fields may depend on earlier data fields; inductive formation still\n-- owns positivity and nested-parameter validity, before deriving is attempted.')])
          print('No branch, commit, tracked file, PR or qualification result was modified.')
          PY
