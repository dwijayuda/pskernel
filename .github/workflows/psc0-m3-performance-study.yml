name: PSC0 M3 controlled runtime study
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: ['.github/workflows/psc0-m3-performance-study.yml']
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed native run to compare on the same runner
        required: false
        default: '38838737641'
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Extract exact qualified runtime artifacts without forwarding credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run || '38838737641' }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, urllib.request, urllib.error, zipfile, pathlib
          root = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl): return None
          def download(path):
              try:
                  response = urllib.request.build_opener(NoRedirect).open(urllib.request.Request(root + path, headers=headers), timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302: raise
                  location = error.headers['Location']
                  if not location.startswith('https://'): raise ValueError('expected HTTPS')
                  response = urllib.request.urlopen(location, timeout=30)
              with response: return response.read(32 * 1024 * 1024)
          runs = [('baseline', '38832366451')]
          candidate = os.environ['CANDIDATE_RUN']
          if candidate:
              if not candidate.isdecimal(): raise ValueError('numeric run required')
              runs.append(('candidate', candidate))
          receipts = []
          for label, run in runs:
              receipt = get('/actions/runs/' + run)
              if receipt['status'] != 'completed' or receipt['conclusion'] != 'success': raise ValueError('completed successful native run required')
              if label == 'baseline' and receipt['head_sha'] != '2a7072064974cb0d051a1773a26caf15fc59838b': raise ValueError('wrong baseline')
              items = get('/actions/runs/' + run + '/artifacts?per_page=100')['artifacts']
              artifacts = [a for a in items if a['name'] == 'pscv0-v7-native-' + receipt['head_sha'] and not a['expired']]
              if len(artifacts) != 1: raise ValueError('missing or ambiguous native artifact')
              artifact = artifacts[0]
              directory = pathlib.Path('.study') / label
              directory.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(download('/actions/artifacts/' + str(artifact['id']) + '/zip'))) as archive:
                  for suffix, target in [('m1-performance/runtime.js', 'runtime.mjs'), ('m1-performance/comparison.json', 'historical.json')]:
                      names = [n for n in archive.namelist() if n == suffix or n.endswith('/' + suffix)]
                      if len(names) != 1 or archive.getinfo(names[0]).file_size > 2*1024*1024: raise ValueError('ambiguous or oversized file')
                      (directory / target).write_bytes(archive.read(names[0]))
              source = (directory / 'runtime.mjs').read_text()
              print('CODE', label, 'bytes', len(source), 'generators', source.count('function*'), 'schedulerCalls', source.count('__ps$invoke'))
              for part in re.split(r'(?=export function |function\* __ps\$impl\$)', source):
                  if re.search(r'(m1ListAt|m1ArrayAt|m1FromList|m1ToList|m3Keep|List.*getElem|Array.*getElem|Option.*getD)', part[:250]):
                      print('HOT_FUNCTION', label, part[:2000])
              historical = json.loads((directory / 'historical.json').read_text())
              if historical['sourceSha'] != receipt['head_sha']: raise ValueError('benchmark source SHA mismatch')
              print('HISTORICAL_NOT_PAIRED', label, json.dumps({'preludeMs': historical['preludeMs'], 'compiler': historical['compiler'], 'runtime': [{k:r[k] for k in ['name','size','medianNs','nativeLeanMedianNs','ratioToNativeLean']} for r in historical['runtime']]}))
              if label == 'candidate':
                  gates = get('/actions/runs?head_sha=' + receipt['head_sha'] + '&per_page=20')['workflow_runs']
                  for gate in gates:
                      print('EXACT_CI', gate['id'], gate['name'], gate['head_sha'], gate['status'], gate['conclusion'])
                  jobs = get('/actions/runs/' + run + '/jobs')['jobs']
                  for job in jobs:
                      print('NATIVE_STEPS', job['id'], len(job['steps']), [(s['name'],s['conclusion']) for s in job['steps'] if s['conclusion'] != 'success'])
                      log = download('/actions/jobs/' + str(job['id']) + '/logs').decode('utf-8-sig')
                      for line in log.splitlines():
                          if any(marker in line for marker in ['PSCV0_M3_ECMA:', 'PSCV0_M3_GENERIC_RECURSION:', '1069 shared', '1069 observations', 'PSCV0_M1_PERFORMANCE:']):
                              print('QUALIFICATION_LOG', line[:3000])
              receipts.append({'label': label, 'run': run, 'head': receipt['head_sha'], 'artifact': artifact['id'], 'digest': artifact.get('digest')})
          pathlib.Path('.study/receipts.json').write_text(json.dumps(receipts))
          print('RECEIPTS', json.dumps(receipts))
          PY
      - name: Measure dynamic checksummed calls and profiler samples on one runner
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile, writeFile} from 'node:fs/promises';
          import {pathToFileURL} from 'node:url';
          import path from 'node:path';
          import {Session} from 'node:inspector';
          const receipts = JSON.parse(await readFile('.study/receipts.json', 'utf8'));
          const modules = await Promise.all(receipts.map(r => import(pathToFileURL(path.resolve('.study', r.label, 'runtime.mjs')).href)));
          const median = ns => [...ns].sort((a,b) => a-b)[Math.floor(ns.length/2)];
          const profiler = new Session(); profiler.connect();
          const post = (method, params = {}) => new Promise((resolve, reject) => profiler.post(method, params, (e,r) => e ? reject(e) : resolve(r)));
          const rows = [];
          for (const size of [256,8192]) {
            const n = BigInt(size);
            const inputs = modules.map(m => ({xs:m.m1MakeList(n), a:m.m1MakeArray(n)}));
            for (const name of ['listHead','listTail','arrayHead','arrayTail','fromList','toList']) {
              const operations = modules.map((m,k) => {
                const {xs,a} = inputs[k];
                if (name === 'listHead') return i => m.m1ListAt(xs, i % 2n);
                if (name === 'listTail') return i => m.m1ListAt(xs, n-1n+i%2n);
                if (name === 'arrayHead') return i => m.m1ArrayAt(a,i%2n);
                if (name === 'arrayTail') return i => m.m1ArrayAt(a,n-1n+i%2n);
                if (name === 'fromList') return i => m.m1FromList(xs)+i%2n;
                return i => m.m1ToList(a)+i%2n;
              });
              const expectedPair = name.endsWith('Head') ? 3n : name.endsWith('Tail') ? n : 2n*n+1n;
              const batch = (operation, count) => {
                let sum = 0n; const start = process.hrtime.bigint();
                for (let i=0;i<count;i++) sum += operation(BigInt(i));
                const elapsed = Number(process.hrtime.bigint()-start);
                assert.equal(sum, BigInt(count/2)*expectedPair);
                return elapsed;
              };
              let count = 16;
              while (count < 65536 && batch(operations[0],count) < 10000000) count *= 2;
              const cold = operations.map(op => batch(op,count));
              for (let warm=0;warm<8;warm++) for (const op of operations) batch(op,count);
              const samples = operations.map(() => []);
              for (let trial=0;trial<7;trial++) {
                const order = trial%2 ? [...operations.keys()].reverse() : [...operations.keys()];
                for (const k of order) samples[k].push(batch(operations[k],count));
              }
              for (const [k,op] of operations.entries()) {
                await post('Profiler.enable'); await post('Profiler.start'); batch(op,count);
                const {profile} = await post('Profiler.stop');
                await writeFile(`.study/${receipts[k].label}-${name}-${size}.cpuprofile`,JSON.stringify(profile));
                const hits = profile.nodes.filter(n => n.hitCount).sort((a,b) => b.hitCount-a.hitCount).slice(0,6).map(n => ({function:n.callFrame.functionName,line:n.callFrame.lineNumber,hits:n.hitCount}));
                const row = {label:receipts[k].label,name,size,iterations:count,firstMeasuredNs:cold[k],samplesNs:samples[k],medianNs:median(samples[k]),nsPerCall:median(samples[k])/count,profileTop:hits};
                rows.push(row); console.log('STUDY',JSON.stringify(row));
              }
            }
          }
          profiler.disconnect();
          const comparisons = rows.filter(r => r.label === 'candidate').map(candidate => {
            const baseline = rows.find(r => r.label === 'baseline' && r.name === candidate.name && r.size === candidate.size);
            assert.equal(baseline.iterations,candidate.iterations);
            const row = {name:candidate.name,size:candidate.size,iterations:candidate.iterations,baselineNsPerCall:baseline.nsPerCall,candidateNsPerCall:candidate.nsPerCall,speedup:baseline.medianNs/candidate.medianNs};
            console.log('PAIRED',JSON.stringify(row)); return row;
          });
          await writeFile('.study/results.json',JSON.stringify({schema:'pscv0-m3-runtime-study/1',node:process.version,receipts,method:'Dynamic checked inputs; adaptive shared batch; eight warmup batches; seven alternated samples; profiler measured separately. Does not assert steady state or compare different machines.',rows,comparisons},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pscv0-m3-runtime-study-${{ github.sha }}
          path: .study/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
