name: PSCV0 M3 qualification source inspection
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: [.github/workflows/psc0-m3-qualification-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7998bdc7b654dccf46ddfc0b09d16cf8143b33d0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: m3-source-inspection-${{ github.sha }}
          restore-keys: |
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Expose the unchanged application request diagnostic
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7998bdc7b654dccf46ddfc0b09d16cf8143b33d0
          test ! -d ../packages/pskernel-core
          mkdir -p "$RUNNER_TEMP/m3-source-inspection"
          python3 - <<'PY'
          import pathlib, re, subprocess
          p = pathlib.Path('../test/Pscv0NativeTests.lean')
          assert subprocess.check_output(['git','hash-object',str(p)], text=True).strip() == '1496891ff3e665ff5e06fb367b4175c845552b35'
          source = p.read_text()
          source, count = re.subn(r'(?m)^def main\b', 'def diagnosticOriginalMain', source)
          assert count == 1, count
          # Runner-only alternate entry point. All fixture definitions and
          # compiler/proof sources stay byte-identical; no branch is modified.
          source += '''\n\ndef main : IO Unit := do
            IO.FS.createDirAll "../dist/m3-source-inspection"
            IO.FS.writeFile "../dist/m3-source-inspection/application.ps" application
            match ← PsV7Native.runBatch #[{ source := application }] with
            | .error error => IO.println ("APPLICATION_BOOT_ERROR: " ++ error.phase ++ ": " ++ error.message)
            | .ok batch =>
              for result in batch.results do
                match result with
                | .error error => IO.println ("APPLICATION_ERROR: " ++ error.phase ++ ": " ++ error.message)
                | .ok result => IO.println ("APPLICATION_ACCEPTED: " ++ toString result.declarationCount)
          '''
          p.write_text(source)
          PY
          git diff -- ../test/Pscv0NativeTests.lean | tee "$RUNNER_TEMP/m3-source-inspection/entrypoint-only.diff"
          lake build pscv0_native_checks
          .lake/build/bin/pscv0_native_checks 2>&1 | tee "$RUNNER_TEMP/m3-source-inspection/application-check.log"
          cp ../dist/m3-source-inspection/application.ps "$RUNNER_TEMP/m3-source-inspection/application.ps"
          # Diagnostic success is evidence extraction, never qualification.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pscv0-m3-source-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/m3-source-inspection/
          if-no-files-found: error
          retention-days: 30
