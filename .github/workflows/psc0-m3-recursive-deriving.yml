name: PSCV0 M3 recursive Hashable qualification

on:
  push:
    branches:
      - psc0/pscv0-v7-native-lean-v1
      - psc0/pscv0-v7-platform-words-research
    paths:
      - 'psc0/lakefile.lean'
      - 'psc0/lean-toolchain'
      - 'psc0/packages/**'
      - 'psc0/host/**'
      - 'psc0/v7-native/**'
      - 'psc0/test/Pscv0M3RecursiveDeriving.lean'
      - 'psc0/test/Pscv0M3InductiveGroups.lean'
      - 'psc0/test/Pscv0M3PartialFixpointAssumptions.lean'
      - 'psc0/scripts/pscv0-m3-recursive-deriving.mjs'
      - '.github/workflows/psc0-m3-recursive-deriving.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pscv0-m3-recursive-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recursive-hashable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Build native compiler and check recursive derivation
        id: checked
        run: |
          set -euo pipefail
          lake build pscv0_native pscv0_m3_recursive_deriving pscv0_m3_inductive_groups
          mkdir -p ../dist/m3-recursive-deriving
          .lake/build/bin/pscv0_m3_inductive_groups | tee ../dist/m3-recursive-deriving/inductive-groups.log
          lake env lean --run ../test/Pscv0M3PartialFixpointAssumptions.lean | tee ../dist/m3-recursive-deriving/partial-fixpoint-assumptions.log
          .lake/build/bin/pscv0_m3_recursive_deriving ../dist/m3-recursive-deriving | tee ../dist/m3-recursive-deriving/check.log
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-recursive-deriving/source-sha.txt
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
      - name: Execute direct JavaScript and compiled TypeScript
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pscv0-m3-tools" --ignore-scripts --no-audit --no-fund --no-package-lock typescript@7.0.2
          TSC="$RUNNER_TEMP/pscv0-m3-tools/node_modules/.bin/tsc"
          "$TSC" --version | grep -Fx 'Version 7.0.2'
          "$TSC" --ignoreConfig ../dist/m3-recursive-deriving/hashing.ts --outDir ../dist/m3-recursive-deriving/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-recursive-deriving.mjs ecma ../dist/m3-recursive-deriving | tee ../dist/m3-recursive-deriving/js.log
          node ../scripts/pscv0-m3-recursive-deriving.mjs ecma ../dist/m3-recursive-deriving ../dist/m3-recursive-deriving/ts/hashing.js | tee ../dist/m3-recursive-deriving/ts.log
      - name: Execute Rust with the existing pinned dependency lock
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          node ../scripts/pscv0-m3-recursive-deriving.mjs rust ../dist/m3-recursive-deriving
          rustup run 1.98.1 cargo run --manifest-path rust/Cargo.toml --locked --release --bin pscv0-native-runtime-check 2>&1 | tee ../dist/m3-recursive-deriving/rust.log
      - name: Execute GC core and components against the native oracle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pscv0-m3-wasm"
          cd "$RUNNER_TEMP/pscv0-m3-wasm"
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-x86_64-linux.tar.gz -o wasm-tools.tar.gz
          echo 'ad62b2176037e93e1348cb65d6212d128ca9f097b63d155569f25215818ff7b1  wasm-tools.tar.gz' | sha256sum -c -
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz -o wasmtime.tar.xz
          echo 'a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  wasmtime.tar.xz' | sha256sum -c -
          tar -xzf wasm-tools.tar.gz
          tar -xJf wasmtime.tar.xz
          export PATH="$RUNNER_TEMP/pscv0-m3-wasm/wasm-tools-1.261.0-x86_64-linux:$RUNNER_TEMP/pscv0-m3-wasm/wasmtime-v49.0.2-x86_64-linux:$PATH"
          cd "$GITHUB_WORKSPACE/psc0/v7-native"
          node ../scripts/pscv0-m3-recursive-deriving.mjs wasm ../dist/m3-recursive-deriving | tee ../dist/m3-recursive-deriving/wasm.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pscv0-m3-recursive-hash-${{ github.sha }}
          path: psc0/dist/m3-recursive-deriving/
          if-no-files-found: warn
          retention-days: 30

