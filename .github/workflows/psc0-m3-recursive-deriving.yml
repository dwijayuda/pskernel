name: PSCV0 M3 recursive Hashable qualification

on:
  push:
    branches:
      - psc0/pscv0-v7-native-lean-v1
      - psc0/pscv0-v7-platform-words-research
    paths:
      # M3 acceptance uses one compiler/test SHA, including fixture-only repairs.
      - 'psc0/test/Pscv0M3*.lean'
      - 'psc0/scripts/pscv0-m3-*.mjs'
      - 'psc0/lakefile.lean'
      - 'psc0/lean-toolchain'
      - 'psc0/packages/**'
      - 'psc0/host/**'
      - 'psc0/v7-native/**'
      - 'psc0/test/Pscv0M3RecursiveDeriving.lean'
      - 'psc0/test/Pscv0M3InductiveGroups.lean'
      - 'psc0/test/Pscv0M3InductiveRuntime.lean'
      - 'psc0/test/Pscv0M3InductiveMatch.lean'
      - 'psc0/test/Pscv0M3WellFounded.lean'
      - 'psc0/test/Pscv0M3MutualPartial.lean'
      - 'psc0/test/Pscv0M3InductiveDeriving.lean'
      - 'psc0/test/Pscv0M3PartialFixpointAssumptions.lean'
      - 'psc0/scripts/pscv0-m3-recursive-deriving.mjs'
      - 'psc0/scripts/pscv0-m3-runtime.mjs'
      - '.github/workflows/psc0-m3-recursive-deriving.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pscv0-m3-recursive-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recursive-hashable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/package.json
            /psc0/PSCV0_LANGUAGE_REFERENCE_v7.2.md
            /psc0/docs/PSCV0_REFERENCE_ADOPTION.json
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
            /psc0/v7-native/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Guard native-only closure and v7.2 identity
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test ! -d ../packages/pskernel-core
          node ../scripts/pscv0-native-profile.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-
      - name: Build native compiler and check recursive derivation
        id: checked
        run: |
          set -euo pipefail
          lake build pscv0_native pscv0_m3_recursive_deriving pscv0_m3_inductive_groups pscv0_m3_inductive_runtime pscv0_m3_well_founded pscv0_m3_inductive_match pscv0_m3_mutual_partial pscv0_m3_inductive_deriving pscv0_m3_mutual_structural pscv0_m3_nested_inductive pscv0_m3_where pscv0_m3_nested_deriving pscv0_m3_group_proof_deriving pscv0_m3_empty_dictionaries pscv0_m3_partial_fixpoint pscv0_m3_noncomputable
          mkdir -p ../dist/m3-recursive-deriving ../dist/m3-inductive-runtime ../dist/m3-well-founded ../dist/m3-inductive-match ../dist/m3-mutual-partial ../dist/m3-inductive-deriving ../dist/m3-mutual-structural ../dist/m3-nested-inductive ../dist/m3-where ../dist/m3-nested-deriving ../dist/m3-group-proof-deriving ../dist/m3-group-proof-deriving/indexed-inhabited ../dist/m3-empty-dictionaries
          mkdir -p ../dist/m3-mutual-partial/p0-generic
          mkdir -p ../dist/m3-inductive-deriving/indexed-beq
          mkdir -p ../dist/m3-mutual-partial/p0-nonempty
          mkdir -p ../dist/m3-partial-fixpoint
          mkdir -p ../dist/m3-noncomputable
          # Collect every independent source-check failure; all fixtures remain required.
          m3_fixture_status=0
          m3_check_fixture() {
            local m3_fixture_log="$1"
            shift
            if "$@" 2>&1 | tee "$m3_fixture_log"; then
              return 0
            else
              m3_fixture_status=1
            fi
          }
          m3_check_fixture ../dist/m3-recursive-deriving/inductive-groups.log .lake/build/bin/pscv0_m3_inductive_groups
          m3_check_fixture ../dist/m3-recursive-deriving/partial-fixpoint-assumptions.log lake env lean --run ../test/Pscv0M3PartialFixpointAssumptions.lean
          m3_check_fixture ../dist/m3-recursive-deriving/check.log .lake/build/bin/pscv0_m3_recursive_deriving ../dist/m3-recursive-deriving
          m3_check_fixture ../dist/m3-inductive-runtime/check.log .lake/build/bin/pscv0_m3_inductive_runtime ../dist/m3-inductive-runtime
          m3_check_fixture ../dist/m3-well-founded/check.log .lake/build/bin/pscv0_m3_well_founded ../dist/m3-well-founded
          m3_check_fixture ../dist/m3-inductive-match/check.log .lake/build/bin/pscv0_m3_inductive_match ../dist/m3-inductive-match
          m3_check_fixture ../dist/m3-mutual-partial/check.log .lake/build/bin/pscv0_m3_mutual_partial ../dist/m3-mutual-partial
          m3_check_fixture ../dist/m3-inductive-deriving/check.log .lake/build/bin/pscv0_m3_inductive_deriving ../dist/m3-inductive-deriving
          m3_check_fixture ../dist/m3-mutual-structural/check.log .lake/build/bin/pscv0_m3_mutual_structural ../dist/m3-mutual-structural
          m3_check_fixture ../dist/m3-nested-inductive/check.log .lake/build/bin/pscv0_m3_nested_inductive ../dist/m3-nested-inductive
          m3_check_fixture ../dist/m3-where/check.log .lake/build/bin/pscv0_m3_where ../dist/m3-where
          m3_check_fixture ../dist/m3-nested-deriving/check.log .lake/build/bin/pscv0_m3_nested_deriving ../dist/m3-nested-deriving
          m3_check_fixture ../dist/m3-group-proof-deriving/check.log .lake/build/bin/pscv0_m3_group_proof_deriving ../dist/m3-group-proof-deriving
          m3_check_fixture ../dist/m3-empty-dictionaries/check.log .lake/build/bin/pscv0_m3_empty_dictionaries ../dist/m3-empty-dictionaries
          m3_check_fixture ../dist/m3-partial-fixpoint/check.log .lake/build/bin/pscv0_m3_partial_fixpoint ../dist/m3-partial-fixpoint
          m3_check_fixture ../dist/m3-noncomputable/check.log .lake/build/bin/pscv0_m3_noncomputable ../dist/m3-noncomputable
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-recursive-deriving/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-inductive-runtime/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-well-founded/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-inductive-match/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-mutual-partial/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-mutual-partial/p0-generic/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-mutual-partial/p0-nonempty/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-inductive-deriving/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-inductive-deriving/indexed-beq/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-mutual-structural/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-nested-inductive/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-where/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-nested-deriving/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-group-proof-deriving/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-empty-dictionaries/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-partial-fixpoint/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-noncomputable/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > ../dist/m3-group-proof-deriving/indexed-inhabited/source-sha.txt
          test "$m3_fixture_status" -eq 0
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-m3-hash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/v7-native/lean-toolchain', 'psc0/lean-toolchain') }}-${{ github.sha }}
      - name: Execute direct JavaScript and compiled TypeScript
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pscv0-m3-tools" --ignore-scripts --no-audit --no-fund --no-package-lock typescript@7.0.2
          TSC="$RUNNER_TEMP/pscv0-m3-tools/node_modules/.bin/tsc"
          "$TSC" --version | grep -Fx 'Version 7.0.2'
          "$TSC" --ignoreConfig ../dist/m3-recursive-deriving/hashing.ts --outDir ../dist/m3-recursive-deriving/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-recursive-deriving.mjs ecma ../dist/m3-recursive-deriving | tee ../dist/m3-recursive-deriving/js.log
          node ../scripts/pscv0-m3-recursive-deriving.mjs ecma ../dist/m3-recursive-deriving ../dist/m3-recursive-deriving/ts/hashing.js | tee ../dist/m3-recursive-deriving/ts.log
          "$TSC" --ignoreConfig ../dist/m3-inductive-runtime/groupfold.ts --outDir ../dist/m3-inductive-runtime/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-runtime groupfold m3groupleft,m3groupright | tee ../dist/m3-inductive-runtime/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-runtime groupfold m3groupleft,m3groupright ../dist/m3-inductive-runtime/ts/groupfold.js | tee ../dist/m3-inductive-runtime/ts.log
          "$TSC" --ignoreConfig ../dist/m3-well-founded/wellfounded.ts --outDir ../dist/m3-well-founded/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-well-founded wellfounded m3wfskipoutput,m3wfbranchesoutput,m3wfshiftoutput,m3wfdefaultoutput,m3wfaccoutput,m3wfoffsetoutput,m3wfstatesoutput,m3wffixedoutput,m3wflistoutput,m3wffunctionoutput,m3wfdependentstateoutput,m3wfdependentresultoutput,m3wfrelationsoutput,m3wfpackedoutput,m3wfindependentleftoutput,m3wfindependentrightoutput,m3wfnaryoutput | tee ../dist/m3-well-founded/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-well-founded wellfounded m3wfskipoutput,m3wfbranchesoutput,m3wfshiftoutput,m3wfdefaultoutput,m3wfaccoutput,m3wfoffsetoutput,m3wfstatesoutput,m3wffixedoutput,m3wflistoutput,m3wffunctionoutput,m3wfdependentstateoutput,m3wfdependentresultoutput,m3wfrelationsoutput,m3wfpackedoutput,m3wfindependentleftoutput,m3wfindependentrightoutput,m3wfnaryoutput ../dist/m3-well-founded/ts/wellfounded.js | tee ../dist/m3-well-founded/ts.log
          "$TSC" --ignoreConfig ../dist/m3-inductive-match/groupmatch.ts --outDir ../dist/m3-inductive-match/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-match groupmatch m3matchleft,m3matchright,m3matchnested,m3matchzero | tee ../dist/m3-inductive-match/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-match groupmatch m3matchleft,m3matchright,m3matchnested,m3matchzero ../dist/m3-inductive-match/ts/groupmatch.js | tee ../dist/m3-inductive-match/ts.log
          "$TSC" --ignoreConfig ../dist/m3-mutual-partial/mutual.ts --outDir ../dist/m3-mutual-partial/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial mutual m3mutualoutput,m3mutualcaptureoutput,m3mutualdisconnectedoutput,m3mutualnullaryoutput,m3mutualshadowoutput | tee ../dist/m3-mutual-partial/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial mutual m3mutualoutput,m3mutualcaptureoutput,m3mutualdisconnectedoutput,m3mutualnullaryoutput,m3mutualshadowoutput ../dist/m3-mutual-partial/ts/mutual.js | tee ../dist/m3-mutual-partial/ts.log
          "$TSC" --ignoreConfig ../dist/m3-mutual-partial/p0-generic/p0generic.ts --outDir ../dist/m3-mutual-partial/p0-generic/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial/p0-generic p0generic m3p0genericnat,m3p0genericbool | tee ../dist/m3-mutual-partial/p0-generic/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial/p0-generic p0generic m3p0genericnat,m3p0genericbool ../dist/m3-mutual-partial/p0-generic/ts/p0generic.js | tee ../dist/m3-mutual-partial/p0-generic/ts.log
          "$TSC" --ignoreConfig ../dist/m3-mutual-partial/p0-nonempty/p0nonempty.ts --outDir ../dist/m3-mutual-partial/p0-nonempty/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          "$TSC" --ignoreConfig ../dist/m3-partial-fixpoint/p1fixedpoint.ts --outDir ../dist/m3-partial-fixpoint/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          "$TSC" --ignoreConfig ../dist/m3-noncomputable/noncomputable.ts --outDir ../dist/m3-noncomputable/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial/p0-nonempty p0nonempty m3p0nonempty | tee ../dist/m3-mutual-partial/p0-nonempty/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-partial-fixpoint p1fixedpoint m3p1countdown,m3p1option,m3p1mutual | tee ../dist/m3-partial-fixpoint/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-noncomputable noncomputable m3noncomp | tee ../dist/m3-noncomputable/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-partial/p0-nonempty p0nonempty m3p0nonempty ../dist/m3-mutual-partial/p0-nonempty/ts/p0nonempty.js | tee ../dist/m3-mutual-partial/p0-nonempty/ts.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-partial-fixpoint p1fixedpoint m3p1countdown,m3p1option,m3p1mutual ../dist/m3-partial-fixpoint/ts/p1fixedpoint.js | tee ../dist/m3-partial-fixpoint/ts.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-noncomputable noncomputable m3noncomp ../dist/m3-noncomputable/ts/noncomputable.js | tee ../dist/m3-noncomputable/ts.log
          "$TSC" --ignoreConfig ../dist/m3-inductive-deriving/groupderive.ts --outDir ../dist/m3-inductive-deriving/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-deriving groupderive m3derivehash,m3deriverepr,m3derivebeq,m3deriveatom,m3deriveindexedhash,m3deriveindexedrepr | tee ../dist/m3-inductive-deriving/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-deriving groupderive m3derivehash,m3deriverepr,m3derivebeq,m3deriveatom,m3deriveindexedhash,m3deriveindexedrepr ../dist/m3-inductive-deriving/ts/groupderive.js | tee ../dist/m3-inductive-deriving/ts.log
          "$TSC" --ignoreConfig ../dist/m3-inductive-deriving/indexed-beq/indexedbeq.ts --outDir ../dist/m3-inductive-deriving/indexed-beq/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-deriving/indexed-beq indexedbeq m3indexedbeqnat,m3indexedbeqbool | tee ../dist/m3-inductive-deriving/indexed-beq/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-inductive-deriving/indexed-beq indexedbeq m3indexedbeqnat,m3indexedbeqbool ../dist/m3-inductive-deriving/indexed-beq/ts/indexedbeq.js | tee ../dist/m3-inductive-deriving/indexed-beq/ts.log
          "$TSC" --ignoreConfig ../dist/m3-mutual-structural/mutualstructural.ts --outDir ../dist/m3-mutual-structural/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-structural mutualstructural m3structfirst,m3structsecond,m3structleftfirst,m3structleftsecond,m3structkeep,m3structgeneric | tee ../dist/m3-mutual-structural/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-mutual-structural mutualstructural m3structfirst,m3structsecond,m3structleftfirst,m3structleftsecond,m3structkeep,m3structgeneric ../dist/m3-mutual-structural/ts/mutualstructural.js | tee ../dist/m3-mutual-structural/ts.log
          "$TSC" --ignoreConfig ../dist/m3-nested-inductive/nestedfold.ts --outDir ../dist/m3-nested-inductive/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-nested-inductive nestedfold m3nestedfold,m3nestedhash,m3nestedmutualfold,m3nestedmutualhash,m3nestedindexedfold,m3nestedindexedhash,m3nesteddirect | tee ../dist/m3-nested-inductive/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-nested-inductive nestedfold m3nestedfold,m3nestedhash,m3nestedmutualfold,m3nestedmutualhash,m3nestedindexedfold,m3nestedindexedhash,m3nesteddirect ../dist/m3-nested-inductive/ts/nestedfold.js | tee ../dist/m3-nested-inductive/ts.log
          "$TSC" --ignoreConfig ../dist/m3-where/wherefixture.ts --outDir ../dist/m3-where/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-where wherefixture m3wherecapture,m3wheregeneric,m3whereshadow,m3wherecycle,m3wherepartial,m3wherewf | tee ../dist/m3-where/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-where wherefixture m3wherecapture,m3wheregeneric,m3whereshadow,m3wherecycle,m3wherepartial,m3wherewf ../dist/m3-where/ts/wherefixture.js | tee ../dist/m3-where/ts.log
          "$TSC" --ignoreConfig ../dist/m3-nested-deriving/nestedderive.ts --outDir ../dist/m3-nested-deriving/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-nested-deriving nestedderive m3nestedrepr,m3nestedtuplerepr,m3nestedindexedrepr,m3nestedbeq,m3nestedarraybeq,m3nestedatombeq | tee ../dist/m3-nested-deriving/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-nested-deriving nestedderive m3nestedrepr,m3nestedtuplerepr,m3nestedindexedrepr,m3nestedbeq,m3nestedarraybeq,m3nestedatombeq ../dist/m3-nested-deriving/ts/nestedderive.js | tee ../dist/m3-nested-deriving/ts.log
          "$TSC" --ignoreConfig ../dist/m3-group-proof-deriving/groupproof.ts --outDir ../dist/m3-group-proof-deriving/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-group-proof-deriving groupproof m3groupdecide,m3groupdecideatom,m3groupdefault,m3grouprequired | tee ../dist/m3-group-proof-deriving/js.log
          node ../scripts/pscv0-m3-runtime.mjs ecma ../dist/m3-group-proof-deriving groupproof m3groupdecide,m3groupdecideatom,m3groupdefault,m3grouprequired ../dist/m3-group-proof-deriving/ts/groupproof.js | tee ../dist/m3-group-proof-deriving/ts.log
          "$TSC" --ignoreConfig ../dist/m3-empty-dictionaries/emptydict.ts --outDir ../dist/m3-empty-dictionaries/ts --target ES2022 --module ES2022 --moduleResolution bundler --strict --noEmitOnError --skipLibCheck --pretty false
