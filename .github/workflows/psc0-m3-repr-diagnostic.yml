name: PSCV0 M3 Repr fixture migration preparation
on:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1]
    paths: ['.github/workflows/psc0-m3-repr-diagnostic.yml']
jobs:
  prepare-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: psc0/test
      - name: Prepare one exact fixture change without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib, urllib.request
          p = pathlib.Path('psc0/test/Pscv0NativeTests.lean')
          raw = p.read_bytes()
          before = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert before == '1496891ff3e665ff5e06fb367b4175c845552b35', before
          text = raw.decode('utf-8')
          old = '    { source := "inductive Bad where { | loop(tail: Bad) } deriving Repr\\n" },'
          new = '    { source := "inductive Bad where { | loop(tails: List Bad) } deriving Repr\\n" },'
          assert text.count(old) == 1, 'fixture no longer matches exactly'
          updated = text.replace(old, new)
          data = updated.encode('utf-8')
          expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          print('CHECKOUT', os.environ['GITHUB_SHA'], 'ORIGINAL_BLOB', before)
          print(''.join(difflib.unified_diff(text.splitlines(True), updated.splitlines(True), fromfile=str(p), tofile=str(p))))
          body = json.dumps({'content': updated, 'encoding':'utf-8'}).encode()
          req = urllib.request.Request('https://api.github.com/repos/dwijayuda/pskernel/git/blobs', data=body, method='POST', headers={'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          req.add_unredirected_header('Authorization', 'Bearer '+os.environ['GH_TOKEN'])
          with urllib.request.urlopen(req, timeout=30) as response: result = json.load(response)
          assert result['sha'] == expected
          print('PREPARED_BLOB', result['sha'], 'BYTES', len(data))
          print('No source checkout file, tree, commit, branch, PR or qualification gate was changed by this job.')
          PY
