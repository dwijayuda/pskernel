name: PSC0 npm distribution (explicit release rebuild)
# Ordinary host edits use psc0-checked-host.yml, reusing pinned runtime bytes.
# Regenerating compiler/kernel and translating all sources is an explicit release action.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc0-npm-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: psc0
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Check host and workspace before expensive generation
        run: |
          node scripts/check-workspace.mjs
          node --test scripts/checked-prepared-session.test.mjs scripts/architecture-host.test.mjs
      - name: Install pinned TypeScript outside private workspaces
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-npm-ts7" --ignore-scripts --save-exact --no-audit --no-fund typescript@7.0.2
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync,realpathSync} from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const root=path.join(process.env.RUNNER_TEMP,'psc0-npm-ts7/node_modules/typescript');
          const meta=JSON.parse(readFileSync(path.join(root,'package.json'),'utf8'));
          if(meta.name!=='typescript'||meta.version!=='7.0.2')throw Error('PSC0_TSC_VERSION');
          const cli=realpathSync(path.join(root,typeof meta.bin==='string'?meta.bin:meta.bin.tsc));
          const result=spawnSync(process.execPath,[cli,'--version'],{encoding:'utf8'});
          if(result.status!==0||result.stdout.trim()!=='Version 7.0.2')throw Error('PSC0_TSC_CLI');
          appendFileSync(process.env.GITHUB_ENV,'PSC0_TSC='+cli+'\n');
          NODE
      - name: Build authoritative native frontend and prelude exporter
        run: lake build psc1 psc2_joint_closure_inventory
      - name: Check complete compiler and existing Core roots
        run: |
          lake exe psc1 check packages/bootstrap/src/Ps/Bootstrap/SelfHost.lean
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Generate release runtimes
        run: |
          mkdir -p dist/npm-build/compiler dist/npm-build/pskernel-core
          lake exe psc1 build packages/bootstrap/src/Ps/Bootstrap/SelfHost.lean --out dist/npm-build/compiler/index.js
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean --out dist/npm-build/pskernel-core/index.js
          lake exe psc2_joint_closure_inventory --prelude dist/npm-build/pskernel-core/prelude.json
      - name: Preserve independent bounded kernel comparison
        run: node scripts/npm-core-qualification.mjs
      - name: Pack and test source editions
        run: node scripts/npm-distribution.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: proofscript-psc0-npm-ps-and-lean
          path: |
            psc0/dist/npm-distribution/proofscript-psc0-ps-npm-packages.zip
            psc0/dist/npm-distribution/proofscript-psc0-lean-npm-packages.zip
            psc0/dist/npm-distribution/npm-release-manifest.json
            psc0/dist/npm-build/qualification/js-core-parity.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  windows-consumer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@v4
        with:
          name: proofscript-psc0-npm-ps-and-lean
          path: ${{ runner.temp }}/proofscript-ci
      - name: Verify Windows offline installation and executable outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($edition in @('ps','lean')) {
            $archive = Join-Path $env:RUNNER_TEMP ("proofscript-ci/npm-distribution/proofscript-psc0-" + $edition + "-npm-packages.zip")
            if (!(Test-Path $archive)) { throw "Release ZIP missing: $archive" }
            $directory = Join-Path $env:RUNNER_TEMP ("proofscript-extract-" + $edition)
            Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
            $prefix = Join-Path $env:RUNNER_TEMP ("psc0-installed-" + $edition)
            $cache = Join-Path $env:RUNNER_TEMP ("psc0-npm-cache-" + $edition)
            npm install --global --prefix $prefix --cache $cache --offline --ignore-scripts --no-audit --no-fund --no-package-lock (Join-Path $directory 'proofscript-0.1.0-psc0.1.tgz') (Join-Path $directory 'typescript-7.0.2.tgz') (Join-Path $directory 'typescript-typescript-win32-x64-7.0.2.tgz')
            if ($LASTEXITCODE -ne 0) { throw "Offline npm install failed ($edition)" }
            $psc = Join-Path $prefix 'node_modules/proofscript/bin/psc.js'
            node $psc version --json
            if ($LASTEXITCODE -ne 0) { throw "PSC version failed ($edition)" }
            if (Test-Path (Join-Path $prefix 'node_modules/proofscript/node_modules/@proofscript/backend-rust')) { throw 'Optional backend installed' }
            $project = Join-Path $env:RUNNER_TEMP ("psc0-windows-canary-" + $edition)
            New-Item -ItemType Directory -Force -Path $project | Out-Null
            Set-Content -LiteralPath (Join-Path $project 'package.json') -Value '{"type":"module","private":true}'
            Set-Content -LiteralPath (Join-Path $project ("Main." + $edition)) -Value 'def answer : Nat := 42'
            Push-Location $project
            try {
              node $psc check ("Main." + $edition)
              if ($LASTEXITCODE -ne 0) { throw "PSC check failed ($edition)" }
              node $psc build ("Main." + $edition) --out Main.js
              if ($LASTEXITCODE -ne 0) { throw "PSC build failed ($edition)" }
              node --input-type=module -e "import('./Main.js').then(m=>{let a=typeof m.answer==='function'?m.answer():m.answer;if(a!==42n)process.exit(1)})"
              if ($LASTEXITCODE -ne 0) { throw "PSC output mismatch ($edition)" }
            } finally { Pop-Location }
            Write-Host "PSC_NPM_WINDOWS_X64: PASS $edition with TypeScript 7.0.2"
          }
