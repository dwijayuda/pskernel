name: PSC0 PSCV P1H imported constant type provenance
on:
  push:
    branches:
      - psc0/platform-pscv-p1h-declaration-types-v1
  pull_request:
    branches:
      - psc0/platform-pscv-p1g-coverage-ledger-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.23.3'
          - os: ubuntu-24.04
            node: '26.7.0'
          - os: windows-2022
            node: '26.7.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test bounded selected declaration review
        shell: bash
        working-directory: psc0
        run: |
          node --check packages/pscv/src/selected-declaration-review.mjs
          node --check packages/pscv/scripts/generate-selected-declaration-review.mjs
          node --test packages/pscv/test/selected-declaration-review.test.mjs
      - name: Ensure compiler/kernel/seed and production certification unchanged
        shell: bash
        run: |
          git diff --exit-code ede5a7a40aa8833e307d84fa01a738dc4677ad24 -- \
            psc0/packages/foundation psc0/packages/syntax psc0/packages/core \
            psc0/packages/environment psc0/packages/meta psc0/packages/elab \
            psc0/packages/compiler psc0/packages/compiler-ir psc0/packages/bridge \
            psc0/packages/erasure psc0/packages/backend-ts psc0/packages/bootstrap \
            psc0/packages/pskernel-core psc0/selfhost-seed.json psc0/release \
            psc0/scripts/checked-build.mjs psc0/scripts/pscv-certification-gate.mjs
  imported-lean-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: PSCVL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: PSCVL
          build: true
          test: false
          lint: false
      - name: Capture actual imported constant types and Lean source modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          mkdir -p ../psc0/dist/pscv-p1h-types
          lake env lean TypedInstanceWitness.lean > ../psc0/dist/pscv-p1h-types/typed.txt 2>&1
          lake env lean ConcreteDictionaryWitness.lean > ../psc0/dist/pscv-p1h-types/concrete.txt 2>&1
          lake env lean --run SelectedInstanceDeclarations.lean ../psc0/dist/pscv-p1h-types/raw-types.json
          node ../psc0/packages/pscv/scripts/generate-selected-declaration-review.mjs \
            ../psc0/dist/pscv-p1h-types/typed.txt \
            ../psc0/dist/pscv-p1h-types/concrete.txt \
            ../psc0/dist/pscv-p1h-types/raw-types.json \
            ../psc0/dist/pscv-p1h-types/review.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const data=JSON.parse(await readFile('../psc0/dist/pscv-p1h-types/review.json','utf8'));
          assert.equal(data.observedDeclarationCount,11);
          assert.equal(data.remainingUnresolvedIDs,191);
          assert.equal(data.exactSourceLineAndBlobQualified,false);
          assert.equal(data.normativeStandardFrozen,false);
          assert.equal(data.verifiedExecutableAuthorized,false);
          console.log('PSC_P1H_TYPED_IMPORTED_CONSTANTS_NOT_STANDARD: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pscv-p1h-lean-declaration-types-${{ github.sha }}
          path: psc0/dist/pscv-p1h-types
          if-no-files-found: error
          retention-days: 30
