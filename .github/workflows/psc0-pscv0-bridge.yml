name: PSC0 portable PSCV0 source bridge
on:
  push:
    branches: [psc0/pscv0-readable-selfhost-v1, psc0/pscv0-v7-app-model-v1, psc0/pscv0-v7-abi-v1]
    paths:
      - 'psc0/packages/syntax/src/Ps/Syntax/Pscv0/**'
      - 'psc0/packages/syntax/src-ps/**'
      - 'psc0/pscv0-authoring.json'
      - 'psc0/scripts/pscv0-*'
      - 'psc0/scripts/Pscv0AuthoringSmoke.lean'
      - 'psc0/test/pscv0/**'
      - '.github/workflows/psc0-pscv0-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc0-pscv0-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: psc0
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          show-progress: false
          sparse-checkout: |
            psc0/packages/syntax
            psc0/packages/foundation
            psc0/scripts
            psc0/tools/abi
            psc0/test/pscv0
            psc0/PSCV0_LANGUAGE_REFERENCE.md
            psc0/docs/PSCV0_REFERENCE_ADOPTION.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify authoritative PSCV0 v7 source bytes and manifests first
        run: node scripts/pscv0-reference-identity.mjs
      - name: Cheap native source, authoring round trip and eight proofs before generation
        run: |
          lake build PsSyntax PsFoundation
          mkdir -p .lake/build/lib/lean/Ps/Syntax/Pscv0
          for MODULE in Surface Read Commands TypePrint Module; do
            lake env lean -o ".lake/build/lib/lean/Ps/Syntax/Pscv0/$MODULE.olean" "packages/syntax/src/Ps/Syntax/Pscv0/$MODULE.lean"
          done
          lake env lean --run scripts/Pscv0BridgeSourceSmoke.lean
          lake env lean --run scripts/Pscv0AuthoringSmoke.lean
          node scripts/pscv0-authoring.mjs --native-preflight
          node scripts/pscv0-authoring-proof.mjs 4.34.0 dist/pscv0-native-authoring/authoring
      - name: Set runner-local retained tool location
        run: echo "PSCV0_PREFIX=$RUNNER_TEMP/pscv0-tools" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          run-id: 38075437516
          name: proofscript-psc0-npm-ps-and-lean
          path: ${{ runner.temp }}/pscv0-retained
      - name: Install exact retained compiler and TypeScript without rebuilding either
        run: |
          python - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          matches=list((root/'pscv0-retained').rglob('proofscript-psc0-lean-npm-packages.zip'))
          assert len(matches)==1
          with zipfile.ZipFile(matches[0]) as z:
            assert all(pathlib.PurePosixPath(n).name==n for n in z.namelist())
            z.extractall(root/'pscv0-input')
          PY
          node scripts/pscv0-stage-runtime.mjs "$RUNNER_TEMP/pscv0-input"
          npm install -g --prefix "$PSCV0_PREFIX" --cache "$RUNNER_TEMP/pscv0-cache" --offline --ignore-scripts --no-audit --no-fund --no-package-lock "$RUNNER_TEMP/pscv0-input/proofscript-0.1.0-psc0.1.tgz" "$RUNNER_TEMP/pscv0-input/typescript-7.0.2.tgz" "$RUNNER_TEMP/pscv0-input/typescript-typescript-linux-x64-7.0.2.tgz"
      - name: Generate owned surface then PS-authored bridge with one shared preparation prefix
        run: timeout 1600 node scripts/pscv0-build-bridge.mjs "$PSCV0_PREFIX" dist/pscv0-bridge
      - name: Exercise unchanged bridge assertions and candidate authoring regressions
        run: |
          node --test --test-concurrency=1 --test-reporter=tap scripts/pscv0-bridge.test.mjs | tee dist/pscv0-bridge/tests-linux.tap
          node --test --test-concurrency=1 --test-reporter=tap scripts/pscv0-authoring.test.mjs scripts/pscv0-arrow.test.mjs | tee dist/pscv0-bridge/authoring-tests-linux.tap
      - name: Retain generated candidate and exact authoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-bridge-${{ github.sha }}
          path: psc0/dist/pscv0-bridge/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain native preflight separately, never as generated qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-authoring-native-${{ github.sha }}
          path: psc0/dist/pscv0-native-authoring/
          if-no-files-found: warn
          retention-days: 30
  windows:
    needs: bridge
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc0
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            psc0/scripts
            psc0/tools/abi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - name: Set runner-local installation prefix
        run: echo "PSCV0_PREFIX=$RUNNER_TEMP/pscv0-tools" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pscv0-bridge-${{ github.sha }}
          path: psc0/dist/pscv0-bridge
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          run-id: 38075437516
          name: proofscript-psc0-npm-ps-and-lean
          path: ${{ runner.temp }}/pscv0-retained
      - name: Install retained Windows toolchain and test the same generated bridge
        run: |
          python - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          matches=list((root/'pscv0-retained').rglob('proofscript-psc0-lean-npm-packages.zip'))
          assert len(matches)==1
          with zipfile.ZipFile(matches[0]) as z:
            assert all(pathlib.PurePosixPath(n).name==n for n in z.namelist())
            z.extractall(root/'pscv0-input')
          PY
          node scripts/pscv0-stage-runtime.mjs "$RUNNER_TEMP/pscv0-input"
          npm install -g --prefix "$PSCV0_PREFIX" --cache "$RUNNER_TEMP/pscv0-cache" --offline --ignore-scripts --no-audit --no-fund --no-package-lock "$RUNNER_TEMP/pscv0-input/proofscript-0.1.0-psc0.1.tgz" "$RUNNER_TEMP/pscv0-input/typescript-7.0.2.tgz" "$RUNNER_TEMP/pscv0-input/typescript-typescript-win32-x64-7.0.2.tgz"
          node --test --test-concurrency=1 --test-reporter=tap scripts/pscv0-bridge.test.mjs | tee dist/pscv0-bridge/tests-windows.tap
          node --test --test-concurrency=1 --test-reporter=tap scripts/pscv0-authoring.test.mjs scripts/pscv0-arrow.test.mjs | tee dist/pscv0-bridge/authoring-tests-windows.tap
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-bridge-windows-${{ github.sha }}
          path: |
            psc0/dist/pscv0-bridge/tests-windows.tap
            psc0/dist/pscv0-bridge/runtime-report-win32.json
            psc0/dist/pscv0-bridge/authoring-tests-windows.tap
            psc0/dist/pscv0-bridge/authoring-tests-win32.json
          if-no-files-found: error
  lean-reference:
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            psc0/packages/syntax
            psc0/packages/foundation
            psc0/scripts
            psc0/test/pscv0/reference
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pscv0-bridge-${{ github.sha }}
          path: psc0/dist/pscv0-bridge
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/test/pscv0/reference
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: RC4 checks the generated do fixture and all migrated translation APIs
        shell: bash
        working-directory: psc0
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.35.0-rc4
        run: |
          set -euo pipefail
          lean --version | tee dist/pscv0-bridge/lean-version.txt
          grep -F '4.35.0-rc4' dist/pscv0-bridge/lean-version.txt
          grep -F 'c29b6dda4f7c20e3eeaa717c4e565663c5cfa364' dist/pscv0-bridge/lean-version.txt
          lean dist/pscv0-bridge/reference.lean | tee dist/pscv0-bridge/reference-proof.txt
          grep -F "'pscv0_do_correspondence' does not depend on any axioms" dist/pscv0-bridge/reference-proof.txt
          lake build PsSyntax PsFoundation
          node scripts/pscv0-authoring-proof.mjs 4.35.0-rc4
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-bridge-rc4-${{ github.sha }}
          path: |
            psc0/dist/pscv0-bridge/reference.lean
            psc0/dist/pscv0-bridge/reference-proof.txt
            psc0/dist/pscv0-bridge/lean-version.txt
            psc0/dist/pscv0-bridge/authoring/
          if-no-files-found: error
