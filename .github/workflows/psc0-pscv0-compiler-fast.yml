name: PSC0 fast compiler-only PSCV0 v7 development
on:
  push:
    branches: [psc0/pscv0-compiler-fast-loop-v1]
    paths:
      - 'psc0/tools/abi/**'
      - 'psc0/scripts/pscv0-*.mjs'
      - 'psc0/packages/syntax/src-ps/**'
      - 'psc0/packages/foundation/src-ps/**'
      - 'psc0/pscv0-authoring.json'
      - 'psc0/pscv0-fast-candidates.json'
      - 'psc0/packages/syntax/src/Ps/Syntax/Pscv0/**'
      - 'psc0/packages/syntax/src/Ps/Syntax/ParseProofScript.lean'
      - 'psc0/packages/syntax/src/Ps/Syntax/PrintProofScript.lean'
      - '.github/workflows/psc0-pscv0-compiler-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc0-compiler-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: psc0
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            psc0/packages/syntax
            psc0/packages/foundation
            psc0/tools/abi
            psc0/scripts
            psc0/pscv0-authoring.json
            psc0/PSCV0_LANGUAGE_REFERENCE.md
            psc0/docs/PSCV0_REFERENCE_ADOPTION.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Fast syntax of host tools and exact v7 reference identity
        run: |
          set -euo pipefail
          node --check tools/abi/compiler-fast.mjs
          node --check tools/abi/compiler-source-differential.mjs
          node --check tools/abi/transport.mjs
          node --check scripts/pscv0-authoring.mjs
          node --check scripts/pscv0-build-bridge.mjs
          node scripts/pscv0-reference-identity.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          run-id: 38128357665
          name: pscv0-bridge-a640a2d22adeabd4ca7919839a8991667bcc3eae
          path: psc0/fast-cache
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          run-id: 38075437516
          name: proofscript-psc0-npm-ps-and-lean
          path: ${{ runner.temp }}/pscv0-retained
      - name: Install exact pinned compiler and TS7 only (no kernel test)
        run: |
          python - <<'PY'
          import pathlib,zipfile,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          matches=list((root/'pscv0-retained').rglob('proofscript-psc0-lean-npm-packages.zip'))
          assert len(matches)==1
          with zipfile.ZipFile(matches[0]) as z:
            assert all(pathlib.PurePosixPath(n).name==n for n in z.namelist())
            z.extractall(root/'pscv0-input')
          PY
          node scripts/pscv0-stage-runtime.mjs "$RUNNER_TEMP/pscv0-input"
          npm install -g --prefix "$RUNNER_TEMP/pscv0-tools" --cache "$RUNNER_TEMP/pscv0-cache" --offline --ignore-scripts --no-audit --no-fund --no-package-lock "$RUNNER_TEMP/pscv0-input/proofscript-0.1.0-psc0.1.tgz" "$RUNNER_TEMP/pscv0-input/typescript-7.0.2.tgz" "$RUNNER_TEMP/pscv0-input/typescript-typescript-linux-x64-7.0.2.tgz"
      - name: Fast compiler-only PS source -> typed elaboration -> TS7 -> JS
        run: |
          set -euo pipefail
          node tools/abi/compiler-fast.mjs "$PWD/fast-cache" "$RUNNER_TEMP/pscv0-tools/lib/node_modules/proofscript" | tee fast-compiler.log
          grep -F 'PSCV0_COMPILER_FAST: PASS' fast-compiler.log
      - name: Differential all candidate compiler source modules without kernel tests
        run: |
          set -euo pipefail
          node tools/abi/compiler-source-differential.mjs "$PWD/fast-cache" "$RUNNER_TEMP/pscv0-tools/lib/node_modules/proofscript" | tee multi-source-differential.log
          grep -F 'PSCV0_COMPILER_MULTI_SOURCE: PASS' multi-source-differential.log
      - name: Retain measured compiler-only evidence without mislabeling checked release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-compiler-only-fast-${{ github.sha }}
          path: |
            psc0/fast-compiler.log
            psc0/multi-source-differential.log
            psc0/dist/pscv0-compiler-fast/source-module-differential.json
            psc0/dist/pscv0-compiler-fast/compiler-only-report.json
          if-no-files-found: warn
          retention-days: 14
