name: PSCV0 F3 checked logical conversions

on:
  workflow_dispatch:
  push:
    branches: [psc0/pscv0-v7-native-lean-v1, psc0/pscv0-v7-f3-conversions-research, psc0/pscv0-v7-platform-words-research]
    paths:
      # M3 acceptance uses one compiler/test SHA, including fixture-only repairs.
      - 'psc0/test/Pscv0M3*.lean'
      - 'psc0/scripts/pscv0-m3-*.mjs'
      # Byte-exact logical replay; runtime qualification is an independent gate.
      - 'psc0/packages/**/src/**'
      - 'psc0/packages/pskernel-lean/provider/**'
      - 'psc0/host/src/Ps/Host/StandardManifest.lean'
      - 'psc0/host/src/Ps/Host/StandardClosure.lean'
      - 'psc0/host/src/Ps/Host/StandardSource.lean'
      - 'psc0/host/src/Ps/Host/StandardSnapshot.lean'
      - 'psc0/lakefile.lean'
      - 'psc0/lean-toolchain'
      - 'psc0/host/src/Ps/Host/FloatCanonical.lean'
      - 'psc0/host/src/Ps/Host/FloatCanonicalContracts.lean'
      - 'psc0/host/src/Ps/Host/StandardExport.lean'
      - 'psc0/test/Pscv0FloatConstructiveOracle.lean'
      - 'psc0/scripts/Pscv0Native.lean'
      - 'psc0/v7-native/lakefile.lean'
      - '.github/workflows/psc0-pscv0-f3-conversions.yml'
      - '.github/workflows/psc0-pscv0-native-v7.yml'
permissions:
  contents: read
concurrency:
  group: pscv0-f3-conversions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc0/v7-native
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/lakefile.lean
            /psc0/lake-manifest.json
            /psc0/lean-toolchain
            /psc0/v7-native/
            /psc0/packages/foundation/src/
            /psc0/packages/syntax/src/
            /psc0/packages/core/src/
            /psc0/packages/environment/src/
            /psc0/packages/meta/src/
            /psc0/packages/elab/src/
            /psc0/packages/bridge/src/
            /psc0/packages/compiler-ir/src/
            /psc0/packages/erasure/src/
            /psc0/packages/compiler/src/
            /psc0/packages/codegen/src/
            /psc0/packages/backend-rust/src/
            /psc0/packages/backend-ts/src/
            /psc0/packages/backend-ecma/src/
            /psc0/packages/backend-wasm/src/
            /psc0/packages/pskernel-lean/provider/
            /psc0/host/src/
            /psc0/test/
            /psc0/scripts/
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-f3-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            pscv0-f3-${{ runner.os }}-${{ runner.arch }}-
            pscv0-f2-${{ runner.os }}-${{ runner.arch }}-
            pscv0-f1-${{ runner.os }}-${{ runner.arch }}-
            pscv0-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Check pinned scientific and numeric conversion dependencies
        run: |
          set -euo pipefail
          lake build pscv0_native PsV7FloatConstructiveOracle
          mkdir -p ../dist/pscv0-f3-conversions
          test -f .lake/build/lib/lean/Ps/Host/FloatConstructive.olean
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          lake env env LEAN_PATH="$PWD/.lake/build/lib/lean:$BASE_LEAN_PATH" .lake/build/bin/pscv0_native --export-float-conversions-candidate ../dist/pscv0-f3-conversions/FloatConversionsCandidate.lean | tee ../dist/pscv0-f3-conversions/conversions.log | grep -v '^PSCV0_STANDARD_SOURCE '
          # Expose reviewed candidate metadata on a strict mismatch without
          # dumping proof bodies or accepting any changed source.
          if ! cmp ../packages/environment/src/Ps/Environment/StandardFloatConversionsData.lean ../dist/pscv0-f3-conversions/FloatConversionsCandidate.lean; then
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          old = Path('../packages/environment/src/Ps/Environment/StandardFloatConversionsData.lean').read_text()
          new = Path('../dist/pscv0-f3-conversions/FloatConversionsCandidate.lean').read_text()
          marker = 'def psStandardFloatConversionsBoundary : List PsName :='
          def split(source):
              before, rest = source.split(marker, 1)
              boundary, after = rest.split('\n\n', 1)
              return before, boundary, after
          a, b = split(old), split(new)
          print('PSCV0_F3_ASSET_DIFF ' + json.dumps({'onlyBoundaryChanged': a[0] == b[0] and a[2] == b[2], 'bytes': len(new.encode()), 'sha256': hashlib.sha256(new.encode()).hexdigest()}))
          if a[0] == b[0] and a[2] == b[2]:
              print('PSCV0_F3_BOUNDARY_CANDIDATE ' + json.dumps(b[1]))
          PY
            exit 1
          fi
          sha256sum ../dist/pscv0-f3-conversions/FloatConversionsCandidate.lean | tee ../dist/pscv0-f3-conversions/conversions.sha256
      - name: Review native F4 display and cross-width dependency closure
        run: |
          set -euo pipefail
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          lake env env LEAN_PATH="$PWD/.lake/build/lib/lean:$BASE_LEAN_PATH" .lake/build/bin/pscv0_native --export-float-display-candidate ../dist/pscv0-f3-conversions/FloatDisplayCandidate.lean | tee ../dist/pscv0-f3-conversions/display.log | grep -v '^PSCV0_STANDARD_SOURCE '
          cmp ../packages/environment/src/Ps/Environment/StandardFloatDisplayData.lean ../dist/pscv0-f3-conversions/FloatDisplayCandidate.lean
          sha256sum ../dist/pscv0-f3-conversions/FloatDisplayCandidate.lean
      - name: Review abstract platform-word dependency closure
        run: |
          set -euo pipefail
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          lake env env LEAN_PATH="$PWD/.lake/build/lib/lean:$BASE_LEAN_PATH" .lake/build/bin/pscv0_native --export-platform-words-candidate ../dist/pscv0-f3-conversions/PlatformWordsCandidate.lean | tee ../dist/pscv0-f3-conversions/platform-words.log | grep -v '^PSCV0_STANDARD_SOURCE '
          cmp ../packages/environment/src/Ps/Environment/StandardPlatformWordsData.lean ../dist/pscv0-f3-conversions/PlatformWordsCandidate.lean
          sha256sum ../dist/pscv0-f3-conversions/PlatformWordsCandidate.lean
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always()
        with:
          path: |
            psc0/.lake
            psc0/v7-native/.lake
          key: pscv0-f3-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pscv0-f3-conversions-${{ github.sha }}
          path: psc0/dist/pscv0-f3-conversions/
          if-no-files-found: warn
          retention-days: 30
