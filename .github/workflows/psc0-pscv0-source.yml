name: PSC0 PSCV0 portable bridge native source check
on:
  push:
    branches: [psc0/pscv0-readable-selfhost-v1, psc0/pscv0-v7-sole-source-policy-v1]
    paths:
      - 'psc0/packages/syntax/src/Ps/Syntax/Pscv0/**'
      - 'psc0/scripts/Pscv0BridgeSourceSmoke.lean'
      - '.github/workflows/psc0-pscv0-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc0-pscv0-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: psc0
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            psc0/packages/syntax
            psc0/packages/foundation
            psc0/scripts
            psc0/PSCV0_LANGUAGE_REFERENCE.md
            psc0/docs/PSCV0_REFERENCE_ADOPTION.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Refuse missing or changed PSCV0 v7 reference before any Lean build
        run: node scripts/pscv0-reference-identity.mjs
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build only existing syntax and foundation dependencies
        run: |
          mkdir -p dist/pscv0-source-check
          lean --version | tee dist/pscv0-source-check/lean-version.txt
          grep -F '4.34.0' dist/pscv0-source-check/lean-version.txt
          lake build PsSyntax PsFoundation | tee dist/pscv0-source-check/dependencies.txt
      - name: Native type-check all new portable source modules
        run: |
          mkdir -p .lake/build/lib/lean/Ps/Syntax/Pscv0
          for MODULE in Surface Read Commands TypePrint Module; do
            lake env lean -o ".lake/build/lib/lean/Ps/Syntax/Pscv0/$MODULE.olean" "packages/syntax/src/Ps/Syntax/Pscv0/$MODULE.lean" | tee "dist/pscv0-source-check/$MODULE.txt"
          done
          git rev-parse HEAD > dist/pscv0-source-check/commit.txt
          sha256sum packages/syntax/src/Ps/Syntax/Pscv0/*.lean > dist/pscv0-source-check/source-sha256.txt
      - name: Fast native round trips and negative source cases
        run: lake env lean --run scripts/Pscv0BridgeSourceSmoke.lean | tee dist/pscv0-source-check/surface-smoke.txt
      - name: Check the actual emitted readable and lowered fixture functions
        run: lake env lean dist/pscv0-source-check/correspondence.lean | tee dist/pscv0-source-check/correspondence.txt
      - name: Retain source validation, distinct from generated compiler behavior
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pscv0-native-source-${{ github.sha }}
          path: psc0/dist/pscv0-source-check/
          if-no-files-found: warn
          retention-days: 30
