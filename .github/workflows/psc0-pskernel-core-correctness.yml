name: PSC0 PSKernel semantic foundation audit
on:
  push:
    branches: [psc0/pskernel-core-lean435-arena-v1]
    paths: [".github/workflows/psc0-pskernel-core-correctness.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc0-kernel-correctness-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and uv
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check semantic model, concrete sort inference, axiom audit, and companion proofs
        working-directory: psc0/packages/pskernel-core
        run: |
          set -euo pipefail
          test "$(lean --githash)" = c29b6dda4f7c20e3eeaa717c4e565663c5cfa364
          npm run test:proofs

