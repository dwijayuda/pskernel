name: PSC0 PSKernel reference Int64 baseline diagnostic
on:
  push:
    branches: [psc0/pskernel-core-lean435-arena-v1]
    paths: [".github/workflows/psc0-pskernel-core-int64-diagnostic.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc0-kernel-int64-diagnostic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  int64_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5e3fa749d18441d7d35d1be9555c93cad78974cb
          path: baseline
      - name: Install exact Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build checkpoint and candidate
        run: |
          set -euo pipefail
          (cd baseline/psc0/packages/pskernel-core && test "$(lean --githash)" = c29b6dda4f7c20e3eeaa717c4e565663c5cfa364 && lake build psc_kernel_core_arena)
          (cd psc0/packages/pskernel-core && test "$(lean --githash)" = c29b6dda4f7c20e3eeaa717c4e565663c5cfa364 && lake build psc_kernel_core_arena)
      - name: Compare reference Int64 with identical input and budget
        run: |
          set -euo pipefail
          mkdir -p int64-comparison
          git clone https://github.com/leanprover/lean4export.git exporter
          git -C exporter checkout 05d43a2bc773b40ecfdebb32294192a5ef756951
          (cd exporter && lake build)
          (cd exporter && lake env .lake/build/bin/lean4export Init -- Int64.toBitVec_div) > int64-comparison/int64.ndjson
          sha256sum int64-comparison/int64.ndjson
          printf 'revision\tsha\texit_code\n' > int64-comparison/results.tsv
          for revision in baseline candidate; do
            if test "$revision" = baseline; then
              binary=baseline/psc0/packages/pskernel-core/.lake/build/bin/psc_kernel_core_arena
              sha=5e3fa749d18441d7d35d1be9555c93cad78974cb
            else
              binary=psc0/packages/pskernel-core/.lake/build/bin/psc_kernel_core_arena
              sha="${{ github.sha }}"
            fi
            sha256sum "$binary"
            set +e
            /usr/bin/time -v -o "int64-comparison/$revision.time" timeout 180 "$binary" --reference < int64-comparison/int64.ndjson > "int64-comparison/$revision.stdout" 2> "int64-comparison/$revision.stderr"
            code=$?
            set -e
            printf '%s\t%s\t%s\n' "$revision" "$sha" "$code" | tee -a int64-comparison/results.tsv
            cat "int64-comparison/$revision.time" "int64-comparison/$revision.stdout" "int64-comparison/$revision.stderr"
            if test "$code" != 0 && test "$code" != 124; then exit "$code"; fi
          done
          echo 'PSKERNEL_INT64_BASELINE: diagnostic complete; exit 124 means unresolved, not passed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int64-reference-baseline-comparison
          path: int64-comparison
