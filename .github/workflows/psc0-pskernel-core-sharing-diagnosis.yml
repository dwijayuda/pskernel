name: PSC0 shared syntax diagnosis
on:
  push:
    branches: [psc0/pskernel-core-lean435-arena-v1]
    paths: [".github/workflows/psc0-pskernel-core-sharing-diagnosis.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pinned Lean and debugger
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y gdb
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: pskernel-435-binary
          path: kernel
          run-id: 37997784610
          github-token: ${{ github.token }}
      - name: Sample full Init traversal for 180 seconds
        shell: bash
        run: |
          set -euo pipefail
          echo "BINARY_SOURCE_SHA=de1ad1993286d642575cf35b4842b6633501a634"
          chmod +x kernel/psc_kernel_core_arena
          sha256sum kernel/psc_kernel_core_arena
          echo "0ebf115bc270cb30003afd887e0bfab7b7174f5240374c07555e45a49b3a15c9  kernel/psc_kernel_core_arena" | sha256sum -c -
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc
          cd arena
          uv run lka.py build-test init --cache
          ulimit -s 65536
          set +e
          /usr/bin/time -v timeout 180 ../kernel/psc_kernel_core_arena --profile-historical < _build/tests/init.ndjson > profile.stdout 2> profile.log &
          timer=$!
          for sample in $(seq 1 11); do
            sleep 15
            limiter=$(pgrep -P "$timer" | head -n 1)
            if test -z "$limiter"; then break; fi
            checker=$(pgrep -P "$limiter" | head -n 1)
            if test -z "$checker"; then break; fi
            echo "STACK_SAMPLE=$sample" >> profile.stacks
            timeout 10 sudo gdb -q -n -batch -ex 'set pagination off' -ex 'set print frame-arguments none' -ex 'thread apply all bt 32' -ex detach -p "$checker" >> profile.stacks 2>&1
          done
          wait "$timer"
          code=$?
          set -e
          echo "DIAGNOSTIC_INIT_EXIT=$code"
          tail -n 45 profile.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          rows = []
          for line in Path("profile.log").read_text().splitlines():
              m = re.search(r"elapsed_ms=(\d+)", line)
              if m:
                  rows.append((int(m[1]), line))
          print("TOP_SLOW_DECLARATIONS")
          for _, line in sorted(rows, reverse=True)[:20]:
              print(line)
          PY
          if test -f profile.stacks; then cat profile.stacks; fi
          printf '%s\n' "$code" > profile.exit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-syntax-worker-samples
          path: |
            arena/profile.*

  controlled-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pinned Lean and uv
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: pskernel-435-binary
          path: baseline
          run-id: 37990758789
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: pskernel-435-binary
          path: candidate
          run-id: 37997784610
          github-token: ${{ github.token }}
      - name: Compare exact binaries on the same pinned prefix and runner
        shell: bash
        run: |
          set -euo pipefail
          echo "9490526abc27b5a5e57f931613b027d1deeb72ae22787f5bf4189265f389660f  baseline/psc_kernel_core_arena" | sha256sum -c -
          echo "0ebf115bc270cb30003afd887e0bfab7b7174f5240374c07555e45a49b3a15c9  candidate/psc_kernel_core_arena" | sha256sum -c -
          chmod +x baseline/psc_kernel_core_arena candidate/psc_kernel_core_arena
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc
          cd arena
          uv run lka.py build-test init --cache
          head -n 500000 _build/tests/init.ndjson > prefix.ndjson
          sha256sum prefix.ndjson
          echo "DIAGNOSTIC_ONLY=500000-record historical Init prefix; not full conformance"
          ulimit -s 65536
          for item in baseline-1 candidate-1 candidate-2 baseline-2; do
            version=${item%-*}
            set +e
            /usr/bin/time -v timeout 180 "../$version/psc_kernel_core_arena" --check-historical < prefix.ndjson > "$item.stdout" 2> "$item.log"
            code=$?
            set -e
            echo "CONTROLLED_PREFIX version=$item exit=$code"
            cat "$item.stdout"
            tail -n 30 "$item.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-sharing-prefix
          path: |
            arena/baseline-*.log
            arena/baseline-*.stdout
            arena/candidate-*.log
            arena/candidate-*.stdout
