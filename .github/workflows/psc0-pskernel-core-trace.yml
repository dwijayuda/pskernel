name: PSC0 kernel scoped-cache experiment
on:
  push:
    branches: [psc0/pskernel-core-lean435-arena-v1]
    paths: [".github/workflows/psc0-pskernel-core-trace.yml"]
permissions:
  contents: read
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        budget: [256, 4096]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad13026571931c0151b7ae53f468cd5363bef391
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build temporary open-term cache experiment
        working-directory: psc0/packages/pskernel-core
        shell: bash
        env:
          CACHE_BUDGET: ${{ matrix.budget }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean")
          s = p.read_text()
          old = "  | PsKernelExpr.fvar _, Nat.succ _ =>\n      Option.none\n"
          assert s.count(old) == 1
          s = s.replace(old, "")
          s = s.replace("  256\n", "  " + os.environ["CACHE_BUDGET"] + "\n")
          p.write_text(s)
          PY
          lake build psc_kernel_core_arena
      - name: Measure focused Int64 closure for 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean4export.git exporter
          git -C exporter checkout 05d43a2bc773b40ecfdebb32294192a5ef756951
          cd exporter
          lake build
          lake env .lake/build/bin/lean4export Init -- Int64.toBitVec_div > int64.ndjson
          ulimit -s 65536
          set +e
          /usr/bin/time -v timeout 60 ../psc0/packages/pskernel-core/.lake/build/bin/psc_kernel_core_arena --profile < int64.ndjson > trace.stdout 2> trace.log
          code=$?
          set -e
          echo "DIAGNOSTIC_ONLY_EXIT=$code"
          echo "RECENT_DECLARATIONS"
          grep 'arena-profile enter' trace.log | tail -n 6
          tail -n 24 trace.log
          cat trace.stdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int64-open-cache-${{ matrix.budget }}
          path: exporter/trace.*
