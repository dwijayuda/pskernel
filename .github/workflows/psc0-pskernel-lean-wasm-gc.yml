name: PSC0 v7.2 Wasm-GC kernel source rebuild (Linux)

on:
  push:
    branches:
      - feature/psc0-v72-pskernel-lean-wasm-gc-v1
    paths:
      - 'psc0/packages/pskernel-lean-wasm/**'
      - 'psc0/pskernel-lean-wasm-gc-project.json'
      - '.github/workflows/psc0-pskernel-lean-wasm-gc.yml'
      - 'psc0/packages/**/src/**'
      - 'psc0/host/src/**'
      - 'psc0/v7-native/**'
      - 'psc0/scripts/check-workspace.mjs'
      - 'psc0/scripts/npm-distribution.mjs'
      - 'psc0/packages/proofscript/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psc0-v72-wasm-gc-kernel-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wasm-gc-source:
    name: Real GC module and fail-closed non-checker API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout: |
            psc0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Source closure, Lean 4.35 / v7.2 identity, and mandatory refusal API
        working-directory: psc0
        shell: bash
        run: |
          set -euo pipefail
          node packages/pskernel-lean-wasm/scripts/verify-source.mjs
          node packages/pskernel-lean-wasm/scripts/test.mjs
          # Full historical PSC0 workspace validator is not scoped to compiler-only
          # branches (backend-ecma is source-only and has no package.json).
          # Targeted source/contract checks above run without false failures.
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/v7-native
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build native PSC0 v7.2 compiler at exact Lean 4.35.0 pin
        working-directory: psc0/v7-native
        shell: bash
        run: |
          set -euo pipefail
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build pscv0_native
      - name: Check source with official Lean kernel and emit real Wasm GC
        working-directory: psc0
        shell: bash
        run: |
          set -euo pipefail
          input=packages/pskernel-lean-wasm/src/PsKernelLeanWasmGc/Probe.lean
          output=packages/pskernel-lean-wasm/dist/gc-probe
          mkdir -p packages/pskernel-lean-wasm/dist
          v7-native/.lake/build/bin/pscv0_native --check "$input"
          v7-native/.lake/build/bin/pscv0_native --emit-wasm-core "$input" "$output"
          test -s "${output}.core.wasm"
          test -s "${output}.core.wat"
          test -s "${output}.wasm.origins.json"
      - name: Wasm-GC binary validation and runtime semantics (not kernel checking)
        working-directory: psc0
        shell: bash
        run: |
          set -euo pipefail
          node packages/pskernel-lean-wasm/scripts/test-probe.mjs
      - name: Reuse live PSC0 Core expression source in a GC-native project
        working-directory: psc0
        shell: bash
        run: |
          set -euo pipefail
          project=pskernel-lean-wasm-gc-project.json
          stem=packages/pskernel-lean-wasm/dist/shared-core
          v7-native/.lake/build/bin/pscv0_native --audit-project-graph "$project"
          v7-native/.lake/build/bin/pscv0_native --check-project "$project"
          v7-native/.lake/build/bin/pscv0_native --emit-project-wasm-core "$project" "$stem"
          test -s "${stem}.core.wasm"
          test -s "${stem}.core.wat"
          node packages/pskernel-lean-wasm/scripts/test-source-closure.mjs
      - name: Stage and verify byte-identical checked GC probe
        working-directory: psc0
        shell: bash
        run: |
          set -euo pipefail
          node packages/pskernel-lean-wasm/scripts/stage-prebuilt.mjs
          node packages/pskernel-lean-wasm/scripts/verify-prebuilt.mjs
      - name: Retain probe binaries for provenance, NOT VSIX publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: psc0-wasm-gc-probe-NOT-a-kernel
          path: psc0/packages/pskernel-lean-wasm/dist/
          if-no-files-found: error
      - name: Commit exact compiled Wasm GC probe to this feature branch (not checker)
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/psc0-v72-pskernel-lean-wasm-gc-v1'
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- psc0/packages/pskernel-lean-wasm/wasm/ psc0/packages/pskernel-lean-wasm/PREBUILT_GC_PROBE_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'PSC0_WASM_GC_PROBE_COMMIT: already byte-identical'
          else
            git commit -m 'build(psc0): store CI-checked compiled Wasm-GC probe [skip ci]'
            git push origin "HEAD:refs/heads/$branch"
          fi
