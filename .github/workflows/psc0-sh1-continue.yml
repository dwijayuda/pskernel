name: PSC0 exact-source SH1 continuation

# This workflow continues the existing fixed-point command at the immutable
# source checkout below. Its own commit is orchestration identity, not a new
# compiled source. The predecessor remains cancelled; its N1/C1 evidence is
# imported only after run/job/archive/raw-file authentication.
on:
  push:
    branches: ['psc0/strict-sh1-v1']
    paths: ['.github/workflows/psc0-sh1-continue.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: psc0-sh1-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      qualified: ${{ steps.qualify.outcome == 'success' && steps.evidence.outcome == 'success' }}
    defaults:
      run:
        working-directory: psc0
    steps:
      - name: Check out the exact previously compiled source
        uses: actions/checkout@v4
        with:
          ref: 1fa5559a72b293defc56ef7e7020cf82d4b44b79
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Authenticate the cancelled run and restore its completed N1 and C1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const expected = {"sourceRef":"1fa5559a72b293defc56ef7e7020cf82d4b44b79","sourceRoot":"/home/runner/work/pskernel/pskernel/psc0","runId":38015134511,"runAttempt":1,"workflowId":378853677,"compilerJobId":114103608774,"providerJobId":114120597914,"artifactId":11658430459,"artifactName":"psc0-sh1-ts7.0.2-1fa5559a72b293defc56ef7e7020cf82d4b44b79","archiveSha256":"6ee7b3da60346bec004665d9bb2276ceb680a1a3d882d0aeb397398a9e1c1812","archiveBytes":5147944,"archiveFileCount":344,"recipeSha256":"a631bcaf914c0913f696eaf8a138a44449c46957f5a2d7736ec9cff8bcb63eba","sourceClosureSha256":"46737f1e58a56cfa4cc0b575d30f531efe1dbe06ccf34002cc01e553febb1fb5","N1":{"receiptSha256":"6768f5d50c376b50c6138aeacffe03553c9f860b17da965ea92acd3a36126404","receiptBytes":15827,"artifacts":{"javascriptSha256":"6cddc3c34c38f1524ef9a355c46b0eb17949c45c54fd59367ea370c1af861ab3","typescriptSha256":"595cd338505f7012b8f0a813a78a1ecbafe863e6ea715b9861db35333d5a254c"}},"C1":{"receiptSha256":"33fa94c5f4f825133be4c07f47e8f68d447546eb8a2858193d16b305afbd9d8f","receiptBytes":169531,"artifacts":{"canonicalSurfaceSourceSha256":"240a3e7072441f14a9ad7070e5c3b8306b42d97ef5932be59f2c458d1816a98e","normalizedCanonicalAdmissionsSha256":"24b90a6cb748b9deb4f0340760e9ca50b358013dcf9d8be16e1143712465db52","typescriptSha256":"1c9ece3424bdb7c173c805450df10e7ec4fb1e1bc46945abdb6bef04ea4d0eba","javascriptSha256":"91f69e62d33bb5f670c5e9a56479280f97ebf15a60d2d9e6155ecb8ec33d49d5"}},"completedC2":{"receiptSha256":"a8ef189ac86d63174b8875f5d4912622b677a9a5a7a60da206066d880663b894","receiptBytes":166700,"artifacts":{"canonicalSurfaceSourceSha256":"240a3e7072441f14a9ad7070e5c3b8306b42d97ef5932be59f2c458d1816a98e","normalizedCanonicalAdmissionsSha256":"e77c40ccd38fc3ea6a2d3342732f23b54665d066aeeda38533d04ff54aeeb020","typescriptSha256":"595cd338505f7012b8f0a813a78a1ecbafe863e6ea715b9861db35333d5a254c","javascriptSha256":"6cddc3c34c38f1524ef9a355c46b0eb17949c45c54fd59367ea370c1af861ab3"}},"toolchain":{"node":"v22.23.3","platform":"linux","architecture":"x64","lean":"Lean (version 4.34.0, x86_64-unknown-linux-gnu, commit 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b, Release)","leanGitHash":"293d5d0c0c3f3dded4688b3ccd6a33939ac5102b","typescript":"Version 7.0.2"},"typescriptProfile":{"version":"7.0.2","purpose":"current-emission","arguments":["--ignoreConfig"]},"qualifierSha256":"707fedd63f01999293cf68b39f85ea6526c31216e84c2090d6ff1b8edf6fecdb","binderSha256":"bd18cbb77c80fb57038b7d270e468c5b029164095dad958a84c52d113d67b049","predecessorLog":{"blob":"67147f3e76511cf3a918923dcfed8743636cc86b","sha256":"be97e58b8dd3e4fde7b7f89686107624460b6416cc74a72b718dfde031c82e4d","bytes":1917726}};
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const root = process.cwd();
          assert.equal(root, expected.sourceRoot, 'preserve authenticated native receipt absolute path');
          assert.equal(process.version, 'v22.23.3');
          assert.equal(execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim(), expected.sourceRef);
          assert.equal(hash(await readFile('scripts/sh1-qualify.mjs')), expected.qualifierSha256);
          assert.equal(hash(await readFile('scripts/sh1-strict-evidence.mjs')), expected.binderSha256);
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const base = 'https://api.github.com/repos/dwijayuda/pskernel';
          async function api(suffix) {
            const response = await fetch(base + suffix, {headers});
            assert.equal(response.status, 200, 'GitHub metadata ' + suffix);
            return response.json();
          }
          const [run, job, providerJob, metadata] = await Promise.all([
            api('/actions/runs/' + expected.runId),
            api('/actions/jobs/' + expected.compilerJobId),
            api('/actions/jobs/' + expected.providerJobId),
            api('/actions/artifacts/' + expected.artifactId),
          ]);
          assert.equal(run.id, expected.runId);
          assert.equal(run.workflow_id, expected.workflowId);
          assert.equal(run.head_sha, expected.sourceRef);
          assert.equal(run.run_attempt, expected.runAttempt);
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'cancelled');
          assert.equal(job.id, expected.compilerJobId);
          assert.equal(job.run_id, expected.runId);
          assert.equal(job.head_sha, expected.sourceRef);
          assert.equal(job.run_attempt, expected.runAttempt);
          assert.equal(job.status, 'completed');
          assert.equal(job.conclusion, 'cancelled');
          for (const number of [18,19,20,21,22,23,24,25,26,30]) {
            const step = job.steps.find(s => s.number === number);
            assert(step, 'predecessor required step ' + number);
            assert.equal(step.conclusion, 'success', step.name);
          }
          assert.equal(job.steps.find(s => s.number === 27).conclusion, 'cancelled');
          assert.equal(providerJob.id, expected.providerJobId);
          assert.equal(providerJob.run_id, expected.runId);
          assert.equal(providerJob.head_sha, expected.sourceRef);
          assert.equal(providerJob.run_attempt, expected.runAttempt);
          assert.equal(providerJob.status, 'completed');
          assert.equal(providerJob.conclusion, 'skipped');
          assert.equal(metadata.id, expected.artifactId);
          assert.equal(metadata.name, expected.artifactName);
          assert.equal(metadata.expired, false);
          assert.equal(metadata.size_in_bytes, expected.archiveBytes);
          assert.equal(metadata.digest, 'sha256:' + expected.archiveSha256);
          assert.equal(metadata.workflow_run.id, expected.runId);
          assert.equal(metadata.workflow_run.head_sha, expected.sourceRef);
          const response = await fetch(base + '/actions/artifacts/' + expected.artifactId + '/zip', {headers});
          assert.equal(response.status, 200, 'authenticated predecessor artifact download');
          const archive = Buffer.from(await response.arrayBuffer());
          assert.equal(archive.length, expected.archiveBytes);
          assert.equal(hash(archive), expected.archiveSha256);
          const evidenceDir = path.join(root, 'dist/sh1-continuation-inputs');
          await mkdir(evidenceDir, {recursive:true});
          const zipPath = path.join(evidenceDir, 'predecessor-verified.zip');
          await writeFile(zipPath, archive);
          const listing = execFileSync('unzip', ['-Z','-1',zipPath], {encoding:'utf8',maxBuffer:4*1024*1024});
          const entries = listing.split(/\r?\n/u).filter(Boolean);
          assert.equal(new Set(entries).size, entries.length, 'unique archive names');
          assert(entries.every(name => !name.startsWith('/') && !name.includes('\\') &&
            name.split('/').every(part => part !== '..' && part !== '.') &&
            path.posix.normalize(name) === name), 'safe exact archive names');
          const names = entries.filter(name => !name.endsWith('/'));
          assert.equal(names.length, expected.archiveFileCount);
          const allowedRoots = ['dist/sh1/', '.selfhost-seeds/', 'dist/sh1-native-seed-recovery/',
            'dist/sh1-seed-selection/', 'dist/typescript-profile/'];
          assert(names.every(name => allowedRoots.some(prefix => name.startsWith(prefix))), 'artifact output directories only');
          assert(!names.includes('dist/sh1/qualification.json'), 'predecessor did not qualify');
          assert(!names.includes('dist/sh1/strict-enforcement-evidence.json'), 'predecessor binder did not run');
          assert(!names.includes('dist/sh1/C3/receipt.json'), 'predecessor C3 incomplete');
          const archiveFiles = [];
          const rawFiles = new Map();
          for (const name of names) {
            const bytes = execFileSync('unzip', ['-p',zipPath,name], {maxBuffer:128*1024*1024});
            const envelope = {path:name,sha256:hash(bytes),bytes:bytes.length};
            archiveFiles.push(envelope);
            rawFiles.set(name, bytes);
          }
          function exactReceipt(name, pin) {
            const bytes = rawFiles.get(name); assert(bytes, name);
            assert.equal(hash(bytes), pin.receiptSha256, name + ' exact raw receipt hash');
            assert.equal(bytes.length, pin.receiptBytes, name + ' exact raw receipt bytes');
            const value = JSON.parse(bytes.toString('utf8'));
            assert.equal(value.sourceRef, expected.sourceRef);
            assert.equal(value.sourceClosureSha256, expected.sourceClosureSha256);
            assert.equal(value.recipe.sha256, expected.recipeSha256);
            assert.equal(hash(JSON.stringify(value.recipe.files)), expected.recipeSha256);
            assert.deepEqual(value.toolchain, expected.toolchain);
            assert.deepEqual(value.typescriptProfile, expected.typescriptProfile);
            assert.deepEqual(value.artifacts, pin.artifacts);
            return value;
          }
          const native = exactReceipt('dist/sh1/development/N1/receipt.json', expected.N1);
          const candidate = exactReceipt('dist/sh1/C1/receipt.json', expected.C1);
          const completedC2 = exactReceipt('dist/sh1/C2/receipt.json', expected.completedC2);
          assert.equal(native.evidence, 'native-seeded-generated-compiler-candidate');
          assert.equal(candidate.evidence, 'candidate-build');
          assert.equal(completedC2.evidence, 'candidate-build');
          for (const [directory,pin] of [['development/N1',expected.N1],['C1',expected.C1],['C2',expected.completedC2]]) {
            for (const [file,key] of [['index.js','javascriptSha256'],['index.ts','typescriptSha256'],
              ...('canonicalSurfaceSourceSha256' in pin.artifacts ? [
                ['canonical-source.json','canonicalSurfaceSourceSha256'],['admissions.json','normalizedCanonicalAdmissionsSha256']] : [])]) {
              const bytes = rawFiles.get('dist/sh1/' + directory + '/' + file); assert(bytes, directory + '/' + file);
              assert.equal(hash(bytes), pin.artifacts[key], directory + '/' + file);
            }
          }
          for (const file of candidate.recipe.files) assert.equal(hash(await readFile(file.path)), file.sha256, 'current recipe ' + file.path);
          const nativeIr = JSON.parse(rawFiles.get('dist/sh1/development/N1/ir-checker-native/receipt.json').toString('utf8'));
          assert.equal(path.resolve(nativeIr.nativeSourceReceipt), path.join(root,'dist/sh1/development/N1/strict-source-native.json'));
          const importedFiles = [];
          const omittedFiles = [];
          for (const envelope of archiveFiles) {
            const name = envelope.path;
            if (name.startsWith('dist/sh1/C2/') || name.startsWith('dist/sh1/C3/') ||
                name === 'dist/sh1/resource-policy-fixed-point.json') {
              omittedFiles.push(envelope);
              continue;
            }
            const destination = path.join(root,name);
            await mkdir(path.dirname(destination), {recursive:true});
            await writeFile(destination,rawFiles.get(name));
            assert.equal(hash(await readFile(destination)), envelope.sha256);
            importedFiles.push(envelope);
          }
          const report = {
            schemaVersion:1, kind:'psc0-authenticated-fixed-point-continuation-inputs',
            sourceRef:expected.sourceRef, orchestrationHeadSha:process.env.GITHUB_SHA,
            orchestrationWorkflowRef:process.env.GITHUB_WORKFLOW_REF,
            orchestrationWorkflowSha:process.env.GITHUB_WORKFLOW_SHA,
            orchestrationRunId:Number(process.env.GITHUB_RUN_ID),
            orchestrationRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            expected, predecessorRun:run, predecessorCompilerJob:job, predecessorProviderJob:providerJob,
            artifactMetadata:metadata, archiveDigestVerified:true,
            archiveEntryCount:entries.length, archiveFileCount:names.length,
            archiveFiles, importedFiles, omittedFiles,
            reusedGenerations:['N1','C1'], regeneratedGenerations:['C2','C3'],
            predecessorC2Complete:true, predecessorC3Complete:false,
            reusedNativeAndCandidateSteps:job.steps.filter(s=>[18,19,20,21,22,23,24,25,26].includes(s.number)),
            currentSourceAndAll48RecipeInputsUnchanged:true,
            preservedAbsoluteSourceRoot:root, compilerExecutedByThisImport:false,
            strictSh1Qualified:false, semanticContractQualified:false, providerChecked:false,
          };
          const reportText = JSON.stringify(report,null,2)+'\n';
          await writeFile(path.join(evidenceDir,'inputs.json'), reportText);
          console.log('PSC0_SH1_CONTINUATION_INPUTS: '+JSON.stringify({path:'dist/sh1-continuation-inputs/inputs.json',
            sha256:hash(reportText),bytes:Buffer.byteLength(reportText),value:report}));
          NODE
      - name: Install the pinned current TypeScript 7 profile
        id: typescript
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-typescript-7.0.2" --ignore-scripts --save-exact --no-audit --no-fund typescript@7.0.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, copyFileSync, mkdirSync, readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          const require = createRequire(import.meta.url);
          const directory = path.resolve('dist/typescript-profile/continuation-install');
          mkdirSync(directory, { recursive: true });
          const version = '7.0.2';
          const prefix = path.join(process.env.RUNNER_TEMP, 'psc0-typescript-' + version);
          const manifestPath = require.resolve('typescript/package.json', { paths: [prefix] });
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          assert.equal(manifest.name, 'typescript');
          assert.equal(manifest.version, version);
          const bin = typeof manifest.bin === 'string' ? manifest.bin : manifest.bin?.tsc;
          assert.equal(typeof bin, 'string', 'PSC0_TYPESCRIPT_BIN_METADATA');
          const launcher = realpathSync(path.resolve(path.dirname(manifestPath), bin));
          const result = spawnSync(process.execPath, [launcher, '--version'], { encoding: 'utf8' });
          assert.equal(result.status, 0, result.stderr);
          assert.equal(result.stdout.trim(), 'Version ' + version);
          appendFileSync(process.env.GITHUB_OUTPUT, 'current-cli=' + launcher + '\n');
          copyFileSync(path.join(prefix, 'package-lock.json'), path.join(directory, 'current-package-lock.json'));
          copyFileSync(manifestPath, path.join(directory, 'current-package.json'));
          appendFileSync(process.env.GITHUB_ENV, 'PSC0_TSC=' + launcher + '\nPSC0_TYPESCRIPT_VERSION=' + version + '\n');
