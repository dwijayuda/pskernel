        run: node scripts/check-typescript-profile.mjs --out dist/typescript-profile/continuation-contract
      - name: Run the existing exact-source fixed-point command
        id: qualify
        run: node --max-old-space-size=8192 scripts/sh1-qualify.mjs fixed-point --out dist/sh1
      - name: Retain complete file envelopes and exact returned JSON for final disposition
