              assert.deepEqual(qualification.artifacts,expected.C2.artifacts);
              assert.equal(qualification.strictSh1Qualified,false);
              assert.equal(qualification.semanticContractQualified,false);
              assert.deepEqual(qualification.provider,{status:'not-attempted',kernelChecked:false});
              const {report,sha256,...embedded}=qualification.strictEnforcementEvidence;
              assert.equal(report,'strict-enforcement-evidence.json');
              assert.equal(sha256,files.find(entry=>entry.path===report).sha256);
              assert.deepEqual(embedded,binder);
            });
          }
          check('source closure',()=>assert.equal(hash(JSON.stringify(closureManifest)),expected.sourceClosureSha256));
          check('original generation recipe',()=>{
            assert.equal(recipe.files.length,48);
            assert.equal(hash(JSON.stringify(recipe.files)),expected.recipeSha256);
            assert.deepEqual(recipe.files,inputs.recipeFiles);
          });
          if(recipe?.files) for(const file of recipe.files) {
            try { assert.equal(hash(await readFile(file.path)),file.sha256); }
            catch(error) { failures.push({label:'generation recipe '+file.path,message:String(error.message)}); }
          }
          async function supplement(sourcePath) {
            const bytes=await readFile(sourcePath);
            const envelope={path:path.relative('dist/sh1',sourcePath).split(path.sep).join('/'),
              sourcePath,sha256:hash(bytes),bytes:bytes.length};
            supplementalFiles.push(envelope);
            return envelope;
          }
          async function walk(directory) {
            const entries=await readdir(directory,{withFileTypes:true});
            for(const entry of entries.sort((a,b)=>a.name.localeCompare(b.name))) {
              const name=path.join(directory,entry.name);
              if(entry.isDirectory()) await walk(name);
              else { assert(entry.isFile(),'regular profile file'); await supplement(name); }
            }
          }
          try { await walk('dist/typescript-profile'); }
          catch(error) { failures.push({label:'TypeScript profile evidence',message:String(error.message)}); }
          await supplement(inputPath);
          let completionFile=null,completionValue=null;
          try {
            completionFile=await supplement('dist/sh1/evidence-completion.json');
            completionValue=JSON.parse(await readFile('dist/sh1/evidence-completion.json','utf8'));
            check('completion provenance',()=>{
              assert.equal(completionValue.kind,'psc0-authenticated-retained-fixed-point-evidence-completion');
              assert.equal(completionValue.status,'evidence-completed');
              assert.equal(completionValue.compiledSourceRef,expected.sourceRef);
              assert.deepEqual(completionValue.evidenceProducer,inputs.evidenceProducer);
              assert.deepEqual(completionValue.generationOwnership,inputs.generationOwnership);
              assert.equal(completionValue.inputManifest.sha256,hash(inputRaw));
              assert.equal(completionValue.preservedInputs.catalogSha256,hash(JSON.stringify(inputs.importedFiles)));
              assert.equal(completionValue.preservedInputs.beforeAndAfterExact,true);
              assert.deepEqual(completionValue.compilerGenerationsRebuilt,[]);
              assert.deepEqual(completionValue.conformanceExecutionsRepeated,[]);
              for(const name of ['qualification.json','strict-enforcement-evidence.json','seed-selection.json']) {
                const actual=files.find(file=>file.path===name);
                const recorded=completionValue.outputs[name];
                assert.equal(recorded.path,'dist/sh1/'+name);
                assert.equal(recorded.sha256,actual.sha256);assert.equal(recorded.bytes,actual.bytes);
              }
            });
          } catch(error) {
            failures.push({label:'completion file',message:String(error.message)});
          }
          const complete=finishSucceeded&&failures.length===0&&missingFiles.length===0;
          const evidence={
            schemaVersion:1,kind:'psc0-exact-source-evidence-completion-inventory',
            status:complete?'complete':'partial',complete,finishOutcome:process.env.FINISH_OUTCOME,
            sourceRef:expected.sourceRef,orchestrationHeadSha:process.env.GITHUB_SHA,
            runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            predecessorRunId:expected.generationRun.runId,predecessorArtifactId:expected.generationRun.artifactId,
            predecessorArchiveSha256:expected.generationRun.archiveSha256,
            evidenceProducer:inputs.evidenceProducer,generationOwnership:inputs.generationOwnership,
            inputManifest:{path:inputPath,sha256:hash(inputRaw),bytes:inputRaw.length},
            completionFile,reusedGenerations:['N1','C1','C2','C3'],generatedThisCommand:[],
            importedEvidenceUnchanged:!failures.some(item=>item.label.startsWith('imported evidence')),
            files,supplementalFiles,sourceClosureManifest:closureManifest??null,recipe:recipe??null,
            missingFiles,validationErrors:failures,
            strictSh1Qualified:false,semanticContractQualified:false,providerChecked:false,
            compilerExecutedByThisInventory:false,
          };
          const evidenceText=JSON.stringify(evidence,null,2)+'\n';
          const evidencePath='dist/sh1-evidence-finish-inputs/evidence-inventory.json';
          await writeFile(evidencePath,evidenceText);
          console.log('PSC0_SH1_EVIDENCE_FINISH_INVENTORY: '+JSON.stringify({
            path:evidencePath,sha256:hash(evidenceText),bytes:Buffer.byteLength(evidenceText),value:evidence}));
          for(const entry of jsonValues) console.log('PSC0_SH1_RETURNED_JSON: '+JSON.stringify(entry));
          if(!complete) for(const name of ['development/N1/strict-source-native.json','C2/strict-source.json','C3/strict-source.json']) {
            try {
              const raw=await readFile(path.join('dist/sh1',name),'utf8');
              const value=JSON.parse(raw);
              const serialization=raw===JSON.stringify(value,null,2)+'\n' ? 'JSON.stringify(value, null, 2) + LF'
                : raw===JSON.stringify(value)+'\n' ? 'JSON.stringify(value) + LF' : null;
              console.log('PSC0_SH1_DIAGNOSTIC_JSON: '+JSON.stringify({path:name,sha256:hash(raw),
                bytes:Buffer.byteLength(raw),serialization,...(serialization===null?{content:raw}:{}),value}));
            } catch(error) { console.log('PSC0_SH1_DIAGNOSTIC_UNAVAILABLE: '+JSON.stringify({path:name,message:String(error.message)})); }
          }
          await appendFile(process.env.GITHUB_OUTPUT,'complete='+String(complete)+'\n');
          if(finishSucceeded) assert(complete,'PSC0_SH1_EVIDENCE_FINISH_INVENTORY_INCOMPLETE: '+JSON.stringify(failures));
          NODE
      - name: Retain completed evidence and all authenticated original inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-evidence-finish-ts7.0.2-${{ github.run_id }}
          path: |
            psc0/dist/sh1
            psc0/.selfhost-seeds
            psc0/dist/sh1-native-seed-recovery
            psc0/dist/sh1-seed-selection
            psc0/dist/typescript-profile
            psc0/dist/sh1-continuation-inputs
            psc0/dist/sh1-evidence-finish-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  kernel-admissions:
    needs: compiler
    if: ${{ needs.compiler.outputs.qualified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fa5559a72b293defc56ef7e7020cf82d4b44b79
      - name: Read the independently qualified native provider at its exact source revision
        uses: actions/checkout@v4
        with:
          ref: 963030dc2d154008fccc82e7c8ed29331f138799
          path: provider-source
          sparse-checkout: psc0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: provider-source/psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore pinned native provider build
        id: provider-cache
        uses: actions/cache/restore@v4
        with:
          path: provider-source/psc0/.lake/build
          key: psc0-sh1-provider-v1-${{ runner.os }}-${{ runner.arch }}-963030dc2d154008fccc82e7c8ed29331f138799
      - name: Build the existing provider target without editing its implementation
        working-directory: provider-source/psc0
        run: lake build psc_kernel_core_provider
      - name: Retain the pinned provider build
        if: ${{ steps.provider-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: provider-source/psc0/.lake/build
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
      - name: Read exact compiler qualification artifacts from this run
        uses: actions/download-artifact@v4
        with:
          name: psc0-sh1-evidence-finish-ts7.0.2-${{ github.run_id }}
          path: qualification-artifacts
      - name: Obtain actual provider decisions for the qualified admission streams
        working-directory: psc0
        run: node scripts/sh1-check-admissions.mjs --provider-root ../provider-source/psc0 --artifacts ../qualification-artifacts/dist/sh1
      - name: Retain provider acceptance or the exact rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-evidence-finish-kernel-ts7.0.2-${{ github.run_id }}
          path: qualification-artifacts/dist/sh1/kernel-admissions.json
          if-no-files-found: ignore
          retention-days: 30
