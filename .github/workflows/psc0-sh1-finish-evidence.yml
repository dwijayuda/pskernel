name: PSC0 retained-generation SH1 evidence finish

# Finish evidence for immutable source1fa from its already completed generations.
# The original N1/C1 run remains cancelled and C2/C3 run remains failed at binding.
# Authenticate both archives, every retained receipt, exact generation gate logs,
# and the separate corrected evidence producers before finalization and provider checks.
on:
  push:
    branches: ['psc0/strict-sh1-v1']
    paths: ['.github/workflows/psc0-sh1-finish-evidence.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: psc0-sh1-evidence-finish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      qualified: ${{ steps.finish.outcome == 'success' && steps.evidence.outputs.complete == 'true' }}
    defaults:
      run:
        working-directory: psc0
    steps:
      - name: Check out the exact previously compiled source
        uses: actions/checkout@v4
        with:
          ref: 1fa5559a72b293defc56ef7e7020cf82d4b44b79
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Authenticate completed generations and install the reviewed evidence producers
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile, appendFile } from 'node:fs/promises';
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const expected = {"sourceRef":"1fa5559a72b293defc56ef7e7020cf82d4b44b79","sourceRoot":"/home/runner/work/pskernel/pskernel/psc0","sourceClosureSha256":"46737f1e58a56cfa4cc0b575d30f531efe1dbe06ccf34002cc01e553febb1fb5","recipeSha256":"a631bcaf914c0913f696eaf8a138a44449c46957f5a2d7736ec9cff8bcb63eba","toolchain":{"node":"v22.23.3","platform":"linux","architecture":"x64","lean":"Lean (version 4.34.0, x86_64-unknown-linux-gnu, commit 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b, Release)","leanGitHash":"293d5d0c0c3f3dded4688b3ccd6a33939ac5102b","typescript":"Version 7.0.2"},"typescriptProfile":{"version":"7.0.2","purpose":"current-emission","arguments":["--ignoreConfig"]},"qualifierSha256":"707fedd63f01999293cf68b39f85ea6526c31216e84c2090d6ff1b8edf6fecdb","generationBinderSha256":"bd18cbb77c80fb57038b7d270e468c5b029164095dad958a84c52d113d67b049","prior":{"sourceRef":"1fa5559a72b293defc56ef7e7020cf82d4b44b79","sourceRoot":"/home/runner/work/pskernel/pskernel/psc0","runId":38015134511,"runAttempt":1,"workflowId":378853677,"compilerJobId":114103608774,"providerJobId":114120597914,"artifactId":11658430459,"artifactName":"psc0-sh1-ts7.0.2-1fa5559a72b293defc56ef7e7020cf82d4b44b79","archiveSha256":"6ee7b3da60346bec004665d9bb2276ceb680a1a3d882d0aeb397398a9e1c1812","archiveBytes":5147944,"archiveFileCount":344,"recipeSha256":"a631bcaf914c0913f696eaf8a138a44449c46957f5a2d7736ec9cff8bcb63eba","sourceClosureSha256":"46737f1e58a56cfa4cc0b575d30f531efe1dbe06ccf34002cc01e553febb1fb5","N1":{"receiptSha256":"6768f5d50c376b50c6138aeacffe03553c9f860b17da965ea92acd3a36126404","receiptBytes":15827,"artifacts":{"javascriptSha256":"6cddc3c34c38f1524ef9a355c46b0eb17949c45c54fd59367ea370c1af861ab3","typescriptSha256":"595cd338505f7012b8f0a813a78a1ecbafe863e6ea715b9861db35333d5a254c"}},"C1":{"receiptSha256":"33fa94c5f4f825133be4c07f47e8f68d447546eb8a2858193d16b305afbd9d8f","receiptBytes":169531,"artifacts":{"canonicalSurfaceSourceSha256":"240a3e7072441f14a9ad7070e5c3b8306b42d97ef5932be59f2