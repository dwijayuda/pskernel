pescriptSha256":"595cd338505f7012b8f0a813a78a1ecbafe863e6ea715b9861db35333d5a254c","javascriptSha256":"6cddc3c34c38f1524ef9a355c46b0eb17949c45c54fd59367ea370c1af861ab3"}},"evidenceProducer":{"workflow":{"path":".github/workflows/psc0-sh1-finish-evidence.yml"},"binder":{"sourcePath":"psc0/scripts/sh1-strict-evidence.mjs","path":"scripts/sh1-strict-evidence-finish.mjs","blob":"7700fef35acd06789b94f72078869fdef489214f","sha256":"829c7c8c70ce3388e6a8e8044ee07b5c65649546d1556a62d599a552fdcdb606","bytes":91977},"finisher":{"sourcePath":"psc0/scripts/sh1-finish-evidence.mjs","path":"scripts/sh1-finish-evidence.mjs","blob":"793adba3bc690bbef566e922c9efb3457d372d87","sha256":"804f4e67d9c9e4165cdbeec01dd3a2c7a5635f08e3d95ab9f88f75054a79316d","bytes":38509}}};
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const root = process.cwd();
          const destinationDirectory = 'dist/sh1-evidence-finish-inputs';
          assert.equal(root, expected.sourceRoot);
          assert.equal(process.version, 'v22.23.3');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),expected.sourceRef);
          assert.equal(hash(await readFile('scripts/sh1-qualify.mjs')),expected.qualifierSha256);
          assert.equal(hash(await readFile('scripts/sh1-strict-evidence.mjs')),expected.generationBinderSha256);
          assert.match(process.env.GITHUB_SHA,/^[a-f0-9]{40}$/u);
          const headers = {Authorization:'Bearer '+process.env.GH_TOKEN,
            Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const base = 'https://api.github.com/repos/dwijayuda/pskernel';
          async function api(suffix) {
            const response = await fetch(base+suffix,{headers});
            assert.equal(response.status,200,'GitHub metadata '+suffix);
            return response.json();
          }
          const currentRunId = Number(process.env.GITHUB_RUN_ID);
          const currentRunAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          assert(Number.isSafeInteger(currentRunId) && currentRunId > 0);
          assert.equal(currentRunAttempt,1);
          const g = expected.generationRun, p = expected.prior;
          const [run,job,providerJob,artifact,priorRun,priorJob,priorProviderJob,currentRun,currentJobs] =
            await Promise.all([
              api('/actions/runs/'+g.runId),api('/actions/jobs/'+g.compilerJobId),
              api('/actions/jobs/'+g.providerJobId),api('/actions/artifacts/'+g.artifactId),
              api('/actions/runs/'+p.runId),api('/actions/jobs/'+p.compilerJobId),
              api('/actions/jobs/'+p.providerJobId),api('/actions/runs/'+currentRunId),
              api('/actions/runs/'+currentRunId+'/jobs?per_page=100'),
            ]);
          function checkRun(value,id,workflow,head,conclusion) {
            assert.equal(value.id,id); assert.equal(value.workflow_id,workflow);
            assert.equal(value.head_sha,head); assert.equal(value.run_attempt,1);
            assert.equal(value.status,'completed'); assert.equal(value.conclusion,conclusion);
          }
          function checkJob(value,id,runId,head,conclusion) {
            assert.equal(value.id,id); assert.equal(value.run_id,runId);
            assert.equal(value.head_sha,head); assert.equal(value.run_attempt,1);
            assert.equal(value.status,'completed'); assert.equal(value.conclusion,conclusion);
          }
          function step(value,number,conclusion) {
            const entry=value.steps.find(item=>item.number===number);
            assert(entry,'recorded step '+number); assert.equal(entry.status,'completed');
            assert.equal(entry.conclusion,conclusion,entry.name); return entry;
          }
          checkRun(run,g.runId,g.workflowId,g.headSha,'failure');
          checkJob(job,g.compilerJobId,g.runId,g.headSha,'failure');
          checkJob(providerJob,g.providerJobId,g.runId,g.headSha,'skipped');
          for(const number of [5,6,7,10]) step(job,number,'success');
          assert.equal(step(job,8,'failure').name,'Run the existing exact-source fixed-point command');
          step(job,9,'skipped');
          checkRun(priorRun,p.runId,p.workflowId,p.sourceRef,'cancelled');
          checkJob(priorJob,p.compilerJobId,p.runId,p.sourceRef,'cancelled');
          checkJob(priorProviderJob,p.providerJobId,p.runId,p.sourceRef,'skipped');
          for(const number of [18,19,20,21,22,23,24,25,26,30]) step(priorJob,number,'success');
          step(priorJob,27,'cancelled');
          assert.equal(currentRun.id,currentRunId);
          assert.equal(currentRun.head_sha,process.env.GITHUB_SHA);
          assert.equal(currentRun.run_attempt,currentRunAttempt);
          assert.equal(currentRun.path,expected.evidenceProducer.workflow.path);
          assert.equal(currentRun.status,'in_progress');
          assert.equal(currentJobs.total_count,currentJobs.jobs.length);
          const ownJobs=currentJobs.jobs.filter(value=>value.name==='compiler');
          assert.equal(ownJobs.length,1);
          const ownJob=ownJobs[0];
          assert.equal(ownJob.run_id,currentRunId);
          assert.equal(ownJob.head_sha,process.env.GITHUB_SHA);
          assert.equal(ownJob.run_attempt,currentRunAttempt);
          assert.equal(ownJob.status,'in_progress');
          assert.equal(artifact.id,g.artifactId);
          assert.equal(artifact.name,g.artifactName);
          assert.equal(artifact.expired,false);
          assert.equal(artifact.size_in_bytes,g.archiveBytes);
          assert.equal(artifact.digest,'sha256:'+g.archiveSha256);
          assert.equal(artifact.workflow_run.id,g.runId);
          assert.equal(artifact.workflow_run.head_sha,g.headSha);
          const response=await fetch(base+'/actions/artifacts/'+g.artifactId+'/zip',{headers});
          assert.equal(response.status,200,'authenticated retained-generation archive');
          const archive=Buffer.from(await response.arrayBuffer());
          assert.equal(archive.length,g.archiveBytes);
          assert.equal(hash(archive),g.archiveSha256);
          await mkdir(destinationDirectory,{recursive:true});
          const zipPath=path.join(destinationDirectory,'predecessor-verified.zip');
          await writeFile(zipPath,archive);
          function safeNames(archivePath,count) {
            const listing=execFileSync('unzip',['-Z','-1',archivePath],{encoding:'utf8',maxBuffer:4*1024*1024});
            const entries=listing.split(/\r?\n/u).filter(Boolean);
            assert.equal(new Set(entries).size,entries.length,'unique archive names');
            assert(entries.every(name=>!name.startsWith('/')&&!name.includes('\\')&&
              name.split('/').every(part=>part!=='..'&&part!=='.')&&path.posix.normalize(name)===name),
              'safe exact archive names');
            const names=entries.filter(name=>!name.endsWith('/'));
            assert.equal(names.length,count,'authenticated upload file-count declaration matches actual ZIP');
            return {entries,names};
          }
          const {entries,names}=safeNames(zipPath,g.archiveFileCount);
          const roots=['dist/sh1/','.selfhost-seeds/','dist/sh1-native-seed-recovery/',
            'dist/sh1-seed-selection/','dist/typescript-profile/','dist/sh1-continuation-inputs/'];
          assert(names.every(name=>roots.some(prefix=>name.startsWith(prefix))),'artifact output directories only');
          for(const name of ['dist/sh1/qualification.json','dist/sh1/strict-enforcement-evidence.json',
            'dist/sh1/seed-selection.json','dist/sh1/evidence-completion.json',
            'dist/sh1-continuation-inputs/evidence-inventory.json'])
            assert(!names.includes(name),'failed run has no completed output '+name);
          const rawFiles=new Map(),archiveFiles=[];
          for(const name of names) {
            const bytes=execFileSync('unzip',['-p',zipPath,name],{maxBuffer:128*1024*1024});
            rawFiles.set(name,bytes);
            archiveFiles.push({path:name,sha256:hash(bytes),bytes:bytes.length});
          }
          function exactBytes(name,pin) {
            const bytes=rawFiles.get(name); assert(bytes,'retained '+name);
            assert.equal(hash(bytes),pin.sha256??pin.receiptSha256,name+' exact raw digest');
            assert.equal(bytes.length,pin.bytes??pin.receiptBytes,name+' exact raw bytes');
            return bytes;
          }
          const priorInputsBytes=exactBytes(expected.importedPriorInputs.path,expected.importedPriorInputs);
          const priorInputs=JSON.parse(priorInputsBytes.toString('utf8'));
          assert.equal(priorInputs.kind,'psc0-authenticated-fixed-point-continuation-inputs');
          assert.equal(priorInputs.sourceRef,expected.sourceRef);
          assert.equal(priorInputs.orchestrationHeadSha,g.headSha);
          assert.equal(priorInputs.orchestrationRunId,g.runId);
          assert.equal(priorInputs.orchestrationRunAttempt,1);
          assert.deepEqual(priorInputs.expected,p);
          assert.equal(priorInputs.archiveDigestVerified,true);
          assert.equal(priorInputs.currentSourceAndAll48RecipeInputsUnchanged,true);
          assert.deepEqual(priorInputs.reusedGenerations,['N1','C1']);
          assert.deepEqual(priorInputs.regeneratedGenerations,['C2','C3']);
          assert.equal(priorInputs.archiveFileCount,p.archiveFileCount);
          assert.equal(priorInputs.importedFiles.length,277);
          assert.equal(priorInputs.omittedFiles.length,67);
          for(const file of priorInputs.importedFiles) exactBytes(file.path,file);
          const receipts={};
          for(const [name,directory] of [['N1','development/N1'],['C1','C1'],['C2','C2'],['C3','C3']]) {
            const raw=exactBytes('dist/sh1/'+directory+'/receipt.json',expected[name]);
            const value=JSON.parse(raw.toString('utf8'));
            assert.equal(JSON.stringify(value,null,2)+'\n',raw.toString('utf8'));
            assert.equal(value.sourceRef,expected.sourceRef);
            assert.equal(value.sourceClosureSha256,expected.sourceClosureSha256);
            assert.equal(value.recipe.sha256,expected.recipeSha256);
            assert.equal(hash(JSON.stringify(value.recipe.files)),expected.recipeSha256);
            assert.deepEqual(value.toolchain,expected.toolchain);
            assert.deepEqual(value.typescriptProfile,expected.typescriptProfile);
            assert.deepEqual(value.artifacts,expected[name].artifacts);
            for(const [file,key] of [['index.ts','typescriptSha256'],['index.js','javascriptSha256'],
              ...('canonicalSurfaceSourceSha256' in value.artifacts?
                [['canonical-source.json','canonicalSurfaceSourceSha256'],
                 ['admissions.json','normalizedCanonicalAdmissionsSha256']]:[])]) {
              assert.equal(hash(rawFiles.get('dist/sh1/'+directory+'/'+file)),value.artifacts[key],name+'/'+file);
            }
            receipts[name]=value;
          }
          assert.equal(receipts.N1.evidence,'native-seeded-generated-compiler-candidate');
          for(const name of ['C1','C2','C3']) assert.equal(receipts[name].evidence,'candidate-build');
          assert.equal(receipts.C2.executingCompilerSha256,receipts.C1.artifacts.javascriptSha256);
          assert.equal(receipts.C3.executingCompilerSha256,receipts.C2.artifacts.javascriptSha256);
          assert.deepEqual(receipts.C2.artifacts,receipts.C3.artifacts);
          assert.equal(receipts.N1.artifacts.typescriptSha256,receipts.C2.artifacts.typescriptSha256);
          assert.equal(receipts.N1.artifacts.javascriptSha256,receipts.C2.artifacts.javascriptSha256);
          const recipeFiles=receipts.C1.recipe.files;
          assert.equal(recipeFiles.length,48);
          for(const file of recipeFiles) assert.equal(hash(await readFile(file.path)),file.sha256,'generation recipe '+file.path);
          const importedFiles=[];
          for(const file of archiveFiles) {
            await mkdir(path.dirname(file.path),{recursive:true});
            if(existsSync(file.path))
              assert.equal(hash(await readFile(file.path)),file.sha256,'pre-existing output is identical '+file.path);
            else await writeFile(file.path,rawFiles.get(file.path));
            assert.equal(hash(await readFile(file.path)),file.sha256,'restored '+file.path);
            importedFiles.push(file);
          }
          importedFiles.push({path:zipPath,sha256:g.archiveSha256,bytes:g.archiveBytes});
          const priorZipPath='dist/sh1-continuation-inputs/predecessor-verified.zip';
          const priorZip=await readFile(priorZipPath);
          assert.equal(priorZip.length,p.archiveBytes);
          assert.equal(hash(priorZip),p.archiveSha256,'retained original raw archive');
          const oldNames=safeNames(priorZipPath,p.archiveFileCount);
          const oldFiles=[];
          for(const name of oldNames.names) {
            const bytes=execFileSync('unzip',['-p',priorZipPath,name],{maxBuffer:128*1024*1024});
            oldFiles.push({path:name,sha256:hash(bytes),bytes:bytes.length});
          }
          assert.deepEqual(oldFiles,priorInputs.archiveFiles,'full original archive inventory');
          async function retainedBlob(pin) {
            const result=await api('/git/blobs/'+pin.blob);
            assert.equal(result.sha,pin.blob); assert.equal(result.encoding,'base64');
            const bytes=Buffer.from(result.content,'base64');
            assert.equal(bytes.length,pin.bytes); assert.equal(hash(bytes),pin.sha256);
            return bytes;
          }
          const logBytes=await retainedBlob(expected.generationLog);
          await writeFile(expected.generationLog.path,logBytes);
          importedFiles.push({path:expected.generationLog.path,sha256:expected.generationLog.sha256,bytes:expected.generationLog.bytes});
          async function sourceAtCurrentHead(sourcePath,pin) {
            const result=await api('/contents/'+sourcePath+'?ref='+process.env.GITHUB_SHA);
            assert.equal(result.type,'file'); assert.equal(result.path,sourcePath);
            assert.equal(result.encoding,'base64');
            const bytes=Buffer.from(result.content,'base64');
            assert.equal(result.size,bytes.length);
            if(pin) {
              assert.equal(result.sha,pin.blob);
              assert.equal(bytes.length,pin.bytes); assert.equal(hash(bytes),pin.sha256);
            }
            return {blob:result.sha,sha256:hash(bytes),bytes:bytes.length,raw:bytes};
          }
          const producer={sourceRef:process.env.GITHUB_SHA};
          for(const key of ['finisher','binder']) {
            const pin=expected.evidenceProducer[key];
            const file=await sourceAtCurrentHead(pin.sourcePath,pin);
            assert(!recipeFiles.some(item=>item.path===pin.path),'sidecar not a generation recipe input');
            assert(!existsSync(pin.path),'new sidecar path only '+pin.path);
            await writeFile(pin.path,file.raw);
