name: PSC0 TypeScript 7 native seed cold recovery

on:
  push:
    branches: ['psc0/sh1-projection-grammar-v1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc0-sh1-ts7-native-cold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cold-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sh1-ts7-cold]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: psc0
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate the exact selected R identity and separate native recipe
        id: recovery
        uses: actions/github-script@v7
        with:
          script: |
            const root = process.env.GITHUB_WORKSPACE + '/psc0';
            const recovery = await import(root + '/scripts/sh1-native-seed-recovery.mjs');
            const { selected, policySha256, recipeSha256 } = await recovery.readNativeSeedRecoveryPolicy({ root });
            core.setOutput('source-ref', selected.sourceRef);
            core.setOutput('node-version', selected.nodeVersion);
            core.setOutput('identity', selected.identitySha256);
            core.info('PSC0_SH1_NATIVE_COLD_POLICY: ' + JSON.stringify({
              selectedSeedIdentitySha256: selected.identitySha256,
              sourceRef: selected.sourceRef, policySha256, recipeSha256,
              noCompilerArtifactDownload: true, noBuildOrSeedCacheRestore: true,
            }));
      - name: Check out the pinned raw R source in a separate clean directory
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.recovery.outputs.source-ref }}
          path: native-authoring-source
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.recovery.outputs.node-version }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: native-authoring-source/psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install only the pinned TypeScript 7 package
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-native-cold-typescript-7.0.2" --ignore-scripts --save-exact --no-audit --no-fund typescript@7.0.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, copyFileSync, mkdirSync, readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const prefix = path.join(process.env.RUNNER_TEMP, 'psc0-native-cold-typescript-7.0.2');
          const metadataPath = require.resolve('typescript/package.json', { paths: [prefix] });
          const metadata = JSON.parse(readFileSync(metadataPath, 'utf8'));
          assert.equal(metadata.name, 'typescript');
          assert.equal(metadata.version, '7.0.2');
          assert.equal(typeof metadata.bin?.tsc, 'string');
          const launcher = realpathSync(path.resolve(path.dirname(metadataPath), metadata.bin.tsc));
          const packageDirectory = realpathSync(path.dirname(metadataPath));
          const relative = path.relative(packageDirectory, launcher);
          assert(relative !== '..' && !relative.startsWith('..' + path.sep) && !path.isAbsolute(relative));
          appendFileSync(process.env.GITHUB_ENV,
            'PSC0_TSC=' + launcher + '\nPSC0_TYPESCRIPT_VERSION=7.0.2\n');
          const evidence = path.resolve('dist/typescript-profile/native-cold-install');
          mkdirSync(evidence, { recursive: true });
          copyFileSync(metadataPath, path.join(evidence, 'package.json'));
          copyFileSync(path.join(prefix, 'package-lock.json'), path.join(evidence, 'package-lock.json'));
          NODE
      - name: Reproduce the selected R identity from native source without a seed or build cache
        env:
          PSC0_NATIVE_COLD_CACHE: ${{ runner.temp }}/psc0-native-cold-seed/${{ steps.recovery.outputs.identity }}
        run: |
          node scripts/sh1-native-seed-recovery.mjs \
            --source-workspace "$GITHUB_WORKSPACE/native-authoring-source/psc0" \
            --out "$GITHUB_WORKSPACE/psc0/dist/sh1-native-seed-cold" \
            --cache-directory "$PSC0_NATIVE_COLD_CACHE" \
            --cold
      - name: Retain exact native recovery products, recipe receipt and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-native-ts7-cold-${{ github.sha }}
          path: |
            psc0/dist/sh1-native-seed-cold
            psc0/dist/typescript-profile/native-cold-install
            ${{ runner.temp }}/psc0-native-cold-seed
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
