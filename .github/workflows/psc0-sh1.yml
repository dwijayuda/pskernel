name: PSC0 SH1 language qualification

on:
  push:
    branches: ['psc0/sh1-implementation-v1', 'psc0/sh1-generic-erasure-v1', 'psc0/sh1-ir-checker-v1', 'psc0/typescript-7-v1', 'psc0/sh1-projection-grammar-v1', 'psc0/strict-sh1-v1']
    paths:
      - 'psc0/packages/bootstrap/**'
      - 'psc0/packages/foundation/**'
      - 'psc0/packages/syntax/**'
      - 'psc0/packages/core/**'
      - 'psc0/packages/environment/**'
      - 'psc0/packages/meta/**'
      - 'psc0/packages/elab/**'
      - 'psc0/packages/bridge/**'
      - 'psc0/packages/compiler-ir/**'
      - 'psc0/packages/erasure/**'
      - 'psc0/packages/compiler/**'
      - 'psc0/packages/backend-ts/**'
      - 'psc0/packages/cli/**'
      - 'psc0/host/**'
      - 'psc0/lean-checked/**'
      - 'psc0/test/**'
      - 'psc0/scripts/**'
      - 'psc0/check-psc1-source.mjs'
      - 'psc0/lakefile.lean'
      - 'psc0/lake-manifest.json'
      - 'psc0/lean-toolchain'
      - 'psc0/psconfig.json'
      - 'psc0/selfhost-seed.json'
      - 'psc0/selfhost-seed-recovery.json'
      - 'psc0/package.json'
      - '.github/workflows/psc0-sh1.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Qualify current-source C2/C3 after the candidate gate'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: psc0-sh1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      qualified: ${{ steps.qualify.outcome == 'success' }}
      successor-candidate: ${{ steps.qualify.outputs.successor-candidate }}
      node-version: ${{ steps.seed-selection.outputs.node-version }}
    defaults:
      run:
        working-directory: psc0
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate the selected R seed and TS7-only recovery policy
        id: seed-selection
        uses: actions/github-script@v7
        env:
          PSC0_SH1_FULL_QUALIFICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.head_commit.message, '[sh1-qualify]') }}
        with:
          script: |
            const { mkdir, writeFile } = await import('node:fs/promises');
            const path = await import('node:path');
            const root = process.env.GITHUB_WORKSPACE + '/psc0';
            const recovery = await import(root + '/scripts/sh1-native-seed-recovery.mjs');
            const { selected, policySha256, recipeSha256 } = await recovery.readNativeSeedRecoveryPolicy({ root });
            const directory = path.join(root, 'dist/sh1-seed-selection');
            await mkdir(directory, { recursive: true });
            await writeFile(path.join(directory, 'selected-native-recovery.json'), JSON.stringify({
              sourceRef: selected.sourceRef, identitySha256: selected.identitySha256,
              policySha256, recipeSha256, recipe: recovery.nativeSeedRecoveryRecipe,
              parentMetadataRetained: Boolean(selected.parent),
              parentExecutionRequired: false, typescriptVersion: '7.0.2',
            }, null, 2) + '\n');
            for (const [name, value] of Object.entries({
              mode: selected.mode,
              'full-qualification': process.env.PSC0_SH1_FULL_QUALIFICATION === 'true',
              'node-version': selected.nodeVersion,
              'source-ref': selected.sourceRef,
              'compiler-path': selected.compilerPath,
              'cache-key': selected.cacheKey,
              'cache-directory': selected.cacheDirectory,
              'artifact-run-id': selected.artifactRunId,
              'artifact-name': selected.artifactName,
              'recovery-typescript-version': '7.0.2',
              'has-parent': Boolean(selected.parent),
            })) core.setOutput(name, value);
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: ${{ steps.seed-selection.outputs.node-version }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install the pinned current TypeScript 7 profile
        id: typescript
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-typescript-7.0.2" --ignore-scripts --save-exact --no-audit --no-fund typescript@7.0.2
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, copyFileSync, mkdirSync, readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          const require = createRequire(import.meta.url);
          const directory = path.resolve('dist/typescript-profile/install');
          mkdirSync(directory, { recursive: true });
          const version = '7.0.2';
          const prefix = path.join(process.env.RUNNER_TEMP, 'psc0-typescript-' + version);
          const manifestPath = require.resolve('typescript/package.json', { paths: [prefix] });
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          assert.equal(manifest.name, 'typescript');
          assert.equal(manifest.version, version);
          const bin = typeof manifest.bin === 'string' ? manifest.bin : manifest.bin?.tsc;
          assert.equal(typeof bin, 'string', 'PSC0_TYPESCRIPT_BIN_METADATA');
          const launcher = realpathSync(path.resolve(path.dirname(manifestPath), bin));
          const result = spawnSync(process.execPath, [launcher, '--version'], { encoding: 'utf8' });
          assert.equal(result.status, 0, result.stderr);
          assert.equal(result.stdout.trim(), 'Version ' + version);
          appendFileSync(process.env.GITHUB_OUTPUT, 'current-cli=' + launcher + '\n');
          copyFileSync(path.join(prefix, 'package-lock.json'), path.join(directory, 'current-package-lock.json'));
          copyFileSync(manifestPath, path.join(directory, 'current-package.json'));
          appendFileSync(process.env.GITHUB_ENV, 'PSC0_TSC=' + launcher + '\nPSC0_TYPESCRIPT_VERSION=' + version + '\n');
          NODE
      - name: Verify the installed TypeScript 7 profile before compiler generation
        run: node scripts/check-typescript-profile.mjs --out dist/typescript-profile/contract
      - name: Verify host syntax and bootstrap source restrictions
        run: |
          node --check scripts/typescript-cli.mjs
          node --check scripts/check-typescript-profile.mjs
          node --check scripts/native-typescript-cli.test.mjs
          node scripts/check-native-replay-host-source.mjs
          node --check scripts/sh1-qualify.mjs
          node --check scripts/sh1-capabilities.mjs
          node --check scripts/sh1-check-admissions.mjs
          node --check scripts/generated-preparation-session.mjs
          node --check scripts/original-ir-inventory.mjs
          node --check scripts/original-ir-carrier.mjs
          node --check scripts/sh1-ir-checker-conformance.mjs
          node --check scripts/sh1-strict-source.mjs
          node --check scripts/sh1-strict-source-conformance.mjs
          node --check scripts/sh1-strict-target-conformance.mjs
          node --check scripts/sh1-strict-evidence.mjs
          node --check scripts/sh1-strict-runtime-conformance.mjs
          node --check scripts/sh1-source-snapshot.mjs
          node --check scripts/sh1-seed-manifest.mjs
          node --check scripts/sh1-grammar-conformance.mjs
          node --check scripts/sh1-fresh-name-conformance.mjs
          node --check scripts/sh1-migration-worker-conformance.mjs
          node --check scripts/sh1-migration-worker-abi.mjs
          node --check scripts/sh1-projection-conformance.mjs
          node --check scripts/sh1-successor-seed.mjs
          node --check scripts/sh1-native-seed-recovery.mjs
          node --check scripts/sh1-successor-seed.test.mjs
          node --check scripts/proofscript-source.mjs
          node --check scripts/proofscript-source.test.mjs
          node --check scripts/checked-source-snapshot.mjs
          node --check scripts/checked-source-snapshot.test.mjs
          node --check scripts/checked-seed-session.test.mjs
          node --check scripts/checked-build.mjs
          node --check scripts/checked-build.test.mjs
          node --check scripts/checked-algebraic-build.test.mjs
          node --check scripts/checked-enum-build.test.mjs
          node --check scripts/checked-projection-build.test.mjs
          node --check scripts/checked-sum-build.test.mjs
          node --check scripts/checked-text-build.test.mjs
          node --check scripts/selfhost-source-workspace.mjs
          node --check scripts/selfhost-source-isolation-tests.mjs
          node --check scripts/native-workspace-isolation.test.mjs
          node --check scripts/compile-with-generated.mjs
          node --check scripts/emit-project-with-generated.mjs
          node --check scripts/reemit-project-with-generated.mjs
          node --check scripts/translate-with-generated.mjs
          node --check scripts/check-elab-term-selfhost-source-syntax.mjs
          node --check scripts/check-proofscript-binder-replay-source.mjs
          node scripts/check-elab-term-selfhost-source-syntax.mjs
          node scripts/check-proofscript-binder-replay-source.mjs
          node --check scripts/sh1-iterate.mjs
          node --check scripts/sh1-iteration-conformance.mjs
          node --check scripts/sh1-foundation-conformance.mjs
          node --check scripts/sh1-helper-conformance.mjs
          node --check scripts/sh1-generic-erasure-conformance.mjs
          node check-psc1-source.mjs
          node scripts/bootstrap-root-minimality-tests.mjs
          node scripts/check-modular-preparation-source.mjs
      - name: Verify successor seed descriptor and cache contracts
        run: node --test scripts/sh1-successor-seed.test.mjs
      - name: Restore the selected qualified compiler bytes
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' }}
        uses: actions/cache/restore@v4
        id: qualified-cache
        with:
          path: psc0/${{ steps.seed-selection.outputs.cache-directory }}
          key: ${{ steps.seed-selection.outputs.cache-key }}
      - name: Verify the restored selected compiler bytes
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        id: selected-cache-check
        uses: actions/github-script@v7
        with:
          script: |
            const root = process.env.GITHUB_WORKSPACE + '/psc0';
            const seeds = await import(root + '/scripts/sh1-successor-seed.mjs');
            const selected = await seeds.readSelectedAuthoringSeed();
            const valid = selected.mode === 'qualified' && await seeds.verifyAuthoringSeedCache(
              root + '/' + selected.cacheDirectory, selected.manifest);
            core.setOutput('qualified-valid', valid);
      - name: Check out pinned R source for a missing selected seed cache
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.selected-cache-check.outputs.qualified-valid != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.seed-selection.outputs.source-ref }}
          path: native-authoring-source
      - name: Recover all four selected R products with native Lean and TypeScript 7
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.selected-cache-check.outputs.qualified-valid != 'true' }}
        env:
          PSC0_NATIVE_SEED_CACHE: ${{ github.workspace }}/psc0/${{ steps.seed-selection.outputs.cache-directory }}
        run: |
          node scripts/sh1-native-seed-recovery.mjs \
            --source-workspace "$GITHUB_WORKSPACE/native-authoring-source/psc0" \
            --out "$GITHUB_WORKSPACE/psc0/dist/sh1-native-seed-recovery" \
            --cache-directory "$PSC0_NATIVE_SEED_CACHE"
      - name: Verify selected authoring cache and execution runtime before current generation
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { readSelectedAuthoringSeed, verifyAuthoringSeedCache } from './scripts/sh1-successor-seed.mjs';
          const selected = await readSelectedAuthoringSeed();
          assert(await verifyAuthoringSeedCache(path.resolve(selected.cacheDirectory), selected.manifest),
            'PSC0_SH1_SELECTED_CACHE_REQUIRED');
          const capture = args => {
            const result = spawnSync('lean', args, { encoding: 'utf8' });
            assert.equal(result.status, 0, result.stderr);
            return result.stdout.trim();
          };
          const { typescript, ...expectedRuntime } = selected.manifest.toolchain;
          assert.equal(typescript, 'Version ' + selected.recoveryTypeScriptVersion);
          assert.deepEqual({
            node: process.version, platform: process.platform, architecture: process.arch,
            lean: capture(['--version']), leanGitHash: capture(['--githash']),
          }, expectedRuntime, 'PSC0_SH1_SELECTED_EXECUTION_RUNTIME');
          NODE
      - name: Retain the verified qualified authoring seed
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' && steps.qualified-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: psc0/${{ steps.seed-selection.outputs.cache-directory }}
          key: ${{ steps.seed-selection.outputs.cache-key }}
      - name: Restore incremental current compiler build
        id: current-lake
        uses: actions/cache/restore@v4
        with:
          path: psc0/.lake/build
          key: psc0-sh1-current-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/lean-toolchain', 'psc0/lakefile.lean') }}-ts7.0.2-${{ github.sha }}
          restore-keys: |
            psc0-sh1-current-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/lean-toolchain', 'psc0/lakefile.lean') }}-
      - name: Build current native compiler
        id: native
        run: lake build psc1 psc1_sh1_compile psc1_ir_check_tests psc1_tests psc1_translation_tests psc1_erasure_tests
      - name: Run native parser, translation, and erasure regression targets
        run: |
          regression_status=0
          for target in psc1_tests psc1_translation_tests psc1_erasure_tests; do
            if ! lake exe "$target"; then regression_status=1; fi
          done
          exit "$regression_status"
      - name: Build the actual native checked seed for source and import tests
        working-directory: psc0/lean-checked
        run: lake build psc2_lean_checked_seed
      - name: Verify new grammar source loading, imports, and native workspace boundaries
        run: |
          test -x lean-checked/.lake/build/bin/psc2_lean_checked_seed
          npm run --workspace @proofscript/pskernel-lean-wasm verify:prebuilt
          node --test scripts/proofscript-source.test.mjs scripts/checked-source-snapshot.test.mjs scripts/checked-seed-session.test.mjs
          node --test --test-name-pattern='^actual PS build (rejects|resolves|prepares)' scripts/checked-build.test.mjs
          node scripts/selfhost-source-isolation-tests.mjs
          node scripts/native-workspace-isolation.test.mjs
      - name: Verify native and generated TypeScript CLI boundaries
        run: |
          node scripts/selfhost-replay-runtime.test.mjs
          node scripts/checked-erasure-name-index.test.mjs
      - name: Verify migration behavior and isolated ABI probe on the authenticated R compiler
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.has-parent == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { readSelectedAuthoringSeed } from './scripts/sh1-successor-seed.mjs';
          import { loadGeneratedCompiler } from './scripts/sh1-source-snapshot.mjs';
          import { valueTag } from './scripts/sh1-capabilities.mjs';
          import { runMigrationWorkerConformance } from './scripts/sh1-migration-worker-conformance.mjs';
          import { migrationWorkerAbiProbeSource, runMigrationWorkerAbiProbe } from './scripts/sh1-migration-worker-abi.mjs';
          const selected = await readSelectedAuthoringSeed();
          assert.equal(selected.mode, 'qualified');
          assert.equal(selected.manifest.kind, 'psc0-qualified-successor-seed');
          const loaded = await loadGeneratedCompiler(path.resolve(selected.compilerPath), {
            expectedSha256: selected.manifest.expectedArtifacts.javascriptSha256,
          });
          await mkdir('dist/sh1', { recursive: true });
          await writeFile('dist/sh1/worker-abi-probe.lean', migrationWorkerAbiProbeSource, 'utf8');
          const started = performance.now();
          const report = runMigrationWorkerConformance(loaded.compiler, valueTag);
          assert.equal(report.cases, 87);
          const abiProbe = runMigrationWorkerAbiProbe(loaded.compiler, valueTag);
          assert.equal(abiProbe.signatureTypeAnnotations, 12);
          assert.equal(abiProbe.typedGenericPartialWrappers, 12);
          assert.equal(abiProbe.currentSourceCoreOrIrCompared, false);
          const receipt = {
            schemaVersion: 1, evidence: 'migration-fixture-authenticated-reference-preflight',
            recipeSourceRef: process.env.GITHUB_SHA, referenceSourceRef: selected.sourceRef,
            referenceCompilerSha256: loaded.compilerSha256,
            selectedSeedIdentitySha256: selected.identitySha256,
            elapsedMs: performance.now() - started, report, abiProbe, passed: true,
            compilerBuilt: false, currentSourceQualifiedByThisCheck: false,
          };
          await writeFile('dist/sh1/worker-harness-reference.json',
            JSON.stringify(receipt, null, 2) + '\n', 'utf8');
          console.log('PSC0_SH1_WORKER_HARNESS_REFERENCE: ' + JSON.stringify(receipt));
          NODE
      - name: Run the bounded native development gate before qualification
        id: native-gate
        run: node scripts/sh1-qualify.mjs native-candidate --native .lake/build/bin/psc1 --out ${{ steps.seed-selection.outputs.full-qualification == 'true' && 'dist/sh1/development' || 'dist/sh1' }}
      - name: Build the selected-seed candidate before full qualification
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        run: node scripts/sh1-qualify.mjs candidate --seed ${{ steps.seed-selection.outputs.compiler-path }} --out dist/sh1 --native .lake/build/bin/psc1
      - name: Qualify exact current-source C2/C3 at a promotion checkpoint
        id: qualify
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        run: node scripts/sh1-qualify.mjs fixed-point --out dist/sh1
      - name: Retain the newly qualified seed without activating a source migration
        if: ${{ steps.qualify.outputs.promoted-seed-cache-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.qualify.outputs.promoted-seed-cache-directory }}
          key: ${{ steps.qualify.outputs.promoted-seed-cache-key }}
      - name: Retain incremental native outputs
        if: ${{ always() && steps.native.outcome != 'skipped' && steps.current-lake.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: psc0/.lake/build
          key: ${{ steps.current-lake.outputs.cache-primary-key }}
      - name: Retain compiler evidence and exact generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-ts7.0.2-${{ github.sha }}
          path: |
            psc0/dist/sh1
            psc0/.selfhost-seeds
            psc0/dist/sh1-native-seed-recovery
            psc0/dist/sh1-seed-selection
            psc0/dist/typescript-profile
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  kernel-admissions:
    needs: compiler
    if: ${{ needs.compiler.outputs.qualified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the independently qualified native provider at its exact source revision
        uses: actions/checkout@v4
        with:
          ref: 963030dc2d154008fccc82e7c8ed29331f138799
          path: provider-source
          sparse-checkout: psc0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.compiler.outputs.node-version }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: provider-source/psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore pinned native provider build
        id: provider-cache
        uses: actions/cache/restore@v4
        with:
          path: provider-source/psc0/.lake/build
          key: psc0-sh1-provider-v1-${{ runner.os }}-${{ runner.arch }}-963030dc2d154008fccc82e7c8ed29331f138799
      - name: Build the existing provider target without editing its implementation
        working-directory: provider-source/psc0
        run: lake build psc_kernel_core_provider
      - name: Retain the pinned provider build
        if: ${{ steps.provider-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: provider-source/psc0/.lake/build
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
      - name: Read exact compiler qualification artifacts from this run
        uses: actions/download-artifact@v4
        with:
          name: psc0-sh1-ts7.0.2-${{ github.sha }}
          path: qualification-artifacts
      - name: Obtain actual provider decisions for the qualified admission streams
        working-directory: psc0
        run: node scripts/sh1-check-admissions.mjs --provider-root ../provider-source/psc0 --artifacts ../qualification-artifacts/dist/sh1
      - name: Retain provider acceptance or the exact rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-kernel-ts7.0.2-${{ github.sha }}
          path: qualification-artifacts/dist/sh1/kernel-admissions.json
          if-no-files-found: ignore
          retention-days: 30
