name: PSC0 SH1 language qualification

on:
  push:
    branches: ['psc0/sh1-implementation-v1']
    paths:
      - 'psc0/packages/bootstrap/**'
      - 'psc0/packages/foundation/**'
      - 'psc0/packages/syntax/**'
      - 'psc0/packages/core/**'
      - 'psc0/packages/environment/**'
      - 'psc0/packages/meta/**'
      - 'psc0/packages/elab/**'
      - 'psc0/packages/bridge/**'
      - 'psc0/packages/compiler-ir/**'
      - 'psc0/packages/erasure/**'
      - 'psc0/packages/compiler/**'
      - 'psc0/packages/backend-ts/**'
      - 'psc0/packages/cli/**'
      - 'psc0/host/**'
      - 'psc0/test/**'
      - 'psc0/scripts/**'
      - 'psc0/check-psc1-source.mjs'
      - 'psc0/lakefile.lean'
      - 'psc0/lake-manifest.json'
      - 'psc0/lean-toolchain'
      - 'psc0/psconfig.json'
      - 'psc0/selfhost-seed.json'
      - 'psc0/package.json'
      - '.github/workflows/psc0-sh1.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Qualify current-source C2/C3 after the candidate gate'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: psc0-sh1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      qualified: ${{ steps.qualify.outcome == 'success' }}
      node-version: ${{ steps.seed-selection.outputs.node-version }}
    defaults:
      run:
        working-directory: psc0
    steps:
      - uses: actions/checkout@v4
      - name: Select the historical or pinned qualified authoring seed
        id: seed-selection
        uses: actions/github-script@v7
        env:
          PSC0_SH1_FULL_QUALIFICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.head_commit.message, '[sh1-qualify]') }}
        with:
          script: |
            const seeds = await import(process.env.GITHUB_WORKSPACE + '/psc0/scripts/sh1-seed-manifest.mjs');
            const selected = await seeds.readSelectedSeed();
            for (const [name, value] of Object.entries({
              mode: selected.mode,
              'full-qualification': process.env.PSC0_SH1_FULL_QUALIFICATION === 'true',
              'node-version': selected.nodeVersion,
              'source-ref': selected.sourceRef,
              'compiler-path': selected.compilerPath,
              'cache-key': selected.cacheKey,
              'cache-directory': selected.cacheDirectory,
              'artifact-run-id': selected.artifactRunId,
              'artifact-name': selected.artifactName,
            })) core.setOutput(name, value);
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: ${{ steps.seed-selection.outputs.node-version }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install isolated pinned TypeScript
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/psc0-sh1-tools" --ignore-scripts --no-package-lock --no-audit --no-fund typescript@5.8.3
          echo "$RUNNER_TEMP/psc0-sh1-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify host syntax and bootstrap source restrictions
        run: |
          node --check scripts/sh1-qualify.mjs
          node --check scripts/sh1-capabilities.mjs
          node --check scripts/sh1-check-admissions.mjs
          node --check scripts/generated-preparation-session.mjs
          node --check scripts/original-ir-inventory.mjs
          node --check scripts/sh1-source-snapshot.mjs
          node --check scripts/sh1-seed-manifest.mjs
          node --check scripts/sh1-iterate.mjs
          node --check scripts/sh1-iteration-conformance.mjs
          node --check scripts/sh1-foundation-conformance.mjs
          node check-psc1-source.mjs
          node scripts/bootstrap-root-minimality-tests.mjs
          node scripts/check-modular-preparation-source.mjs
      - name: Restore the selected qualified compiler bytes
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' }}
        uses: actions/cache/restore@v4
        id: qualified-cache
        with:
          path: psc0/${{ steps.seed-selection.outputs.cache-directory }}
          key: ${{ steps.seed-selection.outputs.cache-key }}
      - name: Verify the restored seed before deciding whether recovery is needed
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        id: seed-cache-check
        uses: actions/github-script@v7
        with:
          script: |
            const seeds = await import(process.env.GITHUB_WORKSPACE + '/psc0/scripts/sh1-seed-manifest.mjs');
            const selected = await seeds.readSelectedSeed();
            const valid = selected.mode === 'qualified' && await seeds.verifyQualifiedSeedCache(
              process.env.GITHUB_WORKSPACE + '/psc0/' + selected.cacheDirectory, selected.manifest);
            core.setOutput('qualified-valid', valid);
            core.setOutput('needs-historical', !valid);
      - name: Preserve an immutable historical source checkout when recovery needs it
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: 37f63c39d4a07189938046c64152bba25d789450
          path: historical-source
          sparse-checkout: psc0
      - name: Restore historical native build
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' }}
        id: historical-lake
        uses: actions/cache/restore@v4
        with:
          path: historical-source/psc0/.lake/build
          key: psc0-sh1-historical-lake-v1-${{ runner.os }}-${{ runner.arch }}-37f63c39d4a07189938046c64152bba25d789450
      - name: Identify the pinned recovery recipe and toolchain
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' }}
        id: seed-identity
        run: node scripts/sh1-qualify.mjs seed-identity --source ../historical-source/psc0
      - name: Restore exact historical seed
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' }}
        id: seed-cache
        uses: actions/cache/restore@v4
        with:
          path: psc0/.selfhost-seeds/37f63c39d4a07189938046c64152bba25d789450
          key: psc0-sh1-seed-v1-${{ steps.seed-identity.outputs.identity }}
      - name: Verify seed digests or recover once from the preserved source
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' }}
        run: node scripts/sh1-qualify.mjs recover-seed --source ../historical-source/psc0 --out .selfhost-seeds/37f63c39d4a07189938046c64152bba25d789450
      - name: Retain historical native outputs before testing changed source
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' && steps.historical-lake.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: historical-source/psc0/.lake/build
          key: ${{ steps.historical-lake.outputs.cache-primary-key }}
      - name: Retain verified seed before testing changed source
        if: ${{ steps.seed-cache-check.outputs.needs-historical == 'true' && steps.seed-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: psc0/.selfhost-seeds/37f63c39d4a07189938046c64152bba25d789450
          key: ${{ steps.seed-cache.outputs.cache-primary-key }}
      - name: Retrieve the immutable qualification artifact if it is still retained
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' && steps.seed-cache-check.outputs.qualified-valid != 'true' && steps.seed-selection.outputs.artifact-run-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.seed-selection.outputs.artifact-name }}
          run-id: ${{ steps.seed-selection.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          path: qualified-artifact
      - name: Read the recoverable qualified source revision on a cache miss
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' && steps.seed-cache-check.outputs.qualified-valid != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.seed-selection.outputs.source-ref }}
          path: qualified-source
          sparse-checkout: psc0
      - name: Verify or recover the selected qualified authoring seed
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' }}
        run: node scripts/sh1-qualify.mjs recover-qualified-seed --source ../qualified-source/psc0 --artifact ../qualified-artifact/dist/sh1 --out dist/sh1-seed-recovery
      - name: Report retained seed IR type-argument findings
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const paths = [
            '../qualified-artifact/dist/sh1/C3/original-ir-inventory.json',
            'dist/sh1-seed-recovery/C2/original-ir-inventory.json',
          ];
          let reported = false;
          for (const path of paths) {
            let report;
            try { report = JSON.parse(await readFile(path, 'utf8')); }
            catch (error) {
              if (error.code !== 'ENOENT') console.log('PSC0_SH1_IR_DETAIL_UNAVAILABLE: ' + path + ': ' + error.message);
              continue;
            }
            if (report?.kind !== 'psc0-original-ir-inventory' || !Array.isArray(report.findings)) {
              console.log('PSC0_SH1_IR_DETAIL_UNAVAILABLE: ' + path + ': unexpected report shape');
              continue;
            }
            const findings = report.findings.filter(item => item?.code === 'call-type-arity');
            console.log('PSC0_SH1_IR_DETAIL_COUNTS: ' + JSON.stringify({
              path, traversalComplete: report.traversalComplete, findingCounts: report.findingCounts,
              printedTypeArityFindings: findings.length, omittedFindingDetails: report.omittedFindingDetails,
            }));
            for (const finding of findings) console.log('PSC0_SH1_IR_TYPE_ARITY: ' + JSON.stringify(finding));
            reported = true;
            break;
          }
          if (!reported) console.log('PSC0_SH1_IR_DETAIL_SKIP: no readable retained or recovery original-IR report');
          NODE
      - name: Retain the verified qualified authoring seed
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' && steps.seed-selection.outputs.mode == 'qualified' && steps.qualified-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: psc0/${{ steps.seed-selection.outputs.cache-directory }}
          key: ${{ steps.seed-selection.outputs.cache-key }}
      - name: Restore incremental current compiler build
        id: current-lake
        uses: actions/cache/restore@v4
        with:
          path: psc0/.lake/build
          key: psc0-sh1-current-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/lean-toolchain', 'psc0/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            psc0-sh1-current-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc0/lean-toolchain', 'psc0/lakefile.lean') }}-
      - name: Build current native compiler
        id: native
        run: lake build psc1
      - name: Run the fast native-seeded generated compiler gate on ordinary pushes
        if: ${{ steps.seed-selection.outputs.full-qualification != 'true' }}
        run: node scripts/sh1-qualify.mjs native-candidate --native .lake/build/bin/psc1 --out dist/sh1
      - name: Build the selected-seed candidate before full qualification
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        run: node scripts/sh1-qualify.mjs candidate --seed ${{ steps.seed-selection.outputs.compiler-path }} --out dist/sh1 --native .lake/build/bin/psc1
      - name: Qualify exact current-source C2/C3 at a promotion checkpoint
        id: qualify
        if: ${{ steps.seed-selection.outputs.full-qualification == 'true' }}
        run: node scripts/sh1-qualify.mjs fixed-point --out dist/sh1
      - name: Retain the newly qualified seed without activating a source migration
        if: ${{ steps.qualify.outputs.promoted-seed-cache-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.qualify.outputs.promoted-seed-cache-directory }}
          key: ${{ steps.qualify.outputs.promoted-seed-cache-key }}
      - name: Retain incremental native outputs
        if: ${{ always() && steps.native.outcome != 'skipped' && steps.current-lake.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: psc0/.lake/build
          key: ${{ steps.current-lake.outputs.cache-primary-key }}
      - name: Retain compiler evidence and exact generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-${{ github.sha }}
          path: |
            psc0/dist/sh1
            psc0/.selfhost-seeds
            psc0/dist/sh1-seed-recovery
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  kernel-admissions:
    needs: compiler
    if: ${{ needs.compiler.outputs.qualified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the independently qualified native provider at its exact source revision
        uses: actions/checkout@v4
        with:
          ref: 963030dc2d154008fccc82e7c8ed29331f138799
          path: provider-source
          sparse-checkout: psc0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.compiler.outputs.node-version }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: provider-source/psc0
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore pinned native provider build
        id: provider-cache
        uses: actions/cache/restore@v4
        with:
          path: provider-source/psc0/.lake/build
          key: psc0-sh1-provider-v1-${{ runner.os }}-${{ runner.arch }}-963030dc2d154008fccc82e7c8ed29331f138799
      - name: Build the existing provider target without editing its implementation
        working-directory: provider-source/psc0
        run: lake build psc_kernel_core_provider
      - name: Retain the pinned provider build
        if: ${{ steps.provider-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: provider-source/psc0/.lake/build
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
      - name: Read exact compiler qualification artifacts from this run
        uses: actions/download-artifact@v4
        with:
          name: psc0-sh1-${{ github.sha }}
          path: qualification-artifacts
      - name: Obtain actual provider decisions for the qualified admission streams
        working-directory: psc0
        run: node scripts/sh1-check-admissions.mjs --provider-root ../provider-source/psc0 --artifacts ../qualification-artifacts/dist/sh1
      - name: Retain provider acceptance or the exact rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc0-sh1-kernel-${{ github.sha }}
          path: qualification-artifacts/dist/sh1/kernel-admissions.json
          if-no-files-found: ignore
          retention-days: 30
