name: PSC1 focused native architecture regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - psc1/**
      - .github/workflows/psc1-architecture-native.yml

permissions:
  contents: read

concurrency:
  group: psc1-architecture-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build checked native control regressions
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lean --version; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1_typed_error_tests psc1_census_normalization_tests psc1_operator_tests psc1_data_tests psc1_source_census_probe
      - name: Execute all independent native control groups
        run: |
          set -euo pipefail
          mkdir -p dist/architecture-native
          .lake/build/bin/psc1_typed_error_tests 2>&1 | tee dist/architecture-native/typed-errors.log
      - name: Execute census normalization behavior and source acceptance
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_census_normalization_tests 2>&1 | tee dist/architecture-native/census-normalization.log
          .lake/build/bin/psc1_operator_tests 2>&1 | tee dist/architecture-native/operators.log
          .lake/build/bin/psc1_data_tests 2>&1 | tee dist/architecture-native/data.log
          node scripts/compiler-source-census.mjs 2>&1 | tee dist/architecture-native/compiler-source-census.log
          cp -r dist/scoped-correctness/compiler-source-census dist/architecture-native/
      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-architecture-native-${{ github.sha }}
          path: psc1/dist/architecture-native/
          if-no-files-found: warn
          retention-days: 14
