name: PSC1 actual source binding hint diagnostic
on:
  push:
    branches: [qualification/psc1-binding-hints-diagnostic-20261026]
    paths: [.github/workflows/psc1-binding-hints-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake/build
          key: psc1-trace-native-v1-${{ runner.os }}-${{ hashFiles('psc1/**/*.lean', 'psc1/lakefile.lean', 'psc1/lean-toolchain') }}
          restore-keys: |
            psc1-trace-native-v1-${{ runner.os }}-
      - name: Install pinned Lean and build actual production tools
        working-directory: psc1
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake build psc1_source_ownership psc1_lossless_source
      - name: Audit actual source hints without accepting any index
        working-directory: psc1
        run: node scripts/source-binding-hints-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-source-binding-hints-${{ github.sha }}
          path: psc1/dist/source-binding-diagnostic/
          if-no-files-found: warn
          retention-days: 90
