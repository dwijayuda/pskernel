name: PSC1 canonical source preparation
on:
  push:
    branches: [feat/psc1-canonical-latency-20261028]
    paths:
      - psc1/packages/**/*.lean
      - psc1/scripts/prepare-canonical-sources.mjs
      - psc1/scripts/prepare-source-git-tree.mjs
      - psc1/scripts/CanonicalSourceProbe.lean
      - psc1/scripts/SourceOwnershipMain.lean
      - psc1/host-tools/source-refactoring.mjs
      - .github/workflows/psc1-canonical-source-preparation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-canonical-source-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-prior-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40640056572
          name: psc1-canonical-source-preparation-259b0ff09e7e1321884b2603b77765c2b98c2e8a
          path: retained-preparation
      - name: Inspect the retained projection failure and already checked owner metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('retained-preparation')
          manifest = json.loads((root / 'CANONICAL_SOURCES.json').read_text())
          print('PSC1_RETAINED_CANONICAL_METADATA: ' + json.dumps({
              key: manifest[key] for key in ['preparedCommit', 'ownerCount', 'compilerOwnerCount', 'libraryOwnerCount', 'bootstrapFileCount']
          }))
          for key in ['correspondence', 'libraryCorrespondence']:
              value = manifest[key]
              print(key + ': ' + json.dumps({k: value[k] for k in ['status', 'admissionsSha256', 'originalIrSha256']}))
          content = (root / 'native-projection-build.log').read_text()
          lines = content.splitlines()
          selected = set()
          for index, line in enumerate(lines):
              if 'error:' in line.lower() or 'failed' in line.lower():
                  selected.update(range(max(0, index - 1), min(len(lines), index + 8)))
          print('PSC1_RETAINED_NATIVE_PROJECTION_DIAGNOSTIC:')
          print('\n'.join(lines[i] for i in sorted(selected))[:60000])
          runtime = root / 'owners/packages/backend-ts/src/Ps/BackendTs/RuntimeSupport.ps'
          text = runtime.read_text()
          print('PSC1_RETAINED_RUNTIME_PS_PREFIX: ' + repr(text[:1200]))
          PY
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Parse the initial promotion observer
        run: |
          node --check scripts/prepare-canonical-sources.mjs
          node --check scripts/prepare-source-git-tree.mjs
      - uses: actions/cache/restore@v4
        id: elan-cache
        with:
          path: ~/.elan
          key: psc1-canonical-elan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc1/lean-toolchain') }}
          restore-keys: |
            psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        id: source-tools-cache
        with:
          path: psc1/.lake/build
          key: psc1-canonical-source-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('psc1/packages/**/*.lean', 'psc1/scripts/**/*.lean', 'psc1/host/**/*.lean', 'psc1/lakefile.lean', 'psc1/lean-toolchain') }}
          restore-keys: |
            psc1-canonical-source-tools-v1-${{ runner.os }}-${{ runner.arch }}-
            psc1-independent-source-tools-v1-Linux-${{ hashFiles('psc1/packages/**/*.lean', 'psc1/scripts/**/*.lean', 'psc1/host/**/*.lean', 'psc1/lakefile.lean', 'psc1/lean-toolchain') }}
      - name: Install the pinned native bootstrap compiler
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl --connect-timeout 20 --max-time 120 --retry 2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/psc1-elan-init.sh"
            timeout 180 sh "$RUNNER_TEMP/psc1-elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the existing checked ownership helpers
        timeout-minutes: 20
        run: lake build psc1_lossless_source psc1_source_ownership psc1_independent_checker
      - uses: actions/cache/save@v4
        if: steps.elan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.elan
          key: ${{ steps.elan-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.source-tools-cache.outputs.cache-hit != 'true'
        with:
          path: psc1/.lake/build
          key: ${{ steps.source-tools-cache.outputs.cache-primary-key }}
      - name: Check canonical owners and prepare content-addressed Git objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
          PSC1_CREATE_SOURCE_TREE: '1'
        run: node --max-old-space-size=4096 scripts/prepare-canonical-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-canonical-source-preparation-${{ github.sha }}
          path: |
            psc1/dist/canonical-source-preparation/*.json
            psc1/dist/canonical-source-preparation/*.log
            psc1/dist/canonical-source-preparation/owners/
          if-no-files-found: warn
          retention-days: 90
