name: PSC1 exact candidate installed replay
on:
  push:
    branches: [qualification/psc1-checked-dispatch-20261026]
    paths: [.github/qualification-requests/psc1-checked-dispatch-replay.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-checked-dispatch-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed:
    if: ${{ github.event.commits[1] == null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Validate test syntax and the corrected closed component grammar
        run: |
          node --check scripts/checked-dispatch-installed.mjs
          node --check scripts/replay-checked-dispatch.mjs
          node scripts/checked-component-tests.mjs
      - name: Verify exact candidate ZIP, successful producer step and unchanged production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/replay-checked-dispatch.mjs
      - name: Retain historical cleanup, feature AST and strict formatting gates
        run: |
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
          node scripts/readability-host-check.mjs
      - name: Prepare unchanged pinned external consumers
        run: |
          npm ci --prefix .. --ignore-scripts --include=optional
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          mkdir -p "$RUNNER_TEMP/wasmtime"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz' -o "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime"
          install -m 755 "$(find "$RUNNER_TEMP/wasmtime" -type f -name wasmtime -print -quit)" "$RUNNER_TEMP/wasmtime/wasmtime"
          echo "PSC1_WASMTIME=$RUNNER_TEMP/wasmtime/wasmtime" >> "$GITHUB_ENV"
      - name: Execute new checked dispatch through actual installed runtimes and consumers
        run: node scripts/checked-dispatch-installed.mjs
      - name: Preserve every original installed regression
        run: |
          node scripts/slim-universal-installed.mjs
          node scripts/slim-universal-io-preflight.mjs
          node scripts/checked-publication-installed.mjs
      - name: Preserve all real application and target consumer regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generated-io-installed-applications.mjs
          node scripts/generated-io-installed-candidates.mjs
      - name: Typecheck actual packed public declarations
        run: node scripts/checked-publication-types.mjs
      - name: Mark the exact bytes qualified only after every installed gate succeeds
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const file='dist/slim-universal/replay-provenance.json',p=JSON.parse(fs.readFileSync(file));
          const actual=JSON.parse(fs.readFileSync('dist/slim-universal/checked-dispatch.json'));
          assert.equal(actual.status,'passed');assert.equal(actual.rootSha256,p.input.rootSha256);
          p.status='qualified-exact-candidate-installed';p.newDispatch='passed';p.previousInstalledGates='passed';p.actualApplications='passed';p.packedTypes='passed';
          fs.writeFileSync(file,JSON.stringify(p,null,2)+'\n');
          console.log('PSC1_EXACT_CANDIDATE_QUALIFIED '+JSON.stringify({sourceCommit:p.input.sourceCommit,testedCommit:p.testedCommit,rootSha256:p.input.rootSha256}));
          JS
      - name: Archive complete immutable stores and application evidence
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          const out=path.resolve('dist/slim-universal');fs.mkdirSync(out,{recursive:true});
          for(const [i,name]of fs.readdirSync(os.tmpdir()).filter(n=>n.startsWith('psc1-checked-publication-')||n.startsWith('psc1-dispatch-installed-')).sort().entries()){
            const root=path.join(os.tmpdir(),name),st=fs.lstatSync(root);assert.ok(st.isDirectory()&&!st.isSymbolicLink());
            const names=fs.readdirSync(root).filter(n=>['stores','io-stores','io','components','cli','global-stores','records.json','sdk-negative','rust-sdk-negative','consumer.mjs','lifetime.json'].includes(n));
            if(names.length){const r=spawnSync('tar',['czf',path.join(out,'replay-stores-'+i+'.tar.gz'),'-C',root,...names],{encoding:'utf8',timeout:240000,maxBuffer:32*1024*1024});assert.equal(r.status,0,r.stderr);}
          }
          const apps=path.join(out,'installed-applications');
          if(fs.existsSync(apps)){const r=spawnSync('tar',['czf',path.join(out,'installed-applications-evidence.tar.gz'),'-C',out,'installed-applications'],{encoding:'utf8',timeout:240000,maxBuffer:32*1024*1024});assert.equal(r.status,0,r.stderr);}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-checked-dispatch-replay-${{ github.sha }}
          path: |
            psc1/dist/slim-universal/tarballs/
            psc1/dist/slim-universal/*qualification*.json
            psc1/dist/slim-universal/checked-*.json
            psc1/dist/slim-universal/package-receipt.json
            psc1/dist/slim-universal/replay-provenance.json
            psc1/dist/slim-universal/io-adapter-preflight.json
            psc1/dist/slim-universal/compiler-kernel-admission.json
            psc1/dist/slim-universal/*.tar.gz
            psc1/dist/readability/host.json
          retention-days: 90
