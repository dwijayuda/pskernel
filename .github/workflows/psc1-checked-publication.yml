name: PSC1 transactional publication and checked output
on:
  push:
    branches: [feat/psc1-portable-checked-publication-20261026]
    paths: ['psc1/host-tools/transactional-publication.mjs', 'psc1/scripts/transactional-publication-tests.mjs', '.github/workflows/psc1-checked-publication.yml']
permissions:
  contents: read
jobs:
  transactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: node scripts/transactional-publication-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-transactional-publication-${{ github.sha }}
          path: psc1/dist/transactional-publication/
          retention-days: 90
