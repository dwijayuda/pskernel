name: PSC1 exact-candidate checked-target diagnostic
on:
  push:
    branches: ['diagnostic/psc1-cli-targets-20261027']
    paths: ['.github/workflows/psc1-cli-target-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: dwijayuda/pskernel
          run-id: 40442145356
          name: psc1-cli-runtime-inputs-dfb9507ad8700a24a503a4e52bda00f963af279d
          path: psc1/dist/slim-universal
      - name: Reproduce original installed watch driver with live failure diagnostics
        working-directory: psc1
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          export PSC1_TEST_RUST_ROOT="$(rustup run 1.90.0 rustc --print sysroot)"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='test/installed/watch.test.mjs';let source=fs.readFileSync(file,'utf8');
          const start=source.indexOf('async function receipt('),end=source.indexOf('async function failed(',start);
          if(start<0||end<0)throw Error('watch diagnostic fixture drift');
          source=source.slice(0,start)+"async function receipt(state, after) {\n  await until(() => {\n    if (state.caseArgs?.includes('--target') && state.events.some(e=>e.event.startsWith('failed')) &&\n        !state.diagnostics.every(d=>/WATCH_SUPERSEDED|INPUT_CHANGED/.test(d.message)))\n      throw Error('WATCH_ACTUAL_FAILURE: '+state.stderr);\n    return state.receipts.length > after || state.exit;\n  }, 'current state follows in receipt failure handler').catch(error=>{\n    console.error('WATCH_LIVE_DIAGNOSTICS '+state.stderr);throw error;\n  });\n  assert.equal(state.exit, undefined, state.stderr);\n  return state.receipts[after];\n}\n"+source.slice(end);
          source=source.replace('function watch(args, cwd, runtime = f.runtime) {',
            "function watch(args, cwd, runtime = f.runtime) { console.log('WATCH_CASE '+JSON.stringify({args,cwd,runtime}));");
          source=source.replace('const state = {child,', 'const state = {caseArgs:args,child,');
          fs.writeFileSync(file,source);
          JS
          node test/installed/watch.test.mjs
