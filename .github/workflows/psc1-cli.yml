name: PSC1 project CLI and installed toolchain qualification
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - .github/workflows/psc1-cli.yml
      - psc1/npm-cli/**
      - psc1/host-tools/**
      # Additive pilot has its own admitted package/consumer workflow and is not
      # imported by the production CLI. Shared host changes still run this gate.
      - '!psc1/host-tools/modular/**'
      # M4 uses executable graph verification/selection in the checked host;
      # these files now run this preserved reference CLI gate as well.
      - psc1/scripts/**/*.mjs
      - psc1/test/host/**
      - psc1/test/installed/**
      - psc1/docs/guides/cli.md
      - psc1/docs/PSC1_CHECKED_DISPATCH_QUALIFICATION_2026-10-26.json
      - psc1/scripts/slim-universal-input.json
      - psc1/NPM_DISTRIBUTION_CONTRACT.json
      - psc1/BACKEND_PROVIDER_CONTRACT.json
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Exercise actual source capture and CLI subprocesses before assembly
        run: |
          node scripts/ci/repository-layout.mjs
          node test/host/process-location.test.mjs
          node --check npm-cli/proofscript-cli.mjs
          node --check npm-cli/cli-project.mjs
          node --check npm-cli/cli-watch.mjs
          node --check npm-cli/cli-watch-worker.mjs
          node test/host/runtime-policy.test.mjs
          node test/host/license.test.mjs
          node --check scripts/cli-package.mjs
          node --check scripts/cli-installed.mjs
          node scripts/cli-source-tests.mjs
      - name: Preserve historical host AST and strict formatting checks
        run: |
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
          node scripts/readability-host-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-cli-source-${{ github.sha }}
          path: |
            psc1/dist/cli/
            psc1/dist/readability/
          retention-days: 90
  installed:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Assemble host-only candidate with every existing payload byte unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-cli-runtime-inputs-${{ github.sha }}
          path: |
            psc1/dist/slim-universal/tarballs/
            psc1/dist/slim-universal/package-receipt.json
          retention-days: 90
      - name: Verify Apache-2.0 and retained third-party notices in actual tarballs
        run: node test/installed/license.test.mjs
      - name: Real offline local/global project workflow and npm script execution
        run: node scripts/cli-installed.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Qualify actual Bun compiler and live watch before expensive regression gates
        run: |
          bun --no-install --no-macros --no-env-file test/host/runtime-policy.test.mjs
          export PSC1_TEST_RUNTIME="$(command -v bun)"
          node test/installed/runtime-compatibility.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-runtime-evidence-bun-current-${{ github.sha }}
          path: psc1/dist/cli/runtime/
          retention-days: 90
      - name: Prepare unchanged external consumers for existing full regression gates
        run: |
          npm ci --prefix .. --ignore-scripts --include=optional
          # Ephemeral runner SDKs can have the same components in a different
          # bookkeeping order. Install the exact minimal SDK afresh; retain every pin.
          rustup toolchain uninstall 1.90.0
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';import {pathToFileURL} from 'node:url';
          const root=path.resolve('dist/slim-universal/package');
          const d=JSON.parse(fs.readFileSync(path.join(root,'UNIVERSAL_DISTRIBUTION.json')));
          const {verifyFile}=await import(pathToFileURL(path.join(root,'host-tools/installed-engine-resolver.mjs')).href);
          const result=spawnSync('rustup',['run','1.90.0','rustc','--print','sysroot'],{encoding:'utf8',timeout:10000});
          assert.equal(result.error,undefined);assert.equal(result.status,0,result.stderr);
          const sdk=result.stdout.trim(),pins=d.targetConsumers.rust.toolchain.files;
          assert.ok(path.isAbsolute(sdk));assert.equal(pins.length,61);
          // Rustup installs minimal-profile components concurrently; bookkeeping
          // line order can vary. Restore only an exact permutation whose bytes
          // match the already-qualified pin, after every other resource matches.
          const componentPin=pins.find(pin=>pin.path==='lib/rustlib/components');
          assert.ok(componentPin);
          for(const pin of pins.filter(pin=>pin!==componentPin))verifyFile(sdk,pin,512*1024*1024);
          const componentFile=path.join(sdk,componentPin.path),before=fs.readFileSync(componentFile);
          const crypto=await import('node:crypto');
          const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          if(digest(before)!==componentPin.sha256){
            assert.equal(fs.realpathSync(componentFile),componentFile);
            assert.ok(fs.lstatSync(componentFile).isFile());assert.ok(before.length<4096);
            const text=before.toString('utf8');assert.ok(text.endsWith('\n'));
            const lines=text.slice(0,-1).split('\n');
            assert.deepEqual([...lines].sort(),['cargo-x86_64-unknown-linux-gnu','rust-std-x86_64-unknown-linux-gnu','rustc-x86_64-unknown-linux-gnu'].sort());
            const permutations=values=>values.length===0?[[]]:values.flatMap((v,i)=>
              permutations(values.filter((_,j)=>i!==j)).map(rest=>[v,...rest]));
            const candidates=permutations(lines).map(values=>Buffer.from(values.join('\n')+'\n'));
            const matching=candidates.filter(bytes=>bytes.length===componentPin.bytes&&digest(bytes)===componentPin.sha256);
            assert.equal(matching.length,1,'no unique exact pinned component ordering');
            assert.deepEqual(fs.readFileSync(componentFile),before);
            fs.writeFileSync(componentFile,matching[0],{flag:'r+'});
            console.log('PSC1_CLI_RUST_METADATA_RESTORED '+JSON.stringify({beforeSha256:digest(before),afterSha256:digest(matching[0]),beforeLines:lines,afterLines:matching[0].toString().trimEnd().split('\n')}));
          }
          for(const pin of pins)verifyFile(sdk,pin,512*1024*1024);
          const receipt={schema:'psc1-cli-rust-sdk/1',testedCommit:process.env.GITHUB_SHA,status:'passed',sdk,resourcePins:pins};
          fs.mkdirSync('dist/cli',{recursive:true});fs.writeFileSync('dist/cli/rust-sdk.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('PSC1_CLI_RUST_SDK '+JSON.stringify({status:'passed',resources:pins.length,components:pins.find(p=>p.path==='lib/rustlib/components')}));
          JS
          mkdir -p "$RUNNER_TEMP/wasmtime"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz' -o "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime"
          install -m 755 "$(find "$RUNNER_TEMP/wasmtime" -type f -name wasmtime -print -quit)" "$RUNNER_TEMP/wasmtime/wasmtime"
          echo "PSC1_WASMTIME=$RUNNER_TEMP/wasmtime/wasmtime" >> "$GITHUB_ENV"
      - name: Real installed watch, edits, refusals, superseded attempts and target consumers
        run: |
          export PSC1_TEST_RUST_ROOT="$(rustup run 1.90.0 rustc --print sysroot)"
          export PSC1_TEST_BUN_RUNTIME="$(command -v bun)"
          node test/installed/watch.test.mjs
      - name: Execute unchanged real applications against the exact frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-application-regressions.mjs
      - name: Preserve component grammar and ABI refusals
        run: node scripts/checked-component-tests.mjs
      - name: Preserve transactional publication regressions
        run: node scripts/transactional-publication-tests.mjs
      - name: Preserve checked dispatch regressions
        run: node scripts/checked-dispatch-installed.mjs
      - name: Preserve slim universal installed regressions
        run: node scripts/slim-universal-installed.mjs
      - name: Preserve installed IO adapter preflight
        run: node scripts/slim-universal-io-preflight.mjs
      - name: Preserve checked publication cases and refusals
        run: node scripts/checked-publication-installed.mjs
      - name: Preserve all actual application and target consumer regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generated-io-installed-candidates.mjs
          node scripts/checked-publication-types.mjs
      - name: Qualify candidate only after all previous and new gates pass
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const file='dist/slim-universal/package-receipt.json',r=JSON.parse(fs.readFileSync(file));
          assert.equal(JSON.parse(fs.readFileSync('dist/cli/installed.json')).status,'passed');
          assert.equal(JSON.parse(fs.readFileSync('dist/cli/watch.json')).status,'passed');
          assert.equal(JSON.parse(fs.readFileSync('dist/cli/license.json')).status,'passed');
          for(const f of ['installed-qualification.json','checked-dispatch.json','checked-publication.json','checked-publication-types.json'])
            assert.equal(JSON.parse(fs.readFileSync('dist/slim-universal/'+f)).status,'passed');
          r.scope='qualified Linux runtime/watch host milestone; unchanged compiler/kernel/provider payloads; independent runtime matrix required';
          r.cliQualification='passed';r.previousInstalledAndApplicationGates='passed';
          fs.writeFileSync(file,JSON.stringify(r,null,2)+'\n');
          console.log('PSC1_CLI_QUALIFIED '+JSON.stringify({commit:process.env.GITHUB_SHA,sha256:r.sha256,bytes:r.bytes,version:r.version}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-cli-toolchain-${{ github.sha }}
          path: |
            psc1/dist/cli/
            psc1/dist/slim-universal/tarballs/
            psc1/dist/slim-universal/*qualification*.json
            psc1/dist/slim-universal/checked-*.json
            psc1/dist/slim-universal/package-receipt.json
            psc1/dist/slim-universal/io-adapter-preflight.json
            psc1/dist/slim-universal/compiler-kernel-admission.json
            psc1/dist/slim-universal/cli-frozen-application-stores.tar.gz
            psc1/dist/transactional-publication/
          retention-days: 90

  runtime:
    needs: installed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: node22-older-refusal, node: '22.0.0', bun: '', negative: '1'}
          - {label: node-minimum, node: '22.23.3', bun: '', negative: ''}
          - {label: node24, node: '24', bun: '', negative: ''}
          - {label: node26, node: '26', bun: '', negative: ''}
          - {label: bun-older-refusal, node: '22.23.3', bun: '1.4.0', negative: '1'}
          - {label: node20-refusal, node: '20', bun: '', negative: '1'}
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun != ''
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/download-artifact@v4
        with:
          name: psc1-cli-runtime-inputs-${{ github.sha }}
          path: psc1/dist/slim-universal
      - name: Actual installed runtime and all four compiler engines, both grammars
        env:
          PSC1_EXPECT_RUNTIME_REFUSAL: ${{ matrix.negative }}
        run: |
          if [ -n '${{ matrix.bun }}' ]; then
            export PSC1_TEST_RUNTIME="$(command -v bun)"
            if [ -z '${{ matrix.negative }}' ]; then
              bun --no-install --no-macros --no-env-file test/host/runtime-policy.test.mjs
            fi
          elif [ -z '${{ matrix.negative }}' ]; then
            node test/host/runtime-policy.test.mjs
          fi
          node test/installed/runtime-compatibility.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-runtime-evidence-${{ matrix.label }}-${{ github.sha }}
          path: psc1/dist/cli/runtime/
          retention-days: 90

  installable:
    needs: [installed, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-cli-runtime-inputs-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: psc1-runtime-evidence-*-${{ github.sha }}
          merge-multiple: true
          path: runtime-evidence
      - name: Seal actual runtime evidence and select the small SDK-free installable root
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';import {execFileSync} from 'node:child_process';
          const r=JSON.parse(fs.readFileSync('candidate/package-receipt.json'));
          const rows=fs.readdirSync('runtime-evidence').filter(f=>f.endsWith('.json')).map(f=>JSON.parse(fs.readFileSync('runtime-evidence/'+f)));
          assert.equal(rows.length,7);
          for(const row of rows){
            assert.equal(row.testedCommit,process.env.GITHUB_SHA);
            assert.ok(['passed','passed-negative'].includes(row.status));
            if(row.status==='passed'){assert.equal(row.cases.length,8);assert.equal(row.watchCases.length,2);}
          }
          const input=fs.readFileSync('candidate/tarballs/'+r.tarball);
          assert.equal(crypto.createHash('sha256').update(input).digest('hex'),r.sha256);
          fs.mkdirSync('installable/tarballs',{recursive:true});
          fs.writeFileSync('installable/tarballs/'+r.tarball,input);
          r.status='qualified-linux-runtime-watch';r.runtimeQualification='passed';
          assert.equal(r.projectLicense,'Apache-2.0');r.licensing.status='passed-installed-gate';
          for(const name of ['LICENSE','NOTICE'])fs.writeFileSync('installable/'+name,execFileSync('tar',['xOf','candidate/tarballs/'+r.tarball,'package/'+name]));
          r.scope='Linux installed watch and existing regressions; actual Node/Bun runtime evidence; unchanged frozen compiler/kernel payloads';
          r.runtimeEvidence=rows.map(row=>({status:row.status,versions:row.versions,executableSha256:row.executableSha256}));
          fs.writeFileSync('installable/package-receipt.json',JSON.stringify(r,null,2)+'\n');
          fs.cpSync('runtime-evidence','installable/runtime-evidence',{recursive:true});
          fs.writeFileSync('installable/INSTALL.txt','Requires Node >=22.23.3, or Bun >=1.4.4 as explicitly qualified.\n\nExtract this ZIP. In its tarballs directory run:\n  npm install --offline --ignore-scripts ./'+r.tarball+'\n  npm exec -- psc --help\n\nThe default compiler and independent Lean Wasm checker are included. Optional output SDKs and Rust/compiler-Wasm engines are in the full toolchain artifact from this same workflow.\nProject-owned components: Apache-2.0. Third-party notices retained. No registry publication; Linux qualification only.\n');
          console.log('PSC1_INSTALLABLE_ROOT '+JSON.stringify({tarball:r.tarball,sha256:r.sha256,bytes:r.bytes,runtimes:r.runtimeEvidence}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: proofscript-installable-0.1.0-psc1.11-${{ github.sha }}
          path: installable/
          retention-days: 90
