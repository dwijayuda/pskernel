name: PSC1 project CLI and installed toolchain qualification
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - .github/workflows/psc1-cli.yml
      - psc1/npm-cli/**
      - psc1/host-tools/**
      - psc1/scripts/**/*.mjs
      - psc1/test/host/**
      - psc1/test/installed/**
      - psc1/docs/guides/cli.md
      - psc1/docs/PSC1_CHECKED_DISPATCH_QUALIFICATION_2026-10-26.json
      - psc1/scripts/slim-universal-input.json
      - psc1/NPM_DISTRIBUTION_CONTRACT.json
      - psc1/BACKEND_PROVIDER_CONTRACT.json
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Exercise actual source capture and CLI subprocesses before assembly
        run: |
          node scripts/ci/repository-layout.mjs
          node test/host/process-location.test.mjs
          node --check npm-cli/proofscript-cli.mjs
          node --check npm-cli/cli-project.mjs
          node --check npm-cli/cli-watch.mjs
          node --check npm-cli/cli-watch-worker.mjs
          node test/host/runtime-policy.test.mjs
          node --check scripts/cli-package.mjs
          node --check scripts/cli-installed.mjs
          node scripts/cli-source-tests.mjs
      - name: Preserve historical host AST and strict formatting checks
        run: |
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
          node scripts/readability-host-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-cli-source-${{ github.sha }}
          path: |
            psc1/dist/cli/
            psc1/dist/readability/
          retention-days: 90
  installed:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Assemble host-only candidate with every existing payload byte unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-cli-runtime-inputs-${{ github.sha }}
          path: |
            psc1/dist/slim-universal/tarballs/
            psc1/dist/slim-universal/package-receipt.json
          retention-days: 90
      - name: Real offline local/global project workflow and npm script execution
        run: node scripts/cli-installed.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Qualify actual Bun compiler and live watch before expensive regression gates
        run: |
          bun --no-install --no-macros --no-env-file test/host/runtime-policy.test.mjs
          export PSC1_TEST_RUNTIME="$(command -v bun)"
          node test/installed/runtime-compatibility.test.mjs
      - name: Prepare unchanged external consumers for existing full regression gates
        run: |
          npm ci --prefix .. --ignore-scripts --include=optional
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          mkdir -p "$RUNNER_TEMP/wasmtime"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz' -o "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime"
          install -m 755 "$(find "$RUNNER_TEMP/wasmtime" -type f -name wasmtime -print -quit)" "$RUNNER_TEMP/wasmtime/wasmtime"
          echo "PSC1_WASMTIME=$RUNNER_TEMP/wasmtime/wasmtime" >> "$GITHUB_ENV"
      - name: Real installed watch, edits, refusals, superseded attempts and target consumers
        run: |
          export PSC1_TEST_RUST_ROOT="$(rustup run 1.90.0 rustc --print sysroot)"
          node test/installed/watch.test.mjs
      - name: Execute unchanged real applications against the exact frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-application-regressions.mjs
      - name: Preserve every existing installed dispatch and publication regression
        run: |
          node scripts/checked-component-tests.mjs
          node scripts/transactional-publication-tests.mjs
          node scripts/checked-dispatch-installed.mjs
          node scripts/slim-universal-installed.mjs
          node scripts/slim-universal-io-preflight.mjs
          node scripts/checked-publication-installed.mjs
      - name: Preserve all actual application and target consumer regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generated-io-installed-candidates.mjs
          node scripts/checked-publication-types.mjs
      - name: Qualify candidate only after all previous and new gates pass
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const file='dist/slim-universal/package-receipt.json',r=JSON.parse(fs.readFileSync(file));
          assert.equal(JSON.parse(fs.readFileSync('dist/cli/installed.json')).status,'passed');
          assert.equal(JSON.parse(fs.readFileSync('dist/cli/watch.json')).status,'passed');
          for(const f of ['installed-qualification.json','checked-dispatch.json','checked-publication.json','checked-publication-types.json'])
            assert.equal(JSON.parse(fs.readFileSync('dist/slim-universal/'+f)).status,'passed');
          r.scope='qualified Linux runtime/watch host milestone; unchanged compiler/kernel/provider payloads; independent runtime matrix required';
          r.cliQualification='passed';r.previousInstalledAndApplicationGates='passed';
          fs.writeFileSync(file,JSON.stringify(r,null,2)+'\n');
          console.log('PSC1_CLI_QUALIFIED '+JSON.stringify({commit:process.env.GITHUB_SHA,sha256:r.sha256,bytes:r.bytes,version:r.version}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-cli-toolchain-${{ github.sha }}
          path: |
            psc1/dist/cli/
            psc1/dist/slim-universal/tarballs/
            psc1/dist/slim-universal/*qualification*.json
            psc1/dist/slim-universal/checked-*.json
            psc1/dist/slim-universal/package-receipt.json
            psc1/dist/slim-universal/io-adapter-preflight.json
            psc1/dist/slim-universal/compiler-kernel-admission.json
            psc1/dist/slim-universal/cli-frozen-application-stores.tar.gz
            psc1/dist/transactional-publication/
          retention-days: 90

  runtime:
    needs: installed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: node22-older-refusal, node: '22.0.0', bun: '', negative: '1'}
          - {label: node-minimum, node: '22.23.3', bun: '', negative: ''}
          - {label: node24, node: '24', bun: '', negative: ''}
          - {label: node26, node: '26', bun: '', negative: ''}
          - {label: bun-minimum, node: '22.23.3', bun: '1.4.0', negative: ''}
          - {label: node20-refusal, node: '20', bun: '', negative: '1'}
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun != ''
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/download-artifact@v4
        with:
          name: psc1-cli-runtime-inputs-${{ github.sha }}
          path: psc1/dist/slim-universal
      - name: Actual installed runtime and all four compiler engines, both grammars
        env:
          PSC1_EXPECT_RUNTIME_REFUSAL: ${{ matrix.negative }}
        run: |
          if [ -n '${{ matrix.bun }}' ]; then
            export PSC1_TEST_RUNTIME="$(command -v bun)"
            bun --no-install --no-macros --no-env-file test/host/runtime-policy.test.mjs
          elif [ -z '${{ matrix.negative }}' ]; then
            node test/host/runtime-policy.test.mjs
          fi
          node test/installed/runtime-compatibility.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-cli-runtime-${{ matrix.label }}-${{ github.sha }}
          path: psc1/dist/cli/runtime/
          retention-days: 90
