name: PSC1 exact compiler closure admission and strict IR

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: psc1-compiler-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selected-closure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: semantic-compiler
            assurance: checked
          - phase: directjs-compiler
            assurance: ordinary-checked
          - phase: rust-compiler
            assurance: ordinary-checked
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Cache pinned Lean installation
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Cache exact-source native build objects
        uses: actions/cache@v4
        with:
          path: psc1/.lake
          key: psc1-lake-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/lake-manifest.json', 'psc1/**/*.lean') }}
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build owned source probe with independent checker
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lean --version; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1_source_census_probe
      - name: Check both exact source lanes
        run: |
          set -euo pipefail
          node scripts/compiler-closure-contract-tests.mjs
          node scripts/compiler-source-census-contract-tests.mjs
          node scripts/compiler-source-census.mjs --strict-phase ${{ matrix.phase }}
      - name: Enforce the live checked-only partial-source boundary
        if: ${{ matrix.phase == 'directjs-compiler' }}
        run: |
          set -euo pipefail
          node scripts/compiler-closure-assurance-tests.mjs
      - name: Independently admit and strictly validate the whole selected closure
        run: |
          set -euo pipefail
          node scripts/compiler-closure-qualification.mjs --phase ${{ matrix.phase }} --assurance ${{ matrix.assurance }}
      - name: Retain exact inputs, admission bytes and stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-compiler-closure-${{ matrix.phase }}-${{ matrix.assurance }}-${{ github.sha }}
          path: |
            psc1/dist/scoped-correctness/compiler-source-census/
            psc1/dist/scoped-correctness/compiler-closure/
          if-no-files-found: warn
          retention-days: 14
