name: PSC1 complete compiler graph through packaged official kernels
on:
  push:
    branches: [qualification/psc1-io-compiler-kernel-20261026]
    paths:
      - .github/workflows/psc1-compiler-kernel-probe.yml
      - psc1/scripts/crosscheck-compiler-admissions.mjs
      - psc1/scripts/compiled-kernel-probe.mjs
permissions:
  contents: read
  actions: read
jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check complete actual compiler graph and a real kernel type error
        working-directory: psc1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compiled-kernel-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-compiler-kernel-admission-${{ github.sha }}
          path: |
            psc1/dist/compiler-kernel-probe/qualification.json
            psc1/dist/compiler-kernel-probe/compiler-admissions.json
          if-no-files-found: warn
          retention-days: 90
