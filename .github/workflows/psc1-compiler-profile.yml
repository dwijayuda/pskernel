name: PSC1 fixed compiler workload stage profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc1-compiler-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        implementation: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: implementation
      - uses: actions/checkout@v4
        with:
          ref: adcb815733aca23d3d27e7e0ae4cbc589ba56000
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the same IO profiler against the selected implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.implementation }}" = baseline ]; then
            cp implementation/psc1/scripts/CompilerStageProfile.lean reference/psc1/scripts/CompilerStageProfile.lean
            cat >> reference/psc1/lakefile.lean <<'LEAN'

          lean_exe psc1_compiler_profile where
            srcDir := "scripts"
            root := `CompilerStageProfile
          LEAN
            build=reference/psc1
          else
            build=implementation/psc1
          fi
          (cd "$build" && node packages/pskernel-lean/host/check-pin.mjs && lake build psc1_compiler_profile)
          echo "PROFILE_IMPLEMENTATION=$build" >> "$GITHUB_ENV"
      - name: Profile the identical captured immutable compiler workload
        shell: bash
        run: |
          set -euo pipefail
          node implementation/psc1/scripts/compiler-stage-profile.mjs "$PROFILE_IMPLEMENTATION" reference/psc1 evidence "${{ matrix.implementation }}"
      - name: Retain phase progress even on timeout or refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-compiler-profile-${{ matrix.implementation }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  compare-profile:
    needs: profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-compiler-profile-baseline-${{ github.sha }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: psc1-compiler-profile-candidate-${{ github.sha }}
          path: candidate
      - name: Require fixed-input completion and validated actual fusion output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const baseline=JSON.parse(fs.readFileSync('baseline/receipt.json','utf8'));
          const candidate=JSON.parse(fs.readFileSync('candidate/receipt.json','utf8'));
          assert.equal(baseline.requestSha256,candidate.requestSha256);
          assert.equal(candidate.completed,true,'candidate must complete actual final candidate encoding');
          for(const key of ['admissions.json','original-ir.json','specialized-ir.json'])
            assert.equal(baseline.identities[key],candidate.identities[key],'same graph/original/pre-fusion IR:'+key);
          assert.ok(candidate.identities['closed-ir.json']);
          assert.ok(candidate.identities['source.mjs']);
          assert.equal(baseline.timeoutMs,240000);
          assert.equal(candidate.timeoutMs,240000);
          assert.equal(candidate.queueBudget,16384);
          const comparison={schema:'psc1-compiler-transport-comparison/1',baseline,candidate,
            baselineCompleted:baseline.completed,artifactRelation:'same exact inputs; typed fusion output may differ; runtime checks separate',formalPreservation:'not-provided',
            actualG1:'separate-generated-compiler-diagnostic'};
          fs.writeFileSync('comparison.json',JSON.stringify(comparison,null,2)+'\n');
          console.log('PSC1_COMPILER_TRANSPORT_COMPARISON: '+JSON.stringify(comparison));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-compiler-transport-comparison-${{ github.sha }}
          path: comparison.json
          retention-days: 14
