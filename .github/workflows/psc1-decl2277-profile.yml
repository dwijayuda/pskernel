name: PSC1 declaration 2277 profile

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/psc1-decl2277-ops]
    paths:
      - ".github/workflows/psc1-decl2277-profile.yml"
      - "psc1-kernel/**"
      - "oracle/replay-probe/DependencyExport.lean"

permissions:
  contents: read

concurrency:
  group: psc1-decl2277-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - name: Build PSC1 native replay executable
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Export hot declaration dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lean oracle/replay-probe/DependencyExport.lean
          lean --run oracle/replay-probe/DependencyExport.lean Std \
            Lean.Omega.Decidable.not_iff_iff_and_not_or_not_and \
            > /tmp/hot2277.ndjson
          echo "bytes=$(wc -c < /tmp/hot2277.ndjson)"
          echo "lines=$(wc -l < /tmp/hot2277.ndjson)"
      - name: Native replay hot declaration closure
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 240s \
            .lake/build/bin/psc1_replay --progress /tmp/hot2277.ndjson
