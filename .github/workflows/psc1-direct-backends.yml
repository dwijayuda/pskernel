name: PSC1 direct backend qualification

on:
  workflow_dispatch:
  push:
    branches:
      - psc1/direct-multibackend-v1
    paths:
      - psc1/**
      - .github/workflows/psc1-direct-backends.yml

permissions:
  contents: read

jobs:
  lean-backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build PSC1 independent backend libraries
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake build PsCompilerIr PsBackendJs PsBackendRust PsBackendWasm
      - name: Build existing PSC1 CLI
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lake build psc1

      - name: Smoke PSC1 direct JS, Rust and core Wasm outputs
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/psc1-direct.lean <<'EOF'
          def idNat (x : Nat) : Nat := x
          EOF
          lake exe psc1 build /tmp/psc1-direct.lean --target js --out /tmp/psc1-direct.js
          test -s /tmp/psc1-direct.js
          test -s /tmp/psc1-direct.d.ts
          test -s /tmp/psc1-direct.js.map
          node --check /tmp/psc1-direct.js
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/psc1-direct.js.map","utf8")); if(m.version!==3||m.sources[0]!=="psc1-direct.lean"||!m.mappings||!m.sourcesContent[0].includes("def idNat"))process.exit(1)'
          cp /tmp/psc1-direct.js /tmp/psc1-direct.mjs
          node --input-type=module -e 'import("/tmp/psc1-direct.mjs").then(m=>{if(m.idNat(42n)!==42n)process.exit(1)})'
          lake exe psc1 build /tmp/psc1-direct.lean --target rust --out /tmp/psc1-direct.rs
          test -s /tmp/psc1-direct.rs
          mkdir -p /tmp/psc1-direct-cargo/src
          cp /tmp/psc1-direct.rs /tmp/psc1-direct-cargo/src/lib.rs
          cat > /tmp/psc1-direct-cargo/Cargo.toml <<'TOML'
          [package]
          name = "psc1-direct-smoke"
          version = "0.0.0"
          edition = "2021"
          publish = false
          [lib]
          path = "src/lib.rs"
          [dependencies]
          num-bigint = "=0.4.6"
          num-traits = "=0.2.19"
          TOML
          cargo build --manifest-path /tmp/psc1-direct-cargo/Cargo.toml --release
          mkdir -p /tmp/psc1-direct-cargo/tests
          cat >/tmp/psc1-direct-cargo/tests/id.rs <<'RUST'
          use num_bigint::BigUint;

          #[test]
          fn generated_id_nat_executes() {
              let input = BigUint::from(42u32);
              assert_eq!(psc1_direct_smoke::idNat(input.clone()), input);
          }
          RUST
          cargo test --manifest-path /tmp/psc1-direct-cargo/Cargo.toml --release
          lake exe psc1 build /tmp/psc1-direct.lean --target wasm-core --out /tmp/psc1-direct.wasm
          test -s /tmp/psc1-direct.wasm
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync('/tmp/psc1-direct.wasm');
          if (!WebAssembly.validate(bytes)) throw new Error('PSC1_WASM_BINARY_INVALID');
          const { instance } = await WebAssembly.instantiate(bytes);
          if (typeof instance.exports.idNat !== 'function') {
            throw new Error('PSC1_WASM_EXPECTED_EXPORT_MISSING');
          }
          console.log('PSC1_WASM_INSTANTIATE: PASS');
          NODE
          cat >/tmp/psc1-direct-invalid.lean <<'EOF'
          def ill : Nat := true
          EOF
          if lake exe psc1 build /tmp/psc1-direct-invalid.lean --target js --out /tmp/psc1-should-not-emit.js; then
            echo "Ill-typed source unexpectedly emitted DirectJS" >&2
            exit 1
          fi
          test ! -e /tmp/psc1-should-not-emit.js
