name: PSC1 direct backend qualification

on:
  workflow_dispatch:
  push:
    branches:
      - psc1/direct-multibackend-v1
    paths:
      - psc1/**
      - .github/workflows/psc1-direct-backends.yml

permissions:
  contents: read

jobs:
  lean-backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install SHA-256-pinned wasm-tools 1.254.0 (Wasm GC + Components)
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz"
          archive="$RUNNER_TEMP/wasm-tools-1.254.0-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "d0efb16c9c859137b7ab3e99151c299cd47caee106ed4594561002f7a04945bd  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/psc1-wasm-tools-unpack" "$RUNNER_TEMP/psc1-bin"
          tar xzf "$archive" -C "$RUNNER_TEMP/psc1-wasm-tools-unpack"
          binary="$(find "$RUNNER_TEMP/psc1-wasm-tools-unpack" -type f -name wasm-tools -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/psc1-bin/wasm-tools"
          echo "$RUNNER_TEMP/psc1-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/psc1-bin/wasm-tools" --version
      - name: Install SHA-256-pinned Wasmtime 49.0.4 (component runtime)
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz"
          archive="$RUNNER_TEMP/wasmtime-v49.0.4-x86_64-linux.tar.xz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/psc1-wasmtime-unpack"
          tar xJf "$archive" -C "$RUNNER_TEMP/psc1-wasmtime-unpack"
          binary="$(find "$RUNNER_TEMP/psc1-wasmtime-unpack" -type f -name wasmtime -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$RUNNER_TEMP/psc1-bin/wasmtime"
          "$RUNNER_TEMP/psc1-bin/wasmtime" --version
      - name: Build PSC1 independent backend libraries
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake build PsCompilerIr PsBackendJs PsBackendRust PsBackendWasm
      - name: Build existing PSC1 CLI
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lake build psc1

      - name: Smoke PSC1 direct JS, Rust and core Wasm outputs
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/psc1-direct.lean <<'EOF'
          def idNat (x : Nat) : Nat := x
          EOF
          lake exe psc1 build /tmp/psc1-direct.lean --target js --out /tmp/psc1-direct.js
          test -s /tmp/psc1-direct.js
          test -s /tmp/psc1-direct.d.ts
          test -s /tmp/psc1-direct.js.map
          node --check /tmp/psc1-direct.js
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/psc1-direct.js.map","utf8")); if(m.version!==3||m.sources[0]!=="psc1-direct.lean"||!m.mappings||!m.sourcesContent[0].includes("def idNat"))process.exit(1)'
          cp /tmp/psc1-direct.js /tmp/psc1-direct.mjs
          node --input-type=module -e 'import("/tmp/psc1-direct.mjs").then(m=>{if(m.idNat(42n)!==42n)process.exit(1)})'
          lake exe psc1 build /tmp/psc1-direct.lean --target rust --out /tmp/psc1-direct.rs
          test -s /tmp/psc1-direct.rs
          mkdir -p /tmp/psc1-direct-cargo/src
          cp /tmp/psc1-direct.rs /tmp/psc1-direct-cargo/src/lib.rs
          cat > /tmp/psc1-direct-cargo/Cargo.toml <<'TOML'
          [package]
          name = "psc1-direct-smoke"
          version = "0.0.0"
          edition = "2021"
          publish = false
          [lib]
          path = "src/lib.rs"
          [dependencies]
          num-bigint = "=0.4.6"
          num-traits = "=0.2.19"
          TOML
          cargo build --manifest-path /tmp/psc1-direct-cargo/Cargo.toml --release
          mkdir -p /tmp/psc1-direct-cargo/tests
          cat >/tmp/psc1-direct-cargo/tests/id.rs <<'RUST'
          use num_bigint::BigUint;

          #[test]
          fn generated_id_nat_executes() {
              let input = BigUint::from(42u32);
              assert_eq!(psc1_direct_smoke::idNat(input.clone()), input);
          }
          RUST
          cargo test --manifest-path /tmp/psc1-direct-cargo/Cargo.toml --release
          lake exe psc1 build /tmp/psc1-direct.lean --target wasm-core --out /tmp/psc1-direct.wasm
          test -s /tmp/psc1-direct.wasm
          lake exe psc1 wat /tmp/psc1-direct.wasm --out /tmp/psc1-direct.wat
          test -s /tmp/psc1-direct.wat
          wasm-tools validate /tmp/psc1-direct.wasm
          wasm-tools parse /tmp/psc1-direct.wat -o /tmp/psc1-direct-roundtrip.wasm
          wasm-tools validate /tmp/psc1-direct-roundtrip.wasm
          node -e 'const fs=require("fs");const b=fs.readFileSync("/tmp/psc1-direct-roundtrip.wasm");if(!WebAssembly.validate(b))process.exit(1)'
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync('/tmp/psc1-direct.wasm');
          if (!WebAssembly.validate(bytes)) throw new Error('PSC1_WASM_BINARY_INVALID');
          const { instance } = await WebAssembly.instantiate(bytes);
          if (typeof instance.exports.idNat !== 'function') {
            throw new Error('PSC1_WASM_EXPECTED_EXPORT_MISSING');
          }
          console.log('PSC1_WASM_INSTANTIATE: PASS');
          NODE
          cat >/tmp/psc1-direct-invalid.lean <<'EOF'
          def ill : Nat := true
          EOF
          if lake exe psc1 build /tmp/psc1-direct-invalid.lean --target js --out /tmp/psc1-should-not-emit.js; then
            echo "Ill-typed source unexpectedly emitted DirectJS" >&2
            exit 1
          fi
          test ! -e /tmp/psc1-should-not-emit.js

          # Both source grammars must reach the same DirectJS runtime.
          cat >/tmp/psc1-direct.ps <<'EOF'
          def idNat(x : Nat) : Nat := x
          EOF
          lake exe psc1 build /tmp/psc1-direct.ps --target js --out /tmp/psc1-direct-ps.js
          test -s /tmp/psc1-direct-ps.js.map
          test -s /tmp/psc1-direct-ps.d.ts
          cp /tmp/psc1-direct-ps.js /tmp/psc1-direct-ps.mjs
          node --input-type=module -e 'import("/tmp/psc1-direct-ps.mjs").then(m=>{if(m.idNat(42n)!==42n)process.exit(1)})'

          # Inspect the actual SourceMap VLQ entries, not merely JSON metadata.
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const map = JSON.parse(readFileSync('/tmp/psc1-direct.js.map', 'utf8'));
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
          const first = map.mappings.split(';').find(line => line.includes(',') || line.length > 0);
          if (!first) throw new Error('PSC1_DIRECT_MAPPING_NOT_EMITTED');
          const segment = first.split(',')[0];
          const fields = [];
          let acc = 0, shift = 0;
          for (const c of segment) {
            const digit = chars.indexOf(c);
            if (digit < 0) throw new Error('PSC1_DIRECT_MAPPING_INVALID_DIGIT');
            acc |= (digit & 31) << shift;
            if (digit & 32) shift += 5;
            else { fields.push((acc & 1) ? -(acc >>> 1) : (acc >>> 1)); acc = 0; shift = 0; }
          }
          if (fields.length !== 4 || fields[1] !== 0 || fields[2] !== 0 || fields[3] !== 0)
            throw new Error('PSC1_DIRECT_MAPPING_INCORRECT_SOURCE_POSITION');
          console.log('PSC1_DIRECT_SOURCE_MAP_ACTUAL_ORIGIN: PASS');
          NODE

          # Unicode block comment changes the source UTF-16 column by one
          # extra code unit; mapped spans must not fall back to empty.
          cat >/tmp/psc1-unicode-map.lean <<'EOF'
          /- 🌍 -/ def answer : Bool := true
          EOF
          lake exe psc1 build /tmp/psc1-unicode-map.lean --target js --out /tmp/psc1-unicode-map.js
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const map=JSON.parse(readFileSync('/tmp/psc1-unicode-map.js.map','utf8'));
          if(!map.mappings || !map.sourcesContent[0].includes('🌍')) throw new Error('PSC1_UNICODE_MAP_EMPTY');
          const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
          const segment=map.mappings.split(';').filter(Boolean)[0].split(',')[0];
          let accumulator=0, shift=0; const parts=[];
          for (const c of segment) {
            const digit=chars.indexOf(c);
            if(digit<0)throw new Error('PSC1_UNICODE_MAP_INVALID_VLQ');
            accumulator |= (digit & 31) << shift;
            if(digit & 32) shift += 5;
            else {parts.push((accumulator&1)?-(accumulator>>>1):(accumulator>>>1)); accumulator=0;shift=0;}
          }
          if(parts.length!==4 || parts[2]!==0 || parts[3]!==9)
            throw new Error('PSC1_UNICODE_MAP_COLUMN_MISMATCH:' + JSON.stringify(parts));
          console.log('PSC1_UNICODE_SOURCE_MAP_UTF16: PASS');
          NODE

          # Execute a scalar Wasm ABI export, separately from reference-valued Nat.
          cat >/tmp/psc1-wasm-scalar.lean <<'EOF'
          def answer : Bool := true
          EOF
          lake exe psc1 build /tmp/psc1-wasm-scalar.lean --target wasm-core --out /tmp/psc1-wasm-scalar.wasm
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const {instance} = await WebAssembly.instantiate(readFileSync('/tmp/psc1-wasm-scalar.wasm'));
          if (instance.exports.answer() !== 1) throw new Error('PSC1_WASM_SCALAR_RUNTIME_MISMATCH');
          console.log('PSC1_WASM_SCALAR_RUNTIME: PASS');
          NODE
          # Core is a different runtime artifact from the WIT component.
          # The component must embed the exact checked scalar ABI export and
          # produce three real, mutually valid .wasm/.wat/.wit outputs.
          lake exe psc1 build /tmp/psc1-wasm-scalar.lean --target wasm-component --export answer --out /tmp/psc1-bool-component.wasm
          test -s /tmp/psc1-bool-component.wasm
          test -s /tmp/psc1-bool-component.wat
          test -s /tmp/psc1-bool-component.wit
          test -s /tmp/psc1-bool-component.core.wasm
          test -s /tmp/psc1-bool-component.core.wat
          wasm-tools validate /tmp/psc1-bool-component.wasm
          wasm-tools parse /tmp/psc1-bool-component.wat -o /tmp/psc1-bool-component-roundtrip.wasm
          wasm-tools validate /tmp/psc1-bool-component-roundtrip.wasm
          wasm-tools component wit /tmp/psc1-bool-component.wasm | grep -q 'answer'
          wasmtime run --invoke 'answer()' /tmp/psc1-bool-component.wasm | tee /tmp/psc1-bool-component-runtime.txt
          grep -q 'true' /tmp/psc1-bool-component-runtime.txt
          echo "PSC1_COMPONENT_RUNTIME_TRUE: PASS"
          grep -q 'answer: func() -> bool;' /tmp/psc1-bool-component.wit
          # Exercise a real component parameter via WAVE, not just a
          # zero-argument exported constant. Input here uses the .ps grammar.
          cat >/tmp/psc1-bool-identity.ps <<'EOF'
          def idbool(b : Bool) : Bool := b
          EOF
          lake exe psc1 build /tmp/psc1-bool-identity.ps --target wasm-component --export idbool --out /tmp/psc1-bool-identity.wasm
          test -s /tmp/psc1-bool-identity.wit
          grep -q 'idbool: func(b: bool) -> bool;' /tmp/psc1-bool-identity.wit
          wasm-tools validate /tmp/psc1-bool-identity.wasm
          wasmtime run --invoke 'idbool(true)' /tmp/psc1-bool-identity.wasm | tee /tmp/psc1-idbool-true.txt
          grep -q 'true' /tmp/psc1-idbool-true.txt
          wasmtime run --invoke 'idbool(false)' /tmp/psc1-bool-identity.wasm | tee /tmp/psc1-idbool-false.txt
          grep -q 'false' /tmp/psc1-idbool-false.txt
          echo "PSC1_COMPONENT_BOOL_ARGUMENT_PARITY: PASS"
          if lake exe psc1 build /tmp/psc1-bool-identity.ps --target wasm-component --export unknown --out /tmp/psc1-bool-unknown.wasm; then
            echo "Unknown WIT export unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e /tmp/psc1-bool-unknown.wasm
          cat >/tmp/psc1-wasm-invalid-abi.lean <<'EOF'
          def count : Nat := 42
          EOF
          if lake exe psc1 build /tmp/psc1-wasm-invalid-abi.lean --target wasm-component --export count --out /tmp/psc1-invalid-component.wasm; then
            echo "Unrepresentable Nat WIT ABI unexpectedly accepted" >&2
            exit 1
          fi
          test ! -e /tmp/psc1-invalid-component.wasm
