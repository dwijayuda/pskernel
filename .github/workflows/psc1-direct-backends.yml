name: PSC1 direct backend qualification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - psc1/direct-multibackend-v1
      - fix/psc1-bounded-hardening-20261020
    paths:
      - psc1/**
      - .github/workflows/psc1-direct-backends.yml
      - .github/workflows/psc1-scoped-correctness.yml

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/psc1-scoped-correctness.yml
