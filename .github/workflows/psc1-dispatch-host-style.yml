name: PSC1 dispatch host formatting proposal
on:
  push:
    branches: [feat/psc1-checked-component-providers-20261026]
    paths: ['.github/workflows/psc1-dispatch-host-style.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
      - name: Return formatting only after exact executable AST correspondence
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const require=createRequire(new URL('./host-tools/package.json',import.meta.url)),prettier=require('prettier'),{parse}=require('@babel/parser');
          const ignored=new Set(['start','end','loc','extra','comments','leadingComments','trailingComments','innerComments']);
          const ast=s=>JSON.parse(JSON.stringify(parse(s,{sourceType:'module'}),(k,v)=>ignored.has(k)?undefined:v));
          const proposal={};
          for(const file of ['host-tools/checked-component.mjs','host-tools/checked-optional-provider.mjs','host-tools/checked-targets.mjs','host-tools/generated-compiler-session.mjs']){
            const source=fs.readFileSync(file,'utf8'),formatted=await prettier.format(source,{parser:'babel',singleQuote:true,printWidth:100});
            assert.deepEqual(ast(source),ast(formatted));proposal[file]=formatted;
          }
          console.log('PSC1_DISPATCH_FORMAT_PROPOSAL='+JSON.stringify(proposal));
          JS
