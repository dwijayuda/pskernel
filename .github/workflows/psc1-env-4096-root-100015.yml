name: PSC1 env4096 root 100015

on:
  workflow_dispatch:
  push:
    branches: [perf/psc1-env-4096]
    paths:
      - ".github/workflows/psc1-env-4096-root-100015.yml"
      - "psc1-kernel/**"

permissions:
  contents: read

jobs:
  root-100015:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build PSC1 Lean replay executable
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Replay Std root 100015
        shell: bash
        env:
          PSC1_LEAN_STD_CHUNK: "1"
          PSC1_LEAN_EXPORT_TIMEOUT_MS: "180000"
          PSC1_LEAN_REPLAY_TIMEOUT_MS: "600000"
          PSC1_LEAN_REPLAY_BIN: "psc1-kernel/.lake/build/bin/psc1_replay"
        run: |
          set -euo pipefail
          /usr/bin/time -f 'env4096-root100015-elapsed=%e env4096-root100015-maxrss-kb=%M' \
            node scripts/psc1-lean-std-release-profile.mjs \
              --label root-100015-env4096 --start 100015 --count 1 --chunk 1
