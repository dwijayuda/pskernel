name: PSC1 Expr.eq cache experiment

on:
  workflow_dispatch:
  push:
    branches: [perf/psc1-lean-expr-eq-cache]
    paths:
      - ".github/workflows/psc1-expr-eq-cache.yml"
      - "psc1-kernel/**"
      - "oracle/replay-probe/DependencyExport.lean"

permissions:
  contents: read

concurrency:
  group: psc1-expr-eq-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build kernel and oracle
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake build psc1_replay
          lake env lean --run PSC1Kernel/Test/Oracle.lean
      - name: Export Std root 100015
        shell: bash
        run: |
          set -euo pipefail
          lean oracle/replay-probe/DependencyExport.lean
          lean --run oracle/replay-probe/DependencyExport.lean Std --root-range 100015 1 > /tmp/root100015.ndjson
          echo "bytes=$(wc -c < /tmp/root100015.ndjson)"
          echo "lines=$(wc -l < /tmp/root100015.ndjson)"
      - name: Replay Std root 100015
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout 600s psc1-kernel/.lake/build/bin/psc1_replay /tmp/root100015.ndjson
