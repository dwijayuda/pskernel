name: PSC1 expression hash regression

on:
  workflow_dispatch:
  push:
    branches: [test/psc1-lean-expr-hash-regression]
    paths:
      - ".github/workflows/psc1-expr-hash-regression.yml"
      - "psc1-kernel/PSC1Kernel/Test/ExprHashSharingSmoke.lean"
      - "psc1-kernel/PSC1Kernel/Expr.lean"
      - "psc1-kernel/PSC1Kernel/Instantiate.lean"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build kernel
        working-directory: psc1-kernel
        run: lake build
      - name: Run expression hash/sharing smoke
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/ExprHashSharingSmoke.lean
