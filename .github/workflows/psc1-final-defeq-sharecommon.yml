name: PSC1 final defeq sharing perf

on:
  workflow_dispatch:
  push:
    branches: [perf/psc1-final-defeq-sharecommon]
    paths:
      - ".github/workflows/psc1-final-defeq-sharecommon.yml"
      - "psc1-kernel/**"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build kernel and replay
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Build oracle-only structure fixture
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/PSC1Kernel/Test
          lake env lean PSC1Kernel/Test/StructureFixture.lean \
            -o .lake/build/lib/lean/PSC1Kernel/Test/StructureFixture.olean
      - name: Run differential oracle
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/Oracle.lean

  root100015:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build replay
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Replay root 100015
        shell: bash
        env:
          PSC1_LEAN_STD_CHUNK: "32"
          PSC1_LEAN_EXPORT_TIMEOUT_MS: "180000"
          PSC1_LEAN_REPLAY_TIMEOUT_MS: "600000"
          PSC1_LEAN_REPLAY_BIN: "psc1-kernel/.lake/build/bin/psc1_replay"
        run: |
          set -euo pipefail
          /usr/bin/time -v node scripts/psc1-lean-std-release-profile.mjs \
            --label root-100015-final-share \
            --start 100015 \
            --count 1
