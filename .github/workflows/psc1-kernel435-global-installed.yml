name: PSC1 fresh global Wasm-default toolchain install
on:
  push:
    branches: [integration/psc1-lean435-kernel-packages-20261025]
    paths: [psc1/scripts/kernel435-global-input.json]
permissions:
  contents: read
  actions: read
jobs:
  global:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Execute actual global bin with native compiler and checker unavailable
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/kernel435-global-installed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-wasm-default-global-qualified-${{ github.sha }}
          path: psc1/dist/kernel435-global/
          retention-days: 90
