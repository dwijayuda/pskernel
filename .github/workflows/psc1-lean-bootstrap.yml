name: PSC1 Lean bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - selfhost/psc1-lean-bootstrap
    paths:
      - selfhost/**
      - docs/selfhost/PSC1_LEAN_BOOTSTRAP.md
      - .github/workflows/psc1-lean-bootstrap.yml
      - packages/syntax/**
      - packages/elab/**
      - packages/checked-core/**
      - packages/erasure/**
      - packages/compiler-ir/**
      - packages/backend-ts/**
      - packages/compiler/**
      - packages/cli/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  lean-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify bootstrap toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - name: Audit portable PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node check-psc1-source.mjs

      - name: Build compiler with Lake
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build

      - name: Run Lean-hosted compiler smoke
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1

      - name: Run bootstrap semantic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_tests

      - name: Run source translation tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_translation_tests

      - name: Run checked-admission bridge tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_bridge_tests

      - name: Run Lean-native TypeScript backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_ts_tests

      - name: Run Lean-native erasure pipeline tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_erasure_tests

      - name: Run Lean-native dual-source TypeScript to JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          cd selfhost
          cat > /tmp/psc1-native.lean <<'EOF'
          def idNat (x : Nat) : Nat := x
          EOF
          cat > /tmp/psc1-native.ps <<'EOF'
          def idNat(x : Nat) : Nat := x;
          EOF
          lake exe psc1 typescript /tmp/psc1-native.lean > /tmp/psc1-native-lean.ts
          lake exe psc1 typescript /tmp/psc1-native.ps > /tmp/psc1-native-ps.ts
          cmp /tmp/psc1-native-lean.ts /tmp/psc1-native-ps.ts
          rm -f /tmp/psc1-native-lean.js /tmp/psc1-native-lean.d.ts /tmp/psc1-native-lean.js.map
          lake exe psc1 build /tmp/psc1-native.lean --out /tmp/psc1-native-lean.ts
          test -f /tmp/psc1-native-lean.js
          test -f /tmp/psc1-native-lean.d.ts
          test -f /tmp/psc1-native-lean.js.map
          grep -q 'export function idNat' /tmp/psc1-native-lean.js
          grep -q 'declare function idNat' /tmp/psc1-native-lean.d.ts
          echo "PSC1_LEAN_NATIVE_TSC_PIPELINE: PASS"

          cat > /tmp/psc1-adt.lean <<'EOF'
          inductive Maybe (α : Type) where
            | none
            | some (value : α)

          def present : Maybe Nat := Maybe.some 1
          def getOrZero (m : Maybe Nat) : Nat :=
            match m with
            | Maybe.none => 0
            | Maybe.some value => value
          EOF
          cat > /tmp/psc1-adt.ps <<'EOF'
          inductive Maybe(α : Type) where {
            | none;
            | some(value : α);
          };
          def present : Maybe(Nat) := Maybe.some(1);
          def getOrZero(m : Maybe(Nat)) : Nat :=
            match m with {
              | Maybe.none => 0;
              | Maybe.some value => value;
            };
          EOF
          lake exe psc1 typescript /tmp/psc1-adt.lean > /tmp/psc1-adt-lean.ts
          lake exe psc1 typescript /tmp/psc1-adt.ps > /tmp/psc1-adt-ps.ts
          cmp /tmp/psc1-adt-lean.ts /tmp/psc1-adt-ps.ts
          rm -f /tmp/psc1-adt-lean.js /tmp/psc1-adt-lean.d.ts /tmp/psc1-adt-lean.js.map
          lake exe psc1 build /tmp/psc1-adt.lean --out /tmp/psc1-adt-lean.ts
          test -f /tmp/psc1-adt-lean.js
          test -f /tmp/psc1-adt-lean.d.ts
          test -f /tmp/psc1-adt-lean.js.map
          grep -q 'export const Maybe' /tmp/psc1-adt-lean.js
          grep -q 'export function getOrZero' /tmp/psc1-adt-lean.js
          echo "PSC1_LEAN_NATIVE_ADT_TSC_PIPELINE: PASS"

      - name: Run dual-source admission pipeline
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          cat > /tmp/psc1-sample.lean <<'EOF'
          def idNat (x : Nat) : Nat := x
          EOF
          cat > /tmp/psc1-sample.ps <<'EOF'
          def idNat(x : Nat) : Nat := x;
          EOF
          lake exe psc1 admissions /tmp/psc1-sample.lean > /tmp/lean-admissions.json
          lake exe psc1 admissions /tmp/psc1-sample.ps > /tmp/ps-admissions.json
          cmp /tmp/lean-admissions.json /tmp/ps-admissions.json
          node -e "JSON.parse(require('node:fs').readFileSync('/tmp/lean-admissions.json','utf8'))"
          grep -q '"format":"proofscript-checked-admissions"' /tmp/lean-admissions.json
          echo "PSC1_ADMISSIONS_PIPELINE: PASS"


      - name: Replay Lean admissions through pskernel to JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx tsc -p packages/environment/tsconfig.json
          npx tsc -p packages/checked-core/tsconfig.json
          npx tsc -p packages/compiler-ir/tsconfig.json
          npx tsc -p packages/erasure/tsconfig.json
          npx tsc -p packages/backend-ts/tsconfig.json
          npx tsc -p packages/compiler/tsconfig.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {
            admitCheckedCoreAdmissions,
            decodeCheckedCoreAdmissions,
          } from './packages/checked-core/dist/src/index.js';
          import {
            createLeanEnvironmentProvider,
            requireLeanEnvironment,
          } from './packages/environment/dist/src/node.js';
          import {compileCheckedCore} from './packages/compiler/dist/src/index.js';

          const payload=JSON.parse(
            readFileSync('/tmp/lean-admissions.json','utf8'),
          );
          const admissions=decodeCheckedCoreAdmissions(payload);
          const base=requireLeanEnvironment(createLeanEnvironmentProvider());
          const checked=admitCheckedCoreAdmissions(base,admissions);
          const compiled=compileCheckedCore(checked,'psc1-sample.ts');

          writeFileSync('/tmp/psc1-sample.ts',compiled.typeScript);
          writeFileSync('/tmp/psc1-sample.js',compiled.emitted.javascript);

          if(!compiled.typeScript.includes('export function idNat')){
            throw new Error('PSC1_TS_OUTPUT_MISSING_IDNAT');
          }
          if(!compiled.emitted.javascript.includes('export function idNat')){
            throw new Error('PSC1_JS_OUTPUT_MISSING_IDNAT');
          }
          console.log('PSC1_VERIFIED_TS_JS_PIPELINE: PASS');
          NODE

  psc0-compatibility:
    # This lane measures the currently implemented TS frontend/compiler against
    # the PSC1-constrained Lean source. It is deliberately non-blocking while
    # the Lean-hosted implementation moves ahead of PSC0 feature coverage.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current PSC0 packages
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run test:packages

      - name: Probe current PSC0 compatibility
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin/psc.js check -p selfhost
          node packages/cli/dist/bin/psc.js build -p selfhost
          node packages/cli/dist/bin/psc.js translate \
            selfhost/src/ProofScript/Compiler/Data.lean --to ps \
            > /tmp/Data.ps
          node packages/cli/dist/bin/psc.js check /tmp/Data.ps
