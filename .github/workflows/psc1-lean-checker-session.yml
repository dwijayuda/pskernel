name: PSC1 Lean checker session

on:
  workflow_dispatch:
  push:
    branches:
      - perf/psc1-lean-checker-session
      - perf/psc1-lean-checker-cache
      - perf/psc1-lean-stateful-checker
    paths:
      - ".github/workflows/psc1-lean-checker-session.yml"
      - "psc1-kernel/**"
      - "scripts/apply-psc1-stateful-checker.mjs"

permissions:
  contents: read

jobs:
  checker-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Apply experimental stateful checker wiring
        if: github.ref_name == 'perf/psc1-lean-stateful-checker'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-psc1-stateful-checker.mjs
          git diff --check
      - name: Build PSC1 kernel
        working-directory: psc1-kernel
        run: lake build
      - name: Build experimental checker state
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/PSC1Kernel
          lake env lean PSC1Kernel/CheckerState.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerState.olean
      - name: Build oracle-only structure fixture
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/PSC1Kernel/Test
          lake env lean PSC1Kernel/Test/StructureFixture.lean \
            -o .lake/build/lib/lean/PSC1Kernel/Test/StructureFixture.olean
      - name: Checker-state cache invariants
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerStateSmoke.lean
      - name: Stateful recursive checker
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerStatefulSmoke.lean
      - name: Checker-session smoke
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerSessionSmoke.lean
      - name: Existing infer/check regression
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/InferOnlySmoke.lean
      - name: Existing differential oracle
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/Oracle.lean
