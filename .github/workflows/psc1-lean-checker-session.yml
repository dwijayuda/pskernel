name: PSC1 Lean checker session

on:
  workflow_dispatch:
  push:
    branches:
      - perf/psc1-lean-checker-session
      - perf/psc1-lean-checker-cache
      - perf/psc1-lean-stateful-checker
      - perf/psc1-lean-stateful-infer-app
      - perf/psc1-lean-stateful-infer-binders
      - perf/psc1-lean-stateful-infer-proj
      - perf/psc1-lean-stateful-recursor
      - perf/psc1-lean-stateful-infer-whnf
    paths:
      - ".github/workflows/psc1-lean-checker-session.yml"
      - "psc1-kernel/**"
      - "scripts/audit-psc1-kernel-portability.mjs"

permissions:
  contents: read

jobs:
  checker-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PSC1 portability hard gate
        shell: bash
        run: node scripts/audit-psc1-kernel-portability.mjs
      - name: Install Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build PSC1 kernel
        working-directory: psc1-kernel
        run: lake build
      - name: Build experimental checker state
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/PSC1Kernel
          lake env lean PSC1Kernel/CheckerState.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerState.olean
          lake env lean PSC1Kernel/CheckerStateful.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerStateful.olean
          lake env lean PSC1Kernel/CheckerReductionStateful.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerReductionStateful.olean
          lake env lean PSC1Kernel/CheckerInferenceStatefulReduced.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerInferenceStatefulReduced.olean
          lake env lean PSC1Kernel/CheckerDefEqStateful.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerDefEqStateful.olean
          lake env lean PSC1Kernel/CheckerDefEqStatefulClosed.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerDefEqStatefulClosed.olean
          lake env lean PSC1Kernel/CheckerDefEqStatefulReduced.lean \
            -o .lake/build/lib/lean/PSC1Kernel/CheckerDefEqStatefulReduced.olean
      - name: Build oracle-only structure fixture
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/PSC1Kernel/Test
          lake env lean PSC1Kernel/Test/StructureFixture.lean \
            -o .lake/build/lib/lean/PSC1Kernel/Test/StructureFixture.olean
      - name: Checker-state cache invariants
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerStateSmoke.lean
      - name: Stateful recursive checker
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerStatefulSmoke.lean
      - name: Stateful recursor reduction
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerRecursorStatefulSmoke.lean
      - name: Reduced defeq Nat-state regression
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerReducedDefEqSmoke.lean
      - name: Stateful inference WHNF reduction
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerInferWhnfStatefulSmoke.lean
      - name: Recursive stateful defeq
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerDefEqStatefulSmoke.lean
      - name: Stateful lazy-delta failure memo
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerLazyDeltaStatefulSmoke.lean
      - name: Checker-session smoke
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/CheckerSessionSmoke.lean
      - name: Existing infer/check regression
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/InferOnlySmoke.lean
      - name: Existing differential oracle
        working-directory: psc1-kernel
        run: lake env lean --run PSC1Kernel/Test/Oracle.lean
