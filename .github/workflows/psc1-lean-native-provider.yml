name: PSC1 Lean native provider

on:
  workflow_dispatch:
  push:
    branches: [integration/psc1-lean-native-provider]
    paths:
      - ".github/workflows/psc1-lean-native-provider.yml"
      - "scripts/psc1-lean-native-map.mjs"
      - "oracle/replay-probe/NativeEval.lean"
      - "oracle/replay-probe/NativeMapFixture.lean"
      - "psc1-kernel/**"

permissions:
  contents: read

concurrency:
  group: psc1-lean-native-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build PSC1 kernel
        working-directory: psc1-kernel
        run: lake build

      - name: Compile native fixture
        shell: bash
        run: |
          set -euo pipefail
          "$LEAN434_BIN/lean"             -o oracle/replay-probe/NativeMapFixture.olean             oracle/replay-probe/NativeMapFixture.lean

      - name: Write synthetic native-marker stream
        shell: bash
        run: |
          cat > native-map-smoke.ndjson <<'EOF'
          {"segment":{"index":0}}
          {"in":1,"str":{"pre":0,"str":"Lean"}}
          {"in":2,"str":{"pre":1,"str":"reduceNat"}}
          {"in":3,"str":{"pre":1,"str":"reduceBool"}}
          {"in":4,"str":{"pre":0,"str":"NativeMapFixture"}}
          {"in":5,"str":{"pre":4,"str":"n"}}
          {"in":6,"str":{"pre":4,"str":"b"}}
          {"ie":0,"const":{"name":2,"us":[]}}
          {"ie":1,"const":{"name":5,"us":[]}}
          {"ie":2,"app":{"fn":0,"arg":1}}
          {"ie":3,"const":{"name":3,"us":[]}}
          {"ie":4,"const":{"name":6,"us":[]}}
          {"ie":5,"app":{"fn":3,"arg":4}}
          EOF

      - name: Generate native result map through Lean kernel compiler IR
        shell: bash
        env:
          LEAN_PATH: oracle/replay-probe
        run: |
          set -euo pipefail
          node scripts/psc1-lean-native-map.mjs             NativeMapFixture native-map-smoke.ndjson native-map-smoke.tsv
          test "$(grep -F $'nat\tNativeMapFixture.n\t42' native-map-smoke.tsv | wc -l)" -eq 1
          test "$(grep -F $'bool\tNativeMapFixture.b\tfalse' native-map-smoke.tsv | wc -l)" -eq 1

      - name: Validate map with PSC1 parser
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run PSC1Kernel/Test/NativeMapSmoke.lean
