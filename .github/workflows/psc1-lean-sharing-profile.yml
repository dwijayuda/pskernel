name: PSC1 Lean sharing profile

on:
  workflow_dispatch:
  push:
    branches:
      - perf/psc1-lean-preserve-transform-sharing
    paths:
      - ".github/workflows/psc1-lean-sharing-profile.yml"
      - "psc1-kernel/PSC1Kernel/Instantiate.lean"
      - "psc1-kernel/PSC1Kernel/Test/ReplayProfile.lean"

permissions:
  contents: read

concurrency:
  group: psc1-lean-sharing-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - name: Export exact Std root 100015 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lean oracle/replay-probe/DependencyExport.lean
          lean --run oracle/replay-probe/DependencyExport.lean Std --root-range 100015 1 > /tmp/root100015.ndjson
      - name: Build kernel and profiler
        working-directory: psc1-kernel
        run: |
          lake build
          mkdir -p .lake/build/lib/lean/PSC1Kernel/Test
          lake env lean PSC1Kernel/Test/ReplayProfile.lean -o .lake/build/lib/lean/PSC1Kernel/Test/ReplayProfile.olean
      - name: Profile declarations for three minutes
        working-directory: psc1-kernel
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          timeout 180s lake env lean --run PSC1Kernel/Test/ReplayProfile.lean /tmp/root100015.ndjson || rc=$?
          echo "profile-exit=$rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then exit 0; fi
          exit "$rc"
