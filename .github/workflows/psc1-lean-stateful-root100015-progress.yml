name: PSC1 Lean stateful root 100015 progress

on:
  workflow_dispatch:
  push:
    branches:
      - perf/psc1-lean-stateful-checker
      - perf/psc1-lean-stateful-infer-app
      - perf/psc1-lean-stateful-infer-binders
      - perf/psc1-lean-stateful-infer-proj
      - perf/psc1-lean-level-instantiation-sharing
      - perf/psc1-lean-stateful-infer-mdata
    paths:
      - ".github/workflows/psc1-lean-stateful-root100015-progress.yml"
      - "psc1-kernel/PSC1Kernel.lean"
      - "psc1-kernel/PSC1Kernel/CheckerState.lean"
      - "psc1-kernel/PSC1Kernel/CheckerStateful.lean"
      - "psc1-kernel/PSC1Kernel/CheckerLazyDeltaStateful.lean"
      - "psc1-kernel/PSC1Kernel/CheckerDefEqStateful.lean"
      - "psc1-kernel/PSC1Kernel/CheckerDefEqStatefulClosed.lean"
      - "psc1-kernel/PSC1Kernel/CheckerSession.lean"
      - "psc1-kernel/PSC1Kernel/Kernel.lean"
      - "psc1-kernel/PSC1Kernel/Expr.lean"
      - "psc1-kernel/PSC1Kernel/Instantiate.lean"
      - "psc1-kernel/PSC1Kernel/Test/ReplayFile.lean"

permissions:
  contents: read

concurrency:
  group: psc1-lean-stateful-root100015-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - name: Export exact Std root 100015 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lean oracle/replay-probe/DependencyExport.lean
          lean --run oracle/replay-probe/DependencyExport.lean Std --root-range 100015 1 > /tmp/root100015.ndjson
          echo "bytes=$(wc -c < /tmp/root100015.ndjson)"
          echo "lines=$(wc -l < /tmp/root100015.ndjson)"
      - name: Build stateful PSC1 replay executable
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Replay exact root for four minutes with progress
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          /usr/bin/time -v timeout 240s psc1-kernel/.lake/build/bin/psc1_replay --progress /tmp/root100015.ndjson || rc=$?
          echo "replay-exit=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "STATEFUL_ROOT100015_COMPLETED_WITHIN_240S"
            exit 0
          fi
          if [ "$rc" -eq 124 ]; then
            echo "STATEFUL_ROOT100015_240S_TIMEOUT"
            exit 0
          fi
          exit "$rc"
