name: PSC1 linear spine hot declaration

on:
  workflow_dispatch:
  push:
    branches: [perf/psc1-linear-spine-ops]
    paths:
      - ".github/workflows/psc1-linear-spine-hot-decl.yml"

permissions:
  contents: read

jobs:
  hot-declaration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - name: Export named dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lean oracle/replay-probe/DependencyExport.lean
          lean --run oracle/replay-probe/DependencyExport.lean Std Array.getElem_extract_aux > /tmp/hot.ndjson
          echo "bytes=$(wc -c < /tmp/hot.ndjson)"
          echo "lines=$(wc -l < /tmp/hot.ndjson)"
          grep -Ec '"(axiom|def|thm|opaque|quot|inductive)":' /tmp/hot.ndjson || true
      - name: Build PSC1 Lean replay executable
        working-directory: psc1-kernel
        run: |
          lake build
          lake build psc1_replay
      - name: Replay hot declaration closure
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          /usr/bin/time -f 'hot-elapsed=%e hot-maxrss-kb=%M' timeout 300s \
            psc1-kernel/.lake/build/bin/psc1_replay /tmp/hot.ndjson || rc=$?
          echo "hot-replay-exit=$rc"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 124 ]; then echo "HOT_DIAGNOSTIC_TIMEOUT"; exit 0; fi
          exit "$rc"
