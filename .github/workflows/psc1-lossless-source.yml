name: PSC1 lossless source capture
on:
  push:
    branches: [feat/psc1-lossless-source-20261025]
    paths:
      - psc1/**
      - .github/workflows/psc1-lossless-source.yml
permissions:
  contents: read
concurrency:
  group: psc1-lossless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lossless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile additive lexical capture and regressions
        working-directory: psc1
        run: |
          lean --version
          lake build psc1_lossless_source psc1_lossless_tests
          .lake/build/bin/psc1_lossless_tests
      - name: Exercise snapshots, trivia and staged edits
        working-directory: psc1
        run: |
          if test -f scripts/lossless-source-tests.mjs; then node scripts/lossless-source-tests.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-lossless-${{ github.sha }}
          path: psc1/dist/lossless/
          if-no-files-found: ignore
          retention-days: 90
