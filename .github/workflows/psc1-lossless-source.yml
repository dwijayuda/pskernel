name: PSC1 lossless source capture
on:
  workflow_call:
  push:
    branches: [feat/psc1-lossless-source-20261025]
    paths:
      - psc1/**/*.lean
      - psc1/host-tools/source-refactoring.mjs
      - psc1/scripts/lossless-source-tests.mjs
      - psc1/scripts/source-ownership-tests.mjs
      - psc1/scripts/source-conversion-tests.mjs
      - psc1/scripts/refactor-source.mjs
      - psc1/scripts/bounded-process.py
      - psc1/scripts/selfhost-qualification-profiles.mjs
      - psc1/lean-toolchain
      - .github/workflows/psc1-lossless-source.yml
permissions:
  contents: read
concurrency:
  group: psc1-lossless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lossless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PSC1_LOSSLESS_SCOPE_GUARD: ${{ github.event_name == 'push' && github.ref_name == 'feat/psc1-lossless-source-20261025' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Prepare cached repository-pinned Lean launcher
        timeout-minutes: 7
        uses: ./.github/actions/psc1-lean-launcher
      - name: Compile additive lexical capture and regressions
        working-directory: psc1
        run: |
          lean --version
          node scripts/character-diagnostic-correspondence.mjs --reference-only
          lake build psc1_lossless_source psc1_lossless_tests psc1_character_diagnostic_tests psc1_source_ownership psc1_independent_checker psc1_source_census_probe psc1_lean_printer_scope_tests
          .lake/build/bin/psc1_lossless_tests
          .lake/build/bin/psc1_character_diagnostic_tests
          .lake/build/bin/psc1_lean_printer_scope_tests
          for source in dist/source-conversion/layout/*.lean; do
            lake env lean "$source"
          done
      - name: Exercise snapshots, trivia and staged edits
        working-directory: psc1
        run: |
          node scripts/lossless-source-tests.mjs
          node scripts/source-ownership-tests.mjs
          node scripts/source-conversion-tests.mjs --focused
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-lossless-${{ github.sha }}
          path: |
            psc1/dist/lossless/
            psc1/dist/source-ownership/
            psc1/dist/source-conversion/
          if-no-files-found: error
          retention-days: 90
