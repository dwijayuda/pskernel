name: PSC1 lossless source capture
on:
  workflow_call:
  push:
    branches: [feat/psc1-lossless-source-20261025]
    paths:
      - psc1/**/*.lean
      - psc1/host-tools/source-refactoring.mjs
      - psc1/scripts/lossless-source-tests.mjs
      - psc1/scripts/bounded-process.py
      - psc1/scripts/selfhost-qualification-profiles.mjs
      - psc1/lean-toolchain
      - .github/workflows/psc1-lossless-source.yml
permissions:
  contents: read
concurrency:
  group: psc1-lossless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lossless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PSC1_LOSSLESS_SCOPE_GUARD: ${{ github.event_name == 'push' && github.ref_name == 'feat/psc1-lossless-source-20261025' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile additive lexical capture and regressions
        working-directory: psc1
        run: |
          lean --version
          lake build psc1_lossless_source psc1_lossless_tests
          .lake/build/bin/psc1_lossless_tests
      - name: Inspect bounded native startup
        working-directory: psc1
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, json
          for line in open('.lake/build/ir/LosslessSourceMain.c'):
              if any(word in line for word in ['lean_run_main', 'task_manager', 'initialize_runtime', 'set_thread', 'int main']):
                  print('PSC1_NATIVE_MAIN: ' + line.rstrip())
          with tempfile.TemporaryDirectory() as directory:
              source = directory + '/source'
              open(source, 'wb').close()
              environment = dict(os.environ, LEAN_MAIN_USE_THREAD='0', LEAN_NUM_THREADS='0', LEAN_STACK_SIZE_KB='8192')
              for cap in [1073741824, 2147483648, 4294967296]:
                  command = ['prlimit', '--as=' + str(cap), '--stack=8388608', '--',
                             os.path.abspath('.lake/build/bin/psc1_lossless_source'),
                             'lean', source, directory + '/output']
                  result = subprocess.run(command, env=environment, capture_output=True, timeout=5)
                  print('PSC1_LEXICAL_STARTUP_PROBE: ' + json.dumps({'addressSpaceBytes': cap,
                        'status': result.returncode, 'stderr': result.stderr.decode(errors='replace')[:1024]}))
          PY
      - name: Exercise snapshots, trivia and staged edits
        working-directory: psc1
        run: |
          node scripts/lossless-source-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-lossless-${{ github.sha }}
          path: psc1/dist/lossless/
          if-no-files-found: error
          retention-days: 90
