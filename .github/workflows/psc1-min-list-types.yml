name: PSC1 actual List rank-one type layer
on:
  push:
    branches: [research/psc1-min-list-type-model-20261028, research/psc1-minkernel-consistency-selfhost-20261027]
    paths:
      - psc1/packages/**
      - psc1/host-tools/**
      - psc1/lean-toolchain
      - psc1/scripts/minkernel-module-*.mjs
      - psc1/scripts/minkernel-closure-audit.mjs
      - psc1/scripts/minkernel-actual-source-module.mjs
      - psc1/scripts/MinKernelActualSourceModule.lean
      - psc1/scripts/ci/install-pinned-lean.sh
      - psc1/proofs/pskernel-min/**
      - psc1/lakefile.lean
      - psc1/scripts/MinKernelListTypes.lean
      - psc1/scripts/minkernel-list-types.mjs
      - .github/workflows/psc1-min-list-types.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc1-min-list-types-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Install pinned Lean with unchanged budgets
        run: bash "$GITHUB_WORKSPACE/psc1/scripts/ci/install-pinned-lean.sh"
      - name: Prove the type layer and retain all existing consistency roots
        working-directory: psc1/proofs/pskernel-min
        run: |
          set -euo pipefail
          lake build 2>&1 | tee rank-one-proof.log
          ! grep -E 'sorryAx|declaration uses.*sorry' rank-one-proof.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify exact theorem trust reports
        working-directory: psc1/proofs/pskernel-min
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lines=fs.readFileSync('rank-one-proof.log','utf8').split('\n');
          const names=["denote_rename","denote_substitute","wf_rename","wf_substitute","lookup_sound","base_translation","unary_translation","binary_translation","type_translation","scheme_translation","signature_wellformed","universal_variable_empty","identity_scheme_inhabited"];
          for(const name of names){
            const matches=lines.filter(line=>line.includes("'Ps.MinKernel.RankOneTypes."+name+"'"));
            assert.ok(matches.length>0,name);
            for(const line of matches)assert.ok(line.includes('does not depend on any axioms')||line.includes('depends on axioms: [propext]'),line);
          }
          console.log('PSC1_LIST_TYPE_MODEL_TRUST_PASS '+names.length);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-list-type-model-${{ github.sha }}
          path: psc1/proofs/pskernel-min/rank-one-proof.log
          retention-days: 90
  actual-signatures:
    needs: type-model
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-min-native-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/packages/**/*.lean', '!psc1/packages/pskernel-min/**', 'psc1/scripts/*.lean') }}
          restore-keys: |
            psc1-min-native-v1-${{ runner.os }}-
            psc1-lake-v2-${{ runner.os }}-
      - name: Install pinned tools without relaxing limits
        run: |
          bash "$GITHUB_WORKSPACE/psc1/scripts/ci/install-pinned-lean.sh"
          npm install --prefix "$RUNNER_TEMP/list-type-ts" --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/list-type-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Build actual producers, official checker and isolated type layer
        run: |
          node packages/pskernel-lean/host/check-pin.mjs
          lake build PsBackendTs psc1_source_census_probe psc2_joint_closure_inventory psc1_independent_checker PsMinActualSourceProbe PsMinRankOneRuntime
      - name: Recapture actual 124-module graph and exact fresh leaves
        run: |
          node scripts/minkernel-closure-audit.mjs
          node --max-old-space-size=256 scripts/minkernel-module-matrix.mjs
          node --max-old-space-size=256 scripts/minkernel-module-diagnostics.mjs
      - name: Preserve first actual module and unchanged public refusals
        run: node --max-old-space-size=256 scripts/minkernel-actual-source-module.mjs
      - name: Compare all actual List signatures with native, generated and source expectations
        run: node --max-old-space-size=256 scripts/minkernel-list-types.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-actual-list-signatures-${{ github.sha }}
          path: |
            psc1/dist/pskernel-min/list-types/
            psc1/dist/pskernel-min/module-matrix/
            psc1/dist/pskernel-min/closure/
          retention-days: 90
