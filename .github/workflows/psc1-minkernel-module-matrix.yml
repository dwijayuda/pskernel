name: PSC1 actual MinKernel compiler module matrix
on:
  push:
    branches: [research/psc1-min-compiler-module-matrix-20261028, research/psc1-minkernel-consistency-selfhost-20261027, research/psc1-min-leaf-oracle-20261028]
    paths:
      - psc1/packages/**
      - psc1/proofs/pskernel-min/**
      - psc1/host-tools/**
      - psc1/scripts/**
      - psc1/lakefile.lean
      - psc1/lean-toolchain
      - .github/workflows/psc1-minkernel-module-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc1-min-module-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-min-native-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/packages/**/*.lean', '!psc1/packages/pskernel-min/**', 'psc1/scripts/*.lean') }}
          restore-keys: |
            psc1-min-native-v1-${{ runner.os }}-
            psc1-lake-v2-${{ runner.os }}-
      - name: Install repository tools without changing verification budgets
        run: |
          bash "$GITHUB_WORKSPACE/psc1/scripts/ci/install-pinned-lean.sh"
          npm install --prefix "$RUNNER_TEMP/min-ts" --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/min-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Build actual source producer and independent official checker
        run: |
          node packages/pskernel-lean/host/check-pin.mjs
          lake build PsBackendTs psc1_source_census_probe psc2_joint_closure_inventory psc1_independent_checker PsMinActualSourceProbe
      - name: Capture the entire actual compiler graph once
        run: node scripts/minkernel-closure-audit.mjs
      - name: Query unchanged public MinKernel API for actual dependency-closed modules
        run: node --max-old-space-size=256 scripts/minkernel-module-matrix.mjs
      - name: Pinpoint the real List type-binder refusal and dependency impact
        run: node --max-old-space-size=256 scripts/minkernel-module-diagnostics.mjs
      - name: Qualify actual Source constructors and projections on native and generated paths
        run: node --max-old-space-size=256 scripts/minkernel-actual-source-module.mjs
      - name: Independently replay every fresh actual leaf, including Min refusals
        run: |
          node --max-old-space-size=256 --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          assert.equal(process.platform,'linux');
          assert.equal(process.env.GITHUB_ACTIONS,'true');
          const root='dist/pskernel-min/module-matrix';
          const matrix=JSON.parse(fs.readFileSync(root+'/matrix.json'));
          const rows=matrix.rows.filter(row=>row.standalone?.producer==='accepted');
          assert.equal(rows.length,6);
          const results=[];
          for(const row of rows){
            const bytes=fs.readFileSync(row.standalone.packet.file);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            assert.equal(hash,row.standalone.packet.checkedSha256);
            const run=spawnSync('.lake/build/bin/psc1_independent_checker',['--check'],
              {input:bytes,encoding:'utf8',timeout:120000,maxBuffer:1024*1024});
            assert.equal(run.error,undefined,String(run.error));
            const official=JSON.parse(run.stdout);
            results.push({module:row.module,bytes:bytes.length,sha256:hash,
              minAccepted:row.standalone.min.accepted,official,status:run.status});
            fs.writeFileSync(root+'/leaf-official-replay.json',JSON.stringify({
              schema:'psc1-fresh-leaf-official-replay/1',head:process.env.GITHUB_SHA,
              acceptanceAuthority:false,results},null,2)+'\n');
            assert.equal(run.status,0,run.stderr);
            assert.equal(official.accepted,true,row.module+' fresh canonical source replay');
            assert.equal(official.leanVersion,'4.35.0');
            assert.equal(official.leanCommit,'eb6cafb7290e8bd5f2937522d8d804f58f02bafc');
            row.standalone.official=official;
          }
          fs.writeFileSync(root+'/matrix.json',JSON.stringify(matrix,null,2)+'\n');
          console.log('PSC1_FRESH_LEAF_OFFICIAL_REPLAY_PASS '+results.length);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-min-actual-module-matrix-${{ github.sha }}
          path: |
            psc1/dist/pskernel-min/module-matrix/
            psc1/dist/pskernel-min/closure/
          retention-days: 90
