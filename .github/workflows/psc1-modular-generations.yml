name: PSC1 modular generations and fixed points
on:
  push:
    branches: [feat/psc1-portable-modules-20261029, diagnostic/psc1-modular-cpu-20261029]
    paths: ['psc1/scripts/requests/modular-selfhost.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-modular-generations-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        engine: [js, ts]
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            psc1/host-tools/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-portable-modules-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain','psc1/lakefile.lean','psc1/**/*.lean') }}
          restore-keys: |
            psc1-portable-modules-v1-${{ runner.os }}-
      - name: Prepare bounded pinned Lean launcher
        timeout-minutes: 3
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/psc1-elan-init.sh"
            sh "$RUNNER_TEMP/psc1-elan-init.sh" -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore exact successful portable G1 artifact
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-portable-g1.mjs scripts/requests/modular-selfhost.json
      - name: Prepare independent kernel and locked consumers
        timeout-minutes: 15
        run: |
          lake build psc1_independent_checker
          npm ci --prefix .. --ignore-scripts --include=optional --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000
          rustup toolchain install 1.90.0 --profile minimal
          node scripts/prepare-rust-target-consumer.mjs
      - name: Genuine modular G2 and G3, official independent admission, complete graph and npm fixed points
        env:
          PSC1_MODULAR_ENGINE: ${{ matrix.engine }}
        run: |
          profile="$(node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync('scripts/requests/modular-selfhost.json')).profile)")"
          node host-tools/executable/selfhost.mjs "$PSC1_MODULAR_ENGINE" "$profile" &
          qualification_pid=$!
          while kill -0 "$qualification_pid" 2>/dev/null; do
            sleep 45
            if kill -0 "$qualification_pid" 2>/dev/null; then
              date -u '+PSC1_MODULAR_PROGRESS %Y-%m-%dT%H:%M:%SZ'
              # Numeric process metrics only; never dump arguments or environments.
              ps -C node -o pid=,ppid=,etimes=,time=,rss= || true
            fi
          done
          wait "$qualification_pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-fixed-points-${{ matrix.engine }}-${{ github.sha }}
          path: psc1/dist/portable-modules/
          retention-days: 90
