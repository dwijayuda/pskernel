name: PSC1 genuine modular JS TS compiler package pilot
on:
  push:
    branches: [feat/psc1-modular-partitions-20261027]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: psc1-modular-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: psc1/.lake
          key: psc1-modular-native-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/lake-manifest.json', 'psc1/**/*.lean') }}
          restore-keys: |
            psc1-modular-native-v1-${{ runner.os }}-
            psc1-lake-v2-${{ runner.os }}-native-
      - name: Install pinned Lean and locked development consumers
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
          npm ci --prefix .. --ignore-scripts --include=optional --no-audit --no-fund
      - name: Check modular host and test source syntax
        run: |
          for file in host-tools/modular/*.mjs test/modular/*.mjs; do node --check "$file"; done
      - name: Capture the exact qualified compiler source without rebuilding it
        run: |
          git worktree add --detach "$RUNNER_TEMP/psc1-modular-frozen-source" 4b0fa00ac1132d8f44e9db984d8fb7a3a02a1a98
          PSC1_MODULAR_FROZEN_ROOT="$RUNNER_TEMP/psc1-modular-frozen-source/psc1" node test/modular/frozen-source.mjs
      - name: Prepare immutable PR195 transform baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/psc1-origin-baseline" cc13ebfabf6763703ee1ec75a663002a9134bc74
          echo "PSC1_TRANSFORM_BASELINE=$RUNNER_TEMP/psc1-origin-baseline/psc1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/psc1-origin-baseline/psc1/.lake
          key: psc1-transform-baseline-v1-Linux-cc13ebfabf6763703ee1ec75a663002a9134bc74
          restore-keys: |
            psc1-modular-native-v1-Linux-
      - name: Prepare native baseline harness without modifying baseline sources
        run: |
          mkdir -p "$RUNNER_TEMP/psc1-transform-driver"
          cp test/modular/TransformParity.lean "$RUNNER_TEMP/psc1-transform-driver/TransformParity.lean"
          cp "$PSC1_TRANSFORM_BASELINE/lean-toolchain" "$RUNNER_TEMP/psc1-transform-driver/lean-toolchain"
          cat > "$RUNNER_TEMP/psc1-transform-driver/lakefile.lean" <<'LEAN'
          import Lake
          open Lake DSL
          package transformParity
          require proofscriptSelfhost from "../psc1-origin-baseline/psc1"
          lean_exe transform_parity where
            root := `TransformParity
          LEAN
          echo "PSC1_TRANSFORM_BASELINE_DRIVER=$RUNNER_TEMP/psc1-transform-driver/.lake/build/bin/transform_parity" >> "$GITHUB_ENV"
          echo "PSC1_TRANSFORM_BASELINE_DRIVER_SOURCE=$RUNNER_TEMP/psc1-transform-driver/TransformParity.lean" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/psc1-transform-driver/.lake
          key: psc1-transform-driver-v1-Linux-cc13-${{ hashFiles('psc1/test/modular/TransformParity.lean') }}
      - name: Build original transform APIs into the native parity harness
        working-directory: ${{ runner.temp }}/psc1-transform-driver
        run: lake build transform_parity
      - name: Build additive pilot and genuine independent checker
        id: build
        run: |
          set -euo pipefail
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1_modular_pilot psc1_independent_checker psc1_modular_graph_measure
      - name: Measure complete transformed compiler ownership and admit exact Core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/transformed-graph.mjs
      - name: Recursive-group and type-only partition invariants and refusals
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: lake env lean --run test/modular/Partition.lean
      - name: Execute grouped strict IR cycle fixture against bundled output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/partition-cycle.mjs
      - name: Record current owned source-import closure separately from runtime graph
        run: node test/modular/source-closure.mjs
      - name: Transform provenance invariants and ownership refusal tests
        run: lake env lean --run test/modular/Provenance.lean
      - name: Extended graph layout and profile refusals
        run: lake env lean --run test/modular/ExtendedPlan.lean
      - name: Strict graph planning positives and negative tests
        run: lake env lean --run test/modular/Plan.lean
      - name: Compile real compiler Name module and dependent consumer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/native-probe.mjs
      - name: Capture extended compiler graph with specialization and worker owners
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/extended-native.mjs
      - name: Independently checked offline modular packages and negative tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/packages.test.mjs
      - name: Execute admitted extended compiler packages and consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/extended-packages.test.mjs
      - name: Execute admitted partitioned compiler packages and consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/modular/extended-packages.test.mjs --partitioned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-pilot-${{ github.sha }}
          path: psc1/dist/modular/
          retention-days: 90
