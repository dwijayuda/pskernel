name: PSC1 modular installed toolchain
on:
  push:
    branches: [feat/psc1-modular-toolchain-20261028]
    paths:
      - .github/workflows/psc1-modular-toolchain.yml
      - psc1/scripts/modular-toolchain-*
      - psc1/host-tools/**
      - psc1/npm-cli/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-modular-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Repository and syntax boundaries
        run: |
          node scripts/ci/repository-layout.mjs
          node --check scripts/modular-toolchain-package.mjs
      - name: Assemble the sealed modular root and genuine independent kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/modular-toolchain-package.mjs build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Real installed root, both engines and default independent Wasm kernel
        run: |
          node scripts/modular-toolchain-installed.mjs
          node scripts/modular-toolchain-installed.mjs "$(command -v bun)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-toolchain-package-${{ github.sha }}
          path: |
            psc1/dist/modular-toolchain/inspection.json
            psc1/dist/modular-toolchain/package-receipt.json
            psc1/dist/modular-toolchain/smoke-*.json
            psc1/dist/modular-toolchain/tarballs
          retention-days: 90
