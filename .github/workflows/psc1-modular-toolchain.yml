name: PSC1 modular installed toolchain
on:
  push:
    branches: [feat/psc1-modular-toolchain-20261028]
    paths:
      - .github/workflows/psc1-modular-toolchain.yml
      - psc1/scripts/modular-toolchain-*
      - psc1/host-tools/**
      - psc1/npm-cli/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-modular-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Repository and syntax boundaries
        run: |
          node scripts/ci/repository-layout.mjs
          node --check scripts/modular-toolchain-package.mjs
      - name: Inspect exact qualified modular graph and independent kernel sizes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/modular-toolchain-package.mjs inspect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-toolchain-inspection-${{ github.sha }}
          path: psc1/dist/modular-toolchain/inspection.json
          retention-days: 90
