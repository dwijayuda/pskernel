name: PSC1 modular installed toolchain
on:
  push:
    branches: [feat/psc1-modular-toolchain-20261028]
    paths:
      - .github/workflows/psc1-modular-toolchain.yml
      - psc1/scripts/modular-toolchain-*
      - psc1/host-tools/**
      - psc1/npm-cli/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-modular-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Repository and syntax boundaries
        run: |
          node scripts/ci/repository-layout.mjs
          node --check scripts/modular-toolchain-package.mjs
      - run: npm ci --prefix host-tools --ignore-scripts --no-audit --no-fund
      - name: Retain pinned formatter proposals for changed host adapters
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import{createRequire}from'node:module';
          const require=createRequire(path.resolve('host-tools/package.json')),prettier=require('prettier');
          for(const file of ['host-tools/installed-engine-resolver.mjs','npm-cli/compiler-api.mjs',
           'host-tools/executable/verify.mjs','scripts/modular-toolchain-package.mjs','scripts/modular-toolchain-installed.mjs']){
            console.log('PSC1_MODULAR_TOOLCHAIN_FORMAT '+JSON.stringify({file,formatted:await prettier.format(fs.readFileSync(file,'utf8'),{parser:'babel',singleQuote:true,printWidth:100})}));
          }
          JS
      - name: Assemble the sealed modular root and genuine independent kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/modular-toolchain-package.mjs build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Real installed root, both engines and default independent Wasm kernel
        run: |
          node scripts/modular-toolchain-installed.mjs
          node scripts/modular-toolchain-installed.mjs "$(command -v bun)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-toolchain-package-${{ github.sha }}
          path: |
            psc1/dist/modular-toolchain/inspection.json
            psc1/dist/modular-toolchain/package-receipt.json
            psc1/dist/modular-toolchain/compiler-admissions.json
            psc1/dist/modular-toolchain/consumer-descriptors.json
            psc1/dist/modular-toolchain/smoke-*.json
            psc1/dist/modular-toolchain/tarballs
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: psc1-modular-target-resources-${{ github.sha }}
          path: |
            psc1/dist/modular-toolchain/target-tarballs
            psc1/dist/modular-toolchain/target-archive-correspondence.json
          retention-days: 90
  qualify:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [node,bun]
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-modular-toolchain-package-${{ github.sha }}
          path: psc1/dist/modular-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: psc1-modular-target-resources-${{ github.sha }}
          path: psc1/dist/modular-toolchain
      - name: Install exact official Rust target SDK
        run: |
          rustup toolchain uninstall 1.90.0
          rustup toolchain install 1.90.0 --profile minimal
      - name: Install SHA-pinned component consumer
        run: |
          mkdir -p "$RUNNER_TEMP/psc1-wasmtime" "$RUNNER_TEMP/psc1-bin"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz -o "$RUNNER_TEMP/psc1-wasmtime.tar.xz"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $RUNNER_TEMP/psc1-wasmtime.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/psc1-wasmtime.tar.xz" -C "$RUNNER_TEMP/psc1-wasmtime"
          install -m 755 "$(find "$RUNNER_TEMP/psc1-wasmtime" -type f -name wasmtime -print -quit)" "$RUNNER_TEMP/psc1-bin/wasmtime"
          echo "PSC1_TEST_WASMTIME=$RUNNER_TEMP/psc1-bin/wasmtime" >> "$GITHUB_ENV"
      - name: Select host runtime
        run: |
          if [ '${{ matrix.runtime }}' = bun ]; then
            echo "PSC1_TEST_RUNTIME=$(command -v bun)" >> "$GITHUB_ENV"
          else
            echo "PSC1_TEST_RUNTIME=$(command -v node)" >> "$GITHUB_ENV"
          fi
      - name: Resolve exact optional target resources without installing an old compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/modular-toolchain-resources.mjs
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('dist/modular-toolchain/resources.json'));fs.appendFileSync(process.env.GITHUB_ENV,'PSC1_TEST_RUST_ROOT='+r.rustRoot+'\n');"
      - name: Seven-target values, native-qualified compiler admissions and global installation
        run: node scripts/modular-toolchain-qualify.mjs
      - name: Retained checked watch behavior through the modular root
        run: node scripts/modular-toolchain-watch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-modular-installed-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            psc1/dist/modular-toolchain/qualification-*.json
            psc1/dist/modular-toolchain/watch-*.json
            psc1/dist/modular-toolchain/resources.json
          retention-days: 90
