name: PSC1 native Rust compiler and official Lean435 kernel preview
on:
  push:
    branches:
      - feat/psc1-native-rust-lean435-20261031
    paths:
      - '.github/workflows/psc1-native-rust-lean435.yml'
      - 'psc1/scripts/native-psc-preview*.mjs'
      - 'psc1/docs/architecture/native-rust-lean435-preview.md'
      - 'psc1/AI_WORK_STATE.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psc1-native-rust-lean435-preview
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-native-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-native-lake-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/lake-manifest.json', 'psc1/**/*.lean') }}
          restore-keys: psc1-native-lake-v1-${{ runner.os }}-
      - name: Install pinned Lean, Rust and host dependencies
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          npm ci --prefix .. --ignore-scripts --include=optional
      - name: Install hash-verified Wasm target consumer for the four-target G1 corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/wasm-tools"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz' -o "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "d0efb16c9c859137b7ab3e99151c299cd47caee106ed4594561002f7a04945bd  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-tools" -type f -name wasm-tools -print -quit)" "$RUNNER_TEMP/native-bin/wasm-tools"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
      - name: Validate actual source, transport and preview syntax
        run: |
          set -euo pipefail
          node --check scripts/native-psc-preview.mjs
          node --check scripts/native-psc-preview-qualification.mjs
          node --check scripts/generated-target-qualification.mjs
          node --check host-tools/generated-rust-transport.mjs
          node scripts/native-psc-preview.mjs --help
          node packages/pskernel-lean/host/check-pin.mjs
          node scripts/generated-target-contract-tests.mjs
          node scripts/generated-target-source-audit.mjs rust unified
      - name: Build genuinely native Lean4.35 seed, native checker and source test
        run: |
          set -euo pipefail
          lake build psc1_unified_service_seed psc1_independent_checker psc1_unified_service_tests
          .lake/build/bin/psc1_unified_service_tests
      - name: Generate and build the native Rust PSC G1, independently admit four output targets
        timeout-minutes: 75
        run: |
          set -euo pipefail
          node scripts/generated-target-qualification.mjs rust --g1-only performance-240s unified
      - name: Exercise Rust-native PSC with native Lean kernel through checked host
        timeout-minutes: 20
        run: node scripts/native-psc-preview-qualification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-native-rust-lean435-preview-${{ github.sha }}
          path: |
            psc1/dist/generated-unified-rust-compiler/
            psc1/dist/native-psc-preview/
          if-no-files-found: warn
          retention-days: 90
