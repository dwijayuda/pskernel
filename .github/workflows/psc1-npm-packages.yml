name: PSC1 existing npm package distribution
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - psc1/packages/**
      - psc1/scripts/build-packages.mjs
      - psc1/scripts/npm-package*.mjs
      - psc1/scripts/npm-packages-input.json
      - psc1/NPM_PACKAGE_CONTRACT.json
      - psc1/package.json
      - .github/workflows/psc1-npm-packages.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-simple-npm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Inspect existing packages and verify immutable qualified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-package-inventory.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Check manifests and build every existing applicable package
        run: |
          node --check scripts/build-packages.mjs
          npm run check:workspace
          npm run build:packages
          node scripts/check-workspace.mjs --built
      - name: Prepare the existing pinned Rust target SDK
        run: |
          rustup toolchain uninstall 1.90.0 || true
          rustup toolchain install 1.90.0 --profile minimal
          node scripts/npm-packages-sdk.mjs
      - name: Fresh offline installations, checked output and refusal qualification
        run: node scripts/npm-packages-installed.mjs
      - name: Seal the default and optional installable cohorts
        run: node scripts/npm-packages-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-npm-packages-${{ github.sha }}
          path: |
            psc1/dist/npm-packages/tarballs/
            psc1/dist/npm-packages/*.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: proofscript-installable-packages-0.1.0-psc1.12-${{ github.sha }}
          path: psc1/dist/npm-packages/installable/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: proofscript-optional-packages-0.1.0-psc1.12-${{ github.sha }}
          path: psc1/dist/npm-packages/optional/
          retention-days: 90
