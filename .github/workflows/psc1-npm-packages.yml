name: PSC1 existing npm package distribution
on:
  push:
    branches: [feat/psc1-simple-npm-packages-20261027]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-simple-npm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Inspect existing packages and verify immutable qualified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-package-inventory.mjs
      - name: Check manifests and build every existing applicable package
        run: |
          node --check scripts/build-packages.mjs
          npm run check:workspace
          npm run build:packages
          node scripts/check-workspace.mjs --built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-npm-packages-${{ github.sha }}
          path: |
            psc1/dist/npm-packages/tarballs/
            psc1/dist/npm-packages/*.json
          retention-days: 90
