name: PSC1 native compiler platform source admission release checks
on:
  push:
    branches: [integration/psc1-lean435-kernel-packages-20261025]
    paths: [.github/workflows/psc1-platform-compiler-source.yml]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PSC1_RELEASE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc1
          auto-config: false
          build: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Export native Windows Elan path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan/bin'
          if (-not (Test-Path -LiteralPath (Join-Path $elanBin 'lean.exe'))) { throw 'Elan executable missing' }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build exact official compiler and independent admission pipeline
        run: |
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1
      - name: Execute both source grammars with SDK and checkout absent from PATH
        run: node scripts/platform-compiler-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-native-source-${{ matrix.target }}-${{ github.sha }}
          path: |
            psc1/dist/platform-compiler/
          retention-days: 90
