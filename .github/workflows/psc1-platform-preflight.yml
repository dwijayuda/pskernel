name: PSC1 additional platform ABI preflight
on:
  push:
    branches: [feat/psc1-canonical-latency-20261028]
    paths:
      - psc1/standalone/platform-preflight.mjs
      - .github/workflows/psc1-platform-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-platform-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: ubuntu-24.04-x64
            runner: ubuntu-24.04
          - environment: ubuntu-22.04-x64
            runner: ubuntu-22.04
          - environment: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check the exact private runtime and official kernel before compiler qualification
        working-directory: psc1
        env:
          GH_TOKEN: ${{ github.token }}
          PSC1_QUALIFICATION_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          node --check standalone/platform-preflight.mjs
          node standalone/platform-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-platform-abi-${{ matrix.environment }}-${{ github.sha }}
          path: |
            psc1/dist/platform-preflight/preflight.json
            psc1/dist/platform-preflight/logs/
          if-no-files-found: warn
          retention-days: 90
