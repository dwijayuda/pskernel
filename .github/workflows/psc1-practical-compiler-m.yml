name: PSC1 focused CompilerM source and owned callback regressions

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: psc1-practical-compiler-m-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PSC1_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PSC1_COMPILERM_TARGETS: js,ts,rust
      PSC1_COMPILERM_EVIDENCE: compiler-m-focused
      PSC1_COLLECTION_TARGETS: js,ts,rust
      PSC1_COLLECTION_EVIDENCE: stdlib-collections-focused
      PSC1_JSON_TARGETS: js,ts,rust
      PSC1_JSON_EVIDENCE: json-application-focused
      PSC1_IO_PROTOCOL_TARGETS: js,ts,rust
      PSC1_IO_PROTOCOL_EVIDENCE: typed-io-protocol-focused
      PSC1_INFERENCE_TARGETS: js,ts,rust
      PSC1_INFERENCE_EVIDENCE: inference-control-focused
    defaults:
      run:
        shell: bash
        working-directory: psc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Cache pinned Lean installation
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: psc1-elan-v1-${{ runner.os }}-${{ hashFiles('psc1/lean-toolchain') }}
      - name: Cache exact-source native build objects
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: psc1/.lake
          key: psc1-lake-v2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('psc1/lean-toolchain', 'psc1/lakefile.lean', 'psc1/lake-manifest.json', 'psc1/**/*.lean') }}
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust and locked host dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
          npm --prefix host-tools --workspaces=false ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated pinned TypeScript consumer checker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-ts7"
          echo '{"name":"psc1-ts7-consumer-tests","version":"0.0.0","private":true}' > "$RUNNER_TEMP/psc1-ts7/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-ts7" --ignore-scripts --no-save --no-audit --no-fund typescript@7.0.2
          echo "PSC1_TSC=$RUNNER_TEMP/psc1-ts7/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Build production compiler and independent checker
        run: |
          set -euo pipefail
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1 psc1_independent_checker
      - name: Save successful compilation before running regressions
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: psc1/.lake
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Execute authored inputs with native reference and JS TS Rust consumers
        run: |
          set -euo pipefail
          node --check scripts/compiler-m-conformance-tests.mjs
          node scripts/language-backend-parity-contract-tests.mjs
          node scripts/compiler-m-conformance-tests.mjs
          node scripts/compiler-m-conformance-tests.mjs --stdlib-collections
          node scripts/compiler-m-conformance-tests.mjs --json-application
          node scripts/compiler-m-conformance-tests.mjs --inference-control
          node scripts/compiler-m-conformance-tests.mjs --typed-io-protocol
          node scripts/typed-io-policy-tests.mjs
          node scripts/typed-io-application-tests.mjs
      - name: Retain exact sources oracle artifacts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-practical-compiler-m-${{ github.sha }}
          path: |
            psc1/dist/scoped-correctness/typed-io-protocol-focused/
            psc1/dist/scoped-correctness/typed-io/
            psc1/dist/scoped-correctness/inference-control-focused/
            psc1/dist/scoped-correctness/json-application-focused/
            psc1/dist/scoped-correctness/compiler-m-focused/
            psc1/dist/scoped-correctness/stdlib-collections-focused/
          retention-days: 14
          if-no-files-found: warn
