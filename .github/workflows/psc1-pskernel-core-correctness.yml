          grep -Eq '^PSC1_V2_OWNED_STATE_JS_PASS carrier=42 propagated=56 differential=540 defeqCarrier=38 defeqPropagated=44 assertions=[0-9]+$' "$RUNNER_TEMP/psc1-owned-state-canonical.log"
          grep -Fqx 'PSC1_V2_ADMISSION_OWNED_STATE_JS_PASS carrier=8 propagated=12 differential=336 publicWhnf=168' "$RUNNER_TEMP/psc1-owned-state-canonical.log"
      - name: Exercise the canonical-source checked batch provider in detached Node
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pskernel-provider-smoke.mjs js dist/pskernel-selfhost/pskernel-core.js \
            | tee "$RUNNER_TEMP/psc1-canonical-provider.log"
          grep -q 'PSC1_CANONICAL_PROVIDER: PASS mode=js cases=24 PATH=empty cwd=detached' "$RUNNER_TEMP/psc1-canonical-provider.log"
          grep -q 'PSC1_CANONICAL_PROVIDER_API: PASS cases=8 PATH=empty cwd=detached' "$RUNNER_TEMP/psc1-canonical-provider.log"
      - name: Package the complete canonical source and checked provider
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_PROVIDER_DIST=dist/pskernel-selfhost/provider
          mkdir -p "$PSC1_PROVIDER_DIST/scripts" "$PSC1_PROVIDER_DIST/npm-runtime"
          cp dist/pskernel-selfhost/pskernel-core.js dist/pskernel-selfhost/pskernel-core.ts dist/pskernel-selfhost/pskernel-core.d.ts \
            dist/pskernel-selfhost/pskernel-core.js.map "$PSC1_PROVIDER_DIST/"
          cp scripts/pskernel-canonical-provider.mjs "$PSC1_PROVIDER_DIST/scripts/"
          cp packages/pskernel-core/PROVIDER.md "$PSC1_PROVIDER_DIST/README.md"
          cp npm-runtime/canonical-admissions-wire.mjs "$PSC1_PROVIDER_DIST/npm-runtime/"
          node -e "require('node:fs').writeFileSync(process.argv[1],JSON.stringify({private:true,type:'module'},null,2)+'\\n')" \
            "$PSC1_PROVIDER_DIST/package.json"
          tar -czf "$PSC1_PROVIDER_DIST/canonical-source.tar.gz" -C dist/pskernel-selfhost/workspace .
          node scripts/pskernel-artifact-manifest.mjs "$PSC1_PROVIDER_DIST/artifacts.json" \
            canonical-ps-generated-js "$PSC1_PROVIDER_DIST/pskernel-core.js" "$PSC1_PROVIDER_DIST/pskernel-core.ts" \
            "$PSC1_PROVIDER_DIST/pskernel-core.d.ts" "$PSC1_PROVIDER_DIST/pskernel-core.js.map" \
            "$PSC1_PROVIDER_DIST/scripts/pskernel-canonical-provider.mjs" \
            "$PSC1_PROVIDER_DIST/npm-runtime/canonical-admissions-wire.mjs" \
            "$PSC1_PROVIDER_DIST/package.json" "$PSC1_PROVIDER_DIST/canonical-source.tar.gz" "$PSC1_PROVIDER_DIST/README.md"
      - name: Report DirectJS kernel capability without claiming support
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          if lake exe psc1 build \
              dist/pskernel-selfhost/workspace/packages/pskernel-core/src/Ps/KernelCore/SelfHost.ps \
              --target js --out dist/pskernel-selfhost/pskernel-direct.js \
              > "$RUNNER_TEMP/psc1-direct-capability.log" 2>&1; then
            node scripts/pskernel-generated-smoke.mjs dist/pskernel-selfhost/pskernel-direct.js \
              | tee -a "$RUNNER_TEMP/psc1-direct-capability.log"
            echo 'PSC1_DIRECTJS_COMPLETE_KERNEL_RUNTIME: PASS'
          else
            cat "$RUNNER_TEMP/psc1-direct-capability.log"
            grep -Eq 'PSC1_DIRECT_NONSCALAR_PUBLIC_SIGNATURE_UNQUALIFIED|PSC1_DIRECT_GENERIC_DECLARATION_NOT_QUALIFIED' \
              "$RUNNER_TEMP/psc1-direct-capability.log"
            echo 'PSC1_DIRECTJS_COMPLETE_KERNEL: UNSUPPORTED (explicit emitter capability limit)'
          fi
