          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" generated-owner-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-generated-owner-canonical.log"
          grep -Eq '^PSC1_V2_GENERATED_OWNER_JS_PASS owners=25 recursors=7 rules=14 cases=12 checks=216 whnf=216 defeq=216 private=13 independentDefinitions=12 assertions=[0-9]+$' "$RUNNER_TEMP/psc1-generated-owner-canonical.log"
      - name: Check complete canonical-source DAG checker state in detached Node
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          test -s "$PSC1_PS_RUN_DIR/kernel.mjs"
