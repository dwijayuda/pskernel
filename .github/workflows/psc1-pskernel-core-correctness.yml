name: PSC1 PSKernel-Core correctness
on:
  workflow_dispatch:
  push:
    branches:
      - research/psc1-pskernel-lean435-performance-20261020
      - research/psc1-pskernel-expr-v2-lean435-20261020
      - integration/psc1-pskernel-expr-v2-lean435-20261021
      - research/psc1-pskernel-v2-staged-20261021
      - research/psc1-pskernel-v2-carrier-20261021
    paths:
      - psc1/scripts/install-lean435-ci.sh
      - psc1/lean-toolchain
      - psc1/host/**
      - psc1/packages/pskernel-core/**
      - psc1/packages/pskernel-core/AI_WORK_STATE.md
      - psc1/test/PsKernelCoreRegression.lean
      - psc1/test/PsKernelExprV2WhnfABIProofs.lean
      - psc1/test/PsKernelInstantiatePerformance.lean
      - psc1/test/PsKernelMultiInstantiatePerformance.lean
      - psc1/test/PsKernelLiftPerformance.lean
      - psc1/test/PsKernelCorePerformance.lean
      - psc1/kernel-lakefile.lean
      - psc1/check-psc1-source.mjs
      - psc1/scripts/pskernel-generated-smoke.mjs
      - psc1/scripts/pskernel-canonical-provider.mjs
      - psc1/scripts/pskernel-provider-smoke.mjs
      - psc1/scripts/pskernel-artifact-manifest.mjs
      - psc1/npm-runtime/canonical-admissions-wire.mjs
      - psc1/scripts/pskernel-expr-v2-dag-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-infer-only-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-proof-irrelevance-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-lazy-nat-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-lazy-delta-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-full-shape-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-final-rules-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-admission-guard-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-quot-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-recursor-smoke.mjs
      - psc1/test/PsKernelExprV2RecursorKRegression.lean
      - psc1/test/PsKernelExprV2RecursorMajorProofs.lean
      - psc1/test/PsKernelExprV2RecursorKProofs.lean
      - psc1/scripts/pskernel-expr-v2-recursor-k-smoke.mjs
      - psc1/test/PsKernelExprV2GeneratedOwnerRegression.lean
      - psc1/test/PsKernelExprV2GeneratedOwnerProofs.lean
      - psc1/scripts/pskernel-expr-v2-generated-owner-smoke.mjs
      - psc1/test/PsKernelExprV2StringProjectionRegression.lean
      - psc1/test/PsKernelExprV2StringProjectionProofs.lean
      - psc1/scripts/pskernel-expr-v2-string-projection-smoke.mjs
      - psc1/test/PsKernelExprV2OwnedStateRegression.lean
      - psc1/test/PsKernelExprV2OwnedStateProofs.lean
      - psc1/scripts/pskernel-expr-v2-owned-state-smoke.mjs
      - psc1/scripts/pskernel-nat-runtime-smoke.mjs
      - .github/workflows/psc1-pskernel-core-correctness.yml

permissions:
  contents: read

jobs:
  native-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean via elan
        shell: bash
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - name: Verify toolchain and compile the independent kernel
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lean --version
          lake -f kernel-lakefile.lean build PsKernelCore psc1_kernel_regression psc1_kernel_perf psc1_kernel_instantiate_perf psc1_kernel_multi_perf psc1_kernel_lift_perf
      - name: Run native safety and semantics regression
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean exe psc1_kernel_regression
      - name: Run same-process old-versus-C0 beta-spine performance comparison
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean exe psc1_kernel_perf
      - name: Run native C0 single-substitution parity and performance comparison
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean exe psc1_kernel_instantiate_perf
      - name: Run same-run C0 multi-variable substitution performance comparison
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean exe psc1_kernel_multi_perf
      - name: Measure same-run C0 binder-aware lifting and require parity
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean exe psc1_kernel_lift_perf

  psc1-portability:
    runs-on: ubuntu-latest
    # Build time only; kernel and Arena per-case resource policies are unchanged.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean via elan
        shell: bash
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - name: Check kernel modules are in portable source profile
        working-directory: psc1
        run: |
          set -euo pipefail
          node check-psc1-source.mjs --all-portable
      - name: Build real PSC1 compiler
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build psc1
      - name: Translate first kernel source through PSC1
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 translate packages/pskernel-core/src/Ps/KernelCore/Core/Name.lean --to ps --out /tmp/psc1-pskernel-name.ps
          test -s /tmp/psc1-pskernel-name.ps
      - name: Check complete kernel source closure using PSC1
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean

      - name: Reconstruct all kernel sources in canonical .ps
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap-project.mjs \
            packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean \
            dist/pskernel-selfhost/workspace
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { assertBootstrapWorkspaceManifest } from './scripts/bootstrap-manifest.mjs';
          import { packageBySection, parseImports } from './scripts/workspace-layout.mjs';
          const workspace='dist/pskernel-selfhost/workspace';
          const entry='packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean';
          const manifest=JSON.parse(readFileSync(workspace+'/.proofscript-bootstrap.json','utf8'));
          const expected=new Set(), visited=new Set();
          function visit(source){
            if(visited.has(source))return;
            visited.add(source);
            const text=readFileSync(source,'utf8');
            for(const imported of parseImports(text)){
              const parts=imported.split('.');
              let dependency;
              if(parts[0]==='ProofScript'){
                dependency=path.posix.join('stdlib',...parts)+'.lean';
              }else if(parts[0]==='Ps' && packageBySection.has(parts[1])){
                dependency=path.posix.join('packages',packageBySection.get(parts[1]),'src',...parts)+'.lean';
              }else throw Error('PSKERNEL_CLOSURE_UNKNOWN_IMPORT '+imported);
              visit(dependency);
            }
            expected.add(source.replace(/\.lean$/u,'.ps'));
          }
          visit(entry);
          if(manifest.entry!==entry.replace(/\.lean$/u,'.ps') ||
              manifest.sourceCount!==expected.size ||
              manifest.generated.length!==expected.size ||
              new Set(manifest.generated).size!==expected.size ||
              !manifest.generated.every(p=>expected.has(p)))
            throw Error('PSKERNEL_PORTABLE_FULL_SOURCE_CLOSURE_REQUIRED');
          await assertBootstrapWorkspaceManifest(workspace,manifest,'bootstrap');
          console.log('PSKERNEL_CANONICAL_PS_SOURCES: PASS modules='+expected.size);
          NODE
      - name: PSC1 checks generated ProofScript kernel
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lake exe psc1 check dist/pskernel-selfhost/workspace/packages/pskernel-core/src/Ps/KernelCore/SelfHost.ps
      - name: Install pinned TypeScript 7 for generated portable kernel
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate independent JS kernel from the .ps closure
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/psc1-kernel-ts7
          echo '{"name":"psc1-kernel-ts7-isolated","private":true,"version":"0.0.0"}' > /tmp/psc1-kernel-ts7/package.json
          npm install --prefix /tmp/psc1-kernel-ts7 --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          export PSC0_TSC=/tmp/psc1-kernel-ts7/node_modules/typescript/bin/tsc
          test -f "$PSC0_TSC"
          node "$PSC0_TSC" --version
          lake exe psc1 build \
            dist/pskernel-selfhost/workspace/packages/pskernel-core/src/Ps/KernelCore/SelfHost.ps \
            --out dist/pskernel-selfhost/pskernel-core.js
          test -s dist/pskernel-selfhost/pskernel-core.js
          test -s dist/pskernel-selfhost/pskernel-core.d.ts
          test -s dist/pskernel-selfhost/pskernel-core.js.map
          node --check dist/pskernel-selfhost/pskernel-core.js
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const map=JSON.parse(readFileSync('dist/pskernel-selfhost/pskernel-core.js.map','utf8'));
          if(map.version!==3 || !Array.isArray(map.sources) || map.sources.length===0 ||
              typeof map.mappings!=='string' || map.mappings.length===0)
            throw Error('PSKERNEL_INVALID_GENERATED_SOURCE_MAP');
          NODE
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          mkdir -p "$PSC1_PS_RUN_DIR"
          cp dist/pskernel-selfhost/pskernel-core.js "$PSC1_PS_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-generated-smoke.mjs "$PSC1_PS_RUN_DIR/smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-canonical-js-smoke.log"
          echo 'PSC1_GENERATED_JS_KERNEL: PASS'
      - name: Run checked DAG semantics from the canonical ProofScript bundle
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          test -s "$PSC1_PS_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-expr-v2-dag-smoke.mjs "$PSC1_PS_RUN_DIR/dag-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" --expose-gc dag-smoke.mjs kernel.mjs 2>&1 \
            | tee "$RUNNER_TEMP/psc1-canonical-dag-smoke.log" \
            | sed -u '/^PSC1_DAG_PASS /d'
          grep -q '^PSC1_V2_DAG_JS: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -Fqx 'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q 'PSC1_EXPR_EQUALITY_DELAYED_JS: PASS hostile=21 staged=2 sharedDepth=64' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_ZETA: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BETA: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_TRANSFORM_JS: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_DELTA: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BINDER: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CHECK_LET: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_LET_CACHE_SCOPE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_LET_LOCAL_WHNF: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_STATEFUL_DEFEQ: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_APP_CONVERSION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_APP_CONVERSION_CACHE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_APP_EAGER_CONTEXT: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_SIMPLE_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_ADMISSION_SHARED_STATE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_ADMISSION_POLICY_SAFETY: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_ADMISSION_FINAL_GUARDS: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_THEOREM_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_THEOREM_ISPROP_STATE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_UNSAFE_ADMISSION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_UNSAFE_FRESH_BODY: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_MUTUAL_ADMISSION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_MUTUAL_FRESH_MEMBER: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BINDER_SPINE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BINDER_SPINE_BUDGET: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BINDER_SPINE_CACHE: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_BINDER_SPINE_FALLBACK: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_DEFEQ_PREFIX: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CHEAP_CORE_POLICY: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_CHEAP_PROJECTION_POLICY: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_DEFEQ_REFLECTION: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          grep -q '^PSC1_V2_DAG_JS_DEFEQ_PREFIX_GUARDS: PASS' "$RUNNER_TEMP/psc1-canonical-dag-smoke.log"
          echo 'PSC1_CANONICAL_DAG_JS_KERNEL: PASS'
      - name: Run inference-mode parity from the canonical ProofScript executable
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-infer-only-smoke.mjs "$PSC1_PS_RUN_DIR/infer-only-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" infer-only-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-canonical-infer-only.log"
          grep -q 'PSC1_V2_DAG_JS_INFER_ONLY: PASS' "$RUNNER_TEMP/psc1-canonical-infer-only.log"
      - name: Check large numerals in the canonical ProofScript executable
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-nat-runtime-smoke.mjs "$PSC1_PS_RUN_DIR/nat-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" nat-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-canonical-nat-smoke.log"
          grep -q 'PSC1_NAT_LARGE_RUNTIME: PASS' "$RUNNER_TEMP/psc1-canonical-nat-smoke.log"
      - name: Check canonical-source DAG proof irrelevance in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-proof-irrelevance-smoke.mjs "$PSC1_PS_RUN_DIR/proof-irrelevance-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" proof-irrelevance-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-proof-irrelevance-canonical.log"
          grep -q 'PSC1_V2_DAG_JS_PROOF_IRRELEVANCE: PASS comparisons=1350' "$RUNNER_TEMP/psc1-proof-irrelevance-canonical.log"
          grep -Fq 'PSC1_V2_DAG_JS_PROOF_IRRELEVANCE_TERMINAL: PASS comparisons=180' "$RUNNER_TEMP/psc1-proof-irrelevance-canonical.log"
      - name: Check canonical-source ordered DAG Nat DefEq in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-lazy-nat-smoke.mjs "$PSC1_PS_RUN_DIR/lazy-nat-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" lazy-nat-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-lazy-nat-canonical.log"
          grep -q 'PSC1_V2_DAG_JS_LAZY_NAT: PASS comparisons=1350 stage=192' "$RUNNER_TEMP/psc1-lazy-nat-canonical.log"
      - name: Check canonical-source ordered DAG lazy delta DefEq in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-lazy-delta-smoke.mjs "$PSC1_PS_RUN_DIR/lazy-delta-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" lazy-delta-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-lazy-delta-canonical.log"
          grep -q 'PSC1_V2_DAG_JS_LAZY_DELTA: PASS comparisons=1800 stage=1024 steps=128' "$RUNNER_TEMP/psc1-lazy-delta-canonical.log"
      - name: Check canonical-source ordered DAG full-shape and residual DefEq in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-full-shape-smoke.mjs "$PSC1_PS_RUN_DIR/full-shape-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" full-shape-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-full-shape-canonical.log"
          grep -q 'PSC1_V2_DAG_JS_FULL_SHAPE: PASS stageComparisons=342 ownerComparisons=108' "$RUNNER_TEMP/psc1-full-shape-canonical.log"
      - name: Check canonical-source ordered DAG terminal DefEq in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-final-rules-smoke.mjs "$PSC1_PS_RUN_DIR/final-rules-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" final-rules-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-final-rules-canonical.log"
          grep -q 'PSC1_V2_DAG_JS_FINAL_RULES: PASS owner=648 final=216 projection=175 stringBuild=144 stringStage=32' "$RUNNER_TEMP/psc1-final-rules-canonical.log"
      - name: Check canonical-source DAG admission guards in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_PS_RUN_DIR="$RUNNER_TEMP/psc1-ps-standalone"
          cp scripts/pskernel-expr-v2-admission-guard-smoke.mjs "$PSC1_PS_RUN_DIR/admission-guard-smoke.mjs"
          cd "$PSC1_PS_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" admission-guard-smoke.mjs kernel.mjs \
