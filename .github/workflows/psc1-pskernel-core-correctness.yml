            | tee "$RUNNER_TEMP/psc1-string-projection-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_STRING_PROJECTION_MATRIX_JS: PASS public=126 core=504 fixed=480' "$RUNNER_TEMP/psc1-string-projection-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_STRING_PROJECTION_STATE_JS: PASS cases=48 propagated=240' "$RUNNER_TEMP/psc1-string-projection-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_STRING_PROJECTION_CHECKED_JS: PASS valid=6 invalid=3' "$RUNNER_TEMP/psc1-string-projection-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_STRING_PROJECTION_SCOPE_JS: PASS missingEnvironment=18' "$RUNNER_TEMP/psc1-string-projection-canonical.log"
      - name: Check canonical-source mutual and nested DAG owners in detached Node
