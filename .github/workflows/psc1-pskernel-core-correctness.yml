          retention-days: 30

  # Reuse this run's checked producer. Each fresh process readmits the complete
  # authentic closure and executes one unchanged sample, including its negatives.
  t01f-canonical-shards:
    needs: [psc1-portability]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-canonical-kernel-qualification
          path: ${{ runner.temp }}/psc1-t01f-canonical-producer
      - name: Authenticate inputs and execute the complete selected String sample
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pskernel-t01f-shards.mjs
          node --check scripts/pskernel-expr-v2-string-environment-smoke.mjs
          node scripts/pskernel-t01f-shards.mjs run canonical \
            "$RUNNER_TEMP/psc1-t01f-canonical-producer" \
            "$RUNNER_TEMP/psc1-t01f-canonical-${{ matrix.sample }}" "${{ matrix.sample }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-canonical-shard-${{ matrix.sample }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/psc1-t01f-canonical-${{ matrix.sample }}/receipt.json
            ${{ runner.temp }}/psc1-t01f-canonical-${{ matrix.sample }}/inputs.json
            ${{ runner.temp }}/psc1-t01f-canonical-${{ matrix.sample }}/generated.log
            ${{ runner.temp }}/psc1-t01f-canonical-${{ matrix.sample }}/generated.memory
          if-no-files-found: error
          retention-days: 30

  t01f-canonical-complete:
    if: ${{ always() }}
    needs: [psc1-portability, t01f-canonical-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every producer and shard job to succeed
        env:
          PSC1_T01F_PRODUCER_RESULT: ${{ needs.psc1-portability.result }}
          PSC1_T01F_SHARDS_RESULT: ${{ needs.t01f-canonical-shards.result }}
        run: |
          set -euo pipefail
          test "$PSC1_T01F_PRODUCER_RESULT" = success
          test "$PSC1_T01F_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-canonical-kernel-qualification
          path: ${{ runner.temp }}/psc1-t01f-canonical-producer
      - uses: actions/download-artifact@v4
        with:
          pattern: psc1-t01f-canonical-shard-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psc1-t01f-canonical-receipts
          merge-multiple: false
      - name: Reauthenticate and require all six complete String samples
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pskernel-t01f-shards.mjs aggregate canonical \
            "$RUNNER_TEMP/psc1-t01f-canonical-producer" \
            "$RUNNER_TEMP/psc1-t01f-canonical-receipts" \
            "$RUNNER_TEMP/psc1-t01f-canonical-complete"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-canonical-complete-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psc1-t01f-canonical-complete/
          if-no-files-found: error
          retention-days: 30


