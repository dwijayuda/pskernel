          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_STATE_JS: PASS sequence=4 propagated=40' "$RUNNER_TEMP/psc1-recursor-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_FAMILY_JS: PASS comparisons=70 fields=20' "$RUNNER_TEMP/psc1-recursor-canonical.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_STRING_JS: PASS callbacks=24 propagated=48' "$RUNNER_TEMP/psc1-recursor-canonical.log"
      - name: Check canonical-source DAG K conversion in detached Node
