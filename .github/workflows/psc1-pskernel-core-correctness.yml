            | tee "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_DIRECT_ADMISSION_PASS cases=2' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_CHECKED_PASS valid=6 invalid=3 declarations=2 batch=6' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_MATRIX_PASS public=108 core=432 reducer=648' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_FIXED_OWNER_PASS cases=96' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_OWNER_PASS carrier=16 propagated=16 metadata=16' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Fqx 'PSC1_V2_K_GENERATED_ORDER_PASS guards=5' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
          grep -Eq '^PSC1_V2_RECURSOR_K_GENERATED_PASS assertions=[0-9]+$' "$RUNNER_TEMP/psc1-recursor-k-canonical.log"
      - name: Check canonical-source DAG String projection in detached Node
