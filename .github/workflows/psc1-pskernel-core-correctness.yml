            ${{ runner.temp }}/psc1-lazy-nat-canonical.log
            ${{ runner.temp }}/psc1-lazy-delta-canonical.log
            ${{ runner.temp }}/psc1-full-shape-canonical.log
            ${{ runner.temp }}/psc1-final-rules-canonical.log
            ${{ runner.temp }}/psc1-admission-guard-canonical.log
            ${{ runner.temp }}/psc1-quot-canonical.log
            ${{ runner.temp }}/psc1-recursor-canonical.log
            ${{ runner.temp }}/psc1-recursor-k-canonical.log
            ${{ runner.temp }}/psc1-string-projection-canonical.log
            ${{ runner.temp }}/psc1-generated-owner-canonical.log
            ${{ runner.temp }}/psc1-owned-state-canonical.log
            psc1/dist/pskernel-selfhost/provider/
            psc1/dist/pskernel-selfhost/workspace/.proofscript-bootstrap.json
            psc1/dist/pskernel-selfhost/pskernel-core.js
            psc1/dist/pskernel-selfhost/pskernel-core.d.ts
            psc1/dist/pskernel-selfhost/pskernel-core.js.map
            ${{ runner.temp }}/psc1-canonical-js-smoke.log
            ${{ runner.temp }}/psc1-canonical-dag-smoke.log
            ${{ runner.temp }}/psc1-canonical-nat-smoke.log
            ${{ runner.temp }}/psc1-canonical-infer-only.log
            ${{ runner.temp }}/psc1-direct-capability.log
          retention-days: 30
