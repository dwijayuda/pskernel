name: PSC1 production decoder storage and whole decoder correspondence proof preflight
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-decoder-bridge-20261025
    paths:
    - .github/workflows/psc1-pskernel-decoder-bridge-preflight.yml
    - psc1/test/PsKernelExprV2ReplayMetadataProofs.lean
    - psc1/test/PsKernelExprV2SemanticPrefixProofs.lean
    - psc1/test/PsKernelExprV2DecodedNodeProofs.lean
    - psc1/test/PsKernelExprV2DecodedBridgeProofs.lean
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install and authenticate pinned Lean and exact source
      shell: bash
      run: |
        set -euo pipefail
        bash psc1/scripts/install-lean435-ci.sh
        export PATH="$HOME/.elan/bin:$PATH"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 20224a295359abb201f56c72395690bf0bfac9fa "$GITHUB_SHA" -- \
          psc1/packages/pskernel-core/src psc1/kernel-lakefile.lean psc1/lean-toolchain \
          psc1/scripts/install-lean435-ci.sh psc1/test/PsKernelExprV2MetadataProofs.lean \
          psc1/test/PsKernelExprV2PagedModelProofs.lean
        git diff --exit-code 0b9d2086382cedddc8b8d9b9ab798e9525bf6ba1 "$GITHUB_SHA" -- \
          psc1/test/PsKernelExprV2ReplayMetadataProofs.lean
        git diff --exit-code 58f900330404dfc8d441b856b1c22ca29145570e "$GITHUB_SHA" -- \
          psc1/test/PsKernelExprV2SemanticPrefixProofs.lean
        git diff --exit-code 25cff6f2ad8fa6cd8b24b8c9241d9c6e3028089b "$GITHUB_SHA" -- \
          psc1/test/PsKernelExprV2DecodedNodeProofs.lean
        test "$(cat psc1/lean-toolchain)" = "leanprover/lean4:v4.35.0"
        (cd psc1 && test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc")
        mkdir -p "$RUNNER_TEMP/decoder-bridge-preflight"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re,subprocess
        specs=[{"module":"PsKernelExprV2MetadataProofs","count":8,"log":"replay-PsKernelExprV2MetadataProofs.log"},{"module":"PsKernelExprV2PagedModelProofs","count":17,"log":"replay-PsKernelExprV2PagedModelProofs.log"},{"module":"PsKernelExprV2ReplayMetadataProofs","count":4,"log":"replay-PsKernelExprV2ReplayMetadataProofs.log"},{"module":"PsKernelExprV2SemanticPrefixProofs","count":8,"log":"prefix-PsKernelExprV2SemanticPrefixProofs.log"},{"module":"PsKernelExprV2DecodedNodeProofs","count":2,"log":"decoder-PsKernelExprV2DecodedNodeProofs.log"},{"module":"PsKernelExprV2DecodedBridgeProofs","count":12,"log":"decoder-PsKernelExprV2DecodedBridgeProofs.log"}]
        paths=['psc1/test/'+s['module']+'.lean' for s in specs]+[
          '.github/workflows/psc1-pskernel-decoder-bridge-preflight.yml',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Validation.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Decode.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Paged.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Builder.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Node.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Research/ExprV2Validation.lean',
          'psc1/kernel-lakefile.lean','psc1/lean-toolchain','psc1/scripts/install-lean435-ci.sh']
        if len(paths)!=16 or len(set(paths))!=16:
            raise RuntimeError('Exact16 distinct decoder-bridge source inputs required')
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'decoder-bridge-preflight'
        records=[]
        for name in paths:
            raw=pathlib.Path(name).read_bytes()
            record={'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                    'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            target=out/'sources'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
            records.append(record)
        report={'schema':'psc1-decoder-bridge-proof-source-v1','sourceSha':os.environ['GITHUB_SHA'],
                'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'leanGitHash':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc',
                'baselineSha':'20224a295359abb201f56c72395690bf0bfac9fa',
                'retainedReplaySha':'0b9d2086382cedddc8b8d9b9ab798e9525bf6ba1',
                'retainedLocalReplayProofUnchanged':True,
                'retainedSemanticPrefixSha':'58f900330404dfc8d441b856b1c22ca29145570e',
                'retainedSemanticPrefixProofUnchanged':True,
                'retainedDecodedNodeSha':'25cff6f2ad8fa6cd8b24b8c9241d9c6e3028089b',
                'retainedDecodedNodeProofUnchanged':True,
                'productionSourceTree':subprocess.check_output(
                    ['git','rev-parse','HEAD:psc1/packages/pskernel-core/src'],text=True).strip(),
                'productionAndRetainedProofsUnchanged':True,'files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_DECODER_BRIDGE_PROOF_SOURCE: PASS '+json.dumps(report,separators=(',',':')))
        PY
    - name: Build native production imports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelExprV2PagedModelNativeProofs \
          Ps.KernelCore.Core.ExprV2.Validation \
          Ps.KernelCore.Core.ExprV2.Decode \
          2>&1 | tee "$RUNNER_TEMP/decoder-bridge-preflight/native-build.log"
    - name: Compile 51 retained reports and production decoder storage/global correspondence reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_replay_failed=0
        : > "$RUNNER_TEMP/decoder-bridge-preflight/proof-status.log"
        for PSC1_REPLAY_SPEC in \
          'PsKernelExprV2MetadataProofs:8:replay-PsKernelExprV2MetadataProofs.log' \
          'PsKernelExprV2PagedModelProofs:17:replay-PsKernelExprV2PagedModelProofs.log' \
          'PsKernelExprV2ReplayMetadataProofs:4:replay-PsKernelExprV2ReplayMetadataProofs.log' \
          'PsKernelExprV2SemanticPrefixProofs:8:prefix-PsKernelExprV2SemanticPrefixProofs.log' \
          'PsKernelExprV2DecodedNodeProofs:2:decoder-PsKernelExprV2DecodedNodeProofs.log' \
          'PsKernelExprV2DecodedBridgeProofs:12:decoder-PsKernelExprV2DecodedBridgeProofs.log'; do
          IFS=: read -r PSC1_REPLAY_MODULE PSC1_REPLAY_COUNT PSC1_REPLAY_LOG <<< "$PSC1_REPLAY_SPEC"
          psc1_replay_count_status=0
          psc1_replay_lean_status=0
          test "$(grep -c '^#print axioms ' "test/$PSC1_REPLAY_MODULE.lean")" -eq "$PSC1_REPLAY_COUNT" \
            || psc1_replay_count_status=$?
          if [ "$PSC1_REPLAY_MODULE" = "PsKernelExprV2ReplayMetadataProofs" ] \
            || [ "$PSC1_REPLAY_MODULE" = "PsKernelExprV2SemanticPrefixProofs" ] \
            || [ "$PSC1_REPLAY_MODULE" = "PsKernelExprV2DecodedNodeProofs" ]; then
            mkdir -p .lake/build/lib/lean
            lake -f kernel-lakefile.lean env lean --root=test \
              -o ".lake/build/lib/lean/$PSC1_REPLAY_MODULE.olean" "test/$PSC1_REPLAY_MODULE.lean" \
              2>&1 | tee "$RUNNER_TEMP/decoder-bridge-preflight/$PSC1_REPLAY_LOG" \
              || psc1_replay_lean_status=$?
          else
            lake -f kernel-lakefile.lean env lean "test/$PSC1_REPLAY_MODULE.lean" \
              2>&1 | tee "$RUNNER_TEMP/decoder-bridge-preflight/$PSC1_REPLAY_LOG" \
              || psc1_replay_lean_status=$?
          fi
          printf 'PSC1_DECODER_BRIDGE_PROOF_STATUS module=%s count=%s countStatus=%s leanStatus=%s\n' \
            "$PSC1_REPLAY_MODULE" "$PSC1_REPLAY_COUNT" "$psc1_replay_count_status" "$psc1_replay_lean_status" \
            | tee -a "$RUNNER_TEMP/decoder-bridge-preflight/proof-status.log"
          if [ "$psc1_replay_count_status" -ne 0 ] || [ "$psc1_replay_lean_status" -ne 0 ]; then
            psc1_replay_failed=1
          fi
        done
        test "$psc1_replay_failed" -eq 0
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        specs=[{"module":"PsKernelExprV2MetadataProofs","count":8,"log":"replay-PsKernelExprV2MetadataProofs.log"},{"module":"PsKernelExprV2PagedModelProofs","count":17,"log":"replay-PsKernelExprV2PagedModelProofs.log"},{"module":"PsKernelExprV2ReplayMetadataProofs","count":4,"log":"replay-PsKernelExprV2ReplayMetadataProofs.log"},{"module":"PsKernelExprV2SemanticPrefixProofs","count":8,"log":"prefix-PsKernelExprV2SemanticPrefixProofs.log"},{"module":"PsKernelExprV2DecodedNodeProofs","count":2,"log":"decoder-PsKernelExprV2DecodedNodeProofs.log"},{"module":"PsKernelExprV2DecodedBridgeProofs","count":12,"log":"decoder-PsKernelExprV2DecodedBridgeProofs.log"}]
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'decoder-bridge-preflight'
        def digest(path):
            raw=path.read_bytes();return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        records=[];all_names=[]
        allowed={'propext','Classical.choice','Quot.sound'}
        statuses=[]
        for spec in specs:
            module,count,filename=spec['module'],spec['count'],spec['log']
            source=pathlib.Path('test')/(module+'.lean')
            names=re.findall(r'(?m)^#print axioms (\S+)\s*$',source.read_text())
            names=[name if '.' in name else module+'.'+name for name in names]
            if len(names)!=count or len(set(names))!=count:
                raise RuntimeError('Exact unique source proof inventory required: '+module)
            raw=(root/filename).read_text()
            reports=re.findall(r"'([^']+)' (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",raw)
            if [name for name,_ in reports]!=names:
                raise RuntimeError('Actual ordered proof inventory mismatch: '+module)
            if any(token in raw for token in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler']):
                raise RuntimeError('Forbidden proof dependency: '+module)
            if re.search(r'\.lean:\d+:\d+: error:',raw):
                raise RuntimeError('Lean proof error: '+module)
            for name,used in reports:
                if {axiom.strip() for axiom in used.split(',') if axiom.strip()}-allowed:
                    raise RuntimeError('Unapproved proof axiom: '+name)
            all_names.extend(names)
            records.append({'module':module,'proofs':count,'names':names,
                            'source':digest(source),'log':digest(root/filename)})
            statuses.append('PSC1_DECODER_BRIDGE_PROOF_STATUS module='+module+' count='+str(count)+' countStatus=0 leanStatus=0')
        if len(all_names)!=51 or len(set(all_names))!=51:
            raise RuntimeError('Exact51 distinct retained and production decoder reports required')
        if (root/'proof-status.log').read_text().splitlines()!=statuses:
            raise RuntimeError('Exact six successful proof command statuses required')
        inventory=root/'source-inventory.json'
        source_record=json.loads(inventory.read_text())
        repo=pathlib.Path.cwd().parent
        for item in source_record['files']:
            if digest(repo/item['path'])!={'bytes':item['bytes'],'sha256':item['sha256']}:
                raise RuntimeError('Source changed after authentication: '+item['path'])
        receipt={'schema':'psc1-decoder-bridge-preflight-v1','sourceSha':os.environ['GITHUB_SHA'],
                 'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                 'status':'pass','proofModules':6,'totalProofs':51,'proofs':records,
                 'sourceInventory':digest(inventory),'proofStatuses':digest(root/'proof-status.log'),
                 'orderedUniqueReports':True,'allowedStandardAxiomsOnly':True,
                 'localReplayMetadataCorrespondenceEstablished':True,
                 'replayNodeBranchesCovered':12,
                 'successfulReplayPreservesLayoutAndPriorLookups':True,
                 'actualMetadataGuardTransfersCorrespondence':True,
                 'consistentSharedSemanticPrefixEstablished':True,
                 'freshMeaningPreservesPriorInterpretations':True,
                 'sourceCanonicalNodeAlignmentEstablished':True,
                 'wholeValidatorMetadataCorrespondenceEstablished':True,
                 'decodedPrefixUsesActualRequire':True,
                 'decodedNodeCorrespondenceEstablished':True,
                 'decodedNodeConstructorBranchesCovered':12,
                 'decoderStoragePreservationEstablished':True,
                 'decoderCorrespondenceEstablished':True,
                 'decoderSuccessAfterPublicValidationEstablished':True,
                 'decoderUsesActualCanonicalFuel':True,
                 'untrustedSourceValidityAssumed':False,
                 'replayArenaModelBridgeEstablished':False,
                 'productionChanges':False,'fullQualification':False,'performanceQualified':False}
        (root/'native-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_DECODER_BRIDGE_PROOF_PREFLIGHT: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-decoder-bridge-preflight-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/decoder-bridge-preflight/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 30
