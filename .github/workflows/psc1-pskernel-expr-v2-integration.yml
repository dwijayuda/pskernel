name: PSC1 Expression V2 production integration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/psc1-pskernel-expr-v2-lean435-20261021
      - work/psc1-pskernel-t03b-session-20261022
      - research/psc1-pskernel-v2-staged-20261021
      - research/psc1-pskernel-v2-carrier-20261021
    paths:
      - psc1/scripts/install-lean435-ci.sh
      - psc1/lean-toolchain
      - psc1/packages/pskernel-core/AI_WORK_STATE.md
      - psc1/packages/pskernel-core/src/**
      - psc1/test/PsKernelInvalidRecursorOccurrenceRegression.lean
      - psc1/scripts/pskernel-invalid-recursor-occurrence-smoke.mjs
      - psc1/packages/pskernel-core/KERNEL_DIAGNOSTICS.json
      - psc1/test/PsKernelExprV2DagRegression.lean
      - psc1/test/PsKernelExprV2InferOnlyRegression.lean
      - psc1/test/PsKernelExprV2ProofIrrelevanceRegression.lean
      - psc1/test/PsKernelExprV2LazyNatRegression.lean
      - psc1/test/PsKernelExprV2LazyDeltaRegression.lean
      - psc1/test/PsKernelExprV2FullShapeRegression.lean
      - psc1/test/PsKernelExprV2FinalRulesRegression.lean
      - psc1/test/PsKernelExprV2AdmissionGuardRegression.lean
      - psc1/test/PsKernelExprV2AdmissionGuardProofs.lean
      - psc1/test/PsKernelExprV2QuotRegression.lean
      - psc1/test/PsKernelExprV2RecursorRegression.lean
      - psc1/test/PsKernelExprV2GeneratedPrefixRegression.lean
      - psc1/test/PsKernelExprV2SessionProofs.lean
      - psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs
      - psc1/test/PsKernelExprV2QuotOwnerRegression.lean
      - psc1/test/PsKernelExprV2QuotOwnerProofs.lean
      - psc1/scripts/pskernel-expr-v2-quot-owner-smoke.mjs
      - psc1/test/PsKernelNameWorkerRegression.lean
      - psc1/test/PsKernelNameWorkerProofs.lean
      - psc1/scripts/pskernel-name-worker-smoke.mjs
      - psc1/test/PsKernelExprV2RecursorProofs.lean
      - psc1/test/PsKernelExprV2WhnfABIProofs.lean
      - psc1/test/PsKernelExprV2DagPerformance.lean
      - psc1/test/PsKernelExprV2TransformRegression.lean
      - psc1/test/PsKernelExprV2MetadataProofs.lean
      - psc1/test/PsKernelCacheScopeProofs.lean
      - psc1/test/PsKernelNatFuelProofs.lean
      - psc1/test/PsKernelExprEqualityProofs.lean
      - psc1/test/PsKernelKnotFuelProofs.lean
      - psc1/scripts/pskernel-nat-runtime-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-dag-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-infer-only-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-proof-irrelevance-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-lazy-nat-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-lazy-delta-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-full-shape-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-final-rules-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-admission-guard-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-quot-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-recursor-smoke.mjs
      - psc1/test/PsKernelExprV2RecursorKRegression.lean
      - psc1/test/PsKernelExprV2RecursorMajorProofs.lean
      - psc1/test/PsKernelExprV2RecursorKProofs.lean
      - psc1/scripts/pskernel-expr-v2-recursor-k-smoke.mjs
      - psc1/test/PsKernelExprV2OwnedStateRegression.lean
      - psc1/test/PsKernelExprV2OwnedStateProofs.lean
      - psc1/scripts/pskernel-expr-v2-owned-state-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-dag-bench.mjs
      - psc1/scripts/pskernel-expr-v2-admission-bench.mjs
      - psc1/scripts/pskernel-generated-profile.mjs
      - psc1/scripts/pskernel-whole-js-bench.mjs
      - psc1/scripts/pskernel-js-memory-probe.mjs
      - psc1/host/kernel-provider/**
      - psc1/test/PsKernelProviderOfficial.lean
      - psc1/scripts/pskernel-canonical-provider.mjs
      - psc1/scripts/pskernel-provider-smoke.mjs
      - psc1/scripts/pskernel-artifact-manifest.mjs
      - psc1/npm-runtime/canonical-admissions-wire.mjs
      - psc1/kernel-lakefile.lean
      - .github/workflows/psc1-pskernel-expr-v2-integration.yml

permissions:
  contents: read

jobs:
  native-dag-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - name: Compile complete checker with checked DAG input
        id: kernel_build
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          node --check scripts/pskernel-expr-v2-recursor-smoke.mjs
          node --check scripts/pskernel-expr-v2-generated-prefix-smoke.mjs
          node --check scripts/pskernel-expr-v2-quot-owner-smoke.mjs
          node --check scripts/pskernel-name-worker-smoke.mjs
          node --check scripts/pskernel-expr-v2-recursor-k-smoke.mjs
          node --check scripts/pskernel-expr-v2-owned-state-smoke.mjs
          # Run the new authentic mode-crossing sentinel against exact parent semantics.
          # Only these two production files are replaced; new regression assertions stay intact.
          PSC1_CORE_V1=packages/pskernel-core/src/Ps/KernelCore/Checker/Reduction/WhnfCore.lean
          PSC1_CORE_V2=packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/WhnfOwned.lean
          restore_kernel_sources() {
            git restore --source="$GITHUB_SHA" -- "$PSC1_CORE_V1" "$PSC1_CORE_V2"
          }
          git fetch --no-tags --depth=1 origin 3aa077cb64ff06f76727decd01c43ad6c33f351d
          trap restore_kernel_sources EXIT
          git show 3aa077cb64ff06f76727decd01c43ad6c33f351d:psc1/"$PSC1_CORE_V1" > "$PSC1_CORE_V1"
          git show 3aa077cb64ff06f76727decd01c43ad6c33f351d:psc1/"$PSC1_CORE_V2" > "$PSC1_CORE_V2"
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_recursor_regression
          set +e
          .lake/build/bin/psc1_kernel_expr_v2_recursor_regression > "$RUNNER_TEMP/psc1-cache-mode-parent.log" 2>&1
          PSC1_BASELINE_STATUS=$?
          set -e
          test "$PSC1_BASELINE_STATUS" -ne 0
          grep -Fq 'PSC1_V2_RECURSOR_FAIL cache-mode-beta-cheapRec-cannot-publish' "$RUNNER_TEMP/psc1-cache-mode-parent.log"
          restore_kernel_sources
          trap - EXIT
          echo 'PSC1_CACHE_MODE_PARENT_REPRODUCED: PASS source=3aa077cb64ff06f76727decd01c43ad6c33f351d'
          # Reproduce the invalid-recursive-occurrence boundary on exact parent semantics.
          # The existing target refreshes imported kernel oleans; the new test stays unchanged.
          PSC1_OCC_CTOR=packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean
          PSC1_OCC_OUTCOME=packages/pskernel-core/src/Ps/KernelCore/API/Outcome.lean
          restore_occurrence_sources() {
            git restore --source="$GITHUB_SHA" -- "$PSC1_OCC_CTOR" "$PSC1_OCC_OUTCOME"
          }
          trap restore_occurrence_sources EXIT
          git show 3aa077cb64ff06f76727decd01c43ad6c33f351d:psc1/"$PSC1_OCC_CTOR" > "$PSC1_OCC_CTOR"
          git show 3aa077cb64ff06f76727decd01c43ad6c33f351d:psc1/"$PSC1_OCC_OUTCOME" > "$PSC1_OCC_OUTCOME"
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_recursor_regression
          set +e
          lake -f kernel-lakefile.lean env lean --run test/PsKernelInvalidRecursorOccurrenceRegression.lean > "$RUNNER_TEMP/psc1-invalid-occurrence-parent.log" 2>&1
          PSC1_OCC_BASELINE_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/psc1-invalid-occurrence-parent.log"
          test "$PSC1_OCC_BASELINE_STATUS" -ne 0
          grep -Fqx 'PSC1_INVALID_RECURSOR_OCCURRENCE_ORACLE: PASS stuck/reducible/nonrecursive/erased/unsafe controls' "$RUNNER_TEMP/psc1-invalid-occurrence-parent.log"
          grep -Fq 'PSC1_INVALID_RECURSOR_OCCURRENCE_FAIL public-invalid-exact-diagnostic' "$RUNNER_TEMP/psc1-invalid-occurrence-parent.log"
          restore_occurrence_sources
          trap - EXIT
          echo 'PSC1_INVALID_OCCURRENCE_PARENT_REPRODUCED: PASS source=3aa077cb64ff06f76727decd01c43ad6c33f351d'
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_dag_regression psc1_kernel_expr_v2_regression psc1_kernel_expr_v2_dag_performance psc1_kernel_expr_v2_transform_regression psc1_kernel_expr_v2_infer_only_regression psc1_kernel_provider psc1_kernel_expr_v2_proof_irrelevance_regression psc1_kernel_expr_v2_lazy_nat_regression psc1_kernel_expr_v2_lazy_delta_regression psc1_kernel_expr_v2_full_shape_regression psc1_kernel_expr_v2_final_rules_regression psc1_kernel_expr_v2_admission_guard_regression psc1_kernel_expr_v2_quot_regression psc1_kernel_expr_v2_recursor_regression psc1_kernel_expr_v2_recursor_k_regression psc1_kernel_expr_v2_owned_state_regression psc1_kernel_name_worker_regression psc1_kernel_expr_v2_quot_owner_regression
      - name: Check invalid recursor-headed occurrence against official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean env lean --run test/PsKernelInvalidRecursorOccurrenceRegression.lean \
            | tee "$RUNNER_TEMP/psc1-invalid-occurrence-native.log"
          grep -Fqx 'PSC1_INVALID_RECURSOR_OCCURRENCE_ORACLE: PASS stuck/reducible/nonrecursive/erased/unsafe controls' "$RUNNER_TEMP/psc1-invalid-occurrence-native.log"
          grep -Fqx 'PSC1_INVALID_RECURSOR_OCCURRENCE: PASS invalid/reducible/nonrecursive/erased/unsafe/nested/resource/publication controls' "$RUNNER_TEMP/psc1-invalid-occurrence-native.log"
      - name: Run native DAG semantics, adversarial, fuel and official comparison
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e' \
            -o "$RUNNER_TEMP/psc1-dag-native.memory" \
            .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
            | tee "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_REGRESSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_LEAN: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_BETA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_OFFICIAL_NAT: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_PROJECTION_UNSELECTED_FIELD: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHECK_LET: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_CHECK_LET: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_LET_CACHE_SCOPE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_LET_LOCAL_WHNF: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_STATEFUL_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_APP_CONVERSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_APP_CONVERSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_APP_CONVERSION_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_APP_EAGER_CONTEXT: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_SIMPLE_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_ADMISSION_SHARED_STATE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_ADMISSION_POLICY_SAFETY: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_ADMISSION_FINAL_GUARDS: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_SIMPLE_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_THEOREM_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_THEOREM_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_THEOREM_ISPROP_STATE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_UNSAFE_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_UNSAFE_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_UNSAFE_FRESH_BODY: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_MUTUAL_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_MUTUAL_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_MUTUAL_FRESH_MEMBER: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER_SPINE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_BINDER_SPINE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER_SPINE_BUDGET: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER_SPINE_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER_SPINE_FALLBACK: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_DEFEQ_PREFIX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_DEFEQ_PREFIX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHEAP_CORE_POLICY: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHEAP_PROJECTION_POLICY: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_DEFEQ_REFLECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_DEFEQ_PREFIX_GUARDS: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_OFFICIAL_POLY_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          .lake/build/bin/psc1_kernel_expr_v2_regression \
            | tee "$RUNNER_TEMP/psc1-v2-existing-native.log"
      - name: Check inference-only semantics and checked-cache separation
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_infer_only_regression \
            | tee "$RUNNER_TEMP/psc1-infer-only-native.log"
          grep -q 'PSC1_V2_DAG_INFER_ONLY: PASS' "$RUNNER_TEMP/psc1-infer-only-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_INFER_ONLY: PASS' "$RUNNER_TEMP/psc1-infer-only-native.log"
      - name: Check DAG proof irrelevance against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_proof_irrelevance_regression \
            | tee "$RUNNER_TEMP/psc1-proof-irrelevance-native.log"
          grep -q 'PSC1_V2_DAG_PROOF_IRRELEVANCE: PASS comparisons=1350' "$RUNNER_TEMP/psc1-proof-irrelevance-native.log"
          grep -Fq 'PSC1_V2_DAG_PROOF_IRRELEVANCE_TERMINAL: PASS comparisons=180 official=2' "$RUNNER_TEMP/psc1-proof-irrelevance-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_PROOF_IRRELEVANCE: PASS cases=8 invalid=1' "$RUNNER_TEMP/psc1-proof-irrelevance-native.log"
      - name: Check ordered DAG Nat DefEq against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_lazy_nat_regression \
            | tee "$RUNNER_TEMP/psc1-lazy-nat-native.log"
          grep -q 'PSC1_V2_DAG_LAZY_NAT: PASS comparisons=1350 stage=192' "$RUNNER_TEMP/psc1-lazy-nat-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_LAZY_NAT: PASS cases=14 invalid=1' "$RUNNER_TEMP/psc1-lazy-nat-native.log"
      - name: Check ordered DAG lazy delta DefEq against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_lazy_delta_regression \
            | tee "$RUNNER_TEMP/psc1-lazy-delta-native.log"
          grep -q 'PSC1_V2_DAG_LAZY_DELTA: PASS comparisons=1800 stage=1024 steps=128' "$RUNNER_TEMP/psc1-lazy-delta-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_LAZY_DELTA: PASS cases=18 invalid=4' "$RUNNER_TEMP/psc1-lazy-delta-native.log"
          grep -Fq 'PSC1_V2_PAIR_SCAN: PASS cases=9 equation=all-inputs' "$RUNNER_TEMP/psc1-lazy-delta-native.log"
      - name: Check ordered DAG full-shape and residual DefEq against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_full_shape_regression \
            | tee "$RUNNER_TEMP/psc1-full-shape-native.log"
          grep -q 'PSC1_V2_DAG_FULL_SHAPE: PASS stageComparisons=342 ownerComparisons=108' "$RUNNER_TEMP/psc1-full-shape-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_FULL_SHAPE: PASS cases=6 invalid=1' "$RUNNER_TEMP/psc1-full-shape-native.log"
      - name: Check ordered DAG terminal DefEq against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_final_rules_regression \
            | tee "$RUNNER_TEMP/psc1-final-rules-native.log"
          grep -q 'PSC1_V2_DAG_FINAL_RULES: PASS owner=648 final=216 projection=175 stringBuild=144 stringStage=32' "$RUNNER_TEMP/psc1-final-rules-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_FINAL_RULES: PASS cases=21 invalid=5 strings=8 resource=1' "$RUNNER_TEMP/psc1-final-rules-native.log"
          grep -Fq 'PSC1_V2_STRING_PROJECTION: PASS differential=1296 owners=16 failures=32 officialValid=8 officialInvalid=16' "$RUNNER_TEMP/psc1-final-rules-native.log"
      - name: Check DAG admission guards against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_admission_guard_regression \
            | tee "$RUNNER_TEMP/psc1-admission-guard-native.log"
          grep -q 'PSC1_V2_ADMISSION_GUARD_STATIC: PASS comparisons=420' "$RUNNER_TEMP/psc1-admission-guard-native.log"
          grep -q 'PSC1_V2_ADMISSION_GUARD_HOSTILE: PASS sharedDepth=128 cases=12' "$RUNNER_TEMP/psc1-admission-guard-native.log"
          grep -q 'PSC1_V2_ADMISSION_GUARD_PUBLIC: PASS comparisons=672' "$RUNNER_TEMP/psc1-admission-guard-native.log"
          grep -q 'PSC1_V2_ADMISSION_GUARD_OFFICIAL: PASS cases=8 doCheck=true' "$RUNNER_TEMP/psc1-admission-guard-native.log"
          grep -q 'PSC1_V2_ADMISSION_GUARD: PASS' "$RUNNER_TEMP/psc1-admission-guard-native.log"
      - name: Check DAG Quot reduction against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_quot_regression \
            | tee "$RUNNER_TEMP/psc1-quot-native.log"
          grep -q 'PSC1_V2_DAG_QUOT: PASS public=240 core=480 owners=720 reducer=60' "$RUNNER_TEMP/psc1-quot-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_QUOT: PASS valid=10 invalid=5' "$RUNNER_TEMP/psc1-quot-native.log"
      - name: Check generated recursor ownership and DAG non-K iota against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_recursor_regression \
            | tee "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -q 'PSC1_V2_DAG_RECURSOR: PASS public=252 core=504 owners=720 reducer=72 privateIDs=9' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fq 'PSC1_V2_DAG_RECURSOR_CACHE_MODE: PASS wrappers=2 cheapModes=4 warmCold=8' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fq 'PSC1_V2_DAG_RECURSOR_UNIVERSE_NEGATIVES: PASS cases=2' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_RECURSOR: PASS valid=12 invalid=4 addDecl=3' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_MATRIX: PASS public=126 core=504 owners=360 reducer=432' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_STATE: PASS sequence=4 propagated=40' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_FAMILY: PASS comparisons=70 fields=20' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fqx 'PSC1_V2_DAG_RECURSOR_MAJOR_STRING: PASS callbacks=24 propagated=48 official=6' "$RUNNER_TEMP/psc1-recursor-native.log"
          grep -Fqx 'PSC1_V2_DAG_OFFICIAL_RECURSOR_MAJOR: PASS valid=6 admitted=2 rejected=2' "$RUNNER_TEMP/psc1-recursor-native.log"
      - name: Check authoritative new-prefix mutual and nested owners
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean env lean --run test/PsKernelExprV2GeneratedPrefixRegression.lean \
            | tee "$RUNNER_TEMP/psc1-generated-prefix-native.log"
          grep -Fqx 'PSC1_V2_GENERATED_PREFIX: PASS new=24 recursors=7 direct=6 privateIDs=3' "$RUNNER_TEMP/psc1-generated-prefix-native.log"
          grep -Fqx 'PSC1_V2_GENERATED_PREFIX_OFFICIAL: PASS families=5 positive=6 negative=7' "$RUNNER_TEMP/psc1-generated-prefix-native.log"
          grep -Fqx 'PSC1_V2_SESSION_OWNERS: PASS kinds=8 direct=7 privateIDs=5 forks=2' "$RUNNER_TEMP/psc1-generated-prefix-native.log"
          grep -Fqx 'PSC1_V2_SESSION_OWNERS_OFFICIAL: PASS declarations=4 direct=7' "$RUNNER_TEMP/psc1-generated-prefix-native.log"
      - name: Check DAG K conversion against V1 and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_recursor_k_regression \
            | tee "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_MATRIX_PASS public=108 core=432 reducer=648' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_FIXED_OWNER_PASS cases=96' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_OWNER_PASS carrier=16 propagated=16 metadata=16' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_ORDER_PASS guards=5' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_DIRECT_ADMISSION_PASS cases=2' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_CHECKED_PASS valid=6 invalid=3 declarations=2 batch=6' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_K_OFFICIAL_PASS valid=6 invalid=3 declarations=2' "$RUNNER_TEMP/psc1-recursor-k-native.log"
          grep -Fqx 'PSC1_V2_RECURSOR_K_PASS' "$RUNNER_TEMP/psc1-recursor-k-native.log"
      - name: Check exact name and string comparison workers
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_name_worker_regression \
            | tee "$RUNNER_TEMP/psc1-name-worker-native.log"
          grep -Fqx 'PSC1_NAME_WORKER_STRINGS_PASS raw=24576 full=64 controls=16 long=24' "$RUNNER_TEMP/psc1-name-worker-native.log"
          grep -Fqx 'PSC1_NAME_WORKER_NAMES_PASS pairs=400 deep=4 maxDepth=1024' "$RUNNER_TEMP/psc1-name-worker-native.log"
          grep -Fqx 'PSC1_NAME_WORKER_CHECKING_PASS declarations=10 checked=10 normalized=10 negatives=4 officialPositive=10 officialNegative=4' "$RUNNER_TEMP/psc1-name-worker-native.log"
          grep -Fqx 'PSC1_NAME_WORKER_PASS' "$RUNNER_TEMP/psc1-name-worker-native.log"
      - name: Check checked Quot declaration owner installation
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_quot_owner_regression \
            | tee "$RUNNER_TEMP/psc1-quot-owner-native.log"
          grep -Fqx 'PSC1_V2_QUOT_OWNER_PASS owners=4 cases=10 checks=180 whnf=180 defeq=180 invalidChecks=90 admissions=17 plans=10 repairs=5 private=13 officialPositive=10 officialNegative=7' "$RUNNER_TEMP/psc1-quot-owner-native.log"
      - name: Check complete DAG checker state and callback ownership
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_owned_state_regression \
            | tee "$RUNNER_TEMP/psc1-owned-state-native.log"
          grep -Fqx 'PSC1_V2_OWNED_STATE_PASS carrier=42 propagated=56 differential=540 defeqCarrier=38 defeqPropagated=44' "$RUNNER_TEMP/psc1-owned-state-native.log"
          grep -Fqx 'PSC1_V2_ADMISSION_OWNED_STATE_PASS carrier=8 propagated=12 differential=336 publicWhnf=168' "$RUNNER_TEMP/psc1-owned-state-native.log"
      - name: Check DAG transformation semantics and sharing
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_transform_regression \
            | tee "$RUNNER_TEMP/psc1-transform-native.log"
          grep -q 'PSKERNEL_V2_TRANSFORM_REGRESSION_PASSED' "$RUNNER_TEMP/psc1-transform-native.log"
      - name: Check local metadata and cache-scope theorems
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2MetadataProofs.lean \
            | tee "$RUNNER_TEMP/psc1-metadata-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean \
            | tee "$RUNNER_TEMP/psc1-scope-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelNatFuelProofs.lean \
            | tee "$RUNNER_TEMP/psc1-nat-fuel-proofs.log"
          grep -q 'PSKERNEL_LARGE_NAT_NATIVE: PASS' "$RUNNER_TEMP/psc1-nat-fuel-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelExprEqualityProofs.lean \
            | tee "$RUNNER_TEMP/psc1-expr-equality-proofs.log"
          grep -q 'PSKERNEL_EXPR_EQUALITY_NATIVE: PASS comparisons=800 hostile=21 sharedDepth=64' "$RUNNER_TEMP/psc1-expr-equality-proofs.log"
          test "$(grep -c '^#print axioms ' test/PsKernelKnotFuelProofs.lean)" -eq 16
          lake -f kernel-lakefile.lean env lean test/PsKernelKnotFuelProofs.lean \
            | tee "$RUNNER_TEMP/psc1-knot-fuel-proofs.log"
          grep -q 'PSKERNEL_KNOT_FUEL_PROOFS: PASS workers=15' "$RUNNER_TEMP/psc1-knot-fuel-proofs.log"
          grep -Fq 'PSKERNEL_WHNFCACHE_MODE_PROOFS: PASS allModes=correctedEager fullMode=historical' "$RUNNER_TEMP/psc1-knot-fuel-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2AdmissionGuardProofs.lean \
            | tee "$RUNNER_TEMP/psc1-admission-guard-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2RecursorProofs.lean \
            | tee "$RUNNER_TEMP/psc1-recursor-proofs.log"
          test "$(grep -c '^#print axioms ' test/PsKernelExprV2SessionProofs.lean)" -eq 13
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2SessionProofs.lean \
            | tee "$RUNNER_TEMP/psc1-session-proofs.log"
          test "$(grep -c '^#print axioms ' test/PsKernelExprV2RecursorMajorProofs.lean)" -eq 10
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2RecursorMajorProofs.lean \
            | tee "$RUNNER_TEMP/psc1-recursor-major-proofs.log"
          test "$(grep -c '^#print axioms PsKernelExprV2RecursorKProofs\.' test/PsKernelExprV2RecursorKProofs.lean)" -eq 6
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2RecursorKProofs.lean \
            | tee "$RUNNER_TEMP/psc1-recursor-k-proofs.log"
          test "$(grep -c '^#print axioms ' test/PsKernelNameWorkerProofs.lean)" -eq 8
          lake -f kernel-lakefile.lean env lean test/PsKernelNameWorkerProofs.lean \
            | tee "$RUNNER_TEMP/psc1-name-worker-proofs.log"
          test "$(grep -c '^#print axioms ' test/PsKernelExprV2QuotOwnerProofs.lean)" -eq 21
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2QuotOwnerProofs.lean \
            | tee "$RUNNER_TEMP/psc1-quot-owner-proofs.log"
          test "$(grep -c '^#print axioms PsKernelExprV2WhnfABIProofs\.' test/PsKernelExprV2WhnfABIProofs.lean)" -eq 2
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2WhnfABIProofs.lean \
            | tee "$RUNNER_TEMP/psc1-whnf-abi-proofs.log"
          test "$(grep -c '^#print axioms PsKernelExprV2OwnedStateProofs\.' test/PsKernelExprV2OwnedStateProofs.lean)" -eq 21
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2OwnedStateProofs.lean \
            | tee "$RUNNER_TEMP/psc1-owned-state-proofs.log"
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' \
              "$RUNNER_TEMP/psc1-metadata-proofs.log" "$RUNNER_TEMP/psc1-scope-proofs.log" \
              "$RUNNER_TEMP/psc1-nat-fuel-proofs.log" "$RUNNER_TEMP/psc1-expr-equality-proofs.log" \
              "$RUNNER_TEMP/psc1-admission-guard-proofs.log" \
              "$RUNNER_TEMP/psc1-recursor-proofs.log" \
              "$RUNNER_TEMP/psc1-session-proofs.log" \
              "$RUNNER_TEMP/psc1-recursor-major-proofs.log" \
              "$RUNNER_TEMP/psc1-recursor-k-proofs.log" \
              "$RUNNER_TEMP/psc1-name-worker-proofs.log" \
              "$RUNNER_TEMP/psc1-quot-owner-proofs.log" \
              "$RUNNER_TEMP/psc1-whnf-abi-proofs.log" \
              "$RUNNER_TEMP/psc1-owned-state-proofs.log" \
              "$RUNNER_TEMP/psc1-knot-fuel-proofs.log"; then
            echo 'PSKERNEL_PROOF_UNAPPROVED_TRUST_DEPENDENCY'
            exit 1
          fi
          echo 'PSKERNEL_LOCAL_METADATA_AND_SCOPE_PROOFS: PASS'
      - name: Compare exact provider fixtures with official Lean 4.35
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean env lean --run test/PsKernelProviderOfficial.lean \
            | tee "$RUNNER_TEMP/psc1-provider-official.log"
          grep -q 'PSC1_CANONICAL_PROVIDER_OFFICIAL: PASS cases=5 batchDeclarations=4 doCheck=true' "$RUNNER_TEMP/psc1-provider-official.log"
      - name: Exercise the native checked batch provider in a detached process
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          node scripts/pskernel-provider-smoke.mjs native .lake/build/bin/psc1_kernel_provider \
            | tee "$RUNNER_TEMP/psc1-native-provider.log"
          grep -q 'PSC1_CANONICAL_PROVIDER: PASS mode=native cases=24 PATH=empty cwd=detached' "$RUNNER_TEMP/psc1-native-provider.log"
          mkdir -p dist/expr-v2
          tar -czf dist/expr-v2/native-provider-linux.tar.gz -C .lake/build/bin psc1_kernel_provider
          node scripts/pskernel-artifact-manifest.mjs \
            dist/expr-v2/native-artifacts.json native \
            .lake/build/bin/psc1_kernel_provider host/kernel-provider/KernelProviderMain.lean \
            dist/expr-v2/native-provider-linux.tar.gz
      - name: Measure complete native checks against original and official Lean
        if: ${{ !cancelled() && steps.kernel_build.outcome == 'success' }}
        working-directory: psc1
        run: |
          set -euo pipefail
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e' \
            -o "$RUNNER_TEMP/psc1-dag-native-bench.memory" \
            .lake/build/bin/psc1_kernel_expr_v2_dag_performance \
            | tee "$RUNNER_TEMP/psc1-dag-native-bench.log"
          grep -q 'PSC1_V2_DAG_NATIVE_BENCH: PASS' "$RUNNER_TEMP/psc1-dag-native-bench.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-v2-dag-native
          path: |
            ${{ runner.temp }}/psc1-native-provider.log
            ${{ runner.temp }}/psc1-provider-official.log
            ${{ runner.temp }}/psc1-proof-irrelevance-native.log
            ${{ runner.temp }}/psc1-lazy-nat-native.log
            ${{ runner.temp }}/psc1-lazy-delta-native.log
            ${{ runner.temp }}/psc1-full-shape-native.log
            ${{ runner.temp }}/psc1-final-rules-native.log
            ${{ runner.temp }}/psc1-admission-guard-native.log
            ${{ runner.temp }}/psc1-quot-native.log
            ${{ runner.temp }}/psc1-recursor-native.log
            ${{ runner.temp }}/psc1-generated-prefix-native.log
            ${{ runner.temp }}/psc1-quot-owner-native.log
            ${{ runner.temp }}/psc1-name-worker-native.log
            ${{ runner.temp }}/psc1-recursor-k-native.log
            ${{ runner.temp }}/psc1-owned-state-native.log
            psc1/dist/expr-v2/native-artifacts.json
            psc1/dist/expr-v2/native-provider-linux.tar.gz
            psc1/host/kernel-provider/KernelProviderMain.lean
            ${{ runner.temp }}/psc1-cache-mode-parent.log
            ${{ runner.temp }}/psc1-invalid-occurrence-parent.log
            ${{ runner.temp }}/psc1-invalid-occurrence-native.log
            ${{ runner.temp }}/psc1-dag-native.log
            ${{ runner.temp }}/psc1-dag-native.memory
            ${{ runner.temp }}/psc1-v2-existing-native.log
            ${{ runner.temp }}/psc1-transform-native.log
            ${{ runner.temp }}/psc1-infer-only-native.log
            ${{ runner.temp }}/psc1-metadata-proofs.log
            ${{ runner.temp }}/psc1-scope-proofs.log
            ${{ runner.temp }}/psc1-nat-fuel-proofs.log
            ${{ runner.temp }}/psc1-expr-equality-proofs.log
            ${{ runner.temp }}/psc1-knot-fuel-proofs.log
            ${{ runner.temp }}/psc1-recursor-proofs.log
            ${{ runner.temp }}/psc1-session-proofs.log
            ${{ runner.temp }}/psc1-recursor-major-proofs.log
            ${{ runner.temp }}/psc1-recursor-k-proofs.log
            ${{ runner.temp }}/psc1-quot-owner-proofs.log
            ${{ runner.temp }}/psc1-whnf-abi-proofs.log
            ${{ runner.temp }}/psc1-name-worker-proofs.log
            ${{ runner.temp }}/psc1-owned-state-proofs.log
            ${{ runner.temp }}/psc1-admission-guard-proofs.log
            ${{ runner.temp }}/psc1-dag-native-bench.log
            ${{ runner.temp }}/psc1-dag-native-bench.memory
          retention-days: 30

  generated-dag-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic PSC1 and check complete kernel source
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build psc1
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Install pinned TypeScript
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-dag-ts"
          echo '{"name":"psc1-dag-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-dag-ts/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-dag-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/psc1-dag-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Compile the complete independent kernel to JavaScript
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean \
            --out dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.ts
          test -s dist/expr-v2/integration/kernel.d.ts
          test -s dist/expr-v2/integration/kernel.js.map
          node --check dist/expr-v2/integration/kernel.js
      - name: Run real generated checker without external Lean on PATH
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_DAG_RUN_DIR="$RUNNER_TEMP/psc1-dag-standalone"
          mkdir -p "$PSC1_DAG_RUN_DIR"
          cp dist/expr-v2/integration/kernel.js "$PSC1_DAG_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-expr-v2-dag-smoke.mjs "$PSC1_DAG_RUN_DIR/smoke.mjs"
          cd "$PSC1_DAG_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" --expose-gc smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-dag-generated-js.log" \
            | sed -u '/^PSC1_DAG_PASS /d'
          grep -q 'PSC1_V2_DAG_JS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -Fqx 'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_EXPR_EQUALITY_DELAYED_JS: PASS hostile=21 staged=2 sharedDepth=64' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ZETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_LET: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
