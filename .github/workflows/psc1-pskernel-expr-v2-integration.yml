name: PSC1 Expression V2 production integration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/psc1-pskernel-expr-v2-lean435-20261021
    paths:
      - psc1/lean-toolchain
      - psc1/packages/pskernel-core/AI_WORK_STATE.md
      - psc1/packages/pskernel-core/src/**
      - psc1/test/PsKernelExprV2DagRegression.lean
      - psc1/test/PsKernelExprV2DagPerformance.lean
      - psc1/test/PsKernelExprV2TransformRegression.lean
      - psc1/test/PsKernelExprV2MetadataProofs.lean
      - psc1/test/PsKernelCacheScopeProofs.lean
      - psc1/test/PsKernelNatFuelProofs.lean
      - psc1/scripts/pskernel-nat-runtime-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-dag-smoke.mjs
      - psc1/scripts/pskernel-expr-v2-dag-bench.mjs
      - psc1/scripts/pskernel-expr-v2-admission-bench.mjs
      - psc1/scripts/pskernel-generated-profile.mjs
      - psc1/scripts/pskernel-whole-js-bench.mjs
      - psc1/scripts/pskernel-js-memory-probe.mjs
      - psc1/kernel-lakefile.lean
      - .github/workflows/psc1-pskernel-expr-v2-integration.yml

permissions:
  contents: read

jobs:
  native-dag-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile complete checker with checked DAG input
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_dag_regression psc1_kernel_expr_v2_regression psc1_kernel_expr_v2_dag_performance psc1_kernel_expr_v2_transform_regression
      - name: Run native DAG semantics, adversarial, fuel and official comparison
        working-directory: psc1
        run: |
          set -euo pipefail
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e' \
            -o "$RUNNER_TEMP/psc1-dag-native.memory" \
            .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
            | tee "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_REGRESSION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_LEAN: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_BETA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_OFFICIAL_NAT: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_PROJECTION_UNSELECTED_FIELD: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_OFFICIAL_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          grep -q 'PSC1_V2_DAG_NATIVE_OFFICIAL_POLY_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-native.log"
          .lake/build/bin/psc1_kernel_expr_v2_regression \
            | tee "$RUNNER_TEMP/psc1-v2-existing-native.log"
      - name: Check DAG transformation semantics and sharing
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_transform_regression \
            | tee "$RUNNER_TEMP/psc1-transform-native.log"
          grep -q 'PSKERNEL_V2_TRANSFORM_REGRESSION_PASSED' "$RUNNER_TEMP/psc1-transform-native.log"
      - name: Check local metadata and cache-scope theorems
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2MetadataProofs.lean \
            | tee "$RUNNER_TEMP/psc1-metadata-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean \
            | tee "$RUNNER_TEMP/psc1-scope-proofs.log"
          lake -f kernel-lakefile.lean env lean test/PsKernelNatFuelProofs.lean \
            | tee "$RUNNER_TEMP/psc1-nat-fuel-proofs.log"
          grep -q 'PSKERNEL_LARGE_NAT_NATIVE: PASS' "$RUNNER_TEMP/psc1-nat-fuel-proofs.log"
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' \
              "$RUNNER_TEMP/psc1-metadata-proofs.log" "$RUNNER_TEMP/psc1-scope-proofs.log" \
              "$RUNNER_TEMP/psc1-nat-fuel-proofs.log"; then
            echo 'PSKERNEL_PROOF_UNAPPROVED_TRUST_DEPENDENCY'
            exit 1
          fi
          echo 'PSKERNEL_LOCAL_METADATA_AND_SCOPE_PROOFS: PASS'
      - name: Measure complete native checks against original and official Lean
        working-directory: psc1
        run: |
          set -euo pipefail
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e' \
            -o "$RUNNER_TEMP/psc1-dag-native-bench.memory" \
            .lake/build/bin/psc1_kernel_expr_v2_dag_performance \
            | tee "$RUNNER_TEMP/psc1-dag-native-bench.log"
          grep -q 'PSC1_V2_DAG_NATIVE_BENCH: PASS' "$RUNNER_TEMP/psc1-dag-native-bench.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-v2-dag-native
          path: |
            ${{ runner.temp }}/psc1-dag-native.log
            ${{ runner.temp }}/psc1-dag-native.memory
            ${{ runner.temp }}/psc1-v2-existing-native.log
            ${{ runner.temp }}/psc1-transform-native.log
            ${{ runner.temp }}/psc1-metadata-proofs.log
            ${{ runner.temp }}/psc1-scope-proofs.log
            ${{ runner.temp }}/psc1-nat-fuel-proofs.log
            ${{ runner.temp }}/psc1-dag-native-bench.log
            ${{ runner.temp }}/psc1-dag-native-bench.memory
          retention-days: 30

  generated-dag-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic PSC1 and check complete kernel source
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build psc1
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Install pinned TypeScript
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-dag-ts"
          echo '{"name":"psc1-dag-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-dag-ts/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-dag-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/psc1-dag-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Compile the complete independent kernel to JavaScript
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean \
            --out dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.d.ts
          test -s dist/expr-v2/integration/kernel.js.map
          node --check dist/expr-v2/integration/kernel.js
      - name: Run real generated checker without external Lean on PATH
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_DAG_RUN_DIR="$RUNNER_TEMP/psc1-dag-standalone"
          mkdir -p "$PSC1_DAG_RUN_DIR"
          cp dist/expr-v2/integration/kernel.js "$PSC1_DAG_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-expr-v2-dag-smoke.mjs "$PSC1_DAG_RUN_DIR/smoke.mjs"
          cd "$PSC1_DAG_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" --expose-gc smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ZETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_TRANSFORM_JS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
      - name: Check large numerals without fuel-proportional closure allocation
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_DAG_RUN_DIR="$RUNNER_TEMP/psc1-dag-standalone"
          cp scripts/pskernel-nat-runtime-smoke.mjs "$PSC1_DAG_RUN_DIR/nat-smoke.mjs"
          cd "$PSC1_DAG_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" nat-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-nat-generated.log"
          grep -q 'PSC1_NAT_LARGE_RUNTIME: PASS' "$RUNNER_TEMP/psc1-nat-generated.log"
      - name: Measure complete generated checks in isolated A-B-B-A workers
        working-directory: psc1
        run: |
          set -euo pipefail
          node --expose-gc scripts/pskernel-expr-v2-dag-bench.mjs \
            dist/expr-v2/integration/kernel.js \
            | tee "$RUNNER_TEMP/psc1-dag-generated-bench.log"
          grep -q 'PSC1_V2_DAG_BENCH: PASS' "$RUNNER_TEMP/psc1-dag-generated-bench.log"
      - name: Measure complete declaration admission in separate A-B-B-A workers
        timeout-minutes: 12
        working-directory: psc1
        run: |
          set -euo pipefail
          node --check scripts/pskernel-expr-v2-admission-bench.mjs
          node --expose-gc scripts/pskernel-expr-v2-admission-bench.mjs \
            dist/expr-v2/integration/kernel.js \
            | tee "$RUNNER_TEMP/psc1-admission-generated-bench.log"
          grep -q 'PSC1_DAG_ADMISSION_BENCH: PASS' "$RUNNER_TEMP/psc1-admission-generated-bench.log"
          test "$(grep -c '^PSC1_ADMISSION_SAMPLE ' "$RUNNER_TEMP/psc1-admission-generated-bench.log")" -eq 24
      - name: Recheck full executable workloads with strict value assertions
        working-directory: psc1
        run: |
          set -euo pipefail
          node scripts/pskernel-whole-js-bench.mjs \
            dist/expr-v2/integration/kernel.js optimized \
            | tee "$RUNNER_TEMP/psc1-whole-strict.log"
          grep -q 'PSC1_JS_WHOLE_SUMMARY' "$RUNNER_TEMP/psc1-whole-strict.log"
          node --expose-gc scripts/pskernel-js-memory-probe.mjs \
            dist/expr-v2/integration/kernel.js optimized warm_infer \
            | tee "$RUNNER_TEMP/psc1-memory-strict.log"
          grep -q 'PSC1_JS_WHOLE_SUMMARY' "$RUNNER_TEMP/psc1-memory-strict.log"
      - name: Profile actual checked workloads in separate diagnostic workers
        timeout-minutes: 12
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_PROFILE_NODE="$(command -v node)"
          node --check scripts/pskernel-generated-profile.mjs
          for specification in "fn-unique 128 whnf" "fn-collision 128 whnf" "zeta 24 check"; do
            read -r shape depth operation <<< "$specification"
            for variant in legacy dag; do
              timeout --signal=KILL 180s env PATH="" "$PSC1_PROFILE_NODE" --expose-gc \
                scripts/pskernel-expr-v2-dag-bench.mjs \
                dist/expr-v2/integration/kernel.js profile \
                "$variant" "$shape" "$depth" 1 "$operation" \
                "$RUNNER_TEMP/psc1-dag-profiles" \
                | tee -a "$RUNNER_TEMP/psc1-dag-profile.log"
            done
          done
          test "$(grep -c '^PSC1_V2_DAG_PROFILE: PASS$' "$RUNNER_TEMP/psc1-dag-profile.log")" -eq 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-v2-dag-generated-js
          path: |
            ${{ runner.temp }}/psc1-dag-generated-js.log
            ${{ runner.temp }}/psc1-nat-generated.log
            ${{ runner.temp }}/psc1-dag-generated-bench.log
            ${{ runner.temp }}/psc1-admission-generated-bench.log
            ${{ runner.temp }}/psc1-whole-strict.log
            ${{ runner.temp }}/psc1-memory-strict.log
            ${{ runner.temp }}/psc1-dag-profile.log
            ${{ runner.temp }}/psc1-dag-profiles/
            psc1/dist/expr-v2/integration/kernel.js
            psc1/dist/expr-v2/integration/kernel.d.ts
            psc1/dist/expr-v2/integration/kernel.js.map
          retention-days: 30
