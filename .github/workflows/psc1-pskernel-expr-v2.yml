name: PSC1 PSKernel-Core Expression V2 research

on:
  workflow_dispatch:
  push:
    branches:
      - research/psc1-pskernel-expr-v2-lean435-20261020
    paths:
      - psc1/lean-toolchain
      - psc1/packages/pskernel-core/src/Ps/KernelCore/Research/**
      - psc1/test/PsKernelExprV2Regression.lean
      - psc1/scripts/pskernel-expr-v2-generated-smoke.mjs
      - psc1/kernel-lakefile.lean
      - .github/workflows/psc1-pskernel-expr-v2.yml

permissions:
  contents: read

jobs:
  expr-v2-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact Lean source commit
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
      - name: Build independent Expr V2 DAG and regression
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_regression
      - name: Differential all-constructor checks and metadata validation
        working-directory: psc1
        run: |
          set -euo pipefail
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e' \
            -o "$RUNNER_TEMP/expr-v2.memory" \
            .lake/build/bin/psc1_kernel_expr_v2_regression \
            | tee "$RUNNER_TEMP/expr-v2-regression.log"
          grep -q "PSC1_EXPR_V2_REGRESSION: PASS" "$RUNNER_TEMP/expr-v2-regression.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-expr-v2-differential-lean435
          path: |
            ${{ runner.temp }}/expr-v2.memory
            ${{ runner.temp }}/expr-v2-regression.log
          retention-days: 30


  portable-v2-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build actual PSC1 compiler
        working-directory: psc1
        run: |
          set -euo pipefail
          lake build psc1
      - name: Check Expression V2 module with portable PSC1 elaborator
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/Research/ExprV2.lean
      - name: Check persistent V2 index under the same portable compiler
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/Research/ExprV2Index.lean
      - name: Check all V2 indexed smart constructors through PSC1
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/Research/ExprV2IndexedBuilder.lean
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned TypeScript 7.0.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-v2-ts"
          echo '{"name":"psc1-v2-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-v2-ts/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-v2-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/psc1-v2-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Compile portable Expression V2 and persistent index to JS
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/Research/ExprV2IndexedBuilder.lean --out dist/expr-v2/index.js
          test -s dist/expr-v2/index.js
          test -s dist/expr-v2/index.d.ts
          test -s dist/expr-v2/index.js.map
          node --check dist/expr-v2/index.js
      - name: Run generated-JS V2 sharing, hash and indexed-arena smoke
        working-directory: psc1
        run: |
          set -euo pipefail
          node --expose-gc scripts/pskernel-expr-v2-generated-smoke.mjs dist/expr-v2/index.js \
            | tee "$RUNNER_TEMP/expr-v2-generated-js.log"
          grep -q "PSC1_EXPR_V2_JS_SMOKE: PASS" "$RUNNER_TEMP/expr-v2-generated-js.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-expr-v2-portable-js-lean435
          path: ${{ runner.temp }}/expr-v2-generated-js.log
          retention-days: 30
