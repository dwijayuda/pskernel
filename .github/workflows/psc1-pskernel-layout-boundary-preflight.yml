name: PSC1 source and canonical layout boundary proof preflight
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-layout-boundary-20261025
    paths:
    - .github/workflows/psc1-pskernel-layout-boundary-preflight.yml
    - psc1/test/PsKernelExprV2LayoutBoundaryProofs.lean
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install and authenticate pinned Lean and exact source
      shell: bash
      run: |
        set -euo pipefail
        bash psc1/scripts/install-lean435-ci.sh
        export PATH="$HOME/.elan/bin:$PATH"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 80005bb250a7324772db76d51684d23fbf0fe6ed "$GITHUB_SHA" -- \
          psc1/packages/pskernel-core/src psc1/kernel-lakefile.lean psc1/lean-toolchain \
          psc1/scripts/install-lean435-ci.sh psc1/test/PsKernelExprV2MetadataProofs.lean \
          psc1/test/PsKernelExprV2PagedModelProofs.lean
        test "$(cat psc1/lean-toolchain)" = "leanprover/lean4:v4.35.0"
        (cd psc1 && test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc")
        mkdir -p "$RUNNER_TEMP/layout-boundary-preflight"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re,subprocess
        specs=[{"module":"PsKernelExprV2MetadataProofs","count":8,"log":"layout-PsKernelExprV2MetadataProofs.log"},{"module":"PsKernelExprV2PagedModelProofs","count":17,"log":"layout-PsKernelExprV2PagedModelProofs.log"},{"module":"PsKernelExprV2LayoutBoundaryProofs","count":5,"log":"layout-PsKernelExprV2LayoutBoundaryProofs.log"}]
        paths=['psc1/test/'+s['module']+'.lean' for s in specs]+[
          '.github/workflows/psc1-pskernel-layout-boundary-preflight.yml',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Validation.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Paged.lean',
          'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Builder.lean',
          'psc1/kernel-lakefile.lean','psc1/lean-toolchain','psc1/scripts/install-lean435-ci.sh']
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'layout-boundary-preflight'
        records=[]
        for name in paths:
            raw=pathlib.Path(name).read_bytes()
            record={'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                    'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            target=out/'sources'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
            records.append(record)
        report={'schema':'psc1-layout-boundary-proof-source-v1','sourceSha':os.environ['GITHUB_SHA'],
                'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'leanGitHash':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc',
                'baselineSha':'80005bb250a7324772db76d51684d23fbf0fe6ed',
                'productionSourceTree':subprocess.check_output(
                    ['git','rev-parse','HEAD:psc1/packages/pskernel-core/src'],text=True).strip(),
                'productionAndRetainedProofsUnchanged':True,'files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_LAYOUT_BOUNDARY_PROOF_SOURCE: PASS '+json.dumps(report,separators=(',',':')))
        PY
    - name: Build native production imports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelExprV2PagedModelNativeProofs \
          Ps.KernelCore.Core.ExprV2.Validation \
          2>&1 | tee "$RUNNER_TEMP/layout-boundary-preflight/native-build.log"
    - name: Compile 30 metadata, storage and source/canonical layout reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_layout_failed=0
        : > "$RUNNER_TEMP/layout-boundary-preflight/proof-status.log"
        for PSC1_LAYOUT_SPEC in \
          'PsKernelExprV2MetadataProofs:8:layout-PsKernelExprV2MetadataProofs.log' \
          'PsKernelExprV2PagedModelProofs:17:layout-PsKernelExprV2PagedModelProofs.log' \
          'PsKernelExprV2LayoutBoundaryProofs:5:layout-PsKernelExprV2LayoutBoundaryProofs.log'; do
          IFS=: read -r PSC1_LAYOUT_MODULE PSC1_LAYOUT_COUNT PSC1_LAYOUT_LOG <<< "$PSC1_LAYOUT_SPEC"
          psc1_layout_count_status=0
          psc1_layout_lean_status=0
          test "$(grep -c '^#print axioms ' "test/$PSC1_LAYOUT_MODULE.lean")" -eq "$PSC1_LAYOUT_COUNT" \
            || psc1_layout_count_status=$?
          lake -f kernel-lakefile.lean env lean "test/$PSC1_LAYOUT_MODULE.lean" \
            2>&1 | tee "$RUNNER_TEMP/layout-boundary-preflight/$PSC1_LAYOUT_LOG" \
            || psc1_layout_lean_status=$?
          printf 'PSC1_LAYOUT_BOUNDARY_PROOF_STATUS module=%s count=%s countStatus=%s leanStatus=%s\n' \
            "$PSC1_LAYOUT_MODULE" "$PSC1_LAYOUT_COUNT" "$psc1_layout_count_status" "$psc1_layout_lean_status" \
            | tee -a "$RUNNER_TEMP/layout-boundary-preflight/proof-status.log"
          if [ "$psc1_layout_count_status" -ne 0 ] || [ "$psc1_layout_lean_status" -ne 0 ]; then
            psc1_layout_failed=1
          fi
        done
        test "$psc1_layout_failed" -eq 0
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        specs=[{"module":"PsKernelExprV2MetadataProofs","count":8,"log":"layout-PsKernelExprV2MetadataProofs.log"},{"module":"PsKernelExprV2PagedModelProofs","count":17,"log":"layout-PsKernelExprV2PagedModelProofs.log"},{"module":"PsKernelExprV2LayoutBoundaryProofs","count":5,"log":"layout-PsKernelExprV2LayoutBoundaryProofs.log"}]
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'layout-boundary-preflight'
        def digest(path):
            raw=path.read_bytes();return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        records=[];all_names=[]
        allowed={'propext','Classical.choice','Quot.sound'}
        statuses=[]
        for spec in specs:
            module,count,filename=spec['module'],spec['count'],spec['log']
            source=pathlib.Path('test')/(module+'.lean')
            names=re.findall(r'(?m)^#print axioms (\S+)\s*$',source.read_text())
            names=[name if '.' in name else module+'.'+name for name in names]
            if len(names)!=count or len(set(names))!=count:
                raise RuntimeError('Exact unique source proof inventory required: '+module)
            raw=(root/filename).read_text()
            reports=re.findall(r"'([^']+)' (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",raw)
            if [name for name,_ in reports]!=names:
                raise RuntimeError('Actual ordered proof inventory mismatch: '+module)
            if any(token in raw for token in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler']):
                raise RuntimeError('Forbidden proof dependency: '+module)
            if re.search(r'\.lean:\d+:\d+: error:',raw):
                raise RuntimeError('Lean proof error: '+module)
            for name,used in reports:
                if {axiom.strip() for axiom in used.split(',') if axiom.strip()}-allowed:
                    raise RuntimeError('Unapproved proof axiom: '+name)
            all_names.extend(names)
            records.append({'module':module,'proofs':count,'names':names,
                            'source':digest(source),'log':digest(root/filename)})
            statuses.append('PSC1_LAYOUT_BOUNDARY_PROOF_STATUS module='+module+' count='+str(count)+' countStatus=0 leanStatus=0')
        if len(all_names)!=30 or len(set(all_names))!=30:
            raise RuntimeError('Exact30 distinct metadata/storage/layout reports required')
        if (root/'proof-status.log').read_text().splitlines()!=statuses:
            raise RuntimeError('Exact three successful proof command statuses required')
        inventory=root/'source-inventory.json'
        source_record=json.loads(inventory.read_text())
        repo=pathlib.Path.cwd().parent
        for item in source_record['files']:
            if digest(repo/item['path'])!={'bytes':item['bytes'],'sha256':item['sha256']}:
                raise RuntimeError('Source changed after authentication: '+item['path'])
        receipt={'schema':'psc1-layout-boundary-preflight-v1','sourceSha':os.environ['GITHUB_SHA'],
                 'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                 'status':'pass','proofModules':3,'totalProofs':30,'proofs':records,
                 'sourceInventory':digest(inventory),'proofStatuses':digest(root/'proof-status.log'),
                 'orderedUniqueReports':True,'allowedStandardAxiomsOnly':True,
                 'shapeGuardEstablishesSourceLayout':True,
                 'successfulValidatorEstablishesSourceLayout':True,
                 'replayNodePreservesCanonicalLayout':True,
                 'validateFuelPreservesCanonicalLayout':True,
                 'canonicalOutputLayoutEstablished':True,
                 'metadataCorrespondenceEstablished':False,'decoderCorrespondenceEstablished':False,
                 'replayArenaModelBridgeEstablished':False,
                 'productionChanges':False,'fullQualification':False,'performanceQualified':False}
        (root/'native-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_LAYOUT_BOUNDARY_PROOF_PREFLIGHT: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-layout-boundary-preflight-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/layout-boundary-preflight/
        if-no-files-found: error
        retention-days: 30
