name: PSC1 lazy-transform full193 Arena from authenticated generated kernel
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-transform-lazy-arena-20261025
    paths:
    - .github/workflows/psc1-pskernel-lazy-arena435.yml
    - psc1/scripts/pskernel-lazy-arena-artifact.py
permissions:
  contents: read
  actions: read
jobs:
  official-arena-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - name: Verify exact toolchain and authenticate full archive
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lean --version
          python3 -m py_compile scripts/pskernel-arena435-oracle.py
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo "98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  $RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" | sha256sum -c -
      - name: Inspect exact all-list metadata and numeral magnitudes in every input
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena435-evidence"
          python3 -m py_compile scripts/pskernel-arena435-inspect.py
          python3 scripts/pskernel-arena435-inspect.py \
            --archive "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            --out "$RUNNER_TEMP/arena435-evidence/input-diagnostics.json" \
            | tee "$RUNNER_TEMP/arena435-evidence/input-diagnostics.log"
      - name: Evaluate all 193 declaration bodies with official Lean 4.35
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena435-evidence"
          python3 scripts/pskernel-arena435-oracle.py \
            --archive "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            --official-project . \
            --out "$RUNNER_TEMP/arena435-evidence/report.json" \
            --timeout 300 --workers 2 \
            | tee "$RUNNER_TEMP/arena435-evidence/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-arena435-official-reference
          path: ${{ runner.temp }}/arena435-evidence
          if-no-files-found: error
          retention-days: 30

  generated-arena-comparison:
    if: ${{ always() && !cancelled() }}
    needs: official-arena-reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-arena435-official-reference
          path: ${{ runner.temp }}/arena435-official
      - name: Install pinned Lean for the real PSC1 compiler
        shell: bash
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - name: Authenticate and load exact generated541 kernel bytes and original replay sources
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: psc1
        run: python3 scripts/pskernel-lazy-arena-artifact.py
      - name: Retain exact progress protocol controls
        working-directory: psc1
        run: |
          set -euo pipefail
          python3 scripts/pskernel-arena435-progress-controls.py | tee "$RUNNER_TEMP/arena435-progress-controls.log"
          grep -q 'PSC1_ARENA_PROGRESS_CONTROLS: PASS count=24' "$RUNNER_TEMP/arena435-progress-controls.log"
      - name: Exercise positive, negative, exact-integer, and forged-recursors controls
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_ARENA_NODE="$(command -v node)"
          PSC1_ARENA_DETACHED="$RUNNER_TEMP/arena435-detached"
          mkdir -p "$PSC1_ARENA_DETACHED"
          cp dist/arena435/kernel.js "$PSC1_ARENA_DETACHED/kernel.mjs"
          cp scripts/pskernel-arena-replay.mjs scripts/pskernel-arena-replay-controls.mjs "$PSC1_ARENA_DETACHED/"
          cd "$PSC1_ARENA_DETACHED"
          env PATH="" "$PSC1_ARENA_NODE" --max-old-space-size=2048 pskernel-arena-replay-controls.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/arena435-controls.log"
          grep -q 'PSC1_ARENA_REPLAY_CONTROLS: PASS' "$RUNNER_TEMP/arena435-controls.log"
      - name: Compare all 193 cases without exclusions and without changing kernel fuel
        shell: bash
        working-directory: psc1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          mkdir -p "$RUNNER_TEMP/arena435-independent"
          python3 scripts/pskernel-arena435-compare.py \
            --archive "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            --oracle-report "$RUNNER_TEMP/arena435-official/report.json" \
            --kernel dist/arena435/kernel.js \
            --out "$RUNNER_TEMP/arena435-independent/report.json" \
            --timeout 60 --workers 2 \
            | tee "$RUNNER_TEMP/arena435-independent/run.log"
      - name: Record all saved case bodies and verdicts without replay
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "arena435-independent/report.json"
          if not path.is_file():
              raise SystemExit("No completed comparison report was produced")
          report = json.loads(path.read_text())
          cases = report["tests"]
          assert len(cases) == 193
          assert report["kernel_fuel"] == 4096
          assert report["host_timeout_seconds_per_case"] == 60
          assert report["node_heap_limit_mib"] == 2048
          assert report["host_workers"] == 2
          assert report["excluded_cases"] == []
          assert all(c["adaptation"]["body_bytes_identical"] and
                     c["adaptation"]["original_body_sha256"] == c["adaptation"]["adapted_body_sha256"]
                     for c in cases)
          origin = json.loads((path.parent/"kernel-provenance.json").read_text())
          assert origin["kernelSourceSha"] == "44d627cac02fdf70e884dfc60bacc3ea4f252a6c"
          assert origin["kernel"]["sha256"] == "9d1931744355bbc54cfff3e8e2ba4065fd9d85e83eb87b326c215059a2c0ef99"
          print("ARENA_KERNEL_PROVENANCE " + json.dumps(origin,sort_keys=True))
          print("ARENA_EXACT_SOURCE " + os.environ["GITHUB_SHA"])
          print("ARENA_REPORT_HEADER " + json.dumps(
              {key: value for key, value in report.items() if key != "tests"}, sort_keys=True))
          for case in cases:
              print("ARENA_COMPLETE_CASE " + json.dumps(case, sort_keys=True))
          print("PSC1_ARENA_FULL_REPORT_RECORDED source=" + os.environ["GITHUB_SHA"] +
                " cases=193 unchangedBodies=193 replayedCases=0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-arena435-generated-comparison
          path: |
            ${{ runner.temp }}/arena435-independent
            ${{ runner.temp }}/arena435-controls.log
            ${{ runner.temp }}/arena435-progress-controls.log
            psc1/dist/arena435/kernel.js
            psc1/dist/arena435/kernel.d.ts
            psc1/dist/arena435/kernel.js.map
            psc1/dist/arena435/workspace/.proofscript-bootstrap.json
          if-no-files-found: warn
          retention-days: 30
