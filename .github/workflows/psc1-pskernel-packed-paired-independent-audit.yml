name: PSC1 scalar cache independent paired source and249input audit
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t09-packed-independent-audit-20261026
    paths:
    - .github/workflows/psc1-pskernel-packed-paired-independent-audit.yml
    - psc1/scripts/pskernel-packed-paired-independent-audit.py
    - psc1/scripts/pskernel-packed-native-root-audit.py
    - psc1/scripts/pskernel-packed-full-root-audit.py
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Read all actual source-bound archives and Git bytes without compiler/kernel execution
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 psc1/scripts/pskernel-packed-paired-independent-audit.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-packed-paired-independent-audit
        path: '${{ runner.temp }}/mutual-independent-audit/audit.json

          ${{ runner.temp }}/mutual-independent-audit/review/*-report.json'
        if-no-files-found: warn
        retention-days: 90
