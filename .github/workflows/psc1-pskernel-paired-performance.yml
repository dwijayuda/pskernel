name: PSC1 artifact-only paired name-worker performance

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Terminal-success integration run ID for the exact candidate
        required: false
        type: string
      candidate_source:
        description: Full 40-character source SHA of that producer run
        required: false
        type: string
  push:
    branches:
      - research/psc1-pskernel-name-paired-perf-20261021
    paths:
      - .github/workflows/psc1-pskernel-paired-performance.yml
      - psc1/scripts/pskernel-paired-artifacts.py
      - psc1/scripts/pskernel-paired-performance.py

permissions:
  contents: read
  actions: read

concurrency:
  group: psc1-paired-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-artifact-performance:
    # Collection success is not a new kernel, canonical-source or full-corpus gate.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PSC1_PAIR_CANDIDATE_RUN: ${{ inputs.candidate_run || '39640226534' }}
      PSC1_PAIR_CANDIDATE_SOURCE: ${{ inputs.candidate_source || '34126793178021a9cd1bdb37aa6fe17c0fab41c6' }}
    steps:
      - name: Check out the diagnostic harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Check out the immutable baseline source for harness identity
        uses: actions/checkout@v4
        with:
          repository: dwijayuda/pskernel
          ref: f9e9b20f92ce2ffa4a666acaf55aa8852949f589
          path: sources/baseline
          persist-credentials: false
      - name: Check out the exact candidate source for identity comparison
        uses: actions/checkout@v4
        with:
          repository: dwijayuda/pskernel
          ref: ${{ env.PSC1_PAIR_CANDIDATE_SOURCE }}
          path: sources/candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate syntax and source checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sources/baseline rev-parse HEAD)" = "f9e9b20f92ce2ffa4a666acaf55aa8852949f589"
          test "$(git -C sources/candidate rev-parse HEAD)" = "$PSC1_PAIR_CANDIDATE_SOURCE"
          python3 -m py_compile harness/psc1/scripts/pskernel-paired-artifacts.py \
            harness/psc1/scripts/pskernel-paired-performance.py \
            sources/baseline/psc1/scripts/pskernel-arena435-oracle.py \
            sources/baseline/psc1/scripts/pskernel-arena435-compare.py
          node --check sources/baseline/psc1/scripts/pskernel-expr-v2-admission-bench.mjs
          node --check sources/baseline/psc1/scripts/pskernel-arena-replay.mjs
          node --check sources/baseline/psc1/scripts/pskernel-arena-replay-controls.mjs
      - name: Authenticate and restore terminal-success generated artifacts
        shell: bash
        env:
          PSC1_PERF_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 harness/psc1/scripts/pskernel-paired-artifacts.py \
            --candidate-run "$PSC1_PAIR_CANDIDATE_RUN" \
            --candidate-source "$PSC1_PAIR_CANDIDATE_SOURCE" \
            --out "$RUNNER_TEMP/psc1-paired-runtime" \
            2>&1 | tee "$RUNNER_TEMP/psc1-paired-authentication.log"
      - name: Download the exact authenticated Arena release archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            -o "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo "98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  $RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" | sha256sum -c -
      - name: Run fresh detached controls and paired full checking
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/psc1/scripts/pskernel-paired-performance.py \
            --runtimes "$RUNNER_TEMP/psc1-paired-runtime" \
            --baseline-source "$GITHUB_WORKSPACE/sources/baseline/psc1" \
            --candidate-source "$GITHUB_WORKSPACE/sources/candidate/psc1" \
            --archive "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            --out "$RUNNER_TEMP/psc1-paired-performance" \
            2>&1 | tee "$RUNNER_TEMP/psc1-paired-collection.log"
      - name: Present exact measured scope and partial results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/psc1-paired-performance/summary.md"; then
            cat "$RUNNER_TEMP/psc1-paired-performance/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - "$RUNNER_TEMP/psc1-paired-performance" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name, label in [("summary.md", "PSC1_PAIRED_SUMMARY"), ("report.json", "PSC1_PAIRED_REPORT")]:
              path = root / name
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 512 * 1024:
                  raise ValueError("bounded diagnostic readback exceeded")
              print(label + "_BEGIN " + json.dumps({"file": name, "bytes": len(data),
                    "sha256": hashlib.sha256(data).hexdigest()}))
              contents = data.decode("utf-8")
              print(contents, end="" if contents.endswith("\n") else "\n")
              print(label + "_END")
          PY
      - name: Retain authenticated binaries, source receipts and all observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-paired-performance-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/psc1-paired-runtime/
            ${{ runner.temp }}/psc1-paired-performance/
            ${{ runner.temp }}/psc1-paired-authentication.log
            ${{ runner.temp }}/psc1-paired-collection.log
            harness/psc1/scripts/pskernel-paired-artifacts.py
            harness/psc1/scripts/pskernel-paired-performance.py
            harness/.github/workflows/psc1-pskernel-paired-performance.yml
