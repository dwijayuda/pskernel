name: PSC1 T01F authentic String native preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-string:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean
        run: bash psc1/scripts/install-lean435-ci.sh
      - name: Build authentic fixture exporter and retained checker
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_string_environment_regression psc1_kernel_expr_v2_dag_regression
      - name: Independently admit actual String declarations and export untrusted inputs
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-t01f"
          lake -f kernel-lakefile.lean env .lake/build/bin/psc1_kernel_expr_v2_string_environment_regression \
            "$RUNNER_TEMP/psc1-t01f/fixture.json" 2>&1 | tee "$RUNNER_TEMP/psc1-t01f/native.log"
          grep -Fqx 'PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096' "$RUNNER_TEMP/psc1-t01f/native.log"
          sha256sum "$RUNNER_TEMP/psc1-t01f/fixture.json" | tee "$RUNNER_TEMP/psc1-t01f/fixture.sha256"
      - name: Retain existing minimal String and public DAG controls
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
            | tee "$RUNNER_TEMP/psc1-t01f/retained.log" \
            | sed '/^PSC1_DAG_PASS /d'
          grep -Fq 'PSC1_V2_DAG_REGRESSION: PASS' "$RUNNER_TEMP/psc1-t01f/retained.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-native-preflight
          path: |
            ${{ runner.temp }}/psc1-t01f/fixture.json
            ${{ runner.temp }}/psc1-t01f/fixture.sha256
            ${{ runner.temp }}/psc1-t01f/native.log
            ${{ runner.temp }}/psc1-t01f/retained.log
