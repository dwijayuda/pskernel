name: PSC1 T01F authentic String implementation preflight
on:
  workflow_dispatch:
  push:
    branches:
      - work/psc1-pskernel-t01f-string-20261022
    paths:
      - 'psc1/**'
      - '.github/workflows/psc1-pskernel-t01f-focus.yml'
permissions:
  contents: read
jobs:
  native-string:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean
        run: bash psc1/scripts/install-lean435-ci.sh
      - name: Build authentic fixture exporter and retained checker
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          node --check scripts/pskernel-expr-v2-string-environment-smoke.mjs
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_string_environment_regression psc1_kernel_expr_v2_dag_regression
          lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2SessionProofs.lean
          lake -f kernel-lakefile.lean env lean --run test/PsKernelExprV2GeneratedPrefixRegression.lean
      - name: Independently admit actual String declarations and export untrusted inputs
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-t01f"
          lake -f kernel-lakefile.lean env .lake/build/bin/psc1_kernel_expr_v2_string_environment_regression \
            "$RUNNER_TEMP/psc1-t01f/fixture.json" 2>&1 | tee "$RUNNER_TEMP/psc1-t01f/native.log"
          grep -Fqx 'PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096' "$RUNNER_TEMP/psc1-t01f/native.log"
          sha256sum "$RUNNER_TEMP/psc1-t01f/fixture.json" | tee "$RUNNER_TEMP/psc1-t01f/fixture.sha256"
      - name: Retain existing minimal String and public DAG controls
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
            | tee "$RUNNER_TEMP/psc1-t01f/retained.log" \
            | sed '/^PSC1_DAG_PASS /d'
          grep -Fq 'PSC1_V2_DAG_REGRESSION: PASS' "$RUNNER_TEMP/psc1-t01f/retained.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-native-preflight
          path: |
            ${{ runner.temp }}/psc1-t01f/fixture.json
            ${{ runner.temp }}/psc1-t01f/fixture.sha256
            ${{ runner.temp }}/psc1-t01f/native.log
            ${{ runner.temp }}/psc1-t01f/retained.log

  generated-string:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic PSC1 and check complete kernel source
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build psc1
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Install pinned TypeScript
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-dag-ts"
          echo '{"name":"psc1-dag-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-dag-ts/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-dag-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/psc1-dag-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Compile the complete independent kernel to JavaScript
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean \
            --out dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.ts
          test -s dist/expr-v2/integration/kernel.d.ts
          test -s dist/expr-v2/integration/kernel.js.map
          node --check dist/expr-v2/integration/kernel.js
      - name: Produce authentic T01F inputs for generated independent replay
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_T01F_DIR="$RUNNER_TEMP/psc1-t01f-generated"
          mkdir -p "$PSC1_T01F_DIR"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          node --check scripts/pskernel-expr-v2-string-environment-smoke.mjs
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_string_environment_regression
          lean --version > "$PSC1_T01F_DIR/lean-version.txt"
          lean --githash > "$PSC1_T01F_DIR/lean-githash.txt"
          lake -f kernel-lakefile.lean env .lake/build/bin/psc1_kernel_expr_v2_string_environment_regression \
            "$PSC1_T01F_DIR/fixture.json" 2>&1 | tee "$PSC1_T01F_DIR/native.log"
          grep -Fqx 'PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096' "$PSC1_T01F_DIR/native.log"
          test "$(grep -c '^PSC1_T01F_CASE_PASS ' "$PSC1_T01F_DIR/native.log")" -eq 6
          grep -Fq 'PSC1_T01F_FIXTURE_WRITTEN ' "$PSC1_T01F_DIR/native.log"
          test -s "$PSC1_T01F_DIR/fixture.json"
          sha256sum "$PSC1_T01F_DIR/fixture.json" | tee "$PSC1_T01F_DIR/fixture.sha256"
          node --input-type=module - "$PSC1_T01F_DIR" "dist/expr-v2/integration/kernel.js" "generated" <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const [dir,kernel,route]=process.argv.slice(2);
          const digest=path=>{const bytes=readFileSync(path);return {bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};};
          const fixture=JSON.parse(readFileSync(dir+'/fixture.json','utf8'));
          const leanCommit=readFileSync(dir+'/lean-githash.txt','utf8').trim();
          if(leanCommit!=='eb6cafb7290e8bd5f2937522d8d804f58f02bafc' || fixture.leanCommit!==leanCommit ||
              fixture.leanVersion!=='4.35.0' || fixture.format!=='psc1-authentic-string435-v1')
            throw Error('PSC1_T01F_SOURCE_PROVENANCE_MISMATCH');
          if(!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA??''))throw Error('PSC1_T01F_MISSING_SOURCE_SHA');
          const report={schema:'psc1-t01f-source-provenance-v1',sourceSha:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,route,
            leanVersion:readFileSync(dir+'/lean-version.txt','utf8').trim(),leanCommit,node:process.version,
            requests:fixture.declarations.length,metadata:fixture.metadata.length,samples:fixture.samples,
            kernelFuel:4096,nodeOldSpaceLimitMiB:route==='native'?null:2048,
            authority:'Raw declaration requests only; generated consumers independently admit from empty.',
            fixture:digest(dir+'/fixture.json'),kernel:digest(kernel),
            fixtureProducer:digest('test/PsKernelExprV2StringEnvironmentRegression.lean'),generatedRunner:digest('scripts/pskernel-expr-v2-string-environment-smoke.mjs')};
          writeFileSync(dir+'/provenance.json',JSON.stringify(report,null,2)+'\n');
          console.log('PSC1_T01F_SOURCE_PROVENANCE '+JSON.stringify(report));
          NODE
      - name: Independently admit and check full String environment in detached generated Node
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_T01F_DIR="$RUNNER_TEMP/psc1-t01f-generated"
          PSC1_T01F_DETACHED="$RUNNER_TEMP/psc1-t01f-generated-detached"
          PSC1_T01F_NODE="$(command -v node)"
          mkdir -p "$PSC1_T01F_DETACHED"
          cp dist/expr-v2/integration/kernel.js "$PSC1_T01F_DETACHED/kernel.mjs"
          cp scripts/pskernel-expr-v2-string-environment-smoke.mjs "$PSC1_T01F_DETACHED/"
          cp "$PSC1_T01F_DIR/fixture.json" "$PSC1_T01F_DETACHED/fixture.json"
          cd "$PSC1_T01F_DETACHED"
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_DIR/generated.memory" \
            env PATH="" PSC1_T01F_TRACE=1 "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            pskernel-expr-v2-string-environment-smoke.mjs kernel.mjs fixture.json \
            2>&1 | tee "$PSC1_T01F_DIR/generated.log"
          cat "$PSC1_T01F_DIR/generated.memory"
          grep -Fq 'PSC1_T01F_FULL_STRING_JS: PASS ' "$PSC1_T01F_DIR/generated.log"
          test "$(grep -c '^PSC1_T01F_JS_CASE_PASS ' "$PSC1_T01F_DIR/generated.log")" -eq 6
      - name: Run real generated checker without external Lean on PATH
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_DAG_RUN_DIR="$RUNNER_TEMP/psc1-dag-standalone"
          mkdir -p "$PSC1_DAG_RUN_DIR"
          cp dist/expr-v2/integration/kernel.js "$PSC1_DAG_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-expr-v2-dag-smoke.mjs "$PSC1_DAG_RUN_DIR/smoke.mjs"
          cd "$PSC1_DAG_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" --expose-gc smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-dag-generated-js.log" \
            | sed -u '/^PSC1_DAG_PASS /d'
          grep -q 'PSC1_V2_DAG_JS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -Fqx 'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_EXPR_EQUALITY_DELAYED_JS: PASS hostile=21 staged=2 sharedDepth=64' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ZETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BETA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_WHNF_STATE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_PUBLIC_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_QUICK_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NAT_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_NESTED_OUTCOMES: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_APP: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DELTA: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CONSTANT_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_MUTUAL_INDEX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_PROJECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHECK_LET: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_LET_CACHE_SCOPE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_LET_LOCAL_WHNF: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_STATEFUL_DEFEQ: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_APP_CONVERSION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_APP_CONVERSION_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_APP_EAGER_CONTEXT: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_SIMPLE_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ADMISSION_SHARED_STATE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ADMISSION_POLICY_SAFETY: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_ADMISSION_FINAL_GUARDS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_THEOREM_ADMISSION_MATRIX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_THEOREM_ISPROP_STATE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_UNSAFE_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_UNSAFE_FRESH_BODY: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_MUTUAL_ADMISSION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_MUTUAL_FRESH_MEMBER: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER_SPINE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER_SPINE_BUDGET: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER_SPINE_CACHE: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_BINDER_SPINE_FALLBACK: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DEFEQ_PREFIX: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHEAP_CORE_POLICY: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_CHEAP_PROJECTION_POLICY: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DEFEQ_REFLECTION: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_DAG_JS_DEFEQ_PREFIX_GUARDS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
          grep -q 'PSC1_V2_TRANSFORM_JS: PASS' "$RUNNER_TEMP/psc1-dag-generated-js.log"
      - name: Check generated mutual and nested prefix owners in detached Node
        working-directory: psc1
        run: |
          set -euo pipefail
          PSC1_NODE_BIN="$(command -v node)"
          PSC1_DAG_RUN_DIR="$RUNNER_TEMP/psc1-dag-standalone"
          test -s "$PSC1_DAG_RUN_DIR/kernel.mjs"
          cp scripts/pskernel-expr-v2-generated-prefix-smoke.mjs "$PSC1_DAG_RUN_DIR/generated-prefix-smoke.mjs"
          cd "$PSC1_DAG_RUN_DIR"
          env PATH="" "$PSC1_NODE_BIN" generated-prefix-smoke.mjs kernel.mjs \
            | tee "$RUNNER_TEMP/psc1-generated-prefix-js.log"
          grep -Fqx 'PSC1_V2_GENERATED_PREFIX_JS: PASS new=24 recursors=7 direct=6 privateIDs=3' "$RUNNER_TEMP/psc1-generated-prefix-js.log"
          grep -Fqx 'PSC1_V2_SESSION_OWNERS_JS: PASS kinds=8 direct=7 privateIDs=5 forks=2' "$RUNNER_TEMP/psc1-generated-prefix-js.log"
          grep -Eq '^PSC1_V2_GENERATED_PREFIX_CONTROLS_JS: PASS positive=6 negative=7 assertions=[0-9]+$' "$RUNNER_TEMP/psc1-generated-prefix-js.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-generated-preflight
          path: |
            ${{ runner.temp }}/psc1-t01f-generated/
            psc1/dist/expr-v2/integration/kernel.js
            psc1/dist/expr-v2/integration/kernel.ts
            psc1/dist/expr-v2/integration/kernel.d.ts
            psc1/dist/expr-v2/integration/kernel.js.map
            ${{ runner.temp }}/psc1-dag-generated*.log
            ${{ runner.temp }}/psc1-generated-prefix*.log
