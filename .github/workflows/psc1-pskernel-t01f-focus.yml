name: PSC1 T01F authenticated generated artifact diagnostic
on:
  workflow_dispatch:
# Full-suite qualification owns push execution; keep this diagnostic manual.
permissions:
  contents: read
  actions: read

# This workflow reuses the compiled bytes from 19fb4b0. That producer's full
# generated acceptance job was cancelled. Its successful compiler, source-check,
# and fixture steps are authenticated separately below. These diagnostics neither
# qualify a newer executable source nor promote a detached provider bundle.
jobs:
  generated-reuse:
    name: authenticated 19fb generated ${{ matrix.mode }} diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: controls
            minutes: 10
          - mode: mixed
            minutes: 25
    env:
      PSC1_T01F_REUSE_MODE: ${{ matrix.mode }}
      PSC1_T01F_JOB_MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate producer steps, artifact bytes, and current harness sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export PSC1_T01F_REUSE_DIR="$RUNNER_TEMP/psc1-t01f-reuse-$PSC1_T01F_REUSE_MODE"
          export PSC1_T01F_NODE="$(command -v node)"
          mkdir -p "$PSC1_T01F_REUSE_DIR"
          printf 'PSC1_T01F_REUSE_DIR=%s\nPSC1_T01F_NODE=%s\n' \
            "$PSC1_T01F_REUSE_DIR" "$PSC1_T01F_NODE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, subprocess, urllib.parse, urllib.request, zipfile

          repo = 'dwijayuda/pskernel'
          source = '19fb4b0b8f52808d6a31705185018d6e60836d8e'
          source_tree = 'f229557fc2f6d3b782a319710462dd29bb0c080a'
          producer_run = 39827244691
          producer_job = 119993676851
          artifact_id = 12447224834
          artifact_size = 1110713
          artifact_digest = 'f899a7704c804d9c48ac54ee2cdd608f69497397b4f1378145e235b65126522b'
          lean_commit = 'eb6cafb7290e8bd5f2937522d8d804f58f02bafc'
          samples = ['', 'a', 'é', '€', '😀', 'Aé€😀']
          expected = {
              'kernel': {'bytes': 9953467, 'sha256': 'cd6d03fe2da5b7e76bf40a7e3dba9e8315e2fb1a269f20f3108e29f77c49e5f5'},
              'fixture': {'bytes': 2791525, 'sha256': '563d6ef138271a13039764257407ee8b66190bca02c8057489d3b1c45f51e71d'},
              'fixtureProducer': {'bytes': 37036, 'sha256': 'de62e00a433d3a98eee1e85905ed8fc217f0dc9d3669257934d7d6fefa4992fc'},
              'generatedRunner': {'bytes': 23847, 'sha256': 'fafce130684bc8fc8e2ea53f4632a257152caf4d86b66cd558d8663bc143f737'},
          }
          root = pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR'])
          detached = root / 'detached'
          detached.mkdir()
          harness_sha = os.environ['GITHUB_SHA']
          api = 'https://api.github.com/repos/' + repo

          def require(condition, label):
              if not condition:
                  raise RuntimeError('PSC1_T01F_REUSE_AUTH_FAILURE: ' + label)

          def digest(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}

          def get(path, binary=False):
              request = urllib.request.Request(api + path, headers={
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'psc1-t01f-authenticated-artifact-diagnostic',
              })
              # Never forward the GitHub token to the artifact's signed blob URL.
              request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              return data if binary else json.loads(data)

          def source_file(path, ref):
              record = get('/contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + ref)
              require(record['type'] == 'file' and record['encoding'] == 'base64', 'source file encoding ' + path)
              data = base64.b64decode(record['content'])
              git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              require(record['sha'] == git_blob and record['size'] == len(data), 'source blob integrity ' + path)
              return data, record['sha']

          require(os.environ['GITHUB_REPOSITORY'] == repo, 'repository')
          require(re.fullmatch('[0-9a-f]{40}', harness_sha) is not None, 'current harness SHA')
          require(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == harness_sha,
                  'checkout is current immutable harness source')
          node_version = subprocess.check_output([os.environ['PSC1_T01F_NODE'], '--version'], text=True).strip()
          require(node_version.startswith('v22.'), 'Node 22')
          mode = os.environ['PSC1_T01F_REUSE_MODE']
          require(mode in ('controls', 'mixed'), 'diagnostic mode')

          run = get('/actions/runs/' + str(producer_run))
          require(run['id'] == producer_run and run['run_attempt'] == 1 and run['head_sha'] == source,
                  'producer run source and attempt')
          require(run['repository']['full_name'] == repo and run['head_repository']['full_name'] == repo,
                  'producer repository')
          require(run['head_commit']['tree_id'] == source_tree, 'producer immutable source tree')
          require(run['path'] == '.github/workflows/psc1-pskernel-t01f-focus.yml', 'producer workflow')
          require(run['status'] == 'completed' and run['conclusion'] == 'cancelled',
                  'preserve actual cancelled producer outcome')
          job = get('/actions/jobs/' + str(producer_job))
          require(job['id'] == producer_job and job['run_id'] == producer_run and job['head_sha'] == source,
                  'producer job source')
          require(job['name'] == 'generated-string' and job['status'] == 'completed' and job['conclusion'] == 'cancelled',
                  'preserve actual cancelled generated job outcome')
          expected_steps = {
              'Run actions/checkout@v4': 'success',
              'Install pinned Lean': 'success',
              'Run actions/setup-node@v4': 'success',
              'Build authentic PSC1 and check complete kernel source': 'success',
              'Install pinned TypeScript': 'success',
              'Compile the complete independent kernel to JavaScript': 'success',
              'Produce authentic T01F inputs for generated independent replay': 'success',
              'Independently admit and check full String environment in detached generated Node': 'cancelled',
              'Run real generated checker without external Lean on PATH': 'skipped',
              'Check generated mutual and nested prefix owners in detached Node': 'skipped',
              'Run actions/upload-artifact@v4': 'success',
          }
          step_evidence = []
          for name, conclusion in expected_steps.items():
              matching = [step for step in job['steps'] if step['name'] == name]
              require(len(matching) == 1 and matching[0]['status'] == 'completed' and
                      matching[0]['conclusion'] == conclusion, 'producer step ' + name)
              step_evidence.append(matching[0])

          artifact = get('/actions/artifacts/' + str(artifact_id))
          require(artifact['id'] == artifact_id and artifact['name'] == 'psc1-t01f-generated-preflight' and
                  artifact['size_in_bytes'] == artifact_size and not artifact['expired'], 'artifact metadata')
          require(artifact['digest'] == 'sha256:' + artifact_digest and
                  artifact['workflow_run']['id'] == producer_run and artifact['workflow_run']['head_sha'] == source,
                  'artifact source and digest')
          archive_bytes = get('/actions/artifacts/' + str(artifact_id) + '/zip', binary=True)
          require(digest(archive_bytes) == {'bytes': artifact_size, 'sha256': artifact_digest}, 'downloaded ZIP bytes')
          (root / 'producer-artifact.zip').write_bytes(archive_bytes)
          archive = zipfile.ZipFile(io.BytesIO(archive_bytes))
          entries = []

          def extract(suffix, target):
              matches = [entry for entry in archive.infolist() if not entry.is_dir() and
                         (entry.filename == suffix or entry.filename.endswith('/' + suffix))]
              require(len(matches) == 1, 'unique primary archive path ' + suffix)
              entry = matches[0]
              data = archive.read(entry)
              target.write_bytes(data)
              entries.append({'archivePath': entry.filename, 'outputPath': str(target.relative_to(root)), **digest(data)})
              return data

          kernel = extract('psc1/dist/expr-v2/integration/kernel.js', detached / 'kernel.mjs')
          fixture_bytes = extract('psc1-t01f-generated/fixture.json', detached / 'fixture.json')
          provenance_bytes = extract('psc1-t01f-generated/provenance.json', root / 'producer-provenance.json')
          native_log = extract('psc1-t01f-generated/native.log', root / 'producer-native.log').decode('utf-8')
          require(digest(kernel) == expected['kernel'] and digest(fixture_bytes) == expected['fixture'],
                  'primary kernel and raw fixture bytes')
          provenance = json.loads(provenance_bytes)
          require(provenance['schema'] == 'psc1-t01f-source-provenance-v1' and provenance['sourceSha'] == source and
                  provenance['runId'] == str(producer_run) and provenance['runAttempt'] == '1' and
                  provenance['job'] == 'generated-string' and provenance['route'] == 'generated', 'original provenance identity')
          require(provenance['leanCommit'] == lean_commit and 'version 4.35.0,' in provenance['leanVersion'] and
                  provenance['node'] == 'v22.23.4' and provenance['kernelFuel'] == 4096 and
                  provenance['nodeOldSpaceLimitMiB'] == 2048, 'original toolchain and resource policy')
          require(provenance['requests'] == 294 and provenance['metadata'] == 377 and provenance['samples'] == samples,
                  'original input manifest')
          for name, value in expected.items():
              require(provenance[name] == value, 'original provenance digest ' + name)
          fixture = json.loads(fixture_bytes)
          require(fixture['format'] == 'psc1-authentic-string435-v1' and fixture['leanVersion'] == '4.35.0' and
                  fixture['leanCommit'] == lean_commit, 'raw fixture format and pinned Lean')
          require(len(fixture['declarations']) == 294 and len(fixture['metadata']) == 377 and fixture['samples'] == samples,
                  'complete original declaration input set')
          native_lines = native_log.splitlines()
          require(native_lines.count('PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096') == 1,
                  'successful original native oracle')
          require(sum(line.startswith('PSC1_T01F_CASE_PASS ') for line in native_lines) == 6,
                  'six original native cases')

          original_sources = {}
          for name, path in (
              ('fixtureProducer', 'psc1/test/PsKernelExprV2StringEnvironmentRegression.lean'),
              ('generatedRunner', 'psc1/scripts/pskernel-expr-v2-string-environment-smoke.mjs'),
              ('selfHost', 'psc1/packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean'),
              ('leanToolchain', 'psc1/lean-toolchain'),
              ('workflow', '.github/workflows/psc1-pskernel-t01f-focus.yml'),
          ):
              data, blob_sha = source_file(path, source)
              if name in expected:
                  require(digest(data) == expected[name], 'original source input ' + name)
              if name == 'leanToolchain':
                  require(data.decode().strip() == 'leanprover/lean4:v4.35.0', 'source Lean toolchain pin')
              if name == 'workflow':
                  require(blob_sha == '6c35ee482ec86aa4eaa4aafecd8025bc79a38b82', 'reviewed original compiler workflow')
                  require('typescript@7.0.2' in data.decode() and
                          'lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean' in data.decode(),
                          'original TypeScript pin and complete SelfHost source-check command')
              (root / ('producer-' + name + pathlib.Path(path).suffix)).write_bytes(data)
              original_sources[name] = {'path': path, 'sourceSha': source, 'gitBlobSha': blob_sha, **digest(data)}

          current_sources = {}
          for name, path, output in (
              ('string', 'psc1/scripts/pskernel-expr-v2-string-environment-smoke.mjs', 'string-smoke.mjs'),
              ('dag', 'psc1/scripts/pskernel-expr-v2-dag-smoke.mjs', 'dag-smoke.mjs'),
              ('prefix', 'psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs', 'prefix-smoke.mjs'),
          ):
              data, blob_sha = source_file(path, harness_sha)
              require(pathlib.Path(path).read_bytes() == data, 'current immutable checkout script ' + name)
              (detached / output).write_bytes(data)
              current_sources[name] = {'path': path, 'detachedPath': output, 'sourceSha': harness_sha,
                                       'gitBlobSha': blob_sha, **digest(data)}
          require(current_sources['string']['sha256'] == 'd3672e6105a0ddf04b52774cb841df6f26e755d66915f6cf764929faaddf69a2',
                  'reviewed strict selector harness bytes')

          report = {
              'schema': 'psc1-t01f-authenticated-reuse-diagnostic-v1',
              'authority': 'Diagnostic only. The 19fb producer full generated acceptance was cancelled; no final-source qualification or provider promotion.',
              'inputAuthority': 'Raw requests only. This generated process must independently admit all 294 requests from empty before querying.',
              'repository': repo, 'harnessSourceSha': harness_sha, 'generatedSourceSha': source,
              'generatedSourceTree': source_tree, 'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'mode': mode,
              'jobMinutes': int(os.environ['PSC1_T01F_JOB_MINUTES']), 'node': node_version,
              'producerTypeScript': '7.0.2', 'producerLeanCommit': lean_commit,
              'fuel': 4096, 'nodeOldSpaceLimitMiB': 2048, 'emptyPATH': True, 'exposeGC': True,
              'requestedSampleIndex': 5 if mode == 'mixed' else None,
              'requestedSample': samples[5] if mode == 'mixed' else None,
              'producer': {'runId': producer_run, 'runAttempt': 1, 'jobId': producer_job,
                           'runConclusion': run['conclusion'], 'jobConclusion': job['conclusion'],
                           'verifiedSteps': step_evidence},
              'artifact': {'id': artifact_id, 'name': artifact['name'], 'bytes': artifact_size, 'sha256': artifact_digest},
              'kernel': digest(kernel), 'fixture': digest(fixture_bytes),
              'originalSources': original_sources, 'currentScripts': current_sources, 'extractedEntries': entries,
          }
          (root / 'reuse-provenance.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          print('PSC1_T01F_REUSE_PROVENANCE ' + json.dumps(report, ensure_ascii=False))
          PY
          "$PSC1_T01F_NODE" --check "$PSC1_T01F_REUSE_DIR/detached/kernel.mjs"
          "$PSC1_T01F_NODE" --check "$PSC1_T01F_REUSE_DIR/detached/string-smoke.mjs"
          "$PSC1_T01F_NODE" --check "$PSC1_T01F_REUSE_DIR/detached/dag-smoke.mjs"
          "$PSC1_T01F_NODE" --check "$PSC1_T01F_REUSE_DIR/detached/prefix-smoke.mjs"

      - name: Retained generated DAG, minimal String, and ownership controls
        if: matrix.mode == 'controls'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PSC1_T01F_REUSE_DIR/detached"
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/dag.memory" \
            env PATH="" "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            dag-smoke.mjs kernel.mjs 2>&1 | tee "$PSC1_T01F_REUSE_DIR/dag.log" | sed -u '/^PSC1_DAG_PASS /d'
          cat "$PSC1_T01F_REUSE_DIR/dag.memory"
          python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR']) / 'dag.log').read_text()
          markers = [
              'PSC1_V2_DAG_JS: PASS',
              'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6',
              'PSC1_EXPR_EQUALITY_DELAYED_JS: PASS hostile=21 staged=2 sharedDepth=64',
              'PSC1_V2_TRANSFORM_JS: PASS',
          ]
          controls = 'ZETA BETA WHNF_STATE PUBLIC_CACHE QUICK_DEFEQ NAT_PROJECTION NESTED_OUTCOMES BINDER CHECK_APP DELTA CONSTANT_INDEX MUTUAL_INDEX CHECK_PROJECTION CHECK_LET LET_CACHE_SCOPE LET_LOCAL_WHNF STATEFUL_DEFEQ APP_CONVERSION APP_CONVERSION_CACHE APP_EAGER_CONTEXT SIMPLE_ADMISSION_MATRIX ADMISSION_SHARED_STATE ADMISSION_POLICY_SAFETY ADMISSION_FINAL_GUARDS THEOREM_ADMISSION_MATRIX THEOREM_ISPROP_STATE UNSAFE_ADMISSION UNSAFE_FRESH_BODY MUTUAL_ADMISSION MUTUAL_FRESH_MEMBER BINDER_SPINE BINDER_SPINE_BUDGET BINDER_SPINE_CACHE BINDER_SPINE_FALLBACK DEFEQ_PREFIX CHEAP_CORE_POLICY CHEAP_PROJECTION_POLICY DEFEQ_REFLECTION DEFEQ_PREFIX_GUARDS'.split()
          markers.extend('PSC1_V2_DAG_JS_' + name + ': PASS' for name in controls)
          for marker in markers:
              if marker not in text:
                  raise RuntimeError('Missing retained DAG gate: ' + marker)
          if 'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6' not in text.splitlines():
              raise RuntimeError('Missing exact staged ABI gate')
          PY
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/prefix.memory" \
            env PATH="" "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            prefix-smoke.mjs kernel.mjs 2>&1 | tee "$PSC1_T01F_REUSE_DIR/prefix.log"
          cat "$PSC1_T01F_REUSE_DIR/prefix.memory"
          grep -Fqx 'PSC1_V2_GENERATED_PREFIX_JS: PASS new=24 recursors=7 direct=6 privateIDs=3' "$PSC1_T01F_REUSE_DIR/prefix.log"
          grep -Fqx 'PSC1_V2_SESSION_OWNERS_JS: PASS kinds=8 direct=7 privateIDs=5 forks=2' "$PSC1_T01F_REUSE_DIR/prefix.log"
          grep -Eq '^PSC1_V2_GENERATED_PREFIX_CONTROLS_JS: PASS positive=6 negative=7 assertions=[0-9]+$' "$PSC1_T01F_REUSE_DIR/prefix.log"
          printf '%s\n' 'PSC1_T01F_REUSED_CONTROLS: PASS diagnosticOnly=true generatedSource=19fb4b0b8f52808d6a31705185018d6e60836d8e' \
            | tee "$PSC1_T01F_REUSE_DIR/controls-receipt.txt"

      - name: Independent mixed Unicode sample with full unchanged assertions
        if: matrix.mode == 'mixed'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PSC1_T01F_REUSE_DIR/detached"
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/mixed.memory" \
            env PATH="" PSC1_T01F_TRACE=1 "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            string-smoke.mjs kernel.mjs fixture.json 5 \
            2>&1 | tee "$PSC1_T01F_REUSE_DIR/mixed.log"
          cat "$PSC1_T01F_REUSE_DIR/mixed.memory"
          python3 - <<'PY'
          import json, math, os, pathlib
          root = pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR'])
          evidence = json.loads((root / 'reuse-provenance.json').read_text())
          lines = (root / 'mixed.log').read_text().splitlines()
          prefix = 'PSC1_T01F_STRING_SHARD_JS: PASS '
          matches = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(matches) != 1 or any(line.startswith('PSC1_T01F_FULL_STRING_JS: PASS ') for line in lines):
              raise RuntimeError('Expected one shard receipt and no full-suite qualification marker')
          receipt = json.loads(matches[0])
          expected = {
              'sampleIndex': 5, 'sample': 'Aé€😀', 'availableSamples': 6,
              'executedSamples': 1, 'samples': 1, 'fuel': 4096, 'independentAdmission': True,
              'requests': 294, 'metadata': 377, 'declarations': '377', 'diagnosticTracing': True,
              'kernelSha256': evidence['kernel']['sha256'], 'fixtureSha256': evidence['fixture']['sha256'],
              'harnessSha256': evidence['currentScripts']['string']['sha256'],
          }
          for name, value in expected.items():
              if receipt.get(name) != value or type(receipt.get(name)) is not type(value):
                  raise RuntimeError('Shard receipt mismatch: ' + name)
          for marker in ('PSC1_T01F_JS_CASE_PASS ', 'PSC1_T01F_JS_SINGLETON_PASS '):
              values = [json.loads(line[len(marker):]) for line in lines if line.startswith(marker)]
              if values != ['Aé€😀']:
                  raise RuntimeError('Expected exactly the selected case marker: ' + marker)
          measurements = receipt.get('measurements')
          if not isinstance(measurements, list) or len(measurements) != 1 or measurements[0].get('sample') != 'Aé€😀':
              raise RuntimeError('Expected one complete mixed-sample measurement')
          if type(receipt.get('assertions')) is not int or receipt['assertions'] <= 0:
              raise RuntimeError('Missing assertion count')
          for name in ('constructionMs', 'admissionMs', 'metadataMs', 'totalMs'):
              value = receipt.get(name)
              if type(value) not in (int, float) or not math.isfinite(value) or value < 0:
                  raise RuntimeError('Invalid measurement: ' + name)
          report = {'schema': 'psc1-t01f-reused-mixed-diagnostic-receipt-v1',
                    'diagnosticOnly': True, 'harnessSourceSha': evidence['harnessSourceSha'],
                    'generatedSourceSha': evidence['generatedSourceSha'], 'artifact': evidence['artifact'],
                    'node': evidence['node'], 'jobMinutes': 25, 'fuel': 4096, 'nodeOldSpaceLimitMiB': 2048,
                    'emptyPATH': True, 'result': receipt, 'time': (root / 'mixed.memory').read_text().strip()}
          (root / 'mixed-receipt.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print('PSC1_T01F_REUSED_MIXED_DIAGNOSTIC: PASS ' + json.dumps(report, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-reused-19fb-${{ matrix.mode }}-diagnostic
          path: ${{ runner.temp }}/psc1-t01f-reuse-${{ matrix.mode }}/
          if-no-files-found: error
