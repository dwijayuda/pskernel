name: PSC1 T01F fused primitive data-transition preflight
on:
  workflow_dispatch:
  push:
    branches:
      - work/psc1-pskernel-t01f-string-20261022
    paths:
      - '.github/workflows/psc1-pskernel-t01f-hash.yml'
      - 'psc1/packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/ScalarHash.lean'
      - 'psc1/test/PsKernelScalarHashWorkerRegression.lean'
      - 'psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs'
permissions:
  contents: read
  actions: read
jobs:
  native-string:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean
        run: bash psc1/scripts/install-lean435-ci.sh
      - name: Build authentic fixture exporter and retained checker
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          node --check scripts/pskernel-expr-v2-string-environment-smoke.mjs
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_string_environment_regression psc1_kernel_expr_v2_dag_regression
          lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean
          lake -f kernel-lakefile.lean env lean test/PsKernelExprV2SessionProofs.lean
          lake -f kernel-lakefile.lean env lean --run test/PsKernelExprV2GeneratedPrefixRegression.lean
      - name: Prove exact scalar hash equivalence and run frozen native matrix
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-t01f"
          lake -f kernel-lakefile.lean env lean --run test/PsKernelScalarHashWorkerRegression.lean \
            2>&1 | tee "$RUNNER_TEMP/psc1-t01f/scalar-hash-native.log"
          grep -Fqx 'PSC1_SCALAR_HASH_WORKER_NATIVE: PASS cases=2730 strings=12' "$RUNNER_TEMP/psc1-t01f/scalar-hash-native.log"
          grep -Fqx 'PSC1_SCALAR_HASH_LONG_NATIVE: PASS cases=3' "$RUNNER_TEMP/psc1-t01f/scalar-hash-native.log"
          if grep -Eq 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' "$RUNNER_TEMP/psc1-t01f/scalar-hash-native.log"; then exit 1; fi
      - name: Independently admit actual String declarations and export untrusted inputs
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-t01f"
          lake -f kernel-lakefile.lean env .lake/build/bin/psc1_kernel_expr_v2_string_environment_regression \
            "$RUNNER_TEMP/psc1-t01f/fixture.json" 2>&1 | tee "$RUNNER_TEMP/psc1-t01f/native.log"
          grep -Fqx 'PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096' "$RUNNER_TEMP/psc1-t01f/native.log"
          test "$(grep -c '^PSC1_T01F_SINGLETON_PASS ' "$RUNNER_TEMP/psc1-t01f/native.log")" -eq 6
          sha256sum "$RUNNER_TEMP/psc1-t01f/fixture.json" | tee "$RUNNER_TEMP/psc1-t01f/fixture.sha256"
      - name: Retain existing minimal String and public DAG controls
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
            | tee "$RUNNER_TEMP/psc1-t01f/retained.log" \
            | sed '/^PSC1_DAG_PASS /d'
          grep -Fq 'PSC1_V2_DAG_REGRESSION: PASS' "$RUNNER_TEMP/psc1-t01f/retained.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-native-preflight
          path: |
            ${{ runner.temp }}/psc1-t01f/fixture.json
            ${{ runner.temp }}/psc1-t01f/fixture.sha256
            ${{ runner.temp }}/psc1-t01f/native.log
            ${{ runner.temp }}/psc1-t01f/retained.log
            ${{ runner.temp }}/psc1-t01f/scalar-hash-native.log

  generated-string:
    needs: [native-string]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          bash psc1/scripts/install-lean435-ci.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic PSC1 for the bounded code-generation gate
        working-directory: psc1
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          lake build psc1
      - name: Install pinned TypeScript
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-dag-ts"
          echo '{"name":"psc1-dag-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-dag-ts/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-dag-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
          echo "PSC0_TSC=$RUNNER_TEMP/psc1-dag-ts/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Require data-result scalar hash code generation before full kernel build
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/ScalarHash.lean \
            --out dist/expr-v2/scalar-hash/kernel.js
          cp dist/expr-v2/scalar-hash/kernel.js "$RUNNER_TEMP/psc1-scalar-hash-probe.mjs"
          node scripts/pskernel-scalar-hash-worker-smoke.mjs "$RUNNER_TEMP/psc1-scalar-hash-probe.mjs" \
            | tee "$RUNNER_TEMP/psc1-scalar-hash-probe.log"
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('dist/expr-v2/scalar-hash/kernel.js').read_text()
          names = re.findall(r'^export function (psKernelCacheStringHashStateWithFuel[A-Za-z0-9_$]*)\(', text, re.M)
          bodies = []
          for name in names:
              marker = 'function* __ps$impl$' + name + '('
              if marker not in text: marker = 'export function ' + name + '('
              start = text.index(marker)
              end = text.find('\nexport ', start + len(marker))
              body = text[start:] if end < 0 else text[start:end]
              bodies.append(body)
              print('PSC1_HASH_ITERATOR_BODY ' + name + ' ' + repr(body))
          if names != ['psKernelCacheStringHashStateWithFuel']:
              raise RuntimeError('Iterator was recurried into staged helpers: ' + repr(names))
          body = bodies[0]
          for machinery in ('__ps$wrap', 'psKernelCacheStringHashStep', 'psKernelCacheMix'):
              if machinery in body:
                  raise RuntimeError('Fused data iterator still has staged results or byte dispatch: ' + machinery)
          if body.count('__ps$invoke(') != 1 or '__ps$invoke(psKernelCacheStringHashStateWithFuel,' not in body:
              raise RuntimeError('Expected only one recursive scheduler call in the data iterator')
          if len(re.findall(r'function\s*\*\s*\(', body)) != 1:
              raise RuntimeError('Expected one structural generator block and no nested byte generator')
          marker = 'export function psKernelCacheStringHashStep('
          start = text.index(marker)
          end = text.find('\nexport ', start + len(marker))
          step = text[start:] if end < 0 else text[start:end]
          for machinery in ('function*', '__ps$run', '__ps$invoke', '__ps$wrap'):
              if machinery in step:
                  raise RuntimeError('Byte transition is not a pure generated leaf: ' + machinery)
          marker = 'function* __ps$impl$psKernelCacheStringHash('
          start = text.index(marker)
          end = text.find('\nexport ', start + len(marker))
          entry = text[start:] if end < 0 else text[start:end]
          if 'psKernelCacheStringHashWorker' in entry or '__ps$wrap' in entry:
              raise RuntimeError('Full hash still dispatches through the staged public worker')
          print('PSC1_HASH_LEAF_CODEGEN: PASS byteStepGenerator=false byteStepStaging=false byteMixDispatch=false stagedFullEntry=false')
          print('PSC1_HASH_DATA_RESULT_CODEGEN: PASS helpers=' + str(len(names)))
          print('PSC1_HASH_FUSED_TRANSITION_CODEGEN: PASS resultStaging=0 byteStepDispatch=false recursiveDispatches=1 structuralGeneratorBlocks=1')
          PY
      - name: Check complete authentic kernel source after the bounded gate
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 check packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean
      - name: Compile the complete independent kernel to JavaScript
        working-directory: psc1
        run: |
          set -euo pipefail
          lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean \
            --out dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.js
          test -s dist/expr-v2/integration/kernel.ts
          test -s dist/expr-v2/integration/kernel.d.ts
          test -s dist/expr-v2/integration/kernel.js.map
          node --check dist/expr-v2/integration/kernel.js
      - name: Produce authentic T01F inputs for generated independent replay
        working-directory: psc1
        shell: bash
        run: |
          set -euo pipefail
          PSC1_T01F_DIR="$RUNNER_TEMP/psc1-t01f-generated"
          mkdir -p "$PSC1_T01F_DIR"
          test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          node --check scripts/pskernel-expr-v2-string-environment-smoke.mjs
          lake -f kernel-lakefile.lean build psc1_kernel_expr_v2_string_environment_regression
          lean --version > "$PSC1_T01F_DIR/lean-version.txt"
          lean --githash > "$PSC1_T01F_DIR/lean-githash.txt"
          lake -f kernel-lakefile.lean env .lake/build/bin/psc1_kernel_expr_v2_string_environment_regression \
            "$PSC1_T01F_DIR/fixture.json" 2>&1 | tee "$PSC1_T01F_DIR/native.log"
          grep -Fqx 'PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096' "$PSC1_T01F_DIR/native.log"
          test "$(grep -c '^PSC1_T01F_CASE_PASS ' "$PSC1_T01F_DIR/native.log")" -eq 6
          test "$(grep -c '^PSC1_T01F_SINGLETON_PASS ' "$PSC1_T01F_DIR/native.log")" -eq 6
          grep -Fq 'PSC1_T01F_FIXTURE_WRITTEN ' "$PSC1_T01F_DIR/native.log"
          test -s "$PSC1_T01F_DIR/fixture.json"
          sha256sum "$PSC1_T01F_DIR/fixture.json" | tee "$PSC1_T01F_DIR/fixture.sha256"
          node --input-type=module - "$PSC1_T01F_DIR" "dist/expr-v2/integration/kernel.js" "generated" <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const [dir,kernel,route]=process.argv.slice(2);
          const digest=path=>{const bytes=readFileSync(path);return {bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};};
          const fixture=JSON.parse(readFileSync(dir+'/fixture.json','utf8'));
          const leanCommit=readFileSync(dir+'/lean-githash.txt','utf8').trim();
          if(leanCommit!=='eb6cafb7290e8bd5f2937522d8d804f58f02bafc' || fixture.leanCommit!==leanCommit ||
              fixture.leanVersion!=='4.35.0' || fixture.format!=='psc1-authentic-string435-v1')
            throw Error('PSC1_T01F_SOURCE_PROVENANCE_MISMATCH');
          if(!/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA??''))throw Error('PSC1_T01F_MISSING_SOURCE_SHA');
          const report={schema:'psc1-t01f-source-provenance-v1',sourceSha:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,route,
            leanVersion:readFileSync(dir+'/lean-version.txt','utf8').trim(),leanCommit,node:process.version,
            requests:fixture.declarations.length,metadata:fixture.metadata.length,samples:fixture.samples,
            kernelFuel:4096,nodeOldSpaceLimitMiB:route==='native'?null:2048,
            authority:'Raw declaration requests only; generated consumers independently admit from empty.',
            fixture:digest(dir+'/fixture.json'),kernel:digest(kernel),
            fixtureProducer:digest('test/PsKernelExprV2StringEnvironmentRegression.lean'),generatedRunner:digest('scripts/pskernel-expr-v2-string-environment-smoke.mjs')};
          writeFileSync(dir+'/provenance.json',JSON.stringify(report,null,2)+'\n');
          console.log('PSC1_T01F_SOURCE_PROVENANCE '+JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-t01f-hash-generated-producer
          path: |
            ${{ runner.temp }}/psc1-t01f-generated/
            psc1/dist/expr-v2/integration/kernel.js
            psc1/dist/expr-v2/integration/kernel.ts
            psc1/dist/expr-v2/integration/kernel.d.ts
            psc1/dist/expr-v2/integration/kernel.js.map
            psc1/dist/expr-v2/scalar-hash/
            ${{ runner.temp }}/psc1-scalar-hash-probe.log
          if-no-files-found: error

  generated-hash-runtime:
    needs: [generated-string, native-string]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: controls
            minutes: 10
          - mode: mixed
            minutes: 25
    env:
      PSC1_T01F_REUSE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: psc1-t01f-hash-generated-producer
          path: ${{ runner.temp }}/t01f-hash-producer
      - name: Authenticate exact same-run producer and detached input bytes
        shell: bash
        run: |
          set -euo pipefail
          export PSC1_T01F_REUSE_DIR="$RUNNER_TEMP/psc1-t01f-hash-${PSC1_T01F_REUSE_MODE}"
          export PSC1_T01F_NODE="$(command -v node)"
          export PSC1_T01F_NODE_VERSION="$("$PSC1_T01F_NODE" --version)"
          printf 'PSC1_T01F_REUSE_DIR=%s\nPSC1_T01F_NODE=%s\n' "$PSC1_T01F_REUSE_DIR" "$PSC1_T01F_NODE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          require = lambda ok, label: None if ok else (_ for _ in ()).throw(RuntimeError(label))
          source = os.environ['GITHUB_SHA']
          artifact = pathlib.Path(os.environ['RUNNER_TEMP']) / 't01f-hash-producer'
          root = pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR'])
          root.mkdir()
          detached = root / 'detached'; detached.mkdir()
          files = [p for p in artifact.rglob('*') if p.is_file()]
          def suffix(ending):
              found = [p for p in files if p.as_posix().endswith('/'+ending)]
              require(len(found)==1,'unique artifact path '+ending)
              return found[0]
          def digest(path):
              data = path.read_bytes(); return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          provenance = json.loads(suffix('psc1-t01f-generated/provenance.json').read_text())
          for field,value in {'schema':'psc1-t01f-source-provenance-v1','sourceSha':source,'runId':os.environ['GITHUB_RUN_ID'],
                              'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':'generated-string','route':'generated',
                              'leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc','kernelFuel':4096,
                              'nodeOldSpaceLimitMiB':2048,'requests':294,'metadata':377}.items():
              require(provenance[field]==value,'same-run producer '+field)
          kernel = suffix('psc1/dist/expr-v2/integration/kernel.js')
          fixture = suffix('psc1-t01f-generated/fixture.json')
          runner = pathlib.Path('psc1/scripts/pskernel-expr-v2-string-environment-smoke.mjs')
          fixture_producer = pathlib.Path('psc1/test/PsKernelExprV2StringEnvironmentRegression.lean')
          for field,path in {'kernel':kernel,'fixture':fixture,'generatedRunner':runner,'fixtureProducer':fixture_producer}.items():
              require(provenance[field]==digest(path),'digest '+field)
          raw = json.loads(fixture.read_text())
          samples = ['', 'a', 'é', '€', '😀', 'Aé€😀']
          require(raw['samples']==samples and provenance['samples']==samples,'all original samples')
          require(len(raw['declarations'])==294 and len(raw['metadata'])==377,'full fixture')
          log = suffix('psc1-t01f-generated/native.log').read_text().splitlines()
          require(log.count('PSC1_T01F_FULL_STRING: PASS authenticClosure=true independentAdmission=true fuel=4096')==1,'native oracle')
          require(sum(l.startswith('PSC1_T01F_SINGLETON_PASS ') for l in log)==6,'native singleton sequences')
          for path,name in [(kernel,'kernel.mjs'),(fixture,'fixture.json'),(runner,'string-smoke.mjs'),
                            (pathlib.Path('psc1/scripts/pskernel-expr-v2-dag-smoke.mjs'),'dag-smoke.mjs'),
                            (pathlib.Path('psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs'),'prefix-smoke.mjs'),
                            (pathlib.Path('psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs'),'scalar-hash-smoke.mjs')]:
              shutil.copyfile(path,detached/name)
              require(digest(path)==digest(detached/name),'detached copy '+name)
          report={'schema':'psc1-t01f-same-run-hash-preflight-v1','harnessSourceSha':source,'generatedSourceSha':source,
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'kernel':digest(kernel),'fixture':digest(fixture),'currentScripts':{'string':digest(runner)},
                  'artifact':{'name':'psc1-t01f-hash-generated-producer','runId':os.environ['GITHUB_RUN_ID']},
                  'node':os.environ['PSC1_T01F_NODE_VERSION'],'mode':os.environ['PSC1_T01F_REUSE_MODE']}
          (root/'reuse-provenance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('PSC1_T01F_HASH_PREFLIGHT_INPUTS '+json.dumps(report,ensure_ascii=False))
          PY
      - name: Retained generated DAG, minimal String, and ownership controls
        if: matrix.mode == 'controls'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PSC1_T01F_REUSE_DIR/detached"
          env PATH="" "$PSC1_T01F_NODE" --max-old-space-size=2048 scalar-hash-smoke.mjs kernel.mjs \
            | tee "$PSC1_T01F_REUSE_DIR/scalar-hash.log"
          grep -Fq 'PSC1_SCALAR_HASH_WORKER_JS: PASS ' "$PSC1_T01F_REUSE_DIR/scalar-hash.log"
          grep -Fqx 'PSC1_SCALAR_HASH_LONG_JS: PASS cases=3' "$PSC1_T01F_REUSE_DIR/scalar-hash.log"
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/dag.memory" \
            env PATH="" "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            dag-smoke.mjs kernel.mjs 2>&1 | tee "$PSC1_T01F_REUSE_DIR/dag.log" | sed -u '/^PSC1_DAG_PASS /d'
          cat "$PSC1_T01F_REUSE_DIR/dag.memory"
          python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR']) / 'dag.log').read_text()
          markers = [
              'PSC1_V2_DAG_JS: PASS',
              'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6',
              'PSC1_EXPR_EQUALITY_DELAYED_JS: PASS hostile=21 staged=2 sharedDepth=64',
              'PSC1_V2_TRANSFORM_JS: PASS',
          ]
          controls = 'ZETA BETA WHNF_STATE PUBLIC_CACHE QUICK_DEFEQ NAT_PROJECTION NESTED_OUTCOMES BINDER CHECK_APP DELTA CONSTANT_INDEX MUTUAL_INDEX CHECK_PROJECTION CHECK_LET LET_CACHE_SCOPE LET_LOCAL_WHNF STATEFUL_DEFEQ APP_CONVERSION APP_CONVERSION_CACHE APP_EAGER_CONTEXT SIMPLE_ADMISSION_MATRIX ADMISSION_SHARED_STATE ADMISSION_POLICY_SAFETY ADMISSION_FINAL_GUARDS THEOREM_ADMISSION_MATRIX THEOREM_ISPROP_STATE UNSAFE_ADMISSION UNSAFE_FRESH_BODY MUTUAL_ADMISSION MUTUAL_FRESH_MEMBER BINDER_SPINE BINDER_SPINE_BUDGET BINDER_SPINE_CACHE BINDER_SPINE_FALLBACK DEFEQ_PREFIX CHEAP_CORE_POLICY CHEAP_PROJECTION_POLICY DEFEQ_REFLECTION DEFEQ_PREFIX_GUARDS'.split()
          markers.extend('PSC1_V2_DAG_JS_' + name + ': PASS' for name in controls)
          for marker in markers:
              if marker not in text:
                  raise RuntimeError('Missing retained DAG gate: ' + marker)
          if 'PSC1_V2_DAG_JS_WHNF_STAGED_ABI: PASS exports=2 partials=4 executions=6' not in text.splitlines():
              raise RuntimeError('Missing exact staged ABI gate')
          PY
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/prefix.memory" \
            env PATH="" "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            prefix-smoke.mjs kernel.mjs 2>&1 | tee "$PSC1_T01F_REUSE_DIR/prefix.log"
          cat "$PSC1_T01F_REUSE_DIR/prefix.memory"
          grep -Fqx 'PSC1_V2_GENERATED_PREFIX_JS: PASS new=24 recursors=7 direct=6 privateIDs=3' "$PSC1_T01F_REUSE_DIR/prefix.log"
          grep -Fqx 'PSC1_V2_SESSION_OWNERS_JS: PASS kinds=8 direct=7 privateIDs=5 forks=2' "$PSC1_T01F_REUSE_DIR/prefix.log"
          grep -Eq '^PSC1_V2_GENERATED_PREFIX_CONTROLS_JS: PASS positive=6 negative=7 assertions=[0-9]+$' "$PSC1_T01F_REUSE_DIR/prefix.log"
          printf '%s\n' 'PSC1_T01F_HASH_CONTROLS: PASS exactSource=true' \
            | tee "$PSC1_T01F_REUSE_DIR/controls-receipt.txt"

      - name: Independent mixed Unicode sample with full unchanged assertions
        if: matrix.mode == 'mixed'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PSC1_T01F_REUSE_DIR/detached"
          /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
            -o "$PSC1_T01F_REUSE_DIR/mixed.memory" \
            env PATH="" PSC1_T01F_TRACE=1 "$PSC1_T01F_NODE" --max-old-space-size=2048 --expose-gc \
            string-smoke.mjs kernel.mjs fixture.json 5 \
            2>&1 | tee "$PSC1_T01F_REUSE_DIR/mixed.log"
          cat "$PSC1_T01F_REUSE_DIR/mixed.memory"
          python3 - <<'PY'
          import json, math, os, pathlib
          root = pathlib.Path(os.environ['PSC1_T01F_REUSE_DIR'])
          evidence = json.loads((root / 'reuse-provenance.json').read_text())
          lines = (root / 'mixed.log').read_text().splitlines()
          prefix = 'PSC1_T01F_STRING_SHARD_JS: PASS '
          matches = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(matches) != 1 or any(line.startswith('PSC1_T01F_FULL_STRING_JS: PASS ') for line in lines):
              raise RuntimeError('Expected one shard receipt and no full-suite qualification marker')
