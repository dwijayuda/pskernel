name: PSC1 complete lazy-transform refinement qualification
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-transform-lazy-full-20261025
    paths:
    - psc1/kernel-lakefile.lean
    - psc1/lean-toolchain
    - psc1/packages/pskernel-core/src/**
    - psc1/test/**
    - psc1/scripts/**
    - psc1/check-psc1-source.mjs
    - .github/workflows/psc1-pskernel-t05-header.yml
permissions:
  contents: read
jobs:
  native-header:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PSC1_T05_ROUTE: native
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      shell: bash
      run: |
        bash psc1/scripts/install-lean435-ci.sh
    - name: Verify exact source, pins, frozen references and JavaScript syntax
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-$PSC1_T05_ROUTE"
        printf 'PSC1_T05_DIR=%s\n' "$PSC1_T05_DIR" >> "$GITHUB_ENV"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(node -p 'process.versions.node.split(".")[0]')" = 22
        mkdir -p "$PSC1_T05_DIR"
        lean --version > "$PSC1_T05_DIR/lean-version.txt"
        lean --githash > "$PSC1_T05_DIR/lean-githash.txt"
        node --version > "$PSC1_T05_DIR/node-version.txt"
        printf 'PSC1_T05_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
        node --check scripts/pskernel-ordinary-header-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-params-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-result-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-fields-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-analysis-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-loop-smoke.mjs
        node --check scripts/pskernel-ordinary-elimination-smoke.mjs
        node --check scripts/pskernel-ordinary-admission-private-smoke.mjs
        node --check scripts/pskernel-ordinary-admission-public-smoke.mjs
        node --check scripts/pskernel-expr-v2-transform-delay-smoke.mjs
        node --check scripts/pskernel-empty-semantic-cache-smoke.mjs
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, shutil
        repo = pathlib.Path.cwd().parent
        out = pathlib.Path(os.environ['PSC1_T05_DIR'])
        source = os.environ['GITHUB_SHA']
        if re.fullmatch(r'[0-9a-f]{40}',source) is None: raise RuntimeError('Missing exact source SHA')
        paths = [".github/workflows/psc1-pskernel-t05-header.yml","psc1/kernel-lakefile.lean","psc1/lean-toolchain","psc1/scripts/install-lean435-ci.sh","psc1/packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagAdmission.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeaderTypes.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryOccurrence.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryAnnotations.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryParameters.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeader.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/AdmissionHelpers.lean","psc1/test/PsKernelOrdinaryHeaderStateProofs.lean","psc1/test/PsKernelOrdinaryOccurrenceProofs.lean","psc1/test/PsKernelCacheScopeProofs.lean","psc1/test/PsKernelExprV2SessionProofs.lean","psc1/test/PsKernelScalarHashWorkerRegression.lean","psc1/test/PsKernelClosedCacheAnalysisRegression.lean","psc1/test/PsKernelKnotFuelProofs.lean","psc1/test/PsKernelOrdinaryHeaderRegression.lean","psc1/scripts/pskernel-ordinary-header-smoke.mjs","psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs","psc1/scripts/pskernel-scalar-hash-short-entry-smoke.mjs","psc1/scripts/pskernel-closed-cache-analysis-smoke.mjs","psc1/scripts/pskernel-generated-smoke.mjs","psc1/scripts/pskernel-expr-v2-dag-smoke.mjs","psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs","psc1/scripts/pskernel-invalid-recursor-occurrence-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorParams.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorResult.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean","psc1/test/PsKernelExprV2MetadataProofs.lean","psc1/test/PsKernelExprV2PagedModelProofs.lean","psc1/test/PsKernelExprV2LayoutBoundaryProofs.lean","psc1/test/PsKernelOrdinaryConstructorParamsProofs.lean","psc1/test/PsKernelOrdinaryConstructorResultProofs.lean","psc1/test/PsKernelOrdinaryConstructorParamsRegression.lean","psc1/test/PsKernelOrdinaryConstructorResultRegression.lean","psc1/scripts/pskernel-ordinary-constructor-params-smoke.mjs","psc1/scripts/pskernel-ordinary-constructor-result-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorTypes.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryRecursiveArgument.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorFields.lean","psc1/test/PsKernelOrdinaryRecursiveArgumentProofs.lean","psc1/test/PsKernelOrdinaryConstructorFieldsProofs.lean","psc1/test/PsKernelOrdinaryConstructorFieldsRegression.lean","psc1/scripts/pskernel-ordinary-constructor-fields-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorAnalysis.lean","psc1/test/PsKernelOrdinaryConstructorAnalysisProofs.lean","psc1/test/PsKernelOrdinaryConstructorAnalysisRegression.lean","psc1/scripts/pskernel-ordinary-constructor-analysis-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/ConstructorAdmission.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorLoop.lean","psc1/test/PsKernelExprV2OrdinaryConstructorLoopProofs.lean","psc1/test/PsKernelExprV2OrdinaryConstructorLoopRegression.lean","psc1/scripts/pskernel-ordinary-constructor-loop-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryElimination.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryGenerated.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryRecursorValidation.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryAdmission.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/Dag.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagGenerated.lean","psc1/test/PsKernelOrdinaryEliminationProofs.lean","psc1/test/PsKernelOrdinaryEliminationRegression.lean","psc1/test/PsKernelOrdinaryAdmissionProofs.lean","psc1/test/PsKernelExprV2OrdinaryAdmissionRegression.lean","psc1/test/PsKernelOrdinaryAdmissionPublicProofs.lean","psc1/test/PsKernelOrdinaryAdmissionPublicRegression.lean","psc1/scripts/pskernel-ordinary-elimination-smoke.mjs","psc1/scripts/pskernel-ordinary-admission-private-smoke.mjs","psc1/scripts/pskernel-ordinary-admission-public-smoke.mjs","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Elimination.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/RecursorValidation.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Recursor.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Transform.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/TransformSupport.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Lift.lean","psc1/test/PsKernelDeferredTransformProofs.lean","psc1/scripts/pskernel-expr-v2-transform-delay-smoke.mjs","psc1/test/PsKernelNatFuelProofs.lean","psc1/test/PsKernelExprEqualityProofs.lean","psc1/test/PsKernelExprV2AdmissionGuardProofs.lean","psc1/test/PsKernelExprV2RecursorProofs.lean","psc1/test/PsKernelExprV2RecursorMajorProofs.lean","psc1/test/PsKernelExprV2RecursorKProofs.lean","psc1/test/PsKernelNameWorkerProofs.lean","psc1/test/PsKernelExprV2QuotOwnerProofs.lean","psc1/test/PsKernelExprV2WhnfABIProofs.lean","psc1/test/PsKernelExprV2OwnedStateProofs.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/CacheAnalysis.lean","psc1/test/PsKernelEmptySemanticCacheProofs.lean","psc1/scripts/pskernel-empty-semantic-cache-smoke.mjs"]
        frozen = {"psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean":"63b3f93af8d1352037d40bbdc793471c3f2f3d80321ad24c680a3a897c402c05","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean":"7506663960991724551ae8af806996304a5e196db275fb22e168639028b803a3","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean":"cc160e7cca9436170b64f845b393d0e8aa631ffb9ce61a74c0bedccb9587e9b0","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean":"068312a568ee3b1b86312d9a9e589a32813e45cf703d0830108efc1556666e51","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean":"8bd99c203b50315d0e58ba4aebb1cebec7d0331db330163fef341bfe713d9145","psc1/test/PsKernelExprV2MetadataProofs.lean":"5c5e14cbdf9aa890640d3dfeb69dcda651aab7cbbfb9da527e500e48daaf1d20","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/ConstructorAdmission.lean":"16cce0a367dfa144a56770f76bcb0605d3a370b360175c4f26583387cf2a1723"}
        frozen_blobs = {"psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Elimination.lean":"7b896a50da30370d3a185b79f9ffeeaa379bbb9b","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/RecursorValidation.lean":"ae0d498305cab3f253bd53f40d66ae0919420027","psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Recursor.lean":"0db1095805c4e6bc4d0025b073fec1807ebf2206"}
        records = []
        for name in paths:
            raw = (repo/name).read_bytes()
            record = {'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                      'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            if name in frozen and record['sha256'] != frozen[name]:
                raise RuntimeError('Frozen V1 reference changed: '+name)
            if name in frozen_blobs and record['gitBlobSha'] != frozen_blobs[name]:
                raise RuntimeError('Frozen V1 generated-admission reference changed: '+name)
            target = out/'sources'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(raw)
            records.append(record)
        report = {'schema':'psc1-t05-header-source-inventory-v1','repository':'dwijayuda/pskernel',
                  'sourceSha':source,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'job':os.environ['GITHUB_JOB'],'route':os.environ['PSC1_T05_ROUTE'],
                  'leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc','files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_SOURCE_INVENTORY '+json.dumps(report,separators=(',',':')))
        PY
    - name: Authenticate the exact unary congruence production delta
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/pskernel-transform-lazy-qualification.py source "$PSC1_T05_DIR/lazy"
        python3 scripts/pskernel-unary-spine-qualification.py source --out "$PSC1_T05_DIR/unary"
    - name: Authenticate the exact empty-cache helper delta and all retained source obligations
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import ast,hashlib,json,os,pathlib,re,subprocess
        BASE='20224a295359abb201f56c72395690bf0bfac9fa'
        ROOT='psc1/packages/pskernel-core/src'
        PROD=ROOT+'/Ps/KernelCore/Runtime/Acceleration/CacheAnalysis.lean'
        RETAINED='psc1/test/PsKernelClosedCacheAnalysisRegression.lean'
        NEW='psc1/test/PsKernelEmptySemanticCacheProofs.lean'
        HARNESS='psc1/scripts/pskernel-empty-semantic-cache-smoke.mjs'
        WORKFLOW='.github/workflows/psc1-pskernel-t05-header.yml'
        out=pathlib.Path(os.environ['PSC1_T05_DIR'])
        identity={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                  'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':os.environ['GITHUB_JOB'],
                  'route':os.environ['PSC1_T05_ROUTE']}
        def require(ok,message):
            if not ok:raise RuntimeError(message)
        def git(*args):
            return subprocess.check_output(['git',*args])
        def digest(raw):
            return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        def blob(raw):
            return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        def section(text,begin,end):
            require(text.count(begin)==1 and text.count(end)==1,'unique source section')
            return text[text.index(begin):text.index(end,text.index(begin))]
        def replace_once(text,before,after):
            require(text.count(before)==1,'unique exact source replacement')
            return text.replace(before,after,1)
        require(git('rev-parse','HEAD').decode().strip()==identity['sourceSha'],'exact target checkout')
        require(git('status','--porcelain').strip()==b'','clean source checkout')
        subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
        baseline_tree=git('rev-parse',BASE+':'+ROOT).decode().strip()
        target_tree=git('rev-parse','HEAD:'+ROOT).decode().strip()
        require(baseline_tree=='57b209c4b29f7a9dd67bdae37e728cde4a0ac1ff','complete qualified baseline production tree')
        require(target_tree=='bccb72769d4f20def35f2064363fbc94fcc7e54a','complete pinned candidate production tree')
        changed=git('diff','--name-only',BASE,'HEAD','--',ROOT).decode().splitlines()
        require(changed==["psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/DefEq/FullShape.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/DefEq/UnarySpines.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Transform.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/CacheAnalysis.lean"],'exact authenticated cache, unary-spine and lazy-transform changes')
        baseline=git('show',BASE+':'+PROD)
        require(blob(baseline)=='4d5ca3d8e2a6136d5fcb35dec131e5c28e6b743b','pinned complete predecessor')
        before=baseline.decode()
        old=section(before,'def psKernelSemanticExprMapGet\n','\n/- None means')
        require(len(old.encode())==546,'exact 546-byte predecessor helper')
        old_branch="""  | Option.none =>
              if psKernelSemanticCacheEligible expr then
                psKernelExprMapGetIn expr cache.small
              else
                Option.none"""
        new_branch="""  | Option.none =>
              match cache.small with
              | List.nil => Option.none
              | List.cons _ _ =>
                  if psKernelSemanticCacheEligible expr then
                    psKernelExprMapGetIn expr cache.small
                  else
                    Option.none"""
        updated=replace_once(old,old_branch,new_branch)
        require(len(updated.encode())==648,'exact 648-byte candidate helper')
        expected=replace_once(before,old,updated)
        expected=replace_once(expected,
            '/- Small caches retain their original eligibility scan and promotion path.',
            '/- Nonempty small caches retain their original eligibility scan and promotion path.')
        require(pathlib.Path(PROD).read_bytes()==expected.encode(),'only exact helper guard and comment may change')
        prior=git('show',BASE+':'+RETAINED)
        require(blob(prior)=='010333b5d6ac53c60c558c89906b02d7358fb0c0','pinned seven-report predecessor')
        prior_text=prior.decode()
        theorem=section(prior_text,'theorem semantic_map_get_eq\n','\ntheorem semantic_map_insert_eq\n')
        fixed=replace_once(theorem,'  | none => rfl\n  | some index =>',
        """  | none =>
              cases small with
              | nil =>
                  cases h : psKernelSemanticCacheEligible expr <;>
                    simp [psKernelSemanticExprMapGet, psKernelExprMapGet,
                      psKernelExprMapGetIn, h]
              | cons entry rest => rfl
          | some index =>""")
        require(pathlib.Path(RETAINED).read_bytes()==replace_once(prior_text,theorem,fixed).encode(),
                'only retained semantic_map_get_eq proof body may change')
        require(theorem.split(':= by',1)[0]==fixed.split(':= by',1)[0],'retained universal statement unchanged')
        pins={
            PROD:(9740,'462d8d839b1e5fd5b5f0620cb18b860d789247aabb4d14c677a0bc69cbc3c16e','d8f8fd5731d0473370a0028d4f484bcb845d9e57'),
            RETAINED:(6106,'ecb1da642bacc61f60806bf0875d4461ac1b6090058edff9d9cd9b94d7d1c61c','0e137de5672d6b63dd8a157cfadc398ca1691d59'),
            NEW:(1917,'abb7e3dd6b93dec51f9e315e6bd6289ce1869c75744da3beb8a9627edac9606d','57a6e6f2a339fdfddb077baa28e344309812cfc5'),
            HARNESS:(4508,'0cce9ce96ace90dcd6ac9cfe1c7a5352d4aca3f05a842fa76e89112961277721','8791063bc6850dec0af726afad8563f78cb63d7e')}
        records=[]
        for name,(size,sha,oid) in pins.items():
            raw=pathlib.Path(name).read_bytes()
            require(digest(raw)=={'bytes':size,'sha256':sha} and blob(raw)==oid,'exact reviewed source: '+name)
            records.append({'path':name,**digest(raw),'gitBlobSha':oid})
        proof=pathlib.Path(NEW).read_text()
        require(proof.count('namespace Frozen\n\n')==1 and proof.count('\nend Frozen')==1,'one frozen helper namespace')
        require(proof.split('namespace Frozen\n\n',1)[1].split('\nend Frozen',1)[0]==old,'frozen helper byte identity')
        require(not re.search(r'\b(?:sorry|admit|unsafe|axiom)\b',proof),'no proof escape declarations')
        names=re.findall(r'(?m)^#print axioms (\S+)\s*$',proof)
        require(names==['PsKernelEmptySemanticCacheProofs.semantic_map_get_eq_before',
                        'PsKernelEmptySemanticCacheProofs.empty_lookup_ignores_expression'],'two fixed universal reports')
        previous_workflow=git('show',BASE+':'+WORKFLOW).decode()
        previous_lists=[ast.literal_eval(value) for value in re.findall(r'(?m)^        paths = (\[.+\])$',previous_workflow)]
        require(len(previous_lists)==2 and previous_lists[0]==previous_lists[1] and len(previous_lists[0])==93,
                'qualified93 source inventory retained')
        inventory=out/'source-inventory.json';inv=json.loads(inventory.read_text())
        require(all(inv[k]==v for k,v in identity.items()),'exact source inventory identity')
        expected_paths=previous_lists[0]+[PROD,NEW,HARNESS]
        require(len(set(expected_paths))==96 and [row['path'] for row in inv['files']]==expected_paths,
                'exact ordered96 source inventory')
        for row in inv['files']:
            name=row['path'];raw=pathlib.Path(name).read_bytes()
            require(raw==git('show','HEAD:'+name),'checked source equals Git input: '+name)
            require(digest(raw)=={'bytes':row['bytes'],'sha256':row['sha256']} and blob(raw)==row['gitBlobSha'],
                    'source inventory byte binding: '+name)
            require((out/'sources'/name).read_bytes()==raw,'archived source byte binding: '+name)
            if name in previous_lists[0] and name not in [WORKFLOW,RETAINED]:
                require(raw==git('show',BASE+':'+name),'all other retained source inputs unchanged: '+name)
        report={'schema':'psc1-t09-empty-semantic-cache-source-v1',**identity,
                'baselineSha':BASE,'baselineProductionTree':baseline_tree,'targetProductionTree':target_tree,
                'productionChanges':changed,'exactCacheLookupGuardAndCommentOnly':True,
                'baselineProduction':{'path':PROD,**digest(baseline),'gitBlobSha':blob(baseline)},
                'predecessorLookup':digest(old.encode()),'candidateLookup':digest(updated.encode()),
                'frozenLookupByteExact':True,'retainedProofStatementAndOtherBodiesUnchanged':True,
                'retainedProofBaseline':{'path':RETAINED,**digest(prior),'gitBlobSha':blob(prior)},
                'allOtherRetainedInputsUnchanged':True,'sourceInputs':96,'proofNames':names,
                'files':records,'sourceInventory':digest(inventory.read_bytes()),
                'retainedLiftAndCountSourceBytesMatch':True,'liftAndCountWorkersDeferred':False,
                'fullQualification':False,'performanceQualified':False}
        (out/'empty-semantic-cache-source-audit.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T09_EMPTY_SEMANTIC_CACHE_SOURCE: PASS '+json.dumps(report,separators=(',',':')))
        PY
    - name: Authenticate restored baseline transforms and frozen universal references
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, subprocess
        base, source = "10144e2f9e8d223b5dcde275bd1f48d25df113b3", os.environ["GITHUB_SHA"]
        assert re.fullmatch(r"[0-9a-f]{40}", base)
        assert re.fullmatch(r"[0-9a-f]{40}", source)
        prefix = "psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/"
        pinned = {
            "Transform.lean": ("8f50a74edf1d00288efee9c559a05a75b755acbf", "psKernelExprV2TransformWithFuel"),
            "TransformSupport.lean": ("7957a3aaf87f440b6fb09c2ee98eb574aeab6c72", "psKernelExprV2TransformCountWithFuel"),
            "Lift.lean": ("50a63d2729088039a3b01f75eda5c6e83f91e036", "psKernelExprV2PagedLiftWithFuel"),
        }
        changed = subprocess.check_output([
            "git", "diff", "--name-only", base, source, "--",
            "psc1/packages/pskernel-core/src"], text=True).splitlines()
        cache_audit_path = pathlib.Path(os.environ["PSC1_T05_DIR"]) / "empty-semantic-cache-source-audit.json"
        cache_audit_raw = cache_audit_path.read_bytes()
        cache_audit = json.loads(cache_audit_raw)
        assert cache_audit["schema"] == "psc1-t09-empty-semantic-cache-source-v1"
        assert cache_audit["sourceSha"] == source
        assert cache_audit["runId"] == os.environ["GITHUB_RUN_ID"]
        assert cache_audit["runAttempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
        assert cache_audit["job"] == os.environ["GITHUB_JOB"] and cache_audit["route"] == os.environ["PSC1_T05_ROUTE"]
        assert cache_audit["baselineSha"] == "20224a295359abb201f56c72395690bf0bfac9fa"
        assert cache_audit["targetProductionTree"] == "bccb72769d4f20def35f2064363fbc94fcc7e54a"
        assert cache_audit["exactCacheLookupGuardAndCommentOnly"] is True
        assert changed == cache_audit["productionChanges"] == ["psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/DefEq/FullShape.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/DefEq/UnarySpines.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Core/ExprV2/Transform.lean","psc1/packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/CacheAnalysis.lean"], "only the independently authenticated cache, unary-spine and lazy-transform deltas are allowed: " + repr(changed)
        proof_path = pathlib.Path("psc1/test/PsKernelDeferredTransformProofs.lean")
        proof = proof_path.read_bytes().decode("utf-8")
        assert proof.count("namespace Frozen\n") == 1
        assert proof.count("\nend Frozen") == 1
        frozen = proof.split("namespace Frozen\n", 1)[1].split("\nend Frozen", 1)[0]
        def body(text, name):
            found = re.search(r"(?ms)^def " + re.escape(name) + r"\n.*?(?=^def |\Z)", text)
            assert found, name
            return found.group(0).rstrip()
        baseline_blobs = {}
        for short, (expected_blob, name) in pinned.items():
            path = prefix + short
            blob = subprocess.check_output(["git", "rev-parse", base + ":" + path], text=True).strip()
            assert blob == expected_blob, (path, blob)
            before = subprocess.check_output(["git", "show", base + ":" + path])
            current = pathlib.Path(path).read_bytes()
            normalized = current
            if short == "Transform.lean":
                text = current.decode("utf-8")
                late = "                    | Option.none =>\n                        let smaller := psKernelExprV2TransformWithFuel remaining;\n                        let children := psKernelExprV2TransformChildren entry.node depth;"
                early = "  | Nat.succ remaining =>\n      fun (operation : PsKernelExprV2Transform)"
                assert text.count(late) == text.count(early) == 1
                text = text.replace(late, "                    | Option.none =>\n                        let children := psKernelExprV2TransformChildren entry.node depth;")
                text = text.replace(early, "  | Nat.succ remaining =>\n      let smaller := psKernelExprV2TransformWithFuel remaining;\n      fun (operation : PsKernelExprV2Transform)")
                text = text.replace("The recursive worker is formed only after root, memo and leaf guards require\nchild traversal. This changes closure allocation only: the original fuel,\nresult, arena and memo behavior are preserved for every input.\n", "")
                normalized = text.encode("utf-8")
            actual_blob = hashlib.sha1(b"blob " + str(len(normalized)).encode() + b"\0" + normalized).hexdigest()
            assert actual_blob == expected_blob, "normalized exact predecessor blob mismatch: " + short
            assert normalized == before, "unchanged retained bytes or reversible Transform let motion only: " + short
            assert body(normalized.decode("utf-8"), name) == body(frozen, name), "frozen reference body mismatch: " + name
            baseline_blobs[path] = blob
        paths = [prefix + short for short in pinned] + [
            str(proof_path),
            "psc1/scripts/pskernel-expr-v2-transform-delay-smoke.mjs",
            ".github/workflows/psc1-pskernel-t05-header.yml",
        ]
        audit = {
            "schema": "psc1-t08-deferred-transform-source-v1", "sourceSha": source,
            "baselineSha": base, "runId": os.environ["GITHUB_RUN_ID"],
            "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "job": os.environ["GITHUB_JOB"], "route": os.environ["PSC1_T05_ROUTE"],
            "baselineBlobs": baseline_blobs, "normalizedTransformAndRetainedBodiesMatch": True,
            "exactBindingMovesOnly": False, "productionChanges": changed,
            "productionChangePolicy": "empty-semantic-cache-plus-unary-spines-plus-lazy-transform",
