name: PSC1 T05 ordinary constructor fields native-first qualification
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t01f-string-20261022
    paths:
    - psc1/kernel-lakefile.lean
    - psc1/lean-toolchain
    - psc1/packages/pskernel-core/src/**
    - psc1/test/**
    - psc1/scripts/**
    - psc1/check-psc1-source.mjs
    - .github/workflows/psc1-pskernel-t05-header.yml
permissions:
  contents: read
jobs:
  native-header:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PSC1_T05_ROUTE: native
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      shell: bash
      run: |
        bash psc1/scripts/install-lean435-ci.sh
    - name: Verify exact source, pins, frozen references and JavaScript syntax
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-$PSC1_T05_ROUTE"
        printf 'PSC1_T05_DIR=%s\n' "$PSC1_T05_DIR" >> "$GITHUB_ENV"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(node -p 'process.versions.node.split(".")[0]')" = 22
        mkdir -p "$PSC1_T05_DIR"
        lean --version > "$PSC1_T05_DIR/lean-version.txt"
        lean --githash > "$PSC1_T05_DIR/lean-githash.txt"
        node --version > "$PSC1_T05_DIR/node-version.txt"
        printf 'PSC1_T05_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
        node --check scripts/pskernel-ordinary-header-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-params-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-result-smoke.mjs
        node --check scripts/pskernel-ordinary-constructor-fields-smoke.mjs
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, shutil
        repo = pathlib.Path.cwd().parent
        out = pathlib.Path(os.environ['PSC1_T05_DIR'])
        source = os.environ['GITHUB_SHA']
        if re.fullmatch(r'[0-9a-f]{40}',source) is None: raise RuntimeError('Missing exact source SHA')
        paths = ['.github/workflows/psc1-pskernel-t05-header.yml', 'psc1/kernel-lakefile.lean', 'psc1/lean-toolchain', 'psc1/scripts/install-lean435-ci.sh', 'psc1/packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagAdmission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeaderTypes.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryOccurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryAnnotations.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryParameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeader.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/AdmissionHelpers.lean', 'psc1/test/PsKernelOrdinaryHeaderStateProofs.lean', 'psc1/test/PsKernelOrdinaryOccurrenceProofs.lean', 'psc1/test/PsKernelCacheScopeProofs.lean', 'psc1/test/PsKernelExprV2SessionProofs.lean', 'psc1/test/PsKernelScalarHashWorkerRegression.lean', 'psc1/test/PsKernelClosedCacheAnalysisRegression.lean', 'psc1/test/PsKernelKnotFuelProofs.lean', 'psc1/test/PsKernelOrdinaryHeaderRegression.lean', 'psc1/scripts/pskernel-ordinary-header-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-short-entry-smoke.mjs', 'psc1/scripts/pskernel-closed-cache-analysis-smoke.mjs', 'psc1/scripts/pskernel-generated-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-dag-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs', 'psc1/scripts/pskernel-invalid-recursor-occurrence-smoke.mjs', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorParams.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorResult.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean', 'psc1/test/PsKernelExprV2MetadataProofs.lean', 'psc1/test/PsKernelExprV2PagedModelProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorParamsProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorResultProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorParamsRegression.lean', 'psc1/test/PsKernelOrdinaryConstructorResultRegression.lean', 'psc1/scripts/pskernel-ordinary-constructor-params-smoke.mjs', 'psc1/scripts/pskernel-ordinary-constructor-result-smoke.mjs', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorTypes.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryRecursiveArgument.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorFields.lean', 'psc1/test/PsKernelOrdinaryRecursiveArgumentProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorFieldsProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorFieldsRegression.lean', 'psc1/scripts/pskernel-ordinary-constructor-fields-smoke.mjs']
        frozen = {'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean': '63b3f93af8d1352037d40bbdc793471c3f2f3d80321ad24c680a3a897c402c05', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean': '7506663960991724551ae8af806996304a5e196db275fb22e168639028b803a3', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean': 'cc160e7cca9436170b64f845b393d0e8aa631ffb9ce61a74c0bedccb9587e9b0', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean': '068312a568ee3b1b86312d9a9e589a32813e45cf703d0830108efc1556666e51', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean': '8bd99c203b50315d0e58ba4aebb1cebec7d0331db330163fef341bfe713d9145', 'psc1/test/PsKernelExprV2MetadataProofs.lean': '5c5e14cbdf9aa890640d3dfeb69dcda651aab7cbbfb9da527e500e48daaf1d20'}
        records = []
        for name in paths:
            raw = (repo/name).read_bytes()
            record = {'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                      'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            if name in frozen and record['sha256'] != frozen[name]:
                raise RuntimeError('Frozen V1 reference changed: '+name)
            target = out/'sources'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(raw)
            records.append(record)
        report = {'schema':'psc1-t05-header-source-inventory-v1','repository':'dwijayuda/pskernel',
                  'sourceSha':source,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'job':os.environ['GITHUB_JOB'],'route':os.environ['PSC1_T05_ROUTE'],
                  'leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc','files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_SOURCE_INVENTORY '+json.dumps(report,separators=(',',':')))
        PY
    - name: Build native production imports and retained DAG executable
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelCore PsKernelClosedCacheAnalysisProofs psc1_kernel_expr_v2_dag_regression \
          2>&1 | tee "$PSC1_T05_DIR/native-build.log"
    - name: Kernel-check the new constructor field and recursive-argument equations before regressions
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_t05_field_proofs_failed=0
        : > "$PSC1_T05_DIR/fields-proof-status.log"
        for PSC1_T05_SPEC in \
          'PsKernelOrdinaryRecursiveArgumentProofs:24:recursive-argument-proofs.log' \
          'PsKernelOrdinaryConstructorFieldsProofs:23:constructor-fields-proofs.log'; do
          IFS=: read -r PSC1_T05_MODULE PSC1_T05_COUNT PSC1_T05_LOG <<< "$PSC1_T05_SPEC"
          psc1_t05_count_status=0
          psc1_t05_lean_status=0
          test "$(grep -c '^#print axioms ' "test/$PSC1_T05_MODULE.lean")" -eq "$PSC1_T05_COUNT" \
            || psc1_t05_count_status=$?
          lake -f kernel-lakefile.lean env lean "test/$PSC1_T05_MODULE.lean" \
            2>&1 | tee "$PSC1_T05_DIR/$PSC1_T05_LOG" || psc1_t05_lean_status=$?
          printf 'PSC1_T05_FIELDS_PROOF_STATUS module=%s count=%s countStatus=%s leanStatus=%s\n' \
            "$PSC1_T05_MODULE" "$PSC1_T05_COUNT" "$psc1_t05_count_status" "$psc1_t05_lean_status" \
            | tee -a "$PSC1_T05_DIR/fields-proof-status.log"
          if [ "$psc1_t05_count_status" -ne 0 ] || [ "$psc1_t05_lean_status" -ne 0 ]; then
            psc1_t05_field_proofs_failed=1
          fi
        done
        test "$psc1_t05_field_proofs_failed" -eq 0
    - name: Kernel-check all64 new header and structural equations first
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_t05_state_count_status=0
        psc1_t05_state_lean_status=0
        psc1_t05_occurrence_count_status=0
        psc1_t05_occurrence_lean_status=0
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryHeaderStateProofs.lean)" -eq 49 \
          || psc1_t05_state_count_status=$?
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryHeaderStateProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/header-state-proofs.log" \
          || psc1_t05_state_lean_status=$?
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryOccurrenceProofs.lean)" -eq 15 \
          || psc1_t05_occurrence_count_status=$?
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryOccurrenceProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/occurrence-proofs.log" \
          || psc1_t05_occurrence_lean_status=$?
        printf 'PSC1_T05_NEW_PROOF_RESULTS stateCount=%s stateLean=%s occurrenceCount=%s occurrenceLean=%s\n' \
          "$psc1_t05_state_count_status" "$psc1_t05_state_lean_status" \
          "$psc1_t05_occurrence_count_status" "$psc1_t05_occurrence_lean_status" \
          | tee "$PSC1_T05_DIR/new-header-proof-status.log"
        if [ "$psc1_t05_state_count_status" -ne 0 ] || [ "$psc1_t05_state_lean_status" -ne 0 ] \
          || [ "$psc1_t05_occurrence_count_status" -ne 0 ] || [ "$psc1_t05_occurrence_lean_status" -ne 0 ]; then
          exit 1
        fi
    - name: Build native-only occurrence and metadata import dependencies
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelOrdinaryHeaderProofs PsKernelExprV2MetadataNativeProofs \
          2>&1 | tee "$PSC1_T05_DIR/constructor-proof-imports.log"
        test -s .lake/build/lib/lean/PsKernelOrdinaryOccurrenceProofs.olean
        test -s .lake/build/lib/lean/PsKernelExprV2MetadataProofs.olean
    - name: Kernel-check50 new constructor and storage equations plus8 unchanged metadata reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_t05_extra_proofs_failed=0
        : > "$PSC1_T05_DIR/constructor-proof-status.log"
        for PSC1_T05_SPEC in \
          'PsKernelExprV2MetadataProofs:8:metadata-proofs.log' \
          'PsKernelExprV2PagedModelProofs:17:paged-model-proofs.log' \
          'PsKernelOrdinaryConstructorParamsProofs:17:constructor-params-proofs.log' \
          'PsKernelOrdinaryConstructorResultProofs:16:constructor-result-proofs.log'; do
          IFS=: read -r PSC1_T05_MODULE PSC1_T05_COUNT PSC1_T05_LOG <<< "$PSC1_T05_SPEC"
          psc1_t05_count_status=0
          psc1_t05_lean_status=0
          test "$(grep -c '^#print axioms ' "test/$PSC1_T05_MODULE.lean")" -eq "$PSC1_T05_COUNT" \
            || psc1_t05_count_status=$?
          lake -f kernel-lakefile.lean env lean "test/$PSC1_T05_MODULE.lean" \
            2>&1 | tee "$PSC1_T05_DIR/$PSC1_T05_LOG" || psc1_t05_lean_status=$?
          printf 'PSC1_T05_CONSTRUCTOR_PROOF_STATUS module=%s count=%s countStatus=%s leanStatus=%s\n' \
            "$PSC1_T05_MODULE" "$PSC1_T05_COUNT" "$psc1_t05_count_status" "$psc1_t05_lean_status" \
            | tee -a "$PSC1_T05_DIR/constructor-proof-status.log"
          if [ "$psc1_t05_count_status" -ne 0 ] || [ "$psc1_t05_lean_status" -ne 0 ]; then
            psc1_t05_extra_proofs_failed=1
          fi
        done
        test "$psc1_t05_extra_proofs_failed" -eq 0
    - name: Run direct native header matrix and official Lean controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryHeaderRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_NATIVE: PASS matrix=432 positiveDirect=10 crossFault=2 headerOnly=true' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_OCCURRENCE_NATIVE: PASS heads=171 fuelCases=1026 wrappers=171 sharedOffsets=2' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_ANNOTATIONS_NATIVE: PASS fuelCases=75 wrappers=15 invalidIDs=2' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_STATE_NATIVE: PASS sequences=3 propagated=24 forkFields=all boundaries=3' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_ORACLE: PASS accepted=4 rejected=2 headerOnly=true' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_REGRESSION: PASS headerOnly=true fullAdmission=false' "$PSC1_T05_DIR/header-native.log"
    - name: Run exact native constructor-parameter protocol controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryConstructorParamsRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/constructor-params-native.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        raw=(root/'constructor-params-native.log').read_bytes();lines=raw.decode().splitlines()
        groups=[
            ('direct',227,'PSC1_ORDINARY_CONSTRUCTOR_PARAMS_V1_NATIVE: PASS comparisons=216 directSuccess=11 assertions=227'),
            ('owner',21,'PSC1_ORDINARY_CONSTRUCTOR_PARAMS_OWNER_NATIVE: PASS ownerFields=10 callbacks=3 propagated=9 assertions=21'),
            ('boundaries',28,'PSC1_ORDINARY_CONSTRUCTOR_PARAMS_BOUNDARY_NATIVE: PASS boundaries=17 nonForall=11 assertions=28'),
            ('faults',8,'PSC1_ORDINARY_CONSTRUCTOR_PARAMS_FAULT_NATIVE: PASS injectedBrokenOwners=8 assertions=8')]
        final='PSC1_ORDINARY_CONSTRUCTOR_PARAMS_REGRESSION: PASS assertions=284 directSuccess=11 prefixOnly=true fullAdmission=false'
        prefix='PSC1_ORDINARY_CONSTRUCTOR_PARAMS_ASSERT '
        labels=[line[len(prefix):] for line in lines if line.startswith(prefix)]
        if len(labels)!=284 or any(not label for label in labels):
            raise RuntimeError('Exactly284executednativeParamsassertionsrequired')
        previous=-1
        for name,count,marker in groups:
            if lines.count(marker)!=1:raise RuntimeError('Exact native Params group marker required: '+name)
            end=lines.index(marker)
            if end<=previous or sum(line.startswith(prefix) for line in lines[previous+1:end])!=count:
                raise RuntimeError('Ordered native Params group assertion count: '+name)
            previous=end
        if lines.count(final)!=1 or lines.index(final)<=previous:
            raise RuntimeError('Exact final native Params marker required')
        report={'schema':'psc1-t05-constructor-params-native-inventory-v1',
            'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native',
            'assertions':284,'groupAssertions':{name:count for name,count,_ in groups},
            'directSuccess':11,'assertionLabels':labels,
            'logSha256':hashlib.sha256(raw).hexdigest(),'prefixOnly':True,'fullAdmission':False}
        (root/'constructor-params-native-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_CONSTRUCTOR_PARAMS_NATIVE_INVENTORY: PASS assertions=284 groups=4')
        PY
    - name: Run exact432 native constructor-result structural assertions
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryConstructorResultRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/constructor-result-native.log"
        grep -Fqx 'PSC1_ORDINARY_CONSTRUCTOR_RESULT_NATIVE: PASS assertions=432 selectorRows=46 occurrenceTerms=30 targets=2 fullAdmission=false' "$PSC1_T05_DIR/constructor-result-native.log"
        grep -Fqx 'PSC1_ORDINARY_CONSTRUCTOR_RESULT_SECTIONS: PASS harness=1 selector=138 consumer=26 occurrence=240 bounds=16 indexLists=7 precedence=4' "$PSC1_T05_DIR/constructor-result-native.log"
    - name: Run exact268 native constructor field and recursive-argument assertions
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryConstructorFieldsRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/constructor-fields-native.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        root=pathlib.Path(os.environ['PSC1_T05_DIR']);raw=(root/'constructor-fields-native.log').read_bytes()
        lines=raw.decode().splitlines();prefix='PSC1_CONSTRUCTOR_FIELDS_ASSERT '
        labels=[line[len(prefix):] for line in lines if line.startswith(prefix)]
        groups=[('harness',1),('fields',147),('recursive',105),('boundaries',8),('recursorGuard',7)]
        if len(labels)!=268 or len(set(labels))!=268:raise RuntimeError('268 unique native field labels required')
        previous=-1
        for group,count in groups:
            marker='PSC1_CONSTRUCTOR_FIELDS_SECTION '+group+'='+str(count)
            if lines.count(marker)!=1:raise RuntimeError('Exact native field group marker required: '+group)
            end=lines.index(marker)
            group_labels=[line[len(prefix):] for line in lines[previous+1:end] if line.startswith(prefix)]
            if len(group_labels)!=count or not all(label.startswith(group+'/') for label in group_labels):
                raise RuntimeError('Ordered exact native field group required: '+group)
            previous=end
        markers=['PSC1_ORDINARY_CONSTRUCTOR_FIELDS_NATIVE: PASS assertions=268 fieldRows=21 recursiveRows=15 fuelValues=6 fullAdmission=false',
                 'PSC1_ORDINARY_CONSTRUCTOR_FIELDS_NATIVE_SECTIONS: PASS harness=1 fields=147 recursive=105 boundaries=8 recursorGuard=7']
        if any(lines.count(marker)!=1 or lines.index(marker)<=previous for marker in markers):
            raise RuntimeError('Native fields final markers required')
        report={'schema':'psc1-t05-fields-native-inventory-v1',
                'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native',
                'assertions':268,'sectionAssertions':dict(groups),'fieldRows':21,'recursiveRows':15,'fuelValues':6,
                'assertionLabels':labels,'logSha256':hashlib.sha256(raw).hexdigest(),
                'fullAdmission':False,'publicRoutingChanged':False}
        (root/'fields-native-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_FIELDS_NATIVE_INVENTORY: PASS assertions=268 groups=5')
        PY
    - name: Retain108 previous equations and audit all172 exact axiom reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        test "$(grep -c '^#print axioms ' test/PsKernelCacheScopeProofs.lean)" -eq 60
        lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/cache-scope-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelExprV2SessionProofs.lean)" -eq 14
        lake -f kernel-lakefile.lean env lean test/PsKernelExprV2SessionProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/session-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelScalarHashWorkerRegression.lean)" -eq 11
        lake -f kernel-lakefile.lean env lean --run test/PsKernelScalarHashWorkerRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/scalar-hash-native.log"
        test "$(grep -c '^#print axioms ' test/PsKernelClosedCacheAnalysisRegression.lean)" -eq 7
        lake -f kernel-lakefile.lean env lean test/PsKernelClosedCacheAnalysisRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/closed-cache-analysis-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelKnotFuelProofs.lean)" -eq 16
        lake -f kernel-lakefile.lean env lean test/PsKernelKnotFuelProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/knot-fuel-proofs.log"
        grep -Fqx 'PSC1_SCALAR_HASH_WORKER_NATIVE: PASS cases=2730 strings=12' "$PSC1_T05_DIR/scalar-hash-native.log"
        grep -Fqx 'PSC1_SCALAR_HASH_LONG_NATIVE: PASS cases=3' "$PSC1_T05_DIR/scalar-hash-native.log"
        grep -Fqx 'PSKERNEL_KNOT_FUEL_PROOFS: PASS workers=15' "$PSC1_T05_DIR/knot-fuel-proofs.log"
        grep -Fqx 'PSKERNEL_WHNFCACHE_MODE_PROOFS: PASS allModes=correctedEager fullMode=historical' "$PSC1_T05_DIR/knot-fuel-proofs.log"
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re
        root = pathlib.Path(os.environ['PSC1_T05_DIR'])
