rdinaryConstructorParams.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorResult.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Constructor.lean', 'psc1/test/PsKernelExprV2MetadataProofs.lean', 'psc1/test/PsKernelExprV2PagedModelProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorParamsProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorResultProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorParamsRegression.lean', 'psc1/test/PsKernelOrdinaryConstructorResultRegression.lean', 'psc1/scripts/pskernel-ordinary-constructor-params-smoke.mjs', 'psc1/scripts/pskernel-ordinary-constructor-result-smoke.mjs', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorTypes.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryRecursiveArgument.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryConstructorFields.lean', 'psc1/test/PsKernelOrdinaryRecursiveArgumentProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorFieldsProofs.lean', 'psc1/test/PsKernelOrdinaryConstructorFieldsRegression.lean', 'psc1/scripts/pskernel-ordinary-constructor-fields-smoke.mjs']
