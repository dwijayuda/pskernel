        python3 - <<'PY' | tee "$RUNNER_TEMP/psc1-closed-cache-analysis-codegen.log"
        import pathlib, re
        text = pathlib.Path('dist/expr-v2/scalar-hash/kernel.js').read_text()
        def implementations(prefix):
            return re.findall(r'^export function (' + prefix + r'[A-Za-z0-9_$]*)\(', text, re.M)
        def body_of(name):
            marker = 'function* __ps$impl$' + name + '('
            if marker not in text: marker = 'export function ' + name + '('
            start = text.index(marker)
            end = text.find('\nexport ', start + len(marker))
