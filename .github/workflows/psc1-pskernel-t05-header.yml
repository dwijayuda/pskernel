                require(digest(root/log_name)==expected_digest,'retained log unchanged: '+log_name)
            previous=name
        require(retained['result']['assertions']==23 and retained['result']['exports']==3
                and retained['result']['stagedArrows']==11,'all retained raw transform controls')
        require(retained['retainedLiftAndCountSourceBytesMatch'] is True
                and retained['liftAndCountWorkersDeferred'] is False,'retained Lift and Count worker construction remains unchanged')
        expected_labels=['harness/rejection']+['empty/'+str(i).zfill(2) for i in range(20)]
        log=root/'empty-semantic-cache.log';lines=log.read_text().splitlines()
        prefix='PSC1_EMPTY_SEMANTIC_CACHE_ASSERT ';marker='PSC1_EMPTY_SEMANTIC_CACHE_JS: PASS '
        labels=[line[len(prefix):] for line in lines if line.startswith(prefix)]
        require(labels==expected_labels and len(set(labels))==21,'all21 exact ordered executed assertions')
        expected_lines=[prefix+expected_labels[0],'PSC1_EMPTY_SEMANTIC_CACHE_SECTION harness=1']
        expected_lines += [prefix+label for label in expected_labels[1:]]
        expected_lines += ['PSC1_EMPTY_SEMANTIC_CACHE_SECTION empty=20']
        require(len(lines)==24 and lines[:-1]==expected_lines and lines[-1].startswith(marker),
                'exact24-line cold-cache runtime transcript')
        result=json.loads(lines[-1][len(marker):])
        expected_result={'schema':'psc1-empty-semantic-cache-v1','assertions':21,
                         'sectionAssertions':{'harness':1,'empty':20},'coldQueries':20,
                         'actualGeneratedConstructors':True,'inputsUnchanged':True,
                         'helperOnly':True,'fullKernel':False,'performanceQualified':False}
        require(exact(result,expected_result),'exact cold-cache runtime result')
        measurement=(root/'empty-semantic-cache.memory').read_text().strip()
        timed=re.fullmatch(r'peak_rss_kib=(\d+) wall_seconds=(\d+(?:\.\d+)?) exit_status=0',measurement)
        require(timed is not None and float(timed[2])<1500,'runtime exit0 within unchanged25-minute cap')
        receipt={'schema':'psc1-t09-empty-semantic-cache-route-receipt-v1','status':'pass','identity':provenance,
                 'retainedDeferredReceipt':digest(root/'deferred-transform-receipt.json'),
                 'result':result,'assertionLabels':labels,'log':digest(log),'harness':digest(harness),
                 'measurement':measurement,'peakRssKiB':int(timed[1]),'wallSeconds':float(timed[2]),
                 'logs':{p.name:digest(p) for p in sorted(root.glob('*.log'))},
                 'emptySemanticCacheHelperOnly':True,'retainedLiftAndCountSourceBytesMatch':True,
                 'liftAndCountWorkersDeferred':False,'fullKernel':False,'performanceQualified':False}
        (root/'empty-semantic-cache-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T09_EMPTY_SEMANTIC_CACHE_ROUTE: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Download the exact same-run native proof inventory
      uses: actions/download-artifact@v4
      with:
        name: psc1-t05-header-native-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/validator-native
    - name: Bind the complete generated route to all 532 native reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/pskernel-validator-qualification.py route .. "$PSC1_T05_DIR" "$RUNNER_TEMP/validator-native"
    - name: Qualify generated unary controls and original Church admission at4096
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/pskernel-unary-spine-qualification.py route --out "$PSC1_T05_DIR/unary" \
          --native-root "$RUNNER_TEMP/validator-native" --node "$PSC1_T05_NODE"
        python3 scripts/pskernel-transform-lazy-qualification.py route "$PSC1_T05_DIR/lazy" "$RUNNER_TEMP/validator-native"
    - name: Retain bounded gate artifacts on success or failure
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$PSC1_T05_DIR/bounded"
        for PSC1_T05_FILE in "$RUNNER_TEMP/psc1-scalar-hash-probe.log" "$RUNNER_TEMP/psc1-closed-cache-analysis-probe.log" "$RUNNER_TEMP/psc1-closed-cache-analysis-codegen.log"; do
          if [ -f "$PSC1_T05_FILE" ]; then cp "$PSC1_T05_FILE" "$PSC1_T05_DIR/bounded/"; fi
        done
        if [ -d dist/expr-v2/scalar-hash ]; then cp -R dist/expr-v2/scalar-hash/. "$PSC1_T05_DIR/bounded/"; fi
      if: always()
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-t05-header-${{ matrix.route }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/psc1-t05-${{ matrix.route }}/
        if-no-files-found: error
        include-hidden-files: true
