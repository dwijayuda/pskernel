      timeout-minutes: 25
    - name: Execute both exact constructor matrices with empty PATH and bind their receipts
      working-directory: psc1
      shell: bash
      timeout-minutes: 25
      run: |
        set -euo pipefail
        cd "$PSC1_T05_DIR/detached"
        /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
          -o "$PSC1_T05_DIR/constructor-params.memory" \
          env PATH="" "$PSC1_T05_NODE" --max-old-space-size=2048 \
          pskernel-ordinary-constructor-params-smoke.mjs kernel.mjs \
          2>&1 | tee "$PSC1_T05_DIR/constructor-params.log"
        cat "$PSC1_T05_DIR/constructor-params.memory"
        /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
          -o "$PSC1_T05_DIR/constructor-result.memory" \
          env PATH="" "$PSC1_T05_NODE" --max-old-space-size=2048 \
          pskernel-ordinary-constructor-result-smoke.mjs kernel.mjs \
          2>&1 | tee "$PSC1_T05_DIR/constructor-result.log"
        cat "$PSC1_T05_DIR/constructor-result.memory"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        def digest(path):
            raw=path.read_bytes();return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        def exact(a,b):
            if type(a) is not type(b):return False
            if isinstance(a,dict):return a.keys()==b.keys() and all(exact(a[k],b[k]) for k in a)
            return a==b
        provenance=json.loads((root/'provenance.json').read_text())
        header=json.loads((root/'receipt.json').read_text())
        identity={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                  'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':os.environ['PSC1_T05_ROUTE']}
        for key,value in identity.items():
            if provenance[key]!=value or header['identity'][key]!=value:
                raise RuntimeError('Constructor receipt identity mismatch: '+key)
        if header['status']!='pass' or header['result']['assertions']!=1992:
            raise RuntimeError('Existing1992headergateisrequired')
        if digest(root/'detached/kernel.mjs')!=provenance['kernel']:
            raise RuntimeError('Executed generated kernel changed')
        expected_result={'schema':'psc1-ordinary-constructor-result-v1',
            'kernel':str((root/'detached/kernel.mjs').resolve()),'assertions':432,
            'sectionAssertions':{'harness':1,'selector':138,'consumer':26,'occurrence':240,
                                 'bounds':16,'indexLists':7,'precedence':4},
            'selectorRows':46,'occurrenceTerms':30,'targetsPerOccurrence':2,
            'fullAdmission':False,'publicRoutingChanged':False}
        expected_params={'schema':'psc1-ordinary-constructor-params-v1',
            'kernel':str((root/'detached/kernel.mjs').resolve()),'assertions':268,
            'sectionAssertions':{'harness':1,'direct':227,'protocol':20,'boundaries':14,'faults':6},
            'directFixtures':18,'fuelValues':6,'interfaces':2,'directComparisons':216,'positiveDirect':11,
            'fullAdmission':False,'publicRoutingChanged':False}
        params_marker='PSC1_ORDINARY_CONSTRUCTOR_PARAMS_JS: PASS assertions=268 fullAdmission=false'
        specs=[('params',expected_params,params_marker),
               ('result',expected_result,'PSC1_ORDINARY_CONSTRUCTOR_RESULT_JS: PASS assertions=432 fullAdmission=false')]
        results={}
        for name,expected,marker in specs:
            log=root/('constructor-'+name+'.log');lines=log.read_text().splitlines()
            if lines.count(marker)!=1:raise RuntimeError('Missing exact constructor PASS marker: '+name)
            records=[]
            for line in lines:
                if line.startswith('{'):
                    value=json.loads(line)
                    if value.get('schema')==expected['schema']:records.append(value)
            if len(records)!=1 or not exact(records[0],expected):
                raise RuntimeError('Exact constructor matrix and section counts required: '+name)
            if sum(expected['sectionAssertions'].values())!=expected['assertions']:
                raise RuntimeError('Constructor section totals do not reconcile: '+name)
            harness='pskernel-ordinary-constructor-'+name+'-smoke.mjs'
            if digest(root/'detached'/harness)!=provenance['scripts'][harness]:
                raise RuntimeError('Executed constructor harness changed: '+name)
            measurement=(root/('constructor-'+name+'.memory')).read_text().strip()
            timed=re.fullmatch(r'peak_rss_kib=(\d+) wall_seconds=(\d+(?:\.\d+)?) exit_status=0',measurement)
            if timed is None or float(timed[2])>=1500:
                raise RuntimeError('Constructor runtime must exit0within25minutes: '+name)
            results[name]={'result':records[0],'log':digest(log),'harness':digest(root/'detached'/harness),
                           'measurement':measurement,'peakRssKiB':int(timed[1]),'wallSeconds':float(timed[2])}
        receipt={'schema':'psc1-t05-constructor-route-receipt-v1','status':'pass','identity':provenance,
                 'retainedHeaderReceipt':digest(root/'receipt.json'),'retainedHeaderAssertions':1992,
                 'results':results,'logs':{p.name:digest(p) for p in sorted(root.glob('*.log'))},
                 'headerOnly':False,'constructorHelpersOnly':True,'fullAdmission':False,
                 'publicRoutingChanged':False,'performanceQualified':False}
        (root/'constructor-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_CONSTRUCTOR_ROUTE: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Execute exact constructor fields and positivity matrix with empty PATH
