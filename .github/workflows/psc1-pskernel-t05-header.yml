name: PSC1 T05 ordinary header native-first preflight
on:
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t01f-string-20261022
    paths:
    - psc1/kernel-lakefile.lean
    - psc1/lean-toolchain
    - psc1/packages/pskernel-core/src/**
    - psc1/test/**
    - psc1/scripts/**
    - psc1/check-psc1-source.mjs
    - .github/workflows/psc1-pskernel-t05-header.yml
permissions:
  contents: read
jobs:
  native-header:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PSC1_T05_ROUTE: native
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      shell: bash
      run: |
        bash psc1/scripts/install-lean435-ci.sh
    - name: Verify exact source, pins, frozen references and JavaScript syntax
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-$PSC1_T05_ROUTE"
        printf 'PSC1_T05_DIR=%s\n' "$PSC1_T05_DIR" >> "$GITHUB_ENV"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(node -p 'process.versions.node.split(".")[0]')" = 22
        mkdir -p "$PSC1_T05_DIR"
        lean --version > "$PSC1_T05_DIR/lean-version.txt"
        lean --githash > "$PSC1_T05_DIR/lean-githash.txt"
        node --version > "$PSC1_T05_DIR/node-version.txt"
        printf 'PSC1_T05_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
        node --check scripts/pskernel-ordinary-header-smoke.mjs
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, shutil
        repo = pathlib.Path.cwd().parent
        out = pathlib.Path(os.environ['PSC1_T05_DIR'])
        source = os.environ['GITHUB_SHA']
        if re.fullmatch(r'[0-9a-f]{40}',source) is None: raise RuntimeError('Missing exact source SHA')
        paths = ['.github/workflows/psc1-pskernel-t05-header.yml', 'psc1/kernel-lakefile.lean', 'psc1/lean-toolchain', 'psc1/scripts/install-lean435-ci.sh', 'psc1/packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagAdmission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeaderTypes.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryOccurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryAnnotations.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryParameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeader.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/AdmissionHelpers.lean', 'psc1/test/PsKernelOrdinaryHeaderStateProofs.lean', 'psc1/test/PsKernelOrdinaryOccurrenceProofs.lean', 'psc1/test/PsKernelCacheScopeProofs.lean', 'psc1/test/PsKernelExprV2SessionProofs.lean', 'psc1/test/PsKernelScalarHashWorkerRegression.lean', 'psc1/test/PsKernelClosedCacheAnalysisRegression.lean', 'psc1/test/PsKernelKnotFuelProofs.lean', 'psc1/test/PsKernelOrdinaryHeaderRegression.lean', 'psc1/scripts/pskernel-ordinary-header-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-short-entry-smoke.mjs', 'psc1/scripts/pskernel-closed-cache-analysis-smoke.mjs', 'psc1/scripts/pskernel-generated-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-dag-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs', 'psc1/scripts/pskernel-invalid-recursor-occurrence-smoke.mjs', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean']
        frozen = {'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean': '63b3f93af8d1352037d40bbdc793471c3f2f3d80321ad24c680a3a897c402c05', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean': '7506663960991724551ae8af806996304a5e196db275fb22e168639028b803a3', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean': 'cc160e7cca9436170b64f845b393d0e8aa631ffb9ce61a74c0bedccb9587e9b0', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean': '068312a568ee3b1b86312d9a9e589a32813e45cf703d0830108efc1556666e51'}
        records = []
        for name in paths:
            raw = (repo/name).read_bytes()
            record = {'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                      'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            if name in frozen and record['sha256'] != frozen[name]:
                raise RuntimeError('Frozen V1 reference changed: '+name)
            target = out/'sources'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(raw)
            records.append(record)
        report = {'schema':'psc1-t05-header-source-inventory-v1','repository':'dwijayuda/pskernel',
                  'sourceSha':source,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'job':os.environ['GITHUB_JOB'],'route':os.environ['PSC1_T05_ROUTE'],
                  'leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc','files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_SOURCE_INVENTORY '+json.dumps(report,separators=(',',':')))
        PY
    - name: Build native production imports and retained DAG executable
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelCore PsKernelClosedCacheAnalysisProofs psc1_kernel_expr_v2_dag_regression \
          2>&1 | tee "$PSC1_T05_DIR/native-build.log"
    - name: Kernel-check all64 new header and structural equations first
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryHeaderStateProofs.lean)" -eq 49
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryHeaderStateProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/header-state-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryOccurrenceProofs.lean)" -eq 15
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryOccurrenceProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/occurrence-proofs.log"
    - name: Run direct native header matrix and official Lean controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryHeaderRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_NATIVE: PASS matrix=432 positiveDirect=10 crossFault=2 headerOnly=true' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_OCCURRENCE_NATIVE: PASS heads=171 fuelCases=1026 wrappers=171 sharedOffsets=2' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_ANNOTATIONS_NATIVE: PASS fuelCases=75 wrappers=15 invalidIDs=2' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_STATE_NATIVE: PASS sequences=3 propagated=24 forkFields=all boundaries=3' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_ORACLE: PASS accepted=4 rejected=2 headerOnly=true' "$PSC1_T05_DIR/header-native.log"
        grep -Fqx 'PSC1_ORDINARY_HEADER_REGRESSION: PASS headerOnly=true fullAdmission=false' "$PSC1_T05_DIR/header-native.log"
    - name: Retain108 previous equations and audit all172 exact axiom reports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        test "$(grep -c '^#print axioms ' test/PsKernelCacheScopeProofs.lean)" -eq 60
        lake -f kernel-lakefile.lean env lean test/PsKernelCacheScopeProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/cache-scope-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelExprV2SessionProofs.lean)" -eq 14
        lake -f kernel-lakefile.lean env lean test/PsKernelExprV2SessionProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/session-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelScalarHashWorkerRegression.lean)" -eq 11
        lake -f kernel-lakefile.lean env lean --run test/PsKernelScalarHashWorkerRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/scalar-hash-native.log"
        test "$(grep -c '^#print axioms ' test/PsKernelClosedCacheAnalysisRegression.lean)" -eq 7
        lake -f kernel-lakefile.lean env lean test/PsKernelClosedCacheAnalysisRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/closed-cache-analysis-proofs.log"
        test "$(grep -c '^#print axioms ' test/PsKernelKnotFuelProofs.lean)" -eq 16
        lake -f kernel-lakefile.lean env lean test/PsKernelKnotFuelProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/knot-fuel-proofs.log"
        grep -Fqx 'PSC1_SCALAR_HASH_WORKER_NATIVE: PASS cases=2730 strings=12' "$PSC1_T05_DIR/scalar-hash-native.log"
        grep -Fqx 'PSC1_SCALAR_HASH_LONG_NATIVE: PASS cases=3' "$PSC1_T05_DIR/scalar-hash-native.log"
        grep -Fqx 'PSKERNEL_KNOT_FUEL_PROOFS: PASS workers=15' "$PSC1_T05_DIR/knot-fuel-proofs.log"
        grep -Fqx 'PSKERNEL_WHNFCACHE_MODE_PROOFS: PASS allModes=correctedEager fullMode=historical' "$PSC1_T05_DIR/knot-fuel-proofs.log"
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re
        root = pathlib.Path(os.environ['PSC1_T05_DIR'])
        expected = [('PsKernelOrdinaryHeaderStateProofs', 49, 'header-state-proofs.log', False), ('PsKernelOrdinaryOccurrenceProofs', 15, 'occurrence-proofs.log', False), ('PsKernelCacheScopeProofs', 60, 'cache-scope-proofs.log', False), ('PsKernelExprV2SessionProofs', 14, 'session-proofs.log', False), ('PsKernelScalarHashWorkerRegression', 11, 'scalar-hash-native.log', True), ('PsKernelClosedCacheAnalysisRegression', 7, 'closed-cache-analysis-proofs.log', False), ('PsKernelKnotFuelProofs', 16, 'knot-fuel-proofs.log', False)]
        allowed = {'propext','Classical.choice','Quot.sound'}
        audits = []
        for module,count,filename,_ in expected:
            source = pathlib.Path('test')/(module+'.lean')
            names = re.findall(r'^#print axioms ([A-Za-z0-9_.$]+)\s*$',source.read_text(),re.M)
            names = [name if '.' in name else module+'.'+name for name in names]
            if len(names)!=count or len(set(names))!=count: raise RuntimeError('Exact unique source proof inventory: '+module)
            log = (root/filename).read_text()
            reports = re.findall(r"'([^']+)' (?:does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])",log)
            if [name for name,_ in reports]!=names: raise RuntimeError('Ordered exact proof reports: '+module)
            if any(bad in log for bad in ('sorryAx','Lean.ofReduceBool','Lean.trustCompiler')):
                raise RuntimeError('Forbidden proof dependency: '+module)
            for name,axioms in reports:
                used = {axiom.strip() for axiom in axioms.split(',') if axiom.strip()}
                if not used<=allowed: raise RuntimeError('Unexpected axiom dependency: '+name)
            audits.append({'module':module,'proofs':count,'names':names,'logSha256':hashlib.sha256((root/filename).read_bytes()).hexdigest()})
        if sum(x['proofs'] for x in audits)!=172: raise RuntimeError('Expected64new+108retained')
        inventory=json.loads((root/'source-inventory.json').read_text())
        receipt={'schema':'psc1-t05-header-native-receipt-v1','sourceSha':inventory['sourceSha'],
                 'runId':inventory['runId'],'runAttempt':inventory['runAttempt'],'job':inventory['job'],'route':'native',
                 'newProofs':64,'retainedProofs':108,'totalProofs':172,'orderedUniqueReports':True,
                 'allowedStandardAxiomsOnly':True,'proofs':audits,'headerOnly':True,'fullAdmission':False}
        (root/'native-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_HEADER_NATIVE_PROOFS: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Retain native public DAG and generated-prefix ownership controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        .lake/build/bin/psc1_kernel_expr_v2_dag_regression \
          2>&1 | tee "$PSC1_T05_DIR/dag-native.log" | sed '/^PSC1_DAG_PASS /d'
        grep -Fq 'PSC1_V2_DAG_REGRESSION: PASS' "$PSC1_T05_DIR/dag-native.log"
        lake -f kernel-lakefile.lean env lean --run test/PsKernelExprV2GeneratedPrefixRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/prefix-native.log"
        grep -Fqx 'PSC1_V2_GENERATED_PREFIX: PASS new=24 recursors=7 direct=6 privateIDs=3' "$PSC1_T05_DIR/prefix-native.log"
        grep -Fqx 'PSC1_V2_GENERATED_PREFIX_OFFICIAL: PASS families=5 positive=6 negative=7' "$PSC1_T05_DIR/prefix-native.log"
        grep -Fqx 'PSC1_V2_SESSION_OWNERS: PASS kinds=8 direct=7 privateIDs=5 forks=2' "$PSC1_T05_DIR/prefix-native.log"
        grep -Fqx 'PSC1_V2_SESSION_OWNERS_OFFICIAL: PASS declarations=4 direct=7' "$PSC1_T05_DIR/prefix-native.log"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-t05-header-native-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/psc1-t05-native/
        if-no-files-found: error
  generated-header:
    needs:
    - native-header
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        route:
        - generated
        - canonical
    env:
      PSC1_T05_ROUTE: ${{ matrix.route }}
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      shell: bash
      run: |
        bash psc1/scripts/install-lean435-ci.sh
    - name: Verify exact route source, pins, frozen references and syntax
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-$PSC1_T05_ROUTE"
        printf 'PSC1_T05_DIR=%s\n' "$PSC1_T05_DIR" >> "$GITHUB_ENV"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(node -p 'process.versions.node.split(".")[0]')" = 22
        mkdir -p "$PSC1_T05_DIR"
        lean --version > "$PSC1_T05_DIR/lean-version.txt"
        lean --githash > "$PSC1_T05_DIR/lean-githash.txt"
        node --version > "$PSC1_T05_DIR/node-version.txt"
        printf 'PSC1_T05_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
        node --check scripts/pskernel-ordinary-header-smoke.mjs
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, shutil
        repo = pathlib.Path.cwd().parent
        out = pathlib.Path(os.environ['PSC1_T05_DIR'])
        source = os.environ['GITHUB_SHA']
        if re.fullmatch(r'[0-9a-f]{40}',source) is None: raise RuntimeError('Missing exact source SHA')
        paths = ['.github/workflows/psc1-pskernel-t05-header.yml', 'psc1/kernel-lakefile.lean', 'psc1/lean-toolchain', 'psc1/scripts/install-lean435-ci.sh', 'psc1/packages/pskernel-core/src/Ps/KernelCore/SelfHost.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagAdmission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeaderTypes.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryOccurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryAnnotations.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryParameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagOrdinaryHeader.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Checker/ExprV2/AdmissionHelpers.lean', 'psc1/test/PsKernelOrdinaryHeaderStateProofs.lean', 'psc1/test/PsKernelOrdinaryOccurrenceProofs.lean', 'psc1/test/PsKernelCacheScopeProofs.lean', 'psc1/test/PsKernelExprV2SessionProofs.lean', 'psc1/test/PsKernelScalarHashWorkerRegression.lean', 'psc1/test/PsKernelClosedCacheAnalysisRegression.lean', 'psc1/test/PsKernelKnotFuelProofs.lean', 'psc1/test/PsKernelOrdinaryHeaderRegression.lean', 'psc1/scripts/pskernel-ordinary-header-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-worker-smoke.mjs', 'psc1/scripts/pskernel-scalar-hash-short-entry-smoke.mjs', 'psc1/scripts/pskernel-closed-cache-analysis-smoke.mjs', 'psc1/scripts/pskernel-generated-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-dag-smoke.mjs', 'psc1/scripts/pskernel-expr-v2-generated-prefix-smoke.mjs', 'psc1/scripts/pskernel-invalid-recursor-occurrence-smoke.mjs', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean']
        frozen = {'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Ordinary/Admission.lean': '63b3f93af8d1352037d40bbdc793471c3f2f3d80321ad24c680a3a897c402c05', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Parameters.lean': '7506663960991724551ae8af806996304a5e196db275fb22e168639028b803a3', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Common/Occurrence.lean': 'cc160e7cca9436170b64f845b393d0e8aa631ffb9ce61a74c0bedccb9587e9b0', 'psc1/packages/pskernel-core/src/Ps/KernelCore/Core/Expr.lean': '068312a568ee3b1b86312d9a9e589a32813e45cf703d0830108efc1556666e51'}
        records = []
        for name in paths:
            raw = (repo/name).read_bytes()
            record = {'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                      'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            if name in frozen and record['sha256'] != frozen[name]:
                raise RuntimeError('Frozen V1 reference changed: '+name)
            target = out/'sources'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(raw)
            records.append(record)
        report = {'schema':'psc1-t05-header-source-inventory-v1','repository':'dwijayuda/pskernel',
                  'sourceSha':source,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'job':os.environ['GITHUB_JOB'],'route':os.environ['PSC1_T05_ROUTE'],
                  'leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc','files':records}
        (out/'source-inventory.json').write_text(json.dumps(report,indent=2)+'\n')
        print('PSC1_T05_SOURCE_INVENTORY '+json.dumps(report,separators=(',',':')))
        PY
    - name: Build authentic PSC1 for the bounded generation gate
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake build psc1 2>&1 | tee "$PSC1_T05_DIR/compiler-build.log"
    - name: Install pinned TypeScript7.0.2
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/psc1-dag-ts"
        echo '{"name":"psc1-dag-ts","private":true,"version":"0.0.0"}' > "$RUNNER_TEMP/psc1-dag-ts/package.json"
        npm install --prefix "$RUNNER_TEMP/psc1-dag-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2
        PSC1_T05_TSC="$RUNNER_TEMP/psc1-dag-ts/node_modules/typescript/bin/tsc"
        test "$(node "$PSC1_T05_TSC" --version)" = "Version 7.0.2"
        printf 'PSC0_TSC=%s\n' "$PSC1_T05_TSC" >> "$GITHUB_ENV"
        node "$PSC1_T05_TSC" --version > "$PSC1_T05_DIR/typescript-version.txt"
    - name: Require retained bounded scalar and closed-cache strict generation plus1884matrix
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake exe psc1 build packages/pskernel-core/src/Ps/KernelCore/Runtime/Acceleration/CacheAnalysis.lean \
          --out dist/expr-v2/scalar-hash/kernel.js
        cp dist/expr-v2/scalar-hash/kernel.js "$RUNNER_TEMP/psc1-scalar-hash-probe.mjs"
        env PATH="" "$PSC1_T05_NODE" --max-old-space-size=2048 scripts/pskernel-scalar-hash-worker-smoke.mjs "$RUNNER_TEMP/psc1-scalar-hash-probe.mjs" \
          | tee "$RUNNER_TEMP/psc1-scalar-hash-probe.log"
        env PATH="" "$PSC1_T05_NODE" --max-old-space-size=2048 scripts/pskernel-scalar-hash-short-entry-smoke.mjs "$RUNNER_TEMP/psc1-scalar-hash-probe.mjs" \
          | tee -a "$RUNNER_TEMP/psc1-scalar-hash-probe.log"
        grep -Fqx 'PSC1_SCALAR_HASH_SHORT_ENTRY_JS: PASS {"cases":19,"assertions":38,"shortMaxPairs":4,"genericFallback":true}' "$RUNNER_TEMP/psc1-scalar-hash-probe.log"
