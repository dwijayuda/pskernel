            "sourceFiles": {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
            "fullQualification": False, "performanceQualified": False,
        }
        out = pathlib.Path(os.environ["PSC1_T05_DIR"])
        (out / "deferred-transform-source-audit.json").write_text(json.dumps(audit, indent=2) + "\n")
        print("PSC1_T08_DEFERRED_TRANSFORM_SOURCE: PASS " + json.dumps(audit, separators=(",", ":")))
        PY
