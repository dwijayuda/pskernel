            raise RuntimeError('Executedinputchanged')
        receipt={'schema':'psc1-t05-header-route-receipt-v1','status':'pass','identity':provenance,
                 'result':records[0],'measurement':measurement,'peakRssKiB':int(timed[1]),'wallSeconds':float(timed[2]),
                 'logs':{p.name:digest(p) for p in sorted(root.glob('*.log'))},
                 'headerOnly':True,'fullAdmission':False,'performanceQualified':False}
        (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_HEADER_ROUTE: PASS '+json.dumps(receipt,separators=(',',':')))
