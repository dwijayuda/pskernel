        set -euo pipefail
        cd "$PSC1_T05_DIR/detached"
        /usr/bin/time -f 'peak_rss_kib=%M wall_seconds=%e exit_status=%x' \
          -o "$PSC1_T05_DIR/constructor-fields.memory" \
          env PATH="" "$PSC1_T05_NODE" --max-old-space-size=2048 \
          pskernel-ordinary-constructor-fields-smoke.mjs kernel.mjs \
          2>&1 | tee "$PSC1_T05_DIR/constructor-fields.log"
        cat "$PSC1_T05_DIR/constructor-fields.memory"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        def digest(path):
            raw=path.read_bytes();return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
        def exact(a,b):
            if type(a) is not type(b):return False
            if isinstance(a,dict):return a.keys()==b.keys() and all(exact(a[k],b[k]) for k in a)
            return a==b
        provenance=json.loads((root/'provenance.json').read_text())
        retained=json.loads((root/'constructor-receipt.json').read_text())
        identity={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                  'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':os.environ['PSC1_T05_ROUTE']}
        for key,value in identity.items():
            if provenance[key]!=value or retained['identity'][key]!=value:
                raise RuntimeError('Fields receipt identity mismatch: '+key)
        if retained['status']!='pass' or retained['retainedHeaderAssertions']!=1992:
            raise RuntimeError('Existing constructor and header receipts are required')
        for name,count in [('params',268),('result',432)]:
            if retained['results'][name]['result']['assertions']!=count:
                raise RuntimeError('Retained constructor matrix required: '+name)
        kernel=root/'detached/kernel.mjs'
        harness=root/'detached/pskernel-ordinary-constructor-fields-smoke.mjs'
        if digest(kernel)!=provenance['kernel'] or digest(harness)!=provenance['scripts'][harness.name]:
            raise RuntimeError('Executed fields kernel or harness changed')
        log=root/'constructor-fields.log';lines=log.read_text().splitlines()
        expected={'schema':'psc1-ordinary-constructor-fields-v1',
                  'kernel':str(kernel.resolve()),'assertions':268,
                  'sectionAssertions':{'harness':1,'fields':147,'recursive':105,'boundaries':8,'recursorGuard':7},
                  'fieldRows':21,'recursiveRows':15,'fuelValues':6,
                  'positiveFields':16,'negativeFields':5,'positiveRecursive':10,'negativeRecursive':5,
                  'fullAdmission':False,'publicRoutingChanged':False}
        marker='PSC1_ORDINARY_CONSTRUCTOR_FIELDS_JS: PASS assertions=268 fullAdmission=false'
        records=[json.loads(line) for line in lines if line.startswith('{')]
        if lines.count(marker)!=1 or len(records)!=1 or not exact(records[0],expected):
            raise RuntimeError('Exact fields268 matrix and section inventory required')
        if sum(expected['sectionAssertions'].values())!=expected['assertions']:
            raise RuntimeError('Fields assertion total mismatch')
        measurement=(root/'constructor-fields.memory').read_text().strip()
        timed=re.fullmatch(r'peak_rss_kib=(\d+) wall_seconds=(\d+(?:\.\d+)?) exit_status=0',measurement)
        if timed is None or float(timed[2])>=1500:
            raise RuntimeError('Fields runtime must exit0 within25minutes')
        receipt={'schema':'psc1-t05-fields-route-receipt-v1','status':'pass','identity':provenance,
                 'retainedConstructorReceipt':digest(root/'constructor-receipt.json'),
                 'result':records[0],'log':digest(log),'harness':digest(harness),
                 'measurement':measurement,'peakRssKiB':int(timed[1]),'wallSeconds':float(timed[2]),
                 'logs':{p.name:digest(p) for p in sorted(root.glob('*.log'))},
                 'constructorHelpersOnly':True,'fieldsAndPositivity':True,'fullAdmission':False,
                 'publicRoutingChanged':False,'performanceQualified':False}
        (root/'fields-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_FIELDS_ROUTE: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Retain bounded gate artifacts on success or failure
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$PSC1_T05_DIR/bounded"
        for PSC1_T05_FILE in "$RUNNER_TEMP/psc1-scalar-hash-probe.log" "$RUNNER_TEMP/psc1-closed-cache-analysis-probe.log" "$RUNNER_TEMP/psc1-closed-cache-analysis-codegen.log"; do
          if [ -f "$PSC1_T05_FILE" ]; then cp "$PSC1_T05_FILE" "$PSC1_T05_DIR/bounded/"; fi
        done
        if [ -d dist/expr-v2/scalar-hash ]; then cp -R dist/expr-v2/scalar-hash/. "$PSC1_T05_DIR/bounded/"; fi
      if: always()
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-t05-header-${{ matrix.route }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/psc1-t05-${{ matrix.route }}/
        if-no-files-found: error
        include-hidden-files: true
