name: PSC1 private mutual constructor target and occurrence native preflight
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t06-mutual-result-20261026
    paths:
    - psc1/**
    - .github/workflows/psc1-pskernel-t06-mutual-result.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      run: bash psc1/scripts/install-lean435-ci.sh
    - name: Authenticate private header delta and archive actual source
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/t06-mutual-result/source"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        test "$(cat psc1/lean-toolchain)" = leanprover/lean4:v4.35.0

        (cd psc1 && test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)

        git diff --name-only ed45802269907009be8872e1188d93567b1c87df HEAD -- psc1/packages/pskernel-core/src >
        "$RUNNER_TEMP/t06-mutual-result/production-delta.txt"

        python3 - <<''PYCODE''

        import os,pathlib,subprocess,json,hashlib

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result''

        assert (out/''production-delta.txt'').read_text().splitlines()==[''psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagMutualConstructorResult.lean'',''psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagMutualHeader.lean'']

        p=''psc1/kernel-lakefile.lean'';old=subprocess.check_output([''git'',''show'',''ed45802269907009be8872e1188d93567b1c87df:''+p]).decode();current=pathlib.Path(p).read_text()

        assert current.replace(''    `Ps.KernelCore.API.DagMutualConstructorResult,\n'','''')==old

        source=pathlib.Path(''psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagMutualConstructorResult.lean'').read_text()

        assert not any(token in source for token in [''psKernelAddSimpleMutualInductive'',''psKernelDagGeneratedImport'',''psKernelExprV2DecodeChecked'',''sorry'',''axiom
        ''])

        PYCODE

        git archive HEAD psc1/packages/pskernel-core/src psc1/test psc1/kernel-lakefile.lean psc1/lean-toolchain
        .github/workflows/psc1-pskernel-t06-mutual-result.yml | tar -x -C "$RUNNER_TEMP/t06-mutual-result/source"

        (cd psc1 && node check-psc1-source.mjs --all-portable) 2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/portable.log"

        '
    - name: Build complete native closure and prove private scope equations
      working-directory: psc1
      shell: bash
      run: 'set -euo pipefail

        lake -f kernel-lakefile.lean build PsKernelCore PsKernelOrdinaryHeaderProofs 2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/build.log"

        lake -f kernel-lakefile.lean env lean test/PsKernelMutualHeaderProofs.lean 2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/header-proofs.log"

        lake -f kernel-lakefile.lean env lean test/PsKernelMutualConstructorResultProofs.lean 2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/proofs.log"

        python3 - <<''PYCODE''

        import os,pathlib,re

        text=(pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result/proofs.log'').read_text()

        reports=re.findall(r"''(PsKernelMutualConstructorResultProofs\.[^'']+)'' (?:depends on axioms: \[([^\]]*)\]|does
        not depend on any axioms)",text)

        assert len(reports)==10 and len({name for name,_ in reports})==10,reports

        header=(pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result/header-proofs.log'').read_text()

        header_reports=re.findall(r"''(PsKernelMutualHeaderProofs\.[^'']+)'' (?:depends on axioms:\s*\[([^\]]*)\]|does
        not depend on any axioms)",header)

        assert len(header_reports)==len({name for name,_ in header_reports})==12

        assert not any(x in text+header for x in [''sorryAx'',''Lean.ofReduceBool'',''Lean.trustCompiler''])

        for name,axioms in reports+header_reports:assert set(x.strip() for x in axioms.split('','') if x.strip())<={''propext'',''Classical.choice'',''Quot.sound''},(name,axioms)

        print(''PSC1_MUTUAL_RESULT_PROOFS_PASS reports=22 header=12 result=10'')

        PYCODE

        '
    - name: Compare direct header stage with frozen V1 prefix
      working-directory: psc1
      shell: bash
      run: 'set -euo pipefail

        timeout --signal=KILL 300s lake -f kernel-lakefile.lean env lean --run test/PsKernelMutualHeaderRegression.lean
        2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/header-regression.log"

        timeout --signal=KILL 300s lake -f kernel-lakefile.lean env lean --run test/PsKernelMutualConstructorResultRegression.lean
        2>&1 | tee "$RUNNER_TEMP/t06-mutual-result/native.log"

        python3 - <<''PYCODE''

        import pathlib,os

        text=(pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result/native.log'').read_text()

        labels=[line.removeprefix(''PSC1_MUTUAL_RESULT_ASSERT '') for line in text.splitlines() if line.startswith(''PSC1_MUTUAL_RESULT_ASSERT
        '')]

        header=(pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result/header-regression.log'').read_text()

        header_labels=[l.removeprefix(''PSC1_MUTUAL_HEADER_ASSERT '') for l in header.splitlines() if l.startswith(''PSC1_MUTUAL_HEADER_ASSERT
        '')]

        assert len(header_labels)==len(set(header_labels))==33

        assert ''PSC1_MUTUAL_HEADER_NATIVE: PASS assertions=33 positive=11 negative=16 budgets=5 injected=1'' in
        header

        assert len(labels)==114 and len(set(labels))==114,labels

        assert ''PSC1_MUTUAL_RESULT_NATIVE: PASS assertions=114 occurrence=90 application=20 boundary=3 headers=1''
        in text

        PYCODE

        '
    - name: Bind every actual source snapshot and log
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYCODE''

        import pathlib,os,hashlib,json

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-result''

        files={str(p.relative_to(out)):{''bytes'':p.stat().st_size,''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()}
        for p in sorted(out.rglob(''*'')) if p.is_file()}

        (out/''files.json'').write_text(json.dumps({''source'':os.environ[''GITHUB_SHA''],''run'':os.environ[''GITHUB_RUN_ID''],''attempt'':os.environ[''GITHUB_RUN_ATTEMPT''],''scope'':''private
        mutual header only; not admission or global soundness'',''files'':files},indent=2)+''\n'')

        PYCODE

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-mutual-result-native-attempt-${{ github.run_attempt }}
        include-hidden-files: true
        path: ${{ runner.temp }}/t06-mutual-result/
        retention-days: 90
