        \    for name,axioms in rows:assert set(x.strip() for x in axioms.split(',') if x.strip())<={'propext','Classical.choice','Quot.sound'},(name,axioms)\n\
        print('PSC1_MUTUAL_PARITY_ALL_PROOFS_PASS reports=109 modules=7')\nPYCODE\n\nlake -f kernel-lakefile.lean\
