        print('PSC1_MUTUAL_LOOP_PROOFS_PASS reports=16 retained=66')\nPYCODE\n\nlake -f kernel-lakefile.lean env\
        \ lean test/PsKernelMutualHeaderProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/header-proofs.log\"\
        \nlake -f kernel-lakefile.lean env lean test/PsKernelMutualConstructorResultProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/family-proofs.log\"\
        \npython3 - <<'PYCODE'\nimport pathlib,os,re\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public'\n\
