        \ | tee \"$RUNNER_TEMP/t06-mutual-public/build.log\"\nlake -f kernel-lakefile.lean env lean -o .lake/build/lib/lean/PsKernelExpandedSizeProofs.olean\
        \ test/PsKernelExpandedSizeProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/retained-count-proofs.log\"\
