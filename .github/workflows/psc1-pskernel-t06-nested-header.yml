        \    text=(out/filename).read_text()\n    rows=re.findall(r\"'(\"+namespace+r\"\\.[^']+)' (?:depends on\
        \ axioms: \\[([^\\]]*)\\]|does not depend on any axioms)\",text)\n    assert len(rows)==len({name for name,_\
