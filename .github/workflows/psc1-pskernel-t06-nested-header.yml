        \ PASS '+str(len(labels)))\nPYCODE\n"
    - name: Bind every actual source snapshot and log
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYCODE''

        import pathlib,os,hashlib,json

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''t06-mutual-public''

        files={str(p.relative_to(out)):{''bytes'':p.stat().st_size,''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()}
        for p in sorted(out.rglob(''*'')) if p.is_file()}

        (out/''files.json'').write_text(json.dumps({''source'':os.environ[''GITHUB_SHA''],''run'':os.environ[''GITHUB_RUN_ID''],''attempt'':os.environ[''GITHUB_RUN_ATTEMPT''],''scope'':''Private
        nested initial parameter phase;749unique native reports including11new;1184retained controls plus actual-original
        nested prefix comparisons;public route unchanged;no nested admission/global soundness or backend proof'',''files'':files},indent=2)+''\n'')

        PYCODE

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-nested-header-native-attempt-${{ github.run_attempt }}
        include-hidden-files: true
        path: ${{ runner.temp }}/t06-mutual-public/
        retention-days: 90
