        retained=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public/retained-fields-proofs.log').read_text()\n\
        old=re.findall(r\"'(PsKernelMutualConstructorFieldsProofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\\
        ]|does not depend on any axioms)\",retained)\nassert len(old)==18 and len({name for name,_ in old})==18,old\n\
        assert not any(x in retained for x in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler'])\nfor name,axioms\
        \ in old:assert set(x.strip() for x in axioms.split(',') if x.strip())<={'propext','Classical.choice','Quot.sound'},(name,axioms)\n\
        retained=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public/retained-constructor-proofs.log').read_text()\n\
        old=re.findall(r\"'(PsKernelMutualConstructorAnalysisProofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\\
        ]|does not depend on any axioms)\",retained)\nassert len(old)==22 and len({name for name,_ in old})==22,old\n\
        assert not any(x in retained for x in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler'])\nfor name,axioms\
