name: PSC1 private nested initial parameter owner native qualification
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t06-nested-header-20261026
    paths:
    - psc1/**
    - .github/workflows/psc1-pskernel-t06-nested-header.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      run: bash psc1/scripts/install-lean435-ci.sh
    - name: Authenticate one added private module and preserve exact production/tests
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/t06-mutual-public/source\"\ntest \"$(git rev-parse HEAD)\"\
        \ = \"$GITHUB_SHA\"\ntest \"$(cat psc1/lean-toolchain)\" = leanprover/lean4:v4.35.0\n(cd psc1 && test \"\
        $(lean --githash)\" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)\ngit diff --name-only ff1aa23dc2c95785f5349dd7b7a022dac893f5ac\
        \ HEAD -- psc1/packages/pskernel-core/src > \"$RUNNER_TEMP/t06-mutual-public/production-delta.txt\"\npython3\
        \ - <<'PYCODE'\nimport os,pathlib,subprocess\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public'\n\
        assert (out/'production-delta.txt').read_text().splitlines()==['psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedHeader.lean']\n\
        for path in ['psc1/packages/pskernel-core/src/Ps/KernelCore/API/Dag.lean','psc1/test/PsKernelCacheScopeProofs.lean','psc1/test/PsKernelEmptySemanticCacheProofs.lean']:\n\
        \    assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show','ff1aa23dc2c95785f5349dd7b7a022dac893f5ac:'+path])\n\
        path='psc1/kernel-lakefile.lean';old=subprocess.check_output(['git','show','ff1aa23dc2c95785f5349dd7b7a022dac893f5ac:'+path]).decode();assert\
        \ pathlib.Path(path).read_text()==old.replace('    `Ps.KernelCore.API.DagMutualHeader,','    `Ps.KernelCore.API.DagMutualHeader,\\\
        n    `Ps.KernelCore.API.DagNestedHeader,')\nPYCODE\ngit archive HEAD psc1/packages/pskernel-core/src psc1/test\
        \ psc1/kernel-lakefile.lean psc1/lean-toolchain .github/workflows/psc1-pskernel-t06-nested-header.yml |\
        \ tar -x -C \"$RUNNER_TEMP/t06-mutual-public/source\"\n(cd psc1 && node check-psc1-source.mjs --all-portable)\
        \ 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/portable.log\"\n"
