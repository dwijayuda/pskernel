        $RUNNER_TEMP/t06-mutual-public/retained-constructor-proofs.log\"\nlake -f kernel-lakefile.lean env lean\
        \ test/PsKernelMutualConstructorLoopProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/proofs.log\"\
        \npython3 - <<'PYCODE'\nimport os,pathlib,re\ntext=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public/proofs.log').read_text()\n\
        reports=re.findall(r\"'(PsKernelMutualConstructorLoopProofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\\
        ]|does not depend on any axioms)\",text)\nassert len(reports)==16 and len({name for name,_ in reports})==16,reports\n\
        assert not any(x in text for x in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler'])\nfor name,axioms\
        \ in reports:assert set(x.strip() for x in axioms.split(',') if x.strip())<={'propext','Classical.choice','Quot.sound'},(name,axioms)\n\
        retained=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public/retained-count-proofs.log').read_text()\n\
        old=re.findall(r\"'(PsKernelExpandedSizeProofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not\
        \ depend on any axioms)\",retained)\nassert len(old)==11 and len({name for name,_ in old})==11,old\nassert\
        \ not any(x in retained for x in ['sorryAx','Lean.ofReduceBool','Lean.trustCompiler'])\nfor name,axioms\
        \ in old:assert set(x.strip() for x in axioms.split(',') if x.strip())<={'propext','Classical.choice','Quot.sound'},(name,axioms)\n\
        retained=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public/retained-recursive-proofs.log').read_text()\n\
        old=re.findall(r\"'(PsKernelMutualRecursiveArgumentProofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\\
        ]|does not depend on any axioms)\",retained)\nassert len(old)==15 and len({name for name,_ in old})==15,old\n\
