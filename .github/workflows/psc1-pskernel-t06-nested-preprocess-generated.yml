        \ and not r['performanceQualified']\nprint('PSC1_NESTED_PREPROCESS_NATIVE_EQUAL_ALL: PASS controls=26 actualOriginalFixtures=5')\n\
        PYCODE\n"
    - name: Preserve exact actual generated evidence
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYCODE''

        import pathlib,os,json,hashlib

        out=pathlib.Path(os.environ[''RUNNER_TEMP''])/''mutual-generated''

        files={str(p.relative_to(out)):{''bytes'':p.stat().st_size,''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()}
        for p in out.rglob(''*'') if p.is_file()}

        (out/''files.json'').write_text(json.dumps({''source'':os.environ[''GITHUB_SHA''],''files'':files},indent=2)+''\n'')

        PYCODE

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-nested-preprocess-complete-generated
        include-hidden-files: true
        path: ${{ runner.temp }}/mutual-generated/
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        route:
        - generated
    env:
      PSC1_MUTUAL_ROUTE: ${{ matrix.route }}
