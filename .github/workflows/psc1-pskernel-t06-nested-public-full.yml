        for p in out.rglob(''*'') if p.is_file()}

        (out/''files.json'').write_text(json.dumps({''source'':os.environ[''GITHUB_SHA''],''files'':files},indent=2)+''\n'')

        PYCODE

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-nested-public-complete-${{ matrix.route }}
        include-hidden-files: true
        path: ${{ runner.temp }}/mutual-generated/
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        route:
        - generated
        - canonical
    env:
      PSC1_MUTUAL_ROUTE: ${{ matrix.route }}
