name: PSC1 complete nested owning public route qualification
'on':
  workflow_dispatch: null
  push:
    branches:
    - work/psc1-pskernel-t06-nested-public-20261026
    paths:
    - psc1/**
    - .github/workflows/psc1-pskernel-t06-nested-public.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      run: bash psc1/scripts/install-lean435-ci.sh
    - name: Authenticate exact nested route, named projection and seven explicit let-result types; all operational
        expressions retained
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/t06-mutual-public/source\"\ntest \"$(git rev-parse HEAD)\"\
        \ = \"$GITHUB_SHA\"\ntest \"$(cat psc1/lean-toolchain)\" = leanprover/lean4:v4.35.0\n(cd psc1 && test \"\
        $(lean --githash)\" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)\ngit diff --name-only b07839267aa23eab90b7c60641ed45605999e2a2\
        \ HEAD -- psc1/packages/pskernel-core/src > \"$RUNNER_TEMP/t06-mutual-public/production-delta.txt\"\npython3\
        \ - <<'PYCODE'\nimport pathlib,subprocess,os\nbase='b07839267aa23eab90b7c60641ed45605999e2a2'\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'t06-mutual-public'\n\
        assert (out/'production-delta.txt').read_text().splitlines()==['psc1/packages/pskernel-core/src/Ps/KernelCore/API/Dag.lean','psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedRestoration.lean','psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedTransformed.lean','psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedValidation.lean']\n\
        path='psc1/kernel-lakefile.lean';before=subprocess.check_output(['git','show',base+':'+path]).decode();current=pathlib.Path(path).read_text()\n\
        assert current==before\nfor path in ['psc1/packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Nested/Rebase.lean','psc1/test/PsKernelNestedHeaderProofs.lean','psc1/test/PsKernelNestedPreprocessProofs.lean','psc1/test/PsKernelNestedParamHygieneProofs.lean']:\n\
        \ assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',base+':'+path])\npath='psc1/packages/pskernel-core/src/Ps/KernelCore/API/Dag.lean';current=pathlib.Path(path).read_text();before=subprocess.check_output(['git','show',base+':'+path]).decode()\n\
        assert current.replace('import Ps.KernelCore.API.DagNestedAdmission\\n','',1).replace('      | PsKernelDagDeclarationRequest.nestedInductive\
        \ value =>\\n          match psKernelDagDecodeDeclaration input request with\\n          | Except.error\
        \ error => Except.error (PsKernelError.rejectedInvalid error)\\n          | Except.ok declaration =>\\n\
        \              let admit :=\\n                fun (owner : PsKernelDagGeneratedState) =>\\n            \
        \      psKernelExprV2NestedAdmitWithFuel execution.session.resources.fuel\\n                    (psKernelKernelSessionEnvironment\
        \ execution.session)\\n                    execution.session.resources.maxRecDepth execution.session.resources.maxNatSize\\\
        n                    input owner value;\\n              psKernelDagRunOrdinaryOwnedWith admit input execution\\\
        n                levelParams safety arena built request declaration\\n','',1)==before\npath='psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedValidation.lean';before=subprocess.check_output(['git','show',base+':'+path]).decode();current=pathlib.Path(path).read_text()\n\
        current=current.replace('let sorted : Option (Except String PsKernelExprV2CheckState) :=','let sorted :=',1)\n\
        assert current.replace('                  let inferredState := Prod.fst oldType;\\n                  match\
        \ psKernelExprV2OrdinaryExtendDecoded inferredState.whnf.arena oldOwner.built with','                  match\
        \ psKernelExprV2OrdinaryExtendDecoded (Prod.fst oldType).whnf.arena oldOwner.built with',1)==before\npath='psc1/test/PsKernelNestedValidationProofs.lean';before=subprocess.check_output(['git','show',base+':'+path]).decode();current=pathlib.Path(path).read_text()\n\
        assert current.replace('theorem named_projection_retains_exact_decoded_extension\\n    (checked : Prod PsKernelExprV2CheckState\
        \ Nat) (built : PsKernelExprV2Decoded) :\\n    (let inferredState := Prod.fst checked;\\n      psKernelExprV2OrdinaryExtendDecoded\
        \ inferredState.whnf.arena built) =\\n      psKernelExprV2OrdinaryExtendDecoded (Prod.fst checked).whnf.arena\
        \ built := rfl\\n\\n','',1).replace('#print axioms PsKernelNestedValidationProofs.named_projection_retains_exact_decoded_extension\\\
        n','',1)==before\npath='psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedTransformed.lean';before=subprocess.check_output(['git','show',base+':'+path]).decode();current=pathlib.Path(path).read_text()\n\
        current=current.replace('let imported : Except String (Prod PsKernelDagGeneratedState Nat) :=','let imported\
        \ :=')\ncurrent=current.replace('let constructors : List PsKernelDagConstructor := match original with','let\
        \ constructors := match original with')\nassert current==before\npath='psc1/packages/pskernel-core/src/Ps/KernelCore/API/DagNestedRestoration.lean';before=subprocess.check_output(['git','show',base+':'+path]).decode();current=pathlib.Path(path).read_text()\n\
        current=current.replace('let attempted : Except String (Prod PsKernelDagGeneratedState Nat) :=','let attempted\
        \ :=')\ncurrent=current.replace('let tail : List PsKernelExprV2RecursorRuleRef := match origins with','let\
        \ tail := match origins with')\ncurrent=current.replace('let origins : List PsKernelExprV2RecursorRuleRef\
        \ :=','let origins :=')\nassert current==before\nPYCODE\ngit archive HEAD psc1/packages/pskernel-core/src\
        \ psc1/test psc1/kernel-lakefile.lean psc1/lean-toolchain .github/workflows/psc1-pskernel-t06-nested-public.yml\
        \ | tar -x -C \"$RUNNER_TEMP/t06-mutual-public/source\"\n(cd psc1 && node check-psc1-source.mjs --all-portable)\
        \ 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/portable.log\"\n"
    - name: Build complete native closure and prove exact recursive worker protocol
      working-directory: psc1
      shell: bash
      run: "set -euo pipefail\nlake -f kernel-lakefile.lean build PsKernelCore PsKernelOrdinaryHeaderProofs 2>&1\
