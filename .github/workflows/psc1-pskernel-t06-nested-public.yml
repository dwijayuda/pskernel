        \ test/PsKernelExpandedSizeProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/retained-count-proofs.log\"\
        \nlake -f kernel-lakefile.lean env lean test/PsKernelMutualRecursiveArgumentProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/retained-recursive-proofs.log\"\
        \nlake -f kernel-lakefile.lean env lean test/PsKernelMutualConstructorFieldsProofs.lean 2>&1 | tee \"$RUNNER_TEMP/t06-mutual-public/retained-fields-proofs.log\"\
        \nlake -f kernel-lakefile.lean env lean test/PsKernelMutualConstructorAnalysisProofs.lean 2>&1 | tee \"\
        $RUNNER_TEMP/t06-mutual-public/retained-constructor-proofs.log\"\nlake -f kernel-lakefile.lean env lean\
