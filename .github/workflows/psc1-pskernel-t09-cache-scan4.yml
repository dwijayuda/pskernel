        \ test/PsKernelCacheScan4Proofs.lean 2>&1 | tee \"$RUNNER_TEMP/t09-cache-scan4/cache4-proofs.log\"\npython3\
        \ - <<'PYCODE'\nimport pathlib,os,re\ntext=(pathlib.Path(os.environ['RUNNER_TEMP'])/'t09-cache-scan4/cache4-proofs.log').read_text()\n\
        rows=re.findall(r\"'(PsKernelCacheScan4Proofs\\.[^']+)' (?:depends on axioms: \\[([^\\]]*)\\]|does not depend\
