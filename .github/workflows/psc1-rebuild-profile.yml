name: PSC1 measured rebuild profile
on:
  push:
    branches: [feat/psc1-canonical-latency-20261028]
    paths:
      - psc1/standalone/profile-rebuild.mjs
      - .github/workflows/psc1-rebuild-profile.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-rebuild-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Parse observation harness
        run: node --check standalone/profile-rebuild.mjs
      - uses: actions/download-artifact@v4
        with:
          name: psc1-independent-qualified-linux-x64-5484a04df34de1bbcfa46a248b6a93ce510035d6
          run-id: 40618697529
          github-token: ${{ github.token }}
          path: psc1/dist/next/qualified
      - uses: actions/download-artifact@v4
        with:
          name: psc1-independent-baseline-5484a04df34de1bbcfa46a248b6a93ce510035d6
          run-id: 40618697529
          github-token: ${{ github.token }}
          path: psc1/dist/next/baseline
      - uses: actions/download-artifact@v4
        with:
          name: psc1-rebuild-profile-bce64f121625f4387e5f0b09613b92961dd0ef42
          run-id: 40630905618
          github-token: ${{ github.token }}
          path: psc1/dist/next/inspector-preflight
      - name: Retain the failed Inspector preflight diagnosis
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const file of ['preflight-stderr.log','preflight-stdout.log','failure.json']) {
            const value=fs.readFileSync('dist/next/inspector-preflight/'+file,'utf8');
            console.log('PSC1_PRIOR_PROFILE_DIAGNOSIS '+file+': '+value.slice(-16384));
          }
          JS
      - name: Verify the exact qualified distribution before extraction
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const bytes=fs.readFileSync('dist/next/qualified/psc1-independent-linux-x64.tar.gz');
          assert.equal(bytes.length,46905678);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),'c227da916348087550f696a1b9f8ad0c6faacaad6bd86d6e72244ed4d96d2fe3');
          const summary=JSON.parse(fs.readFileSync('dist/next/qualified/summary.json','utf8'));
          assert.equal(summary.status,'qualified-linux-independent-compiler-development');
          assert.equal(summary.testedCommit,'5484a04df34de1bbcfa46a248b6a93ce510035d6');
          JS
          tar xzf dist/next/qualified/psc1-independent-linux-x64.tar.gz -C dist/next/qualified
      - name: Profile the complete current compiler and freshly check the exact result
        run: >-
          node --max-old-space-size=4096 standalone/profile-rebuild.mjs
          --toolchain dist/next/qualified/toolchain
          --baseline dist/next/baseline/baseline/B2
          --out dist/next/profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-rebuild-profile-${{ github.sha }}
          path: psc1/dist/next/profile/
          if-no-files-found: warn
          retention-days: 90
