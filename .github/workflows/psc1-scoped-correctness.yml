name: PSC1 scoped correctness and readable artifacts

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - fix/psc1-scoped-correctness-20261020
    paths:
      - psc1/**
      - .github/workflows/psc1-scoped-correctness.yml
  pull_request:
    paths:
      - psc1/**
      - .github/workflows/psc1-scoped-correctness.yml
      - .github/workflows/psc1-direct-backends.yml

concurrency:
  group: psc1-scoped-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PSC1_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  linux-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimum supported Python for compatibility checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Record minimum Python interpreter
        run: echo "PSC1_PYTHON_314=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install current Python for target validation and execution
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - name: Install PHP and selected exact-integer extension
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: gmp
          tools: none
          coverage: none
      - name: Record scripting target runtimes
        run: |
          python3 --version
          php --version
          php -r 'echo "gmp=" . (extension_loaded("gmp") ? "enabled" : "missing") . PHP_EOL;'
      - name: Install repository-pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install locked host formatting dependencies and run host regressions
        working-directory: psc1/host-tools
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm --prefix "$PWD" --workspaces=false ci --ignore-scripts --no-audit --no-fund
          node test-artifacts.mjs
      - name: Install pinned Rust target tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
          rustc --version
          cargo --version
          rustfmt --version
      - name: Install SHA-256-pinned Wasm tools and component runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-bin" "$RUNNER_TEMP/wasm-tools" "$RUNNER_TEMP/wasmtime"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz' -o "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "d0efb16c9c859137b7ab3e99151c299cd47caee106ed4594561002f7a04945bd  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools"
          install -m 755 "$(find "$RUNNER_TEMP/wasm-tools" -type f -name wasm-tools -print -quit)" "$RUNNER_TEMP/psc1-bin/wasm-tools"
          curl --fail --location --retry 3 'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.4/wasmtime-v49.0.4-x86_64-linux.tar.xz' -o "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "6561abd54bdf941b6519cce883e0857cc9bce94d92c65287ed838d895a27f5a9  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime"
          install -m 755 "$(find "$RUNNER_TEMP/wasmtime" -type f -name wasmtime -print -quit)" "$RUNNER_TEMP/psc1-bin/wasmtime"
          echo "$RUNNER_TEMP/psc1-bin" >> "$GITHUB_PATH"
      - name: Install isolated pinned TypeScript consumer checker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psc1-ts7"
          echo '{"name":"psc1-ts7-consumer-tests","version":"0.0.0","private":true}' > "$RUNNER_TEMP/psc1-ts7/package.json"
          npm install --prefix "$RUNNER_TEMP/psc1-ts7" --ignore-scripts --no-save --no-audit --no-fund typescript@7.0.2
          echo "PSC1_TSC=$RUNNER_TEMP/psc1-ts7/node_modules/typescript/bin/tsc" >> "$GITHUB_ENV"
      - name: Execute npm source metadata boundary regressions
        working-directory: psc1
        run: node scripts/npm-library-resolution-tests.mjs
      - name: Compile native compiler and focused regressions
        working-directory: psc1
        run: |
          set -euo pipefail
          lean --version
          node packages/pskernel-lean/host/check-pin.mjs
          lake build psc1 psc1_script_ir_tests psc1_runtime_oracle psc1_backend_common_tests psc1_ir_specialize_tests psc1_direct_map_tests psc1_lean_kernel_provider_tests psc1_scoped_tests psc1_snapshot_tests contextual_inference_tests psc1_do_tests psc1_operator_tests psc1_ordinary_tests
      - name: Execute IR, map, independent provider and host-boundary regressions
        working-directory: psc1
        run: |
          set -euo pipefail
          .lake/build/bin/psc1_backend_common_tests
          .lake/build/bin/psc1_ir_specialize_tests
          .lake/build/bin/psc1_direct_map_tests
          .lake/build/bin/psc1_lean_kernel_provider_tests
          .lake/build/bin/psc1_scoped_tests
      - name: Execute scripting IR rejection and compound closure consumers
        working-directory: psc1
        run: |
          set -euo pipefail
          mkdir -p dist/scoped-correctness/script-ir
          .lake/build/bin/psc1_script_ir_tests dist/scoped-correctness/script-ir/capture
          python3 -c 'import importlib.util,sys; s=importlib.util.spec_from_file_location("capture",sys.argv[1]); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.answer(41)==42; assert m.answer(0)==1; assert m.__all__==["answer"]; print("Python compound closure: PASS")' dist/scoped-correctness/script-ir/capture.py
          php -r '$api=require $argv[1]; if(gmp_cmp($api["answer"](gmp_init(41)),42)!==0 || gmp_cmp($api["answer"](gmp_init(0)),1)!==0 || array_keys($api)!==["answer"]) exit(1); echo "PHP compound closure: PASS\n";' dist/scoped-correctness/script-ir/capture.php
          python3 -c 'import runpy,sys; m=runpy.run_path(sys.argv[1]); assert m["answer"]==42; print("Python forward value: PASS")' dist/scoped-correctness/script-ir/capture-reordered.py
          php -r '$api=require $argv[1]; if(gmp_cmp($api["answer"],42)!==0) exit(1); echo "PHP forward value: PASS\n";' dist/scoped-correctness/script-ir/capture-reordered.php
          php -n -r '$api=require $argv[1]; if($api["x"]!==true || $api["shadow"](false)!==false) exit(1); echo "PHP shadowing without runtime: PASS\n";' dist/scoped-correctness/script-ir/capture-shadow.php
      - name: Compile and test corrected PSKernel-Core natively only
        working-directory: psc1
        run: |
          set -euo pipefail
          lake -f kernel-lakefile.lean build PsKernelCore psc1_kernel_regression
          .lake/build/bin/psc1_kernel_regression
      - name: Execute readable direct backend and artifact-publication matrix
        working-directory: psc1
        run: |
          set -euo pipefail
          export PSC1_NATIVE="$PWD/.lake/build/bin/psc1"
          export PSC1_HOST_TOOLS="$PWD/host-tools/artifacts.mjs"
          node scripts/scoped-backend-tests.mjs
      - name: Execute small generic, symbol-identity and recursion source regressions
        working-directory: psc1
        run: |
          set -euo pipefail
          export PSC1_NATIVE="$PWD/.lake/build/bin/psc1"
          export PSC1_HOST_TOOLS="$PWD/host-tools/artifacts.mjs"
          node scripts/scoped-source-edge-tests.mjs
      - name: Execute shared target planning, independent TS JS and publication regressions
        working-directory: psc1
        run: node scripts/backend-architecture-tests.mjs
      - name: Execute Practical Core admission, IR and real target regressions
        working-directory: psc1
        run: |
          set -euo pipefail
          result=0
          for test in contextual_inference_tests psc1_do_tests psc1_operator_tests psc1_ordinary_tests; do
            if ! ".lake/build/bin/$test"; then result=1; fi
          done
          for script in practical-forms-backend-tests.mjs practical-ordinary-tests.mjs; do
            if ! node "scripts/$script"; then result=1; fi
          done
          exit "$result"
      - name: Execute runtime contract against pinned Lean reference results
        working-directory: psc1
        run: node scripts/runtime-conformance-tests.mjs
      - name: Execute Python and PHP ABI, recursion and failure boundaries
        working-directory: psc1
        run: node scripts/script-backend-tests.mjs
      - name: Pack and qualify installed native npm toolchain and real source libraries
        working-directory: psc1
        run: node scripts/npm-native-distribution.mjs
      - name: Retain lockfile, evidence and readable example bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-scoped-correctness-${{ github.sha }}
          path: |
            psc1/host-tools/package-lock.json
            psc1/dist/scoped-correctness/
          if-no-files-found: warn
          retention-days: 14
