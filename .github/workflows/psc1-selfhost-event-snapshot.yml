name: PSC1 bounded selfhost event snapshot
on:
  push:
    branches: [qualification/psc1-io-selfhost-events-20261026]
    paths: [.github/qualification-requests/psc1-selfhost-events.json]
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Read exact job source identities and bounded generation events
        working-directory: psc1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-selfhost-events.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: psc1-selfhost-event-snapshot-${{ github.sha }}
          path: psc1/dist/selfhost-events/
          retention-days: 90
