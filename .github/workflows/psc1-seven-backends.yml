name: PSC1 seven-backend and npm qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - psc1/**
      - .github/workflows/psc1-seven-backends.yml

permissions:
  contents: read

jobs:
  linux-script-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and execute shared target plan
        run: |
          set -euo pipefail
          lean --version
          lake build psc1_script_plan_tests
          .lake/build/bin/psc1_script_plan_tests
