name: PSC1 T05 private admission native diagnostic
'on':
  workflow_dispatch: null
  push:
    branches: [work/psc1-pskernel-t05-admission-draft-20261025]
    paths:
    - .github/workflows/psc1-t05-admission-private-preflight.yml
    - psc1/kernel-lakefile.lean
    - psc1/packages/pskernel-core/src/**
    - psc1/test/PsKernelOrdinaryAdmissionProofs.lean
    - psc1/test/PsKernelExprV2OrdinaryAdmissionRegression.lean
permissions:
  contents: read
jobs:
  admission-native-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      run: bash psc1/scripts/install-lean435-ci.sh
    - name: Bind private production source
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        mkdir -p "$RUNNER_TEMP/psc1-t05-admission-private-native"
        printf 'PSC1_T05_DIR=%s\n' "$RUNNER_TEMP/psc1-t05-admission-private-native" >> "$GITHUB_ENV"
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-admission-private-native"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        repo=pathlib.Path('..').resolve();out=pathlib.Path(os.environ['PSC1_T05_DIR'])
        paths=['.github/workflows/psc1-t05-admission-private-preflight.yml',
          'psc1/kernel-lakefile.lean','psc1/lean-toolchain','psc1/scripts/install-lean435-ci.sh',
          'psc1/test/PsKernelOrdinaryAdmissionProofs.lean',
          'psc1/test/PsKernelExprV2OrdinaryAdmissionRegression.lean']
        paths+=sorted(str(p.relative_to(repo)) for p in
          (repo/'psc1/packages/pskernel-core/src').rglob('*.lean'))
        records=[]
        for name in paths:
            raw=(repo/name).read_bytes()
            record={'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
              'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            target=out/'sources'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
            records.append(record)
        result={'schema':'psc1-t05-admission-private-diagnostic-inputs-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':records,'qualified':False}
        (out/'inputs.json').write_text(json.dumps(result,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_INPUTS '+json.dumps(result,separators=(',',':')))
        PY
    - name: Compile private production imports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelCore 2>&1 | tee "$PSC1_T05_DIR/native-build.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        digest=lambda path:{'bytes':len(path.read_bytes()),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
        receipt={'schema':'psc1-t05-admission-private-compile-diagnostic-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native',
          'inputs':digest(root/'inputs.json'),'log':digest(root/'native-build.log'),
          'qualified':False,'diagnosticOnly':True,'privateAdmission':True,
          'fullAdmission':False,'publicRoutingChanged':False}
        (root/'diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_COMPILE: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Kernel-check private rule validation and synchronized publication
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_private_count_status=0
        psc1_private_lean_status=0
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryAdmissionProofs.lean)" -eq 27 \
          || psc1_private_count_status=$?
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryAdmissionProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/admission-private-proofs.log" || psc1_private_lean_status=$?
        printf 'PSC1_T05_ADMISSION_PRIVATE_PROOF_STATUS module=PsKernelOrdinaryAdmissionProofs count=27 countStatus=%s leanStatus=%s\n' \
          "$psc1_private_count_status" "$psc1_private_lean_status" \
          | tee "$PSC1_T05_DIR/admission-private-proof-status.log"
        test "$psc1_private_count_status" -eq 0
        test "$psc1_private_lean_status" -eq 0
    - name: Run complete private admission matrix and separate pinned Lean controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelExprV2OrdinaryAdmissionRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/admission-private-native.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        source=pathlib.Path('test/PsKernelOrdinaryAdmissionProofs.lean')
        module='PsKernelOrdinaryAdmissionProofs'
        names=re.findall(r'^#print axioms ([A-Za-z0-9_.$]+)\s*$',source.read_text(),re.M)
        names=[name if '.' in name else module+'.'+name for name in names]
        proofRaw=(root/'admission-private-proofs.log').read_bytes();proofLog=proofRaw.decode()
        actual=re.findall(r"'([^']+)' (?:does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])",proofLog)
        assert len(names)==len(set(names))==27 and [n for n,_ in actual]==names
        assert not any(x in proofLog for x in ('sorryAx','Lean.ofReduceBool','Lean.trustCompiler'))
        assert all({x.strip() for x in axioms.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for _,axioms in actual)
        assert (root/'admission-private-proof-status.log').read_text().splitlines()==[
          'PSC1_T05_ADMISSION_PRIVATE_PROOF_STATUS module='+module+' count=27 countStatus=0 leanStatus=0']
        raw=(root/'admission-private-native.log').read_bytes();log=raw.decode()
        labels=re.findall(r'^PSC1_ORDINARY_ADMISSION_ASSERT (.+)$',log,re.M)
        sections=re.findall(r'^PSC1_ORDINARY_ADMISSION_SECTION ([A-Za-z0-9_]+)=(\d+)$',log,re.M)
        expected={'harness':1,'matrix':126,'protocol':16}
        assert len(labels)==len(set(labels))==143
        assert len(sections)==len(expected) and {k:int(v) for k,v in sections}==expected
        assert {k:sum(label.startswith(k+'/') for label in labels) for k in expected}==expected
        marker='PSC1_ORDINARY_ADMISSION_PRIVATE_NATIVE: PASS assertions=143 rows=18 fuelValues=6 privateAdmission=true fullAdmission=false'
        assert log.splitlines().count(marker)==1
        rows=[label[len('matrix/'):-len('/required-outcome')] for label in labels if label.startswith('matrix/') and label.endswith('/required-outcome')]
        assert len(rows)==len(set(rows))==18
        fuels=[0,1,2,3,8,4096]
        assert {label for label in labels if label.startswith('matrix/')}=={
          'matrix/'+row+'/fuel='+str(fuel) for row in rows for fuel in fuels}|{
          'matrix/'+row+'/required-outcome' for row in rows}
        oracleLabels=re.findall(r'^PSC1_ORDINARY_ADMISSION_ORACLE_ASSERT (.+)$',log,re.M)
        oracleMarker='PSC1_ORDINARY_ADMISSION_ORACLE: PASS controls=18 accepted=14 rejected=4 safeGenerated=13 unsafeContract=1'
        assert oracleLabels==rows and log.splitlines().count(oracleMarker)==1
        identity={'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native'}
        inventory={'schema':'psc1-t05-admission-private-native-inventory-v1',**identity,
          'assertions':143,'sectionAssertions':expected,'rows':18,'fuelValues':6,
          'assertionLabels':labels,'logSha256':hashlib.sha256(raw).hexdigest(),
          'privateAdmission':True,'fullAdmission':False,'publicRoutingChanged':False}
        (root/'admission-private-native-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
        oracle={'schema':'psc1-t05-admission-official-native-inventory-v1',**identity,
          'controls':18,'accepted':14,'rejected':4,'safeGenerated':13,'unsafeContract':1,
          'assertionLabels':oracleLabels,'logSha256':hashlib.sha256(raw).hexdigest(),
          'leanVersion':'4.35.0','leanCommit':'eb6cafb7290e8bd5f2937522d8d804f58f02bafc'}
        (root/'admission-official-native-inventory.json').write_text(json.dumps(oracle,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_NATIVE_INVENTORY: PASS assertions=143 groups=3')
        print('PSC1_T05_ADMISSION_OFFICIAL_NATIVE_INVENTORY: PASS controls=18 accepted=14 rejected=4 safeGenerated=13 unsafeContract=1')
        digest=lambda path:{'bytes':len(path.read_bytes()),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
        receipt={'schema':'psc1-t05-admission-private-native-diagnostic-v1',**identity,'totalProofs':27,
          'proofs':[{'module':module,'count':27,'names':names,
            'source':digest(source),'log':digest(root/'admission-private-proofs.log')}],
          'nativeAssertions':143,'officialControls':18,
          'inventory':digest(root/'admission-private-native-inventory.json'),
          'officialInventory':digest(root/'admission-official-native-inventory.json'),
          'inputs':digest(root/'inputs.json'),'qualified':False,'diagnosticOnly':True,
          'privateAdmission':True,'fullAdmission':False,'publicRoutingChanged':False}
        (root/'diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_DIAGNOSTIC: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-t05-admission-private-native-diagnostic-${{ github.run_attempt }}
        path: ${{ runner.temp }}/psc1-t05-admission-private-native/
        if-no-files-found: error
        include-hidden-files: true
