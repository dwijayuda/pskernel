name: PSC1 T05 public admission native diagnostic
'on':
  workflow_dispatch: null
  push:
    branches: [work/psc1-pskernel-t05-public-draft-20261025]
    paths:
    - .github/workflows/psc1-t05-admission-public-preflight.yml
    - psc1/kernel-lakefile.lean
    - psc1/packages/pskernel-core/src/**
    - psc1/test/PsKernelOrdinaryAdmissionPublic*.lean
    - psc1/scripts/pskernel-ordinary-admission-public-smoke.mjs
permissions:
  contents: read
jobs:
  admission-native-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: ''
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned Lean
      run: bash psc1/scripts/install-lean435-ci.sh
    - name: Bind public production source
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(lean --githash)" = "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
        test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
        node --check scripts/pskernel-ordinary-admission-public-smoke.mjs
        mkdir -p "$RUNNER_TEMP/psc1-t05-admission-public-native"
        printf 'PSC1_T05_DIR=%s\n' "$RUNNER_TEMP/psc1-t05-admission-public-native" >> "$GITHUB_ENV"
        export PSC1_T05_DIR="$RUNNER_TEMP/psc1-t05-admission-public-native"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        repo=pathlib.Path('..').resolve();out=pathlib.Path(os.environ['PSC1_T05_DIR'])
        paths=['.github/workflows/psc1-t05-admission-public-preflight.yml',
          'psc1/kernel-lakefile.lean','psc1/lean-toolchain','psc1/scripts/install-lean435-ci.sh',
          'psc1/test/PsKernelOrdinaryAdmissionPublicProofs.lean',
          'psc1/test/PsKernelOrdinaryAdmissionPublicRegression.lean',
          'psc1/scripts/pskernel-ordinary-admission-public-smoke.mjs']
        paths+=sorted(str(p.relative_to(repo)) for p in
          (repo/'psc1/packages/pskernel-core/src').rglob('*.lean'))
        records=[]
        for name in paths:
            raw=(repo/name).read_bytes()
            record={'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
              'gitBlobSha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
            target=out/'sources'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
            records.append(record)
        result={'schema':'psc1-t05-admission-public-diagnostic-inputs-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':records,'qualified':False}
        (out/'inputs.json').write_text(json.dumps(result,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_INPUTS '+json.dumps(result,separators=(',',':')))
        PY
    - name: Compile public production imports
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean build PsKernelCore 2>&1 | tee "$PSC1_T05_DIR/native-build.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        digest=lambda path:{'bytes':len(path.read_bytes()),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
        receipt={'schema':'psc1-t05-admission-public-compile-diagnostic-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native',
          'inputs':digest(root/'inputs.json'),'log':digest(root/'native-build.log'),
          'qualified':False,'diagnosticOnly':True,'ordinaryAdmission':True,
          'fullAdmission':False,'publicRoutingChanged':True}
        (root/'diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PRIVATE_COMPILE: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - name: Kernel-check atomic publication and original-state fallback
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        psc1_public_count_status=0
        psc1_public_lean_status=0
        test "$(grep -c '^#print axioms ' test/PsKernelOrdinaryAdmissionPublicProofs.lean)" -eq 8 \
          || psc1_public_count_status=$?
        lake -f kernel-lakefile.lean env lean test/PsKernelOrdinaryAdmissionPublicProofs.lean \
          2>&1 | tee "$PSC1_T05_DIR/admission-public-proofs.log" || psc1_public_lean_status=$?
        printf 'PSC1_T05_ADMISSION_PUBLIC_PROOF_STATUS module=PsKernelOrdinaryAdmissionPublicProofs count=8 countStatus=%s leanStatus=%s\n' \
          "$psc1_public_count_status" "$psc1_public_lean_status" \
          | tee "$PSC1_T05_DIR/admission-public-proof-status.log"
        test "$psc1_public_count_status" -eq 0
        test "$psc1_public_lean_status" -eq 0
    - name: Run public owner and boundary controls
      working-directory: psc1
      shell: bash
      run: |
        set -euo pipefail
        lake -f kernel-lakefile.lean env lean --run test/PsKernelOrdinaryAdmissionPublicRegression.lean \
          2>&1 | tee "$PSC1_T05_DIR/admission-public-native.log"
        python3 - <<'PY'
        import hashlib,json,os,pathlib,re
        root=pathlib.Path(os.environ['PSC1_T05_DIR'])
        source=pathlib.Path('test/PsKernelOrdinaryAdmissionPublicProofs.lean')
        module='PsKernelOrdinaryAdmissionPublicProofs'
        names=re.findall(r'^#print axioms ([A-Za-z0-9_.$]+)\s*$',source.read_text(),re.M)
        names=[name if '.' in name else module+'.'+name for name in names]
        proofRaw=(root/'admission-public-proofs.log').read_bytes();proofLog=proofRaw.decode()
        actual=re.findall(r"'([^']+)' (?:does not depend on any axioms|depends on axioms:\s*\[([^\]]*)\])",proofLog)
        assert len(names)==len(set(names))==8 and [n for n,_ in actual]==names
        assert not any(x in proofLog for x in ('sorryAx','Lean.ofReduceBool','Lean.trustCompiler'))
        assert all({x.strip() for x in axioms.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'} for _,axioms in actual)
        assert (root/'admission-public-proof-status.log').read_text().splitlines()==[
          'PSC1_T05_ADMISSION_PUBLIC_PROOF_STATUS module='+module+' count=8 countStatus=0 leanStatus=0']
        raw=(root/'admission-public-native.log').read_bytes();log=raw.decode()
        labels=re.findall(r'^PSC1_ADMISSION_PUBLIC_ASSERT (.+)$',log,re.M)
        sections=re.findall(r'^PSC1_ADMISSION_PUBLIC_SECTION ([A-Za-z0-9_]+)=(\d+)$',log,re.M)
        expected={'harness':1,'routing':7,'boundary':4}
        assert len(labels)==len(set(labels))==12
        assert len(sections)==len(expected) and {k:int(v) for k,v in sections}==expected
        assert {k:sum(label.startswith(k+'/') for label in labels) for k in expected}==expected
        marker='PSC1_ORDINARY_ADMISSION_PUBLIC_NATIVE: PASS assertions=12 publicRoutingChanged=true ordinaryAdmission=true'
        assert log.splitlines().count(marker)==1
        inventory={'schema':'psc1-t05-admission-public-native-inventory-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'route':'native',
          'assertions':12,'sectionAssertions':expected,'assertionLabels':labels,
          'logSha256':hashlib.sha256(raw).hexdigest(),
          'publicRoutingChanged':True,'ordinaryAdmission':True,'fullKernel':False,'performanceQualified':False}
        (root/'admission-public-native-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PUBLIC_NATIVE_INVENTORY: PASS assertions=12 groups=3')
        digest=lambda path:{'bytes':len(path.read_bytes()),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
        receipt={'schema':'psc1-t05-admission-public-native-diagnostic-v1',
          'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
          'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'totalProofs':8,
          'proofs':[{'module':module,'count':8,'names':names,
            'source':digest(source),'log':digest(root/'admission-public-proofs.log')}],
          'nativeAssertions':12,'inventory':digest(root/'admission-public-native-inventory.json'),
          'inputs':digest(root/'inputs.json'),'qualified':False,'diagnosticOnly':True,
          'publicRoutingChanged':True,'ordinaryAdmission':True,'fullKernel':False,'performanceQualified':False}
        (root/'diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
        print('PSC1_T05_ADMISSION_PUBLIC_DIAGNOSTIC: PASS '+json.dumps(receipt,separators=(',',':')))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: psc1-t05-admission-public-native-diagnostic-${{ github.run_attempt }}
        path: ${{ runner.temp }}/psc1-t05-admission-public-native/
        if-no-files-found: error
        include-hidden-files: true
