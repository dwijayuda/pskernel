name: PSC1 measured type-key rebuild improvement
on:
  push:
    branches: [feat/psc1-canonical-latency-20261028]
    paths:
      - psc1/standalone/qualify-type-key-latency.mjs
      - .github/workflows/psc1-type-key-latency.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: psc1-type-key-latency-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    defaults:
      run:
        working-directory: psc1
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Parse the measured-change qualification harness
        run: node --check standalone/qualify-type-key-latency.mjs
      - uses: actions/download-artifact@v4
        with:
          name: psc1-independent-qualified-linux-x64-5484a04df34de1bbcfa46a248b6a93ce510035d6
          run-id: 40618697529
          github-token: ${{ github.token }}
          path: psc1/dist/next/qualified
      - uses: actions/download-artifact@v4
        with:
          name: psc1-independent-baseline-5484a04df34de1bbcfa46a248b6a93ce510035d6
          run-id: 40618697529
          github-token: ${{ github.token }}
          path: psc1/dist/next/baseline
      - name: Verify the unchanged qualified distribution before extraction
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const file='dist/next/qualified/psc1-independent-linux-x64.tar.gz';
          const bytes=fs.readFileSync(file);
          assert.equal(bytes.length,46905678);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),'c227da916348087550f696a1b9f8ad0c6faacaad6bd86d6e72244ed4d96d2fe3');
          JS
          tar xzf dist/next/qualified/psc1-independent-linux-x64.tar.gz -C dist/next/qualified
      - name: Rebuild the changed compiler twice and compare identical workloads on this runner
        run: >-
          node --max-old-space-size=4096 standalone/qualify-type-key-latency.mjs
          --toolchain dist/next/qualified/toolchain
          --baseline dist/next/baseline/baseline/B2
          --out dist/next/type-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1-type-key-latency-${{ github.sha }}
          path: psc1/dist/next/type-key/
          if-no-files-found: warn
          retention-days: 90
