name: PSC1 guarded cloud source integration
on:
  push:
    branches: [feature/psc1-typed-errors-20261020]
    paths: [.github/workflows/psc1-typed-error-apply.yml]
permissions:
  contents: write
concurrency:
  group: psc1-typed-error-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'dwijayuda/pskernel' && github.ref == 'refs/heads/feature/psc1-typed-errors-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Execute exact guarded source edits in cloud
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 96a92887598e6672834de7e39ec229dc437a61dd
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/psc1-typed-error-integration.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          assert source.count(marker) == 1
          script = source.split(marker, 1)[1].split('\n          PY\n', 1)[0]
          script = textwrap.dedent(script)
          print('Executing reviewed Python source bytes:', len(script))
          exec(compile(script, 'reviewed-cloud-integration.py', 'exec'))
          p = Path('psc1/packages/syntax/src/Ps/Syntax/ParseProofScript.lean')
          old = '  | .doWhileE condition body rest _ => .doWhileE condition body rest span'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, '  | .doTryE body name handler rest _ => .doTryE body name handler rest span\n'+old))
          p = Path('psc1/packages/compiler/src/Ps/Compiler/Sh1.lean')
          old = '  | PsSyntaxTerm.doWhileE _ _ _ span =>'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, '  | PsSyntaxTerm.doTryE _ _ _ _ span\n'+old))
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psc1
          git commit -m 'feat(psc1): integrate typed catch boundaries and exact-source cross-target tests'
          git push origin HEAD:refs/heads/feature/psc1-typed-errors-20261020
          echo "Integrated head $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
