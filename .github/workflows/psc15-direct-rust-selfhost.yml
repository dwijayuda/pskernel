name: PSC15 Rust backend and optional self-host

on:
  pull_request:
    branches:
      - psc2/selfhost-lean-kernel
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/psc15-direct-rust-selfhost.yml"
  workflow_dispatch:
    inputs:
      legacy_selfhost:
        description: 'Run historical Rust compiler self-application and fixed point'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: psc15-direct-rust-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
          node --version
          test "$(rustc --version)" = "rustc 1.98.1 (48a229cea 2026-09-01)"
          test "$(cargo --version)" = "cargo 1.98.1 (797e8a9bc 2026-08-05)"

      - name: Enforce Rust portable self-host source profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_selfhost }}
        working-directory: psc15selfhost
        run: |
          npm run check:portable-selfhost-profile
          node scripts/portable-selfhost-contract.mjs --package backend-rust
          node scripts/portable-selfhost-contract.mjs --package driver-rust

      - name: Build Rust backend and compiler evidence
        working-directory: psc15selfhost
        run: |
          lake build \
            psc1 \
            PsBackendRust \
            PsDriverRust \
            psc1_backend_rust_tests \
            psc1_backend_rust_source_tests \
            psc1_backend_rust_let_function_result_tests \
            psc1_backend_rust_fixture

      - name: Run Rust semantic corpus
        working-directory: psc15selfhost
        run: |
          lake exe psc1_backend_rust_tests
          lake exe psc1_backend_rust_source_tests
          lake exe psc1_backend_rust_let_function_result_tests

      - name: Cargo-check generated Rust fixture
        working-directory: psc15selfhost
        run: npm run test:backend-rust-cargo

      - name: Analyze and compile direct Rust whole compiler
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_selfhost }}
        timeout-minutes: 20
        working-directory: psc15selfhost
        run: npm run test:direct-rust-whole-compiler

      - name: Prove native Rust whole-compiler fixed point
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_selfhost }}
        timeout-minutes: 40
        working-directory: psc15selfhost
        run: npm run test:direct-rust-selfhost

