name: PSC15 direct Rust self-host

on:
  pull_request:
    branches:
      - psc2/selfhost-lean-kernel
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/psc15-direct-rust-selfhost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc15-direct-rust-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
          node --version
          rustc --version
          cargo --version

      - name: Enforce Rust portable self-host source profile
        working-directory: psc15selfhost
        run: |
          npm run check:portable-selfhost-profile
          node scripts/portable-selfhost-contract.mjs --package backend-rust
          node scripts/portable-selfhost-contract.mjs --package driver-rust

      - name: Build Rust backend and compiler evidence
        working-directory: psc15selfhost
        run: |
          lake build \
            psc1 \
            PsBackendRust \
            PsDriverRust \
            psc1_backend_rust_tests \
            psc1_backend_rust_source_tests \
            psc1_backend_rust_let_function_result_tests \
            psc1_backend_rust_fixture

      - name: Run Rust semantic corpus
        working-directory: psc15selfhost
        run: |
          lake exe psc1_backend_rust_tests
          lake exe psc1_backend_rust_source_tests
          lake exe psc1_backend_rust_let_function_result_tests

      - name: Cargo-check generated Rust fixture
        working-directory: psc15selfhost
        run: npm run test:backend-rust-cargo

      - name: Analyze and compile direct Rust whole compiler
        timeout-minutes: 25
        working-directory: psc15selfhost
        run: npm run test:direct-rust-whole-compiler
