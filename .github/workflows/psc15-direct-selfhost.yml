name: PSC15 direct self-host fixed points

on:
  pull_request:
    branches:
      - psc2/selfhost-lean-kernel
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/psc15-direct-selfhost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc15-direct-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
          node --version

      - name: Build direct self-host closure
        working-directory: psc15selfhost
        run: |
          lake build \
            psc1 \
            psc1_ir_specialize_tests \
            psc1_erasure_tests

      - name: Run shared specialization and erasure regressions
        working-directory: psc15selfhost
        run: |
          lake exe psc1_ir_specialize_tests
          lake exe psc1_erasure_tests

      - name: Prove direct JavaScript whole-compiler fixed point
        timeout-minutes: 15
        working-directory: psc15selfhost
        run: npm run test:direct-js-selfhost

      - name: Build and instantiate direct Wasm whole compiler
        working-directory: psc15selfhost
        run: npm run test:direct-wasm-whole-compiler

      - name: Prove direct Wasm whole-compiler fixed point
        working-directory: psc15selfhost
        run: npm run test:direct-wasm-selfhost
