name: PSC15 self-host cloud CI

on:
  push:
    branches:
      - psc2/selfhost-lean-kernel
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/psc15selfhost-cloud.yml"
  pull_request:
    branches:
      - psc2/selfhost-lean-kernel
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/psc15selfhost-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc15-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned checked TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/psc15-cloud-tools --no-audit --no-fund typescript@7.0.2
          echo /tmp/psc15-cloud-tools/node_modules/.bin >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
          node --version

      - name: Audit portable self-host source
        working-directory: psc15selfhost
        run: node check-psc1-source.mjs --all-portable

      - name: Check workspace and bootstrap composition policy
        working-directory: psc15selfhost
        run: |
          npm run check:workspace
          npm run check:layout
          npm run check:runtime-semantics
          npm run test:bootstrap-closure-contract
          npm run test:bootstrap-root-minimality

      - name: Build semantic compiler layers
        working-directory: psc15selfhost
        run: |
          lake build \
            PsCompilerIr \
            PsErasure \
            PsCompiler \
            PsBackendTs \
            PsBackendJs \
            PsDriverTs \
            PsBackendRust \
            PsDriverRust \
            psc1 \
            psc1_erasure_tests \
            psc2_minimal_selfhost_tests \
            psc1_backend_ts_tests \
            psc1_backend_js_tests \
            psc1_backend_js_diff_fixture \
            psc1_backend_rust_source_tests

      - name: Run VerifiedIR and erasure corpus
        working-directory: psc15selfhost
        run: lake exe psc1_erasure_tests

      - name: Run minimal self-host corpus
        working-directory: psc15selfhost
        run: lake exe psc2_minimal_selfhost_tests

      - name: Run TypeScript backend corpus
        working-directory: psc15selfhost
        run: lake exe psc1_backend_ts_tests

      - name: Run direct JavaScript backend unit corpus
        working-directory: psc15selfhost
        run: lake exe psc1_backend_js_tests

      - name: Differential direct JavaScript against TS to tsc
        working-directory: psc15selfhost
        run: node scripts/backend-js-differential.test.mjs

      - name: Run Rust source driver corpus
        working-directory: psc15selfhost
        run: lake exe psc1_backend_rust_source_tests

      - name: Build checked Lean provider integration
        working-directory: psc15selfhost/lean-checked
        run: |
          lake build \
            psc2_lean_checked_seed \
            psc2_lean_kernel_provider \
            psc2_lean_kernel_provider_tests

      - name: Run checked Lean provider integration tests
        working-directory: psc15selfhost/lean-checked
        run: |
          lake exe psc2_lean_kernel_provider_tests
          .lake/build/bin/psc2_lean_checked_seed --test

      - name: Run checked-host r3/toolchain regression slice
        working-directory: psc15selfhost
        run: |
          node --test             scripts/checked-algebraic-build.test.mjs             scripts/checked-build.test.mjs             scripts/checked-enum-build.test.mjs             scripts/checked-projection-build.test.mjs             scripts/checked-seed-session.test.mjs             scripts/checked-sum-build.test.mjs             scripts/checked-text-build.test.mjs             scripts/checked-selfhost-preflight.test.mjs

      - name: Run self-host source isolation corpus
        working-directory: psc15selfhost
        run: node scripts/selfhost-source-isolation-tests.mjs

      - name: Run native workspace isolation corpus
        working-directory: psc15selfhost
        run: node scripts/native-workspace-isolation.test.mjs

      - name: Enforce semantic boundaries
        working-directory: psc15selfhost
        run: npm run check:semantic-boundaries

      - name: Self-check changed compiler IR source
        working-directory: psc15selfhost
        run: lake exe psc1 check packages/compiler-ir/src/Ps/CompilerIr/Model.lean

      - name: Self-check changed compiler API source
        working-directory: psc15selfhost
        run: lake exe psc1 check packages/compiler/src/Ps/Compiler/Api.lean

      - name: Self-check bootstrap composition root
        working-directory: psc15selfhost
        run: lake exe psc1 check packages/bootstrap/src/Ps/Bootstrap/SelfHost.lean
