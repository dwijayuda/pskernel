name: PSKernel Core generated fixed point (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc1kernel-core-fixed-point-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-fixed-point:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash
    env:
      PSC_TYPESCRIPT_CLI: /tmp/psc1kernel-fixed-point/node_modules/typescript/bin/tsc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Lean and TypeScript
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          npm install --prefix /tmp/psc1kernel-fixed-point \
            --no-audit --no-fund typescript@5.8.3
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b
          node "$PSC_TYPESCRIPT_CLI" --version | grep -Fx "Version 5.8.3"

      - name: Build compiler fixed point
        run: |
          set -euo pipefail
          npm run fixed-point
          test -s dist/bootstrap/packages/compiler/index.js
          test -s dist/bootstrap/packages/compiler/index.ts

      - name: Build kernel generated fixed point
        run: |
          set -euo pipefail
          node scripts/psc1kernel-core-resume.mjs \
            dist/bootstrap/packages/compiler/index.js \
            dist/kernel-core-ci \
            | tee dist/kernel-core-ci.log
          grep -F "PSC1KERNEL_SELFHOST_RESUMABLE_FIXED_POINT: PASS" \
            dist/kernel-core-ci.log
          grep -F "PSC1KERNEL_GENERATED_SMOKE: PASS" \
            dist/kernel-core-ci.log

      - name: Verify current fixed point and evidence checkpoint
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const evidence = JSON.parse(
            fs.readFileSync(
              'packages/pskernel-core/SELFHOST_EVIDENCE.json',
              'utf8',
            ),
          );
          const receipt = JSON.parse(
            fs.readFileSync(
              'dist/kernel-core-ci/selfhost-receipt.json',
              'utf8',
            ),
          );
          const manifest = JSON.parse(
            fs.readFileSync(
              'dist/kernel-core-ci/bootstrap/workspace/.proofscript-bootstrap.json',
              'utf8',
            ),
          );

          if (
            receipt.fixedPoint !== true ||
            receipt.sourceFixedPoint !== true ||
            receipt.selfhostArtifact !== true
          ) {
            throw new Error('PSC1KERNEL_SELFHOST_CURRENT_FIXED_POINT_INVALID');
          }

          for (const required of [
            'packages/pskernel-core/src/Ps/KernelCore/SelfHost.ps',
            'packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Mutual/Admission.ps',
            'packages/pskernel-core/src/Ps/KernelCore/Admission/Inductive/Nested/Admission.ps',
          ]) {
            if (!manifest.sources.includes(required)) {
              throw new Error(
                `PSC1KERNEL_SELFHOST_CURRENT_SOURCE_MISSING: ${required}`,
              );
            }
          }

          console.log('PSC1KERNEL_SELFHOST_CURRENT_FIXED_POINT: PASS');
          console.log(`current.sources=${manifest.sourceCount}`);
          console.log(`current.closure.sha256=${receipt.closureSha256}`);
          console.log(`current.typescript.sha256=${receipt.bootstrapTsSha256}`);
          console.log(`current.javascript.sha256=${receipt.bootstrapJsSha256}`);

          const currentHead = process.env.GITHUB_SHA ?? '';
          const exactCheckpoint =
            currentHead === evidence.semanticCommit ||
            currentHead === evidence.smokeCommit;

          if (exactCheckpoint) {
            const expected = {
              sourceCount: evidence.sourceCount,
              closureSha256: evidence.closureSha256,
              typescriptSha256: evidence.typescriptSha256,
              javascriptSha256: evidence.javascriptSha256,
            };
            const actual = {
              sourceCount: manifest.sourceCount,
              closureSha256: receipt.closureSha256,
              typescriptSha256: receipt.bootstrapTsSha256,
              javascriptSha256: receipt.bootstrapJsSha256,
            };
            for (const key of Object.keys(expected)) {
              if (expected[key] !== actual[key]) {
                throw new Error(
                  `PSC1KERNEL_SELFHOST_EVIDENCE_MISMATCH: ${key} expected=${expected[key]} actual=${actual[key]}`,
                );
              }
            }
            console.log('PSC1KERNEL_SELFHOST_EVIDENCE_CHECKPOINT: PASS');
          } else {
            console.log(
              `PSC1KERNEL_SELFHOST_EVIDENCE_CHECKPOINT: HISTORICAL current=${currentHead} semantic=${evidence.semanticCommit} smoke=${evidence.smokeCommit}`,
            );
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc1kernel-core-fixed-point-${{ github.sha }}
          path: |
            psc15selfhost/dist/kernel-core-ci.log
            psc15selfhost/dist/kernel-core-ci/selfhost-receipt.json
            psc15selfhost/dist/kernel-core-ci/bootstrap/workspace/.proofscript-bootstrap.json
            psc15selfhost/dist/kernel-core-ci/selfhost/workspace/.proofscript-selfhost.json
          retention-days: 14
          if-no-files-found: warn
