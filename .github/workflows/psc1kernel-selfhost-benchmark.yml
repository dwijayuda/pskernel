name: PSC1Kernel selfhost benchmark

on:
  push:
    branches:
      - psc2/psc1kernel-selfhost-portable
    paths:
      - psc15selfhost/packages/pskernel-selfhost/**
      - psc15selfhost/test/PsKernelSelfHostBench.lean
      - psc15selfhost/lakefile.lean
      - .github/workflows/psc1kernel-selfhost-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b

      - name: Build benchmark
        run: |
          set -euo pipefail
          lake build psc1_kernel_selfhost_bench

      - name: Run benchmark
        run: |
          set -euo pipefail
          lake exe psc1_kernel_selfhost_bench | tee /tmp/pskernel-selfhost-bench.log
          {
            echo '## PSKernel native benchmark'
            echo
            echo 'Pinned Lean: 4.34.0 (293d5d0c0c3f3dded4688b3ccd6a33939ac5102b)'
            echo
            echo '~~~text'
            cat /tmp/pskernel-selfhost-bench.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark log
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-selfhost-benchmark
          path: /tmp/pskernel-selfhost-bench.log
          if-no-files-found: error
