name: PSC1Kernel portable selfhost

on:
  push:
    branches:
      - psc2/psc1kernel-selfhost-portable
    paths:
      - psc15selfhost/packages/pskernel-selfhost/**
      - psc15selfhost/packages/pskernel/PSC1Kernel/**
      - psc15selfhost/scripts/psc1-source-profile.mjs
      - psc15selfhost/scripts/psc1kernel-reference-inventory.mjs
      - psc15selfhost/scripts/psc1kernel-port-batch-check.mjs
      - psc15selfhost/check-psc1-source.mjs
      - psc15selfhost/lakefile.lean
      - psc15selfhost/test/PsKernelSelfHostFoundationTests.lean
      - .github/workflows/psc1kernel-selfhost-portable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b

      - name: Inventory reference incompatibilities in one pass
        run: |
          set -euo pipefail
          node scripts/psc1kernel-reference-inventory.mjs
          node scripts/psc1kernel-reference-inventory.mjs --json > /tmp/psc1kernel-reference-inventory.json
          cat /tmp/psc1kernel-reference-inventory.json

      - name: Enforce the proven PSC1 profile on all portable packages
        run: |
          set -euo pipefail
          node check-psc1-source.mjs --all-portable

      - name: Build proven PSC1 compiler
        run: |
          set -euo pipefail
          lake build psc1

      - name: PSC1-check all portable kernel modules
        run: |
          set -euo pipefail
          node scripts/psc1kernel-port-batch-check.mjs

      - name: Build portable kernel and differential tests
        run: |
          set -euo pipefail
          lake build PsKernelSelfHost psc1_kernel_selfhost_foundation_tests

      - name: Differential-test portable foundation against reference
        run: |
          set -euo pipefail
          lake exe psc1_kernel_selfhost_foundation_tests

      - name: Require canonical ProofScript translation
        run: |
          set -euo pipefail
          lake exe psc1 translate             packages/pskernel-selfhost/src/PsKernel/Name.lean             --to ps             --out /tmp/PsKernel.Name.ps
          test -s /tmp/PsKernel.Name.ps
          lake exe psc1 check /tmp/PsKernel.Name.ps
