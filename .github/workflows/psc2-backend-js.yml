name: PSC2 direct JS backend
on:
  push:
    branches: [psc2/backend-js]
    paths: ['psc15selfhost/**', '.github/workflows/psc2-backend-js.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  literal-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed regression fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new, 1))

          def insert_field(path, block_start, block_end, old, new):
              text = path.read_text()
              start = text.index(block_start)
              end = text.index(block_end, start)
              block = text[start:end]
              if new.strip() in block:
                  raise SystemExit(f"{path}: field already present in {block_start.strip()}")
              count = block.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor in {block_start.strip()}, found {count}")
              block = block.replace(old, old + new, 1)
              path.write_text(text[:start] + block + text[end:])

          printer = Path('psc15selfhost/packages/syntax/src/Ps/Syntax/PrintProofScript.lean')
          text = printer.read_text()
          start = text.index('      | .forallE binders body _ =>\n')
          end = text.index('      | .letE name type value body _ =>\n', start)
          block = text[start:end]
          old = '''                  | Except.ok name =>
                      match
                          smaller type with
                      | Except.error error => Except.error error
                      | Except.ok printedType =>
                          let delimiters :=
                            psPrintBinderDelimiters head.kind;
                          Except.ok
                            (psPrintProofScriptConcat5
                              delimiters.fst
                              name
                              " : "
                              printedType
                              delimiters.snd);
'''
          new = '''                  | Except.ok name =>
                      match
                          smaller type with
                      | Except.error error => Except.error error
                      | Except.ok printedType =>
                          let anonymousExplicit :=
                            match head.kind with
                            | PsSyntaxBinderKind.explicit =>
                                psStringEq name "_"
                            | _ => false;
                          if anonymousExplicit then
                            Except.ok
                              (psPrintProofScriptConcat3
                                "("
                                printedType
                                ")")
                          else
                            let delimiters :=
                              psPrintBinderDelimiters head.kind;
                            Except.ok
                              (psPrintProofScriptConcat5
                                delimiters.fst
                                name
                                " : "
                                printedType
                                delimiters.snd);
'''
          if block.count(old) != 1:
              raise SystemExit('PrintProofScript forall binder shape changed')
          block = block.replace(old, new, 1)
          printer.write_text(text[:start] + block + text[end:])

          bootstrap = Path('psc15selfhost/test/BootstrapTests.lean')
          insert_field(
              bootstrap,
              '  let inductiveInfo : PsInductiveInfo := {\n',
              '  let constructorInfo : PsConstructorInfo := {\n',
              '    constructors := [ctorName]\n',
              '    isStructure := false\n')
          insert_field(
              bootstrap,
              '  let constructorInfo : PsConstructorInfo := {\n',
              '  let recursorInfo : PsRecursorInfo := {\n',
              '    numFields := 0\n',
              '    recursiveFields := []\n')
          insert_field(
              bootstrap,
              '  let indInfo : PsInductiveInfo := {\n',
              '  let leftInfo : PsConstructorInfo := {\n',
              '    constructors := [leftName, rightName]\n',
              '    isStructure := false\n')
          insert_field(
              bootstrap,
              '  let leftInfo : PsConstructorInfo := {\n',
              '  let rightInfo : PsConstructorInfo := {\n',
              '    numFields := 0\n',
              '    recursiveFields := []\n')
          insert_field(
              bootstrap,
              '  let rightInfo : PsConstructorInfo := {\n',
              '  let recInfo : PsRecursorInfo := {\n',
              '    numFields := 0\n',
              '    recursiveFields := []\n')
          insert_field(
              bootstrap,
              '  let boxInfo : PsInductiveInfo := {\n',
              '  let ctorInfo : PsConstructorInfo := {\n',
              '    constructors := [ctorName]\n',
              '    isStructure := false\n')
          insert_field(
              bootstrap,
              '  let ctorInfo : PsConstructorInfo := {\n',
              '  let recInfo : PsRecursorInfo := {\n',
              '    numFields := 1\n',
              '    recursiveFields := []\n')

          coverage = Path('psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Coverage.lean')
          replace_once(
              coverage,
              '  | PsVerifiedIrIntrinsic.intLt => "Int.lt"\n'
              '  | PsVerifiedIrIntrinsic.boolNot => "Bool.not"\n',
              '  | PsVerifiedIrIntrinsic.intLt => "Int.lt"\n'
              '  | PsVerifiedIrIntrinsic.intRepr => "Int.repr"\n'
              '  | PsVerifiedIrIntrinsic.boolNot => "Bool.not"\n')
          replace_once(
              coverage,
              '  | PsVerifiedIrIntrinsic.intLt => 2\n'
              '  | PsVerifiedIrIntrinsic.boolNot => 1\n',
              '  | PsVerifiedIrIntrinsic.intLt => 2\n'
              '  | PsVerifiedIrIntrinsic.intRepr => 1\n'
              '  | PsVerifiedIrIntrinsic.boolNot => 1\n')

          rust_expr = Path('psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Expr.lean')
          replace_once(
              rust_expr,
              '                      ") ("\n',
              '                      ")("\n')
          PY
          git diff --check
          git diff -- psc15selfhost/packages/syntax/src/Ps/Syntax/PrintProofScript.lean psc15selfhost/test/BootstrapTests.lean psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Coverage.lean psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Expr.lean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/syntax/src/Ps/Syntax/PrintProofScript.lean psc15selfhost/test/BootstrapTests.lean psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Coverage.lean psc15selfhost/packages/backend-rust/src/Ps/BackendRust/Expr.lean
          git commit -m "fix(psc15): repair backend-js baseline regressions"
          git push origin HEAD:psc2/backend-js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install TypeScript oracle
        run: npm install --prefix /tmp/psc-ts typescript@5.8.3 --ignore-scripts
      - name: Execute literal and rejection fixtures
        working-directory: psc15selfhost
        run: PATH=/tmp/psc-ts/node_modules/.bin:$PATH node scripts/backend-js-tests.mjs
      - name: Structural isolation
        working-directory: psc15selfhost
        env:
          # Parallel JS work checks the structural contract, not the parent's
          # one-shot TS fixed-point probe. The user authorized this separation.
          PSC2_FIXED_POINT_PROBE_ACTIVE: '1'
        run: |
          npm run check:workspace
          npm run check:source:all
          npm run check:backend-js-dependencies
          npm run check:bootstrap-closure
          npm run check:ir-neutrality
      - name: PSC1 source and canonical PS admission
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -o pipefail
          PATH=/tmp/psc-ts/node_modules/.bin:$PATH npm run check:backend-js-source 2>&1 | tee /tmp/backend-js-source.log
      - name: Upload PSC1 source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-js-source-diagnostics
          path: |
            /tmp/backend-js-source.log
            /tmp/backend-js-source-BackendJs.ps
          if-no-files-found: ignore
      - name: Bootstrap regression
        if: always()
        working-directory: psc15selfhost
        run: npm run test:bootstrap
      - name: Compiler regression
        if: always()
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -o pipefail
          npm run test:regression 2>&1 | tee /tmp/psc1-tests.log
      - name: Upload compiler regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-tests-log
          path: /tmp/psc1-tests.log
          if-no-files-found: ignore
      - name: Extension regression
        if: always()
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -o pipefail
          npm run test:extensions 2>&1 | tee /tmp/psc1-extension-tests.log
      - name: Upload extension regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc1-extension-tests-log
          path: /tmp/psc1-extension-tests.log
          if-no-files-found: ignore
