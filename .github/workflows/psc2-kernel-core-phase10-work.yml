name: PSC2 KernelCore Phase 10 work

on:
  push:
    branches:
      - psc2/kernel-core-phase10-recursor-work
    paths:
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/test/KernelCoreRecursor*.lean
      - psc15selfhost/test/KernelCoreEqRecursorCompatibilityTests.lean
      - psc15selfhost/lakefile.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - .github/workflows/psc2-kernel-core-phase10-work.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build recursor metadata dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PSC1KernelReferenceFoundations

      - name: Phase 10 recursor metadata
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorMetadataTests.lean

      - name: Existing declaration parity
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_declaration_parity_tests

      - name: Phase 10 recursor admission diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          python - <<'PY'
          from pathlib import Path
          source = Path('test/KernelCoreRecursorAdmissionParityTests.lean').read_text()
          prefix = source.split('\ndef main : IO Unit := do', 1)[0]
          diagnostic = prefix + '''
          
          def psDiagBasePrefix : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some _ => true

          def psDiagBaseCtorInst : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some openedPrefix =>
                let params := psKernelCoreExprListTake 1 openedPrefix.values;
                match psKernelCoreRecursorInstantiateForallPrefix params psKcRecBaseCtor.base.type with
                | PsKernelCoreOption.none => false
                | PsKernelCoreOption.some _ => true

          def psDiagBaseFields : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some openedPrefix =>
                let params := psKernelCoreExprListTake 1 openedPrefix.values;
                match psKernelCoreRecursorInstantiateForallPrefix params psKcRecBaseCtor.base.type with
                | PsKernelCoreOption.none => false
                | PsKernelCoreOption.some ctorFields =>
                    match psKernelCoreRecursorOpenMatchingFields
                        1 ctorFields openedPrefix.rest openedPrefix.nextSeed with
                    | PsKernelCoreOption.none => false
                    | PsKernelCoreOption.some _ => true

          def psDiagBaseHead : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some openedPrefix =>
                let params := psKernelCoreExprListTake 1 openedPrefix.values;
                match psKernelCoreRecursorInstantiateForallPrefix params psKcRecBaseCtor.base.type with
                | PsKernelCoreOption.none => false
                | PsKernelCoreOption.some ctorFields =>
                    match psKernelCoreRecursorOpenMatchingFields
                        1 ctorFields openedPrefix.rest openedPrefix.nextSeed with
                    | PsKernelCoreOption.none => false
                    | PsKernelCoreOption.some opened =>
                        match psKernelCoreExprAppHead opened.ctorResult with
                        | PsKernelCoreExpr.const familyName _ =>
                            psKernelCoreNameEq familyName psKcRecFamilyInfo.base.name
                        | _ => false

          def psDiagBaseParams : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some openedPrefix =>
                let params := psKernelCoreExprListTake 1 openedPrefix.values;
                match psKernelCoreRecursorInstantiateForallPrefix params psKcRecBaseCtor.base.type with
                | PsKernelCoreOption.none => false
                | PsKernelCoreOption.some ctorFields =>
                    match psKernelCoreRecursorOpenMatchingFields
                        1 ctorFields openedPrefix.rest openedPrefix.nextSeed with
                    | PsKernelCoreOption.none => false
                    | PsKernelCoreOption.some opened =>
                        let resultArgs := psKernelCoreExprAppArgs opened.ctorResult;
                        psKernelCoreRecursorExprListEq
                          (psKernelCoreExprListTake 1 resultArgs) params

          def psDiagBaseFinal : Bool :=
            match psKernelCoreRecursorOpenForalls 2 psKcRecursorInfo.base.type 0 with
            | PsKernelCoreOption.none => false
            | PsKernelCoreOption.some openedPrefix =>
                let params := psKernelCoreExprListTake 1 openedPrefix.values;
                match psKernelCoreExprListGet openedPrefix.values 1 with
                | PsKernelCoreOption.none => false
                | PsKernelCoreOption.some motive =>
                    match psKernelCoreRecursorInstantiateForallPrefix params psKcRecBaseCtor.base.type with
                    | PsKernelCoreOption.none => false
                    | PsKernelCoreOption.some ctorFields =>
                        match psKernelCoreRecursorOpenMatchingFields
                            1 ctorFields openedPrefix.rest openedPrefix.nextSeed with
                        | PsKernelCoreOption.none => false
                        | PsKernelCoreOption.some opened =>
                            let resultArgs := psKernelCoreExprAppArgs opened.ctorResult;
                            let indices := psKernelCoreRecursorExprListDrop 1 resultArgs;
                            let ctorArgs := psKernelCoreExprListAppend params opened.fields;
                            let major := psKernelCoreRecursorApplyArgs
                              (PsKernelCoreExpr.const psKcRecBase PsKernelCoreList.nil) ctorArgs;
                            let expected := PsKernelCoreExpr.app
                              (psKernelCoreRecursorApplyArgs motive indices) major;
                            psKernelCoreExprEq opened.minorResult expected

          def main : IO Unit := do
            if psKcRecursorAdmissionPositive then IO.println "PHASE10_ADMISSION_POSITIVE=PASS" else IO.println "PHASE10_ADMISSION_POSITIVE=FAIL"
            if psKcZeroConstructorRecursor then IO.println "PHASE10_ADMISSION_EMPTY=PASS" else IO.println "PHASE10_ADMISSION_EMPTY=FAIL"
            if psRefRecursorAdmissionPositive then IO.println "PHASE10_ADMISSION_REFERENCE=PASS" else IO.println "PHASE10_ADMISSION_REFERENCE=FAIL"
            if psKernelCoreRecursorMinorMatchesConstructor psKcRecursorInfo psKcRecFamilyInfo psKcRecBaseCtor 0 then IO.println "PHASE10_MINOR_BASE=PASS" else IO.println "PHASE10_MINOR_BASE=FAIL"
            if psKernelCoreRecursorMinorMatchesConstructor psKcRecursorInfo psKcRecFamilyInfo psKcRecExtraCtor 1 then IO.println "PHASE10_MINOR_EXTRA=PASS" else IO.println "PHASE10_MINOR_EXTRA=FAIL"
            if psDiagBasePrefix then IO.println "PHASE10_STAGE_PREFIX=PASS" else IO.println "PHASE10_STAGE_PREFIX=FAIL"
            if psDiagBaseCtorInst then IO.println "PHASE10_STAGE_CTOR_INST=PASS" else IO.println "PHASE10_STAGE_CTOR_INST=FAIL"
            if psDiagBaseFields then IO.println "PHASE10_STAGE_FIELDS=PASS" else IO.println "PHASE10_STAGE_FIELDS=FAIL"
            if psDiagBaseHead then IO.println "PHASE10_STAGE_HEAD=PASS" else IO.println "PHASE10_STAGE_HEAD=FAIL"
            if psDiagBaseParams then IO.println "PHASE10_STAGE_PARAMS=PASS" else IO.println "PHASE10_STAGE_PARAMS=FAIL"
            if psDiagBaseFinal then IO.println "PHASE10_STAGE_FINAL=PASS" else IO.println "PHASE10_STAGE_FINAL=FAIL"
          '''
          Path('/tmp/KernelCoreRecursorAdmissionDiagnostics.lean').write_text(diagnostic)
          PY
          lake env lean --run /tmp/KernelCoreRecursorAdmissionDiagnostics.lean

      - name: Phase 10 recursor admission
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorAdmissionParityTests.lean

      - name: Phase 10 recursor rejection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorRejectionDiagnostics.lean

      - name: Phase 10 recursor rejection matrix
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorRejectionTests.lean

      - name: Phase 10 forged minor rejection
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorForgedMinorRejectionTests.lean

      - name: Phase 10 recursor reduction parity
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorReductionParityTests.lean

      - name: Phase 10 Eq recursor compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreEqRecursorCompatibilityTests.lean

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs
