name: PSC2 KernelCore Phase 10 work

on:
  push:
    branches:
      - psc2/kernel-core-phase10-recursor-work
    paths:
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/test/KernelCoreRecursor*.lean
      - psc15selfhost/test/KernelCoreEqRecursorCompatibilityTests.lean
      - psc15selfhost/lakefile.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - .github/workflows/psc2-kernel-core-phase10-work.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build recursor metadata dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PSC1KernelReferenceFoundations

      - name: Phase 10 recursor metadata
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorMetadataTests.lean

      - name: Existing declaration parity
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_declaration_parity_tests

      - name: Phase 10 recursor admission
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorAdmissionParityTests.lean

      - name: Phase 10 recursor rejection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorRejectionDiagnostics.lean

      - name: Phase 10 recursor rejection matrix
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorRejectionTests.lean

      - name: Phase 10 recursor reduction diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          sed 's/^def main : IO Unit := do$/def psKcRecursorReductionOriginalMain : IO Unit := do/' \
            test/KernelCoreRecursorReductionParityTests.lean \
            > RecursorReductionDiagnostics.generated.lean
          cat >> RecursorReductionDiagnostics.generated.lean <<'LEAN'

          def psKcRecRedReport (label : String) (value : Bool) : IO Unit := do
            if value then
              IO.println (label ++ "=PASS")
            else
              IO.println (label ++ "=FAIL")

          def main : IO Unit := do
            psKcRecRedReport "DIRECT_KERNEL" psKcRecRedDirectKernel
            psKcRecRedReport "REFERENCE_DIRECT" psRefRecRedDirect
            psKcRecRedReport "SYNTHETIC_ORDERING" psKcRecRedSyntheticOrdering
            psKcRecRedReport "MAJOR_WHNF" psKcRecRedMajorWhnf
            psKcRecRedReport "UNDERAPPLIED" psKcRecRedUnderapplied
            psKcRecRedReport "WRONG_MAJOR" psKcRecRedWrongMajor
            psKcRecRedReport "FOREIGN_MAJOR" psKcRecRedForeignMajor
            psKcRecRedReport "MISSING_RULE" psKcRecRedMissingRule
            psKcRecRedReport "SHORT_CONSTRUCTOR" psKcRecRedShortConstructor
            psKcRecRedReport "UNIVERSE_INSTANTIATION" psKcRecRedUniverseInstantiation
            psKcRecRedReport "UNIVERSE_MISMATCH" psKcRecRedUniverseMismatch
            psKcRecRedReport "CONFIGURED_RESOURCES" psKcRecRedConfiguredResources
            psKcRecRedReport "BUDGET" psKcRecRedBudget
          LEAN
          lake env lean --run RecursorReductionDiagnostics.generated.lean
          rm RecursorReductionDiagnostics.generated.lean

      - name: Phase 10 recursor reduction parity
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorReductionParityTests.lean

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs
