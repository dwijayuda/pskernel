# Final Phase-12 acceptance gate after the corrected differential oracle-contract audit.
name: PSC2 KernelCore Phase 12 acceptance

on:
  push:
    branches:
      - psc2/kernel-core-phase12-recursive-recursor
    paths:
      - .github/workflows/psc2-kernel-core-phase12-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Phase 12 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PSC1KernelReferenceFoundations

      - name: Phase 1 through Phase 12 aggregate assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase12

      - name: Existing PSC2 full regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check
