name: PSC2 KernelCore Phase 12 acceptance

on:
  push:
    branches:
      - psc2/kernel-core-phase12-recursive-recursor
    paths:
      - .github/workflows/psc2-kernel-core-phase12-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Phase 12 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PSC1KernelReferenceFoundations

      - name: Phase 12 direct recursive recursor admission
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveRecursorAdmissionTests.lean

      - name: Phase 12 recursive recursor rejection matrix
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveRecursorRejectionTests.lean

      - name: Phase 12 functional recursive recursor admission
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveRecursorFunctionalAdmissionTests.lean

      - name: Phase 12 indexed recursive recursor admission
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveRecursorIndexedAdmissionTests.lean

      - name: Phase 10 ordinary recursor admission guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorAdmissionParityTests.lean

      - name: Phase 10 forged-minor guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorForgedMinorRejectionTests.lean

      - name: Phase 10 recursor reduction guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursorReductionParityTests.lean

      - name: Phase 11 recursive-inductive admission guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveInductiveAdmissionParityTests.lean

      - name: Phase 11 recursive-inductive rejection guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreRecursiveInductiveRejectionTests.lean

      - name: Bootstrap closure remains isolated
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-bootstrap-closure.mjs

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs

      - name: KernelCore trusted-size report
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/report-kernel-core-size.mjs

      - name: Existing PSC2 full regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check
