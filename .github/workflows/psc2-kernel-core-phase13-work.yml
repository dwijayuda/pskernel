# Re-run focused Phase 13 after the close-binder recursion portability fix.
name: PSC2 KernelCore Phase 13 work

on:
  push:
    branches:
      - psc2/kernel-core-phase13-checkedcore-shadow-work
    paths:
      - psc15selfhost/packages/compiler/**
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/packages/meta/**
      - psc15selfhost/packages/environment/**
      - psc15selfhost/packages/elab/**
      - psc15selfhost/packages/backend-ts/**
      - psc15selfhost/test/CompilerKernelShadow*.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-bootstrap-closure.mjs
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - .github/workflows/psc2-kernel-core-phase13-work.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase13-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Phase 13 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PsCompiler PsBackendTs PSC1KernelReferenceFoundations

      - name: Phase 13 bootstrap closure includes KernelCore
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:bootstrap-closure

      - name: Phase 13 KernelCore shadow positive matrix
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/CompilerKernelShadowTests.lean

      - name: Phase 13 KernelCore shadow rejection matrix
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/CompilerKernelShadowRejectionTests.lean

      - name: Phase 13 shadow noninterference
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake env lean --run test/CompilerKernelShadowNoninterferenceTests.lean

      - name: Phase 13 PSC1 bootstrap compiler source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run bootstrap:check

      - name: Phase 1 through Phase 12 inherited assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase12

      - name: Existing minimal self-host guard
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_minimal_selfhost_tests

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs
