name: PSC2 KernelCore Phase 9 work

on:
  push:
    branches:
      - psc2/kernel-core-phase9-quot-work
    paths:
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/test/KernelCoreQuot*.lean
      - psc15selfhost/lakefile.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - .github/workflows/psc2-kernel-core-phase9-work.yml

permissions:
  contents: read

jobs:
  quot-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build KernelCore and reference libraries
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build PsKernelCore PSC1KernelReferenceFoundations

      - name: Quot metadata parity
        shell: bash
        run: |
          set -o pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreQuotMetadataTests.lean 2>&1 | tee ../phase9-quot-metadata.log

      - name: Quot admission parity
        shell: bash
        run: |
          set -o pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreQuotAdmissionParityTests.lean 2>&1 | tee ../phase9-quot-admission.log

      - name: Quot rejection matrix
        shell: bash
        run: |
          set -o pipefail
          cd psc15selfhost
          lake env lean --run test/KernelCoreQuotRejectionTests.lean 2>&1 | tee ../phase9-quot-rejections.log

      - name: Existing declaration parity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_declaration_parity_tests

      - name: KernelCore PSC1 source profile
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:kernel-core-source

      - name: Upload Quot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-quot-diagnostics
          path: |
            phase9-quot-metadata.log
            phase9-quot-admission.log
            phase9-quot-rejections.log
