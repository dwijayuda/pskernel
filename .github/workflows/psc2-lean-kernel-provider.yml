name: PSC2 Lean kernel provider

on:
  push:
    branches:
      - psc2/pskernel-lean-provider
    paths:
      - psc15selfhost/packages/pskernel-lean/**
      - psc15selfhost/lakefile.lean
      - psc15selfhost/lean-toolchain
      - psc15selfhost/packages/backend-ts/**
      - psc15selfhost/packages/cli/**
      - psc15selfhost/scripts/compile-with-generated.mjs
      - psc15selfhost/scripts/check-with-generated*.mjs
      - psc15selfhost/scripts/pskernel-lean-package-consumer.test.mjs
      - psc15selfhost/scripts/bootstrap-closure-contract*.mjs
      - psc15selfhost/scripts/check-workspace.mjs
      - psc15selfhost/package.json
      - psc15selfhost/STATUS.md
      - .github/workflows/psc2-lean-kernel-provider.yml
      - .github/workflows/psc2-lean-kernel-prebuilt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned TypeScript build dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund typescript@5.8.3
          test "$(tsc --version)" = "Version 5.8.3"
          echo "PSC2_TYPESCRIPT_PIN: PASS 5.8.3"

      - name: Bootstrap isolation gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:bootstrap-closure-contract

      - name: Provider tests
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:kernel:lean434
          node packages/pskernel-lean/host/npm-package.test.mjs
          node packages/pskernel-lean/host/prebuilt.test.mjs
          node packages/pskernel-lean/scripts/stage-native-prebuilt.test.mjs
          node packages/pskernel-lean/scripts/assemble-prebuilt.test.mjs
          node packages/pskernel-lean/scripts/prebuilt-workflow.test.mjs
          node packages/pskernel-lean/scripts/packed-consumer-fixture.test.mjs
          node scripts/pskernel-lean-package-consumer.test.mjs
          node scripts/check-with-generated.test.mjs
          node packages/cli/bin/psc-kernel-provider.test.mjs

          version_json="$(lake exe psc2_lean_kernel_provider --version)"
          health_json="$(lake exe psc2_lean_kernel_provider --health)"
          printf '%s\n' "$version_json"
          printf '%s\n' "$health_json"
          printf '%s' "$version_json" | grep -F '"status":"version"'
          printf '%s' "$health_json" | grep -F '"status":"ok"'
          printf '%s' "$health_json" | grep -F '"leanVersion":"4.34.0"'
          printf '%s' "$health_json" | grep -F '"leanCommit":"293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"'

          valid_request='{"admissions":[{"declaration":{"h":{"h":"1","k":"regular"},"k":"definition","lp":[],"n":{"k":"s","p":{"k":"a"},"v":"processAccepted"},"s":"safe","t":{"k":"const","ls":[],"n":{"k":"s","p":{"k":"a"},"v":"Nat"}},"v":{"k":"nat","v":"1"}},"kind":"constant"}],"format":"proofscript-checked-admissions","version":2}'
          invalid_request='{"admissions":[{"declaration":{"h":{"h":"1","k":"regular"},"k":"definition","lp":[],"n":{"k":"s","p":{"k":"a"},"v":"processRejected"},"s":"safe","t":{"k":"const","ls":[],"n":{"k":"s","p":{"k":"a"},"v":"Nat"}},"v":{"k":"sort","l":{"k":"z"}}},"kind":"constant"}],"format":"proofscript-checked-admissions","version":2}'

          valid_response="$(printf '%s' "$valid_request" | lake exe psc2_lean_kernel_provider --check)"
          invalid_response="$(printf '%s' "$invalid_request" | lake exe psc2_lean_kernel_provider --check)"
          printf '%s\n' "$valid_response"
          printf '%s\n' "$invalid_response"
          printf '%s' "$valid_response" | grep -F '"accepted":true'
          printf '%s' "$valid_response" | grep -F '"provider":"lean4-cpp"'
          printf '%s' "$valid_response" | grep -F '"leanCommit":"293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"'
          printf '%s' "$invalid_response" | grep -F '"accepted":false'
          printf '%s' "$invalid_response" | grep -F '"errorKind":"kernel-rejection"'
          printf '%s' "$invalid_response" | grep -F '"declarationIndex":0'

      - name: PSC2 bootstrap regressions
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:workspace
          npm run check:source:bootstrap
          npm run check:bootstrap-closure
          npm run test:bootstrap

      - name: Real generated compiler kernel smoke
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          unset PSC_LEAN_KERNEL_PROVIDER_BIN

          node --input-type=module <<'NODE'
          import {resolveLeanKernelProviderBinary} from './packages/pskernel-lean/host/prebuilt.mjs';
          const resolved=resolveLeanKernelProviderBinary();
          if(resolved.source!=='bundled'){
            throw new Error(`expected bundled Lean kernel provider, got ${resolved.source}`);
          }
          if(resolved.target!=='linux-x64'){
            throw new Error(`expected linux-x64 bundled provider, got ${resolved.target}`);
          }
          console.log(`PSC2_REAL_GENERATED_LEAN_KERNEL_RESOLVER: PASS ${resolved.target}`);
          NODE

          npm run bootstrap:check
          npm run bootstrap:emit
          npm run bootstrap:compiler

          smoke_source="$(pwd)/.kernel-provider-smoke.ps"
          smoke_output="${RUNNER_TEMP}/psc-kernel-provider-smoke.js"
          printf 'def kernelProviderSmoke : Nat := 1;\n' > "$smoke_source"
          trap 'rm -f "$smoke_source"' EXIT

          node packages/cli/bin/psc.mjs check "$smoke_source" \
            --kernel lean434 \
            --compiler dist/bootstrap/packages/compiler/index.js

          node packages/cli/bin/psc.mjs build "$smoke_source" \
            --out "$smoke_output" \
            --kernel lean434 \
            --compiler dist/bootstrap/packages/compiler/index.js

          test -f "$smoke_output"
          test -f "${smoke_output}.map"
          echo "PSC2_REAL_GENERATED_LEAN_KERNEL_SMOKE: PASS"

  packed-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify committed package and bundled target
        shell: bash
        working-directory: psc15selfhost
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          unset PSC_LEAN_KERNEL_PROVIDER_BIN

          node packages/pskernel-lean/host/npm-package.test.mjs

          node --input-type=module <<'NODE'
          import {resolveLeanKernelProviderBinary} from './packages/pskernel-lean/host/prebuilt.mjs';
          const resolved=resolveLeanKernelProviderBinary();
          if(resolved.source!=='bundled'){
            throw new Error(`expected bundled provider, got ${resolved.source}`);
          }
          if(resolved.target!==process.env.TARGET){
            throw new Error(`expected ${process.env.TARGET}, got ${resolved.target}`);
          }
          console.log(`PSC2_PACKED_CONSUMER_RESOLVER: PASS ${resolved.target}`);
          NODE

      - name: Pack, install, and execute package without provider override
        shell: bash
        working-directory: psc15selfhost
        run: |
          set -euo pipefail
          unset PSC_LEAN_KERNEL_PROVIDER_BIN
          pack_dir="$RUNNER_TEMP/pskernel-lean-packed-consumer"
          mkdir -p "$pack_dir"
          (
            cd packages/pskernel-lean
            npm pack --json --pack-destination "$pack_dir"
          ) > "$RUNNER_TEMP/pskernel-lean-packed-consumer.json"

          tarball="$(node -e "const fs=require('fs'),p=require('path');const [r]=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pskernel-lean-packed-consumer.json','utf8'));process.stdout.write(p.join(process.env.RUNNER_TEMP,'pskernel-lean-packed-consumer',r.filename));")"
          node packages/pskernel-lean/scripts/packed-consumer.test.mjs --tarball "$tarball"
