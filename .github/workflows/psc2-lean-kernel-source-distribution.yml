name: PSC2 Lean kernel source distribution

on:
  push:
    branches:
      - psc2/pskernel-lean-provider
      - psc2/pskernel-lean-wasm
    paths:
      - psc15selfhost/packages/pskernel-lean/**
      - psc15selfhost/packages/pskernel-lean-wasm/**
      - psc15selfhost/scripts/bootstrap-closure-contract*.mjs
      - .github/workflows/psc2-lean-kernel-source-distribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact Lean toolchain for package-local native rebuild
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc15selfhost
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Native kernel source distribution
        working-directory: psc15selfhost
        run: node packages/pskernel-lean/host/source-distribution.test.mjs

      - name: Build and measure Lake reference provider
        working-directory: psc15selfhost/packages/pskernel-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build psc2_lean_kernel_provider
          reference='.lake/build/bin/psc2_lean_kernel_provider'
          test -f "$reference"
          cp "$reference" "$RUNNER_TEMP/psc2_lean_kernel_provider.reference"
          cp "$reference" "$RUNNER_TEMP/psc2_lean_kernel_provider.reference.stripped"
          strip --strip-all "$RUNNER_TEMP/psc2_lean_kernel_provider.reference.stripped"
          raw_size="$(stat -c '%s' "$reference")"
          stripped_size="$(stat -c '%s' "$RUNNER_TEMP/psc2_lean_kernel_provider.reference.stripped")"
          echo "PSC2_LEAN_KERNEL_NATIVE_BASELINE_SIZE: raw=${raw_size} stripped=${stripped_size}"
          echo "REFERENCE_STRIPPED_SIZE=${stripped_size}" >> "$GITHUB_ENV"

      - name: Native package-local slim source build
        working-directory: psc15selfhost/packages/pskernel-lean
        run: npm run build:kernel

      - name: Measure and differential-test slim native provider
        working-directory: psc15selfhost/packages/pskernel-lean
        shell: bash
        run: |
          set -euo pipefail
          candidate='.lake/build/bin/psc2_lean_kernel_provider'
          test -f "$candidate"
          raw_size="$(stat -c '%s' "$candidate")"
          cp "$candidate" "$RUNNER_TEMP/psc2_lean_kernel_provider.slim.stripped"
          strip --strip-all "$RUNNER_TEMP/psc2_lean_kernel_provider.slim.stripped"
          stripped_size="$(stat -c '%s' "$RUNNER_TEMP/psc2_lean_kernel_provider.slim.stripped")"
          echo "PSC2_LEAN_KERNEL_NATIVE_SLIM_SIZE: raw=${raw_size} stripped=${stripped_size}"
          test "$stripped_size" -lt "$REFERENCE_STRIPPED_SIZE"
          node scripts/native-slim-differential.test.mjs             --reference "$RUNNER_TEMP/psc2_lean_kernel_provider.reference"             --candidate "$candidate"

      - name: Native package-local prebuilt verification
        working-directory: psc15selfhost/packages/pskernel-lean
        run: npm run verify:prebuilt

      - name: WASM kernel source distribution
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/source-distribution.test.mjs

      - name: WASM prebuilt distribution contract
        working-directory: psc15selfhost
        run: |
          node packages/pskernel-lean-wasm/host/prebuilt.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync} from 'node:fs';
          import path from 'node:path';
          const root='packages/pskernel-lean-wasm';
          const pkg=JSON.parse(readFileSync(path.join(root,'package.json'),'utf8'));
          assert.ok(pkg.files.includes('PREBUILT_WASM_MANIFEST.json'));
          assert.equal(pkg.scripts?.['verify:prebuilt'],'node host/verify-prebuilt.mjs');
          assert.match(pkg.scripts?.['build:wasm'] ?? '',/write-prebuilt-manifest\.mjs/u);
          for(const file of [
            'host/prebuilt.mjs',
            'host/verify-prebuilt.mjs',
            'scripts/write-prebuilt-manifest.mjs',
          ]){
            assert.equal(existsSync(path.join(root,file)),true,`missing ${file}`);
          }
          NODE
          npm --prefix packages/pskernel-lean-wasm run verify:prebuilt

      - name: Bootstrap isolation contract
        working-directory: psc15selfhost
        run: node scripts/bootstrap-closure-contract-tests.mjs
