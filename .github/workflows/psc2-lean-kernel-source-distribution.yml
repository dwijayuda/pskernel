name: PSC2 Lean kernel source distribution

on:
  push:
    branches:
      - psc2/pskernel-lean-provider
      - psc2/pskernel-lean-wasm
    paths:
      - psc15selfhost/packages/pskernel-lean/**
      - psc15selfhost/packages/pskernel-lean-wasm/**
      - psc15selfhost/scripts/bootstrap-closure-contract*.mjs
      - .github/workflows/psc2-lean-kernel-source-distribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact Lean toolchain for package-local native rebuild
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc15selfhost
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Native kernel source distribution
        working-directory: psc15selfhost
        run: node packages/pskernel-lean/host/source-distribution.test.mjs

      - name: Native package-local source build
        working-directory: psc15selfhost/packages/pskernel-lean
        run: npm run build:kernel

      - name: Measure current native package-local binary
        working-directory: psc15selfhost/packages/pskernel-lean
        shell: bash
        run: |
          set -euo pipefail
          binary='.lake/build/bin/psc2_lean_kernel_provider'
          test -f "$binary"
          raw_size="$(stat -c '%s' "$binary")"
          cp "$binary" "$RUNNER_TEMP/psc2_lean_kernel_provider.stripped"
          strip --strip-all "$RUNNER_TEMP/psc2_lean_kernel_provider.stripped"
          stripped_size="$(stat -c '%s' "$RUNNER_TEMP/psc2_lean_kernel_provider.stripped")"
          echo "PSC2_LEAN_KERNEL_NATIVE_BASELINE_SIZE: raw=${raw_size} stripped=${stripped_size}"

      - name: Probe Lean native kernel-only link inputs
        working-directory: psc15selfhost/packages/pskernel-lean
        shell: bash
        run: |
          set -euo pipefail
          lean_prefix="$(lean --print-prefix)"
          echo "PSC2_LEAN_KERNEL_NATIVE_SYSROOT: $lean_prefix"
          test -s "$lean_prefix/lib/lean/libleancpp.a"
          if [[ -x "$lean_prefix/bin/llvm-ar" ]]; then
            lean_ar="$lean_prefix/bin/llvm-ar"
          else
            lean_ar="$(command -v ar)"
          fi
          echo "PSC2_LEAN_KERNEL_NATIVE_AR: $lean_ar"
          "$lean_ar" t "$lean_prefix/lib/lean/libleancpp.a" > "$RUNNER_TEMP/leancpp-members.txt"
          echo '--- initialize-like libleancpp members ---'
          grep -Ei '(^|[/_.-])initialize([/_.-]|$)|init' "$RUNNER_TEMP/leancpp-members.txt" | tail -n 80 || true
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/lean-link-probe.c"
          set +e
          leanc -v "$RUNNER_TEMP/lean-link-probe.c" -o "$RUNNER_TEMP/lean-link-probe"             > "$RUNNER_TEMP/leanc-probe.out" 2>&1
          probe_status=$?
          set -e
          echo "PSC2_LEAN_KERNEL_NATIVE_LEANC_PROBE_STATUS: $probe_status"
          sed -n '1,12p' "$RUNNER_TEMP/leanc-probe.out"
          grep -F -- '-lLake' "$RUNNER_TEMP/leanc-probe.out"

      - name: Native package-local prebuilt verification
        working-directory: psc15selfhost/packages/pskernel-lean
        run: npm run verify:prebuilt

      - name: WASM kernel source distribution
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/source-distribution.test.mjs

      - name: WASM prebuilt distribution contract
        working-directory: psc15selfhost
        run: |
          node packages/pskernel-lean-wasm/host/prebuilt.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {existsSync,readFileSync} from 'node:fs';
          import path from 'node:path';
          const root='packages/pskernel-lean-wasm';
          const pkg=JSON.parse(readFileSync(path.join(root,'package.json'),'utf8'));
          assert.ok(pkg.files.includes('PREBUILT_WASM_MANIFEST.json'));
          assert.equal(pkg.scripts?.['verify:prebuilt'],'node host/verify-prebuilt.mjs');
          assert.match(pkg.scripts?.['build:wasm'] ?? '',/write-prebuilt-manifest\.mjs/u);
          for(const file of [
            'host/prebuilt.mjs',
            'host/verify-prebuilt.mjs',
            'scripts/write-prebuilt-manifest.mjs',
          ]){
            assert.equal(existsSync(path.join(root,file)),true,`missing ${file}`);
          }
          NODE
          npm --prefix packages/pskernel-lean-wasm run verify:prebuilt

      - name: Bootstrap isolation contract
        working-directory: psc15selfhost
        run: node scripts/bootstrap-closure-contract-tests.mjs
