name: PSC2 Lean kernel WASM

on:
  push:
    branches:
      - psc2/pskernel-lean-wasm
    paths:
      - psc15selfhost/packages/pskernel-lean-wasm/**
      - psc15selfhost/packages/pskernel-lean/**
      - psc15selfhost/lakefile.lean
      - psc15selfhost/lean-toolchain
      - psc15selfhost/scripts/bootstrap-closure-contract*.mjs
      - psc15selfhost/scripts/check-workspace.mjs
      - psc15selfhost/package.json
      - study/lean4-4.34.0/**
      - .github/workflows/psc2-lean-kernel-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WASM package contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/package.test.mjs

      - name: Native source distribution contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean/host/source-distribution.test.mjs

      - name: WASM source distribution contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/source-distribution.test.mjs

      - name: WASM kernel-only link contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/scripts/kernel-only-link-contract.test.mjs

      - name: Bootstrap isolation contract
        working-directory: psc15selfhost
        run: node scripts/bootstrap-closure-contract-tests.mjs

      - name: Kernel provider host integration contract
        working-directory: psc15selfhost
        run: node scripts/kernel-provider-integration.test.mjs

      - name: Lean WASM patch applicability
        shell: bash
        run: git apply --check psc15selfhost/packages/pskernel-lean-wasm/patches/lean4-4.34.0-emscripten-uv-stubs.patch

      - name: Install exact Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc15selfhost
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Lean WASM API contract
        working-directory: psc15selfhost
        run: |
          lake build psc2_lean_kernel_wasm_api_tests
          lake exe psc2_lean_kernel_wasm_api_tests

      - name: Install exact Emscripten SDK 6.0.9
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.9
          ./emsdk activate 6.0.9
          source ./emsdk_env.sh
          emcc --version
          emcc --version | head -n 1 | grep -F '6.0.9'
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: WASM build contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/scripts/build-contract.test.mjs

      - name: WASM single-thread contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/scripts/single-thread-contract.test.mjs

      - name: WASM ABI contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/scripts/wasm-abi-contract.test.mjs

      - name: WASM differential contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/differential-contract.test.mjs

      - name: Build real Lean WASM provider
        shell: bash
        working-directory: psc15selfhost
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/pskernel-lean-wasm-build.log"
          if bash packages/pskernel-lean-wasm/scripts/build-wasm.sh >"$build_log" 2>&1; then
            echo 'Lean WASM build completed. Final output:'
            tail -n 80 "$build_log"
          else
            echo 'Lean WASM build failed. Error-focused excerpts:' >&2
            grep -nE 'error:|fatal error:|undefined symbol|undefined reference|FAILED:|wasm-ld:|emcc: error|make(\[[0-9]+\])?: \*\*\*|CMake Error' "$build_log" | tail -n 160 >&2 || true
            echo '--- final 300 build-log lines ---' >&2
            tail -n 300 "$build_log" >&2
            exit 1
          fi

      - name: Native/WASM differential parity
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/differential.test.mjs

      - name: Packed WASM npm consumer
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/npm-package.test.mjs

      - name: Upload WASM probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-lean-wasm-probe
          path: |
            psc15selfhost/packages/pskernel-lean-wasm/wasm/pskernel-lean.cjs
            psc15selfhost/packages/pskernel-lean-wasm/wasm/pskernel-lean.wasm
            psc15selfhost/packages/pskernel-lean-wasm/wasm/*.worker.js
            ${{ runner.temp }}/pskernel-lean-wasm-build.log
          if-no-files-found: warn
          retention-days: 7
