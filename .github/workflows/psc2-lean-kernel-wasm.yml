name: PSC2 Lean kernel WASM

on:
  push:
    branches:
      - psc2/pskernel-lean-wasm
    paths:
      - psc15selfhost/packages/pskernel-lean-wasm/**
      - psc15selfhost/packages/pskernel-lean/**
      - psc15selfhost/lakefile.lean
      - psc15selfhost/lean-toolchain
      - psc15selfhost/scripts/bootstrap-closure-contract*.mjs
      - psc15selfhost/scripts/check-workspace.mjs
      - psc15selfhost/package.json
      - study/lean4-4.34.0/**
      - .github/workflows/psc2-lean-kernel-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WASM package contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/host/package.test.mjs

      - name: Install exact Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc15selfhost
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Lean WASM API contract
        working-directory: psc15selfhost
        run: |
          lake build psc2_lean_kernel_wasm_api_tests
          lake exe psc2_lean_kernel_wasm_api_tests

      - name: Install exact Emscripten SDK 6.0.9
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 6.0.9
          ./emsdk activate 6.0.9
          source ./emsdk_env.sh
          emcc --version
          emcc --version | head -n 1 | grep -F '6.0.9'
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: WASM build contract
        working-directory: psc15selfhost
        run: node packages/pskernel-lean-wasm/scripts/build-contract.test.mjs

      - name: Build real Lean WASM provider
        shell: bash
        working-directory: psc15selfhost
        run: bash packages/pskernel-lean-wasm/scripts/build-wasm.sh

      - name: Upload WASM probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-lean-wasm-probe
          path: |
            psc15selfhost/packages/pskernel-lean-wasm/wasm/pskernel-lean.js
            psc15selfhost/packages/pskernel-lean-wasm/wasm/pskernel-lean.wasm
            psc15selfhost/packages/pskernel-lean-wasm/wasm/*.worker.js
          if-no-files-found: error
          retention-days: 7
