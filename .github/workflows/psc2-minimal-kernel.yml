name: PSC2 minimal kernel

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
      - psc2/kernel-core-phase1
      - psc2/kernel-core-phase2
      - psc2/kernel-core-phase2-work
      - psc2/kernel-core-phase3-reduce
      - psc2/kernel-core-phase3-reduce-work
      - psc2/kernel-core-phase4-infer
      - psc2/kernel-core-phase4-infer-work
      - psc2/kernel-core-phase5-defeq
      - psc2/kernel-core-phase5-defeq-work
    paths:
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/test/KernelCore*.lean
      - psc15selfhost/test/BridgeTests.lean
      - psc15selfhost/test/BootstrapTests.lean
      - psc15selfhost/test/MinimalSelfHostTests.lean
      - psc15selfhost/test/BackendRustTests.lean
      - psc15selfhost/test/BackendRustSourceTests.lean
      - psc15selfhost/test/BackendRustLetFunctionResultTests.lean
      - psc15selfhost/test/BackendRustFixture.lean
      - psc15selfhost/test/BackendRustLetFunctionResultFixture.lean
      - psc15selfhost/test/BackendDifferentialFixture.lean
      - psc15selfhost/lakefile.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - psc15selfhost/scripts/check-bootstrap-closure.mjs
      - psc15selfhost/scripts/report-kernel-core-size.mjs
      - .github/workflows/psc2-minimal-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundational-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Boundary test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_boundary_tests

      - name: Name parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_name_parity_tests

      - name: Level parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_level_parity_tests

      - name: Expr parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_expr_parity_tests

      - name: Substitution parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_subst_parity_tests

      - name: Declaration parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_declaration_parity_tests

      - name: Environment parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_environment_parity_tests

      - name: Local context parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_local_context_parity_tests

      - name: Basic reduction parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_reduction_parity_tests

      - name: Minimal inference parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_infer_parity_tests

      - name: Minimal DefEq parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_defeq_parity_tests

      - name: Bootstrap closure remains isolated
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-bootstrap-closure.mjs

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs

      - name: Phase 1 aggregate assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase1

      - name: Phase 2 aggregate assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase2

      - name: Phase 3 aggregate assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase3

      - name: Phase 4 aggregate assurance
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run assurance:kernel-core:phase4

      - name: Existing PSC2 regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check
