name: PSC2 minimal kernel

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - psc15selfhost/packages/backend-ts/**
      - psc15selfhost/packages/bootstrap/**
      - psc15selfhost/packages/bridge/**
      - psc15selfhost/packages/compiler/**
      - psc15selfhost/packages/compiler-ir/**
      - psc15selfhost/packages/core/**
      - psc15selfhost/packages/elab/**
      - psc15selfhost/packages/environment/**
      - psc15selfhost/packages/erasure/**
      - psc15selfhost/packages/foundation/**
      - psc15selfhost/packages/meta/**
      - psc15selfhost/packages/syntax/**
      - psc15selfhost/packages/pskernel-core/**
      - psc15selfhost/test/KernelCore*.lean
      - psc15selfhost/lakefile.lean
      - psc15selfhost/package.json
      - psc15selfhost/scripts/check-kernel-core-source.mjs
      - psc15selfhost/scripts/check-bootstrap-closure.mjs
      - psc15selfhost/scripts/check-*-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-infer-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-synth-instance-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-instances-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-unify-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-context-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-fields-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-wildcard-binder-names-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-constructor-minor-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-minor-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-minors-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-selfhost-source-syntax.mjs
      - psc15selfhost/scripts/check-elab-match-list-append-selfhost-source-syntax.mjs
      - .github/workflows/psc2-minimal-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundational-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Boundary test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_boundary_tests

      - name: Name parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_name_parity_tests

      - name: Level parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_level_parity_tests

      - name: Expr parity test
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake exe psc2_kernel_core_expr_parity_tests

      - name: Wildcard binder Nat rendering gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-wildcard-binder-names-selfhost-source-syntax.mjs

      - name: Match constructor expected type gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-match-constructor-minor-selfhost-source-syntax.mjs

      - name: Match minor Option value gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-match-minor-selfhost-source-syntax.mjs

      - name: Match minors recursion gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-match-minors-selfhost-source-syntax.mjs

      - name: Match Option value gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-match-selfhost-source-syntax.mjs

      - name: Match local list append gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-match-list-append-selfhost-source-syntax.mjs

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Bootstrap closure remains isolated
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          log_file="$(mktemp)"
          if node scripts/check-bootstrap-closure.mjs >"$log_file" 2>&1; then
            cat "$log_file"
          else
            echo "PSC2_FIXED_POINT_FAILURE_DIAGNOSTICS: BEGIN"
            grep -E "PSC1_PROJECT_ELAB_FAILED|declaration=|structuralRecursion|unknownName|matchExpectedType|PSC2_FIXED_POINT|Error:" "$log_file" | tail -n 120 || true
            echo "PSC2_FIXED_POINT_FAILURE_TAIL: BEGIN"
            tail -n 120 "$log_file"
            echo "PSC2_FIXED_POINT_FAILURE_TAIL: END"
            exit 1
          fi

      - name: KernelCore PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-kernel-core-source.mjs
