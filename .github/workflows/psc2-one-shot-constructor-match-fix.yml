name: PSC2 one-shot constructor match fix

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-one-shot-constructor-match-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Type source-binder match
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          old = "      let binders :=\n        match sourceBinders with"
          new = "      let binders : List PsSyntaxName :=\n        match sourceBinders with"
          if new in source:
              raise SystemExit(0)
          if old not in source:
              raise SystemExit("constructor minor source-binder match shape not found")
          path.write_text(source.replace(old, new, 1))
          PY

          node psc15selfhost/scripts/check-elab-match-constructor-minor-selfhost-source-syntax.mjs

          if git diff --quiet -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git commit -m "fix(psc2): type constructor source-binder match"
          git push origin HEAD:psc2/minimal-selfhost-psc15
