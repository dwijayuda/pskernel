name: PSC2 one-shot match minor Option values fix

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-one-shot-match-minor-option-values-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qualify match minor Option values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          replacements = [
              ("match elaborate context alternative.body (some expectedType) with", "match elaborate context alternative.body (Option.some expectedType) with"),
              ("        none\n  | .constructor _ binders span =>", "        Option.none\n  | .constructor _ binders span =>"),
              ("        (some binders)\n", "        (Option.some binders)\n"),
          ]
          for old, new in replacements:
              if new in source:
                  continue
              if source.count(old) != 1:
                  raise SystemExit(f"expected one match-minor Option value occurrence, found {source.count(old)} for {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          node psc15selfhost/scripts/check-elab-match-minor-selfhost-source-syntax.mjs

          if git diff --quiet -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git commit -m "fix(psc2): qualify match minor Option values"
          git push origin HEAD:psc2/minimal-selfhost-psc15
