# Retrigger after the match Option source guard was made boundary-safe.
name: PSC2 one-shot match Option value fix

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-one-shot-match-option-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qualify match Option values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          replacements = [
              (
                  "match elaborate context scrutineeSyntax none with",
                  "match elaborate context scrutineeSyntax Option.none with",
              ),
              (
                  "(some instantiatedExpected)",
                  "(Option.some instantiatedExpected)",
              ),
          ]
          updated = source
          for old, new in replacements:
              if new in updated:
                  continue
              count = updated.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              updated = updated.replace(old, new, 1)
          path.write_text(updated)
          PY

          node psc15selfhost/scripts/check-elab-match-selfhost-source-syntax.mjs

          if git diff --quiet -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git commit -m "fix(psc2): qualify match Option values"
          git push origin HEAD:psc2/minimal-selfhost-psc15
