name: PSC2 one-shot declaration structural reverse repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-decl-structural-reverse-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add PSC1-local typed-binder reverse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean")
          source = path.read_text()
          marker = "\ndef psElabStructuralRecursionFromSource\n"
          if source.count(marker) != 1:
              raise SystemExit(f"expected exactly one structural recursion declaration marker, found {source.count(marker)}")
          helper = "\ndef psElabReverseTypedBindersAcc\n    (binders : List PsElabTypedBinder) :\n    List PsElabTypedBinder -> List PsElabTypedBinder :=\n  match binders with\n  | List.nil =>\n      fun (acc : List PsElabTypedBinder) => acc\n  | List.cons binder rest =>\n      let smaller :\n          List PsElabTypedBinder -> List PsElabTypedBinder :=\n        psElabReverseTypedBindersAcc rest;\n      fun (acc : List PsElabTypedBinder) =>\n        smaller (List.cons binder acc)\n\ndef psElabReverseTypedBinders\n    (binders : List PsElabTypedBinder) : List PsElabTypedBinder :=\n  psElabReverseTypedBindersAcc binders List.nil\n"
          source = source.replace(marker, helper + marker, 1)
          old = "psElabExplicitParameterIds bindersRev.reverse;"
          new = "psElabExplicitParameterIds\n                          (psElabReverseTypedBinders bindersRev);"
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one bindersRev.reverse call, found {source.count(old)}")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Declaration structural recursion regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-declaration-structural-recursion-selfhost-source-syntax.mjs

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Declaration builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Declaration

      - name: Commit repair and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-decl-structural-reverse-fix.yml
          git add psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): use local typed-binder reverse in recursion detection"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
