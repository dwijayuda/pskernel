name: PSC2 one-shot inductive recursor list-count repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-inductive-recursor-list-count-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: psc2/minimal-selfhost-psc15

      - name: Refuse stale branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin psc2/minimal-selfhost-psc15
          test "$(git rev-parse origin/psc2/minimal-selfhost-psc15)" = "$GITHUB_SHA"

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize inductive recursor list counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean")
          source = path.read_text()
          start = source.index("def psBuildInductiveRecursor\n")
          end = source.index("\ndef psElabInductiveDeclaration\n", start)
          block = source[start:end]

          if block.count("parameterArgs.length") != 1:
              raise SystemExit("expected exactly one parameterArgs.length in psBuildInductiveRecursor")
          if block.count("constructors.length") != 1:
              raise SystemExit("expected exactly one constructors.length in psBuildInductiveRecursor")
          if "psElabListLength parameterArgs" in block or "psElabListLength constructors" in block:
              raise SystemExit("inductive recursor count normalization already partially applied")

          block = block.replace(
              "parameterArgs.length",
              "(psElabListLength parameterArgs)",
          )
          block = block.replace(
              "constructors.length",
              "(psElabListLength constructors)",
          )
          path.write_text(source[:start] + block + source[end:])
          PY

      - name: Inductive recursor regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-recursor-minor-binders-selfhost-source-syntax.mjs

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Declaration builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Declaration

      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin psc2/minimal-selfhost-psc15
          test "$(git rev-parse origin/psc2/minimal-selfhost-psc15)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-inductive-recursor-list-count-fix.yml
          git rm psc15selfhost/scripts/check-elab-inductive-recursor-selfhost-source-syntax.mjs
          git add psc15selfhost/packages/elab/src/Ps/Elab/Declaration.lean
          git commit -m "fix(psc2): normalize inductive recursor list counts"
          git push origin HEAD:psc2/minimal-selfhost-psc15
