name: PSC2 one-shot Nat list lookup repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-nat-list-at-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Nat list lookup Option constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          old = '''def psElabNatListAt
    (values : List Nat)
    (index : Nat) : Option Nat :=
  match values with
  | [] =>
      none
  | value :: rest =>
      match index with
      | 0 =>
          some value
      | nextIndex + 1 =>
          psElabNatListAt rest nextIndex
'''
          new = '''def psElabNatListAt
    (values : List Nat)
    (index : Nat) : Option Nat :=
  match values with
  | [] =>
      Option.none
  | value :: rest =>
      match index with
      | 0 =>
          Option.some value
      | nextIndex + 1 =>
          psElabNatListAt rest nextIndex
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one psElabNatListAt block, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Nat list lookup regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:selfhost-source-syntax:elab-syntax-local-id

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Elaborator builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-nat-list-at-fix.yml
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): normalize Nat list lookup Option constructors"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
