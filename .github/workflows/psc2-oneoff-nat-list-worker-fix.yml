name: PSC2 one-shot Nat list recursion repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-nat-list-worker-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite Nat list lookup as invariant-safe worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          start_marker = "def psElabNatListAt\n"
          end_marker = "\ndef psElabValidateStructuralCall\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          old = source[start:end]
          required_old = [
              "(values : List Nat)",
              "(index : Nat) : Option Nat :=",
              "Option.none",
              "Option.some value",
              "psElabNatListAt rest nextIndex",
          ]
          for needle in required_old:
              if needle not in old:
                  raise SystemExit(f"expected current Nat-list helper fragment {needle!r}")
          if "psElabNatListAtWorker" in old:
              raise SystemExit("Nat-list worker already exists; refusing duplicate rewrite")

          new = "\n".join([
              "def psElabNatListAtWorker",
              "    (index : Nat) :",
              "    List Nat -> Option Nat :=",
              "  match index with",
              "  | 0 =>",
              "      fun (values : List Nat) =>",
              "        match values with",
              "        | [] =>",
              "            Option.none",
              "        | value :: _ =>",
              "            Option.some value",
              "  | nextIndex + 1 =>",
              "      let smaller :",
              "          List Nat -> Option Nat :=",
              "        psElabNatListAtWorker nextIndex;",
              "      fun (values : List Nat) =>",
              "        match values with",
              "        | [] =>",
              "            Option.none",
              "        | _ :: rest =>",
              "            smaller rest",
              "",
              "def psElabNatListAt",
              "    (values : List Nat)",
              "    (index : Nat) : Option Nat :=",
              "  psElabNatListAtWorker",
              "    index",
              "    values",
          ])
          updated = source[:start] + new + source[end:]
          if updated == source:
              raise SystemExit("Nat-list worker rewrite made no source change")
          path.write_text(updated)
          PY

      - name: Nat list recursion regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:selfhost-source-syntax:elab-syntax-local-id

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Elaborator builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-nat-list-worker-fix.yml
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): make Nat list lookup recursion invariant-safe"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
