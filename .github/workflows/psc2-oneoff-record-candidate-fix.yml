name: PSC2 one-shot typed record candidate repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-record-candidate-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type record candidate selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          start = source.index("def psElabRecord\n")
          end = source.index("\ndef psElabSyntaxLocalId\n", start)
          block = source[start:end]

          replacements = [
              (
                  "  let candidate :=\n    match expected with",
                  "  let candidate : Option PsElabRecordCandidate :=\n    match expected with",
              ),
              (
                  "              some found\n            else\n              none",
                  "              Option.some found\n            else\n              Option.none",
              ),
              (
                  "                none with",
                  "                Option.none with",
              ),
          ]

          for old, new in replacements:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one record-block match for {old!r}, found {count}")
              block = block.replace(old, new, 1)

          updated = source[:start] + block + source[end:]
          if updated == source:
              raise SystemExit("record candidate repair made no change")
          path.write_text(updated)
          PY

      - name: Record candidate regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-record-candidates-selfhost-source-syntax.mjs

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Elaborator builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-record-candidate-fix.yml
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): type record candidate selection"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
