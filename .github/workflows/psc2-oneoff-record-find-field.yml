name: PSC2 one-shot record field Option repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-record-find-field.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc2/minimal-selfhost-psc15
          fetch-depth: 0

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize record field Option constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          text = path.read_text()
          old = '''def psSyntaxRecordFindField
              (fields : List (Prod PsSyntaxName PsSyntaxTerm))
              (name : String) :
              Option PsSyntaxTerm :=
            match fields with
            | [] =>
                none
            | field :: rest =>
                match psSyntaxRecordFieldName field with
                | some fieldName =>
                    if psStringEq fieldName name then
                      some (Prod.snd field)
                    else
                      psSyntaxRecordFindField rest name
                | none =>
                    psSyntaxRecordFindField rest name
          '''
          new = '''def psSyntaxRecordFindField
              (fields : List (Prod PsSyntaxName PsSyntaxTerm))
              (name : String) :
              Option PsSyntaxTerm :=
            match fields with
            | [] =>
                Option.none
            | field :: rest =>
                match psSyntaxRecordFieldName field with
                | Option.some fieldName =>
                    if psStringEq fieldName name then
                      Option.some (Prod.snd field)
                    else
                      psSyntaxRecordFindField rest name
                | Option.none =>
                    psSyntaxRecordFindField rest name
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one original psSyntaxRecordFindField block, found {count}')
          updated = text.replace(old, new, 1)
          if updated.count(new) != 1 or old in updated:
              raise SystemExit('record field Option normalization verification failed')
          path.write_text(updated)
          PY

          git diff --check
          git diff -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean

      - name: Cheap source gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          node scripts/check-elab-take-forall-names-selfhost-source-syntax.mjs
          npm run check:selfhost-source-syntax

      - name: Lean elaborator build
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair, self-remove, and dispatch Phase-13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/psc2-oneoff-record-find-field.yml
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git commit -m 'fix(psc2): qualify record field Option constructors'
          git push origin HEAD:psc2/minimal-selfhost-psc15
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/psc2-minimal-kernel.yml/dispatches" \
            -f ref='psc2/minimal-selfhost-psc15'
