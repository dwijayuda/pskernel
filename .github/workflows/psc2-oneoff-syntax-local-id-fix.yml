name: PSC2 one-shot syntax local id repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-syntax-local-id-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize syntax local id Option constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          start = source.index("def psElabSyntaxLocalId\n")
          end = source.index("\ndef psElabNatListAt\n", start)
          block = source[start:end]

          replacements = [
              ("| none => none", "| Option.none => Option.none", 2),
              ("| some name =>", "| Option.some name =>", 1),
              ("| some resolved =>", "| Option.some resolved =>", 1),
              ("| .local id => some id", "| .local id => Option.some id", 1),
              ("| .global _ => none", "| .global _ => Option.none", 1),
              ("| _ => none", "| _ => Option.none", 1),
          ]
          for old, new, expected in replacements:
              count = block.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} syntax-local-id matches for {old!r}, found {count}")
              block = block.replace(old, new)

          updated = source[:start] + block + source[end:]
          if updated == source:
              raise SystemExit("syntax local id repair made no source change")
          path.write_text(updated)
          PY

      - name: Wire permanent syntax local id gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/package.json")
          source = path.read_text()
          anchor = '    "check:selfhost-source-syntax:elab-record-candidates": "npm run test:selfhost-source-syntax:elab-record-candidates",\n'
          insertion = anchor + '    "test:selfhost-source-syntax:elab-syntax-local-id": "node scripts/check-elab-syntax-local-id-selfhost-source-syntax.mjs",\n    "check:selfhost-source-syntax:elab-syntax-local-id": "npm run test:selfhost-source-syntax:elab-syntax-local-id",\n'
          if source.count(anchor) != 1:
              raise SystemExit(f"expected exactly one package script anchor, found {source.count(anchor)}")
          source = source.replace(anchor, insertion, 1)

          old_tail = '&& npm run check:selfhost-source-syntax:elab-record-candidates",\n'
          new_tail = '&& npm run check:selfhost-source-syntax:elab-record-candidates && npm run check:selfhost-source-syntax:elab-syntax-local-id",\n'
          if source.count(old_tail) != 1:
              raise SystemExit(f"expected exactly one canonical source-chain tail, found {source.count(old_tail)}")
          source = source.replace(old_tail, new_tail, 1)
          path.write_text(source)
          PY

      - name: Syntax local id regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:selfhost-source-syntax:elab-syntax-local-id

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Elaborator builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair, remove RED runner, and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-syntax-local-id-red.yml
          git rm .github/workflows/psc2-oneoff-syntax-local-id-fix.yml
          git add \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/package.json \
            psc15selfhost/scripts/check-elab-syntax-local-id-selfhost-source-syntax.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): normalize syntax local id Option constructors"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
