name: PSC2 one-shot structural call recursion repair

on:
  push:
    branches:
      - psc2/minimal-selfhost-psc15
    paths:
      - .github/workflows/psc2-oneoff-validate-structural-call-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite structural-call validation as invariant-safe worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/packages/elab/src/Ps/Elab/Term.lean")
          source = path.read_text()
          start_marker = "def psElabValidateStructuralCall\n"
          end_marker = "\ndef psTryElabStructuralSelfCall\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          old = source[start:end]
          required_old = [
              "(arguments : List PsSyntaxTerm)",
              "psElabValidateStructuralCall",
              "(Nat.succ index)",
              "rest",
              "hypothesisId",
          ]
          for needle in required_old:
              if needle not in old:
                  raise SystemExit(f"expected current structural-call fragment {needle!r}")
          if "psElabValidateStructuralCallWorker" in old:
              raise SystemExit("structural-call worker already exists; refusing duplicate rewrite")

          new = "\n".join([
              "def psElabValidateStructuralCallWorker",
              "    (arguments : List PsSyntaxTerm) :",
              "    PsElabContext ->",
              "    PsElabStructuralRecursion ->",
              "    Nat ->",
              "    Option Nat ->",
              "    Except PsElabError Nat :=",
              "  match arguments with",
              "  | [] =>",
              "      fun (context : PsElabContext) =>",
              "        fun (recursion : PsElabStructuralRecursion) =>",
              "          fun (index : Nat) =>",
              "            fun (hypothesisId : Option Nat) =>",
              "              match hypothesisId with",
              "              | Option.some resolvedHypothesisId =>",
              "                  Except.ok resolvedHypothesisId",
              "              | Option.none =>",
              "                  Except.error PsElabError.structuralRecursionInternal",
              "  | argument :: rest =>",
              "      let smaller :",
              "          PsElabContext ->",
              "          PsElabStructuralRecursion ->",
              "          Nat ->",
              "          Option Nat ->",
              "          Except PsElabError Nat :=",
              "        psElabValidateStructuralCallWorker rest;",
              "      fun (context : PsElabContext) =>",
              "        fun (recursion : PsElabStructuralRecursion) =>",
              "          fun (index : Nat) =>",
              "            fun (hypothesisId : Option Nat) =>",
              "              match psElabSyntaxLocalId context argument with",
              "              | Option.none =>",
              "                  if Nat.beq index recursion.recursiveParameterIndex then",
              "                    Except.error PsElabError.structuralRecursionNotDecreasing",
              "                  else",
              "                    Except.error PsElabError.structuralRecursionInvariantArgument",
              "              | Option.some argumentId =>",
              "                  if Nat.beq index recursion.recursiveParameterIndex then",
              "                    match",
              "                        psElabStructuralRecursionFindCall",
              "                          recursion.calls",
              "                          argumentId with",
              "                    | Option.none =>",
              "                        Except.error PsElabError.structuralRecursionNotDecreasing",
              "                    | Option.some nextHypothesisId =>",
              "                        smaller",
              "                          context",
              "                          recursion",
              "                          (Nat.succ index)",
              "                          (Option.some nextHypothesisId)",
              "                  else",
              "                    match",
              "                        psElabNatListAt",
              "                          recursion.explicitParameterIds",
              "                          index with",
              "                    | Option.none =>",
              "                        Except.error PsElabError.structuralRecursionArity",
              "                    | Option.some originalId =>",
              "                        if Nat.beq argumentId originalId then",
              "                          smaller",
              "                            context",
              "                            recursion",
              "                            (Nat.succ index)",
              "                            hypothesisId",
              "                        else",
              "                          Except.error",
              "                            PsElabError.structuralRecursionInvariantArgument",
              "",
              "def psElabValidateStructuralCall",
              "    (context : PsElabContext)",
              "    (recursion : PsElabStructuralRecursion)",
              "    (index : Nat)",
              "    (arguments : List PsSyntaxTerm)",
              "    (hypothesisId : Option Nat) :",
              "    Except PsElabError Nat :=",
              "  psElabValidateStructuralCallWorker",
              "    arguments",
              "    context",
              "    recursion",
              "    index",
              "    hypothesisId",
          ])
          updated = source[:start] + new + source[end:]
          if updated == source:
              raise SystemExit("structural-call worker rewrite made no source change")
          path.write_text(updated)
          PY

      - name: Wire permanent structural-call source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("psc15selfhost/package.json")
          source = path.read_text()
          anchor = '    "check:selfhost-source-syntax:elab-syntax-local-id": "npm run test:selfhost-source-syntax:elab-syntax-local-id",\n'
          insertion = anchor + '    "test:selfhost-source-syntax:elab-validate-structural-call": "node scripts/check-elab-validate-structural-call-selfhost-source-syntax.mjs",\n    "check:selfhost-source-syntax:elab-validate-structural-call": "npm run test:selfhost-source-syntax:elab-validate-structural-call",\n'
          if source.count(anchor) != 1:
              raise SystemExit(f"expected exactly one package script anchor, found {source.count(anchor)}")
          source = source.replace(anchor, insertion, 1)

          old_tail = '&& npm run check:selfhost-source-syntax:elab-syntax-local-id",\n'
          new_tail = '&& npm run check:selfhost-source-syntax:elab-syntax-local-id && npm run check:selfhost-source-syntax:elab-validate-structural-call",\n'
          if source.count(old_tail) != 1:
              raise SystemExit(f"expected exactly one canonical source-chain tail, found {source.count(old_tail)}")
          source = source.replace(old_tail, new_tail, 1)
          path.write_text(source)
          PY

      - name: Structural call recursion regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run test:selfhost-source-syntax:elab-validate-structural-call

      - name: Full selfhost source syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          npm run check:selfhost-source-syntax

      - name: Elaborator builds under Lean
        shell: bash
        run: |
          set -euo pipefail
          cd psc15selfhost
          lake build Ps.Elab.Term

      - name: Commit repair, remove RED runner, and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psc2-oneoff-validate-structural-call-red.yml
          git rm .github/workflows/psc2-oneoff-validate-structural-call-fix.yml
          git add \
            psc15selfhost/packages/elab/src/Ps/Elab/Term.lean \
            psc15selfhost/package.json \
            psc15selfhost/scripts/check-elab-validate-structural-call-selfhost-source-syntax.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(psc2): make structural call validation invariant-safe"
          git push origin HEAD:psc2/minimal-selfhost-psc15
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/psc2-minimal-kernel.yml/dispatches \
            -d '{"ref":"psc2/minimal-selfhost-psc15"}'
