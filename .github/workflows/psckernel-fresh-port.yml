name: PSCKernel fresh port

on:
  push:
    branches:
      - selfhost/psckernel-fresh-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psckernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - name: Check self-host workspace shape
        run: node selfhost/scripts/check-workspace.mjs

      - name: Audit portable PSC1 source profile
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node check-psc1-source.mjs

      - name: Build PSCKernel with Lake
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build PsPSCKernel

      - name: Run PSCKernel Name tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psckernel_name_tests

      - name: Run PSCKernel Level basic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psckernel_level_basic_tests

      - name: Run PSCKernel Level kernel tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psckernel_level_kernel_tests

      - name: Run PSCKernel Expr basic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ExprBasicTests.lean

      - name: Run PSCKernel Expr level instantiation tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ExprLevelInstantiationTests.lean

      - name: Run PSCKernel Expr instantiation tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ExprInstantiationTests.lean

      - name: Run PSCKernel Expr abstraction tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ExprAbstractionTests.lean

      - name: Run PSCKernel LocalContext tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/LocalContextTests.lean

      - name: Run PSCKernel Declaration tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/DeclarationTests.lean

      - name: Run PSCKernel Environment tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/EnvironmentTests.lean

      - name: Run PSCKernel basic reduction tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ReductionBasicTests.lean

      - name: Run PSCKernel recursor basic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/RecursorBasicTests.lean

      - name: Run PSCKernel basic type inference tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/TypeInferenceBasicTests.lean

      - name: Run PSCKernel binder-aware type inference tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/TypeInferenceTests.lean

      - name: Run PSCKernel basic definitional equality tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/DefEqBasicTests.lean

      - name: Run PSCKernel proof irrelevance defeq tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/DefEqProofIrrelevanceTests.lean

      - name: Run PSCKernel function eta defeq tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/DefEqEtaTests.lean

      - name: Run PSCKernel structure eta defeq tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/DefEqStructEtaTests.lean

      - name: Run PSCKernel checked inference basic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/CheckedInferenceBasicTests.lean

      - name: Run PSCKernel projection basic tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake env lean --run packages/psckernel/test/ProjectionBasicTests.lean

      - name: Install TypeScript kernel dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript kernel
        run: npm run build --silent

      - name: Run PSCKernel Name differential
        run: node scripts/psckernel-name-differential.mjs

      - name: Run PSCKernel Level differential
        run: node scripts/psckernel-level-differential.mjs

      - name: Run PSCKernel Expr differential
        run: node scripts/psckernel-expr-differential.mjs

      - name: Run PSCKernel Expr level instantiation differential
        run: node scripts/psckernel-expr-level-instantiation-differential.mjs

      - name: Run PSCKernel Expr instantiation differential
        run: node scripts/psckernel-expr-instantiation-differential.mjs

      - name: Run PSCKernel Expr abstraction differential
        run: node scripts/psckernel-expr-abstraction-differential.mjs

      - name: Run PSCKernel LocalContext differential
        run: node scripts/psckernel-local-context-differential.mjs

      - name: Run PSCKernel Declaration differential
        run: node scripts/psckernel-declaration-differential.mjs

      - name: Run PSCKernel Environment differential
        run: node scripts/psckernel-environment-differential.mjs

      - name: Run PSCKernel basic reduction differential
        run: node scripts/psckernel-reduction-basic-differential.mjs

      - name: Run PSCKernel recursor basic differential
        run: node scripts/psckernel-recursor-basic-differential.mjs

      - name: Run PSCKernel basic type inference differential
        run: node scripts/psckernel-type-inference-basic-differential.mjs

      - name: Run PSCKernel binder-aware type inference differential
        run: node scripts/psckernel-type-inference-differential.mjs

      - name: Run PSCKernel basic definitional equality differential
        run: node scripts/psckernel-defeq-basic-differential.mjs

      - name: Run PSCKernel proof irrelevance defeq differential
        run: node scripts/psckernel-defeq-proof-irrelevance-differential.mjs

      - name: Run PSCKernel structure eta defeq differential
        run: node scripts/psckernel-defeq-struct-eta-differential.mjs

      - name: Run PSCKernel checked inference basic differential
        run: node scripts/psckernel-checked-inference-basic-differential.mjs

      - name: Run PSCKernel projection basic differential
        run: node scripts/psckernel-projection-basic-differential.mjs
