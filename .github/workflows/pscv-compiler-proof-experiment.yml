name: PSCV compiler proof experiment

on:
  push:
    branches:
      - pscv/selfhost-poc-v1
    paths:
      - "psc15selfhost/packages/compiler/**"
      - "psc15selfhost/package.json"
      - ".github/workflows/pscv-compiler-proof-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pscv-compiler-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install current compiler Lean baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check compiler proof experiment
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          npm run test:pscv-compiler-proofs
          finished=$(date +%s)
          echo "PSCV_COMPILER_PROOF_CHECK_SECONDS=$((finished-started))"
