name: PSCV self-host PoC

on:
  push:
    branches:
      - pscv/selfhost-poc-v1
    paths:
      - "psc15selfhost/**"
      - ".github/workflows/pscv-selfhost-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pscv-selfhost-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install current repository Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned checked TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pscv-poc-tools --no-audit --no-fund typescript@7.0.2
          echo /tmp/pscv-poc-tools/node_modules/.bin >> "$GITHUB_PATH"

      - name: Verify current checked toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
          node --version

      - name: Bootstrap existing self-host compiler
        working-directory: psc15selfhost
        run: npm run bootstrap

      - name: Run PSCV proof-of-concept
        working-directory: psc15selfhost
        run: npm run poc:pscv-selfhost
