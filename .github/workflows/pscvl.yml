name: PSCVL Lean-powered frontend

on:
  push:
    branches: [main, feature/pscvl-lean-frontend, feature/pscvl-normative-grammar]
    paths:
      - 'PSCVL/**'
      - '.github/workflows/pscvl.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PSCVL/**'
      - '.github/workflows/pscvl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pscvl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: PSCVL
          build: true
          test: false
          lint: false
      - name: Exercise Lean frontend, approved root and negative policies
        working-directory: PSCVL
        shell: bash
        run: |
          set -euxo pipefail
          lake exe pscvl check examples/normative/pass_minimal.ps
          lake exe pscvl check examples/normative/pass_strict_binders.ps
          expect_normative_error() {
            local input="$1" expected="$2"
            local output rc
            set +e
            output=$(lake exe pscvl check "$input" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$output"
            test "$rc" -ne 0
            grep -Fq -- "$expected" <<< "$output"
          }
          expect_normative_error examples/normative/fail_unbraced_proof.ps "requires braced by"
          expect_normative_error examples/normative/fail_unbraced_do.ps "requires braced do"
          expect_normative_error examples/normative/fail_equations.ps "equation-declaration bodies"
          lake exe pscvl check-preview examples/pass.ps
          lake exe pscvl syntax-kinds examples/pass_ghost.ps
          lake exe pscvl syntax-kinds examples/pass_lean_core.ps
          lake exe pscvl syntax-kinds examples/pass_effect_relations.ps
          lake exe pscvl syntax-kinds examples/pass_contract.ps
          lake exe pscvl syntax-kinds examples/pass_typed_errors.ps
          lake exe pscvl check-preview examples/pass_contract.ps
          lake exe pscvl check-preview examples/pass_language.ps
          lake exe pscvl check-preview examples/pass_lean_core.ps
          lake exe pscvl check-preview examples/pass_state.ps
          lake exe pscvl check-preview examples/pass_while.ps
          lake exe pscvl check-preview examples/pass_binders.ps
          lake exe pscvl check-preview examples/pass_standard_attr.ps
          lake exe pscvl check-preview examples/pass_braces_and_contracts.ps
          lake exe pscvl check-preview examples/pass_given.ps
          lake exe pscvl check-preview examples/pass_effect_relations.ps
          lake exe pscvl check-preview examples/pass_ghost.ps
          lake exe pscvl check-preview examples/pass_typed_errors.ps
          ! lake exe pscvl check-preview examples/fail_unsafe.ps
          ! lake exe pscvl check-preview examples/fail_partial.ps
          ! lake exe pscvl check-preview examples/fail_axiom.ps
          ! lake exe pscvl check-preview examples/fail_sorry.ps
          ! lake exe pscvl check-preview examples/fail_missing_spec.ps
          ! lake exe pscvl check-preview examples/fail_unproved_contract.ps
          ! lake exe pscvl check-preview examples/fail_no_roots.ps
          ! lake exe pscvl check-preview examples/fail_macro.ps
          ! lake exe pscvl check-preview examples/fail_eval.ps
          ! lake exe pscvl check-preview examples/fail_option.ps
          ! lake exe pscvl check-preview examples/fail_import.ps
          ! lake exe pscvl check-preview examples/fail_standalone_sorry.ps
          ! lake exe pscvl check-preview examples/fail_refine_predicate.ps
          ! lake exe pscvl check-preview examples/fail_function_contract.ps
          ! lake exe pscvl check-preview examples/fail_raw_io.ps
          ! lake exe pscvl check-preview examples/fail_noncomputable.ps
          ! lake exe pscvl check-preview examples/fail_missing_arg.ps
          ! lake exe pscvl check-preview examples/fail_unresolved_implicit.ps
          ! lake exe pscvl check-preview examples/fail_unsupported_attribute.ps
          ! lake exe pscvl check-preview examples/fail_deriving.ps
          ! lake exe pscvl check-preview examples/fail_open_scoped.ps
          ! lake exe pscvl check-preview examples/fail_ensures_only.ps
          ! lake exe pscvl check-preview examples/fail_ghost_leak.ps
          ! lake exe pscvl check-preview examples/fail_unsafe_cast.ps
          ! lake exe pscvl check-preview examples/fail_direct_erased.ps
          ! lake exe pscvl check-preview examples/fail_while_missing_invariant.ps
          ! lake exe pscvl check-preview examples/fail_while_missing_decreasing.ps
          ! lake exe pscvl check-preview examples/fail_repeat.ps
          ! lake exe pscvl check-preview examples/fail_multiple_for.ps
          ! lake exe pscvl check-preview examples/fail_semicolon.ps
          # A negative fixture must fail for the intended semantic reason,
          # not merely because a valid PSCV syntax form was mistyped.
          expect_rejection() {
            local input="$1" expected="$2"
            local output rc
            set +e
            output=$(lake exe pscvl check-preview "$input" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$output"
            test "$rc" -ne 0
            grep -Fq -- "$expected" <<< "$output"
          }
          expect_rejection examples/fail_ghost_leak.ps "Erased.out"
          expect_rejection examples/fail_typed_errors.ps "unsolved goals"
