name: PSCVL Lean-powered frontend

on:
  push:
    branches: [main, feature/pscvl-lean-frontend]
    paths:
      - 'PSCVL/**'
      - '.github/workflows/pscvl.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PSCVL/**'
      - '.github/workflows/pscvl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pscvl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: PSCVL
          build: true
          test: false
          lint: false
      - name: Exercise Lean frontend, approved root and negative policies
        working-directory: PSCVL
        shell: bash
        run: |
          set -euxo pipefail
          lake exe pscvl check examples/pass.ps
          lake exe pscvl syntax-kinds examples/pass_ghost.ps
          lake exe pscvl check examples/pass_contract.ps
          lake exe pscvl check examples/pass_language.ps
          lake exe pscvl check examples/pass_lean_core.ps
          lake exe pscvl check examples/pass_state.ps
          lake exe pscvl check examples/pass_while.ps
          lake exe pscvl check examples/pass_binders.ps
          lake exe pscvl check examples/pass_standard_attr.ps
          lake exe pscvl check examples/pass_braces_and_contracts.ps
          lake exe pscvl check examples/pass_given.ps
          lake exe pscvl check examples/pass_effect_relations.ps
          lake exe pscvl check examples/pass_ghost.ps
          lake exe pscvl check examples/pass_typed_errors.ps
          ! lake exe pscvl check examples/fail_unsafe.ps
          ! lake exe pscvl check examples/fail_partial.ps
          ! lake exe pscvl check examples/fail_axiom.ps
          ! lake exe pscvl check examples/fail_sorry.ps
          ! lake exe pscvl check examples/fail_missing_spec.ps
          ! lake exe pscvl check examples/fail_unproved_contract.ps
          ! lake exe pscvl check examples/fail_no_roots.ps
          ! lake exe pscvl check examples/fail_macro.ps
          ! lake exe pscvl check examples/fail_eval.ps
          ! lake exe pscvl check examples/fail_option.ps
          ! lake exe pscvl check examples/fail_import.ps
          ! lake exe pscvl check examples/fail_standalone_sorry.ps
          ! lake exe pscvl check examples/fail_refine_predicate.ps
          ! lake exe pscvl check examples/fail_function_contract.ps
          ! lake exe pscvl check examples/fail_raw_io.ps
          ! lake exe pscvl check examples/fail_noncomputable.ps
          ! lake exe pscvl check examples/fail_missing_arg.ps
          ! lake exe pscvl check examples/fail_unresolved_implicit.ps
          ! lake exe pscvl check examples/fail_unsupported_attribute.ps
          ! lake exe pscvl check examples/fail_deriving.ps
          ! lake exe pscvl check examples/fail_open_scoped.ps
          ! lake exe pscvl check examples/fail_ensures_only.ps
          ! lake exe pscvl check examples/fail_ghost_leak.ps
          ! lake exe pscvl check examples/fail_unsafe_cast.ps
          ! lake exe pscvl check examples/fail_direct_erased.ps
          ! lake exe pscvl check examples/fail_typed_errors.ps
