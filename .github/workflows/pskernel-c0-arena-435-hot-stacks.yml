name: PSKernel-C0 native 4.35 Arena performance-stack root causes
on:
  pull_request:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-arena-435-hot-stacks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-actual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: shared-subterm
            source: perf/shared-subterm.ndjson
          - id: app-lam
            source: perf/app-lam.ndjson
          - id: let-ladder
            source: perf/let-ladder.ndjson
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Build unchanged C0 checker and diagnostic-only native sampler
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc &&
            lake build c0OfficialReplay)
          cc -O2 -fPIC -shared -o "$RUNNER_TEMP/c0-arena-stack-sampler.so" \
            psc0/packages/pskernel-c0/test/C0NativeProofSampler.c
          python3 -m py_compile \
            psc0/packages/pskernel-c0/test/arena_conformance.py \
            psc0/packages/pskernel-c0/test/arena_lean435_compat.py \
            psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py
      - name: Verify immutable original Arena corpus and native 4.35 target
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo "98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  $RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" | sha256sum -c -
      - name: Adapt exactly one immutable case and require official Lean 4.35 positive
        env:
          ARENA_CASE: ${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,"psc0/packages/pskernel-c0/test")
          from arena_conformance import check_archive
          from arena_lean435_compat import adapt_legacy_envelope,official_reference
          base=Path(os.environ["RUNNER_TEMP"])
          case=os.environ["ARENA_CASE"]
          matching=[(label,raw) for label,name,raw
                    in check_archive(base/"lean-arena-round-2026-09-tests.tar.gz") if name==case]
          assert len(matching)==1 and matching[0][0]=="good", (case,matching)
          adapted,receipt=adapt_legacy_envelope(matching[0][1])
          assert receipt["body_bytes_identical"]
          p=base/"arena-c0-profile-exact.ndjson"
          p.write_bytes(adapted)
          oracle=official_reference(Path("psc0/packages/pskernel-c0").resolve(),p,60)
          assert oracle["verdict"]=="accepted", (case,oracle)
          (base/"arena-c0-profile-identity.json").write_text(
              json.dumps({"case":case,"source":receipt,"official":oracle},
                         indent=2,ensure_ascii=False)+"\n")
          print("C0_ARENA_HOT_PROFILE_SOURCE case="+case+
                " source_byte_identity=verified native_lean=4.35.0 official=accepted")
          PY
      - name: Capture active native C0 checker worker stacks without modifying decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py \
            "$PWD/psc0/packages/pskernel-c0/.lake/build/bin/c0OfficialReplay" \
            "$RUNNER_TEMP/arena-c0-profile-exact.ndjson" \
            "$RUNNER_TEMP/c0-arena-stack-sampler.so" \
            "$RUNNER_TEMP/c0-arena-native-stacks.log" \
            "$RUNNER_TEMP/c0-arena-native-stacks.json" \
            --samples 14 --interval 1.5
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"c0-arena-native-stacks.json"
          r=json.loads(p.read_text())
          assert r["diagnostic_only"] and r["no_trusted_code_modified"]
          assert r["native_stack_samples"]>0
          print("C0_ARENA_HOT_PROFILE native_worker_samples="+str(r["native_stack_samples"])+
                " checked_acceptance="+str(r["successful_source_acceptance"])+
                " diagnostic_only=true")
          for name,count in r["top_inclusive_functions"][:15]:
              print("C0_ARENA_HOT_FUNCTION count=%d symbol=%s"%(count,name))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c0-arena-435-hot-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/arena-c0-profile-identity.json
            ${{ runner.temp }}/c0-arena-native-stacks.json
            ${{ runner.temp }}/c0-arena-native-stacks.log
          if-no-files-found: warn
          retention-days: 21
