name: PSKernel-C0 Arena 4.35 exact negative diagnostics
on:
  pull_request:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-arena-435-negative-diagnostics.yml'
      - 'psc0/packages/pskernel-c0/test/arena_435_diagnostics.py'
      - 'psc0/packages/pskernel-c0/test/arena_435_known_gaps.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Native 4.35 C0 and exact external corpus
        shell: bash
        run: |
          set -euo pipefail
          cd psc0/packages/pskernel-c0
          test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          lake build c0OfficialReplay
          cd ../../../
          python3 -m py_compile psc0/packages/pskernel-c0/test/arena_435_diagnostics.py
          curl -fL --retry 3 -o "$RUNNER_TEMP/arena-round.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo "98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  $RUNNER_TEMP/arena-round.tar.gz" | sha256sum -c -
      - name: Diagnose the exact remaining native-4.35 unqualified negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 psc0/packages/pskernel-c0/test/arena_435_diagnostics.py \
            --archive "$RUNNER_TEMP/arena-round.tar.gz" \
            --checker psc0/packages/pskernel-c0/.lake/build/bin/c0OfficialReplay \
            --official-project psc0/packages/pskernel-c0 \
            --ledger psc0/packages/pskernel-c0/test/arena_435_known_gaps.json \
            --output "$RUNNER_TEMP/c0-arena-435-negative-diagnostics.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c0-arena-435-negative-diagnostics
          path: ${{ runner.temp }}/c0-arena-435-negative-diagnostics.json
          if-no-files-found: warn
          retention-days: 30
