name: PSKernel-C0 external Arena adversarial kernel cases
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-arena-adversarial435.yml'
      - 'psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean'
      - 'psc0/packages/pskernel-c0/src/**'
  pull_request:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
      - perf/pskernel-c0-infer-dag-eligibility-20261018
    paths:
      - '.github/workflows/pskernel-c0-arena-adversarial435.yml'
      - 'psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean'
      - 'psc0/packages/pskernel-c0/src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arena-native-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Build exact-version native Lean C0 and external exporter
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat psc0/packages/pskernel-c0/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(cd psc0/packages/pskernel-c0 && lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
      # Real pinned Lean 4.35 control, not an Arena-authored exploit.
      # Or is a two-constructor Prop: legal small elimination must still work.
      - name: Check legitimate two-constructor Prop recursor against official Lean
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/lean4export"
            lake env .lake/build/bin/lean4export Init -- Or.rec \
              > "$RUNNER_TEMP/lean435-prop-Or-rec.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/lean435-prop-Or-rec.ndjson" \
              > "$RUNNER_TEMP/lean435-prop-Or-rec-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" \
            "$RUNNER_TEMP/lean435-prop-Or-rec-official.txt"
          (
            cd psc0/packages/pskernel-c0
            timeout 120s .lake/build/bin/c0OfficialReplay --require-accepted \
              "$RUNNER_TEMP/lean435-prop-Or-rec.ndjson" 4096 \
              > "$RUNNER_TEMP/lean435-prop-Or-rec-c0.txt" 2>&1
          )
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted" \
            "$RUNNER_TEMP/lean435-prop-Or-rec-c0.txt"
          echo "C0_LEAN435_PROP_SMALL_ELIM case=Or.rec official=accepted c0=accepted"
      - name: Rebuild frozen Arena exploit sources without inventing declarations
        shell: bash
        run: |
          set -euo pipefail
          revision=5d7ca987618f1136aaa296057b50a2c10c4ce77a
          cd "$RUNNER_TEMP/lean4export"
          mkdir -p .lake/build/lib/lean
          curl -fL --retry 3 -o ArenaImaxProp.lean \
            "https://raw.githubusercontent.com/leanprover/lean-kernel-arena/$revision/tests/bugs/proj-of-imax-prop.lean"
          curl -fL --retry 3 -o ArenaLargeElim.lean \
            "https://raw.githubusercontent.com/leanprover/lean-kernel-arena/$revision/tests/bugs/large-elim-prop-bool.lean"
          lake env lean -o .lake/build/lib/lean/ArenaImaxProp.olean ArenaImaxProp.lean
          lake env lean -o .lake/build/lib/lean/ArenaLargeElim.olean ArenaLargeElim.lean
          lake env .lake/build/bin/lean4export ArenaImaxProp -- badFalse \
            > "$RUNNER_TEMP/arena435-imaxPropBadFalse.ndjson"
          lake env .lake/build/bin/lean4export ArenaLargeElim -- boom \
            > "$RUNNER_TEMP/arena435-largeElimBoom.ndjson"
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("imaxPropBadFalse","largeElimBoom"):
              path=temp/f"arena435-{name}.ndjson"
              lines=path.read_bytes().splitlines()
              header=json.loads(lines[0])["meta"]
              assert header["lean"]=={
                "version":"4.35.0",
                "githash":"eb6cafb7290e8bd5f2937522d8d804f58f02bafc"}
              assert header["exporter"]["version"]=="3.1.0"
              assert len(lines)>2
              print(f"C0_ARENA_EXPLOIT_EXPORT case={name} records={len(lines)} bytes={path.stat().st_size}")
          PY
      - name: Qualify original reordered mutual recursor prefix without rewriting exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          original=(temp/"arena435-imaxPropBadFalse.ndjson").read_bytes().splitlines(keepends=True)
          names={0:""}
          found=False
          for i,raw in enumerate(original):
              rec=json.loads(raw)
              if "in" in rec:
                  part=rec.get("str",rec.get("num"))
                  parent=names.get(part["pre"],"") if part else ""
                  segment=str(part.get("str",part.get("i"))) if part else ""
                  names[rec["in"]]=parent+"."+segment if parent else segment
              if "inductive" not in rec: continue
              group=rec["inductive"]
              family=[names[x["name"]] for x in group["types"]]
              if family!=["ImaxPropDummy","ImaxProp"]: continue
              recursors=[names[x["name"]] for x in group["recs"]]
              assert recursors==["ImaxProp.rec","ImaxPropDummy.rec"], recursors
              (temp/"arena435-imaxMutualPrefix.ndjson").write_bytes(b"".join(original[:i+1]))
              # These are explicitly synthetic negative variants of the
              # independently checked positive export. Never count them
              # as original Arena-authored soundness test cases.
              import copy
              duplicate=copy.deepcopy(rec)
              duplicate["inductive"]["recs"][1]["name"]=duplicate["inductive"]["recs"][0]["name"]
              badK=copy.deepcopy(rec)
              badK["inductive"]["recs"][0]["k"]=not badK["inductive"]["recs"][0]["k"]
              for label, forged in (("duplicateRecName",duplicate),("forgedRecK",badK)):
                  mutated=b"".join(original[:i])+(json.dumps(forged,ensure_ascii=False,separators=(",",":"))+"\n").encode()
                  (temp/f"arena435-{label}.ndjson").write_bytes(mutated)
              print(f"C0_ARENA_MUTUAL_PREFIX records={i+1} exported_recursor_order=reversed native_versions=unchanged")
              found=True
              break
          assert found, "missing genuine two-type Arena mutual declaration"
          PY
          (
            cd "$RUNNER_TEMP/lean4export"
            lake env leanchecker --from-export "$RUNNER_TEMP/arena435-imaxMutualPrefix.ndjson" \
              > "$RUNNER_TEMP/arena435-imaxMutualPrefix-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/arena435-imaxMutualPrefix-official.txt"
          (
            cd psc0/packages/pskernel-c0
            timeout 150s .lake/build/bin/c0OfficialReplay \
              --require-accepted "$RUNNER_TEMP/arena435-imaxMutualPrefix.ndjson" 4096 \
              > "$RUNNER_TEMP/arena435-imaxMutualPrefix-c0.txt" 2>&1
          )
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted" "$RUNNER_TEMP/arena435-imaxMutualPrefix-c0.txt"
          echo "C0_ARENA_MUTUAL_RECURSOR_FIDELITY genuine_positive=accepted generated_metadata=exact no_parser_header_rewrite=true"
      - name: Canonical recursor names reject; unaudited K mismatch still declines
        shell: bash
        run: |
          set -euo pipefail
          for label in duplicateRecName forgedRecK; do
            (
              cd psc0/packages/pskernel-c0
              timeout 35s .lake/build/bin/c0OfficialReplay --trace-declarations "$RUNNER_TEMP/arena435-$label.ndjson" 4096
            ) > "$RUNNER_TEMP/arena435-$label-c0.txt" 2>&1
            if [ "$label" = duplicateRecName ]; then
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.rejected" "$RUNNER_TEMP/arena435-$label-c0.txt"
              grep -Fq "invalid Lean 4.35 canonical recursor name family" "$RUNNER_TEMP/arena435-$label-c0.txt"
              echo "C0_ARENA_SYNTHETIC_NEGATIVE label=$label verdict=rejected exact_generated_rec_name=verified"
            else
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.rejected" "$RUNNER_TEMP/arena435-$label-c0.txt"
              grep -Fq "invalid Lean 4.35 K flag on non-singleton inductive" "$RUNNER_TEMP/arena435-$label-c0.txt"
              echo "C0_ARENA_SYNTHETIC_NEGATIVE label=$label verdict=rejected non_singleton_K_invariant=verified"
            fi
          done
      - name: Require real official rejection and classify native C0 without false acceptance
        shell: bash
        run: |
          set -euo pipefail
          for name in imaxPropBadFalse largeElimBoom; do
            path="$RUNNER_TEMP/arena435-$name.ndjson"
            rc=0
            (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$path") \
              > "$RUNNER_TEMP/arena435-$name-official.txt" 2>&1 || rc=$?
            test "$rc" -ne 0
            grep -Fq "Lean default kernel rejects the solution" "$RUNNER_TEMP/arena435-$name-official.txt"
            native_rc=0
            (cd psc0/packages/pskernel-c0 && timeout 150s .lake/build/bin/c0OfficialReplay "$path" 4096) \
              > "$RUNNER_TEMP/arena435-$name-c0.txt" 2>&1 || native_rc=$?
            if [ "$native_rc" -ne 0 ]; then
              echo "C0_ARENA_EXPLOIT case=$name classification=process_failure exit=$native_rc" >&2
              exit 1
            fi
            case "$(grep '^C0_REAL_EXPORT replay_outcome=' "$RUNNER_TEMP/arena435-$name-c0.txt" | tail -1)" in
              *C0ExportVerdict.rejected*)
                echo "C0_ARENA_EXPLOIT case=$name classification=correct_reject source=arena_2026_09 native_lean=4.35.0";;
              *C0ExportVerdict.unsupported*|*C0ExportVerdict.inconclusive*|*C0ExportVerdict.resourceExhausted*)
                echo "C0_ARENA_EXPLOIT case=$name classification=unqualified_decline source=arena_2026_09 native_lean=4.35.0";;
              *C0ExportVerdict.accepted*)
                echo "C0_ARENA_EXPLOIT case=$name classification=FALSE_ACCEPT" >&2; exit 1;;
              *)
                echo "C0_ARENA_EXPLOIT case=$name classification=unrecognized_result" >&2; exit 1;;
            esac
            if [ "$name" = largeElimBoom ]; then
              # An ordinary two-constructor Prop cannot have a recursor
              # that eliminates into arbitrary Type. This authentic forged
              # export now requires a true independently derived rejection.
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.rejected" \
                "$RUNNER_TEMP/arena435-$name-c0.txt"
              grep -Fq "invalid Prop recursor: large elimination from multiple constructors" \
                "$RUNNER_TEMP/arena435-$name-c0.txt"
              echo "C0_ARENA_LARGE_ELIM official=rejected c0=rejected independent_rule=Prop_multiple_constructors"
            fi
          done
          echo "C0_ARENA_EXPLOIT_GATES native_kernel=false_accept_forbidden historical_bytes_unchanged=true"
      - name: Re-export and strictly reject separate K-reduction and projection exploits
        shell: bash
        run: |
          set -euo pipefail
          # Separate Arena-authored invalidity classes, NEVER counted as
          # checks of the original Lean 4.29.1 archived export bytes.
          revision=5d7ca987618f1136aaa296057b50a2c10c4ce77a
          for case_name in k-rec-conv proj-non-structure; do
            case "$case_name" in
              k-rec-conv) module=ArenaKRecConv;;
              proj-non-structure) module=ArenaProjNonStructure;;
              *) echo "unexpected case" >&2; exit 1;;
            esac
            curl -fL --retry 3 -o "$RUNNER_TEMP/$module.lean" \
              "https://raw.githubusercontent.com/leanprover/lean-kernel-arena/$revision/tests/bugs/$case_name.lean"
            (
              cd "$RUNNER_TEMP/lean4export"
              cp "$RUNNER_TEMP/$module.lean" "$module.lean"
              lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean"
              lake env .lake/build/bin/lean4export "$module" -- bad \
                > "$RUNNER_TEMP/arena435-$case_name.ndjson"
            )
            path="$RUNNER_TEMP/arena435-$case_name.ndjson"
            python3 - "$path" <<'PY'
          import json,sys
          with open(sys.argv[1], "rb") as f:
              meta=json.loads(f.readline())["meta"]
          assert meta["lean"] == {
              "version":"4.35.0",
              "githash":"eb6cafb7290e8bd5f2937522d8d804f58f02bafc"}
          assert meta["exporter"]["version"] == "3.1.0"
          print("C0_ARENA_NEW_CLASS source_pinned=true native_export=true")
          PY
            official_rc=0
            (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$path") \
              > "$RUNNER_TEMP/arena435-$case_name-official.txt" 2>&1 || official_rc=$?
            test "$official_rc" -ne 0
            grep -Fq "Lean default kernel rejects the solution" \
              "$RUNNER_TEMP/arena435-$case_name-official.txt"
            c0_rc=0
            (cd psc0/packages/pskernel-c0 && \
              timeout 150s .lake/build/bin/c0OfficialReplay "$path" 4096) \
              > "$RUNNER_TEMP/arena435-$case_name-c0.txt" 2>&1 || c0_rc=$?
            test "$c0_rc" -eq 0
            grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.rejected" \
              "$RUNNER_TEMP/arena435-$case_name-c0.txt"
            echo "C0_ARENA_NEW_CLASS case=$case_name official=rejected c0=rejected native_lean=4.35.0"
          done
      - name: Check substitution-sensitive Prop sort after native 4.35 re-export
        shell: bash
        run: |
          set -euo pipefail
          # Unlike the frozen hash-collision recursor exports, this upstream
          # exploit is declared independently of fresh-name hash collisions.
          # It targets a stuck proposition sort after substituting a proof.
          revision=5d7ca987618f1136aaa296057b50a2c10c4ce77a
          name=ArenaProjSubstProp
          curl -fL --retry 3 -o "$RUNNER_TEMP/$name.lean" \
            "https://raw.githubusercontent.com/leanprover/lean-kernel-arena/$revision/tests/bugs/proj-of-subst-prop.lean"
          (
            cd "$RUNNER_TEMP/lean4export"
            cp "$RUNNER_TEMP/$name.lean" "$name.lean"
            # The 4.35 API adds an explicit maxRecDepth USize argument.
            # Change only that call signature; preserve all exploit declarations.
            python3 - "$name.lean" <<'PY'
          from pathlib import Path
          import hashlib,sys
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          old=b"env.addDeclCore 0 decl none (doCheck := false)"
          new=b"env.addDeclCore 0 10000 decl none (doCheck := false)"
          assert raw.count(old) == 1, "upstream source changed; refuse adaptation"
          p.write_bytes(raw.replace(old, new))
          print("C0_ARENA_SUBST_PROP orig_sha256="+hashlib.sha256(raw).hexdigest()+
                " api_adaptation=addDeclCore_maxRecDepth_only")
          PY
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
            lake env .lake/build/bin/lean4export "$name" -- inconsistent \
              > "$RUNNER_TEMP/arena435-projOfSubstProp.ndjson"
          )
          path="$RUNNER_TEMP/arena435-projOfSubstProp.ndjson"
          python3 - "$path" <<'PY'
          import json,sys
          with open(sys.argv[1], "rb") as f:
              header=json.loads(f.readline())["meta"]
          assert header["lean"] == {
              "version":"4.35.0",
              "githash":"eb6cafb7290e8bd5f2937522d8d804f58f02bafc"}
          assert header["exporter"]["version"] == "3.1.0"
          print("C0_ARENA_SUBST_PROP native435_header=verified historical_bytes_untouched=true")
          PY
          official_rc=0
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$path") \
            > "$RUNNER_TEMP/arena435-projOfSubstProp-official.txt" 2>&1 || official_rc=$?
          test "$official_rc" -ne 0
          grep -Fq "Lean default kernel rejects the solution" \
            "$RUNNER_TEMP/arena435-projOfSubstProp-official.txt"
          c0_rc=0
          (cd psc0/packages/pskernel-c0 && \
            timeout 150s .lake/build/bin/c0OfficialReplay "$path" 4096) \
            > "$RUNNER_TEMP/arena435-projOfSubstProp-c0.txt" 2>&1 || c0_rc=$?
          test "$c0_rc" -eq 0
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.rejected" \
            "$RUNNER_TEMP/arena435-projOfSubstProp-c0.txt"
          echo "C0_ARENA_SUBST_PROP official=rejected c0=rejected native=4.35.0 source=upstream_immutable"
      - name: Exact Lean 4.35 logical safety-provenance differential
        shell: bash
        run: |
          set -euo pipefail
          for entry in SafeAccept UnsafeReject PartialReject; do
            path="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0/test/C0ArenaSafety$entry.ndjson"
            native_rc=0
            (
              cd "$RUNNER_TEMP/lean4export"
              lake env leanchecker --from-export "$path"
            ) > "$RUNNER_TEMP/arena435-safety-$entry-official.txt" 2>&1 || native_rc=$?
            if [ "$entry" = SafeAccept ]; then
              test "$native_rc" -eq 0
              grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/arena435-safety-$entry-official.txt"
              expected="accepted"
            else
              test "$native_rc" -ne 0
              grep -Fq "Lean default kernel rejects the solution" "$RUNNER_TEMP/arena435-safety-$entry-official.txt"
              expected="rejected"
            fi
            (cd psc0/packages/pskernel-c0 && timeout 120s .lake/build/bin/c0OfficialReplay "$path" 4096) \
              > "$RUNNER_TEMP/arena435-safety-$entry-c0.txt" 2>&1
            grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.$expected" "$RUNNER_TEMP/arena435-safety-$entry-c0.txt"
            echo "C0_ARENA_SAFETY_DIFF case=$entry official=$expected c0=$expected"
          done
          path="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0/test/C0ArenaSafetyUnsafeDecline.ndjson"
          (cd psc0/packages/pskernel-c0 && timeout 120s .lake/build/bin/c0OfficialReplay "$path" 4096) \
            > "$RUNNER_TEMP/arena435-safety-standalone-c0.txt" 2>&1
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.unsupported" \
            "$RUNNER_TEMP/arena435-safety-standalone-c0.txt"
          echo "C0_ARENA_SAFETY_DIFF standalone_unsafe=unsupported cannot_admit_unchecked=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-arena-adversarial435
          path: |
            ${{ runner.temp }}/arena435-*.ndjson
            ${{ runner.temp }}/lean435-prop-Or-rec*
            ${{ runner.temp }}/arena435-*-official.txt
            ${{ runner.temp }}/arena435-*-c0.txt
          if-no-files-found: warn
          retention-days: 21
