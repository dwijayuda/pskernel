name: PSKernel-C0 exact Array proof DAG equality native hotspot
on:
  pull_request:
    branches: [perf/pskernel-c0-infer-dag-eligibility-20261018]
    paths:
      - '.github/workflows/pskernel-c0-array-equality-native-hotspot.yml'
      - 'psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py'
      - 'psc0/packages/pskernel-c0/test/C0NativeProofSampler.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  array-extract-proof-native-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Produce exact real Array.extract_append_extract official-positive closure
        shell: bash
        run: |
          set -euo pipefail
          pkg=psc0/packages/pskernel-c0
          test "$(cd "$pkg" && lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- Array.extract_append_extract \
              > "$RUNNER_TEMP/c0-array-extract.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/c0-array-extract.ndjson" \
              > "$RUNNER_TEMP/c0-array-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/c0-array-official.txt"
          wc -lc "$RUNNER_TEMP/c0-array-extract.ndjson"
          sha256sum "$RUNNER_TEMP/c0-array-extract.ndjson"
          echo "C0_LEAF_AB_REFERENCE official=accepted pinned=Lean_4.35.0 target=Array.extract_append_extract"
      - name: Pin identical 152660-record official-positive source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'c0-array-extract.ndjson'
          raw=p.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          assert digest == 'ba0fcc693d7aeee2301d7cc38712a7055a1559552d52ad70c8f2e2c1d627292a', digest
          assert len(raw.splitlines()) == 152660, len(raw.splitlines())
          print(f'C0_ARRAY_INFER_AB_INPUT official=accepted pin=4.35.0 records=152660 sha256={digest}')
          PY
      - name: Compile checked source and non-authoritative profile sampler
        shell: bash
        run: |
          set -euo pipefail
          (
            cd psc0/packages/pskernel-c0
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
            lake build c0OfficialReplay
          )
          python3 -m py_compile psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py
          cc -O2 -fPIC -shared -o "$RUNNER_TEMP/array-eq-sampler.so" \
            psc0/packages/pskernel-c0/test/C0NativeProofSampler.c
      - name: Profile native worker inside exact Array.extract proof 130834
        shell: bash
        run: |
          set -euo pipefail
          target="C0_REAL_EXPORT_DECL_BEGIN record=130834 kind=thm name=_private.Init.Data.Array.Extract.0.Array.extract_append_extract._proof_1_1"
          python3 psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py \
            "$PWD/psc0/packages/pskernel-c0/.lake/build/bin/c0OfficialReplay" \
            "$RUNNER_TEMP/c0-array-extract.ndjson" \
            "$RUNNER_TEMP/array-eq-sampler.so" \
            "$RUNNER_TEMP/array-eq-profile-stacks.txt" \
            "$RUNNER_TEMP/array-eq-profile-summary.json" \
            --samples 20 --interval 2 --max-wait 450 --wait-for "$target"
          python3 - <<'PY'
          import json, pathlib, os
          d=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((d/"array-eq-profile-summary.json").read_text())
          body=(d/"array-eq-profile-stacks.txt").read_text(errors="replace")
          assert "C0_REAL_EXPORT_DECL_BEGIN record=130834" in body
          assert data["native_stack_samples"] > 0
          assert data["diagnostic_only"] and data["no_trusted_code_modified"]
          assert not data["successful_source_acceptance"]
          print("C0_ARRAY_EQ_PROFILE target=private_Array_extract_proof_1_1 actual_checker_reached=true verdict=UNQUALIFIED_DIAGNOSTIC samples=%s" % data["native_stack_samples"])
          for name, n in data["top_inclusive_functions"][:24]:
              print("C0_ARRAY_EQ_FRAME inclusive_count=%s symbol=%s" % (n,name))
          for name, n in data["top_active_functions"][:12]:
              print("C0_ARRAY_EQ_ACTIVE active_count=%s symbol=%s" % (n,name))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-array-eq-source-native-profiler
          path: |
            ${{ runner.temp }}/array-eq-profile-summary.json
            ${{ runner.temp }}/array-eq-profile-stacks.txt
            ${{ runner.temp }}/c0-array-official.txt
          if-no-files-found: warn
          retention-days: 21
