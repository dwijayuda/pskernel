name: PSKernel-C0 exact Array.extract proof native stack profile
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-array-hot-stack.yml'
      - 'psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  array-hot-269176:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Compile unchanged native kernel and isolated worker sampler
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc &&
            lake build c0OfficialReplay)
          python3 -m py_compile psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py
          cc -O2 -fPIC -shared -o "$RUNNER_TEMP/c0-stalled-sampler.so" psc0/packages/pskernel-c0/test/C0NativeProofSampler.c
          test -s "$RUNNER_TEMP/c0-stalled-sampler.so"
      - name: Reproduce exact official-positive 499130-record dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- String.Slice.Pattern.ForwardSliceSearcher.instIteratorIdSearchStep > "$RUNNER_TEMP/array-hot-269176.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/array-hot-269176.ndjson" > "$RUNNER_TEMP/array-hot-269176-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/array-hot-269176-official.txt"
          test "$(stat -c%s "$RUNNER_TEMP/array-hot-269176.ndjson")" -eq 25031309
          test "$(wc -l < "$RUNNER_TEMP/array-hot-269176.ndjson")" -eq 499130
          echo "7448c45db0a440983a587432a2bbd2dfb4b77e7d788b6c5f0ce66fe876fff286  $RUNNER_TEMP/array-hot-269176.ndjson" | sha256sum -c -
          echo "C0_ARRAY_NATIVE_SOURCE official=accepted bytes=sha256_pinned native_lean=4.35.0"
      - name: Capture EXACT active theorem worker stacks before original timeout
        shell: bash
        run: |
          set -euo pipefail
          python3 psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py \
            "$PWD/psc0/packages/pskernel-c0/.lake/build/bin/c0OfficialReplay" \
            "$RUNNER_TEMP/array-hot-269176.ndjson" \
            "$RUNNER_TEMP/c0-stalled-sampler.so" \
            "$RUNNER_TEMP/array-hot-269176-stacks.txt" \
            "$RUNNER_TEMP/array-hot-269176-summary.json" \
            --samples 20 --interval 2 --max-wait 800 \
            --wait-for "C0_REAL_EXPORT_DECL_BEGIN record=269176"
          python3 - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          log=(base/"array-hot-269176-stacks.txt").read_text(errors="replace")
          j=json.loads((base/"array-hot-269176-summary.json").read_text())
          assert "C0_REAL_EXPORT_DECL_BEGIN record=269176" in log
          assert j["native_stack_samples"] > 0
          assert j["diagnostic_only"] and j["no_trusted_code_modified"]
          assert j["successful_source_acceptance"] is False
          print("C0_ARRAY_NATIVE_TARGET exact_decl=269176 stacks=%d checked_acceptance=NOT_CLAIMED" % j["native_stack_samples"])
          for name,n in j["top_inclusive_functions"][:15]:
              print("C0_ARRAY_NATIVE_FRAME count=%d symbol=%s" % (n,name))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-exact-array-hot-269176-native
          path: |
            ${{ runner.temp }}/array-hot-269176-summary.json
            ${{ runner.temp }}/array-hot-269176-stacks.txt
            ${{ runner.temp }}/array-hot-269176-official.txt
          if-no-files-found: warn
          retention-days: 14
