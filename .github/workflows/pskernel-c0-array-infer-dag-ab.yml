name: PSKernel-C0 real Lean 4.35 Array infer cache DAG A/B
on:
  pull_request:
    branches: [perf/pskernel-c0-136-whnf-hash-causes-20261018]
    paths:
      - '.github/workflows/pskernel-c0-array-infer-dag-ab.yml'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean'
      - 'psc0/packages/pskernel-c0/test/C0InferenceCacheDAGEligibilityRegression.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-array-strict-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Produce exact real Array.extract_append_extract official-positive closure
        shell: bash
        run: |
          set -euo pipefail
          pkg=psc0/packages/pskernel-c0
          test "$(cd "$pkg" && lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- Array.extract_append_extract \
              > "$RUNNER_TEMP/c0-array-extract.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/c0-array-extract.ndjson" \
              > "$RUNNER_TEMP/c0-array-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/c0-array-official.txt"
          wc -lc "$RUNNER_TEMP/c0-array-extract.ndjson"
          sha256sum "$RUNNER_TEMP/c0-array-extract.ndjson"
          echo "C0_LEAF_AB_REFERENCE official=accepted pinned=Lean_4.35.0 target=Array.extract_append_extract"
      - name: Pin identical 152660-record official-positive source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'c0-array-extract.ndjson'
          raw=p.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          assert digest == 'ba0fcc693d7aeee2301d7cc38712a7055a1559552d52ad70c8f2e2c1d627292a', digest
          assert len(raw.splitlines()) == 152660, len(raw.splitlines())
          print(f'C0_ARRAY_INFER_AB_INPUT official=accepted pin=4.35.0 records=152660 sha256={digest}')
          PY
      - name: Strict native PR137 C0 proof replay, same Array bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin 704a411aa567f51f8dafffd97b8c05cc4a6c9349
          test "$(git rev-parse FETCH_HEAD)" = 704a411aa567f51f8dafffd97b8c05cc4a6c9349
          git show FETCH_HEAD:psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean > psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/array-infer-baseline-resources.txt" \
              timeout 540s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-array-extract.ndjson" 4096
          ) > "$RUNNER_TEMP/array-infer-baseline-c0.txt" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=152660 fuel=4096' "$RUNNER_TEMP/array-infer-baseline-c0.txt"
            verdict=accepted
          elif [[ "$rc" -eq 124 ]]; then
            verdict=unqualified_host_timeout
          elif [[ "$rc" -eq 1 ]] && grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.resourceExhausted' "$RUNNER_TEMP/array-infer-baseline-c0.txt"; then
            verdict=unqualified_resource
          else
            tail -n 55 "$RUNNER_TEMP/array-infer-baseline-c0.txt"
            exit 1
          fi
          echo "C0_ARRAY_INFER_AB_RESULT variant=qualified_PR137 verdict=$verdict exit=$rc fuel=4096 records=152660"
          grep -F 'C0_REAL_EXPORT_PROGRESS' "$RUNNER_TEMP/array-infer-baseline-c0.txt" | tail -n 6 || true
          grep -F 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/array-infer-baseline-c0.txt" | tail -n 8 || true
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' "$RUNNER_TEMP/array-infer-baseline-resources.txt" || true
      - name: Strict native source-proved DAG inference Array replay
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean > psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/CachePolicy.lean
          (
            cd psc0/packages/pskernel-c0
            lake build c0OfficialReplay
            lake env lean --run test/C0InferenceCacheDAGEligibilityRegression.lean
          )
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/array-infer-candidate-resources.txt" \
              timeout 540s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-array-extract.ndjson" 4096
          ) > "$RUNNER_TEMP/array-infer-candidate-c0.txt" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=152660 fuel=4096' "$RUNNER_TEMP/array-infer-candidate-c0.txt"
            verdict=accepted
          elif [[ "$rc" -eq 124 ]]; then
            verdict=unqualified_host_timeout
          elif [[ "$rc" -eq 1 ]] && grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.resourceExhausted' "$RUNNER_TEMP/array-infer-candidate-c0.txt"; then
            verdict=unqualified_resource
          else
            tail -n 55 "$RUNNER_TEMP/array-infer-candidate-c0.txt"
            exit 1
          fi
          echo "C0_ARRAY_INFER_AB_RESULT variant=certified_DAG_infer verdict=$verdict exit=$rc fuel=4096 records=152660"
          grep -F 'C0_REAL_EXPORT_PROGRESS' "$RUNNER_TEMP/array-infer-candidate-c0.txt" | tail -n 6 || true
          grep -F 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/array-infer-candidate-c0.txt" | tail -n 8 || true
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size' "$RUNNER_TEMP/array-infer-candidate-resources.txt" || true
          echo 'C0_ARRAY_INFER_AB_SCOPE both_full_source_checkers=true same_official_435_export=true same_runner=true original_fuel_4096=true no_axiom_or_admission_change=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-array-infer-dag-real-source-ab
          path: |
            ${{ runner.temp }}/array-infer-*.txt
            ${{ runner.temp }}/c0-array-official.txt
          if-no-files-found: warn
          retention-days: 21
