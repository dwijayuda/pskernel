name: PSKernel-C0 native Array reverse theorem hot stacks
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-array-reverse-hot-stack.yml'
      - 'psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py'
      - 'psc0/packages/pskernel-c0/test/C0NativeProofSampler.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-array-reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Build frozen native C0 checker and bounded worker sampler
        shell: bash
        run: |
          set -euo pipefail
          (
            cd psc0/packages/pskernel-c0
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
            lake build c0OfficialReplay
          )
          python3 -m py_compile psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py
          cc -O2 -fPIC -shared -o "$RUNNER_TEMP/c0-array-reverse-sampler.so" \
            psc0/packages/pskernel-c0/test/C0NativeProofSampler.c
          test -s "$RUNNER_TEMP/c0-array-reverse-sampler.so"
      - name: Independently export and officially accept genuine problematic theorem
        shell: bash
        run: |
          set -euo pipefail
          target='_private.Init.Data.Array.Lemmas.0.Array.toList_reverse.go._unary'
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- "$target" > "$RUNNER_TEMP/c0-array-reverse.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/c0-array-reverse.ndjson" > "$RUNNER_TEMP/c0-array-reverse-official.txt" 2>&1
          )
          grep -Fq 'Lean default kernel accepts the solution' "$RUNNER_TEMP/c0-array-reverse-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/c0-array-reverse.ndjson")" -gt 1
          sha256sum "$RUNNER_TEMP/c0-array-reverse.ndjson"
          wc -lc "$RUNNER_TEMP/c0-array-reverse.ndjson"
          echo "C0_ARRAY_REVERSE_SOURCE exact_lean=4.35.0 target=$target official=accepted source=unchanged"
      - name: Sample the exact theorem proof-body worker without authorizing acceptance
        shell: bash
        run: |
          set -euo pipefail
          target='_private.Init.Data.Array.Lemmas.0.Array.toList_reverse.go._unary'
          python3 psc0/packages/pskernel-c0/test/C0NativeProofStackProfile.py \
            "$PWD/psc0/packages/pskernel-c0/.lake/build/bin/c0OfficialReplay" \
            "$RUNNER_TEMP/c0-array-reverse.ndjson" \
            "$RUNNER_TEMP/c0-array-reverse-sampler.so" \
            "$RUNNER_TEMP/c0-array-reverse-stacks.txt" \
            "$RUNNER_TEMP/c0-array-reverse-summary.json" \
            --samples 20 --interval 3 --max-wait 800 \
            --wait-for "name=$target"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])
          log=(d/"c0-array-reverse-stacks.txt").read_text(errors="replace")
          j=json.loads((d/"c0-array-reverse-summary.json").read_text())
          marker="name=_private.Init.Data.Array.Lemmas.0.Array.toList_reverse.go._unary"
          assert marker in log, "exact theorem was never reached"
          assert j["native_stack_samples"] > 0
          assert j["diagnostic_only"] and j["no_trusted_code_modified"]
          assert j["successful_source_acceptance"] is False
          print("C0_ARRAY_REVERSE_PROFILE exact_target_reached=true samples=%d verdict=UNQUALIFIED_DIAGNOSTIC" % j["native_stack_samples"])
          for symbol,n in j["top_inclusive_functions"][:20]:
              print("C0_ARRAY_REVERSE_FRAME inclusive_samples=%d symbol=%s" % (n,symbol))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-array-reverse-exact-native-stacks
          path: |
            ${{ runner.temp }}/c0-array-reverse-summary.json
            ${{ runner.temp }}/c0-array-reverse-stacks.txt
            ${{ runner.temp }}/c0-array-reverse-official.txt
          if-no-files-found: warn
          retention-days: 14
