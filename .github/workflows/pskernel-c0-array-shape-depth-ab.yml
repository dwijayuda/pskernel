name: PSKernel-C0 pinned Array extract proof shape depth A/B
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-array-shape-depth-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shape-depth-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Produce exact real Array.extract_append_extract official-positive closure
        shell: bash
        run: |
          set -euo pipefail
          pkg=psc0/packages/pskernel-c0
          test "$(cd "$pkg" && lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- Array.extract_append_extract \
              > "$RUNNER_TEMP/c0-array-extract.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/c0-array-extract.ndjson" \
              > "$RUNNER_TEMP/c0-array-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/c0-array-official.txt"
          wc -lc "$RUNNER_TEMP/c0-array-extract.ndjson"
          sha256sum "$RUNNER_TEMP/c0-array-extract.ndjson"
          echo "C0_SHAPE_AB_REFERENCE official=accepted pinned=Lean_4.35.0 target=Array.extract_append_extract"
      - name: Exact hash memo depth-4 replay, strict fuel 4096
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean")
          data=p.read_text()
          marker="private def psKernelC0HashMemoBucket (expr : PsKernelExpr) : Nat :=\n  psKernelC0MemoShapeHash 4 expr"
          assert data.count(marker)==1, "Original memo selector changed; refuse experiment"
          print("C0_SHAPE_AB_VARIANT=depth4 exact_source_hash_proof=unchanged")
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/array-depth4-resources.txt" \
              timeout 420s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-array-extract.ndjson" 4096
          ) > "$RUNNER_TEMP/array-depth4-c0.txt" 2>&1
          rc=$?
          set -e
          echo "C0_SHAPE_AB_RESULT variant=depth4 exit=$rc"
          grep -F 'C0_REAL_EXPORT_PROGRESS' "$RUNNER_TEMP/array-depth4-c0.txt" | tail -n 5 || true
          grep -F 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/array-depth4-c0.txt" | tail -n 5 || true
          if [ "$rc" -eq 0 ]; then
            grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted" "$RUNNER_TEMP/array-depth4-c0.txt"
            echo "C0_SHAPE_AB_CLASS variant=depth4 classification=checked_accepted"
          elif [ "$rc" -eq 124 ]; then
            echo "C0_SHAPE_AB_CLASS variant=depth4 classification=unqualified_host_timeout"
          else
            tail -n 40 "$RUNNER_TEMP/array-depth4-c0.txt"
            exit "$rc"
          fi
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size|Exit status' "$RUNNER_TEMP/array-depth4-resources.txt" || true
      - name: Exact hash memo depth-5 replay on same runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean")
          data=p.read_text()
          marker="private def psKernelC0HashMemoBucket (expr : PsKernelExpr) : Nat :=\n  psKernelC0MemoShapeHash 4 expr"
          assert data.count(marker)==1, "Original memo selector changed; refuse experiment"
          p.write_text(data.replace(marker,marker.replace(" 4 expr"," 5 expr")))
          print("C0_SHAPE_AB_VARIANT=depth5 exact_source_hash_proof=unchanged")
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/array-depth5-resources.txt" \
              timeout 420s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-array-extract.ndjson" 4096
          ) > "$RUNNER_TEMP/array-depth5-c0.txt" 2>&1
          rc=$?
          set -e
          echo "C0_SHAPE_AB_RESULT variant=depth5 exit=$rc"
          grep -F 'C0_REAL_EXPORT_PROGRESS' "$RUNNER_TEMP/array-depth5-c0.txt" | tail -n 5 || true
          grep -F 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/array-depth5-c0.txt" | tail -n 5 || true
          if [ "$rc" -eq 0 ]; then
            grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted" "$RUNNER_TEMP/array-depth5-c0.txt"
            echo "C0_SHAPE_AB_CLASS variant=depth5 classification=checked_accepted"
          elif [ "$rc" -eq 124 ]; then
            echo "C0_SHAPE_AB_CLASS variant=depth5 classification=unqualified_host_timeout"
          else
            tail -n 40 "$RUNNER_TEMP/array-depth5-c0.txt"
            exit "$rc"
          fi
          grep -E 'Elapsed \(wall clock\)|Maximum resident set size|Exit status' "$RUNNER_TEMP/array-depth5-resources.txt" || true
          echo "C0_SHAPE_AB_SCOPE same_runner_official_positive_not_full_Init_or_WF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-array-shape-depth-ab
          path: |
            ${{ runner.temp }}/array-*-resources.txt
            ${{ runner.temp }}/array-*-c0.txt
            ${{ runner.temp }}/c0-array-official.txt
          if-no-files-found: warn
          retention-days: 14
