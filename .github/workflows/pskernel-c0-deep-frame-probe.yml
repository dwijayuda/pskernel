name: PSKernel-C0 experimental deep inference frame compile guards
on:
  pull_request:
    branches: [perf/pskernel-c0-v7-rust-20261012]
    paths:
      - '.github/workflows/pskernel-c0-deep-frame-probe.yml'
      - 'psc0/packages/pskernel-c0/lakefile.lean'
      - 'psc0/packages/pskernel-c0/src/**'
      - 'psc0/packages/pskernel-c0/test/C0DeepFrameProof.lean'
      - 'psc0/packages/pskernel-c0/test/C0DeepFrameSourceProof.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonadmitting-frame-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Compile pinned source and explicit fuel guards
        shell: bash
        run: |
          set -euo pipefail
          cd psc0/packages/pskernel-c0
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.35.0
          test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          lake build PsKernelC0
          lake env lean -R src test/C0DeepFrameProof.lean
          lake env lean -R src test/C0DeepFrameSourceProof.lean
          lake build c0OfficialReplay
          echo 'C0_DEEP_FRAME=SOURCE_COMPILED_NONADMITTING fuel=4096'
