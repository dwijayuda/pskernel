name: PSKernel-C0 pinned Init dependency probe
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-dependency-probe.yml'
      - 'psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean'
      - 'psc0/packages/pskernel-c0/src/**'
  workflow_dispatch:
    inputs:
      declaration:
        description: Exact Lean declaration name to export with transitive dependencies
        required: true
        default: String.Slice.Pattern.ForwardSliceSearcher.instIteratorIdSearchStep
        type: string
permissions:
  contents: read
jobs:
  pinned-dependency-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce pinned exporter and native C0
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat psc0/packages/pskernel-c0/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
      # Complete bounded official-positive cases before the expensive
      # 499130-record timeout-prone dependency. Failed long-CI diagnostics
      # must not suppress independent Cooper/BitVec conformance evidence.
      - name: Mandate pinned Cooper theorem closure and strict C0 verdict
        shell: bash
        run: |
          set -euo pipefail
          # This second independent corpus case is the pinned theorem near
          # full Init record 5068573. It passed the isolated 114487-record
          # differential check, not the full retained-context Init gate.
          (
            cd "$RUNNER_TEMP/lean4export"
            lake env .lake/build/bin/lean4export Init -- Int.Internal.Linear.cooper_dvd_right \
              > "$RUNNER_TEMP/Init-cooper-435.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/Init-cooper-435.ndjson" \
              > "$RUNNER_TEMP/Init-cooper-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/Init-cooper-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/Init-cooper-435.ndjson")" -eq 114487
          test "$(stat -c%s "$RUNNER_TEMP/Init-cooper-435.ndjson")" -eq 5847444
          echo "2e57b983242e47f7dd1c95679ee0697b21aae688bfd38b6039d95c23b49100c1  $RUNNER_TEMP/Init-cooper-435.ndjson" | sha256sum -c -
          (
            cd psc0/packages/pskernel-c0
            timeout 180s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
              --require-accepted "$RUNNER_TEMP/Init-cooper-435.ndjson" 4096
          ) | tee "$RUNNER_TEMP/Init-cooper-c0.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=114487 fuel=4096" "$RUNNER_TEMP/Init-cooper-c0.txt"
          echo "C0_DEPENDENCY_COOPER_PINNED_QUALIFIED same_bytes=114487 official=accepted c0=accepted fuel=4096"
          echo "C0_DEPENDENCY_COOPER_SCOPE=dependency_closure_only_not_full_Init"
      - name: Mandate exact BitVec theorem after qualified 5.068M Init prefix
        shell: bash
        run: |
          set -euo pipefail
          # This is the isolated next real Init theorem (record 5068793).
          # Do not promote its dependency-only conformance to full Init.
          (
            cd "$RUNNER_TEMP/lean4export"
            lake env .lake/build/bin/lean4export Init -- 'BitVec.lt_of_isSome_getElem?' > "$RUNNER_TEMP/Init-bitvec-435.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/Init-bitvec-435.ndjson" > "$RUNNER_TEMP/Init-bitvec-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/Init-bitvec-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/Init-bitvec-435.ndjson")" -eq 21407
          test "$(stat -c%s "$RUNNER_TEMP/Init-bitvec-435.ndjson")" -eq 1176296
          echo "ee71d2fcc99e0ff1b5a7f37c7a9b609999e8e027f24635e784095db9cab3f1c3  $RUNNER_TEMP/Init-bitvec-435.ndjson" | sha256sum -c -
          (
            cd psc0/packages/pskernel-c0
            timeout 180s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
              --require-accepted "$RUNNER_TEMP/Init-bitvec-435.ndjson" 4096
          ) | tee "$RUNNER_TEMP/Init-bitvec-c0.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=21407 fuel=4096" "$RUNNER_TEMP/Init-bitvec-c0.txt"
          echo "C0_DEPENDENCY_BITVEC_PINNED_QUALIFIED same_bytes=21407 official=accepted c0=accepted fuel=4096"
          echo "C0_DEPENDENCY_BITVEC_SCOPE=dependency_closure_only_not_full_Init"
      - name: Export declaration closure and compare original kernel
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.declaration || 'String.Slice.Pattern.ForwardSliceSearcher.instIteratorIdSearchStep' }}
        run: |
          set -euo pipefail
          test -n "$TARGET"
          echo "C0_DEPENDENCY_TARGET=$TARGET"
          echo "C0_DEPENDENCY_EXPERIMENT=certified_fvar_and_exact_expanded_node_count"
          echo "C0_DEPENDENCY_POLICY=unchanged_fuel_4096_strict_same_bytes"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake env .lake/build/bin/lean4export Init -- "$TARGET" > "$RUNNER_TEMP/Init-dependency-435.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/Init-dependency-435.ndjson" > "$RUNNER_TEMP/Init-dependency-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/Init-dependency-official.txt"
          echo "C0_DEPENDENCY_OFFICIAL=accepted"
          sha256sum "$RUNNER_TEMP/Init-dependency-435.ndjson"
          wc -lc "$RUNNER_TEMP/Init-dependency-435.ndjson"
          # The default pinned witness is now a mandatory, exact-byte
          # positive differential conformance test. Other workflow_dispatch
          # declarations remain diagnostic (with official positive checking).
          if [ "$TARGET" = "String.Slice.Pattern.ForwardSliceSearcher.instIteratorIdSearchStep" ]; then
            test "$(stat -c%s "$RUNNER_TEMP/Init-dependency-435.ndjson")" -eq 25031309
            test "$(wc -l < "$RUNNER_TEMP/Init-dependency-435.ndjson")" -eq 499130
            echo "7448c45db0a440983a587432a2bbd2dfb4b77e7d788b6c5f0ce66fe876fff286  $RUNNER_TEMP/Init-dependency-435.ndjson" | sha256sum -c -
          fi
          # The previous 900-second host cap often expired during valid,
          # independently accepted Array proof bodies on slower GitHub
          # runners. Permit 1500 seconds of *host wall time* only; preserve
          # the same exact pinned export, source checker, and Lean fuel 4096.
          # Timeout still fails the strict acceptance gate, never admits proof.
          # Opt-in diagnostic prints the active declaration BEFORE checking;
          # timeout artifacts can identify the stalled name without altering
          # source acceptance, resource budgets, or export bytes.
          (
            cd psc0/packages/pskernel-c0
            timeout 1500s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay --trace-declarations "$RUNNER_TEMP/Init-dependency-435.ndjson" 4096
          ) | tee "$RUNNER_TEMP/Init-dependency-c0.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=" "$RUNNER_TEMP/Init-dependency-c0.txt"
          if [ "$TARGET" = "String.Slice.Pattern.ForwardSliceSearcher.instIteratorIdSearchStep" ]; then
            grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=499130 fuel=4096" "$RUNNER_TEMP/Init-dependency-c0.txt"
            echo "C0_DEPENDENCY_PINNED_QUALIFIED same_bytes=499130 official=accepted c0=accepted fuel=4096"
          fi
          echo "C0_DEPENDENCY_RESULT=dependency_closure_only_not_full_Init_qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-pinned-dependency-probe
          path: |
            ${{ runner.temp }}/Init-dependency-435.ndjson
            ${{ runner.temp }}/Init-dependency-official.txt
            ${{ runner.temp }}/Init-dependency-c0.txt
            ${{ runner.temp }}/Init-cooper-435.ndjson
            ${{ runner.temp }}/Init-cooper-official.txt
            ${{ runner.temp }}/Init-cooper-c0.txt
            ${{ runner.temp }}/Init-bitvec-435.ndjson
            ${{ runner.temp }}/Init-bitvec-official.txt
            ${{ runner.temp }}/Init-bitvec-c0.txt
          if-no-files-found: warn
          retention-days: 14
