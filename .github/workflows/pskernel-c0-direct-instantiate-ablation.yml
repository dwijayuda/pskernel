name: PSKernel-C0 direct binder instantiation ablation
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-direct-instantiate-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loose-bvar:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce Lean 4.35 real pinned WF theorem and official acceptance
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          (cd "$RUNNER_TEMP/lean4export" &&
            lake build lean4export &&
            lake env .lake/build/bin/lean4export Init -- 'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix' > "$RUNNER_TEMP/instantiate-wf.ndjson" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/instantiate-wf.ndjson" > "$RUNNER_TEMP/instantiate-wf-official.txt" 2>&1)
          test "$(wc -l < "$RUNNER_TEMP/instantiate-wf.ndjson")" -eq 15758
          test "$(stat -c%s "$RUNNER_TEMP/instantiate-wf.ndjson")" -eq 777157
          echo "1d97cdd876069322a27ab69b2a1607e615695c8c0be065bbbb0db476833b5abe  $RUNNER_TEMP/instantiate-wf.ndjson" | sha256sum -c -
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/instantiate-wf-official.txt"
      - name: Remove redundant closed-binder variable scan in disposable source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Substitution/Instantiate.lean")
          content=path.read_text()
          start=content.index("def psKernelExprInstantiate1\n")
          end=content.index("\ndef psKernelExprInstantiateRev\n",start)
          original=content[start:end]
          assert original.count("psKernelExprHasLooseBVar expr")==1
          replacement="""def psKernelExprInstantiate1
              (expr : PsKernelExpr)
              (replacement : PsKernelExpr) : PsKernelExpr :=
            Prod.fst (psKernelC0ExprInstantiateOneChanged expr replacement 0)

          """
          replacement="\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines())+"\n"
          path.write_text(content[:start]+replacement+content[end:])
          print("C0_INSTANTIATE_ABLATION full_source_instantiation=true redundant_probe=absent")
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
      - name: Keep native official and negative proof regressions unchanged
        shell: bash
        working-directory: psc0/packages/pskernel-c0
        run: |
          set -euo pipefail
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0ProofCongruenceRegression.lean
          echo "C0_INSTANTIATE_ABLATION_REGRESSIONS=pass"
      - name: Check actual WF proof at original fuel with direct binder instantiation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd psc0/packages/pskernel-c0 &&
            /usr/bin/time -v -o "$RUNNER_TEMP/instantiate-wf-resources.txt" \
              timeout 165s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted "$RUNNER_TEMP/instantiate-wf.ndjson" 4096) \
                > "$RUNNER_TEMP/instantiate-wf-c0.txt" 2>&1
          rc=$?
          set -e
          echo "C0_INSTANTIATE_ABLATION_EXIT=$rc"
          grep 'C0_REAL_EXPORT replay_outcome' "$RUNNER_TEMP/instantiate-wf-c0.txt" | tail -n 2 || true
          if test "$rc" -eq 0 &&
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096" "$RUNNER_TEMP/instantiate-wf-c0.txt"; then
            echo "C0_INSTANTIATE_ABLATION_RESULT=accepted_candidate_only"
          else
            echo "C0_INSTANTIATE_ABLATION_RESULT=not_qualified"
          fi
          cat "$RUNNER_TEMP/instantiate-wf-resources.txt"
          echo "C0_INSTANTIATE_ABLATION_SCOPE=disposable_only_not_trusted_kernel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-direct-instantiate-ablation
          path: |
            ${{ runner.temp }}/instantiate-wf-official.txt
            ${{ runner.temp }}/instantiate-wf-c0.txt
            ${{ runner.temp }}/instantiate-wf-resources.txt
          if-no-files-found: warn
          retention-days: 14
