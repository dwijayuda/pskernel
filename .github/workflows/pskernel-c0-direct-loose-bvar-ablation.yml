name: PSKernel-C0 source loose-BVar traversal ablation
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-direct-loose-bvar-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loose-bvar:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce Lean 4.35 real pinned WF theorem and official acceptance
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          (cd "$RUNNER_TEMP/lean4export" &&
            lake build lean4export &&
            lake env .lake/build/bin/lean4export Init -- 'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix' > "$RUNNER_TEMP/loose-wf.ndjson" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/loose-wf.ndjson" > "$RUNNER_TEMP/loose-wf-official.txt" 2>&1)
          test "$(wc -l < "$RUNNER_TEMP/loose-wf.ndjson")" -eq 15758
          test "$(stat -c%s "$RUNNER_TEMP/loose-wf.ndjson")" -eq 777157
          echo "1d97cdd876069322a27ab69b2a1607e615695c8c0be065bbbb0db476833b5abe  $RUNNER_TEMP/loose-wf.ndjson" | sha256sum -c -
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/loose-wf-official.txt"
      - name: Replace only curried free-bvar existence scan in disposable source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Expr.lean")
          s=path.read_text()
          start=s.index("def psKernelExprHasLooseAt\n")
          end=s.index("\ndef psKernelExprHasLooseBVar\n",start)
          replacement="""/-- Diagnostic source-exact direct recursion, short-circuits before
    constructing subtree functions. Never substitutes a checking judgment. -/
def psKernelC0HasLooseAtDirect (expr : PsKernelExpr) (offset : Nat) : Bool :=
  match expr with
  | .bvar index => Nat.ble offset index
  | .app fn arg =>
      psKernelC0HasLooseAtDirect fn offset ||
        psKernelC0HasLooseAtDirect arg offset
  | .lam _ type body _ =>
      psKernelC0HasLooseAtDirect type offset ||
        psKernelC0HasLooseAtDirect body (offset + 1)
  | .forallE _ type body _ =>
      psKernelC0HasLooseAtDirect type offset ||
        psKernelC0HasLooseAtDirect body (offset + 1)
  | .letE _ type value body _ =>
      psKernelC0HasLooseAtDirect type offset ||
        psKernelC0HasLooseAtDirect value offset ||
        psKernelC0HasLooseAtDirect body (offset + 1)
  | .mdata _ body => psKernelC0HasLooseAtDirect body offset
  | .proj _ _ body => psKernelC0HasLooseAtDirect body offset
  | _ => false

def psKernelExprHasLooseAt (expr : PsKernelExpr) : Nat → Bool :=
  fun offset => psKernelC0HasLooseAtDirect expr offset
"""
          assert "psKernelExprHasLooseAt" in s[start:end]
          path.write_text(s[:start]+replacement+s[end:])
          print("C0_DIRECT_LOOSE_BVAR_ABLATION source_equivalent=true diagnostic_only=true")
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
      - name: Keep native official and negative proof regressions unchanged
        shell: bash
        working-directory: psc0/packages/pskernel-c0
        run: |
          set -euo pipefail
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0ProofCongruenceRegression.lean
          echo "C0_DIRECT_LOOSE_BVAR_REGRESSIONS=pass"
      - name: Compare hard real WF checker outcome without increasing fuel
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd psc0/packages/pskernel-c0 &&
            /usr/bin/time -v -o "$RUNNER_TEMP/loose-wf-resources.txt" \
              timeout 165s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted "$RUNNER_TEMP/loose-wf.ndjson" 4096) \
                > "$RUNNER_TEMP/loose-wf-c0.txt" 2>&1
          rc=$?
          set -e
          echo "C0_DIRECT_LOOSE_BVAR_EXIT=$rc"
          grep 'C0_REAL_EXPORT replay_outcome' "$RUNNER_TEMP/loose-wf-c0.txt" | tail -n 2 || true
          if test "$rc" -eq 0 &&
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096" "$RUNNER_TEMP/loose-wf-c0.txt"; then
            echo "C0_DIRECT_LOOSE_BVAR_RESULT=accepted_candidate_only"
          else
            echo "C0_DIRECT_LOOSE_BVAR_RESULT=not_qualified"
          fi
          cat "$RUNNER_TEMP/loose-wf-resources.txt"
          echo "C0_DIRECT_LOOSE_BVAR_SCOPE=disposable_only_not_trusted_kernel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-direct-loose-bvar-ablation
          path: |
            ${{ runner.temp }}/loose-wf-official.txt
            ${{ runner.temp }}/loose-wf-c0.txt
            ${{ runner.temp }}/loose-wf-resources.txt
          if-no-files-found: warn
          retention-days: 14
