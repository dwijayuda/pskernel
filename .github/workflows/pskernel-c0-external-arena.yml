name: PSKernel-C0 historical Arena archive provenance (NOT conformance)
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-external-arena.yml'
      - 'psc0/packages/pskernel-c0/test/arena_conformance.py'
  pull_request:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-external-arena.yml'
      - 'psc0/packages/pskernel-c0/test/arena_conformance.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-archive-integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate unchanged September Arena archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo "98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  $RUNNER_TEMP/lean-arena-round-2026-09-tests.tar.gz" | sha256sum -c -
      - name: Verify all 193 historical cases without misleading 4.35 decline verdicts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "psc0/packages/pskernel-c0/test")
          from arena_conformance import ARCHIVE_SHA256, check_archive, decode_source_pin
          src=Path(os.environ["RUNNER_TEMP"])/"lean-arena-round-2026-09-tests.tar.gz"
          cases=check_archive(src)
          assert len(cases)==193, len(cases)
          labels=Counter(label for label,_,_ in cases)
          assert labels=={"good":122,"bad":71}, labels
          sources=Counter(decode_source_pin(raw).get("lean","invalid") for _,_,raw in cases)
          record={
              "kind":"historical_Arena_2026_09_integrity_ONLY",
              "archive_sha256":ARCHIVE_SHA256,
              "historical_cases":193,
              "good_source_cases":122,
              "bad_source_cases":71,
              "source_lean_version_histogram":dict(sorted(sources.items())),
              "current_C0_target_lean":"4.35.0",
              "semantically_checked_cases":0,
              "declined_cases":0,
              "strict_native_semantic_differential_location":".github/workflows/pskernel-c0-arena-lean435-compat.yml",
              "explanation":"No kernel verdict is asserted here. The separate native-4.35 dual-check workflow checks all 193 historic declaration bodies against official 4.35 and C0. Do not present archived version mismatches as kernel check results."
          }
          out=Path(os.environ["RUNNER_TEMP"])/"c0-historical-arena-provenance.json"
          out.write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print(f"C0_ARENA_HISTORICAL_PROVENANCE verified_archive=true cases=193 good=122 bad=71 semantic_verdicts=0 declines=0")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pskernel-c0-historical-arena-provenance
          path: ${{ runner.temp }}/c0-historical-arena-provenance.json
          retention-days: 30
