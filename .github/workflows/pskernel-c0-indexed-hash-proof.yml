name: PSKernel-C0 certified indexed checker-hash source proof
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-indexed-hash-proof.yml'
      - 'psc0/packages/pskernel-c0/lakefile.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Architecture/VerifiedIndexedHash.lean'
      - 'psc0/packages/pskernel-c0/test/C0VerifiedIndexedHashRegression.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexed-source-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Prove stored indexed checker hashes correspond to original C0 source
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          lake build Ps.KernelCore.Architecture.VerifiedIndexedHash
          lake env lean --run test/C0VerifiedIndexedHashRegression.lean
          echo "C0_INDEXED_HASH_PROOF full_source_hash=Lean exact_owner=pass malformed=declined"
      - name: Preserve official and negative native checker fixture acceptance
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          lake build c0OfficialReplay
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0ProofCongruenceRegression.lean
          echo "C0_INDEXED_HASH_NEGATIVES verified_source=pass"
