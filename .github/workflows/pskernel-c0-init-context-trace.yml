name: PSKernel-C0 retained-context Init stall trace
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-init-context-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-context:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Restore the exact pinned official Init export
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/Init-4.35.0.ndjson
          key: c0-init-v435-lean4export-5a9a355-c1b2071a6d2132ace8c4711499f078aab2117d925213d5a222a1fe843a59a179
      - name: Reconstruct and independently check pinned original prefix
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          if test ! -s "$RUNNER_TEMP/Init-4.35.0.ndjson"; then
            git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
            git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
            (cd "$RUNNER_TEMP/lean4export" && lake build lean4export &&
              lake env .lake/build/bin/lean4export Init > "$RUNNER_TEMP/Init-4.35.0.ndjson")
          fi
          test "$(wc -l < "$RUNNER_TEMP/Init-4.35.0.ndjson")" -eq 6452982
          test "$(stat -c%s "$RUNNER_TEMP/Init-4.35.0.ndjson")" -eq 345690182
          echo "c1b2071a6d2132ace8c4711499f078aab2117d925213d5a222a1fe843a59a179  $RUNNER_TEMP/Init-4.35.0.ndjson" | sha256sum -c -
          head -n 5068793 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/C0-init-context-prefix.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/C0-init-context-prefix.ndjson")" -eq 5068793
          if test ! -d "$RUNNER_TEMP/lean4export/.git"; then
            git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
            git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          fi
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" &&
            lake build lean4export &&
            lake env leanchecker --from-export "$RUNNER_TEMP/C0-init-context-prefix.ndjson" > "$RUNNER_TEMP/C0-init-context-official.txt" 2>&1)
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/C0-init-context-official.txt"
          echo "C0_INIT_CONTEXT_OFFICIAL=accepted exact_original_prefix=5068793"
      - name: Insert diagnostic-only declaration entry prints into disposable test executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean')
          code=path.read_text()
          needle='      let outcome := c0ExportStepDetailed state line fuel'
          assert code.count(needle)==1, 'Unrecognized source; refusing instrumentation'
          trace_lines=[
              '      if consumed >= 5068000 && !declKind.isEmpty then',
              '        IO.println s!"C0_INIT_TRACE_START record={consumed} kind={declKind}"',
          ]
          code=code.replace(needle,'\n'.join(trace_lines)+'\n'+needle)
          path.write_text(code)
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          echo "C0_INIT_TRACE_BUILD=diagnostic_only_not_acceptance_authority"
      # New upper boundary includes the very next distinct theorem after the
      # validated 5,068,573-record prefix; this is NOT a repeated 5.068M gate.
      - name: Bound source-equivalent instrumented prefix replay
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/C0-init-context-resources.txt" \
              timeout 2650s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
              "$RUNNER_TEMP/C0-init-context-prefix.ndjson" 4096
          ) > "$RUNNER_TEMP/C0-init-context-native.txt" 2>&1
          status=$?
          set -e
          echo "C0_INIT_TRACE_PROCESS_EXIT=$status"
          grep "C0_INIT_TRACE_START" "$RUNNER_TEMP/C0-init-context-native.txt" | tail -n 20 || true
          grep "C0_REAL_EXPORT_PROGRESS" "$RUNNER_TEMP/C0-init-context-native.txt" | tail -n 6 || true
          tail -n 15 "$RUNNER_TEMP/C0-init-context-native.txt"
          echo "C0_INIT_TRACE_DIAGNOSTIC_ONLY=yes; kernel_verdict_not_assumed=yes"
          cat "$RUNNER_TEMP/C0-init-context-resources.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-init-context-trace
          path: |
            ${{ runner.temp }}/C0-init-context-official.txt
            ${{ runner.temp }}/C0-init-context-native.txt
            ${{ runner.temp }}/C0-init-context-resources.txt
          if-no-files-found: warn
          retention-days: 14
