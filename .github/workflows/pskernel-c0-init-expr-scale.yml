name: PSKernel-C0 unused expression DAG pressure diagnostic
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-init-expr-scale.yml'
      - 'psc0/packages/pskernel-c0/test/C0InitExprScale.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expression-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Build exact pinned C0 checker and official exporter
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc &&
            lake build c0OfficialReplay)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
          python3 -m py_compile psc0/packages/pskernel-c0/test/C0InitExprScale.py
      - name: Produce digest-verified Cooper dependency source
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/lean4export" &&
            lake env .lake/build/bin/lean4export Init -- Int.Internal.Linear.cooper_dvd_right > "$RUNNER_TEMP/cooper-source.ndjson" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/cooper-source.ndjson" > "$RUNNER_TEMP/cooper-source-official.txt" 2>&1)
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/cooper-source-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/cooper-source.ndjson")" -eq 114487
          test "$(stat -c%s "$RUNNER_TEMP/cooper-source.ndjson")" -eq 5847444
          echo "2e57b983242e47f7dd1c95679ee0697b21aae688bfd38b6039d95c23b49100c1  $RUNNER_TEMP/cooper-source.ndjson" | sha256sum -c -
      - name: Compare official and C0 on increasing unused DAG size
        shell: bash
        run: |
          set -euo pipefail
          for extra in 200000 2500000; do
            path="$RUNNER_TEMP/cooper-exprs-${extra}.ndjson"
            python3 psc0/packages/pskernel-c0/test/C0InitExprScale.py \
              "$RUNNER_TEMP/cooper-source.ndjson" "$path" --expressions "$extra"
            echo "C0_EXPR_SCALE_SIZE expressions=$extra synthetic_unused=yes"
            set +e
            (cd "$RUNNER_TEMP/lean4export" &&
              timeout 540s lake env leanchecker --from-export "$path") > "$RUNNER_TEMP/cooper-exprs-${extra}-official.txt" 2>&1
            official=$?
            set -e
            echo "C0_EXPR_SCALE_OFFICIAL_EXIT expressions=$extra code=$official"
            if test "$official" -ne 0; then
              tail -n 30 "$RUNNER_TEMP/cooper-exprs-${extra}-official.txt"
              echo "C0_EXPR_SCALE_DIAGNOSTIC=invalid_synthetic_or_official_resource_not_kernel_evidence"
              break
            fi
            grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/cooper-exprs-${extra}-official.txt"
            set +e
            (cd psc0/packages/pskernel-c0 &&
              /usr/bin/time -v -o "$RUNNER_TEMP/cooper-exprs-${extra}-resources.txt" \
              timeout 540s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted "$path" 4096) > "$RUNNER_TEMP/cooper-exprs-${extra}-c0.txt" 2>&1
            checker=$?
            set -e
            echo "C0_EXPR_SCALE_C0_EXIT expressions=$extra code=$checker"
            grep "C0_REAL_EXPORT_PROGRESS" "$RUNNER_TEMP/cooper-exprs-${extra}-c0.txt" | tail -n 4 || true
            grep "C0_REAL_EXPORT replay_outcome" "$RUNNER_TEMP/cooper-exprs-${extra}-c0.txt" | tail -n 2 || true
            if test "$checker" -ne 0; then
              tail -n 20 "$RUNNER_TEMP/cooper-exprs-${extra}-c0.txt"
              echo "C0_EXPR_SCALE_DIAGNOSTIC=C0_nonacceptance_or_host_timeout_not_real_Init"
              break
            fi
            echo "C0_EXPR_SCALE_DIAGNOSTIC=both_kernels_accepted_synthetic_unused_DAG expressions=$extra"
            cat "$RUNNER_TEMP/cooper-exprs-${extra}-resources.txt"
          done
          echo "C0_EXPR_SCALE_SCOPE=synthetic_unused_DAG_never_a_kernel_proof_or_full_Init_qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-unused-expression-DAG-pressure
          path: |
            ${{ runner.temp }}/cooper-exprs-*-official.txt
            ${{ runner.temp }}/cooper-exprs-*-c0.txt
            ${{ runner.temp }}/cooper-exprs-*-resources.txt
          if-no-files-found: warn
          retention-days: 14
