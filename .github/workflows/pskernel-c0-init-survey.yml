name: PSKernel-C0 real Lean 4.35 Init exporter survey
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-init-survey.yml'
      - 'psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Checker/DefEq/**'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Checker/Inference/**'
      # Fresh-name identity and environment-local context are trusted
      # semantics; changes must qualify on real pinned Init, not native alone.
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Checker/State.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Checker/Context.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Checker/Knot.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  init-export-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce exporter source and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat psc0/packages/pskernel-c0/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
      - name: Restore digest-pinned official Init source bytes
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Init-4.35.0.ndjson
          key: c0-init-v435-lean4export-5a9a355-c1b2071a6d2132ace8c4711499f078aab2117d925213d5a222a1fe843a59a179
          save-always: true
      - name: Export or validate pinned Init and independently verify with Lean
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s "$RUNNER_TEMP/Init-4.35.0.ndjson"; then
            (cd "$RUNNER_TEMP/lean4export" && lake env .lake/build/bin/lean4export Init > "$RUNNER_TEMP/Init-4.35.0.ndjson")
          fi
          test "$(stat -c%s "$RUNNER_TEMP/Init-4.35.0.ndjson")" -eq 345690182
          test "$(wc -l < "$RUNNER_TEMP/Init-4.35.0.ndjson")" -eq 6452982
          echo "c1b2071a6d2132ace8c4711499f078aab2117d925213d5a222a1fe843a59a179  $RUNNER_TEMP/Init-4.35.0.ndjson" | sha256sum -c -
          # Even cached *identical bytes* need fresh official acceptance:
          # cache identity is never a checked admission or proof receipt.
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$RUNNER_TEMP/Init-4.35.0.ndjson") > "$RUNNER_TEMP/leanchecker-result.txt" 2>&1 || {
            cat "$RUNNER_TEMP/leanchecker-result.txt"
            exit 1
          }
          cat "$RUNNER_TEMP/leanchecker-result.txt"
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/leanchecker-result.txt"
      - name: Preserve and inspect real first inductive export prefix
        shell: bash
        run: |
          set -euo pipefail
          head -n 153 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-inductive.ndjson"
          # This prefix includes the first three real exported inductive groups.
          # A verdict on the prefix is separate from the full Init check.
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$RUNNER_TEMP/Init-first-inductive.ndjson") > "$RUNNER_TEMP/first-inductive-official.txt" 2>&1 || {
            cat "$RUNNER_TEMP/first-inductive-official.txt"
            echo "C0_REAL_INIT_PREFIX_OFFICIAL verdict=not_accepted"
            exit 0
          }
          cat "$RUNNER_TEMP/first-inductive-official.txt"
          echo "C0_REAL_INIT_PREFIX_BEGIN"
          cat "$RUNNER_TEMP/Init-first-inductive.ndjson"
          echo "C0_REAL_INIT_PREFIX_END"
      - name: Build the exact C0 NDJSON replay as native Lean before real prefixes
        working-directory: psc0/packages/pskernel-c0
        run: lake build c0OfficialReplay
      - name: Qualify corrected first 12244 real Init export records in C0
        shell: bash
        run: |
          set -euo pipefail
          head -n 12244 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-12244.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-first-12244.ndjson")" -eq 12244
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          (
            cd "$c0"
            timeout 120s .lake/build/bin/c0OfficialReplay "$RUNNER_TEMP/Init-first-12244.ndjson" 4096
          ) | tee "$RUNNER_TEMP/c0-first-12244-result.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=12244" "$RUNNER_TEMP/c0-first-12244-result.txt"
      - name: Inspect the first real Init nested-inductive metadata
        shell: bash
        run: |
          set -euo pipefail
          head -n 86383 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-mismatch.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-first-mismatch.ndjson")" -eq 86383
          python3 - "$RUNNER_TEMP/Init-4.35.0.ndjson" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = 79416
          names = {0: ""}
          levels = {0: "0"}
          expressions = {}
          def render_level(index):
              return levels.get(index, f"<missing-level-{index}>")
          def render_expr(index, depth=0):
              if depth > 24:
                  return f"<depth:{index}>"
              x = expressions.get(index)
              if x is None:
                  return f"<missing-expr-{index}>"
              if "sort" in x:
                  return f"Sort({render_level(x['sort'])})"
              if "bvar" in x:
                  return f"#{x['bvar']}"
              if "const" in x:
                  c = x["const"]
                  return names.get(c["name"], "?") + ("[" + ",".join(render_level(u) for u in c["us"]) + "]")
              if "app" in x:
                  c = x["app"]
                  return f"({render_expr(c['fn'], depth+1)} {render_expr(c['arg'],depth+1)})"
              for kind in ("forallE", "lam"):
                  if kind in x:
                      c = x[kind]
                      return f"({kind} {names.get(c['name'],'_')}:{render_expr(c['type'],depth+1)}. {render_expr(c['body'],depth+1)})"
              if "letE" in x:
                  c = x["letE"]
                  return f"(let {names.get(c['name'],'_')}:{render_expr(c['type'],depth+1)} := {render_expr(c['value'],depth+1)}; {render_expr(c['body'],depth+1)})"
              return f"expr[{index}]:{list(x)}"
          with source.open(encoding="utf-8") as file:
              for line_no, raw in enumerate(file, 1):
                  obj = json.loads(raw)
                  if "in" in obj:
                      part = obj.get("str") or obj.get("num")
                      parent = names.get(part["pre"], "?")
                      suffix = part.get("str", part.get("i"))
                      names[obj["in"]] = parent + ("." if parent else "") + str(suffix)
                  elif "il" in obj:
                      if "param" in obj:
                          levels[obj["il"]] = names.get(obj["param"], "?")
                      elif "succ" in obj:
                          levels[obj["il"]] = "succ(" + render_level(obj["succ"]) + ")"
                      elif "max" in obj:
                          levels[obj["il"]] = "max(" + ",".join(render_level(k) for k in obj["max"]) + ")"
                      elif "imax" in obj:
                          levels[obj["il"]] = "imax(" + ",".join(render_level(k) for k in obj["imax"]) + ")"
                  elif "ie" in obj:
                      expressions[obj["ie"]] = obj
                  if line_no == target:
                      print(f"C0_REAL_INIT_DIVERGENCE record={line_no} tag={list(obj)}")
                      if "inductive" in obj:
                          group = obj["inductive"]
                          for typ in group["types"]:
                              print(f"  TYPE {names.get(typ['name'])} universe={list(map(render_level,typ['levelParams']))} numParams={typ['numParams']} numIndices={typ['numIndices']} type={render_expr(typ['type'])}")
                          for ctor in group["ctors"]:
                              print(f"  CTOR {names.get(ctor['name'])} fields={ctor['numFields']} type={render_expr(ctor['type'])}")
                      else:
                          print(json.dumps(obj)[:8000])
                      break
          if line_no != target:
              raise RuntimeError("did not reach C0 first divergence record")
          PY
      - name: Qualify one-delta checked-inductive WHNF boundary on real Init
        shell: bash
        run: |
          set -euo pipefail
          head -n 79416 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-nested.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-first-nested.ndjson")" -eq 79416
          (
            cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
            timeout 120s .lake/build/bin/c0OfficialReplay "$RUNNER_TEMP/Init-first-nested.ndjson" 4096
          ) | tee "$RUNNER_TEMP/c0-first-nested-result.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=79416" "$RUNNER_TEMP/c0-first-nested-result.txt"
      - name: Publish declaration and expression coverage inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Init-4.35.0.ndjson" "$RUNNER_TEMP/Init-4.35.0-survey.json" <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path
          import sys
          source, output = (Path(p) for p in sys.argv[1:])
          declaration_tags = {"axiom", "def", "thm", "opaque", "quot", "inductive"}
          supported = {"axiom", "def", "thm", "opaque"}
          expression_tags = {"bvar", "sort", "const", "app", "lam", "forallE",
                             "letE", "proj", "natVal", "strVal", "mdata", "fvar", "mvar"}
          expr_counts, decl_counts = Counter(), Counter()
          unknown_counts, examples = Counter(), []
          inductive_shapes, special_inductives = Counter(), []
          header = None
          hasher = hashlib.sha256()
          lines = 0
          with source.open("rb") as f:
              for raw in f:
                  hasher.update(raw)
                  lines += 1
                  item = json.loads(raw)
                  keys = set(item)
                  if "meta" in keys:
                      header = item["meta"]
                  elif "ie" in keys:
                      expr_counts.update(keys & expression_tags)
                  elif not (keys & {"in", "il"}):
                      kinds = keys & declaration_tags
                      if len(kinds) == 1:
                          kind = next(iter(kinds))
                          decl_counts[kind] += 1
                          if kind == "inductive":
                              block = item["inductive"]
                              families = block["types"]
                              group_size = len(families)
                              inductive_shapes["ordinary" if group_size == 1 else "mutual"] += 1
                              if any(t.get("numNested", 0) != 0 for t in families):
                                  inductive_shapes["nested"] += 1
                              if any(t.get("isUnsafe", False) for t in families):
                                  inductive_shapes["unsafe"] += 1
                              if any(t.get("isRec", False) for t in families):
                                  inductive_shapes["recursive"] += 1
                              if group_size != 1 or any(t.get("numNested", 0) for t in families):
                                  if len(special_inductives) < 16:
                                      special_inductives.append({
                                          "line": lines,
                                          "type_count": group_size,
                                          "nested": any(t.get("numNested", 0) for t in families),
                                      })
                          if kind not in supported and len(examples) < 12:
                              examples.append({"line": lines, "tag": kind})
                      else:
                          unknown_counts.update(keys)
                          if len(examples) < 12:
                              examples.append({"line": lines, "tags": sorted(keys)})
          if not header or header.get("lean", {}).get("version") != "4.35.0" or (
              header.get("lean", {}).get("githash") !=
              "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          ):
              raise ValueError("unmatched Lean 4.35.0 exporter metadata")
          report = {
              "corpus": "real Lean Init + transitive dependencies",
              "toolchain": "leanprover/lean4:v4.35.0",
              "lean4export_commit": "5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe",
              "sha256": hasher.hexdigest(),
              "byte_size": source.stat().st_size,
              "ndjson_record_count": lines,
              "declaration_counts": dict(sorted(decl_counts.items())),
              "expression_counts": dict(sorted(expr_counts.items())),
              "unknown_record_counts": dict(sorted(unknown_counts.items())),
              "inductive_shapes": dict(sorted(inductive_shapes.items())),
              "first_complex_inductive_groups": special_inductives,
              "first_unsupported_records": examples,
              "scope": "coverage survey only; not a C0 kernel acceptance claim",
          }
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve and inspect first post-nested C0 application disagreement
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Init-4.35.0.ndjson" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          target = 86383
          names = {0: ""}
          levels = {0: "0"}
          exprs = {}
          seen_declarations = 0
          def label(n):
              return names.get(n, f"?{n}")
          def render_expr(n, depth=0):
              if depth > 14:
                  return f"…@{n}"
              x = exprs.get(n)
              if x is None:
                  return f"<missing@{n}>"
              if "sort" in x: return f"Sort({levels.get(x['sort'], '?')})"
              if "bvar" in x: return f"#{x['bvar']}"
              if "const" in x:
                  c = x["const"]
                  return label(c["name"]) + "[" + ",".join(levels.get(u, "?") for u in c["us"]) + "]"
              if "app" in x:
                  a = x["app"]
                  return f"({render_expr(a['fn'], depth+1)} {render_expr(a['arg'],depth+1)})"
              for k in ("forallE","lam"):
                  if k in x:
                      v=x[k]
                      return f"({k} {label(v['name'])}:{render_expr(v['type'],depth+1)}. {render_expr(v['body'],depth+1)})"
              if "letE" in x:
                  v=x["letE"]
                  return f"(let {label(v['name'])}:{render_expr(v['type'],depth+1)} := {render_expr(v['value'],depth+1)}; {render_expr(v['body'],depth+1)})"
              if "proj" in x:
                  return f"proj@{n}={x['proj']}"
              return f"expr@{n}={str(x)[:200]}"
          with path.open(encoding="utf-8") as source:
              for line_num, raw in enumerate(source, 1):
                  rec=json.loads(raw)
                  if "in" in rec:
                      v=rec.get("str") or rec.get("num")
                      name_part=v.get("str",v.get("i"))
                      prior=label(v["pre"]) if v["pre"] else ""
                      names[rec["in"]]=prior + ("." if prior else "") + str(name_part)
                  elif "il" in rec:
                      k=rec["il"]
                      if "succ" in rec: levels[k]=f"succ({levels.get(rec['succ'],'?')})"
                      elif "param" in rec: levels[k]=label(rec["param"])
                      elif "max" in rec: levels[k]="max("+",".join(levels.get(t,"?") for t in rec["max"])+")"
                      elif "imax" in rec: levels[k]="imax("+",".join(levels.get(t,"?") for t in rec["imax"])+")"
                  elif "ie" in rec: exprs[rec["ie"]]=rec
                  elif set(rec) & {"def","thm","axiom","opaque","quot","inductive"}:
                      seen_declarations += 1
                  if line_num == target:
                      print(f"C0_REAL_INIT_NEXT_FAILURE record={line_num} prior_declarations={seen_declarations} source_tags={list(rec)}")
                      print("  exact_source_record="+raw[:15000].rstrip())
                      for family in ("def","thm","axiom","opaque","quot"):
                          if family in rec:
                              d=rec[family]
                              print(f"  declaration={label(d['name'])} kind={family} levels={[label(n) for n in d.get('levelParams',[])]}")
                              print(f"  type={render_expr(d['type'])}")
                              if "value" in d: print(f"  value={render_expr(d['value'])}")
                      if "inductive" in rec:
                          for d in rec["inductive"]["types"]:
                              print(f"  inductive={label(d['name'])} type={render_expr(d['type'])}")
                      break
          if line_num != target:
              raise RuntimeError("did not reach record 86383")
          PY
      - name: Qualify official acceptance of the complete first-false-theorem prefix
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/Init-first-mismatch.ndjson"
          test -s "$prefix"
          test "$(wc -l < "$prefix")" -eq 86383
          # The same bytes/IDs are retained for independent examination;
          # a rejected C0 result can NEVER stand in for official rejection.
          (cd "$RUNNER_TEMP/lean4export" &&
            lake env leanchecker --from-export "$prefix") \
              > "$RUNNER_TEMP/first-mismatch-official.txt" 2>&1 || {
            cat "$RUNNER_TEMP/first-mismatch-official.txt"
            exit 1
          }
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/first-mismatch-official.txt"
          echo "C0_REAL_INIT_FIRST_FALSE_OFFICIAL verdict=accepted records=86383"
          sha256sum "$prefix" | tee "$RUNNER_TEMP/first-mismatch-prefix-sha256.txt"
      # This stage is diagnostic and MUST NOT alter C0's accepting verdict.
      # The updated replay helper separates the failed Eq application into
      # independently checked type, function and argument conversions.
      - name: Require C0 acceptance of the original real Init eta mismatch prefix
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/Init-first-mismatch.ndjson"
          test -s "$prefix"
          test "$(wc -l < "$prefix")" -eq 86383
          # Official Lean has already accepted these exact bytes and
          # the original export is pinned to Lean 4.35.0. C0 must
          # independently report POSITIVE acceptance, not a resource
          # limit, unsupported input, or a provisional diagnostic.
          (
            cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
            timeout 120s .lake/build/bin/c0OfficialReplay "$prefix" 4096
          ) | tee "$RUNNER_TEMP/c0-first-86383-result.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=86383 fuel=4096"             "$RUNNER_TEMP/c0-first-86383-result.txt"
          echo "C0_REAL_INIT_ETA_PREFIX parity=accepted records=86383"
      - name: Cross-check compiled and interpreted replay on official positive and negative inputs
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          for file in test/C0OfficialAccept.ndjson test/C0OfficialChainReject.ndjson; do
            old="$(lake env lean --run test/C0OfficialNdjsonReplay.lean "$file" | grep '^C0_REAL_EXPORT replay_outcome=')"
            new="$(.lake/build/bin/c0OfficialReplay "$file" | grep '^C0_REAL_EXPORT replay_outcome=')"
            test "$old" = "$new"
            echo "C0_NATIVE_SOURCE_PARITY exact_verdict=$new"
          done
      - name: Discover the next real Lean Init compatibility boundary
        shell: bash
        run: |
          set -euo pipefail
          head -n 150000 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-next-boundary.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-next-boundary.ndjson")" -eq 150000
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$RUNNER_TEMP/Init-next-boundary.ndjson") > "$RUNNER_TEMP/next-official.txt" 2>&1
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/next-official.txt"
          echo "C0_NEXT_INIT_OFFICIAL verdict=accepted records=150000"
          (
            cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
            timeout 360s .lake/build/bin/c0OfficialReplay "$RUNNER_TEMP/Init-next-boundary.ndjson" 4096
          ) | tee "$RUNNER_TEMP/next-c0.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=150000 fuel=4096" "$RUNNER_TEMP/next-c0.txt"
          echo "C0_REAL_INIT_PREFIX_VERIFIED accepted_records=150000"
      - name: Expand exact real Init acceptance to 4000000 source records
        shell: bash
        run: |
          set -euo pipefail
          head -n 4000000 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-next-4000000.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-next-4000000.ndjson")" -eq 4000000
          (cd "$RUNNER_TEMP/lean4export" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/Init-next-4000000.ndjson") > "$RUNNER_TEMP/next-4000000-official.txt" 2>&1
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/next-4000000-official.txt"
          echo "C0_NEXT_INIT_OFFICIAL verdict=accepted records=4000000"
          (
            cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
            /usr/bin/time -v -o "$RUNNER_TEMP/next-4000000-c0-resources.txt" \
               timeout 1800s .lake/build/bin/c0OfficialReplay "$RUNNER_TEMP/Init-next-4000000.ndjson" 4096
          ) | tee "$RUNNER_TEMP/next-4000000-c0.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=4000000 fuel=4096" "$RUNNER_TEMP/next-4000000-c0.txt"
          echo "C0_REAL_INIT_PREFIX_VERIFIED accepted_records=4000000"
          echo "C0_REAL_INIT_RESOURCE_PROFILE records=4000000"
          cat "$RUNNER_TEMP/next-4000000-c0-resources.txt"
      # Not an acceptance gate: the full-corpus diagnostic is expensive,
      # and repeating an inconclusive probe on every source change
      # delays validated-library and semantic progress. Its explicit
      # workflow_dispatch path remains available for deeper profiling.
      - name: Probe full official Init with bounded compiled C0 progress
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # This is a diagnostic probe, not a corpus acceptance gate.
          # Preserve streamed record/declaration counts if the entire
          # 6.45M-record corpus exceeds this host's budget.
          if (cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0" &&
                timeout 900s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay "$RUNNER_TEMP/Init-4.35.0.ndjson" 4096) > "$RUNNER_TEMP/c0-full-init-native.txt" 2>&1; then
            cat "$RUNNER_TEMP/c0-full-init-native.txt"
            grep -Fq "C0_REAL_EXPORT replay_outcome=" "$RUNNER_TEMP/c0-full-init-native.txt"
          else
            echo "C0_REAL_INIT_FULL_NATIVE verdict=inconclusive_host_or_timeout"
            tail -n 80 "$RUNNER_TEMP/c0-full-init-native.txt" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-real-init-435-survey
          path: |
            ${{ runner.temp }}/Init-4.35.0-survey.json
            ${{ runner.temp }}/Init-first-inductive.ndjson
            ${{ runner.temp }}/Init-first-nested.ndjson
            ${{ runner.temp }}/Init-first-mismatch.ndjson
