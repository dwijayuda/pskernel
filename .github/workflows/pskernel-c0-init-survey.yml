name: PSKernel-C0 real Lean 4.35 Init exporter survey
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-init-survey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  init-export-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce exporter source and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat psc0/packages/pskernel-c0/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
      - name: Export and independently verify real Init
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/lean4export" && lake env .lake/build/bin/lean4export Init > "$RUNNER_TEMP/Init-4.35.0.ndjson")
          test -s "$RUNNER_TEMP/Init-4.35.0.ndjson"
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$RUNNER_TEMP/Init-4.35.0.ndjson") > "$RUNNER_TEMP/leanchecker-result.txt" 2>&1 || {
            cat "$RUNNER_TEMP/leanchecker-result.txt"
            exit 1
          }
          cat "$RUNNER_TEMP/leanchecker-result.txt"
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/leanchecker-result.txt"
      - name: Preserve and inspect real first inductive export prefix
        shell: bash
        run: |
          set -euo pipefail
          head -n 153 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-inductive.ndjson"
          # This prefix includes the first three real exported inductive groups.
          # A verdict on the prefix is separate from the full Init check.
          (cd "$RUNNER_TEMP/lean4export" && lake env leanchecker --from-export "$RUNNER_TEMP/Init-first-inductive.ndjson") > "$RUNNER_TEMP/first-inductive-official.txt" 2>&1 || {
            cat "$RUNNER_TEMP/first-inductive-official.txt"
            echo "C0_REAL_INIT_PREFIX_OFFICIAL verdict=not_accepted"
            exit 0
          }
          cat "$RUNNER_TEMP/first-inductive-official.txt"
          echo "C0_REAL_INIT_PREFIX_BEGIN"
          cat "$RUNNER_TEMP/Init-first-inductive.ndjson"
          echo "C0_REAL_INIT_PREFIX_END"
      - name: Qualify corrected first 12244 real Init export records in C0
        shell: bash
        run: |
          set -euo pipefail
          head -n 12244 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-12244.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-first-12244.ndjson")" -eq 12244
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          (
            cd "$c0"
            lake build PsKernelC0
            lake env lean --run test/C0OfficialNdjsonReplay.lean "$RUNNER_TEMP/Init-first-12244.ndjson"
          ) | tee "$RUNNER_TEMP/c0-first-12244-result.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=12244" "$RUNNER_TEMP/c0-first-12244-result.txt"
      - name: Inspect the first real Init nested-inductive metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Init-4.35.0.ndjson" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = 79416
          names = {0: ""}
          levels = {0: "0"}
          expressions = {}
          def render_level(index):
              return levels.get(index, f"<missing-level-{index}>")
          def render_expr(index, depth=0):
              if depth > 24:
                  return f"<depth:{index}>"
              x = expressions.get(index)
              if x is None:
                  return f"<missing-expr-{index}>"
              if "sort" in x:
                  return f"Sort({render_level(x['sort'])})"
              if "bvar" in x:
                  return f"#{x['bvar']}"
              if "const" in x:
                  c = x["const"]
                  return names.get(c["name"], "?") + ("[" + ",".join(render_level(u) for u in c["us"]) + "]")
              if "app" in x:
                  c = x["app"]
                  return f"({render_expr(c['fn'], depth+1)} {render_expr(c['arg'],depth+1)})"
              for kind in ("forallE", "lam"):
                  if kind in x:
                      c = x[kind]
                      return f"({kind} {names.get(c['name'],'_')}:{render_expr(c['type'],depth+1)}. {render_expr(c['body'],depth+1)})"
              if "letE" in x:
                  c = x["letE"]
                  return f"(let {names.get(c['name'],'_')}:{render_expr(c['type'],depth+1)} := {render_expr(c['value'],depth+1)}; {render_expr(c['body'],depth+1)})"
              return f"expr[{index}]:{list(x)}"
          with source.open(encoding="utf-8") as file:
              for line_no, raw in enumerate(file, 1):
                  obj = json.loads(raw)
                  if "in" in obj:
                      part = obj.get("str") or obj.get("num")
                      parent = names.get(part["pre"], "?")
                      suffix = part.get("str", part.get("i"))
                      names[obj["in"]] = parent + ("." if parent else "") + str(suffix)
                  elif "il" in obj:
                      if "param" in obj:
                          levels[obj["il"]] = names.get(obj["param"], "?")
                      elif "succ" in obj:
                          levels[obj["il"]] = "succ(" + render_level(obj["succ"]) + ")"
                      elif "max" in obj:
                          levels[obj["il"]] = "max(" + ",".join(render_level(k) for k in obj["max"]) + ")"
                      elif "imax" in obj:
                          levels[obj["il"]] = "imax(" + ",".join(render_level(k) for k in obj["imax"]) + ")"
                  elif "ie" in obj:
                      expressions[obj["ie"]] = obj
                  if line_no == target:
                      print(f"C0_REAL_INIT_DIVERGENCE record={line_no} tag={list(obj)}")
                      if "inductive" in obj:
                          group = obj["inductive"]
                          for typ in group["types"]:
                              print(f"  TYPE {names.get(typ['name'])} universe={list(map(render_level,typ['levelParams']))} numParams={typ['numParams']} numIndices={typ['numIndices']} type={render_expr(typ['type'])}")
                          for ctor in group["ctors"]:
                              print(f"  CTOR {names.get(ctor['name'])} fields={ctor['numFields']} type={render_expr(ctor['type'])}")
                      else:
                          print(json.dumps(obj)[:8000])
                      break
          if line_no != target:
              raise RuntimeError("did not reach C0 first divergence record")
          PY
      - name: Identify constructor WHNF substage for nested Lean.Syntax
        shell: bash
        run: |
          set -euo pipefail
          head -n 79416 "$RUNNER_TEMP/Init-4.35.0.ndjson" > "$RUNNER_TEMP/Init-first-nested.ndjson"
          test "$(wc -l < "$RUNNER_TEMP/Init-first-nested.ndjson")" -eq 79416
          (
            cd "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
            timeout 180s lake env lean --run test/C0OfficialNdjsonReplay.lean "$RUNNER_TEMP/Init-first-nested.ndjson" 4096
          ) | tee "$RUNNER_TEMP/c0-first-nested-result.txt"
          grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=79416" "$RUNNER_TEMP/c0-first-nested-result.txt"
      - name: Publish declaration and expression coverage inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Init-4.35.0.ndjson" "$RUNNER_TEMP/Init-4.35.0-survey.json" <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path
          import sys
          source, output = (Path(p) for p in sys.argv[1:])
          declaration_tags = {"axiom", "def", "thm", "opaque", "quot", "inductive"}
          supported = {"axiom", "def", "thm", "opaque"}
          expression_tags = {"bvar", "sort", "const", "app", "lam", "forallE",
                             "letE", "proj", "natVal", "strVal", "mdata", "fvar", "mvar"}
          expr_counts, decl_counts = Counter(), Counter()
          unknown_counts, examples = Counter(), []
          inductive_shapes, special_inductives = Counter(), []
          header = None
          hasher = hashlib.sha256()
          lines = 0
          with source.open("rb") as f:
              for raw in f:
                  hasher.update(raw)
                  lines += 1
                  item = json.loads(raw)
                  keys = set(item)
                  if "meta" in keys:
                      header = item["meta"]
                  elif "ie" in keys:
                      expr_counts.update(keys & expression_tags)
                  elif not (keys & {"in", "il"}):
                      kinds = keys & declaration_tags
                      if len(kinds) == 1:
                          kind = next(iter(kinds))
                          decl_counts[kind] += 1
                          if kind == "inductive":
                              block = item["inductive"]
                              families = block["types"]
                              group_size = len(families)
                              inductive_shapes["ordinary" if group_size == 1 else "mutual"] += 1
                              if any(t.get("numNested", 0) != 0 for t in families):
                                  inductive_shapes["nested"] += 1
                              if any(t.get("isUnsafe", False) for t in families):
                                  inductive_shapes["unsafe"] += 1
                              if any(t.get("isRec", False) for t in families):
                                  inductive_shapes["recursive"] += 1
                              if group_size != 1 or any(t.get("numNested", 0) for t in families):
                                  if len(special_inductives) < 16:
                                      special_inductives.append({
                                          "line": lines,
                                          "type_count": group_size,
                                          "nested": any(t.get("numNested", 0) for t in families),
                                      })
                          if kind not in supported and len(examples) < 12:
                              examples.append({"line": lines, "tag": kind})
                      else:
                          unknown_counts.update(keys)
                          if len(examples) < 12:
                              examples.append({"line": lines, "tags": sorted(keys)})
          if not header or header.get("lean", {}).get("version") != "4.35.0" or (
              header.get("lean", {}).get("githash") !=
              "eb6cafb7290e8bd5f2937522d8d804f58f02bafc"
          ):
              raise ValueError("unmatched Lean 4.35.0 exporter metadata")
          report = {
              "corpus": "real Lean Init + transitive dependencies",
              "toolchain": "leanprover/lean4:v4.35.0",
              "lean4export_commit": "5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe",
              "sha256": hasher.hexdigest(),
              "byte_size": source.stat().st_size,
              "ndjson_record_count": lines,
              "declaration_counts": dict(sorted(decl_counts.items())),
              "expression_counts": dict(sorted(expr_counts.items())),
              "unknown_record_counts": dict(sorted(unknown_counts.items())),
              "inductive_shapes": dict(sorted(inductive_shapes.items())),
              "first_complex_inductive_groups": special_inductives,
              "first_unsupported_records": examples,
              "scope": "coverage survey only; not a C0 kernel acceptance claim",
          }
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: C0 native streaming boundary diagnostic after max-offset normalization
        shell: bash
        run: |
          set -euo pipefail
          # This is not an acceptance gate: the current adapter deliberately
          # declines unsupported declarations; it now includes a first-failure
          # record offset and typed rejection reason. A timeout/host failure must
          # not be represented as a kernel rejection.
          if timeout 240s bash -c 'cd "$1" && lake build PsKernelC0 && lake env lean --run test/C0OfficialNdjsonReplay.lean "$2"' _ \
              "$GITHUB_WORKSPACE/psc0/packages/pskernel-c0" \
              "$RUNNER_TEMP/Init-4.35.0.ndjson" \
              > "$RUNNER_TEMP/c0-real-init-435-result.txt" 2>&1; then
            cat "$RUNNER_TEMP/c0-real-init-435-result.txt"
            grep -Fq "C0_REAL_EXPORT replay_outcome=" "$RUNNER_TEMP/c0-real-init-435-result.txt"
          else
            echo "C0_REAL_EXPORT diagnostic_process_failed_or_timed_out" | tee -a "$RUNNER_TEMP/c0-real-init-435-result.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-real-init-435-survey
          path: |
            ${{ runner.temp }}/Init-4.35.0-survey.json
            ${{ runner.temp }}/Init-first-inductive.ndjson
            ${{ runner.temp }}/first-inductive-official.txt
            ${{ runner.temp }}/leanchecker-result.txt
            ${{ runner.temp }}/c0-real-init-435-result.txt
            ${{ runner.temp }}/c0-first-12244-result.txt
            ${{ runner.temp }}/c0-first-nested-result.txt
          if-no-files-found: warn
          retention-days: 14
