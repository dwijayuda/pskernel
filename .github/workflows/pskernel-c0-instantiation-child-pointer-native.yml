name: C0 proof-carrying instantiation native child-pointer hint qualification
on:
  push:
    branches: [research/pskernel-c0-instantiation-child-pointer-hint-20261019]
    paths:
      - '.github/workflows/pskernel-c0-instantiation-child-pointer-native.yml'
      - 'psc0/packages/pskernel-c0/test/C0ClosedSubstitutionRegression.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Architecture/CertifiedInstantiateMemo.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/packages/pskernel-c0/
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Prove source subtree-no-substitution equivalence and checker refusals
        shell: bash
        working-directory: psc0/packages/pskernel-c0
        run: |
          set -euo pipefail
          test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          lake build c0OfficialReplay
          lake env lean --run test/C0ClosedSubstitutionRegression.lean
          lake env lean --run test/C0CertifiedInstantiateMemoRegression.lean
          lake env lean --run test/C0AdaptiveInstantiationRegression.lean
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0LooseBVarBoundRegression.lean
          echo "C0_INST_CHILD_PTR_NATIVE=BUILD_AND_SOURCE_REGRESSIONS_PASS_NO_TRUST_PROMOTION"
