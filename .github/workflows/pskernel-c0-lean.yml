name: PSKernel-C0 native Lean architecture
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - 'psc0/packages/pskernel-c0/src/**'
      - 'psc0/packages/pskernel-c0/lakefile.lean'
      - 'psc0/packages/pskernel-c0/lean-toolchain'
      - '.github/workflows/pskernel-c0-lean.yml'
      - 'psc0/packages/pskernel-c0/test/C0ProofIrrelevanceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0PerfMicrobench.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Compile C0 Lean semantic closure (no self-host tests)
        working-directory: psc0/packages/pskernel-c0
        run: lake build PsKernelC0
      - name: Negative kernel conformance (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ProofIrrelevanceRegression.lean
      - name: Native Lean C0 performance microbenchmarks (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0PerfMicrobench.lean
