name: PSKernel-C0 native Lean architecture
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - 'psc0/packages/pskernel-c0/src/**'
      - 'psc0/packages/pskernel-c0/lakefile.lean'
      - 'psc0/packages/pskernel-c0/lean-toolchain'
      - '.github/workflows/pskernel-c0-lean.yml'
      - 'psc0/packages/pskernel-c0/test/C0ProofIrrelevanceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0Lean435MigrationRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0IndexedStoreValidationRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0IndexedScratchRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0CertifiedWorkRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0TrustedAdmissionRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0SealedStateRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0SealedAuditedStateRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0VerifiedSessionRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0VerifiedProviderRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0VerifiedProviderPublicationRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ReflexiveDefEqRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0SortDefEqRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0LiteralDefEqRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedLocalInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedConstantInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedInferenceDispatchRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ColdConstantInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedMetadataInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0BinderSourceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedBinderInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedBinderInferOnlyRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ApplicationSourceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedApplicationInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedLetInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedProjectionInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0RecursiveCheckedInferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0RecursiveQualifiedLetRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0RecursiveQualifiedProjectionRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedContextualWhnfRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedZetaWhnfRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedBetaWhnfRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedRecursiveWhnfRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedRecursiveDeltaWhnfRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0QualifiedRecursiveMetadataDefEqRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0UniverseParameterRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0AuditedAssumptionsRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0AuditedHistoryPerfMicrobench.lean'
      - 'psc0/packages/pskernel-c0/test/C0CertifiedWorkPerfMicrobench.lean'
      - 'psc0/packages/pskernel-c0/test/C0OfficialReferenceRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0OfficialNdjsonReplay.lean'
      - 'psc0/packages/pskernel-c0/test/C0Official*.ndjson'
      - 'psc0/packages/pskernel-c0/test/C0ArchitectureExecutionRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ArchitectureWorkRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0TypedEliminationRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ArchitectureDeltaRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0ArchitectureBudgetRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0PerfMicrobench.lean'
      - 'psc0/packages/pskernel-c0/test/C0CheckerComparison.lean'
      - 'psc0/packages/pskernel-c0/test/C0Ablation.py'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  native-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Store push CI evidence against the exact executable SHA.
      - name: Publish pending C0 native qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="pskernel-c0/native-lean" \
            -f description="Native Lean 4.35 build and full gates running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Compile C0 Lean semantic closure (no self-host tests)
        working-directory: psc0/packages/pskernel-c0
        run: lake build PsKernelC0
      - name: Official Lean 4.35 export replay versus C0 checked declaration fixtures
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          command -v leanchecker >/dev/null || { echo "Lean 4.35 leanchecker is required"; exit 1; }
          for fixture in test/C0Official*Accept.ndjson; do
            echo "C0_OFFICIAL_REFERENCE expected_accept=$fixture"
            if ! output="$(leanchecker --from-export "$fixture" 2>&1)"; then
              printf '%s\n' "$output"
              echo "Official Lean 4.35 rejected valid exported declaration"
              exit 1
            fi
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fq "Lean default kernel accepts the solution" || {
              echo "Official export was not positively checked"
              exit 1
            }
          done
          for fixture in test/C0Official*Reject.ndjson; do
            echo "C0_OFFICIAL_REFERENCE expected_reject=$fixture"
            if output="$(leanchecker --from-export "$fixture" 2>&1)"; then
              printf '%s\n' "$output"
              echo "Official Lean 4.35 falsely accepted invalid declaration"
              exit 1
            fi
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fq "Lean default kernel rejects the solution" || {
              echo "Official check did not produce a kernel rejection"
              exit 1
            }
          done
          lake env lean --run test/C0OfficialReferenceRegression.lean
          lake env lean --run test/C0OfficialNdjsonReplay.lean
      - name: C0 architecture-first lazy execution versus source WHNF (non-accepting)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ArchitectureExecutionRegression.lean
      - name: C0 architecture-first validated scratch transaction and source authority
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ArchitectureWorkRegression.lean
      - name: C0 proof-carrying canonical store and checked work
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0CertifiedWorkRegression.lean
      - name: C0 source ordinary-axiom audit and approved history
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0AuditedAssumptionsRegression.lean
      - name: Matched incremental trust-audit versus full-history replay microbenchmark
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0AuditedHistoryPerfMicrobench.lean
      - name: C0 source admission history from checked empty genesis
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0TrustedAdmissionRegression.lean
      - name: C0 exact checked state lineage and fail-closed session transitions
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0SealedStateRegression.lean
      - name: C0 exact audited checker-state lineage and signed assumption policy
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0SealedAuditedStateRegression.lean
      - name: C0 public verified-session admission, state lineage and atomic publication
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0VerifiedSessionRegression.lean
      - name: C0 provider-compatible verified admission and resource policy
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0VerifiedProviderRegression.lean
      - name: C0 provider public atomic checked-root publication and foundation policy
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0VerifiedProviderPublicationRegression.lean
      - name: C0 independently source-proved reflexive DefEq and provider typing
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ReflexiveDefEqRegression.lean
      - name: C0 independently proved complete Sort universe DefEq and cache semantics
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0SortDefEqRegression.lean
      - name: C0 independently proved Nat String literal DefEq and cache semantics
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0LiteralDefEqRegression.lean
      - name: C0 independent scalar source inference and full checked typing
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedInferenceRegression.lean
      - name: C0 source-exact local variable infer and full checked typing
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedLocalInferenceRegression.lean
      - name: C0 source-proved constant checked inference cache and provider isolation
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedConstantInferenceRegression.lean
      - name: C0 one source-proved head inference dispatcher and exact fallback
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedInferenceDispatchRegression.lean
      - name: C0 independent full cold constant inference and strict Lean 4.35 source policy
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ColdConstantInferenceRegression.lean
      - name: C0 source-proved recursive metadata full checking and atomic publication
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedMetadataInferenceRegression.lean
      - name: C0 source-proved recursive metadata DefEq and terminal cases
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedRecursiveMetadataDefEqRegression.lean
      - name: C0 source-proved recursive beta zeta delta WHNF
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedRecursiveDeltaWhnfRegression.lean
      - name: C0 full source-proved recursive beta zeta WHNF
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedRecursiveWhnfRegression.lean
      - name: C0 exact independently reduced one-step beta Sort WHNF
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedBetaWhnfRegression.lean
      - name: C0 exact independently reduced one-step zeta Sort WHNF
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedZetaWhnfRegression.lean
      - name: C0 source-proved contextual WHNF of lambda and rigid locals
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedContextualWhnfRegression.lean
      - name: C0 independently refined checked projection major types
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0RecursiveQualifiedProjectionRegression.lean
      - name: C0 source-proved independently refined checked let children
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0RecursiveQualifiedLetRegression.lean
      - name: C0 source-exact dependent Pi and lambda binder rules
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0BinderSourceRegression.lean
      - name: C0 independently source-proved checked Pi and lambda binder heads
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedBinderInferenceRegression.lean
      - name: C0 independently source-proved Pi and lambda infer-only caches
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedBinderInferOnlyRegression.lean
      - name: C0 full checked and infer-only source application and long spine rules
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ApplicationSourceRegression.lean
      - name: C0 independently source-proved checked and inferred application head states
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedApplicationInferenceRegression.lean
      - name: C0 independently source-equivalent dependent let inference and full checking
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedLetInferenceRegression.lean
      - name: C0 source-proved projections over real checked inductive structures
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0QualifiedProjectionInferenceRegression.lean

      - name: C0 recursive checked inference across applications metadata and dependent binders
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0RecursiveCheckedInferenceRegression.lean
      - name: C0 Lean 4.35 full checking enforces declared universe parameters
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0UniverseParameterRegression.lean
      - name: C0 typed K/eta on source-admitted inductive declarations
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0TypedEliminationRegression.lean
      - name: C0 architecture-first delta closure comparison (non-accepting)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ArchitectureDeltaRegression.lean
      - name: C0 architecture-first bounded readback quota and source authority
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ArchitectureBudgetRegression.lean
      - name: Matched validated-work versus replay-per-query source microbenchmark
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0CertifiedWorkPerfMicrobench.lean
      - name: Negative kernel conformance (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0ProofIrrelevanceRegression.lean
      - name: Lean 4.35 semantics and obsolete-native rejection (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0Lean435MigrationRegression.lean
      - name: Indexed store replay and malformed metadata qualification (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0IndexedStoreValidationRegression.lean
      - name: Experimental indexed scratch lifecycle and promotion
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0IndexedScratchRegression.lean
      - name: Native Lean C0 performance microbenchmarks (no self-host)
        working-directory: psc0/packages/pskernel-c0
        run: lake env lean --run test/C0PerfMicrobench.lean

      - name: Matched original vs C0 native checker (no self-host)
        shell: bash
        run: |
          set -euo pipefail
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          core="$GITHUB_WORKSPACE/psc0/packages/pskernel-core"
          echo "C0 benchmark (identical inputs)"
          (cd "$c0" && lake env lean --run test/C0CheckerComparison.lean)
          # Build the unchanged 79-module original tree in an isolated
          # temporary Lake package with the *same* pinned Lean toolchain.
          # No original source, package metadata, compiler or backend is edited.
          baseline="$(mktemp -d)"
          trap 'rm -rf "$baseline"' EXIT
          cp -R "$core/src" "$baseline/src"
          cp "$c0/lean-toolchain" "$baseline/lean-toolchain"
          # The unchanged original owns a different import graph from C0.
          # Generate the original Lake module roots from its actual source
          # files, not from the redesigned C0 Lake list. This keeps the
          # comparison independent as C0 removes obsolete modules.
          python3 - "$baseline" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          modules = sorted((root / "src" / "Ps" / "KernelCore").rglob("*.lean"))
          if not modules:
              raise RuntimeError("original checker copy has no Lean modules")
          roots = [
              "    `" + ".".join(p.relative_to(root / "src").with_suffix("").parts) + ","
              for p in modules
          ]
          text = ("import Lake\nopen Lake DSL\n\npackage pskernelOriginal\n"
                  "lean_lib PsKernelC0 where\n  srcDir := \"src\"\n"
                  "  roots := #[\n" + "\n".join(roots) + "\n  ]\n")
          (root / "lakefile.lean").write_text(text)
          print(f"C0_ORIGINAL_BUILD discovered_modules={len(modules)}")
          PY
          echo "Original PSKernel-Core benchmark (identical inputs)"
          (cd "$baseline" && lake build PsKernelC0 && lake env lean --run "$c0/test/C0CheckerComparison.lean")

      # This expensive three-way performance diagnostic is opt-in per tagged
      # commit. It never modifies or builds the original source in place.
      - name: Ablate cached local declaration count (private C0 only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[c0-local-count-ablation]')
        shell: bash
        run: |
          set -euo pipefail
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -R "$c0/src" "$scratch/src"
          cp "$c0/lakefile.lean" "$scratch/lakefile.lean"
          cp "$c0/lean-toolchain" "$scratch/lean-toolchain"
          path="$scratch/src/Ps/KernelCore/Core/LocalContext.lean"
          grep -Fq 'if context.declCount >= psKernelC0LocalIndexThreshold then' "$path"
          sed -i 's/if context.declCount >= psKernelC0LocalIndexThreshold then/if context.decls.length >= psKernelC0LocalIndexThreshold then/' "$path"
          grep -Fq 'if context.decls.length >= psKernelC0LocalIndexThreshold then' "$path"
          echo "C0_ABLATION label=historical_local_length_scan operation=full_checker"
          (cd "$scratch" && lake build PsKernelC0 &&
            lake env lean --run "$c0/test/C0CheckerComparison.lean")

      - name: Isolate original instantiation inside private C0 copy (no self-host)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          original="$GITHUB_WORKSPACE/psc0/packages/pskernel-core"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -R "$c0/src" "$scratch/src"
          cp "$c0/lakefile.lean" "$scratch/lakefile.lean"
          cp "$c0/lean-toolchain" "$scratch/lean-toolchain"
          python3 "$c0/test/C0Ablation.py" "$original" "$scratch"
          echo "C0_ABLATION label=original_instantiate1 operation=full_checker"
          (cd "$scratch" && lake build PsKernelC0 &&
            lake env lean --run "$c0/test/C0CheckerComparison.lean")

      - name: Diagnose C0 declaration index with unchanged original module (no self-host)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          core="$GITHUB_WORKSPACE/psc0/packages/pskernel-core"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          cp -R "$c0/src" "$temporary/src"
          cp "$c0/lakefile.lean" "$temporary/lakefile.lean"
          cp "$c0/lean-toolchain" "$temporary/lean-toolchain"
          python3 "$c0/test/C0Ablation.py" "$core" "$temporary" environment_index
          echo "C0_ABLATION label=original_environment_index operation=full_checker"
          (cd "$temporary" && lake build PsKernelC0 &&
            lake env lean --run "$c0/test/C0CheckerComparison.lean")

      - name: Diagnose local-index construction inside private C0 copy (no self-host)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          c0="$GITHUB_WORKSPACE/psc0/packages/pskernel-c0"
          original="$GITHUB_WORKSPACE/psc0/packages/pskernel-core"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          cp -R "$c0/src" "$temporary/src"
          cp "$c0/lakefile.lean" "$temporary/lakefile.lean"
          cp "$c0/lean-toolchain" "$temporary/lean-toolchain"
          python3 "$c0/test/C0Ablation.py" "$original" "$temporary" local_index_disabled
          echo "C0_ABLATION label=local_index_disabled operation=full_checker"
          (cd "$temporary" && lake build PsKernelC0 &&
            lake env lean --run "$c0/test/C0CheckerComparison.lean")

      # Publish only this exact run's job outcome, including failed gates.
      - name: Report qualified native C0 outcome
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$NATIVE_JOB_RESULT" = "success" ]; then
            status=success
            description="Lean 4.35 and all mandatory native C0 checks passed"
          elif [ "$NATIVE_JOB_RESULT" = "cancelled" ]; then
            status=error
            description="Native C0 qualification cancelled"
          else
            status=failure
            description="Native C0 build or mandatory qualification failed"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$status" -f context="pskernel-c0/native-lean" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
