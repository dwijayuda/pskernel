name: PSKernel-C0 certified loose-BVar csimp authentic Arena A/B
on:
  push:
    branches: [research/pskernel-c0-loose-bvar-native-csimp-20261019]
    paths:
      - '.github/workflows/pskernel-c0-loose-bound-csimp-ab.yml'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Level.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Expr.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Admission/Declaration/Validation.lean'
      - 'psc0/packages/pskernel-c0/test/C0LevelParamFlagRegression.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Architecture/CertifiedInstantiateMemo.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Architecture/CertifiedLooseBVarBound.lean'
      - 'psc0/packages/pskernel-c0/test/C0AdaptiveInstantiationRegression.lean'
  pull_request:
    branches: [perf/pskernel-c0-pointer-structural-hash-bucket-20261018]
    paths:
      - '.github/workflows/pskernel-c0-loose-bound-csimp-ab.yml'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Expr.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Level.lean'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Admission/Declaration/Validation.lean'
      - 'psc0/packages/pskernel-c0/test/C0ComputedMVarFlagRegression.lean'
      - 'psc0/packages/pskernel-c0/test/C0LevelParamFlagRegression.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-real-app-lam:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Verify candidate Lean 4.35 source proof and native behavior
        shell: bash
        run: |
          set -euo pipefail
          cd psc0/packages/pskernel-c0
          test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          lake build c0OfficialReplay
          lake env lean --run test/C0ComputedMVarFlagRegression.lean
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0LevelParamFlagRegression.lean
          lake env lean --run test/C0CertifiedInstantiateMemoRegression.lean
          lake env lean --run test/C0AdaptiveInstantiationRegression.lean
          lake env lean --run test/C0LooseBVarBoundRegression.lean
          echo 'C0_LOOSE_BOUND_NATIVE_SOURCE=LEAN_PROVED'
      - name: Authenticate original official-positive Arena body
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/arena-2026-09.tar.gz" \
            https://github.com/leanprover/lean-kernel-arena/releases/download/round-2026-09/lean-arena-round-2026-09-tests.tar.gz
          echo '98a69742b538296c5f413d0527dfeef8c4d1815fe64b12c8623cd33de63bee0d  '"$RUNNER_TEMP"'/arena-2026-09.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, 'psc0/packages/pskernel-c0/test')
          from arena_conformance import check_archive
          from arena_lean435_compat import adapt_legacy_envelope, official_reference
          tests = check_archive(Path(os.environ['RUNNER_TEMP']) / 'arena-2026-09.tar.gz')
          selected = [(t, raw) for t, n, raw in tests if n == 'perf/app-lam.ndjson']
          assert len(selected) == 1 and selected[0][0] == 'good'
          compatible, identity = adapt_legacy_envelope(selected[0][1])
          assert identity['body_bytes_identical']
          assert identity['original_sha256'] == '3f7b7a595dc29b0e289c9031c4edaef42d0e12b8aee3cbb48cf15cb715adc09a'
          path = Path(os.environ['RUNNER_TEMP']) / 'arena435-app-lam.ndjson'
          path.write_bytes(compatible)
          verdict = official_reference(Path('psc0/packages/pskernel-c0'), path.resolve(), 120)
          assert verdict['verdict'] == 'accepted', verdict
          print('C0_APP_LAM_BODY=SHA_VERIFIED_ONLY_VERSION_HEADER_ADAPTED official_lean435=accepted')
          PY
      - name: Build and measure unmodified combined 3-flag control
        shell: bash
        run: |
          set -euo pipefail
          cd psc0/packages/pskernel-c0
          files=(Architecture/CertifiedInstantiateMemo.lean)
          for f in "${files[@]}"; do
            cp "src/Ps/KernelCore/$f" "$RUNNER_TEMP/candidate-$(basename "$f").saved"
          done
          cd ../../../
          git fetch --quiet --no-tags --depth=1 origin 86318438caac3b6a223542e6d6be31908a199108
          for f in "${files[@]}"; do
            path="psc0/packages/pskernel-c0/src/Ps/KernelCore/$f"
            git show FETCH_HEAD:"$path" > "$path"
          done
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          set +e
          (cd psc0/packages/pskernel-c0 &&
            /usr/bin/time -v -o "$RUNNER_TEMP/c0-base-resources.txt" \
              timeout 90s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
              --require-accepted "$RUNNER_TEMP/arena435-app-lam.ndjson" 4096) \
              > "$RUNNER_TEMP/c0-base-verdict.txt" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/c0-base-rc.txt"
          echo "C0_APP_LAM_BASELINE_UNCHANGED_LOOSE_BOUND=rc:$rc"
          grep -F 'C0_REAL_EXPORT replay_outcome=' "$RUNNER_TEMP/c0-base-verdict.txt" | tail -n 1 || true
      - name: Rebuild exact candidate and require accepted verdict and memory cap
        shell: bash
        run: |
          set -euo pipefail
          cd psc0/packages/pskernel-c0
          cp "$RUNNER_TEMP/candidate-CertifiedInstantiateMemo.lean.saved" src/Ps/KernelCore/Architecture/CertifiedInstantiateMemo.lean
          lake build c0OfficialReplay
          lake env lean --run test/C0ComputedMVarFlagRegression.lean
          lake env lean --run test/C0LevelParamFlagRegression.lean
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/c0-candidate-resources.txt" \
            timeout 90s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
            --require-accepted "$RUNNER_TEMP/arena435-app-lam.ndjson" 4096 \
            > "$RUNNER_TEMP/c0-candidate-verdict.txt" 2>&1
          rc=$?
          set -e
          echo "C0_APP_LAM_LOOSE_BOUND_CSIMP=rc:$rc"
          grep -F 'C0_REAL_EXPORT replay_outcome=' "$RUNNER_TEMP/c0-candidate-verdict.txt" | tail -n 1 || true
          if [ "$rc" -ne 0 ]; then
            echo "C0_APP_LAM_CANDIDATE=NOT_QUALIFIED exit=$rc; no bypass/fuel change" >&2
            exit 1
          fi
          grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted' "$RUNNER_TEMP/c0-candidate-verdict.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          def rss(name):
              s = (temp / name).read_text()
              m = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', s)
              assert m, name
              return int(m.group(1))
          base = rss('c0-base-resources.txt')
          cand = rss('c0-candidate-resources.txt')
          print(f'C0_APP_LAM_RSS_KIB baseline={base} candidate={cand}')
          assert cand <= 2 * base, 'candidate RSS grew beyond 2x baseline'
          print('C0_APP_LAM_LOOSE_BOUND_CSIMP=QUALIFIED_ON_ONE_REAL_PROOF_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c0-arena193-loose-bound-csimp-real-proof-ab
          path: |
            ${{ runner.temp }}/c0-*-resources.txt
            ${{ runner.temp }}/c0-*-verdict.txt
            ${{ runner.temp }}/c0-base-rc.txt
          if-no-files-found: warn
          retention-days: 21
