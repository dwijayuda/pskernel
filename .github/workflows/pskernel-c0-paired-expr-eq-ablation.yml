name: PSKernel-C0 paired recursive expression equality ablation
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-paired-expr-eq-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-eq-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Build exact Lean 4.35 exported WF closure with official acceptance
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" &&
            lake build lean4export &&
            lake env .lake/build/bin/lean4export Init -- 'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix' > "$RUNNER_TEMP/paired-wf.ndjson" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/paired-wf.ndjson" > "$RUNNER_TEMP/paired-wf-official.txt" 2>&1)
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/paired-wf-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/paired-wf.ndjson")" -eq 15758
          test "$(stat -c%s "$RUNNER_TEMP/paired-wf.ndjson")" -eq 777157
          echo "1d97cdd876069322a27ab69b2a1607e615695c8c0be065bbbb0db476833b5abe  $RUNNER_TEMP/paired-wf.ndjson" | sha256sum -c -
          echo "C0_PAIRED_EQ_SOURCE exact_pinned_official=accepted"
      - name: Mechanically change only recursive calls of the paired Eq comparator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Core/Expr.lean")
          source=path.read_text()
          start=source.index("def psKernelExprEq\n")
          end=source.index("\ndef psKernelExprEqualLegacy\n",start)
          region=source[start:end]
          assert region.count("psKernelExprEqLegacy") == 11
          updated=region.replace("psKernelExprEqLegacy", "psKernelExprEq")
          assert updated.count("psKernelExprEqLegacy")==0
          path.write_text(source[:start]+updated+source[end:])
          print("C0_PAIRED_EQ_ABLATION descendant_calls=11 paired_recursive_only=true")
          PY
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          echo "C0_PAIRED_EQ_COMPILE=disposable_experimental_build"
      - name: Preserve native negative and positive conformance on ablation
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run test/C0ProofCongruenceRegression.lean
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          echo "C0_PAIRED_EQ_NATIVE_FIXTURE=pass"
      - name: Test real former timeout at original fuel with bounded resources
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/paired-wf-resources.txt" \
              timeout 180s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted "$RUNNER_TEMP/paired-wf.ndjson" 4096
          ) > "$RUNNER_TEMP/paired-wf-c0.txt" 2>&1
          exit_code=$?
          set -e
          echo "C0_PAIRED_EQ_ABLATION_EXIT=$exit_code"
          grep 'C0_REAL_EXPORT replay_outcome' "$RUNNER_TEMP/paired-wf-c0.txt" | tail -n 2 || true
          grep 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/paired-wf-c0.txt" | tail -n 3 || true
          if test "$exit_code" -eq 0 &&
              grep -Fq "C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096" "$RUNNER_TEMP/paired-wf-c0.txt"; then
            echo "C0_PAIRED_EQ_ABLATION_RESULT=accepted_source_parity_candidate_only"
          else
            echo "C0_PAIRED_EQ_ABLATION_RESULT=not_qualified_timeout_or_error"
          fi
          cat "$RUNNER_TEMP/paired-wf-resources.txt"
          echo "C0_PAIRED_EQ_ABLATION_SCOPE=untrusted_disposable_experiment_no_kernel_qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-paired-eq-ablation
          path: |
            ${{ runner.temp }}/paired-wf-official.txt
            ${{ runner.temp }}/paired-wf-c0.txt
            ${{ runner.temp }}/paired-wf-resources.txt
          if-no-files-found: warn
          retention-days: 14
