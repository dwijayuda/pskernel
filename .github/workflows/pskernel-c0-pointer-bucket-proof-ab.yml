name: PSKernel-C0 pointer-only hash memo index checked A/B
on:
  pull_request:
    branches: [perf/pskernel-c0-infer-dag-eligibility-20261018]
    paths:
      - '.github/workflows/pskernel-c0-pointer-bucket-proof-ab.yml'
      - 'psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean'
      - 'psc0/packages/pskernel-c0/test/C0NativeHashBucketHintRegression.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hash-shared-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        depth: [24, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Generate genuine upstream scaled shared-graph declaration under pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          pkg=psc0/packages/pskernel-c0
          test "$(cd "$pkg" && lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc
          git clone -q https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout -q 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = leanprover/lean4:v4.35.0
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/SharedOriginal.lean" \
            https://raw.githubusercontent.com/leanprover/lean-kernel-arena/5d7ca987618f1136aaa296057b50a2c10c4ce77a/tests/perf/shared-subterm.lean
          TEST_DEPTH=${{ matrix.depth }} python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          d=Path(os.environ["RUNNER_TEMP"])
          raw=(d/"SharedOriginal.lean").read_bytes()
          assert raw.count(b"let n := 1000")==1
          depth=int(os.environ["TEST_DEPTH"])
          assert depth in (24,32)
          updated=raw.replace(b"let n := 1000",f"let n := {depth}".encode())
          (d/"ScaledSharedSubterm.lean").write_bytes(updated)
          print(f"C0_SEMANTIC_DAG_AB_SOURCE depth={depth} original_sha256="+hashlib.sha256(raw).hexdigest()+" changed_sha256="+hashlib.sha256(updated).hexdigest()+" only_depth_literal=true")
          PY
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            cp "$RUNNER_TEMP/ScaledSharedSubterm.lean" ScaledSharedSubterm.lean
            lake env lean -o .lake/build/lib/lean/ScaledSharedSubterm.olean ScaledSharedSubterm.lean
            lake env .lake/build/bin/lean4export ScaledSharedSubterm -- kernel_shared_subterm > "$RUNNER_TEMP/c0-dag-n32.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/c0-dag-n32.ndjson" > "$RUNNER_TEMP/official.txt" 2>&1
          )
          grep -Fq 'Lean default kernel accepts the solution' "$RUNNER_TEMP/official.txt"
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"c0-dag-n32.ndjson"
          raw=p.read_bytes()
          lines=raw.splitlines()
          header=json.loads(lines[0])["meta"]
          assert header["lean"]=={"version":"4.35.0","githash":"eb6cafb7290e8bd5f2937522d8d804f58f02bafc"}
          assert len(lines)>200 and "thm" in json.loads(lines[-1])
          print(f"C0_SEMANTIC_DAG_AB_EXPORT official=accepted genuine_Lean_435=true records={len(lines)} sha256={hashlib.sha256(raw).hexdigest()}")
          PY
      - name: Baseline official full C0 checker pinned PR138 cache
        shell: bash
        run: |
          set -euo pipefail
          path=psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean
          git fetch -q --no-tags --depth=1 origin 2974bd9f0e37468e9f7c1c12ba8da9ee800af009
          test "$(git rev-parse FETCH_HEAD)" = 2974bd9f0e37468e9f7c1c12ba8da9ee800af009
          git show "FETCH_HEAD:$path" > "$path"
          (cd psc0/packages/pskernel-c0 && lake build c0OfficialReplay)
          set +e
          (cd psc0/packages/pskernel-c0 &&
            /usr/bin/time -v -o "$RUNNER_TEMP/original-resource.txt" \
              timeout 90s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-dag-n32.ndjson" 4096
          ) > "$RUNNER_TEMP/original-verdict.txt" 2>&1
          rc=$?
          set -e
          if [[ "$rc" == 0 ]]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted' "$RUNNER_TEMP/original-verdict.txt"
            verdict=accepted
          elif [[ "$rc" == 124 ]]; then
            verdict=unqualified_timeout
          else
            tail -n 40 "$RUNNER_TEMP/original-verdict.txt"
            exit 1
          fi
          echo "C0_POINTER_INDEX_DAG depth=${{ matrix.depth }} variant=PR138 verdict=$verdict exit=$rc"
          grep 'Elapsed (wall clock)' "$RUNNER_TEMP/original-resource.txt" || true
      - name: Candidate proof-carrying hash source under native pointer hint
        shell: bash
        run: |
          set -euo pipefail
          path=psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean
          git show "HEAD:$path" > "$path"
          (cd psc0/packages/pskernel-c0 &&
            lake build c0OfficialReplay &&
            lake env lean --run test/C0NativeHashBucketHintRegression.lean &&
            lake env lean --run test/C0CertifiedHashMemoRegression.lean &&
            lake env lean --run test/C0DeepPtrExprEqRegression.lean &&
            lake env lean --run test/C0InferenceCacheDAGEligibilityRegression.lean
          )
          set +e
          (cd psc0/packages/pskernel-c0 &&
            /usr/bin/time -v -o "$RUNNER_TEMP/new-resource.txt" \
              timeout 90s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted --trace-declarations "$RUNNER_TEMP/c0-dag-n32.ndjson" 4096
          ) > "$RUNNER_TEMP/new-verdict.txt" 2>&1
          rc=$?
          set -e
          if [[ "$rc" == 0 ]]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted' "$RUNNER_TEMP/new-verdict.txt"
            verdict=accepted
          elif [[ "$rc" == 124 ]]; then
            verdict=unqualified_timeout
          else
            tail -n 40 "$RUNNER_TEMP/new-verdict.txt"
            exit 1
          fi
          echo "C0_POINTER_INDEX_DAG depth=${{ matrix.depth }} variant=child_pointer_index verdict=$verdict exit=$rc"
          grep 'Elapsed (wall clock)' "$RUNNER_TEMP/new-resource.txt" || true
          echo 'C0_POINTER_INDEX_SCOPE full_proof=true original_fuel_4096=true real_Lean_435=true pointer_only_index=true source_hash_certificate_unchanged=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-pointer-bucket-shared-${{ matrix.depth }}
          path: |
            ${{ runner.temp }}/original-*.txt
            ${{ runner.temp }}/new-*.txt
          if-no-files-found: warn
          retention-days: 21
