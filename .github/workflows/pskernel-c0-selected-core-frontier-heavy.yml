name: PSKernel-C0 selected Core heavy-root bottleneck
on:
  push:
    branches: [feature/pskernel-c0-core-qualification-20261019]
    paths:
      - '.github/workflows/pskernel-c0-selected-core-frontier-heavy.yml'
      - 'psc0/packages/pskernel-c0/test/C0CoreSelectedRoots.py'
      - 'psc0/packages/pskernel-c0/test/C0CoreSelectedFrontier.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authenticate-three-heavy-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /psc0/packages/pskernel-c0/
      - uses: actions/download-artifact@v4
        with:
          run-id: 39193886098
          name: psc0-c0-selected-native-closure
          path: source
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 39295457368
          name: pskernel-c0-selected-core-inventory
          path: measured
          github-token: ${{ github.token }}
      - name: Independently recalculate exact heavy-root frontier and its source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 psc0/packages/pskernel-c0/test/C0CoreSelectedRoots.py \
            --selected source/selected-engine.json \
            --comparison source/comparison.json \
            --roots output/all-roots.txt \
            --manifest output/selected-manifest.json
          python3 psc0/packages/pskernel-c0/test/C0CoreSelectedFrontier.py \
            --selected source/selected-engine.json \
            --comparison source/comparison.json \
            --out-dir output
          cmp output/selected-frontier.json measured/selected-frontier.json
          cmp output/roots-1.txt measured/roots-1.txt
          test "$(wc -l < output/roots-1.txt)" -eq 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('output/selected-frontier.json').read_text())
          assert x['selectedGraphSHA256']=='352d9d469dc2ffebf26d0bcf411dd6c5d582d0628cdf2e1600ca92071fd1c1c9'
          assert x['fullSelectedExternalClosure']==5619
          assert x['shards'][1]['rootCount']==3
          assert x['shards'][1]['externalClosureDeclarations']==4679
          assert x['fullCoreQualified'] is False
          print('C0_SELECTED_HEAVY_FRONTIER source_verified=3_roots closure=4679/5619')
          print('C0_SELECTED_HEAVY_ROOT_NAMES='+repr(x['shards'][1]['roots']))
          PY
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Build pinned official Lean exporter and independent C0 accepting replay
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 && \
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc && \
            lake build c0OfficialReplay)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = leanprover/lean4:v4.35.0
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
      - name: Export and require independent official checking of exactly three real roots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ROOTS < output/roots-1.txt
          test "${#ROOTS[@]}" -eq 3
          (cd "$RUNNER_TEMP/lean4export" && \
            /usr/bin/time -v -o "$GITHUB_WORKSPACE/output/export-resources.txt" \
            timeout 540s lake env .lake/build/bin/lean4export Init -- "${ROOTS[@]}") \
            > output/heavy-roots.ndjson
          test -s output/heavy-roots.ndjson
          sha256sum output/heavy-roots.ndjson > output/export-SHA256SUMS
          wc -lc output/heavy-roots.ndjson | tee output/export-size.txt
          (cd "$RUNNER_TEMP/lean4export" && \
            /usr/bin/time -v -o "$GITHUB_WORKSPACE/output/official-resources.txt" \
            timeout 420s lake env leanchecker --from-export \
              "$GITHUB_WORKSPACE/output/heavy-roots.ndjson") \
            > output/official-verdict.txt 2>&1
          grep -Fq 'Lean default kernel accepts the solution' output/official-verdict.txt
          echo 'C0_SELECTED_HEAVY_ROOTS_OFFICIAL=ACCEPTED_SAME_BYTES'
      - name: Require original fuel 4096 and record exact active C0 blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd psc0/packages/pskernel-c0 && \
            /usr/bin/time -v -o "$GITHUB_WORKSPACE/output/c0-resources.txt" \
            timeout 180s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
              --require-accepted --trace-declarations \
              "$GITHUB_WORKSPACE/output/heavy-roots.ndjson" 4096) \
            > output/c0-verdict.txt 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > output/c0-exit-code.txt
          echo "C0_SELECTED_HEAVY_ROOTS_EXIT=$rc source_fuel=4096"
          grep 'C0_REAL_EXPORT_DECL_BEGIN' output/c0-verdict.txt | tail -n 3 || true
          grep 'C0_REAL_EXPORT_SLOW_DECL' output/c0-verdict.txt | tail -n 3 || true
          grep 'C0_REAL_EXPORT_PROGRESS' output/c0-verdict.txt | tail -n 3 || true
          grep -F 'C0_REAL_EXPORT replay_outcome=' output/c0-verdict.txt | tail -n 1 || true
          if [ "$rc" -ne 0 ]; then
            echo "C0_SELECTED_HEAVY_ROOTS=NOT_QUALIFIED exit=$rc; no_timeout_or_resource_as_acceptance" >&2
            exit 1
          fi
          grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted' output/c0-verdict.txt
          echo 'C0_SELECTED_HEAVY_ROOTS=ACCEPTED_DIAGNOSTIC_SUBSET_ONLY'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pskernel-c0-selected-heavy-root-diagnostic
          path: output/
          retention-days: 30
          if-no-files-found: warn
