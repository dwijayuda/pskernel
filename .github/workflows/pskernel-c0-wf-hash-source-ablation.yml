name: PSKernel-C0 pinned WF source-hash versus exact memo A/B
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-wf-hash-source-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-exact-hash-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Pin official 4.35 WF theorem and exact export
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (
            cd "$RUNNER_TEMP/lean4export"
            lake build lean4export
            lake env .lake/build/bin/lean4export Init -- 'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix' > "$RUNNER_TEMP/wf-source-hash-ab.ndjson"
            lake env leanchecker --from-export "$RUNNER_TEMP/wf-source-hash-ab.ndjson" > "$RUNNER_TEMP/wf-source-hash-ab-official.txt" 2>&1
          )
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/wf-source-hash-ab-official.txt"
          test "$(wc -l < "$RUNNER_TEMP/wf-source-hash-ab.ndjson")" -eq 15758
          test "$(stat -c%s "$RUNNER_TEMP/wf-source-hash-ab.ndjson")" -eq 777157
          echo "1d97cdd876069322a27ab69b2a1607e615695c8c0be065bbbb0db476833b5abe  $RUNNER_TEMP/wf-source-hash-ab.ndjson" | sha256sum -c -
      - name: Replay unchanged-source hash without native exact-memo substitution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cache=Path("psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean")
          s=cache.read_text()
          marker="@[csimp] theorem psKernelExprHash_compiler_eq_exactMemo"
          assert s.count(marker)==1, "native source changed: refuse ablation"
          cache.write_text(s.replace(marker,"theorem psKernelExprHash_compiler_eq_exactMemo"))
          print("C0_SOURCE_HASH_AB variant=source semantics=original proof_still_present=true compiler_rewrite=disabled")
          PY
          (cd psc0/packages/pskernel-c0 && lake build PsKernelC0 c0OfficialReplay)
          (cd psc0/packages/pskernel-c0 &&
            .lake/build/bin/c0OfficialReplay --require-accepted test/C0OfficialAccept.ndjson 4096 > "$RUNNER_TEMP/hash-source-control.txt")
          grep -Fq 'C0ExportVerdict.accepted' "$RUNNER_TEMP/hash-source-control.txt"
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/hash-source-resources.txt" timeout 120s stdbuf -oL -eL \
              .lake/build/bin/c0OfficialReplay --require-accepted "$RUNNER_TEMP/wf-source-hash-ab.ndjson" 4096
          ) > "$RUNNER_TEMP/hash-source-verdict.txt" 2>&1
          rc=$?
          set -e
          echo "C0_SOURCE_HASH_AB_RESULT variant=source native_exit=$rc"
          if [ "$rc" -eq 0 ]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096' "$RUNNER_TEMP/hash-source-verdict.txt"
          elif [ "$rc" -ne 124 ]; then
            echo "C0_SOURCE_HASH_AB variant=source non_timeout_unqualified_exit=$rc"
          fi
          grep -E 'Elapsed \(wall clock\) time|Maximum resident set size' "$RUNNER_TEMP/hash-source-resources.txt" || true
      - name: Restore proof-certified compiler memo and replay SAME theorem on SAME runner
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean \
            > psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean
          grep -Fq '@[csimp] theorem psKernelExprHash_compiler_eq_exactMemo' \
            psc0/packages/pskernel-c0/src/Ps/KernelCore/Runtime/Acceleration/Cache.lean
          (cd psc0/packages/pskernel-c0 && lake build PsKernelC0 c0OfficialReplay)
          (cd psc0/packages/pskernel-c0 &&
            .lake/build/bin/c0OfficialReplay --require-accepted test/C0OfficialAccept.ndjson 4096 > "$RUNNER_TEMP/hash-memo-control.txt")
          grep -Fq 'C0ExportVerdict.accepted' "$RUNNER_TEMP/hash-memo-control.txt"
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/hash-memo-resources.txt" timeout 120s stdbuf -oL -eL \
              .lake/build/bin/c0OfficialReplay --require-accepted "$RUNNER_TEMP/wf-source-hash-ab.ndjson" 4096
          ) > "$RUNNER_TEMP/hash-memo-verdict.txt" 2>&1
          rc=$?
          set -e
          echo "C0_SOURCE_HASH_AB_RESULT variant=memo native_exit=$rc"
          if [ "$rc" -eq 0 ]; then
            grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096' "$RUNNER_TEMP/hash-memo-verdict.txt"
          elif [ "$rc" -ne 124 ]; then
            echo "C0_SOURCE_HASH_AB variant=memo non_timeout_unqualified_exit=$rc"
          fi
          grep -E 'Elapsed \(wall clock\) time|Maximum resident set size' "$RUNNER_TEMP/hash-memo-resources.txt" || true
          echo "C0_SOURCE_HASH_AB_CLASSIFICATION diagnostic_same_runner_no_trusted_code_changes=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-wf-native-hash-source-ab
          path: |
            ${{ runner.temp }}/hash-source-verdict.txt
            ${{ runner.temp }}/hash-source-resources.txt
            ${{ runner.temp }}/hash-memo-verdict.txt
            ${{ runner.temp }}/hash-memo-resources.txt
            ${{ runner.temp }}/wf-source-hash-ab-official.txt
          if-no-files-found: warn
          retention-days: 14
