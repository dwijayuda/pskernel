name: PSKernel-C0 complex Init theorem closure triage
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-wf-heavy-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-real-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Rebuild exact upstream exporter and unchanged C0 kernel replay
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc &&
            lake build c0OfficialReplay)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
      - name: Check independent complete closures of large real theorem candidates
        shell: bash
        run: |
          set -euo pipefail
          names=(
            'WellFounded.partialExtrinsicFix₃'
            'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix'
            'BitVec.msb_add'
          )
          for n in "${!names[@]}"; do
            target="${names[$n]}"
            name="$((n+1))"
            echo "C0_HEAVY_INIT_TARGET_$n=$target"
            (
              cd "$RUNNER_TEMP/lean4export"
              lake env .lake/build/bin/lean4export Init -- "$target" > "$RUNNER_TEMP/heavy-$name.ndjson"
              lake env leanchecker --from-export "$RUNNER_TEMP/heavy-$name.ndjson" \
                > "$RUNNER_TEMP/heavy-$name-official.txt" 2>&1
            )
            grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/heavy-$name-official.txt"
            sha256sum "$RUNNER_TEMP/heavy-$name.ndjson"
            wc -lc "$RUNNER_TEMP/heavy-$name.ndjson"
            set +e
            (
              cd psc0/packages/pskernel-c0
              /usr/bin/time -v -o "$RUNNER_TEMP/heavy-$name-resources.txt" \
                timeout 180s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                  --require-accepted "$RUNNER_TEMP/heavy-$name.ndjson" 4096
            ) > "$RUNNER_TEMP/heavy-$name-c0.txt" 2>&1
            rc=$?
            set -e
            echo "C0_HEAVY_INIT_EXIT index=$name code=$rc"
            grep 'C0_REAL_EXPORT replay_outcome' "$RUNNER_TEMP/heavy-$name-c0.txt" | tail -n 2 || true
            grep 'C0_REAL_EXPORT_SLOW_DECL' "$RUNNER_TEMP/heavy-$name-c0.txt" | tail -n 4 || true
            if test "$rc" -eq 0; then
              echo "C0_HEAVY_INIT_DIAGNOSTIC index=$name result=accepted_closure_only"
            else
              echo "C0_HEAVY_INIT_DIAGNOSTIC index=$name result=not_accepted_or_host_timeout"
              tail -n 15 "$RUNNER_TEMP/heavy-$name-c0.txt"
            fi
            cat "$RUNNER_TEMP/heavy-$name-resources.txt" | grep -E 'Elapsed \(wall clock\)|Maximum resident set size|Exit status' || true
          done
          echo "C0_HEAVY_INIT_SCOPE=independent_closures_not_full_Init"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-heavy-theorem-closures
          path: |
            ${{ runner.temp }}/heavy-*-official.txt
            ${{ runner.temp }}/heavy-*-c0.txt
            ${{ runner.temp }}/heavy-*-resources.txt
          if-no-files-found: warn
          retention-days: 14
