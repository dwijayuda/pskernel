name: PSKernel-C0 discriminating memo fingerprint A/B
on:
  push:
    branches:
      - perf/pskernel-c0-v7-rust-20261012
    paths:
      - '.github/workflows/pskernel-c0-wf-memo-fingerprint-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-proved-runtime-hash:
    strategy:
      fail-fast: false
      matrix:
        variant: [spine, depth8]
    runs-on: ubuntu-latest
    env:
      C0_FINGERPRINT_VARIANT: ${{ matrix.variant }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: psc0/packages/pskernel-c0
          auto-config: false
          build: false
          test: false
          use-github-cache: true
      - name: Reproduce byte-exact officially accepted Lean 4.35 WF proof
        shell: bash
        run: |
          set -euo pipefail
          (cd psc0/packages/pskernel-c0 &&
            test "$(lean --githash)" = eb6cafb7290e8bd5f2937522d8d804f58f02bafc)
          git clone --quiet https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --quiet 5a9a355dc6c5fd82b69058d433e2ae2e8dfbf8fe
          test "$(cat "$RUNNER_TEMP/lean4export/lean-toolchain")" = "leanprover/lean4:v4.35.0"
          (cd "$RUNNER_TEMP/lean4export" &&
            lake build lean4export &&
            lake env .lake/build/bin/lean4export Init -- 'WellFounded.partialExtrinsicFix₃_eq_partialExtrinsicFix' \
              > "$RUNNER_TEMP/wf-both-native.ndjson" &&
            lake env leanchecker --from-export "$RUNNER_TEMP/wf-both-native.ndjson" \
              > "$RUNNER_TEMP/wf-both-official.txt" 2>&1)
          test "$(wc -l < "$RUNNER_TEMP/wf-both-native.ndjson")" -eq 15758
          test "$(stat -c%s "$RUNNER_TEMP/wf-both-native.ndjson")" -eq 777157
          echo "1d97cdd876069322a27ab69b2a1607e615695c8c0be065bbbb0db476833b5abe  $RUNNER_TEMP/wf-both-native.ndjson" | sha256sum -c -
          grep -Fq "Lean default kernel accepts the solution" "$RUNNER_TEMP/wf-both-official.txt"
          echo "C0_WF_BOTH_PINNED official_Lean435=accepted real_records=15758"
      - name: Test proof-checked source-hash compiler rewrite inside native cache only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path("psc0/packages/pskernel-c0")
          cache=pkg/"src/Ps/KernelCore/Runtime/Acceleration/Cache.lean"
          memo=pkg/"src/Ps/KernelCore/Runtime/Acceleration/CertifiedHashMemo.lean"
          beta=pkg/"src/Ps/KernelCore/Core/Substitution/Beta.lean"
          left=cache.read_text()
          right=memo.read_text()
          prefix=("import Ps.KernelCore.Runtime.Acceleration.Cache\n"
                  "import Ps.KernelCore.Core.ExprDecidableEq\n")
          assert right.startswith(prefix)
          assert right.count("psKernelExprHash_compiler_eq_exactMemo")==1
          marker="\nabbrev PsKernelExprMapIndex :="
          assert left.count(marker)==1
          # Both compiler rewrites are Lean-proved; the hash csimp has
          # to be in the original Cache module for all cache consumers.
          source=left.replace(
              "import Ps.KernelCore.Core.Expr\n",
              "import Ps.KernelCore.Core.ExprDecidableEq\n")
          source=source.replace(marker,"\n"+right[len(prefix):]+"\n"+marker)
          import os
          variant=os.environ["C0_FINGERPRINT_VARIANT"]
          inst=pkg/"src/Ps/KernelCore/Architecture/CertifiedInstantiateMemo.lean"
          i_src=inst.read_text()
          if variant == "depth8":
            old='  psKernelC0MemoShapeHash 4 expr'
            assert source.count(old)==1
            source=source.replace(old,'  psKernelC0MemoShapeHash 8 expr')
            oldInst='  psKernelCacheMix (psKernelC0MemoShapeHash 3 expr) offset'
            assert i_src.count(oldInst)==1
            i_src=i_src.replace(oldInst,
              '  psKernelCacheMix (psKernelC0MemoShapeHash 8 expr) offset')
          elif variant == "spine":
            old='private def psKernelC0HashMemoBucket (expr : PsKernelExpr) : Nat :='
            assert source.count(old)==1
            lean_lines=[
              "/-- Deterministic bucket hint, never an equality/admission test. -/",
              "def psKernelC0MemoSpineFingerprint (expr : PsKernelExpr) : Nat :=",
              "  let head := psKernelExprGetAppFn expr",
              "  let arity := psKernelExprGetAppNumArgs expr",
              "  let headHash :=",
              "    match head with",
              "    | .const name levels =>",
              "        psKernelCacheMix (psKernelCacheNameHash name)",
              "          (psKernelCacheLevelListHash levels)",
              "    | .fvar name => psKernelCacheMix 41 (psKernelCacheNameHash name)",
              "    | .mvar name => psKernelCacheMix 42 (psKernelCacheNameHash name)",
              "    | .sort level => psKernelCacheMix 43 (psKernelCacheLevelHash level)",
              "    | .lit value => psKernelCacheMix 44 (psKernelCacheLiteralHash value)",
              "    | .bvar idx => psKernelCacheMix 45 idx",
              "    | other => psKernelC0MemoShapeHash 3 other",
              "  psKernelCacheMix",
              "    (psKernelCacheMix (psKernelC0MemoShapeHash 3 expr) arity)",
              "    headHash",
            ]
            source=source.replace(old,"\n".join(lean_lines)+"\n\n"+old)
            oldBase='  psKernelC0MemoShapeHash 4 expr'
            assert source.count(oldBase)==1
            source=source.replace(oldBase,
              '  psKernelC0MemoSpineFingerprint expr')
            oldInst='  psKernelCacheMix (psKernelC0MemoShapeHash 3 expr) offset'
            assert i_src.count(oldInst)==1
            i_src=i_src.replace(oldInst,
              '  psKernelCacheMix (psKernelC0MemoSpineFingerprint expr) offset')
          else:
            raise AssertionError("unknown fingerprint variant")
          inst.write_text(i_src)
          print(f"C0_MEMO_FINGERPRINT_ABLATION variant={variant} exact_source_certificates=unchanged")
          cache.write_text(source)
          memo.write_text(prefix+
              "\n/-! Exact compiler replacement is defined in the source cache. -/\n")
          old="import Ps.KernelCore.Core.Substitution.Instantiate\n"
          b=beta.read_text()
          assert b.count(old)==1
          beta.write_text(b.replace(old,old+
              "import Ps.KernelCore.Architecture.CertifiedInstantiateMemo\n"))
          print("C0_WF_BOTH_ABLATION exact_hash_and_instantiation_csimp=true")
          PY
          (cd psc0/packages/pskernel-c0 &&
            lake build PsKernelC0 c0OfficialReplay c0HashCSimpProbe c0InstantiateCSimpProbe)
      - name: Require Lean checked source equality and original negative regressions
        working-directory: psc0/packages/pskernel-c0
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s .lake/build/bin/c0HashCSimpProbe
          timeout 25s .lake/build/bin/c0InstantiateCSimpProbe
          lake env lean --run test/C0CertifiedHashMemoRegression.lean
          lake env lean --run test/C0CertifiedInstantiateMemoRegression.lean
          lake env lean --run test/C0OfficialNdjsonReplay.lean
          lake env lean --run test/C0ProofCongruenceRegression.lean
          echo "C0_WF_BOTH_SOURCE_PROOF csimp=Lean_proved exact_original_hash=yes negative=pass"
      - name: Require original WF acceptance or preserve explicit bounded nonacceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd psc0/packages/pskernel-c0
            /usr/bin/time -v -o "$RUNNER_TEMP/wf-both-resources.txt" \
              timeout 240s stdbuf -oL -eL .lake/build/bin/c0OfficialReplay \
                --require-accepted "$RUNNER_TEMP/wf-both-native.ndjson" 4096
          ) > "$RUNNER_TEMP/wf-both-c0.txt" 2>&1
          status=$?
          set -e
          echo "C0_WF_BOTH_PROCESS_EXIT=$status"
          grep "C0_REAL_EXPORT replay_outcome" "$RUNNER_TEMP/wf-both-c0.txt" | tail -n 3 || true
          grep "C0_REAL_EXPORT_SLOW_DECL" "$RUNNER_TEMP/wf-both-c0.txt" | tail -n 4 || true
          if test "$status" -eq 0 &&
              grep -Fq 'C0_REAL_EXPORT replay_outcome=C0ExportVerdict.accepted consumed_records=15758 fuel=4096' \
                "$RUNNER_TEMP/wf-both-c0.txt"; then
            echo "C0_WF_BOTH_RESULT=ACCEPTED_exact_real_Lean435_closure_unchanged_fuel"
          else
            echo "C0_WF_BOTH_RESULT=NOT_QUALIFIED_host_timeout_or_checker_error"
            tail -n 35 "$RUNNER_TEMP/wf-both-c0.txt"
          fi
          cat "$RUNNER_TEMP/wf-both-resources.txt"
          echo "C0_WF_BOTH_SCOPE=disposable_checkout_only_production_branch_unchanged variant=$C0_FINGERPRINT_VARIANT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pskernel-c0-memo-fingerprint-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/wf-both-official.txt
            ${{ runner.temp }}/wf-both-c0.txt
            ${{ runner.temp }}/wf-both-resources.txt
          if-no-files-found: warn
          retention-days: 14
