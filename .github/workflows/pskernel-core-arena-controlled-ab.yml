name: PSKernel Core Arena controlled native comparison

on:
  push:
    branches:
      - pscv/pskernel-core-arena-v1
    paths:
      - ".github/workflows/pskernel-core-arena-controlled-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identical-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 253832714dac058604e1cf3bd669e89fd8200b76
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean and uv
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Materialize immutable baseline and Arena export
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach ../pskernel-arena-baseline "$BASE_SHA"
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc
          cd arena
          uv run lka.py build-test init --cache
          for n in 200000 362100; do
            head -n "$n" _build/tests/init.ndjson > "/tmp/init-ab-${n}.ndjson"
            wc -l -c "/tmp/init-ab-${n}.ndjson"
          done

      - name: Build both native checkers
        shell: bash
        run: |
          set -euo pipefail
          cd ../pskernel-arena-baseline/psc15selfhost
          lake build psc_kernel_core_arena
          cd "$GITHUB_WORKSPACE/psc15selfhost"
          lake build psc_kernel_core_arena

      - name: Compare identical inputs with reversed order
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/../pskernel-arena-baseline/psc15selfhost/.lake/build/bin/psc_kernel_core_arena"
          NEW="$GITHUB_WORKSPACE/psc15selfhost/.lake/build/bin/psc_kernel_core_arena"
          measure() {
            local label="$1" executable="$2" input="$3"
            echo "=== $label input=$input ==="
            /usr/bin/time -f "measurement=${label} input=${input} wall_s=%e peak_rss_kb=%M exit=%x" \
              timeout 300 "$executable" < "/tmp/init-ab-${input}.ndjson"
          }
          for n in 200000 362100; do
            measure baseline-1 "$BASE" "$n"
            measure candidate-1 "$NEW" "$n"
            measure candidate-2 "$NEW" "$n"
            measure baseline-2 "$BASE" "$n"
          done
