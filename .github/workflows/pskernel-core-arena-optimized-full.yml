name: PSKernel Core Arena optimized full Init Std

on:
  push:
    branches:
      - pscv/pskernel-core-arena-optimized-v3
    paths:
      - ".github/workflows/pskernel-core-arena-optimized-full.yml"
      - "psc15selfhost/host/src/Ps/Host/KernelCoreArena/**"
      - "psc15selfhost/packages/pskernel-core/src/**"
      - "psc15selfhost/packages/pskernel/PSC1Kernel/Replay*.lean"
      - "psc15selfhost/lakefile.lean"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pskernel-core-arena-init-std-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test: [init, std]
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone upstream Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc

      - name: Force wall-clock fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-perf"
          cat > "$RUNNER_TEMP/no-perf/perf" <<'EOF'
          #!/bin/sh
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-perf/perf"
          echo "$RUNNER_TEMP/no-perf" >> "$GITHUB_PATH"

      - name: Register PSKernel
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > checkers/pskernel-core.yaml <<EOF
          description: |
            PSKernel Core Arena development checker.
          url: https://github.com/dwijayuda/pskernel
          ref: pscv/pskernel-core-arena-optimized-v3
          rev: $PSKERNEL_SHA
          build: |
            cd psc15selfhost
            lake build psc_kernel_core_arena
          run: |
            ulimit -s 65536
            psc15selfhost/.lake/build/bin/psc_kernel_core_arena < "\$IN"
          EOF

      - name: Build corpus export
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-test "${{ matrix.test }}" --cache

      - name: Build PSKernel checker
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-checker pskernel-core

      - name: Run official Init or Std
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py run --checker pskernel-core --test "${{ matrix.test }}"
          TEST_NAME="${{ matrix.test }}" python3 - <<'PY'
          import glob,json,os,sys
          name=os.environ['TEST_NAME']
          rows=[json.load(open(p,encoding='utf-8')) for p in glob.glob('_results/pskernel-core_*.json')]
          rows=[r for r in rows if r.get('test')==name]
          for r in rows:
              print('CORPUS',name,'status=',r.get('status'),'correctness=',r.get('correctness'),'wall_s=',r.get('wall_time'),'rss=',r.get('max_rss'))
              print('STDERR_TAIL',(r.get('stderr') or '')[-4500:])
          if len(rows)!=1 or rows[0].get('correctness')!='correct': sys.exit(1)
          PY

      - name: Report exact result, including timeout
        if: always()
        working-directory: arena
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json
          for p in glob.glob('_results/pskernel-core_*.json'):
              r=json.load(open(p,encoding='utf-8'))
              print('ARENA_RESULT',r.get('test'),r.get('status'),r.get('correctness'),r.get('exit_code'),r.get('wall_time'),r.get('max_rss'))
              print('ARENA_STDERR_TAIL',(r.get('stderr') or '')[-4500:])
          PY

      - name: Preserve Arena evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-optimized-${{ matrix.test }}-${{ github.run_id }}
          path: |
            arena/_results
            arena/_out
          if-no-files-found: ignore

  mathlib:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and uv
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Re-check full proof tree before large-corpus acceptance
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          npm run test:pskernel-core-proofs
      - name: Clone pinned upstream Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc
      - name: Register canonical proof-synced PSKernel
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > checkers/pskernel-core.yaml <<EOF
          description: PSKernel Core verified candidate; kernel semantics owned by canonical proof source.
          url: https://github.com/dwijayuda/pskernel
          ref: pscv/pskernel-core-arena-optimized-v3
          rev: $PSKERNEL_SHA
          build: |
            cd psc15selfhost
            lake build psc_kernel_core_arena
          run: |
            ulimit -s 65536
            psc15selfhost/.lake/build/bin/psc_kernel_core_arena < "\$IN"
          EOF
      - name: Build upstream full Mathlib corpus
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-test mathlib --cache
      - name: Build canonical PSKernel checker
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-checker pskernel-core
      - name: Run upstream Mathlib acceptance
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py run --checker pskernel-core --test mathlib
          python3 - <<'PY'
          import glob,json,sys
          rows=[json.load(open(p,encoding='utf-8')) for p in glob.glob('_results/pskernel-core_*.json')]
          rows=[r for r in rows if r.get('test') == 'mathlib']
          for r in rows:
              print('MATHLIB_RESULT',r.get('status'),r.get('correctness'),r.get('wall_time'),r.get('max_rss'))
          if len(rows)!=1 or rows[0].get('correctness')!='correct':sys.exit(1)
          PY
      - name: Report Mathlib exact verdict and errors
        if: always()
        working-directory: arena
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json
          for p in glob.glob('_results/pskernel-core_*.json'):
              r=json.load(open(p,encoding='utf-8'))
              print('MATHLIB_RESULT',r.get('test'),r.get('status'),r.get('correctness'),r.get('exit_code'),r.get('wall_time'),r.get('max_rss'))
              print('MATHLIB_STDERR_TAIL',(r.get('stderr') or '')[-6000:])
          PY
      - name: Preserve Mathlib evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-optimized-mathlib-${{ github.run_id }}
          path: |
            arena/_results
            arena/_out
          if-no-files-found: ignore
