name: PSKernel Core Arena soundness

on:
  push:
    branches:
      - pscv/pskernel-core-arena-synced-v2
    paths:
      - ".github/workflows/pskernel-core-arena-soundness.yml"
      - "psc15selfhost/host/src/Ps/Host/KernelCoreArena/**"
      - "psc15selfhost/packages/pskernel-core/**"
      - "psc15selfhost/packages/pskernel/PSC1Kernel/Replay*.lean"
      - "psc15selfhost/lakefile.lean"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pskernel-core-arena-soundness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone upstream Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc

      - name: Force wall-clock fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-perf"
          cat > "$RUNNER_TEMP/no-perf/perf" <<'EOF'
          #!/bin/sh
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-perf/perf"
          echo "$RUNNER_TEMP/no-perf" >> "$GITHUB_PATH"

      - name: Register PSKernel
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > checkers/pskernel-core.yaml <<EOF
          description: |
            PSKernel Core Arena development checker.
          url: https://github.com/dwijayuda/pskernel
          ref: pscv/pskernel-core-arena-synced-v2
          rev: $PSKERNEL_SHA
          build: |
            cd psc15selfhost
            lake build psc_kernel_core_arena
          run: |
            ulimit -s 65536
            psc15selfhost/.lake/build/bin/psc_kernel_core_arena --check-historical < "\$IN"
          EOF

      - name: Build historical bug corpus
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-test 'bugs/*' --cache

      - name: Build PSKernel checker
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-checker pskernel-core

      - name: Run historical bug corpus
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py run --checker pskernel-core --test 'bugs/*'
          python3 - <<'PY'
          import glob, json, sys
          rows=[json.load(open(p,encoding='utf-8')) for p in glob.glob('_results/pskernel-core_*.json')]
          counts={}
          for row in rows:
              counts[row['correctness']]=counts.get(row['correctness'],0)+1
          print('summary',counts,'total',len(rows))
          false_accept=[r for r in rows if r.get('status')=='accepted' and r.get('correctness')=='incorrect']
          other_bad=[r for r in rows if r.get('correctness') in ('incorrect','error') and r not in false_accept]
          for r in false_accept+other_bad:
              print('CASE',r['test'],'status=',r['status'],'correctness=',r['correctness'])
              detail=(r.get('stderr','') or r.get('stdout',''))[-2000:]
              print(detail)
          if false_accept or other_bad or not rows:
              sys.exit(1)
          PY
