name: PSKernel Core Arena target diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - pscv/pskernel-core-arena-v1
    paths:
      - ".github/workflows/pskernel-core-arena-targets.yml"
      - "psc15selfhost/packages/pskernel-core/src/Ps/KernelCore/Checker/**"
      - "psc15selfhost/host/src/Ps/Host/KernelCoreArena/**"

permissions:
  contents: read

concurrency:
  group: pskernel-core-arena-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone upstream Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena

      - name: Register focused tests
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/init-target.lean <<'EOF'
          import Init
          EOF
          cat > tests/init-target.yaml <<'EOF'
          leanfile: tests/init-target.lean
          export-decls: ["Std.PRange.UpwardEnumerable.succMany?_add"]
          outcome: accept
          EOF
          cat > tests/std-target.lean <<'EOF'
          import Std
          EOF
          cat > tests/std-target.yaml <<'EOF'
          leanfile: tests/std-target.lean
          export-decls: ["Nat.Internal.Linear.Expr.denote_toPoly_go"]
          outcome: accept
          EOF
          uv run lka.py build-test init-target --cache
          uv run lka.py build-test std-target --cache

      - name: Checkout PSKernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/dwijayuda/pskernel.git pskernel
          cd pskernel
          git checkout "$PSKERNEL_SHA"

      - name: Build current PSKernel
        working-directory: pskernel/psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          lake build psc_kernel_core_arena

      - name: Run focused targets
        shell: bash
        run: |
          set +e
          for id in init-target std-target; do
            INPUT="arena/_build/tests/${id}.ndjson"
            echo "=== ${id} ==="
            wc -l -c "$INPUT"
            pskernel/psc15selfhost/.lake/build/bin/psc_kernel_core_arena < "$INPUT"
            echo "exit=$?"
          done
          exit 0
