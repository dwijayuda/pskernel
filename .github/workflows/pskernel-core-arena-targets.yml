name: PSKernel Core Arena target diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - pscv/pskernel-core-arena-v1
    paths:
      - ".github/workflows/pskernel-core-arena-targets.yml"
      - "psc15selfhost/host/src/Ps/Host/KernelCoreArena/**"
      - "psc15selfhost/packages/pskernel-core/**"
      - "psc15selfhost/packages/pskernel/PSC1Kernel/**"
      - "psc15selfhost/lakefile.lean"

permissions:
  contents: read

concurrency:
  group: pskernel-core-arena-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: init-target
            importModule: Init
            decl: Std.PRange.UpwardEnumerable.succMany?_add
          - id: std-target
            importModule: Std
            decl: Nat.Internal.Linear.Expr.denote_toPoly_go
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone upstream Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/leanprover/lean-kernel-arena.git arena

      - name: Register target test
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > "tests/${{ matrix.id }}.lean" <<EOF
          import ${{ matrix.importModule }}
          EOF
          cat > "tests/${{ matrix.id }}.yaml" <<EOF
          leanfile: tests/${{ matrix.id }}.lean
          export-decls: ["${{ matrix.decl }}"]
          outcome: accept
          EOF
          uv run lka.py build-test "${{ matrix.id }}" --cache

      - name: Checkout PSKernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/dwijayuda/pskernel.git pskernel
          cd pskernel
          git checkout "$PSKERNEL_SHA"

      - name: Build both PSKernel checkers
        working-directory: pskernel/psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          lake build psc_kernel_core_arena psc_kernel_legacy_arena

      - name: Compare current and legacy
        shell: bash
        run: |
          set -u
          INPUT="arena/_build/tests/${{ matrix.id }}.ndjson"
          echo "input=$INPUT"
          wc -l -c "$INPUT"
          echo "=== current pskernel-core ==="
          set +e
          pskernel/psc15selfhost/.lake/build/bin/psc_kernel_core_arena < "$INPUT"
          current=$?
          echo "current_exit=$current"
          echo "=== legacy PSC1 kernel ==="
          pskernel/psc15selfhost/.lake/build/bin/psc_kernel_legacy_arena < "$INPUT"
          legacy=$?
          echo "legacy_exit=$legacy"
          exit 0
