name: PSKernel Core Arena readiness

on:
  push:
    branches:
      - pscv/pskernel-core-arena-optimized-v3
    paths:
      - "psc15selfhost/host/src/Ps/Host/KernelCoreArena/**"
      - "psc15selfhost/packages/pskernel-core/**"
      - "psc15selfhost/packages/pskernel/PSC1Kernel/Replay*.lean"
      - "psc15selfhost/lakefile.lean"
      - "psc15selfhost/test/KernelCoreArena*.lean"
      - "psc15selfhost/test/KernelCore/**"
      - ".github/workflows/pskernel-core-arena.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pskernel-core-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify semantic Lean identity
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - name: Build Arena checker
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          lake build psc_kernel_core_arena
          .lake/build/bin/psc_kernel_core_arena --version

      - name: Run Arena level regression
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          lake exe psc_kernel_core_arena_level_tests

      - name: Run portable foundation differential regressions
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          lake build psc1_kernel_core_foundation_tests
          lake exe psc1_kernel_core_foundation_tests

      - name: Smoke Arena metadata stream
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 ../oracle/fixtures/lean434-init-prelude.ndjson \
            | .lake/build/bin/psc_kernel_core_arena

      - name: Replay pinned Init.Prelude export
        working-directory: psc15selfhost
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v .lake/build/bin/psc_kernel_core_arena \
            < ../oracle/fixtures/lean434-init-prelude.ndjson


  arena-tutorial:
    needs: arena-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PSKERNEL_SHA: ${{ github.sha }}
    steps:
      - name: Install Arena tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone upstream Lean Kernel Arena
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout b83254de5146ef34147ab82a48edbe1856b0edcc

      - name: Force Arena wall-clock measurement fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-perf"
          cat > "$RUNNER_TEMP/no-perf/perf" <<'EOF'
          #!/bin/sh
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/no-perf/perf"
          echo "$RUNNER_TEMP/no-perf" >> "$GITHUB_PATH"

      - name: Register PSKernel Core checker
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          cat > checkers/pskernel-core.yaml <<EOF
          description: |
            PSKernel Core Arena development checker. The host adapter parses
            Lean4Export 3.1.0 and routes all semantic decisions through the
            canonical KernelContract-v1 PSKernel Core implementation.
          url: https://github.com/dwijayuda/pskernel
          ref: pscv/pskernel-core-arena-optimized-v3
          rev: $PSKERNEL_SHA
          build: |
            cd psc15selfhost
            lake build psc_kernel_core_arena
          run: |
            ulimit -s 65536
            psc15selfhost/.lake/build/bin/psc_kernel_core_arena < "\$IN"
          EOF
          cat checkers/pskernel-core.yaml

      - name: Build upstream tutorial corpus
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-test tutorial --cache

      - name: Build PSKernel through Arena
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py build-checker pskernel-core

      - name: Run upstream tutorial corpus
        working-directory: arena
        shell: bash
        run: |
          set -euo pipefail
          uv run lka.py run --checker pskernel-core --test 'tutorial/*'
          python3 - <<'PY'
          import glob, json, sys
          rows = [json.load(open(p, encoding='utf-8'))
                  for p in glob.glob('_results/pskernel-core_*.json')]
          counts = {}
          for row in rows:
              counts[row['correctness']] = counts.get(row['correctness'], 0) + 1
          print('PSKernel Arena tutorial summary:', counts, 'total=', len(rows))
          bad = [r for r in rows if r['correctness'] in ('incorrect', 'error')]
          for row in bad:
              print(row['test'], row['status'], row['correctness'],
                    row.get('stderr', '')[-1000:])
          if bad:
              sys.exit(1)
          if not rows:
              print('no tutorial results produced')
              sys.exit(1)
          PY
