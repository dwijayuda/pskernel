name: PSKernel Core M4 provider parity

on:
  pull_request:
    branches: [psc2/selfhost-lean-kernel]
    paths: ['psc15selfhost/**', '.github/workflows/pskernel-core-provider.yml']
  push:
    branches: [psc2/selfhost-lean-kernel]
    paths: ['psc15selfhost/**', '.github/workflows/pskernel-core-provider.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-core-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-provider-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: psc15selfhost
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Lean and TypeScript
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(lean --githash)" = 293d5d0c0c3f3dded4688b3ccd6a33939ac5102b
          npm install --prefix /tmp/m4-tools --no-audit --no-fund typescript@7.0.2
          echo /tmp/m4-tools/node_modules/.bin >> "$GITHUB_PATH"
      - name: Verify current WASM bytes and semantic source snapshot
        run: |
          set -euo pipefail
          node packages/pskernel-lean-wasm/host/verify-prebuilt.mjs
          npm --prefix packages/pskernel-lean-wasm run check:source-current
      - name: Build current native core provider and bounded API tests
        run: lake build psc_kernel_core_provider psc_kernel_core_provider_tests
      - name: Build official reference provider and checked compiler seed
        working-directory: psc15selfhost/lean-checked
        run: lake build psc2_lean_kernel_provider psc2_lean_checked_seed
      - name: Verify typed failures and fresh sessions
        run: lake exe psc_kernel_core_provider_tests
      - name: Verify fail-closed transport and dual checking
        run: node --test scripts/checked-kernel-dual.test.mjs scripts/checked-kernel-core.test.mjs scripts/psc1kernel-package-layout.test.mjs
      - name: Compare native core with official native and bundled WASM
        run: node scripts/pskernel-core-provider-parity.mjs --output .lake/m4-provider-parity.json
      - name: Check compiler-to-provider-to-output integration
        run: node --test scripts/pskernel-core-checked-build.test.mjs
      - name: Upload bounded parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4-provider-parity
          path: psc15selfhost/.lake/m4-provider-parity.json
          if-no-files-found: error
