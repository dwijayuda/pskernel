name: PSKernel-Fast V3 standalone prototype

on:
  push:
    branches: [research/pskernel-fast-clean-v3-20261011]
    paths:
      - 'pskernel-fast/lean-toolchain'
      - 'pskernel-fast/lakefile.lean'
      - 'pskernel-fast/src/**'
      - 'pskernel-fast/scripts/**'
      - 'pskernel-fast/ARCHITECTURE_POLICY.json'
      - '.github/workflows/pskernel-fast-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pskernel-fast-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean435-term-store-smoke:
    name: Lean 4.35 scoped term-store smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pskernel-fast
          sparse-checkout-cone-mode: true
      - name: Audit independent kernel import boundary
        run: python3 pskernel-fast/scripts/audit_boundary.py
      - name: Install pinned Lean via elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build standalone experimental package
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake update
          # Fail fast on changed proof/runtime closures, reusing outputs below.
          lake build PSKernelFast.Spec.AnnotatedSubstitution PSKernelFast.Proof.SourcePiModelBridge pskernel_fast_typed_normalization_smoke
          lake build PSKernelFast.Spec.GraphUniverseClosure PSKernelFast.Spec.TaggedPropSemantics PSKernelFast.Proof.TaggedPropModelBridge PSKernelFast.Proof.TaggedWellDenoted PSKernelFast.Proof.SourceTaggedContextBridge PSKernelFast.TypedConversion pskernel_fast_smoke pskernel_fast_eval_smoke pskernel_fast_eval_bench pskernel_fast_core_syntax_smoke pskernel_fast_symbolic_level_smoke pskernel_fast_catalog_smoke pskernel_fast_sort_fragment_smoke pskernel_fast_scoped_context_smoke pskernel_fast_general_pi_smoke pskernel_fast_typed_conversion_smoke pskernel_fast_typed_conversion_bench
      - name: Audit exact theorem assumptions
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lake env lean src/PSKernelFast/Spec/ContextScope.lean | tee /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/ScopeReflection.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/GeneralPiScope.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/TypedSubstitution.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/Erasure.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/ErasureTotality.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/UniverseSemantics.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/PropPi.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/PropInterp.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/PropInterpreterBridge.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/CheckedPropAnnotations.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/CertifiedPropExamples.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/ProofPointCandidate.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/SetEncoding.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/TaggedProofPoint.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/FiniteUniverseClosure.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/TaggedPointUniverse.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/GraphUniverseClosure.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/TaggedPropSemantics.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/TaggedPropModelBridge.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/TaggedWellDenoted.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/SourceTaggedContextBridge.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/TypedConversion.lean | tee -a /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/PiModelRegime.lean | tee -a /tmp/pskernel-fast-axioms.log
          cat /tmp/pskernel-fast-axioms.log
          python3 scripts/audit_axioms.py /tmp/pskernel-fast-axioms.log
      - name: Audit G4.4b and P1k additional theorem assumptions
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lake env lean src/PSKernelFast/TypedNormalization.lean | tee /tmp/pskernel-fast-g44b-axioms.log
          lake env lean src/PSKernelFast/Spec/UniverseImageClosure.lean | tee -a /tmp/pskernel-fast-g44b-axioms.log
          lake env lean src/PSKernelFast/Spec/DependentGraphSpace.lean | tee -a /tmp/pskernel-fast-g44b-axioms.log
          python3 scripts/audit_typed_normalization.py /tmp/pskernel-fast-g44b-axioms.log
      - name: Audit P1l and P1m model and source assumptions
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lake env lean src/PSKernelFast/Spec/GraphApplication.lean | tee /tmp/pskernel-fast-p1l-axioms.log
          lake env lean src/PSKernelFast/Spec/TaggedDependentPi.lean | tee -a /tmp/pskernel-fast-p1l-axioms.log
          lake env lean src/PSKernelFast/Proof/SourcePiModelBridge.lean | tee -a /tmp/pskernel-fast-p1l-axioms.log
          python3 scripts/audit_graph_model.py /tmp/pskernel-fast-p1l-axioms.log
      - name: Audit P1n semantic substitution assumptions
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lake env lean src/PSKernelFast/Spec/AnnotatedSubstitution.lean | tee /tmp/pskernel-fast-p1n-axioms.log
          python3 scripts/audit_annotated_substitution.py /tmp/pskernel-fast-p1n-axioms.log
      - name: Run fail-closed representation tests
        working-directory: pskernel-fast
        run: |
          lake exe pskernel_fast_smoke
          lake exe pskernel_fast_eval_smoke
          lake exe pskernel_fast_core_syntax_smoke
          lake exe pskernel_fast_symbolic_level_smoke
          lake exe pskernel_fast_catalog_smoke
          lake exe pskernel_fast_sort_fragment_smoke
          lake exe pskernel_fast_scoped_context_smoke
          lake exe pskernel_fast_general_pi_smoke
          lake exe pskernel_fast_typed_conversion_smoke
      - name: G4.4b native typed paths and official kernel differential
        working-directory: pskernel-fast
        run: lake exe pskernel_fast_typed_normalization_smoke
      - name: Exploratory paired beta WHNF benchmark
        working-directory: pskernel-fast
        run: lake exe pskernel_fast_eval_bench
      - name: G4.4a actual typed conversion microbenchmark
        working-directory: pskernel-fast
        run: lake exe pskernel_fast_typed_conversion_bench
