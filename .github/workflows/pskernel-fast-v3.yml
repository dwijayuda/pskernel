name: PSKernel-Fast V3 standalone prototype

on:
  push:
    branches: [research/pskernel-fast-clean-v3-20261011]
    paths:
      - 'pskernel-fast/lean-toolchain'
      - 'pskernel-fast/lakefile.lean'
      - 'pskernel-fast/src/**'
      - 'pskernel-fast/scripts/**'
      - 'pskernel-fast/ARCHITECTURE_POLICY.json'
      - '.github/workflows/pskernel-fast-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pskernel-fast-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean435-term-store-smoke:
    name: Lean 4.35 scoped term-store smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pskernel-fast
          sparse-checkout-cone-mode: true
      - name: Audit independent kernel import boundary
        run: python3 pskernel-fast/scripts/audit_boundary.py
      - name: Install pinned Lean via elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build standalone experimental package
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake update
          lake build pskernel_fast_smoke pskernel_fast_eval_smoke pskernel_fast_eval_bench pskernel_fast_core_syntax_smoke pskernel_fast_symbolic_level_smoke pskernel_fast_catalog_smoke pskernel_fast_sort_fragment_smoke pskernel_fast_scoped_context_smoke pskernel_fast_general_pi_smoke
      - name: Audit exact theorem assumptions
        working-directory: pskernel-fast
        shell: bash
        run: |
          set -euo pipefail
          lake env lean src/PSKernelFast/Spec/ContextScope.lean > /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/ScopeReflection.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/GeneralPiScope.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/TypedSubstitution.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/Erasure.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/ErasureTotality.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/UniverseSemantics.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/PropPi.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/PropInterp.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/PropInterpreterBridge.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/CheckedPropAnnotations.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/CertifiedPropExamples.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Spec/ProofPointCandidate.lean >> /tmp/pskernel-fast-axioms.log
          lake env lean src/PSKernelFast/Proof/PiModelRegime.lean >> /tmp/pskernel-fast-axioms.log
          cat /tmp/pskernel-fast-axioms.log
          python3 scripts/audit_axioms.py /tmp/pskernel-fast-axioms.log
      - name: Run fail-closed representation tests
        working-directory: pskernel-fast
        run: |
          lake exe pskernel_fast_smoke
          lake exe pskernel_fast_eval_smoke
          lake exe pskernel_fast_core_syntax_smoke
          lake exe pskernel_fast_symbolic_level_smoke
          lake exe pskernel_fast_catalog_smoke
          lake exe pskernel_fast_sort_fragment_smoke
          lake exe pskernel_fast_scoped_context_smoke
          lake exe pskernel_fast_general_pi_smoke
      - name: Exploratory paired beta WHNF benchmark
        working-directory: pskernel-fast
        run: lake exe pskernel_fast_eval_bench
