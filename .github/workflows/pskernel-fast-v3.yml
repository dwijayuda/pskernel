name: PSKernel-Fast V3 greenfield G0

on:
  push:
    branches: [research/pskernel-fast-v3-greenfield-20261011]
    paths:
      - "psc0/packages/pskernel-fast/**/*.lean"
      - "psc0/packages/pskernel-fast/lean-toolchain"
      - ".github/workflows/pskernel-fast-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35-rc4
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify pinned compiler and run focused G0-G2 research checks
        shell: bash
        working-directory: psc0/packages/pskernel-fast
        run: |
          set -euo pipefail
          test "$(lean --githash)" = c29b6dda4f7c20e3eeaa717c4e565663c5cfa364
          lean --version
          lake build pskernel_fast_mvp
          lake exe pskernel_fast_mvp
