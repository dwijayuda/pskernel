name: pskernel-one level slice
on:
  push:
    branches: [psc2/pskernel-one]
    paths:
      - psc15selfhost/packages/pskernel-one/**
      - psc15selfhost/scripts/pskernel-one-*.mjs
      - psc15selfhost/lakefile.lean
      - .github/workflows/pskernel-one-level.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  level:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: psc15selfhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pinned native reference and owned level tests
        run: lake exe pskernel_one_level_tests
      - name: Semantic mutation and source tamper tests
        run: |
          node scripts/pskernel-one-mutations.mjs
          node scripts/pskernel-one-tamper.mjs
      - name: Build current seed compiler
        run: lake build psc1
      - name: Install locked TypeScript
        run: |
          npm install --prefix "$RUNNER_TEMP/pskernel-one-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          echo "TSC=$RUNNER_TEMP/pskernel-one-tools/node_modules/.bin/tsc" >> "$GITHUB_ENV"
      - name: Generated Nat recursor regression
        run: |
          lake exe pskernel_one_nat_boundary_tests
          node scripts/pskernel-one-nat-runtime.mjs
      - name: Existing compiler regression and alternate backend builds
        run: |
          lake exe psc1_backend_ts_tests
          lake exe psc2_minimal_selfhost_tests
          lake build PsBackendRust PsBackendWasm
      - name: Source and canonical PS profile
        run: node scripts/pskernel-one-profile.mjs
      - name: Actual TypeScript emission
        run: |
          node scripts/pskernel-one-profile.mjs --emit || {
            node scripts/pskernel-one-emit-probe.mjs
            exit 1
          }
      - name: Actual generated foundation tsc and semantic execution
        run: node scripts/pskernel-one-runtime.mjs
      - name: Save small seed for local reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-one-seed-${{ github.sha }}
          retention-days: 7
          path: psc15selfhost/.lake/build/bin/psc1
      - name: Save exact seed and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-one-evidence-${{ github.sha }}
          retention-days: 7
          path: |
            psc15selfhost/.lake/build/bin/psc1
            psc15selfhost/.lake/build/bin/pskernel_one_level_tests
            psc15selfhost/dist/pskernel-one/
