name: Rust let function result

on:
  pull_request:
    branches:
      - selfhost/psc1-lean-bootstrap
    paths:
      - selfhost/packages/backend-rust/**
      - selfhost/test/BackendRustLetFunctionResultTests.lean
      - selfhost/lakefile.lean
      - .github/workflows/rust-let-function-result.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  let-function-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build regression
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build PsBackendRust psc1_backend_rust_let_function_result_tests

      - name: Run regression
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_rust_let_function_result_tests
