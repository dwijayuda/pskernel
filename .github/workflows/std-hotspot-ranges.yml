name: Std hotspot parallel ranges

on:
  push:
    branches: [diagnostic/std-shared-hotspot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  range:
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 37024
            count: 32
          - start: 37056
            count: 32
          - start: 37088
            count: 32
          - start: 37120
            count: 32
          - start: 37152
            count: 32
          - start: 37184
            count: 32
          - start: 37216
            count: 32
          - start: 37248
            count: 5
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Replay root slice
        env:
          PSKERNEL_WORKER_TIMEOUT_MS: "30000"
          PSKERNEL_WORKER_HEAP_MIB: "2048"
        run: node scripts/adaptive-root-oracle.mjs Std 114029 ${{ matrix.start }} ${{ matrix.count }} ${{ matrix.count }} 1
