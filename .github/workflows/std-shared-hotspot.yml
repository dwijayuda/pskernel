name: Std shared hotspot diagnostic

on:
  push:
    branches: [diagnostic/std-shared-hotspot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Map suspected canonical shards
        run: lean --run oracle/replay-probe/DependencyExport.lean Std --shard-manifest 3780 80

  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          lean_dir="$(dirname "$lean_bin")"
          echo "LEAN434_BIN=$lean_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Isolate suspected root window
        env:
          PSKERNEL_WORKER_TIMEOUT_MS: "30000"
          PSKERNEL_WORKER_HEAP_MIB: "2048"
        run: node scripts/adaptive-root-oracle.mjs Std 114029 37024 229 32 1

  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          lean_dir="$(dirname "$lean_bin")"
          test -x "$lean_dir/leanchecker"
          echo "LEAN434_BIN=$lean_dir" >> "$GITHUB_ENV"
          echo "LEAN434_SRC=$GITHUB_WORKSPACE/study/lean4-4.34.0" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Shared canonical replay with per-shard diagnostics
        env:
          PSKERNEL_STD_HEAP_MIB: "5632"
          PSKERNEL_STD_STACK_KIB: "65500"
          PSKERNEL_LOG_EVERY_SHARD: "1"
          PSKERNEL_NATIVE_TIMEOUT_MS: "60000"
          PSKERNEL_LOG_DECLARATIONS: "1"
          PSKERNEL_LOG_DECLARATIONS_MIN_ENV: "34000"
        run: node scripts/full-std-oracle.mjs
