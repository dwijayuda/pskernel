name: Temporary PSC2 apply-args worker generator

on:
  push:
    branches:
      - tmp/psc2-apply-args-recursion-worker-exec-20260930

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite apply-args fuel recursion
        shell: python
        run: |
          from pathlib import Path

          path = Path('psc15selfhost/packages/elab/src/Ps/Elab/Term.lean')
          source = path.read_text()
          start = source.index('def psElabApplyArgsWithFuel\n')
          end = source.index('\ndef psElabApplyArgs\n', start)
          replacement = '''def psElabApplyArgsWithFuelWorker
              (elaborate :
                PsElabContext ->
                PsSyntaxTerm ->
                Option PsExpr ->
                Except PsElabError PsElabTermResult)
              (remainingFuel : Nat) :
              PsElabTermResult ->
              List PsSyntaxTerm ->
              List Nat ->
              Except PsElabError PsElabApplicationResult :=
            match remainingFuel with
            | 0 =>
                fun (_current : PsElabTermResult) =>
                  fun (_arguments : List PsSyntaxTerm) =>
                    fun (_pendingInstancesRev : List Nat) =>
                      Except.error PsElabError.fuelExhausted
            | fuel + 1 =>
                let smaller :
                    PsElabTermResult ->
                    List PsSyntaxTerm ->
                    List Nat ->
                    Except PsElabError PsElabApplicationResult :=
                  psElabApplyArgsWithFuelWorker elaborate fuel;
                fun (current : PsElabTermResult) =>
                  fun (arguments : List PsSyntaxTerm) =>
                    fun (pendingInstancesRev : List Nat) =>
                      let currentType :=
                        psWhnf
                          current.context.environment
                          current.context.metaContext
                          current.context.localContext
                          current.type;
                      match currentType with
                      | PsExpr.forallE _ domain body binder =>
                          if psBinderAcceptsExplicitArgument binder then
                            match arguments with
                            | [] =>
                                Except.ok {
                                  result := current
                                  pendingInstancesRev := pendingInstancesRev
                                }
                            | argument :: rest =>
                                match elaborate
                                    current.context
                                    argument
                                    (Option.some domain) with
                                | Except.error error => Except.error error
                                | Except.ok elaboratedArgument =>
                                    let nextTerm :=
                                      PsExpr.app
                                        current.term
                                        elaboratedArgument.term;
                                    let nextType :=
                                      psExprInstantiate1
                                        body
                                        elaboratedArgument.term;
                                    let nextResult : PsElabTermResult := {
                                      context := elaboratedArgument.context
                                      term := nextTerm
                                      type := nextType
                                    };
                                    smaller
                                      nextResult
                                      rest
                                      pendingInstancesRev
                          else if
                              psElabBoolAnd
                                (psBinderIsStrictImplicit binder)
                                (psSyntaxTermListIsEmpty arguments) then
                            Except.ok {
                              result := current
                              pendingInstancesRev := pendingInstancesRev
                            }
                          else
                            let kind :=
                              if psBinderIsInstanceImplicit binder then
                                PsMetaVarKind.synthetic
                              else
                                PsMetaVarKind.natural;
                            let fresh :=
                              psMetaFresh
                                current.context.metaContext
                                current.context.localContext
                                domain
                                kind;
                            let nextContext :=
                              psElabContextWithMeta
                                current.context
                                fresh.context;
                            let nextResult : PsElabTermResult := {
                              context := nextContext
                              term := PsExpr.app current.term fresh.expr
                              type := psExprInstantiate1 body fresh.expr
                            };
                            let nextPending :=
                              if psBinderIsInstanceImplicit binder then
                                match fresh.expr with
                                | PsExpr.mvar id =>
                                    List.cons id pendingInstancesRev
                                | _ => pendingInstancesRev
                              else
                                pendingInstancesRev;
                            smaller
                              nextResult
                              arguments
                              nextPending
                      | _ =>
                          if psSyntaxTermListIsEmpty arguments then
                            Except.ok {
                              result := current
                              pendingInstancesRev := pendingInstancesRev
                            }
                          else
                            Except.error
                              (PsElabError.infer PsInferError.expectedFunction)

          def psElabApplyArgsWithFuel
              (elaborate :
                PsElabContext ->
                PsSyntaxTerm ->
                Option PsExpr ->
                Except PsElabError PsElabTermResult)
              (remainingFuel : Nat)
              (current : PsElabTermResult)
              (arguments : List PsSyntaxTerm)
              (pendingInstancesRev : List Nat) :
              Except PsElabError PsElabApplicationResult :=
            psElabApplyArgsWithFuelWorker
              elaborate
              remainingFuel
              current
              arguments
              pendingInstancesRev
          '''
          path.write_text(source[:start] + replacement + source[end:])
      - name: Verify focused source gates
        working-directory: psc15selfhost
        run: |
          node scripts/check-elab-apply-args-option-selfhost-source-syntax.mjs
          node scripts/check-elab-apply-args-recursion-selfhost-source-syntax.mjs
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git add psc15selfhost/packages/elab/src/Ps/Elab/Term.lean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(psc2): normalize apply-args fuel recursion"
          git push origin HEAD:tmp/psc2-apply-args-recursion-worker-exec-20260930
