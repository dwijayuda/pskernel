name: Proposed Tractatus v1.2.0 PDF editions

on:
  push:
    branches:
      - editorial/tractatus-v1-2-proposed-saying-knowing-20261123
    paths:
      - 'research/mutual-acquaintance/editions/v1.2.0-proposed/*.md'
      - 'research/mutual-acquaintance/companion/Mathematical_Companion_v0.4_EN.md'
      - '.github/workflows/tractatus-v1.2.0-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-editions:
    name: Markdown + LaTeX to PDFs, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pandoc, XeLaTeX, fonts and PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/tractatus-ubuntu.list"
          printf '%s\n' \
            'deb https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb https://security.ubuntu.com/ubuntu noble-security main universe' > "$sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::Retries=2'
            -o 'Acquire::https::Timeout=25'
          )
          sudo apt-get "${apt_options[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-dejavu-core poppler-utils

      - name: Render exact Markdown + LaTeX sources
        shell: bash
        working-directory: research/mutual-acquaintance
        run: |
          set -euo pipefail
          edition="editions/v1.2.0-proposed"
          mkdir -p "$edition/pdf"
          for lang in ID EN LA; do
            src="$edition/Tractatus_de_Perceptione_et_Amore_${lang}.md"
            dest="$edition/pdf/Tractatus_de_Perceptione_et_Amore_v1.2.0_proposed_${lang}.pdf"
            pandoc "$src" -f markdown+tex_math_single_backslash --standalone \
              --pdf-engine=xelatex -V mainfont="DejaVu Serif" \
              -V papersize=a5 -V geometry:margin=16mm -V fontsize=10pt \
              -o "$dest"
          done
          pandoc "companion/Mathematical_Companion_v0.4_EN.md" \
            -f markdown+tex_math_single_backslash --standalone \
            --pdf-engine=xelatex -V mainfont="DejaVu Serif" \
            -V papersize=a4 -V geometry:margin=20mm -V fontsize=10pt \
            -o "$edition/pdf/Mathematical_Companion_v0.4_EN.pdf"

      - name: Verify PDF extraction and source provenance
        shell: bash
        working-directory: research/mutual-acquaintance
        run: |
          set -euo pipefail
          edition="editions/v1.2.0-proposed"
          python3 "$edition/check_proposed_edition.py"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          root = Path('editions/v1.2.0-proposed/pdf')
          assert len(list(root.glob('*.pdf'))) == 4, 'Expected four PDF editions'
          for lang in ('ID', 'EN', 'LA'):
              f = root / f'Tractatus_de_Perceptione_et_Amore_v1.2.0_proposed_{lang}.pdf'
              text = subprocess.check_output(['pdftotext', '-layout', str(f), '-'], text=True)
              for label in ('6.95', '6.96'):
                  assert re.search(r'(?<!\d)' + re.escape(label) + r'(?!\d)', text), (f, label)
              assert '7.' in text, (f, 'chapter 7')
              assert len(text) > 6000, (f, 'unexpectedly short')
              pages = subprocess.check_output(['pdfinfo', str(f)], text=True)
              assert re.search(r'Pages:\s*[1-9]\d*', pages), f
              print('PDF_EDITION_TEXT_OK', f)
          f = root / 'Mathematical_Companion_v0.4_EN.pdf'
          text = subprocess.check_output(['pdftotext', '-layout', str(f), '-'], text=True)
          for marker in ('MA-1', 'MA-8', 'MA-9', '126 propositions', '6.95', '6.96'):
              assert marker in text, (f, marker)
          assert len(text) > 7500
          print('PDF_COMPANION_MATH_OK', f)
          PY
          sha256sum \
            "$edition"/Tractatus_de_Perceptione_et_Amore_{ID,EN,LA}.md \
            companion/Mathematical_Companion_v0.4_EN.md \
            "$edition"/pdf/*.pdf > "$edition/PDF_SOURCE_RECEIPTS.sha256"
          sha256sum --check "$edition/PDF_SOURCE_RECEIPTS.sha256"
          echo "PDF_PROPOSED_SOURCE_RECEIPTS_OK"

      - name: Commit reproducible PDF snapshots to proposed editorial branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/editorial/tractatus-v1-2-proposed-saying-knowing-20261123'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mutual-acquaintance/editions/v1.2.0-proposed/pdf/*.pdf \
                  research/mutual-acquaintance/editions/v1.2.0-proposed/PDF_SOURCE_RECEIPTS.sha256
          if ! git diff --cached --quiet; then
            git commit -m "docs(tractatus): render proposed v1.2.0 and companion v0.4 PDFs [skip pdf]"
            git push origin "HEAD:editorial/tractatus-v1-2-proposed-saying-knowing-20261123"
          else
            echo "PDF outputs unchanged"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tractatus-v1.2.0-proposed-mathematical-v0.4-pdfs
          path: |
            research/mutual-acquaintance/editions/v1.2.0-proposed/pdf/*.pdf
            research/mutual-acquaintance/editions/v1.2.0-proposed/PDF_SOURCE_RECEIPTS.sha256
          if-no-files-found: warn
