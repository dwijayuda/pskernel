name: TS cached root 100015 baseline

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/ts-array-getelem-extract-aux]
    paths:
      - ".github/workflows/ts-root-100015-cached.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.34
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          lean_bin="$("$HOME/.elan/bin/elan" which lean)"
          echo "LEAN434_BIN=$(dirname "$lean_bin")" >> "$GITHUB_ENV"
          echo "$(dirname "$lean_bin")" >> "$GITHUB_PATH"
          test "$("$lean_bin" --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build TypeScript kernel
        run: |
          npm ci
          npm run build --silent
      - name: Replay Std root 100015 with production caches
        shell: bash
        env:
          PSKERNEL_BASE_ROOTS: "1"
          PSKERNEL_MIN_ROOTS: "1"
          PSKERNEL_WORKER_TIMEOUT_MS: "600000"
        run: |
          set -euo pipefail
          /usr/bin/time -f 'ts-root100015-elapsed=%e ts-root100015-maxrss-kb=%M' \
            node scripts/adaptive-root-oracle.mjs Std 114029 100015 1 1 1
