name: Verify Wasm3 runtime live replay

on:
  push:
    branches:
      - integrate/wasm3-runtime-live

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - name: Enforce portable source and neutral shared IR
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node check-psc1-source.mjs
          node scripts/check-ir-neutrality.mjs

      - name: Build complete Lean self-host workspace
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build

      - name: Run shared and backend regressions
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_ts_tests
          lake exe psc1_erasure_tests
          lake exe psc1_ir_specialize_tests
          lake exe psc1_backend_wasm_tests

      - name: Execute owned Wasm binary in Node
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_wasm_binary_smoke > /tmp/psc1-wasm-bytes.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const csv = readFileSync('/tmp/psc1-wasm-bytes.txt', 'utf8').trim();
          const bytes = Uint8Array.from(csv.split(',').map(Number));
          if (!WebAssembly.validate(bytes)) throw new Error('PSC1_WASM_VALIDATE_FAILED');
          const {instance} = await WebAssembly.instantiate(bytes);
          const e = instance.exports;
          const cases = [
            ['addU32', [20, 22], 42],
            ['addF32', [20.5, 21.5], 42],
            ['addThenOne', [20, 21], 42],
            ['selectU32', [1, 42, 7], 42],
            ['selectU32', [0, 42, 7], 7],
            ['letPlusOne', [41], 42],
            ['pointX', [42, 7], 42],
            ['smallSigned', [-123], -123],
            ['smallUnsigned', [65535], 65535],
            ['someValue', [42], 42],
            ['noneValue', [], 0],
            ['listLengthTwo', [], 2],
            ['applyReturnedAdder', [40, 2], 42],
            ['applyTwiceIncrement', [40], 42],
            ['genericBoxRoundTrip', [42], 42],
            ['genericIdU32', [42], 42],
            ['genericLengthTwo', [], 2],
            ['natAddLargeExact', [], 1],
            ['natSubFloorsAtZero', [], 1],
            ['natLiteralEqExact', [], 1],
            ['natAddOneOneExact', [], 1],
            ['natAddCarrySmallExact', [], 1],
            ['natAddCarryMidExact', [], 1],
            ['natAddCarryExact', [], 1],
            ['natMulOneExact', [], 1],
            ['natMulOddExact', [], 1],
            ['natMulExact', [], 1],
            ['natDivExact', [], 1],
            ['natModExact', [], 1],
            ['natDivZero', [], 1],
            ['natModZero', [], 1],
            ['natLtExact', [], 1],
            ['intOfNatExact', [], 1],
            ['intNegSuccExact', [], 1],
            ['intNegExact', [], 1],
            ['intAddMixedExact', [], 1],
            ['intSubMixedExact', [], 1],
            ['intMulSignedExact', [], 1],
            ['intLargeExact', [], 1],
            ['intLtExact', [], 1],
          ];
          for (const [name, args, expected] of cases) {
            const fn = e[name];
            if (typeof fn !== 'function') throw new Error(`PSC1_WASM_MISSING_EXPORT:${name}`);
            const actual = fn(...args);
            if (actual !== expected) throw new Error(`PSC1_WASM_BAD_RESULT:${name}:${actual}:${expected}`);
          }
          console.log('PSC1_WASM3_RUNTIME_LIVE_REPLAY: PASS');
          NODE
