name: WASM branch closure

on:
  push:
    branches: [feature/wasm-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Elaboration
        run: npm --workspace @proofscript/elab test
      - name: Erasure
        run: npm --workspace @proofscript/erasure test
      - name: Package integration
        run: npm run test:package-integration
      - name: TypeScript backend
        run: npm --workspace @proofscript/backend-ts test
      - name: WebAssembly backend
        run: npm run test:wasm
      - name: Root suite
        run: npm test
      - name: Workspace lock
        run: npm run check:workspace-lock
      - name: Source shape
        run: npm run check:source-shape
      - name: Architecture
        run: npm run check:architecture
