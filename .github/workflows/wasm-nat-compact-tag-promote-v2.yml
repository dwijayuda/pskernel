name: Promote compact Wasm Nat tag v2

on:
  push:
    branches:
      - backend/wasm3-runtime-core-tagged-nat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch runtime and permanent invariant
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runtime_path = Path('selfhost/packages/backend-wasm/src/Ps/BackendWasm/RuntimeNat.lean')
          text = runtime_path.read_text()

          if 'name := "constructorTag"' not in text:
              bit1_start = text.index('    {\n      name := psWasmNatBit1Name')
              divmod_start = text.index('    {\n      name := psWasmNatDivModName', bit1_start)
              block = '''    -- Wasm GC canonicalization is structural rather than nominal.
              -- Keep Bit1 structurally distinct from Bit0 so ref.test/ref.cast
              -- preserve Nat constructor identity after canonicalization.
              {
                name := psWasmNatBit1Name
                superType := some psWasmNatName
                isFinal := true
                fields := [
                  {
                    name := "half"
                    storageType := PsWasmStorageType.value psWasmNatRef
                  },
                  {
                    name := "constructorTag"
                    storageType := PsWasmStorageType.packedI8
                  }
                ]
              },
              '''
              text = text[:bit1_start] + block + text[divmod_start:]

          runtime_start = text.index('def psWasmNatRuntimeFunctions')
          literal_start = text.index('def psWasmNatLiteralInstructionsWithFuel')
          runtime = text[runtime_start:literal_start]

          bit1_start = runtime.index('    {\n      name := psWasmNatBit1Fn')
          succ_start = runtime.index('    {\n      name := psWasmNatSuccFn', bit1_start)
          bit1_fn = runtime[bit1_start:succ_start]
          if 'PsWasmInstruction.i32Const 1,' not in bit1_fn:
              lines = bit1_fn.splitlines()
              inserted = False
              out = []
              for line in lines:
                  if line.strip() == 'PsWasmInstruction.structNew psWasmNatBit1Name' and not inserted:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + 'PsWasmInstruction.i32Const 1,')
                      inserted = True
                  out.append(line)
              if not inserted:
                  raise SystemExit('Bit1 helper struct.new not found')
              bit1_fn = '\n'.join(out) + '\n'
              runtime = runtime[:bit1_start] + bit1_fn + runtime[succ_start:]

          succ_start = runtime.index('    {\n      name := psWasmNatSuccFn')
          cmp_start = runtime.index('    {\n      name := psWasmNatCmpFn', succ_start)
          succ = runtime[succ_start:cmp_start]
          direct = 'PsWasmInstruction.structNew psWasmNatBit1Name'
          if direct in succ:
              if succ.count(direct) != 2:
                  raise SystemExit(f'expected 2 direct Bit1 constructions in succ, found {succ.count(direct)}')
              succ = succ.replace(direct, 'PsWasmInstruction.call psWasmNatBit1Fn')
              runtime = runtime[:succ_start] + succ + runtime[cmp_start:]

          if runtime.count('PsWasmInstruction.structNew psWasmNatBit1Name') != 1:
              raise SystemExit('Bit1 construction must be centralized in psWasmNatBit1Fn')
          text = text[:runtime_start] + runtime + text[literal_start:]

          literal_def = text.index('def psWasmNatLiteralInstructionsWithFuel')
          body_start = text.index('      psWasmNatLiteralInstructionsWithFuel fuel half ++', literal_def)
          body_end = text.index('\n\ndef psWasmNatLiteralInstructions', body_start)
          tail = text[body_start:body_end]
          if 'PsWasmInstruction.call psWasmNatBit1Fn' not in tail:
              replacement = '''      psWasmNatLiteralInstructionsWithFuel fuel half ++
                (if low == 0 then
                  [PsWasmInstruction.structNew psWasmNatBit0Name]
                else
                  [PsWasmInstruction.call psWasmNatBit1Fn])'''
              text = text[:body_start] + replacement + text[body_end:]

          if text.count('name := "constructorTag"') != 1:
              raise SystemExit('expected one compact Nat constructor tag')
          if text.count('PsWasmInstruction.structNew psWasmNatBit1Name') != 1:
              raise SystemExit('unexpected direct Bit1 constructor')
          runtime_path.write_text(text)

          test_path = Path('selfhost/test/BackendWasmTests.lean')
          tests = test_path.read_text()
          test_name = 'psTestWasmNatConstructorIdentityInvariant'
          if test_name not in tests:
              marker = 'def main : IO Unit := do\n'
              definition = '''def psTestWasmNatConstructorIdentityInvariant : Bool :=
                match psWasmNatRuntimeStructures with
                | _ :: _ :: bit0 :: bit1 :: _ =>
                    bit0.name == psWasmNatBit0Name
                      && bit1.name == psWasmNatBit1Name
                      && bit0.fields.length == 1
                      && bit1.fields.length == 2
                | _ => false

              '''
              if marker not in tests:
                  raise SystemExit('BackendWasmTests main marker not found')
              tests = tests.replace(marker, definition + marker, 1)

          if '&& psTestWasmNatConstructorIdentityInvariant' not in tests:
              lines = tests.splitlines()
              for i, line in enumerate(lines):
                  if line.strip() == 'if psTestWasmScalarLowering':
                      indent = line[:len(line) - len(line.lstrip())] + '    '
                      lines.insert(i + 1, indent + '&& psTestWasmNatConstructorIdentityInvariant')
                      break
              else:
                  raise SystemExit('BackendWasmTests scalar gate line not found')
              tests = '\n'.join(lines) + '\n'
          test_path.write_text(tests)
          PY

          if git diff --quiet -- \
              selfhost/packages/backend-wasm/src/Ps/BackendWasm/RuntimeNat.lean \
              selfhost/test/BackendWasmTests.lean; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --check
            git diff -- \
              selfhost/packages/backend-wasm/src/Ps/BackendWasm/RuntimeNat.lean \
              selfhost/test/BackendWasmTests.lean
          fi

      - name: Verify portable source and neutral shared IR
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node check-psc1-source.mjs
          node scripts/check-ir-neutrality.mjs

      - name: Build complete Lean self-host workspace
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build

      - name: Run shared and Wasm regression suites
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_ts_tests
          lake exe psc1_erasure_tests
          lake exe psc1_ir_specialize_tests
          lake exe psc1_backend_wasm_tests

      - name: Execute owned Wasm binary in Node
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_wasm_binary_smoke > /tmp/psc1-wasm-bytes.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const csv=readFileSync('/tmp/psc1-wasm-bytes.txt','utf8').trim();
          const bytes=Uint8Array.from(csv.split(',').map(Number));
          if (!WebAssembly.validate(bytes)) throw new Error('PSC1_WASM_VALIDATE_FAILED');
          const {instance}=await WebAssembly.instantiate(bytes);
          const checks = [
            ['addU32', instance.exports.addU32(20,22), 42],
            ['recursiveAdt', instance.exports.listLengthTwo(), 2],
            ['closure', instance.exports.applyReturnedAdder(40,2), 42],
            ['genericList', instance.exports.genericLengthTwo(), 2],
            ['natAddLarge', instance.exports.natAddLargeExact(), 1],
            ['natSub', instance.exports.natSubFloorsAtZero(), 1],
            ['natLiteralEq', instance.exports.natLiteralEqExact(), 1],
            ['natAddOneOne', instance.exports.natAddOneOneExact(), 1],
            ['natAddCarrySmall', instance.exports.natAddCarrySmallExact(), 1],
            ['natAddCarryMid', instance.exports.natAddCarryMidExact(), 1],
            ['natAddCarry', instance.exports.natAddCarryExact(), 1],
            ['natMulOne', instance.exports.natMulOneExact(), 1],
            ['natMulOdd', instance.exports.natMulOddExact(), 1],
            ['natMul', instance.exports.natMulExact(), 1],
            ['natDiv', instance.exports.natDivExact(), 1],
            ['natMod', instance.exports.natModExact(), 1],
            ['natDivZero', instance.exports.natDivZero(), 1],
            ['natModZero', instance.exports.natModZero(), 1],
            ['natLt', instance.exports.natLtExact(), 1],
            ['intOfNat', instance.exports.intOfNatExact(), 1],
            ['intNegSucc', instance.exports.intNegSuccExact(), 1],
            ['intNeg', instance.exports.intNegExact(), 1],
            ['intAdd', instance.exports.intAddMixedExact(), 1],
            ['intSub', instance.exports.intSubMixedExact(), 1],
            ['intMul', instance.exports.intMulSignedExact(), 1],
            ['intLarge', instance.exports.intLargeExact(), 1],
            ['intLt', instance.exports.intLtExact(), 1],
          ];
          for (const [name, actual, expected] of checks) {
            if (actual !== expected) throw new Error(`PSC1_WASM_${name}: ${actual} !== ${expected}`);
          }
          console.log('PSC1_WASM_COMPACT_NAT_TAG: PASS');
          NODE

      - name: Commit verified compact Nat fix
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            selfhost/packages/backend-wasm/src/Ps/BackendWasm/RuntimeNat.lean \
            selfhost/test/BackendWasmTests.lean
          git commit -m 'fix(wasm): preserve Nat constructor identity'
          git push origin HEAD:backend/wasm3-runtime-core-tagged-nat
