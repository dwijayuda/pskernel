name: Wasm Nat Tagged Bit1 Diagnostic

on:
  push:
    branches:
      - debug/wasm3-nat-carry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make Bit1 structurally distinct with a packed discriminator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('selfhost/packages/backend-wasm/src/Ps/BackendWasm/RuntimeNat.lean')
          text = path.read_text()

          bit1_start = text.index('    {\n      name := psWasmNatBit1Name')
          divmod_start = text.index('    {\n      name := psWasmNatDivModName', bit1_start)
          bit1_block = '''    {
            name := psWasmNatBit1Name
            superType := some psWasmNatName
            isFinal := true
            fields := [
              {
                name := "half"
                storageType := PsWasmStorageType.value psWasmNatRef
              },
              {
                name := "constructorTag"
                storageType := PsWasmStorageType.packedI8
              }
            ]
          },
          '''
          text = text[:bit1_start] + bit1_block + text[divmod_start:]

          runtime_start = text.index('def psWasmNatRuntimeFunctions')
          literal_start = text.index('def psWasmNatLiteralInstructionsWithFuel')
          runtime = text[runtime_start:literal_start]

          bit1_fn_start = runtime.index('    {\n      name := psWasmNatBit1Fn')
          succ_start = runtime.index('    {\n      name := psWasmNatSuccFn', bit1_fn_start)
          bit1_fn = runtime[bit1_fn_start:succ_start]
          needle = '''        PsWasmInstruction.localGet 0,
                  PsWasmInstruction.structNew psWasmNatBit1Name'''
          if needle not in bit1_fn:
              raise SystemExit('Bit1 constructor helper body not found')
          bit1_fn = bit1_fn.replace(
              needle,
              '''        PsWasmInstruction.localGet 0,
                  PsWasmInstruction.i32Const 1,
                  PsWasmInstruction.structNew psWasmNatBit1Name''',
              1)
          runtime = runtime[:bit1_fn_start] + bit1_fn + runtime[succ_start:]

          succ_start = runtime.index('    {\n      name := psWasmNatSuccFn')
          cmp_start = runtime.index('    {\n      name := psWasmNatCmpFn', succ_start)
          succ = runtime[succ_start:cmp_start]
          direct = 'PsWasmInstruction.structNew psWasmNatBit1Name'
          if succ.count(direct) != 2:
              raise SystemExit(f'expected 2 direct Bit1 constructions in succ, found {succ.count(direct)}')
          succ = succ.replace(direct, 'PsWasmInstruction.call psWasmNatBit1Fn')
          runtime = runtime[:succ_start] + succ + runtime[cmp_start:]

          if runtime.count('PsWasmInstruction.structNew psWasmNatBit1Name') != 1:
              raise SystemExit('Bit1 construction was not centralized')
          text = text[:runtime_start] + runtime + text[literal_start:]

          literal_fn = text.index('def psWasmNatLiteralInstructionsWithFuel')
          literal_body = text.index('      psWasmNatLiteralInstructionsWithFuel fuel half ++', literal_fn)
          literal_end = text.index('\n\ndef psWasmNatLiteralInstructions', literal_body)
          replacement = '''      psWasmNatLiteralInstructionsWithFuel fuel half ++
                (if low == 0 then
                  [PsWasmInstruction.structNew psWasmNatBit0Name]
                else
                  [PsWasmInstruction.call psWasmNatBit1Fn])'''
          text = text[:literal_body] + replacement + text[literal_end:]
          path.write_text(text)
          PY

      - name: Inject constructor distinction probes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('selfhost/test/WasmBinarySmoke.lean')
          text = path.read_text()
          helper = text.index('def psWasmAddGcArrayTargetSmoke')
          marker = 'module.functions ++ ['
          pos = text.index(marker, helper) + len(marker)
          fns = '''
                {
                  name := "natBit1IsNotBit0Target"
                  typeName := none
                  parameters := []
                  results := [PsWasmValueType.i32]
                  locals := []
                  body := [
                    PsWasmInstruction.call psWasmNatZeroFn,
                    PsWasmInstruction.call psWasmNatBit1Fn,
                    PsWasmInstruction.refTest psWasmNatBit0Name,
                    PsWasmInstruction.i32Const 0,
                    PsWasmInstruction.i32Eq
                  ]
                },
                {
                  name := "natBit1IsBit1Target"
                  typeName := none
                  parameters := []
                  results := [PsWasmValueType.i32]
                  locals := []
                  body := [
                    PsWasmInstruction.call psWasmNatZeroFn,
                    PsWasmInstruction.call psWasmNatBit1Fn,
                    PsWasmInstruction.refTest psWasmNatBit1Name
                  ]
                },'''
          text = text[:pos] + fns + text[pos:]
          export_marker = 'module.exports ++ [("gcArray42", "gcArray42")]'
          replacement = '''module.exports ++ [
                ("gcArray42", "gcArray42"),
                ("natBit1IsNotBit0Target", "natBit1IsNotBit0Target"),
                ("natBit1IsBit1Target", "natBit1IsBit1Target")
              ]'''
          if export_marker not in text:
              raise SystemExit('export marker not found')
          path.write_text(text.replace(export_marker, replacement, 1))
          PY

      - name: Build Wasm binary smoke
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_wasm_binary_smoke > /tmp/psc1-wasm-bytes.txt

      - name: Execute full Nat and Int runtime regression
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const csv = readFileSync('/tmp/psc1-wasm-bytes.txt','utf8').trim();
          const bytes = Uint8Array.from(csv.split(',').map(Number));
          if (!WebAssembly.validate(bytes)) throw new Error('PSC1_WASM_VALIDATE_FAILED');
          const {instance} = await WebAssembly.instantiate(bytes);

          const boolChecks = [
            'natBit1IsNotBit0Target','natBit1IsBit1Target',
            'natAddLargeExact','natSubFloorsAtZero','natLiteralEqExact',
            'natAddOneOneExact','natAddCarrySmallExact','natAddCarryMidExact',
            'natAddCarryExact','natMulOneExact','natMulOddExact','natMulExact',
            'natDivExact','natModExact','natDivZero','natModZero','natLtExact',
            'intOfNatExact','intNegSuccExact','intNegExact','intAddMixedExact',
            'intSubMixedExact','intMulSignedExact','intLargeExact','intLtExact'
          ];
          const values = {};
          for (const name of boolChecks) {
            const value = instance.exports[name]();
            values[name] = value;
            if (value !== 1) throw new Error(`${name}=${value}`);
          }

          if (instance.exports.addU32(20,22) !== 42) throw new Error('addU32');
          if (instance.exports.listLengthTwo() !== 2) throw new Error('listLengthTwo');
          if (instance.exports.applyReturnedAdder(40,2) !== 42) throw new Error('applyReturnedAdder');
          if (instance.exports.genericLengthTwo() !== 2) throw new Error('genericLengthTwo');
          console.log('PSC1_WASM_COMPACT_TAGGED_BIT1_OK', JSON.stringify(values));
          NODE
