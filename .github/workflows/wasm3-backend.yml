name: Owned Wasm backend integration

on:
  workflow_dispatch:
  push:
    branches:
      - backend/wasm3-owned
      - integrate/wasm3-owned
      - backend/wasm3-gc-adts
      - backend/wasm3-closures
      - backend/wasm3-runtime-core
      - compiler-ir/generic-specialization
      - integrate/generic-specialization
      - integrate/wasm3-closures
      - integrate/wasm3-gc-adts
    paths:
      - selfhost/**
      - docs/selfhost/WASM3_BACKEND.md
      - docs/plans/07_SELF_HOSTING_FOUNDATION.md
      - .github/workflows/wasm3-backend.yml

permissions:
  contents: read

jobs:
  wasm3-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test "$(lean --githash)" = "293d5d0c0c3f3dded4688b3ccd6a33939ac5102b"

      - name: Enforce portable source and neutral shared IR
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          node check-psc1-source.mjs
          node scripts/check-ir-neutrality.mjs

      - name: Build complete Lean self-host workspace
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake build

      - name: Run TypeScript shared-IR regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_ts_tests

      - name: Run erasure shared-IR regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_erasure_tests

      - name: Run target-neutral generic specialization tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_ir_specialize_tests

      - name: Run owned Wasm backend tests
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_wasm_tests

      - name: Execute owned Wasm binary in Node
        shell: bash
        run: |
          set -euo pipefail
          cd selfhost
          lake exe psc1_backend_wasm_binary_smoke > /tmp/psc1-wasm-bytes.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const csv=readFileSync('/tmp/psc1-wasm-bytes.txt','utf8').trim();
          const bytes=Uint8Array.from(csv.split(',').map(Number));
          if (!WebAssembly.validate(bytes)) {
            throw new Error('PSC1_WASM_VALIDATE_FAILED');
          }
          const {instance}=await WebAssembly.instantiate(bytes);
          if (instance.exports.addU32(20, 22) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_U32_RESULT');
          }
          if (instance.exports.addF32(20.5, 21.5) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_F32_RESULT');
          }
          if (instance.exports.addThenOne(20, 21) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_DIRECT_CALL_RESULT');
          }
          if (instance.exports.selectU32(1, 42, 7) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_IF_TRUE_RESULT');
          }
          if (instance.exports.selectU32(0, 42, 7) !== 7) {
            throw new Error('PSC1_WASM_RUNTIME_IF_FALSE_RESULT');
          }
          if (instance.exports.letPlusOne(41) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_LET_RESULT');
          }
          if (instance.exports.pointX(42, 7) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_GC_STRUCT_RESULT');
          }
          if (instance.exports.smallSigned(-123) !== -123) {
            throw new Error('PSC1_WASM_RUNTIME_GC_PACKED_I16_RESULT');
          }
          if (instance.exports.smallUnsigned(65535) !== 65535) {
            throw new Error('PSC1_WASM_RUNTIME_GC_PACKED_U16_RESULT');
          }
          if (instance.exports.someValue(42) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_GC_INDUCTIVE_SOME_RESULT');
          }
          if (instance.exports.noneValue() !== 0) {
            throw new Error('PSC1_WASM_RUNTIME_GC_INDUCTIVE_NONE_RESULT');
          }
          if (instance.exports.listLengthTwo() !== 2) {
            throw new Error('PSC1_WASM_RUNTIME_GC_RECURSIVE_ADT_RESULT');
          }
          if (instance.exports.applyReturnedAdder(40, 2) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_CLOSURE_CAPTURE_RESULT');
          }
          if (instance.exports.applyTwiceIncrement(40) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_HIGHER_ORDER_CALL_REF_RESULT');
          }
          if (instance.exports.genericBoxRoundTrip(42) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_GENERIC_BOX_RESULT');
          }
          if (instance.exports.genericIdU32(42) !== 42) {
            throw new Error('PSC1_WASM_RUNTIME_GENERIC_FUNCTION_RESULT');
          }
          if (instance.exports.genericLengthTwo() !== 2) {
            throw new Error('PSC1_WASM_RUNTIME_GENERIC_RECURSIVE_ADT_RESULT');
          }
          if (instance.exports.natAddLargeExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_ADD_LARGE_RESULT');
          }
          if (instance.exports.natSubFloorsAtZero() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_SUB_RESULT');
          }
          if (instance.exports.natAddCarryExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_ADD_CARRY_RESULT');
          }
          if (instance.exports.natMulOneExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_MUL_ONE_RESULT');
          }
          if (instance.exports.natMulOddExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_MUL_ODD_RESULT');
          }
          if (instance.exports.natMulExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_MUL_RESULT');
          }
          if (instance.exports.natDivExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_DIV_RESULT');
          }
          if (instance.exports.natModExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_MOD_RESULT');
          }
          if (instance.exports.natDivZero() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_DIV_ZERO_RESULT');
          }
          if (instance.exports.natModZero() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_MOD_ZERO_RESULT');
          }
          if (instance.exports.natLtExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_NAT_COMPARE_RESULT');
          }
          if (instance.exports.intOfNatExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_OF_NAT_RESULT');
          }
          if (instance.exports.intNegSuccExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_NEG_SUCC_RESULT');
          }
          if (instance.exports.intNegExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_NEG_RESULT');
          }
          if (instance.exports.intAddMixedExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_ADD_RESULT');
          }
          if (instance.exports.intSubMixedExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_SUB_RESULT');
          }
          if (instance.exports.intMulSignedExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_MUL_RESULT');
          }
          if (instance.exports.intLargeExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_LARGE_RESULT');
          }
          if (instance.exports.intLtExact() !== 1) {
            throw new Error('PSC1_WASM_RUNTIME_INT_COMPARE_RESULT');
          }
          console.log('PSC1_WASM3_INTEGRATION: PASS');
          NODE
